    slices:
      - { id: nuclear-physics, title: 'Radioactivity and binding energy', branches: [nuclear-physics] }
      - { id: amount-and-atoms, title: 'Amount of substance and atomic structure', branches: [amount-of-substance, atomic-structure] }
