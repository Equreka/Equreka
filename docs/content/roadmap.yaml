      - { id: constants-equations-paths, title: 'Constants, the variable, equations and learning paths', branches: [si-system, geometry, modern-physics] }
    paths: []
  - id: 'W1.6'
    title: 'Legacy rewrite II: SI and SI-accepted units'
    milestone: 1
    slices:
      - { id: si-base-units, title: 'SI base units, gram and hand overrides, area and volume', branches: [si-system, mechanics] }
      - { id: si-derived-units, title: 'Named SI derived units', branches: [mechanics, electromagnetism, thermodynamics, optics-and-photometry] }
      - { id: compound-and-accepted-units, title: 'Compound SI units and units accepted for use with the SI', branches: [mechanics, thermodynamics, measurement] }
    paths: []
  - id: 'W1.7'
    title: 'Legacy rewrite III: customary and historical units, prefixes'
