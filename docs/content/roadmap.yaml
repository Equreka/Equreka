# Content roadmap: the single source of truth for planned slugs (docs/content/README.md).
# Parse only with the eemeli `yaml` package. Progress (done, draft/reviewed, Spanish
# completeness, word counts) is computed from packages/content/content by
# scripts/content/roadmap.mjs and never stored here. Structure is gated by
# scripts/quality/roadmap-check.mjs in `pnpm quality`.

waves:
  - id: 'W1.1'
    title: 'Taxonomy: categories and branches, English and Spanish'
    milestone: 1
    slices:
      - { id: mathematics, title: 'Mathematics category and branches', branches: [arithmetic, algebra, geometry, trigonometry] }
      - { id: physics, title: 'Physics category and branches', branches: [mechanics, gravitation, fluid-mechanics, waves-and-oscillations, thermodynamics, electromagnetism, optics-and-photometry, modern-physics, nuclear-physics] }
      - { id: chemistry-and-universal, title: 'Chemistry and universal categories and branches', branches: [amount-of-substance, atomic-structure, gases, solutions, thermochemistry, acids-and-bases, electrochemistry, si-system, measurement] }
    paths: []
  - id: 'W1.2'
    title: 'Prerequisites: mechanics, waves, mathematics and gravitation'
    milestone: 1
    slices:
      - { id: kinematics-and-angles, title: 'Kinematic and angular quantities, angle and speed units', branches: [mechanics, geometry, trigonometry, waves-and-oscillations] }
      - { id: dynamics, title: 'Dynamic quantities and force, momentum and density units', branches: [mechanics] }
      - { id: pressure-astronomy-constants, title: 'Pressure, astronomical and area units; mechanics and mathematical constants', branches: [fluid-mechanics, gravitation, mechanics, algebra, geometry, gases] }
    paths: []
  - id: 'W1.3'
    title: 'Prerequisites: thermodynamics, electromagnetism and optics'
    milestone: 1
    slices:
