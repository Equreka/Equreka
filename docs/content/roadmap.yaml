      - { id: electromagnetic-fields, title: 'Field quantities, units and vacuum constants', branches: [electromagnetism] }
      - { id: circuits-and-light, title: 'Conduction, energy-billing and photometric quantities and units', branches: [electromagnetism, optics-and-photometry, modern-physics] }
    paths: []
  - id: 'W1.4'
    title: 'Prerequisites: modern physics, nuclear physics and chemistry'
    milestone: 1
    slices:
      - { id: modern-and-nuclear, title: 'Radiation quantities, atomic units and particle constants', branches: [modern-physics, nuclear-physics, atomic-structure] }
      - { id: molar-quantities, title: 'Molar quantities, molar units and chemical constants', branches: [amount-of-substance, thermochemistry, electrochemistry, gases] }
      - { id: concentration, title: 'Concentration quantities and units, pH', branches: [solutions, acids-and-bases, arithmetic] }
    paths: []
  - id: 'W1.5'
    title: 'Legacy rewrite I: magnitudes, constants, variables, equations and paths'
    milestone: 1
    slices:
