description:
  en: >-
    Modern physics is the branch of physics that covers special relativity and quantum physics, the
    theories needed where classical physics fails: at speeds close to that of light and at the
    scale of atoms and electrons. It explains effects that mechanics and electromagnetism alone
    cannot, from the slowing of moving clocks to the sharp spectral lines of atoms.

    Special relativity rests on two postulates: the laws of physics are the same in every inertial
    frame, and light in vacuum travels at the same speed in every such frame, whatever the motion of
    its source. From them follow time
    dilation, length contraction, the Lorentz factor and mass–energy equivalence. Quantum physics
    starts from light exchanging energy in photons whose energy is the Planck constant times the
    frequency; it explains the photoelectric effect, the work function, the energy levels of atoms
    and the wave behaviour of electrons.

    Modern physics reduces to mechanics and electromagnetism at everyday speeds and sizes. It
    underlies nuclear physics, which applies relativity and quantum ideas to the atomic nucleus, and
    its picture of the atom is the basis of atomic structure in chemistry. The SI defines several
    units by fixing exact values of its constants, among them the speed of light, the Planck
    constant and the elementary charge.
