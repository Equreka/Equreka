# yaml-language-server: $schema=../../dist/schemas/branches.locale.schema.json
name: 'Aritmética y álgebra'
description: >-
  La aritmética estudia los números y las operaciones entre ellos; el álgebra generaliza esas
  operaciones con símbolos que representan cualquier número. La teoría de números, la aritmética
  superior, estudia qué números son racionales, irracionales o trascendentes, y qué enteros
  satisfacen una ecuación dada.
