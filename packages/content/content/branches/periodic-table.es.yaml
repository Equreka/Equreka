name: 'Tabla periódica'
description: >-
  La tabla periódica es la rama de la química que ordena los elementos químicos por su número
  atómico, el número de protones del núcleo, y los dispone de modo que los elementos de química
  parecida compartan columna. Cada entrada es un elemento, descrito por su símbolo, su peso atómico
  estándar, su configuración electrónica del estado fundamental y propiedades medidas como las
  energías de ionización, el punto de ebullición y la densidad.

  La disposición sigue el llenado de electrones del átomo. Las siete filas, los periodos, empiezan
  con una capa electrónica nueva y terminan en un gas noble, de capas completas. Las dieciocho
  columnas, los grupos, reúnen elementos con el mismo número de electrones de valencia: los grupos
  1 y 2 y el helio forman el bloque s, los grupos 13 a 18 el bloque p y los grupos 3 a 12 el bloque
  d. Dos filas de quince, los lantánidos del lantano al lutecio y los actínidos del actinio al
  lawrencio, van bajo el cuerpo principal en lugar de las casillas del grupo 3 de los periodos 6 y
  7, de modo que el grupo 3 solo contiene el escandio y el itrio. Qué miembros de las dos series
  continúan el grupo 3 sigue en discusión, y esta disposición no toma partido.

  La posición predice el comportamiento: a lo largo de un periodo la primera energía de ionización
  tiende a aumentar, y al bajar por un grupo tiende a disminuir. La rama se apoya en la estructura
  atómica, que explica las capas y subcapas de la disposición, y aporta los pesos atómicos que la
  cantidad de sustancia convierte en masas molares.
