# yaml-language-server: $schema=../../dist/schemas/branches.locale.schema.json
name: 'Óptica y fotometría'
description: >-
  La óptica estudia la luz y su interacción con la materia. La radiometría mide la radiación
  electromagnética como potencia; la fotometría pondera esa potencia según la sensibilidad espectral
  del ojo humano, razón por la cual la candela, el lumen y la eficacia luminosa existen junto al
  vatio.
