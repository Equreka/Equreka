name: 'Óptica y fotometría'
description: >-
  Óptica y fotometría, rama de la física, estudia la luz: cómo se propaga, se refleja, se refracta y
  forma imágenes, y cómo se mide. La óptica trata espejos, lentes, prismas y el comportamiento
  ondulatorio de la luz; la radiometría mide la radiación como potencia, y la fotometría pondera esa
  potencia según la sensibilidad espectral del ojo humano.

  La óptica geométrica trata la luz como rayos y usa la ley de la reflexión, el índice de
  refracción, la distancia focal y el aumento; la óptica ondulatoria explica interferencia,
  difracción y polarización mediante longitud de onda y frecuencia. En la medida, el flujo radiante,
  expresado en vatios, es la magnitud radiométrica, mientras que flujo luminoso, intensidad
  luminosa, iluminancia y luminancia son las fotométricas. La eficacia luminosa de la radiación
  monocromática a una frecuencia verde une ambas y fija la candela, unidad básica del SI de
  intensidad luminosa.

  La luz es una onda electromagnética, así que esta rama se apoya en el electromagnetismo y comparte
  sus ideas ondulatorias con ondas y oscilaciones. La imagen del fotón, en la que la luz transporta
  energía en cuantos fijados por la constante de Planck, pertenece a la física moderna. Sus
  aplicaciones incluyen cámaras, lentes correctivas, microscopios, telescopios, fibras ópticas y
  diseño de iluminación.
