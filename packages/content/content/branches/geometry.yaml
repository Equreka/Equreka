description:
  en: >-
    Geometry is the part of mathematics that studies figures in space: their shape, size and
    relative position, and the measurements that describe them, namely length, angle, area and
    volume. Plane geometry treats points, lines, polygons and circles; solid geometry treats prisms,
    cylinders, cones, pyramids and spheres; and analytic geometry, also called coordinate geometry,
    describes figures by coordinates and equations.

    Its central quantities are length, area, volume and plane angle, with solid angle for cones of
    directions in three dimensions. Mensuration formulas give the perimeter and area of rectangles,
    triangles, parallelograms, trapezoids, regular polygons, circles and ellipses, and the volume
    and surface area of solids. The Pythagorean theorem relates the sides of a right triangle and,
    written in coordinates, yields the distance between two points; the slope of a line and the
    equation of a circle carry the same approach into analytic geometry. The constant pi links the
    radius of a circle to its circumference and its area.

    Geometry shares its triangles with trigonometry, which computes unknown sides and angles from
    known ones, and its equations with algebra, which analytic geometry uses to settle geometric
    questions by calculation. Physics takes from it the language of position, displacement and
    direction, and the coherent units of area and volume are squares and cubes of units of length.
