description:
  en: >-
    Thermodynamics is the branch of physics that studies heat, work and temperature and how energy
    passes between bodies and changes form. It describes a system through a few measurable state
    variables, such as pressure, volume, temperature and internal energy, without tracking
    individual molecules.

    Its central quantities are thermodynamic temperature, heat, internal energy, heat capacity,
    specific heat capacity, specific latent heat and entropy. Its laws define temperature through
    thermal equilibrium, state that energy is conserved once heat and work are both counted, require
    that the entropy of an isolated system never decreases, and place absolute zero out of reach. At
    school level the branch also covers thermal expansion, heat transfer by conduction, convection
    and radiation, phase changes, the ideal gas law and the efficiency of heat engines, which the
    Carnot efficiency bounds.

    Thermodynamics connects to mechanics through work and energy and to fluid mechanics through the
    behaviour of gases. Kinetic theory explains pressure and temperature as averages over molecular
    motion, which ties the branch to chemistry and to the Boltzmann constant. Its laws govern
    engines, refrigerators, power plants and the energy balance of living organisms.
