description:
  en: >-
    Thermodynamics studies heat, work and temperature and how energy is transformed between them.
    Its laws define temperature through thermal equilibrium, state that energy is conserved,
    introduce entropy, which never decreases in an isolated system, and place absolute zero out of
    reach.
