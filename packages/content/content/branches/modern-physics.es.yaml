# yaml-language-server: $schema=../../dist/schemas/branches.locale.schema.json
name: 'Física moderna'
description: >-
  La física moderna agrupa las teorías del siglo XX: la relatividad especial, que enlaza el espacio,
  el tiempo, la masa y la energía a través de la velocidad de la luz, y la física cuántica, en la
  que la energía y el momento angular se presentan en cantidades discretas fijadas por la constante
  de Planck.
