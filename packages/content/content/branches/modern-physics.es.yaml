name: 'Física moderna'
description: >-
  La física moderna, rama de la física, abarca la relatividad especial y la física
  cuántica, teorías necesarias donde falla la física clásica: a velocidades cercanas a la de la luz
  y a la escala de átomos y electrones. Explica efectos que la mecánica y el electromagnetismo por
  sí solos no explican, desde el retraso de los relojes en movimiento hasta las líneas espectrales
  nítidas de los átomos.

  La relatividad especial parte de dos postulados: las leyes de la física son iguales en todo
  sistema inercial, y la luz se propaga en el vacío con la misma rapidez en cualquiera de ellos,
  sea cual sea el movimiento de su fuente. De ellos
  derivan dilatación del tiempo, contracción de la longitud, factor de Lorentz y equivalencia entre
  masa y energía. La física cuántica parte de que la luz intercambia energía en fotones, cuya
  energía es la constante de Planck por la frecuencia; explica efecto fotoeléctrico, función de
  trabajo, niveles de energía atómicos y comportamiento ondulatorio de los electrones.

  A velocidades y tamaños cotidianos se reduce a la mecánica y el electromagnetismo. Sustenta la
  física nuclear, que aplica relatividad y cuántica al núcleo atómico, y su imagen del átomo es la
  base de la estructura atómica en química. El SI define varias unidades fijando valores exactos de
  sus constantes, entre ellas la velocidad de la luz, la constante de Planck y la carga elemental.
