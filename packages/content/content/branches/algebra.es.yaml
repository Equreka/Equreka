name: 'Álgebra'
description: >-
  El álgebra es la parte de las matemáticas que representa los números con letras y otros
  símbolos para enunciar una regla válida para todo valor y hallar una incógnita a partir de las
  condiciones que cumple. El álgebra escolar, también llamada álgebra elemental, abarca las
  ecuaciones lineales y de segundo grado, los sistemas de ecuaciones, las funciones exponenciales y
  logarítmicas, y las sucesiones y series.

  Resolver una ecuación consiste en despejar la incógnita. Una ecuación lineal con una incógnita
  tiene una sola raíz, y una ecuación de segundo grado tiene como máximo dos raíces reales, que da
  la fórmula general de segundo grado y cuyo número indica el discriminante; las relaciones de
  Vieta ligan esas raíces con los coeficientes. La forma pendiente-ordenada en el origen escribe una
  recta como una ecuación con dos variables. El crecimiento exponencial multiplica una cantidad por
  un factor constante en pasos iguales, y el logaritmo lo invierte, convirtiendo un exponente
  desconocido en un valor calculable; el cambio de base pasa de una base a otra. Las progresiones
  aritméticas y geométricas suman una diferencia constante o aplican una razón constante de un
  término al siguiente, y sus sumas tienen forma cerrada.

  El álgebra generaliza la aritmética: un cálculo de porcentajes o de intereses se vuelve una
  fórmula al escribir sus cantidades como símbolos. La geometría analítica traduce las figuras en
  ecuaciones, la trigonometría se apoya en la manipulación algebraica para resolver triángulos, y
  toda fórmula de física y química se reordena con reglas algebraicas para despejar la magnitud
  buscada.
