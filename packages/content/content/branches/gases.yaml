description:
  en: >-
    Gases is the branch of chemistry that studies matter in the gaseous state, in which particles
    are far apart and move freely to fill any container. Four quantities fix the state of a gas
    sample: pressure, volume, thermodynamic temperature and amount of substance. The gas laws relate
    them, and the kinetic theory of gases explains those laws by the motion of the particles.

    Boyle's law, Charles's law, Gay-Lussac's law and Avogadro's law each hold two of the four
    quantities constant and relate the other two. The combined gas law joins the first three, and
    the ideal gas law joins all four through the molar gas constant; from it follow the molar
    volume of an ideal gas, the density of a gas and the masses in reactions that consume or
    release gases. Dalton's law of partial pressures adds the pressures of the gases in a mixture,
    each in proportion to its mole fraction, and Graham's law compares the rates at which two gases
    effuse. Pressure is stated in pascals, standard atmospheres or torr.

    Kinetic theory pictures a gas as particles in constant random motion whose average kinetic
    energy is proportional to the thermodynamic temperature. Real gases depart from ideal behaviour
    at high pressure and low temperature, which the compressibility factor and the van der Waals
    equation describe. The branch shares the ideal gas law and the work of expansion with
    thermodynamics in physics, and it counts gas with the mole of amount of substance.
