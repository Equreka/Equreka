description:
  en: >-
    Gravitation is the branch of physics that studies how masses attract one another: why objects
    fall, why planets, moons and satellites follow orbits, and why the weight of a body differs from
    one planet to another. At school level it rests on Newton's law of universal gravitation, in
    which the force between two masses grows with each mass and falls with the square of their
    separation.

    Its central quantities are mass, weight, the Newtonian constant of gravitation, gravitational
    field strength and gravitational potential energy. From them follow the free-fall acceleration
    near the surface of a planet, the orbital speed and orbital period of a satellite, escape
    velocity, and Kepler's laws of planetary motion, which describe elliptical orbits, equal areas
    swept in equal times and the link between the period of an orbit and its size.

    Gravitation grew out of mechanics and uses its tools: force, energy and circular motion. Tides
    connect it with fluid mechanics, and the energy of an orbit with the conservation laws of
    mechanics. Near very large masses, or where high precision is needed, Newton's law gives way to
    general relativity, in which gravity is the curvature of spacetime; the Newtonian description
    stays accurate for weak fields and slow motion.
