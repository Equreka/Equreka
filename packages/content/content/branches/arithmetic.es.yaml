name: 'Aritmética'
description: >-
  La aritmética es la parte de las matemáticas que calcula con números: suma, resta, multiplicación
  y división, junto con potencias, raíces, fracciones y decimales. Es la capa elemental sobre la que
  se construye el resto de las matemáticas, y sus aplicaciones cotidianas son los porcentajes, las
  razones y la proporcionalidad, y los intereses de préstamos y ahorros.

  Un porcentaje expresa una razón como un número de centésimas, lo que permite comparar variaciones,
  recargos y descuentos sea cual sea el tamaño de las cantidades. La proporcionalidad directa se da
  cuando dos cantidades mantienen una razón constante, y la inversa cuando su producto permanece
  fijo. El interés simple suma la misma cantidad en cada periodo, una fracción fija del capital; el
  interés compuesto se añade al capital y genera a su vez intereses, de modo que el saldo se
  multiplica por el mismo factor en cada periodo. La capitalización continua, el valor actual, las
  cuotas de un préstamo y las anualidades extienden el mismo razonamiento.

  La aritmética trabaja con números concretos, mientras que el álgebra escribe las mismas reglas
  con letras que representan cualquier número: un cálculo de interés compuesto se convierte en una
  ecuación algebraica en cuanto la tasa o el número de periodos es la incógnita. Las razones y la
  proporcionalidad sustentan también la conversión de unidades en la medición y las
  concentraciones de la química.
