name: 'Termoquímica'
description: >-
  La termoquímica, rama de la química, estudia el calor que se absorbe o se libera cuando las
  sustancias reaccionan, se disuelven o cambian de fase. A presión constante, ese calor es igual a
  la variación de entalpía: una variación negativa indica un proceso exotérmico, que desprende
  calor, y una positiva, un proceso endotérmico, que lo absorbe.

  La calorimetría mide estos calores a partir del cambio de temperatura de un calorímetro de
  capacidad calorífica conocida. La ley de Hess establece que la variación de entalpía de una
  reacción depende solo de sus estados inicial y final, y es la suma sobre cualquier secuencia de
  pasos; con las entalpías estándar de formación da la entalpía estándar de reacción sin medirla
  directamente. La energía de Gibbs combina entalpía, entropía y temperatura para decidir si una
  reacción ocurre por sí sola, y la temperatura a la que la variación de energía de Gibbs se anula
  marca dónde cambia ese resultado. La relación entre la energía de Gibbs y la constante de
  equilibrio vincula la energía con la composición en el equilibrio, y la ecuación de
  Clausius-Clapeyron y la ecuación de van 't Hoff siguen cómo varían con la temperatura la presión
  de vapor y las constantes de equilibrio. Los resultados se dan por mol, como energía molar y
  entropía molar.

  La termoquímica aplica el primer principio de la termodinámica, que trata la física, a los
  sistemas químicos. Usa la cantidad de sustancia para dar los calores por mol y aporta la energía
  de Gibbs que la electroquímica convierte en potencial de la celda.
