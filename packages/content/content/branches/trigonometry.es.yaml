name: 'Trigonometría'
description: >-
  La trigonometría es la parte de las matemáticas que relaciona los ángulos de un triángulo con las
  longitudes de sus lados. Sus herramientas son las funciones trigonométricas seno, coseno y
  tangente, definidas en un triángulo rectángulo como razones entre dos lados y extendidas a todo
  ángulo mediante la circunferencia unidad, junto con sus recíprocas y sus funciones inversas.

  En un triángulo rectángulo, el seno de un ángulo agudo es el cateto opuesto dividido entre la
  hipotenusa, el coseno es el cateto contiguo dividido entre la hipotenusa, y la tangente es el
  cateto opuesto dividido entre el contiguo. En cualquier triángulo plano los tres ángulos suman un
  ángulo llano, el teorema del seno vincula cada lado con el seno del ángulo opuesto, y el teorema
  del coseno extiende el teorema de Pitágoras a triángulos sin ángulo recto. Dos lados y el ángulo
  que forman dan también el área del triángulo. Los ángulos se miden en radianes, la unidad
  coherente del SI, en la que una vuelta completa mide dos pi, o en grados.

  La trigonometría comparte sus figuras con la geometría, pero convierte las relaciones
  geométricas en cálculo: una altura inaccesible se obtiene a partir de un ángulo de elevación
  medido y una distancia horizontal, razón por la cual la topografía y la navegación dependen de
  ella. Sus funciones periódicas describen las oscilaciones y las ondas en física y descomponen
  fuerzas y velocidades en componentes en mecánica, y el álgebra de las identidades entre ellas
  sirve para simplificar esas expresiones.
