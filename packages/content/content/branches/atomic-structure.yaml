description:
  en: >-
    Atomic structure describes the atom as a nucleus of protons and neutrons surrounded by electrons
    in quantized energy levels. The elementary charge sets the charge of the proton and the
    electron; transitions between levels emit and absorb radiation at sharply defined frequencies.
