description:
  en: >-
    Atomic structure is the branch of chemistry that describes what atoms are made of and how their
    parts are arranged. A small, dense nucleus holds positively charged protons and neutral
    neutrons, and negatively charged electrons occupy the far larger space around it. The atomic
    number, the count of protons, identifies the element; the mass number adds the neutrons; and
    isotopes are atoms of one element that differ in neutron count.

    Its quantities are the masses and charges of these particles: the electron mass, the proton
    mass and the neutron mass, and the elementary charge, carried by the proton and, with opposite
    sign, by the electron. Atomic masses are quoted in daltons, one twelfth of the mass of one
    carbon-12 atom, and the average atomic mass of an element weights its isotopes by their natural
    abundance. Electrons occupy quantized energy levels. The hydrogen-like energy levels, scaled by
    the Rydberg constant and the Bohr radius, explain why atoms absorb and emit light only at
    particular wavelengths, and the effective nuclear charge measures how inner electrons shield
    outer ones from the nucleus.

    Atomic structure explains the periodic table and chemical bonding, because the outermost
    electrons decide how an element reacts, and it supplies the particle masses on which amount of
    substance builds. It overlaps with modern physics, which treats the same energy levels and
    spectra with quantum mechanics, and with nuclear physics, which studies the nucleus itself.
