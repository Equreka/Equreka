name: 'Electromagnetismo'
description: >-
  El electromagnetismo, rama de la física, estudia la carga eléctrica, los campos eléctrico
  y magnético que producen cargas y corrientes, y las fuerzas que ejercen esos campos. Abarca
  electrostática, corriente eléctrica y circuitos, magnetismo, inducción electromagnética y ondas
  electromagnéticas, entre ellas la luz.

  Sus magnitudes centrales son carga eléctrica, corriente eléctrica, potencial eléctrico,
  diferencia de potencial, fuerza electromotriz, resistencia eléctrica, capacidad eléctrica, flujo
  magnético y potencia. La ley de Coulomb da la fuerza entre dos cargas; la ley de Ohm relaciona
  tensión, corriente y resistencia en un conductor; la ley de Faraday establece que un flujo
  magnético variable induce una fuerza electromotriz, principio de generadores y transformadores.
  Las ecuaciones de Maxwell reúnen estos resultados en una sola teoría y predicen ondas
  electromagnéticas que viajan a la velocidad de la luz.

  Toma de la mecánica la fuerza, la energía y la potencia, y sus ondas son el objeto de la óptica y
  fotometría. La carga elemental lo une con la física moderna y con la estructura atómica en
  química, donde las fuerzas eléctricas mantienen unidos átomos y moléculas. Circuitos, motores,
  radio y todo dispositivo electrónico se basan en sus leyes.
