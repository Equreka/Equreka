name: 'Electromagnetismo'
description: >-
  El electromagnetismo estudia la carga eléctrica, los campos eléctrico y magnético que produce y
  las corrientes que circulan por los circuitos. Las ecuaciones de Maxwell unifican la electricidad,
  el magnetismo y la luz; la tensión, la corriente, la resistencia y la capacitancia son las
  magnitudes de trabajo de todo circuito.
