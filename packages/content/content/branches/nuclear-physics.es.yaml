name: 'Física nuclear'
description: >-
  La física nuclear, rama de la física, estudia el núcleo atómico: su composición de protones y
  neutrones, las fuerzas que los unen y las formas en que cambian los núcleos inestables. Abarca
  radiactividad, reacciones nucleares, fisión y fusión, y la radiación ionizante que emiten estos
  procesos.

  Sus magnitudes centrales son número másico y número atómico, energía de enlace y defecto de masa,
  constante de desintegración, semivida, también llamada periodo de semidesintegración, y actividad,
  y dosis absorbida y dosis equivalente. Los núcleos inestables se desintegran principalmente por
  emisión alfa, beta o gamma, y el número de núcleos sin desintegrar disminuye exponencialmente,
  reduciéndose a la mitad en cada semivida. La equivalencia entre masa y energía convierte el
  defecto de masa en energía de enlace y explica por qué dividir núcleos pesados o fusionar núcleos
  ligeros libera energía, fuente de los reactores nucleares y de la luz del Sol y las demás
  estrellas.

  Aplica la relatividad y la física cuántica de la física moderna al núcleo y comparte su imagen del
  átomo con la estructura atómica en química. El electromagnetismo describe la repulsión entre
  protones que vence la fuerza nuclear fuerte. Sus aplicaciones incluyen datación radiométrica,
  diagnóstico por imagen, radioterapia, protección radiológica y energía nuclear.
