description:
  en: >-
    Nuclear physics is the branch of physics that studies atomic nuclei: their make-up of protons
    and neutrons, the forces that bind them, and the ways unstable nuclei change. It covers
    radioactivity, nuclear reactions, fission and fusion, and the ionizing radiation these processes
    emit.

    Its central quantities are the mass number and atomic number, binding energy and mass defect,
    the decay constant, half-life and activity, and the absorbed and equivalent doses of radiation.
    Unstable nuclei decay chiefly by alpha, beta or gamma emission, and the number of undecayed
    nuclei falls exponentially, halving once every half-life. Mass–energy equivalence turns the mass
    defect into binding energy and explains why splitting heavy nuclei or fusing light ones releases
    energy, the source of nuclear reactors and of the light of the Sun and other stars.

    Nuclear physics applies relativity and quantum physics from modern physics to the nucleus and
    shares its picture of the atom with atomic structure in chemistry. Electromagnetism describes
    the repulsion between protons that the strong nuclear force overcomes. Applications include
    radiometric dating, medical imaging, radiotherapy, radiation protection and nuclear power.
