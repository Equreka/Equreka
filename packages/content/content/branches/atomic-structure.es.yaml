name: 'Estructura atómica'
description: >-
  La estructura atómica, rama de la química, describe de qué están hechos los átomos y
  cómo se disponen sus partes. Un núcleo pequeño y denso contiene protones, con carga positiva, y
  neutrones, sin carga, y los electrones, con carga negativa, ocupan el espacio mucho mayor que lo
  rodea. El número atómico, el número de protones, identifica el elemento; el número másico suma
  los neutrones, y los isótopos son átomos de un elemento con distinto número de neutrones.

  Sus magnitudes son las masas y cargas de estas partículas: la masa del electrón, la masa del
  protón y la masa del neutrón, y la carga elemental, que lleva el protón y, con signo opuesto, el
  electrón. Las masas atómicas se dan en daltons; un dalton es un doceavo de la masa de un átomo de
  carbono 12, y la masa atómica media de un elemento pondera sus isótopos por su abundancia
  natural. Los electrones ocupan niveles de energía cuantizados. Los niveles de energía
  hidrogenoides, escalados por la constante de Rydberg y el radio de Bohr, explican por qué los
  átomos absorben y emiten luz solo a ciertas longitudes de onda, y la carga nuclear efectiva mide
  cuánto apantallan los electrones internos a los externos.

  La estructura atómica explica la tabla periódica y el enlace químico, porque los electrones más
  externos deciden cómo reacciona un elemento, y aporta las masas de partículas en que se basa la
  cantidad de sustancia. Se solapa con la física moderna, que trata los mismos niveles y espectros
  con la mecánica cuántica, y con la física nuclear, que estudia el propio núcleo.
