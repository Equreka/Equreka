# yaml-language-server: $schema=../../dist/schemas/branches.locale.schema.json
name: 'Estructura atómica'
description: >-
  La estructura atómica describe el átomo como un núcleo de protones y neutrones rodeado de
  electrones en niveles de energía cuantizados. La carga elemental fija la carga del protón y del
  electrón; las transiciones entre niveles emiten y absorben radiación a frecuencias muy precisas.
