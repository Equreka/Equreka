name: 'Cinética química'
description: >-
  La cinética química, rama de la química, estudia la rapidez con que transcurren las reacciones
  químicas y los pasos por los que los reactivos se transforman en productos. Mientras la
  termoquímica se pregunta si una reacción puede ocurrir y cuánta energía intercambia, la cinética se
  pregunta cuánto tarda, y las dos respuestas son independientes: una reacción con una variación de
  energía de Gibbs muy negativa puede ser demasiado lenta para notarse.

  Su magnitud central es la velocidad de reacción, la variación de la concentración de un reactivo o
  de un producto por unidad de tiempo dividida entre su coeficiente estequiométrico. La velocidad
  media en un intervalo se obtiene de dos concentraciones medidas; la velocidad instantánea es la
  pendiente de la curva de concentración en un instante, y la velocidad inicial es esa pendiente al
  comienzo. Las velocidades se expresan en moles por metro cúbico y segundo o, con más frecuencia,
  en moles por litro y segundo. Una ley de velocidad vincula la velocidad con las
  concentraciones mediante una constante de velocidad y los órdenes de reacción, la energía de
  activación mide cuánto aumenta la velocidad con la temperatura, y un catalizador acelera una
  reacción al ofrecer un camino de menor energía de activación.

  Se apoya en la cantidad de sustancia y expresa la composición mediante las concentraciones de las
  disoluciones y las presiones de los gases. Se encuentra con el equilibrio allí donde las
  velocidades directa e inversa se igualan, y su ley de velocidad de primer orden tiene la misma
  forma exponencial que la desintegración radiactiva.
