description:
  en: >-
    Waves and oscillations is the branch of physics that studies periodic motion and how it spreads
    through space: a mass on a spring, a swinging pendulum, a vibrating string, sound in air and
    ripples on water. An oscillation repeats in time at one place; a wave carries that disturbance
    from place to place, transporting energy without transporting the medium.

    Its central quantities are period, frequency, angular frequency, amplitude, wavelength and wave
    speed; for any travelling wave the speed equals the frequency times the wavelength. Simple
    harmonic motion, where a force opposing the displacement grows in proportion to it, models small
    oscillations. Waves are mainly transverse or longitudinal, and where they overlap they interfere,
    giving standing waves, harmonics, beats and resonance. Sound adds intensity, sound intensity
    level in decibels and the Doppler effect.

    The branch builds on mechanics, which supplies force, energy and the spring constant, and on
    fluid mechanics for sound and water waves. Light is an electromagnetic wave, so the same ideas
    return in electromagnetism and in optics and photometry, and the wave behaviour of matter is one
    of the starting points of quantum physics in modern physics.
