description:
  en: >-
    Acids and bases is the branch of chemistry that studies reactions in which a hydrogen ion passes
    from one species to another. An acid donates a hydrogen ion and a base accepts one. In water,
    acids raise the concentration of hydronium ions and bases raise that of hydroxide ions, and when
    an acid reacts with a base the process is called neutralization.

    The pH, the negative base-10 logarithm of the hydronium ion concentration, measures acidity on a
    compact scale, and the pOH does the same for hydroxide ions. The ion product of water links the
    two, so that at $25\,^{\circ}\mathrm{C}$ their sum is 14 and a neutral solution has a pH of 7,
    an acidic one less and a basic one more. The strength of a weak acid is given by its acid
    dissociation constant or its pKa, which set the pH of its solution and its percent ionization,
    and the Ka-Kb relation connects an acid with its conjugate base. Buffer solutions resist changes
    in pH, and the Henderson-Hasselbalch equation gives their pH from the ratio of base to acid. A
    titration finds an unknown concentration by neutralizing it with a solution of known
    concentration.

    The branch rests on solutions and concentration, since every acid-base quantity is a
    concentration or its logarithm, and on the idea of chemical equilibrium, because ionization is
    reversible. Its logarithmic scales come from algebra, and hydrogen ions reappear in
    electrochemistry wherever they take part in a half-reaction.
