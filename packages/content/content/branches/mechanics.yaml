description:
  en: >-
    Mechanics studies motion and the forces that cause it. Kinematics describes position, velocity
    and acceleration; dynamics relates them to forces and mass through Newton's laws; statics treats
    bodies in equilibrium. Length, mass and time are its base quantities, and energy, work and power
    follow from them.
