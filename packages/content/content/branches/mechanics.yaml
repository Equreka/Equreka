description:
  en: >-
    Mechanics is the branch of physics that studies how bodies move and why: the motion of objects
    and the forces and energy exchanges that change it. Kinematics describes motion through
    position, displacement, speed, velocity and acceleration without asking for causes; dynamics
    links motion to force and mass through Newton's laws; statics treats bodies at rest or in
    equilibrium.

    Its base quantities are length, mass and time, and from them follow force, weight, work, energy,
    power, momentum and angular momentum. Conservation of energy and of momentum solves many problems
    without tracing every force, from a block sliding down an inclined plane to a collision between
    two carts. Rotation adds torque, moment of inertia and angular velocity, the rotational
    counterparts of force, mass and velocity.

    Mechanics is the starting point for most of physics. Gravitation applies its laws to the
    attraction between masses and to orbits; fluid mechanics extends them to liquids and gases;
    waves and oscillations treat the periodic motion of springs and pendulums; thermodynamics
    connects mechanical work with heat. At speeds approaching the speed of light special relativity
    corrects its predictions, and at atomic scales quantum physics replaces it; both belong to
    modern physics.
