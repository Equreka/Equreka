description:
  en: >-
    Arithmetic is the part of mathematics that computes with numbers: addition, subtraction,
    multiplication and division, together with powers, roots, fractions and decimals. It is the
    elementary layer on which the rest of mathematics is built, and its everyday applications are
    percentages, ratios and proportion, and the interest charged on loans and paid on savings.

    A percentage expresses a ratio as a number of hundredths, which makes changes, markups and
    discounts comparable whatever the size of the amounts involved. Direct proportion holds when
    two quantities keep a constant ratio, and inverse proportion when their product stays fixed.
    Simple interest adds the same amount in every period, a fixed fraction of the principal;
    compound interest is added to the principal and then earns interest itself, so the balance is
    multiplied by the same factor each period. Continuous compounding, present value, loan payments
    and annuities extend the same reasoning.

    Arithmetic works with particular numbers, while algebra writes the same rules with letters that
    stand for any number: a compound interest calculation becomes an algebraic equation as soon as
    the rate or the number of periods is the unknown. Ratio and proportion also underlie unit
    conversion in measurement and the concentrations of chemistry.
