description:
  en: >-
    Arithmetic studies numbers and the operations on them; algebra generalizes those operations with
    symbols that stand for any number. Number theory, the higher arithmetic, asks which numbers are
    rational, irrational or transcendental, and which integers satisfy a given equation.
