name: 'Mecánica'
description: >-
  La mecánica, rama de la física, estudia cómo y por qué se mueven los cuerpos: las
  fuerzas e intercambios de energía que alteran su movimiento. La cinemática
  describe el movimiento con posición, desplazamiento, rapidez, velocidad y aceleración, sin
  preguntar por sus causas; la dinámica lo vincula a fuerza y masa mediante las leyes de
  Newton; la estática trata cuerpos en reposo o en equilibrio.

  Sus magnitudes base son longitud, masa y tiempo, de las que derivan fuerza, peso, trabajo,
  energía, potencia, cantidad de movimiento y momento angular. La conservación de la energía y de
  la cantidad de movimiento resuelve muchos problemas sin seguir cada fuerza, desde un bloque que
  baja por un plano inclinado hasta el choque de dos carritos. La rotación añade momento de una
  fuerza, momento de inercia y velocidad angular, análogos de fuerza, masa y velocidad.

  Es el punto de partida de casi toda la física. La gravitación aplica sus leyes a la
  atracción entre masas y a las órbitas; la mecánica de fluidos las extiende a líquidos y gases;
  ondas y oscilaciones tratan el movimiento periódico de resortes y péndulos; la termodinámica
  une trabajo mecánico y calor. Cerca de la velocidad de la luz, la relatividad especial corrige
  sus predicciones, y a escala atómica la física cuántica la sustituye; ambas pertenecen a la
  física moderna.
