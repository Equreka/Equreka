# yaml-language-server: $schema=../../dist/schemas/branches.locale.schema.json
name: 'Mecánica'
description: >-
  La mecánica estudia el movimiento y las fuerzas que lo producen. La cinemática describe la
  posición, la velocidad y la aceleración; la dinámica las relaciona con las fuerzas y la masa
  mediante las leyes de Newton; la estática trata los cuerpos en equilibrio. Sus magnitudes base son
  la longitud, la masa y el tiempo, y de ellas se derivan la energía, el trabajo y la potencia.
