description:
  en: >-
    Optics and photometry is the branch of physics that studies light: how it travels, reflects,
    refracts and forms images, and how its strength is measured. Optics covers mirrors, lenses,
    prisms and the wave behaviour of light; radiometry measures radiation as power, and photometry
    weights that power by the spectral sensitivity of the human eye.

    Geometrical optics treats light as rays and works with the law of reflection, refractive index,
    focal length and magnification; wave optics explains interference, diffraction and polarization
    through wavelength and frequency. On the measurement side, radiant flux is the radiometric
    quantity, expressed in watts, while luminous flux, luminous intensity, illuminance and luminance
    are the photometric ones. The luminous efficacy of monochromatic radiation at one green
    frequency links the two and fixes the candela, the SI base unit of luminous intensity.

    Light is an electromagnetic wave, so the branch builds on electromagnetism and shares its wave
    ideas with waves and oscillations. The photon picture, in which light carries energy in quanta
    set by the Planck constant, belongs to modern physics. Applications include cameras,
    corrective lenses, microscopes, telescopes, optical fibres and lighting design.
