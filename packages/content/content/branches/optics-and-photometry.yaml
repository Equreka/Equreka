description:
  en: >-
    Optics studies light and its interaction with matter. Radiometry measures electromagnetic
    radiation as power; photometry weights that power by the spectral sensitivity of the human eye,
    which is why the candela, the lumen and luminous efficacy exist alongside the watt.
