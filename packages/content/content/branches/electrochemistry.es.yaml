name: 'Electroquímica'
description: >-
  La electroquímica, rama de la química, relaciona las reacciones químicas con la
  electricidad. Sus reacciones son reacciones redox, en las que los electrones pasan de una
  especie que se oxida a otra que se reduce. Una celda galvánica permite que una reacción redox
  espontánea impulse una corriente por un circuito externo, y una celda electrolítica usa una
  corriente aplicada para forzar una reacción que no ocurriría por sí sola.

  El potencial estándar de la celda se obtiene de los potenciales estándar de electrodo de las dos
  semirreacciones, y un valor positivo indica una reacción espontánea. La constante de Faraday, la
  carga de un mol de electrones, convierte entre carga y cantidad de sustancia: la ley de Faraday
  de la electrólisis da la masa depositada por una corriente durante un tiempo dado, y la energía
  de Gibbs de una reacción es menos el número de electrones transferidos por la constante de
  Faraday por el potencial de la celda. El mismo vínculo convierte un potencial estándar en una
  constante de equilibrio. La ecuación de Nernst corrige el potencial de la celda para
  concentraciones distintas de las estándar, y adopta una forma abreviada a $25\,^{\circ}\mathrm{C}$.

  La electroquímica une la termoquímica, mediante la energía de Gibbs, con el electromagnetismo,
  mediante la carga, la corriente y la diferencia de potencial. Explica las baterías, las celdas de
  combustible, la corrosión, la galvanoplastia y la obtención de metales por electrólisis, y las
  semirreacciones con iones hidrógeno la conectan con ácidos y bases.
