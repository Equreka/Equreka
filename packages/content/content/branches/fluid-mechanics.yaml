description:
  en: >-
    Fluid mechanics is the branch of physics that studies liquids and gases, at rest and in motion,
    and the forces they exert on surfaces and on immersed bodies. Fluid statics, or hydrostatics,
    covers pressure, buoyancy and floating; fluid dynamics covers flow through pipes, around wings
    and in the atmosphere and oceans.

    Its central quantities are density, pressure, buoyant force, volumetric flow rate and dynamic
    viscosity. Pressure in a liquid at rest grows with depth. Pascal's principle states that a
    pressure change applied to an enclosed fluid reaches every part of it, which lets hydraulic
    presses and brakes multiply force, and Archimedes' principle sets the buoyant force equal to the
    weight of the displaced fluid. For moving fluids, the continuity equation conserves mass along a
    pipe, and Bernoulli's equation trades pressure against speed and height along a streamline of a
    steady, incompressible flow without viscosity.

    Fluid mechanics extends the laws of mechanics from point masses to continuous media. It meets
    thermodynamics in the behaviour of gases, waves and oscillations in sound and water waves, and
    gravitation in tides and atmospheric pressure. It underlies hydraulics, aerodynamics, weather
    forecasting and the study of blood flow.
