description:
  en: >-
    Solutions and concentration is the branch of chemistry that studies solutions, homogeneous
    mixtures in which a solute is dispersed through a solvent, and the ways of stating how much
    solute they contain. Concentration is its central idea, and several measures of it coexist
    because each suits a different task in the laboratory.

    Molarity, the amount concentration, gives moles of solute per litre of solution, and mass
    concentration gives grams per litre. Molality gives moles of solute per kilogram of solvent
    and, unlike molarity, does not change with temperature. Mass percent, mole fraction and parts
    per million state the composition as a ratio. The dilution equation keeps the amount of solute
    fixed while solvent is added, so the concentration falls as the volume grows. Colligative
    properties depend on how many solute particles are dissolved, not on what they are: boiling
    point elevation, freezing point depression, osmotic pressure and the lowering of vapour pressure
    that Raoult's law describes. Henry's law makes the solubility of a gas proportional to its
    partial pressure above the liquid.

    The branch builds on amount of substance, since every concentration counts solute in moles or
    grams, and it prepares acids and bases and electrochemistry, whose equilibria and cell
    potentials are written in terms of concentrations. Raoult's law and Henry's law tie it to gases
    through partial pressure, and osmotic pressure has the same form as the ideal gas law.
