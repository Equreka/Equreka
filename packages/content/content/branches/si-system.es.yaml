# yaml-language-server: $schema=../../dist/schemas/branches.locale.schema.json
name: 'Sistema Internacional de Unidades'
description: >-
  El Sistema Internacional de Unidades (SI) es el sistema métrico moderno. Desde 2019 se define
  fijando los valores numéricos de siete constantes definitorias; de ellas se derivan las siete
  unidades base, sus unidades derivadas coherentes y los prefijos decimales que escalan cualquiera
  de ellas.
