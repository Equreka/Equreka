# yaml-language-server: $schema=../../dist/schemas/branches.locale.schema.json
name: 'Cantidad de sustancia'
description: >-
  La cantidad de sustancia cuenta entidades (átomos, moléculas, iones) en unidades de mol, una de
  las siete magnitudes base del SI. Mediante la constante de Avogadro enlaza las masas que se pesan
  en el laboratorio con el número de partículas que participan en una reacción, la base de la
  estequiometría.
