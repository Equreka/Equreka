name: 'Geometría'
description: >-
  La geometría es la parte de las matemáticas que estudia las figuras en el espacio: su forma, su
  tamaño, su posición relativa y sus medidas, como la longitud, el ángulo, el área y el volumen. La
  geometría plana trata puntos, rectas, polígonos y circunferencias; la geometría del espacio,
  prismas, cilindros, conos, pirámides y esferas; y la geometría analítica describe las figuras
  mediante coordenadas y ecuaciones.

  Sus magnitudes centrales son la longitud, el área, el volumen y el ángulo plano, más el ángulo
  sólido para conos de direcciones en el espacio. Las fórmulas de medida dan el perímetro y el área
  de rectángulos, triángulos, paralelogramos, trapecios, polígonos regulares, círculos y elipses, y
  el volumen y el área total de los sólidos. El teorema de Pitágoras relaciona los lados de un
  triángulo rectángulo y, escrito en coordenadas, da la distancia entre dos puntos; la pendiente de
  una recta y la ecuación de la circunferencia llevan el mismo enfoque a la geometría analítica. La
  constante pi vincula el radio con la longitud de la circunferencia y el área del círculo.

  La geometría comparte sus triángulos con la trigonometría, que calcula lados y ángulos
  desconocidos a partir de los conocidos, y sus ecuaciones con el álgebra, que la geometría
  analítica usa para resolver cuestiones geométricas mediante cálculo. La física toma de ella el
  lenguaje de la posición, el desplazamiento y la dirección, y las unidades coherentes de área y de
  volumen son cuadrados y cubos de unidades de longitud.
