# yaml-language-server: $schema=../../dist/schemas/branches.locale.schema.json
name: 'Geometría'
description: >-
  La geometría estudia la forma, el tamaño y la posición relativa de las figuras en el espacio:
  longitudes, ángulos, áreas y volúmenes. La trigonometría, que relaciona los ángulos de un
  triángulo con las razones entre sus lados, es su rama de cálculo.
