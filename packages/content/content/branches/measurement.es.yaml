# yaml-language-server: $schema=../../dist/schemas/branches.locale.schema.json
name: 'Medición y metrología'
description: >-
  La metrología es la ciencia de la medición: cómo se definen las magnitudes, cómo se comparan con
  una unidad y cómo se expresan como un número por esa unidad. También abarca las convenciones
  ajenas a todo sistema de unidades, como el cómputo calendárico de días, meses y años, y las
  magnitudes adimensionales, que son números puros.
