name: 'Equilibrio químico'
description: >-
  El equilibrio químico es la rama de la química que estudia las reacciones reversibles cuando el
  proceso directo y el inverso transcurren a la misma velocidad, de modo que las cantidades de
  reactivos y productos dejan de cambiar aunque ambas reacciones continúen. Se pregunta dónde
  termina una reacción, mientras que la cinética química se pregunta con qué rapidez llega allí.

  Su magnitud central es la constante de equilibrio, que se escribe a partir de la ecuación química
  mediante la ley de acción de masas: las concentraciones de equilibrio de los productos sobre las de
  los reactivos, cada una dividida entre la concentración molar estándar y elevada a su coeficiente
  estequiométrico. En los gases, la misma constante puede escribirse con presiones parciales
  divididas entre la presión estándar, y las dos formas se relacionan mediante la temperatura y la
  variación de la cantidad de gas. Algunas constantes tienen nombre propio, como el producto de
  solubilidad de una sal poco soluble y la constante de acidez de un ácido débil, que la ley de
  dilución vincula con la fracción de ácido que se ioniza. La misma expresión evaluada fuera del
  equilibrio es el cociente de reacción, que indica en qué sentido reaccionará una mezcla.

  La rama toma las concentraciones del estudio de las disoluciones y las presiones parciales del de
  los gases. Comparte los equilibrios ácido-base con la rama de ácidos y bases, se encuentra con la
  termoquímica a través de la energía de Gibbs estándar de reacción, que fija la constante de
  equilibrio, y con la electroquímica a través del potencial estándar de una celda.
