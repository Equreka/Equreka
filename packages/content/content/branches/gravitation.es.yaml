name: 'Gravitación'
description: >-
  La gravitación, rama de la física, estudia la atracción entre masas: por qué caen los
  objetos, por qué planetas, lunas y satélites siguen órbitas y por qué el peso de un cuerpo cambia
  de un planeta a otro. En la enseñanza escolar se apoya en la ley de Newton de la gravitación
  universal, según la cual la fuerza entre dos masas crece con cada masa y disminuye con el cuadrado de
  su distancia.

  Sus magnitudes centrales son masa, peso, constante de gravitación universal, intensidad del campo
  gravitatorio y energía potencial gravitatoria. De ellas derivan la aceleración de caída libre
  cerca de la superficie de un planeta, la rapidez orbital y el periodo orbital de un satélite, la
  velocidad de escape y las leyes de Kepler del movimiento planetario, que describen órbitas
  elípticas, áreas iguales barridas en tiempos iguales y la relación entre el periodo de una órbita
  y su tamaño.

  La gravitación nació de la mecánica y usa sus herramientas: fuerza, energía y movimiento
  circular. Las mareas la conectan con la mecánica de fluidos, y la energía de una órbita con las
  leyes de conservación. Cerca de masas muy grandes, o cuando se requiere gran precisión, la ley de
  Newton cede ante la relatividad general, en la que la gravedad es la curvatura del espacio-tiempo;
  la descripción newtoniana sigue siendo precisa para campos débiles y movimientos lentos.
