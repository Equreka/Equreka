name: 'Ondas y oscilaciones'
description: >-
  Las ondas y oscilaciones abarcan el movimiento periódico, desde un péndulo o una masa en un
  resorte hasta el sonido y la luz. La frecuencia, el periodo, la longitud de onda y la amplitud
  describen todo fenómeno periódico; una onda viajera transporta energía de un lugar a otro sin
  transportar materia.
