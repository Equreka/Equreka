name: 'Ondas y oscilaciones'
description: >-
  Ondas y oscilaciones, rama de la física, estudia el movimiento periódico y su propagación en el
  espacio: una masa en un resorte, un péndulo, una cuerda vibrante, el sonido en el aire y las ondas
  en el agua. Una oscilación se repite en el tiempo en un lugar; una onda lleva esa perturbación de
  un punto a otro y transporta energía sin transportar el medio.

  Sus magnitudes centrales son periodo, frecuencia, frecuencia angular, amplitud, longitud de onda y
  rapidez de propagación; en toda onda viajera la rapidez es el producto de frecuencia y longitud de
  onda. El movimiento armónico simple, en el que una fuerza opuesta al desplazamiento crece en
  proporción a él, modela las oscilaciones pequeñas. Las ondas son principalmente transversales o
  longitudinales, y al superponerse interfieren y producen ondas estacionarias, armónicos,
  batimientos y resonancia. El sonido añade intensidad, nivel de intensidad del sonido en decibelios
  y efecto Doppler.

  Se apoya en la mecánica, que aporta fuerza, energía y constante elástica, y en la mecánica de
  fluidos para el sonido y las olas. La luz es una onda electromagnética, así que las mismas ideas
  reaparecen en el electromagnetismo y en la óptica y fotometría, y el comportamiento ondulatorio de
  la materia es un punto de partida de la física cuántica, parte de la física moderna.
