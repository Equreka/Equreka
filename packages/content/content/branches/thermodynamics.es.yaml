# yaml-language-server: $schema=../../dist/schemas/branches.locale.schema.json
name: 'Termodinámica'
description: >-
  La termodinámica estudia el calor, el trabajo y la temperatura, y cómo se transforma la energía
  entre ellos. Sus leyes definen la temperatura mediante el equilibrio térmico, establecen que la
  energía se conserva, introducen la entropía, que nunca disminuye en un sistema aislado, y sitúan
  el cero absoluto fuera de alcance.
