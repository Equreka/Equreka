name: 'Termodinámica'
description: >-
  La termodinámica, rama de la física, estudia el calor, el trabajo y la temperatura, y
  cómo pasa la energía entre cuerpos y cambia de forma. Describe un sistema mediante unas pocas
  variables de estado medibles, como presión, volumen, temperatura y energía interna, sin seguir
  cada molécula.

  Sus magnitudes centrales son temperatura termodinámica, calor, energía interna, capacidad
  calorífica, capacidad calorífica específica, calor latente específico y entropía. Sus leyes
  definen la temperatura mediante el equilibrio térmico, establecen que la energía se conserva al
  contar calor y trabajo, exigen que la entropía de un sistema aislado nunca disminuya y sitúan el
  cero absoluto fuera de alcance. En la enseñanza escolar abarca también dilatación térmica,
  transmisión de calor por conducción, convección y radiación, cambios de fase, ley de los gases
  ideales y rendimiento de las máquinas térmicas, acotado por el rendimiento de Carnot.

  Se conecta con la mecánica a través del trabajo y la energía, y con la mecánica de fluidos a
  través del comportamiento de los gases. La teoría cinética explica presión y temperatura como
  promedios del movimiento molecular, lo que vincula la rama con la química y la constante de
  Boltzmann. Sus leyes rigen motores, refrigeradores, centrales eléctricas y el balance energético de
  los seres vivos.
