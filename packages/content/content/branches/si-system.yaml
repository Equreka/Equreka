description:
  en: >-
    The International System of Units, abbreviated SI, is the modern metric system and the reference
    system for units of measurement. It fixes the exact numerical values of seven defining
    constants, and every SI unit follows from them, so a unit can be realized in any laboratory from
    the laws of physics rather than copied from a physical artefact.

    The seven defining constants are the hyperfine transition frequency of caesium-133, the speed of
    light in vacuum, the Planck constant, the elementary charge, the Boltzmann constant, the
    Avogadro constant and the luminous efficacy of monochromatic radiation. From them come the seven
    base units: the second, the metre, the kilogram, the ampere, the kelvin, the mole and the
    candela. Products and quotients of base units form the coherent derived units, and 22 of them
    carry special names and symbols, among them the newton, the joule, the pascal, the hertz, and
    the radian and the steradian for plane and solid angle. Decimal prefixes such as kilo, milli and
    micro form multiples and submultiples; they always mean powers of ten, never powers of two.

    Every discipline states its results in SI units: mechanics in metres, kilograms and seconds,
    thermodynamics in kelvins, electromagnetism in amperes, chemistry in moles and photometry in
    candelas. Measurement and metrology complements the branch with the units of time and the
    dimensionless quantities used alongside the SI.
