description:
  en: >-
    Electromagnetism is the branch of physics that studies electric charge, the electric and
    magnetic fields that charges and currents produce, and the forces those fields exert. It covers
    electrostatics, electric current and circuits, magnetism, electromagnetic induction and
    electromagnetic waves, light among them.

    Its central quantities are electric charge, electric current, electric potential, potential
    difference, electromotive force, electrical resistance, capacitance, magnetic flux and power.
    Coulomb's law gives the force between two charges; Ohm's law relates voltage, current and
    resistance in a conductor; Faraday's law states that a changing magnetic flux induces an
    electromotive force, the principle behind generators and transformers. Maxwell's equations
    gather these results into one theory and predict electromagnetic waves that travel at the speed
    of light.

    Electromagnetism draws on mechanics for force, energy and power, and its waves are the subject
    of optics and photometry. The elementary charge links it with modern physics and with atomic
    structure in chemistry, where electric forces hold atoms and molecules together. Circuits,
    motors, radio and every electronic device rest on its laws.
