name: 'Mecánica de fluidos'
description: >-
  La mecánica de fluidos, rama de la física, estudia líquidos y gases, en reposo y en
  movimiento, y las fuerzas que ejercen sobre superficies y cuerpos sumergidos. La estática de
  fluidos, o hidrostática, trata presión, flotación y empuje; la dinámica de fluidos estudia el
  flujo por tuberías, alrededor de alas y en la atmósfera y los océanos.

  Sus magnitudes centrales son densidad, presión, empuje, caudal y viscosidad dinámica. La presión
  en un líquido en reposo aumenta con la profundidad. El principio de Pascal establece que un cambio
  de presión aplicado a un fluido encerrado llega a todas sus partes, con lo que prensas y
  frenos hidráulicos multiplican la fuerza, y el principio de Arquímedes iguala el empuje al peso
  del fluido desalojado. En fluidos en movimiento, la ecuación de continuidad conserva la masa en una
  tubería, y la ecuación de Bernoulli intercambia presión, rapidez y altura sobre una
  línea de corriente de un flujo estacionario, incompresible y sin viscosidad.

  Esta rama extiende las leyes de la mecánica de masas puntuales a medios continuos.
  Se cruza con la termodinámica en el comportamiento de los gases, con ondas y oscilaciones en el
  sonido y las olas, y con la gravitación en mareas y presión atmosférica. Sustenta la hidráulica,
  la aerodinámica, la meteorología y el estudio del flujo sanguíneo.
