name:
  en: 'Measurement and metrology'
category: 'universal'
order: 1
aliases:
  - 'metrology'
  - 'timekeeping'
  - 'metrología'
  - 'medición'
  - 'medida del tiempo'
description:
  en: >-
    Metrology is the science of measurement: how quantities are defined, compared with a unit, and
    expressed as a number times that unit. It also covers conventions outside any unit system, such
    as the calendar reckoning of days, months and years, and dimensionless quantities, which are
    pure numbers.
