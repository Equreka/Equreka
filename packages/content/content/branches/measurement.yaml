description:
  en: >-
    Measurement and metrology is the branch that studies measurement itself. Metrology studies how
    quantities are defined, measured and compared, from the theory of measurement to its practice in
    laboratories and industry, and how reliable the results are. A measurement compares a quantity
    with a unit and reports the result as a number times that unit, together with an uncertainty
    that says how well the number is known.

    It covers the quantities and units that belong to no single discipline. Time, measured in
    seconds, is counted in daily life in minutes, hours and days, which the SI accepts for use with
    its own units at exact ratios: sixty seconds to the minute, sixty minutes to the hour and
    twenty-four hours to the day. The week, month, year, decade and century extend that count by
    calendar convention. Dimensionless quantities, such as a refractive index or a mass fraction,
    which divide one quantity by another of the same kind, carry the unit one, which is seldom
    written, and are stated as pure numbers.

    The branch complements the International System of Units, which fixes the units themselves, by
    dealing with how they are used: counting, converting between units and writing values. Every
    other branch relies on it whenever a result is stated as a number with a unit, from a speed in
    mechanics to a concentration in chemistry.
