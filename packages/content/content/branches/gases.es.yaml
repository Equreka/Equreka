name: 'Gases'
description: >-
  Gases, rama de la química, estudia la materia en estado gaseoso, en el que las
  partículas están muy separadas y se mueven libremente hasta llenar cualquier recipiente. Cuatro
  magnitudes fijan el estado de una muestra de gas: presión, volumen, temperatura termodinámica y
  cantidad de sustancia. Las leyes de los gases las relacionan, y la teoría cinética de los gases
  explica esas leyes por el movimiento de las partículas.

  La ley de Boyle, la ley de Charles, la ley de Gay-Lussac y la ley de Avogadro mantienen
  constantes dos de las cuatro magnitudes y relacionan las otras dos. La ley combinada de los
  gases une las tres primeras, y la ley de los gases ideales une las cuatro mediante la constante
  molar de los gases; de ella se obtienen el volumen molar de un gas ideal, la densidad de un gas
  y las masas en reacciones que consumen o liberan gases. La ley de Dalton suma las presiones
  parciales de los gases de una mezcla, cada una proporcional a su fracción molar, y la ley de
  Graham compara la velocidad de efusión de dos gases. La presión se da en pascales, atmósferas
  estándar o torr.

  La teoría cinética describe un gas como partículas en movimiento aleatorio continuo cuya energía
  cinética media es proporcional a la temperatura termodinámica. Los gases reales se apartan del
  comportamiento ideal a presión alta y temperatura baja, como describen el factor de
  compresibilidad y la ecuación de van der Waals. La rama comparte con la termodinámica la ley de
  los gases ideales y el trabajo de expansión, y cuenta el gas con el mol de la cantidad de
  sustancia.
