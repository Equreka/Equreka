name: 'Disoluciones y concentración'
description: >-
  Disoluciones y concentración, rama de la química, estudia las disoluciones, mezclas homogéneas en
  las que un soluto está disperso en un disolvente, y las formas de expresar cuánto soluto
  contienen. Su idea central es la concentración, con varias medidas que sirven a tareas distintas
  del laboratorio.

  La concentración molar, o concentración de cantidad de sustancia, da los moles de soluto por litro
  de disolución, y la concentración másica, los gramos por litro. La molalidad da la cantidad de
  soluto, en moles, contenida en cada kilogramo de disolvente y, a diferencia de la concentración
  molar, no cambia con la temperatura. El porcentaje en masa, la fracción molar y las partes por
  millón expresan la composición como una razón. La ecuación de dilución mantiene fija la cantidad
  de soluto al añadir disolvente, y la concentración baja al crecer el volumen. Las propiedades
  coligativas dependen de cuántas partículas de soluto hay disueltas, no de cuáles son: el descenso
  de la presión de vapor que describe la ley de Raoult, el aumento del punto de ebullición, el
  descenso del punto de congelación y la presión osmótica. La ley de Henry hace la solubilidad de un
  gas proporcional a su presión parcial sobre el líquido.

  La rama se basa en la cantidad de sustancia, porque toda concentración cuenta el soluto en moles o
  gramos, y prepara ácidos y bases y la electroquímica, cuyos equilibrios y potenciales se escriben
  con concentraciones. Las leyes de Raoult y de Henry la vinculan con los gases mediante la presión
  parcial, y la presión osmótica tiene la misma forma que la ley de los gases ideales.
