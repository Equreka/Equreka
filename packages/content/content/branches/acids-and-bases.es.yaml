name: 'Ácidos y bases'
description: >-
  Ácidos y bases, rama de la química, estudia las reacciones en las que un ion hidrógeno
  pasa de una especie a otra. Un ácido cede un ion hidrógeno y una base lo acepta. En agua, los
  ácidos aumentan la concentración de iones hidronio y las bases la de iones hidróxido, y,
  cuando un ácido reacciona con una base, el proceso se denomina neutralización.

  El pH, el logaritmo decimal cambiado de signo de la concentración de iones hidronio, mide la
  acidez en una escala compacta, y el pOH hace lo mismo con los iones hidróxido. El producto
  iónico del agua los relaciona, de modo que a $25\,^{\circ}\mathrm{C}$ su suma es 14 y una
  disolución neutra tiene pH 7, una ácida menos y una básica más. La fuerza de un ácido débil se
  expresa con su constante de acidez o su pKa, que fijan el pH de su disolución y su porcentaje de
  ionización, y la relación entre Ka y Kb vincula un ácido con su base conjugada. Las disoluciones
  amortiguadoras resisten los cambios de pH, y la ecuación de Henderson-Hasselbalch da su pH a
  partir de la razón entre base y ácido. Una valoración halla una concentración desconocida
  neutralizándola con una disolución de concentración conocida.

  La rama se basa en disoluciones y concentración, porque toda magnitud ácido-base es una
  concentración o su logaritmo, y en la idea de equilibrio químico, porque la ionización es reversible.
  Sus escalas logarítmicas proceden del álgebra, y los iones hidrógeno reaparecen en la
  electroquímica siempre que intervienen en una semirreacción.
