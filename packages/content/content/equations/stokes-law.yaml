description:
  en: >-
    Stokes' law gives the drag force on a small sphere moving slowly through a viscous fluid: six pi
    times the dynamic viscosity of the fluid times the radius of the sphere times its speed. Unlike
    the quadratic drag on large, fast bodies, this viscous drag grows in direct proportion to the
    speed, and it governs the settling of dust, pollen, sediment grains and microorganisms.

    In the equation, $\var{F_\mathrm{d}}$ is the size of the drag force in newtons, directed against
    the motion of the sphere relative to the fluid; $\mag{\eta}$ is the dynamic viscosity of the
    fluid in pascal seconds; $\var{r}$ the radius of the sphere in metres; and $\mag{v}$ its speed
    relative to the undisturbed fluid far away, in metres per second. All four are non-negative.

    At very low speeds the inertia of the fluid is negligible beside its viscous stresses, so the
    flow closes smoothly behind the sphere without a wake, and solving the equations of viscous flow
    for that case gives the force exactly. Setting the drag equal to the weight of a sinking sphere
    gives a terminal speed proportional to the weight and inversely proportional to the viscosity and
    the radius; buoyancy, the weight of displaced fluid, is subtracted when it matters, as in water.

    The law holds only at low Reynolds number, the ratio of inertial to viscous effects built from
    the density of the fluid, the speed and the diameter of the sphere divided by the viscosity:
    below about one. At larger Reynolds numbers the flow separates behind the sphere and the drag
    exceeds the Stokes value, tending towards the quadratic drag equation. The law also assumes a
    rigid sphere far from walls and other particles, in a fluid otherwise at rest.

    George Gabriel Stokes derived the result in 1851, while studying how a fluid damps a swinging pendulum.
    A steel ball of density 7860 kilograms per cubic metre and one centimetre across, sinking
    through honey of viscosity $5\,\mathrm{Pa\,s}$, settles at about 8.56 centimetres per second
    with buoyancy neglected; in honey the buoyant force lowers that figure noticeably.
