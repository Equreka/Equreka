name:
  en: 'Bernoulli''s equation'
kind: 'equation'
level: 'intermediate'
expression: '\var{p_{1}}+\frac{1}{2}\mag{\rho}\var{v_{1}}^{2}+\mag{\rho}\var{g}\var{h_{1}}=\var{p_{2}}+\frac{1}{2}\mag{\rho}\var{v_{2}}^{2}+\mag{\rho}\var{g}\var{h_{2}}'
terms:
  p_{1}:
    kind: 'symbol'
    label:
      en: 'Pressure at point 1'
    unit: 'pascal'
  p_{2}:
    kind: 'symbol'
    label:
      en: 'Pressure at point 2'
    unit: 'pascal'
  v_{1}:
    kind: 'symbol'
    label:
      en: 'Flow speed at point 1'
    unit: 'metre-per-second'
  v_{2}:
    kind: 'symbol'
    label:
      en: 'Flow speed at point 2'
    unit: 'metre-per-second'
  h_{1}:
    kind: 'symbol'
    label:
      en: 'Height of point 1'
    unit: 'metre'
  h_{2}:
    kind: 'symbol'
    label:
      en: 'Height of point 2'
    unit: 'metre'
  \rho:
    kind: 'magnitude'
    ref: 'density'
  g:
    kind: 'symbol'
    label:
      en: 'Gravitational acceleration'
    unit: 'metre-per-second-squared'
solutions:
  p_{1}: 'p_2 + rho * (v_2^2 - v_1^2) / 2 + rho * g * (h_2 - h_1)'
  p_{2}: 'p_1 + rho * (v_1^2 - v_2^2) / 2 + rho * g * (h_1 - h_2)'
  v_{1}: 'sqrt(v_2^2 + 2 * (p_2 - p_1) / rho + 2 * g * (h_2 - h_1))'
  v_{2}: 'sqrt(v_1^2 + 2 * (p_1 - p_2) / rho + 2 * g * (h_1 - h_2))'
  h_{1}: 'h_2 + (p_2 - p_1) / (rho * g) + (v_2^2 - v_1^2) / (2 * g)'
  h_{2}: 'h_1 + (p_1 - p_2) / (rho * g) + (v_1^2 - v_2^2) / (2 * g)'
  \rho: '(p_2 - p_1) / ((v_1^2 - v_2^2) / 2 + g * (h_1 - h_2))'
  g: '((p_2 - p_1) / rho + (v_2^2 - v_1^2) / 2) / (h_1 - h_2)'
