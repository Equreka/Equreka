description:
  en: >-
    Bernoulli's equation states that, along a streamline of a steady flow of an ideal fluid, the
    pressure plus the kinetic energy per unit volume plus the gravitational potential energy per
    unit volume keeps the same value. Written between two points of the flow, it is the energy
    balance of fluid dynamics, behind Venturi meters, siphons, nozzles and the lower pressure in a
    fast stream; at equal heights it reduces to Bernoulli's principle.

    Here $\var{p_{1}}$ and $\var{p_{2}}$ are the pressures at points 1 and 2 in pascals, both
    absolute or both gauge; $\var{v_{1}}$ and $\var{v_{2}}$ the flow speeds there in metres per
    second, never negative, so each is solved as the non-negative root; $\var{h_{1}}$ and
    $\var{h_{2}}$ their heights in metres above any common reference level; $\mag{\rho}$ the density
    of the fluid in kilograms per cubic metre; and $\var{g}$ the gravitational acceleration, entered
    as a positive number, standard value 9.80665 metres per second squared, varying with place.

    The equation is the work–energy theorem applied to a small parcel of fluid: the net work done by
    the pressure of the surrounding fluid as the parcel moves from one point to the other equals the
    gain in its kinetic and gravitational potential energy. With the fluid at rest it reduces to the
    increase of pressure with depth; at constant height, a faster stream has a lower pressure.

    The equation assumes an incompressible fluid of constant density, no viscous losses, steady flow
    without turbulence, and two points on the same streamline; pumps, turbines and friction in pipes
    need extra terms. It describes liquids well and gases only at speeds low enough for their density
    to stay nearly constant.

    Daniel Bernoulli set out the energy analysis of fluid flow in Hydrodynamica, published in 1738.
    Water, of density 1000 kilograms per cubic metre, in a level hose at 1.96 metres per second
    leaving a nozzle at 25.5 metres per second into open air at an absolute pressure of
    $1.01\times10^{5}\,\mathrm{Pa}$ needs an absolute pressure in the hose of about
    $4.24\times10^{5}\,\mathrm{Pa}$.
