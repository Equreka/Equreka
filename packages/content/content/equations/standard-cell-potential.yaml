description:
  en: >-
    The standard cell potential of an electrochemical cell is the standard reduction potential of
    its cathode minus the standard reduction potential of its anode. In electrochemistry this
    difference, the voltage of a galvanic cell under standard conditions, follows from a table of
    standard electrode potentials and tells whether the cell reaction runs on its own.

    $\var{E^{\circ}_\mathrm{cell}}$ is the standard cell potential, in volts. $\var{E^{\circ}_\mathrm{cathode}}$
    is the standard reduction potential of the half-cell where reduction takes place, the cathode,
    and $\var{E^{\circ}_\mathrm{anode}}$ that of the half-cell where oxidation takes place, the
    anode, both read from the same table of reduction potentials and both in volts. Every value is
    measured against the standard hydrogen electrode, whose potential is zero by definition.

    A positive cell potential marks a reaction that is spontaneous under standard conditions; a
    negative one marks a reaction that needs an outside source of energy, as in electrolysis, and
    reversing the reaction reverses the sign. Both reduction potentials enter exactly as tabulated:
    the anode's is subtracted rather than having its sign changed first, and neither is multiplied
    by the coefficients of the balanced equation, because a potential does not depend on how much
    substance reacts.

    Standard conditions mean solutes at one mole per litre, gases at 1 bar and, in the usual tables,
    $25\,^{\circ}\mathrm{C}$. Other concentrations shift the cell potential, a correction given by
    the Nernst equation. A positive value says the reaction can run, not how fast; the standard
    Gibbs energy change equals minus the number of electrons transferred times the Faraday constant
    times the standard cell potential.

    In a cell of copper and silver, silver ions are reduced at 0.7996 volts and copper is oxidized
    against 0.34 volts, so the standard cell potential is about +0.46 volts.
