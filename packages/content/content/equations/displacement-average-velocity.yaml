name:
  en: 'Displacement from average velocity'
kind: 'equation'
level: 'intro'
expression: '\var{\Delta x}=\frac{1}{2}\left(\var{v_{0}}+\var{v}\right)\mag{t}'
terms:
  \Delta x:
    kind: 'symbol'
    label:
      en: 'Displacement'
    unit: 'metre'
  v_{0}:
    kind: 'symbol'
    label:
      en: 'Initial velocity'
    unit: 'metre-per-second'
  v:
    kind: 'symbol'
    label:
      en: 'Final velocity'
    unit: 'metre-per-second'
  t:
    kind: 'magnitude'
    ref: 'time'
solutions:
  \Delta x: '(v_0 + v) * t / 2'
  v_{0}: '2 * Deltax / t - v'
  v: '2 * Deltax / t - v_0'
  t: '2 * Deltax / (v_0 + v)'
