name:
  en: 'Three resistors in parallel'
kind: 'formula'
level: 'intro'
expression: '\frac{1}{\mag{R}}=\frac{1}{\var{R_{1}}}+\frac{1}{\var{R_{2}}}+\frac{1}{\var{R_{3}}}'
terms:
  R:
    kind: 'magnitude'
    ref: 'electrical-resistance'
  R_{1}:
    kind: 'symbol'
    label:
      en: 'Resistance of the first resistor'
    unit: 'ohm'
  R_{2}:
    kind: 'symbol'
    label:
      en: 'Resistance of the second resistor'
    unit: 'ohm'
  R_{3}:
    kind: 'symbol'
    label:
      en: 'Resistance of the third resistor'
    unit: 'ohm'
solutions:
  R: '1 / (1 / R_1 + 1 / R_2 + 1 / R_3)'
  R_{1}: '1 / (1 / R - 1 / R_2 - 1 / R_3)'
  R_{2}: '1 / (1 / R - 1 / R_1 - 1 / R_3)'
  R_{3}: '1 / (1 / R - 1 / R_1 - 1 / R_2)'
