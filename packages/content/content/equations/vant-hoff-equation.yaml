name:
  en: 'Van ''t Hoff equation'
kind: 'equation'
level: 'intermediate'
expression: '\ln\left(\frac{\var{K_{2}}}{\var{K_{1}}}\right)=-\frac{\var{\Delta_\mathrm{r} H^{\circ}}}{\const{R}}\left(\frac{1}{\var{T_{2}}}-\frac{1}{\var{T_{1}}}\right)'
terms:
  K_{1}:
    kind: 'symbol'
    label:
      en: 'Equilibrium constant at the first temperature'
  K_{2}:
    kind: 'symbol'
    label:
      en: 'Equilibrium constant at the second temperature'
  \Delta_\mathrm{r} H^{\circ}:
    kind: 'symbol'
    label:
      en: 'Standard enthalpy of reaction'
    unit: 'joule-per-mole'
    identifier: 'DeltaH_r'
  R:
    kind: 'constant'
    ref: 'molar-gas-constant'
  T_{1}:
    kind: 'symbol'
    label:
      en: 'First temperature'
    unit: 'kelvin'
  T_{2}:
    kind: 'symbol'
    label:
      en: 'Second temperature'
    unit: 'kelvin'
solutions:
  K_{2}: 'K_1 * exp(DeltaH_r * (T_2 - T_1) / (R * T_1 * T_2))'
  K_{1}: 'K_2 * exp(DeltaH_r * (T_1 - T_2) / (R * T_1 * T_2))'
  \Delta_\mathrm{r} H^{\circ}: 'R * ln(K_2 / K_1) * T_1 * T_2 / (T_2 - T_1)'
  T_{2}: 'T_1 * DeltaH_r / (DeltaH_r - R * T_1 * ln(K_2 / K_1))'
  T_{1}: 'T_2 * DeltaH_r / (DeltaH_r + R * T_2 * ln(K_2 / K_1))'
