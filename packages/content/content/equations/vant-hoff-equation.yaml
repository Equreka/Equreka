description:
  en: >-
    The van 't Hoff equation relates the equilibrium constants of a reaction at two temperatures to
    its standard enthalpy of reaction. In thermochemistry and chemical equilibrium it predicts how far
    heating or cooling shifts an equilibrium, and it extracts a reaction enthalpy from equilibrium
    constants measured at two temperatures.

    $\var{K_{1}}$ and $\var{K_{2}}$ are the equilibrium constants at the temperatures $\var{T_{1}}$
    and $\var{T_{2}}$, pure numbers with each concentration taken relative to the standard amount
    concentration and each pressure relative to the standard pressure; in dilute solutions and ideal
    gases these stand in for activities and fugacities. The temperatures are absolute, in kelvin, so
    a Celsius reading needs 273.15 added. $\var{\Delta_\mathrm{r} H^{\circ}}$ is the standard
    enthalpy of reaction in joules per mole of reaction as written, negative for an exothermic
    reaction. $\const{R}$ is the molar gas constant, about 8.314 joules per mole kelvin.

    Combining the Gibbs-Helmholtz relation with the link between the standard Gibbs energy and the
    equilibrium constant gives the slope of the logarithm of K against temperature; integrating it
    between two temperatures gives this form. Plotted against the reciprocal of the absolute
    temperature, the logarithm of K falls on a line of slope minus the enthalpy over R. An
    endothermic reaction has a larger constant when hot, an exothermic one a smaller constant, the
    quantitative form of Le Chatelier's principle. It is the equilibrium twin of the
    Clausius-Clapeyron equation for vapour pressure.

    The integration treats the reaction enthalpy as independent of temperature, so the result holds
    only over a range in which the enthalpy barely changes; the constants themselves must refer to
    the same standard states at both temperatures.

    Jacobus van 't Hoff set out the relation between the heat of reaction and the shift of
    equilibrium with temperature in his 1884 Études de dynamique chimique, and received the 1901
    Nobel Prize in Chemistry. A reaction with a constant of 0.0260 at 25 degrees Celsius
    and an enthalpy of 32.4 kilojoules per mole has a constant of about 0.0431 at 37 degrees Celsius.
