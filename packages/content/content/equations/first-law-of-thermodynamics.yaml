description:
  en: >-
    The first law of thermodynamics states that a system's internal energy changes by the heat added
    to it minus the work it does on its surroundings. It is the principle of conservation of energy
    applied to thermodynamic systems: energy can cross the boundary of a system as heat or as work,
    but it is neither created nor destroyed.

    $\var{\Delta U}$ is the change in internal energy, the final value minus the initial one, in
    joules. $\mag{Q}$ is the heat exchanged, in joules, positive when heat flows into the system and
    negative when it flows out. $\mag{W}$ is the work done by the system, in joules: positive when
    the system acts on its surroundings, as an expanding gas does, and negative when the
    surroundings act on it, as when a gas is compressed. Chemistry texts count the work done on the
    system as positive and write the law as $\Delta U = Q + W$, with that work in place of the work
    done by the system; the two forms describe the same physics with the sign of the work reversed.

    Internal energy is a state function: its change is fixed by the starting and ending states
    alone, while the heat and the work taken separately depend on the path between them. Over a
    complete cycle, as in a heat engine, the internal energy returns to its starting value, so the
    net work done equals the net heat absorbed.

    The law holds for any process between equilibrium states of a closed system, reversible or not.
    It sets no direction for processes: how much of the heat an engine takes in can become work is a
    question for the second law. When matter crosses the boundary, the energy it carries must be
    added to the balance.

    James Prescott Joule's experiments, in which falling weights turned a paddle wheel in water and
    raised its temperature, showed that work and heat are interchangeable forms of energy. A system
    that absorbs 400 joules of heat while doing 100 joules of work gains 300 joules of internal
    energy.
