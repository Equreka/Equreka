description:
  en: >-
    The margin of error of an estimated mean is the half-width of its confidence interval: the
    critical value of the standard normal distribution times the standard error of the mean. Some
    textbooks name it the error bound of the mean; it states how far the true mean may lie from the
    sample mean at a chosen confidence level, and in inferential statistics it also fixes the sample
    size needed for a target precision.

    In the formula, $\var{E}$ is the margin of error, $\var{z^{*}}$ the critical value, a z-score
    that leaves the chosen confidence level between minus and plus itself under the standard normal
    curve, $\var{\sigma}$ the standard deviation of the population and $\var{n}$ the sample size, a
    positive whole number. The margin and the standard deviation share the unit of the data, which
    the formula leaves open; the critical value and the sample size are pure numbers. All four are
    positive.

    The interval runs from the sample mean minus $\var{E}$ to the sample mean plus $\var{E}$. A
    higher confidence level needs a larger critical value and widens the interval, while a larger
    sample narrows it with the square root of $\var{n}$. Solving for $\var{n}$ gives the planning
    formula for a survey: the square of the critical value times the standard deviation over the
    desired margin, always rounded up to the next whole number.

    The formula assumes a random sample, a known population standard deviation and a sample mean
    that is close to normally distributed, either because the data are normal or because the sample
    is large. When the standard deviation must be estimated from the same sample, the critical value
    comes from the t distribution with one degree of freedom fewer than the sample size. A confidence
    level describes the long-run share of intervals that contain the true mean, not the chance that
    one computed interval does. Polls estimating a proportion use a separate form.

    Common critical values are 1.645 for 90 percent and 1.96 for 95 percent confidence. With a
    standard deviation of 3 and 36 observations, 90 percent confidence gives a margin of about 0.82.
