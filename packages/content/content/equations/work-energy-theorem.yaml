name:
  en: 'Work-energy theorem'
kind: 'equation'
level: 'intro'
expression: '\mag{W}=\frac{1}{2}\mag{m}\var{v}^{2}-\frac{1}{2}\mag{m}\var{v_{0}}^{2}'
terms:
  W:
    kind: 'magnitude'
    ref: 'work'
  m:
    kind: 'magnitude'
    ref: 'mass'
  v:
    kind: 'symbol'
    label:
      en: 'Final speed'
    unit: 'metre-per-second'
  v_{0}:
    kind: 'symbol'
    label:
      en: 'Initial speed'
    unit: 'metre-per-second'
solutions:
  W: 'm * (v^2 - v_0^2) / 2'
  m: '2 * W / (v^2 - v_0^2)'
  v: 'sqrt(v_0^2 + 2 * W / m)'
  v_{0}: 'sqrt(v^2 - 2 * W / m)'
