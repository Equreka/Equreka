description:
  en: >-
    The work-energy theorem states that the net work done on a body by all the forces acting on it
    equals the change in its kinetic energy, the final kinetic energy minus the initial one. Also
    called the work-energy principle, it links forces acting over a distance to changes of speed and
    often solves mechanics problems without any need to follow the motion in time.

    $\mag{W}$ is the net work in joules, the sum of the work done by every force on the body,
    gravity, friction and normal forces included; $\mag{m}$ is the mass in kilograms; $\var{v_{0}}$
    and $\var{v}$ are the initial and final speeds in metres per second, both non-negative. Positive
    net work speeds the body up, negative net work slows it down, and zero net work leaves the speed
    unchanged even when the direction changes, as in uniform circular motion.

    For a constant net force along a straight line, the work is the force times the displacement.
    Newton's second law writes the force as mass times acceleration, and the constant-acceleration
    relation between the squares of the speeds and the displacement turns that product into the
    difference of the two kinetic energies. The result also holds for forces that change in size and
    direction along a curved path.

    Solving for a speed keeps only the non-negative square root, because a speed is never negative;
    in motion along a line the velocity with that speed may point either way. A negative number
    under the root means the given net work is not consistent with the other speed: for the final
    speed, negative work would remove more kinetic energy than the body had at the start, and for
    the initial speed, positive work would exceed the kinetic energy at the end. The theorem applies
    to a particle, or to a rigid body in translation, at speeds far below the speed of light; a
    deformable body or a rotating one needs internal work and rotational energy as well.

    A skater of 50 kilograms who speeds up from 8 to 12 metres per second receives 2000 joules of
    net work.
