name:
  en: 'Inverse-square law for illuminance'
kind: 'equation'
level: 'intro'
expression: '\mag{E_\mathrm{v}}=\frac{\mag{I_\mathrm{v}}}{\var{r}^{2}}'
terms:
  E_\mathrm{v}:
    kind: 'magnitude'
    ref: 'illuminance'
  I_\mathrm{v}:
    kind: 'magnitude'
    ref: 'luminous-intensity'
  r:
    kind: 'symbol'
    label:
      en: 'Distance from the source'
    unit: 'metre'
solutions:
  E_\mathrm{v}: 'I_v / r^2'
  I_\mathrm{v}: 'E_v * r^2'
  r: 'sqrt(I_v / E_v)'
calculator:
  enabled: true
categories:
