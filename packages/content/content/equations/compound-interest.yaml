solutions:
  A: 'P * (1 + r / n)^(n * t)'
  P: 'A / (1 + r / n)^(n * t)'
  r: 'n * ((A / P)^(1 / (n * t)) - 1)'
  t: 'ln(A / P) / (n * ln(1 + r / n))'
