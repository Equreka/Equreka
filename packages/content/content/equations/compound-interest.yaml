description:
  en: >-
    Compound interest is interest added to the principal at regular intervals so that, from then on,
    the interest itself earns interest. The compound interest formula gives the future value of a
    deposit or loan after a number of years when a nominal annual rate is credited a fixed number of
    times per year; the balance is multiplied by the same growth factor in every period, which makes
    the growth exponential.

    In the formula, $\var{A}$ is the future value or final balance, $\var{P}$ the principal,
    $\var{r}$ the nominal annual rate as a decimal fraction, $\var{n}$ the whole number of
    compounding periods per year (1 for yearly, 4 for quarterly, 12 for monthly), and $\var{t}$ the
    time in years. The money amounts share one currency, which the formula leaves open; the rate,
    the frequency and the time are pure numbers. Each period earns the annual rate divided by the
    number of periods per year, and the deposit runs for that number times the years in all.

    After one period the balance is the principal times one plus the periodic rate, and every
    further period multiplies it by the same factor, which produces the power. Dividing by that
    factor gives the principal needed today to reach a target, its present value, and logarithms
    give the time needed to reach it. The frequency cannot be isolated with elementary functions,
    because it sits both in the base and in the exponent, so it is always an input.

    The formula assumes a constant rate, no deposits or withdrawals, and interest left in the
    account. At a given nominal rate, more frequent compounding gives a slightly larger balance, but
    the gain shrinks as the frequency grows and approaches the limit of continuous compounding.
    Offers with different frequencies are compared through the effective annual yield, the
    once-a-year rate that gives the same growth.

    Savings accounts, fixed-term deposits, mortgages and credit card balances accrue interest in
    this way. A deposit of 1000 at 5 percent compounded quarterly grows to about 2445.92 in 18
    years.
