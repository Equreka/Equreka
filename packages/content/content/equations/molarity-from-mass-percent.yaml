name:
  en: 'Molarity from mass percent'
kind: 'formula'
level: 'intro'
expression: '\mag{c}=\frac{\mag{\rho}\var{w}}{\mag{M}}'
terms:
  c:
    kind: 'magnitude'
    ref: 'amount-concentration'
  \rho:
    kind: 'magnitude'
    ref: 'density'
  w:
    kind: 'symbol'
    label:
      en: 'Mass fraction of the solute'
    unit: 'unitless'
  M:
    kind: 'magnitude'
    ref: 'molar-mass'
solutions:
