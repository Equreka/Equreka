description:
  en: >-
    The law of sines states that in any triangle each side divided by the sine of the angle facing
    it gives the same value for all three sides. Also called the sine rule, it is the trigonometric
    tool for solving an oblique triangle, one without a right angle, when an angle and the side
    facing it are known together with one more side or angle.

    In the equation, $\var{a}$ and $\var{b}$ are two sides of the triangle, lengths in metres or in
    any shared unit, and $\mag{\alpha}$ and $\mag{\beta}$ are the angles facing them, in radians.
    Sides are positive, each angle lies strictly between zero and a straight angle, and two angles
    of one triangle always add up to less than a straight angle. The third side and its opposite
    angle obey the same equality; the calculator handles one pair at a time.

    The height dropped from the third vertex onto the third side equals $\var{b}$ times the sine of
    $\mag{\alpha}$ and also $\var{a}$ times the sine of $\mag{\beta}$. Setting the two expressions
    equal and dividing gives the law. The common value of the quotients is the diameter of the
    circle through the three vertices.

    Solving for a side always gives one answer. Solving for an angle from two sides and an angle not
    between them is the ambiguous case: the inverse sine returns an acute angle, and its supplement
    has the same sine, so zero, one or two triangles fit the data. The acute root is listed first,
    but even it fits only when it leaves room for the given angle, since the two must add up to less
    than a straight angle; the obtuse root is a second valid triangle under the same condition. When
    two sides and the angle between them, or all three sides, are known, the law of cosines applies
    instead. The law holds for triangles in a flat plane.

    Ptolemy already knew the relation, written with chords of a circle instead of sines. An angle of
    50 degrees facing a side of 10 units and a second angle of 100 degrees give a side of about 12.9
    units facing the larger angle.
