name:
  en: 'Law of sines'
kind: 'equation'
level: 'intro'
expression: '\frac{\var{a}}{\sin\mag{\alpha}}=\frac{\var{b}}{\sin\mag{\beta}}'
terms:
  a:
    kind: 'symbol'
    label:
      en: 'Side a'
    unit: 'metre'
  b:
    kind: 'symbol'
    label:
      en: 'Side b'
    unit: 'metre'
  \alpha:
    kind: 'magnitude'
    ref: 'plane-angle'
  \beta:
    kind: 'magnitude'
    ref: 'plane-angle'
solutions:
  a: 'b * sin(alpha) / sin(beta)'
  b: 'a * sin(beta) / sin(alpha)'
  \alpha:
    - 'asin(a * sin(beta) / b)'
    - 'pi - asin(a * sin(beta) / b)'
  \beta:
    - 'asin(b * sin(alpha) / a)'
    - 'pi - asin(b * sin(alpha) / a)'
