description:
  en: >-
    The half-life of a radionuclide equals the natural logarithm of two divided by its decay
    constant. The formula converts between the two usual ways of stating how fast a radioactive
    isotope decays in nuclear physics: the half-life, the time in which half of the nuclei present
    decay, and the decay constant, the probability per unit time that a single nucleus decays.

    Here $\var{t_{1/2}}$ is the half-life, in seconds, and $\var{\lambda}$ is the decay constant, in
    reciprocal seconds. Both are positive and fixed for a given radionuclide. The number
    $\ln 2$ is about 0.693, so the half-life is roughly seven tenths of the reciprocal of the
    decay constant. For long-lived isotopes the half-life is usually quoted in years and the decay
    constant in reciprocal years; the product of the two keeps the same value whatever the time
    unit.

    The formula comes from the exponential decay law. Setting the number of remaining nuclei equal
    to half of the initial number cancels the initial number, leaves one half equal to the
    exponential of minus the decay constant times the half-life, and taking logarithms gives the
    result. A large decay constant therefore means a short half-life, and a small one a long
    half-life.

    The relation is exact for any radionuclide that follows the exponential law, which holds for
    large populations of nuclei. The half-life is not the mean lifetime of a nucleus, which equals
    one over the decay constant and exceeds the half-life by a factor of about 1.44. The two are
    easily confused, since both are times that describe the same decay, but the half-life is always
    the shorter of the two.

    Tables of nuclides list half-lives, so the formula is the usual first step of a decay or
    activity calculation. Strontium-90, with a half-life of 28.8 years, has a decay constant of
    about $7.6\times10^{-10}\,\mathrm{s^{-1}}$.
