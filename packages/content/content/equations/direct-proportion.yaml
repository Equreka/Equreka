description:
  en: >-
    Direct proportion, or direct variation, is the relation between two quantities whose ratio stays
    constant: when one is multiplied by some factor, the other is multiplied by the same factor. One
    quantity equals a fixed number, the constant of proportionality, times the other, and the graph
    of the relation is a straight line through the origin.

    In the formula, $\var{x}$ is the independent quantity, $\var{y}$ the quantity that depends on
    it, and $\var{k}$ the constant of proportionality, also called the constant of variation, which
    is never zero. Each quantity keeps whatever unit it has, and the unit of $\var{k}$ is the unit
    of $\var{y}$ divided by the unit of $\var{x}$, as in a price per kilogram; written as plain
    numbers, the terms work in any consistent units. A positive constant makes both quantities rise
    together, and a negative one makes one fall as the other rises.

    The constant follows from one known pair of values by dividing $\var{y}$ by $\var{x}$: if
    $\var{y}$ is 20 when $\var{x}$ is 8, the constant is 2.5. Any two pairs of a direct proportion
    then form a proportion, an equation stating that two ratios are equal. Three known values of
    such an equation fix the fourth, the procedure taught as the rule of three.

    The relation requires the line to pass through the origin: it is the slope-intercept form of a
    line with a zero intercept, the constant of proportionality acting as the slope. A taxi fare
    with a fixed starting charge grows with distance but is not proportional to it, since doubling
    the distance does not double the fare. Many physical proportions also hold only over a range,
    such as the stretch of a spring within its elastic limit. A related family of relations makes
    one quantity proportional to a power of another, such as the area of a circle and the square of
    its radius.

    Direct proportion underlies unit prices, recipes scaled to more servings, map scales, currency
    exchange and unit conversion. On a map where half an inch stands for 3 miles, 2.25 inches stand
    for 13.5 miles.
