name:
  en: 'Electrical energy at constant power'
kind: 'formula'
level: 'intro'
expression: '\mag{E}=\mag{P}\mag{t}'
terms:
  E:
    kind: 'magnitude'
    ref: 'energy'
  P:
    kind: 'magnitude'
    ref: 'power'
  t:
    kind: 'magnitude'
    ref: 'time'
solutions:
  E: 'P * t'
  P: 'E / t'
  t: 'E / P'
