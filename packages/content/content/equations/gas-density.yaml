description:
  en: >-
    The density of an ideal gas equals its pressure times its molar mass, divided by the molar gas
    constant times its absolute temperature. This gas density formula, a rearrangement of the ideal
    gas law, gives the mass per unit volume of a gas from conditions that are easy to measure, and,
    read the other way, finds the molar mass of an unknown gas from a density measurement.

    $\mag{\rho}$ is the density, in kilograms per cubic metre, which is numerically the same as
    grams per litre. $\mag{p}$ is the absolute pressure in pascals. $\mag{M}$ is the molar mass in
    kilograms per mole; a table value of 28.01 grams per mole is 0.02801 kilograms per mole.
    $\const{R}$ is the molar gas constant, about 8.314 joules per mole kelvin and exact in the SI.
    $\mag{T}$ is the thermodynamic temperature in kelvin, never in degrees Celsius: like every gas
    law, the formula needs the absolute temperature. All quantities are positive.

    Density is mass over volume. The ideal gas law gives the volume of one mole as the gas constant
    times the temperature over the pressure, and one mole has a mass equal to the molar mass;
    dividing the second by the first gives the formula. A gas therefore grows denser when it is
    compressed or cooled, and at the same temperature and pressure a heavier molecule makes a denser
    gas, which is why hot air rises and a balloon of a light gas floats.

    The formula assumes ideal behaviour, which holds well at low pressure and well above the
    temperature at which the gas condenses; at high pressure the measured density departs from the
    prediction.

    Avogadro's 1811 hypothesis implied that two gases under the same conditions have densities in
    the ratio of their molecular masses. Nitrogen, 28.01 grams per mole, at 1.00 atmosphere and 273
    kelvin has a density of about 1.25 kilograms per cubic metre.
