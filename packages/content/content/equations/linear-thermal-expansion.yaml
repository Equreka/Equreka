name:
  en: 'Linear thermal expansion'
kind: 'formula'
level: 'intro'
expression: '\var{\Delta L}=\mag{\alpha}\var{L_{0}}\var{\Delta T}'
terms:
  \Delta L:
    kind: 'symbol'
    label:
      en: 'Change in length'
    unit: 'metre'
  \alpha:
    kind: 'magnitude'
    ref: 'linear-expansion-coefficient'
  L_{0}:
    kind: 'symbol'
    label:
