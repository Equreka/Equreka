description:
  en: >-
    Linear thermal expansion is the change in length of a solid when its temperature changes: the
    change equals the linear expansion coefficient of the material times the original length times
    the temperature change. Part of thermodynamics and of materials engineering, the relation
    explains why rails, bridges, pipelines and overhead cables grow longer in summer and shorter in
    winter.

    $\var{\Delta L}$ is the change in length, in metres, positive for a lengthening and negative for
    a shortening. $\mag{\alpha}$ is the linear expansion coefficient of the material, in reciprocal
    kelvin; typical values are 12 millionths per kelvin for steel, 17 for copper and 25 for
    aluminium. $\var{L_{0}}$ is the length before the temperature change, in metres. $\var{\Delta
    T}$ is the final temperature minus the initial one. A temperature difference has the same value
    in kelvin and in degrees Celsius, so a coefficient per degree Celsius carries the same number.

    Heating raises the kinetic energy of the particles of a solid, and the average distance between
    them grows. The change is proportional to the original length, so the fractional change, the
    change divided by the original length, depends only on the material and on the warming. Every
    dimension of the body grows by that same fraction, including the diameter of a hole drilled in a
    plate, which widens as if the removed metal were still in place.

    The relation is a linear approximation, accurate for small temperature changes because the
    coefficient itself drifts slightly with temperature; an average coefficient extends it to larger
    changes for most practical purposes. It assumes an isotropic solid that is free to expand. If
    the body is held fixed, it develops thermal stress instead, which can crack concrete or buckle
    tracks. Liquids have no length of their own, so for them only volume expansion is defined.

    Expansion joints in bridges leave room for this change: a steel span 1275 metres long lengthens
    by about 0.84 metres over a temperature change of 55 degrees Celsius.
