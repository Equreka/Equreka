name:
  en: 'Illuminance of an evenly lit surface'
kind: 'formula'
level: 'intro'
expression: '\mag{E_\mathrm{v}}=\frac{\mag{\Phi_\mathrm{v}}}{\mag{A}}'
terms:
  E_\mathrm{v}:
    kind: 'magnitude'
    ref: 'illuminance'
  \Phi_\mathrm{v}:
    kind: 'magnitude'
    ref: 'luminous-flux'
