description:
  en: >-
    The nuclear binding energy of a nucleus equals its mass defect multiplied by the square of the
    speed of light. The binding energy is the energy needed to pull a nucleus fully apart into its
    separate protons and neutrons, equal to the energy released when those nucleons come together;
    the mass defect is the mass that the nucleus lacks compared with its free nucleons.

    Here $\var{E_\mathrm{b}}$ is the binding energy, in joules, though nuclear physics usually
    quotes it in megaelectronvolts, which are also accepted. $\var{\Delta m}$ is the mass defect, in
    kilograms, or in daltons for atomic-scale masses: the number of protons times the proton mass,
    plus the number of neutrons times the neutron mass, minus the mass of the nucleus. The constant
    $\const{c}$ is the speed of light in vacuum. For every nucleus of more than one nucleon both
    variables are positive.

    The formula applies mass-energy equivalence to the nucleus. Building a nucleus from free
    nucleons releases energy, and the departing energy carries mass away with
    it, so the bound nucleus weighs less than its parts. One dalton of mass defect corresponds to
    931.494 103 72 megaelectronvolts, the CODATA 2022 value, which is why mass defects measured in
    daltons convert readily to energies in megaelectronvolts.

    Dividing the binding energy by the number of nucleons gives the binding energy per nucleon,
    typically between 6 and 10 megaelectronvolts with an average near 8, and largest close to iron
    with mass number 56. Fusing light nuclei or splitting heavy ones moves towards that maximum and
    releases energy. Because the mass defect is a small difference between nearly equal masses,
    those masses must be known to many significant figures for the result to be meaningful.

    The deuteron, one proton bound to one neutron, has a binding energy of about 2.22
    megaelectronvolts, the CODATA 2022 proton and neutron mass energies minus the deuteron mass
    energy, so breaking it apart needs over two million electronvolts.
