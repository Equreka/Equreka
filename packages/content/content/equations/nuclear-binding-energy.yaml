  - title: 'NIST, CODATA 2022 value: atomic mass constant energy equivalent in MeV'
    url: 'https://physics.nist.gov/cgi-bin/cuu/Value?muc2mev'
  - title: 'NIST, CODATA 2022 value: proton mass energy equivalent in MeV'
    url: 'https://physics.nist.gov/cgi-bin/cuu/Value?mpc2mev'
  - title: 'NIST, CODATA 2022 value: neutron mass energy equivalent in MeV'
    url: 'https://physics.nist.gov/cgi-bin/cuu/Value?mnc2mev'
  - title: 'NIST, CODATA 2022 value: deuteron mass energy equivalent in MeV'
    url: 'https://physics.nist.gov/cgi-bin/cuu/Value?mdc2mev'
  - title: 'NIST, CODATA 2022 value: speed of light in vacuum'
