name:
  en: 'Partial pressure from mole fraction'
kind: 'formula'
level: 'intro'
expression: '\var{p_\mathrm{A}}=\var{x_\mathrm{A}}\var{p_\mathrm{total}}'
terms:
  p_\mathrm{A}:
    kind: 'symbol'
    label:
      en: 'Partial pressure of gas A'
    unit: 'pascal'
  x_\mathrm{A}:
    kind: 'symbol'
    label:
      en: 'Mole fraction of gas A'
  p_\mathrm{total}:
    kind: 'symbol'
    label:
      en: 'Total pressure'
    unit: 'pascal'
solutions:
  p_\mathrm{A}: 'x_A * p_total'
  x_\mathrm{A}: 'p_A / p_total'
  p_\mathrm{total}: 'p_A / x_A'
calculator:
  enabled: true
categories:
  - 'chemistry'
branches:
