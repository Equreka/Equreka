references:
  - title: 'OpenStax, University Physics Volume 1, 15.2 Energy in Simple Harmonic Motion (Equation 15.12)'
    url: 'https://openstax.org/books/university-physics-volume-1/pages/15-2-energy-in-simple-harmonic-motion'
