name:
  en: 'Total energy in simple harmonic motion'
kind: 'formula'
level: 'intermediate'
expression: '\var{E}=\frac{1}{2}\var{k}\var{A}^{2}'
terms:
  E:
    kind: 'symbol'
    label:
      en: 'Total mechanical energy of the oscillator'
    unit: 'joule'
  k:
    kind: 'symbol'
    label:
      en: 'Spring constant'
    unit: 'newton-per-metre'
  A:
    kind: 'symbol'
    label:
      en: 'Amplitude'
    unit: 'metre'
solutions:
  E: 'k * A^2 / 2'
  k: '2 * E / A^2'
  A: 'sqrt(2 * E / k)'
calculator:
  enabled: true
categories:
