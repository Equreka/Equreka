description:
  en: >-
    The total energy in simple harmonic motion is the constant mechanical energy of an undamped
    oscillator: half the spring constant times the square of the amplitude. For a mass on a spring
    it is the sum of the kinetic energy of the body and the elastic potential energy stored in the
    spring, a sum that stays fixed while the two parts trade energy back and forth twice per cycle.

    Here $\var{E}$ is the total mechanical energy in joules, never negative; $\var{k}$ is the
    spring constant in newtons per metre, the force needed per metre of stretch; and $\var{A}$ is
    the amplitude in metres, the largest displacement from the equilibrium position. Solving for
    the amplitude takes the non-negative square root, because an amplitude is a length.

    At either extreme the body stops for an instant, so all of the energy sits in the spring as
    elastic potential energy, half the spring constant times the amplitude squared. At the
    equilibrium position the spring is relaxed and all of it is kinetic, half the mass times the
    maximum speed squared. Inserting the displacement and velocity of simple harmonic motion into
    the sum of the two energies, and using the square of the angular frequency equal to the spring
    constant over the mass, makes the cosine-squared and sine-squared terms add to one, so the
    total is the same at every instant. The relation therefore connects the elastic
    potential energy of a spring with the maximum speed.

    Energy is conserved only without friction or air resistance; a damped oscillator loses energy
    and its amplitude decays. The result needs a linear restoring force, so it fails for springs
    stretched beyond the range of Hooke's law. Because the energy grows with the square of the
    amplitude, doubling the amplitude stores four times as much energy.

    A spring of 32.0 newtons per metre set oscillating with an amplitude of 0.100 metres holds a
    total energy of 0.160 joules.
