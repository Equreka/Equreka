description:
  en: >-
    The photon momentum formula states that a photon carries a linear momentum equal to the Planck
    constant divided by its wavelength. Although a photon has no mass, it pushes on whatever absorbs
    or reflects it, and this formula, a result of modern physics and special relativity, gives the
    size of that push for a single quantum of light.

    Here $\mag{p}$ is the magnitude of the momentum of the photon, in kilogram metres per second,
    and $\mag{\lambda}$ is its wavelength in vacuum, in metres. The constant $\const{h}$ is the
    Planck constant, exactly $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$. The formula gives a
    non-negative size only: the momentum points along the direction in which the photon travels,
    and that direction has to be stated separately.

    Special relativity links the energy, momentum and rest mass of any particle. Setting the rest
    mass to zero leaves a momentum equal to the energy divided by the speed of light, and the photon
    energy, Planck constant times speed of light over wavelength, then reduces to this formula.
    Shorter wavelengths therefore mean larger momenta, the same trend as the photon energy.

    The relation holds for every photon in vacuum. A single photon of visible light carries only
    about $10^{-27}\,\mathrm{kg\,m/s}$, so the pressure of ordinary light goes unnoticed in daily
    life, but it becomes measurable for intense beams and over long times, and it helps shape the
    tails of comets. The same expression, read as wavelength equals Planck constant over momentum,
    is the de Broglie relation for particles with mass.

    Arthur Compton explained in 1923 why X-rays scattered by graphite come out with longer
    wavelengths, treating each scattering as a collision in which the photon hands energy and
    momentum to an electron; the match with the measured shifts persuaded physicists that light can
    act as a stream of particles carrying momentum. A photon
    of wavelength 500 nanometres has a momentum of $1.33\times10^{-27}\,\mathrm{kg\,m/s}$.
