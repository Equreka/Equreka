name:
  en: 'Slope-intercept form'
kind: 'equation'
level: 'intro'
expression: '\var{y}=\var{m}\var{x}+\var{b}'
terms:
  y:
    kind: 'symbol'
    label:
      en: 'Dependent variable'
  m:
    kind: 'symbol'
    label:
      en: 'Slope'
  x:
    kind: 'symbol'
    label:
      en: 'Independent variable'
  b:
    kind: 'symbol'
    label:
      en: 'y-intercept'
solutions:
  y: 'm * x + b'
  m: '(y - b) / x'
  x: '(y - b) / m'
  b: 'y - m * x'
calculator:
  enabled: true
categories:
