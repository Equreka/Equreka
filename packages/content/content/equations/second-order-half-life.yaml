name:
  en: 'Half-life of a second-order reaction'
kind: 'formula'
level: 'intermediate'
expression: '\var{t_{1/2}}=\frac{1}{\var{k}\var{c_\mathrm{A,0}}}'
terms:
  t_{1/2}:
    kind: 'symbol'
    label:
      en: 'Half-life'
    unit: 'second'
  k:
    kind: 'symbol'
    label:
      en: 'Rate constant'
    unit: 'cubic-metre-per-mole-second'
  c_\mathrm{A,0}:
    kind: 'symbol'
    label:
      en: 'Initial concentration of A'
    unit: 'mole-per-cubic-metre'
    identifier: 'c_A0'
solutions:
  t_{1/2}: '1 / (k * c_A0)'
  k: '1 / (t_12 * c_A0)'
  c_\mathrm{A,0}: '1 / (k * t_12)'
calculator:
  enabled: true
categories:
