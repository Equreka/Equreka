name:
  en: 'Kinetic energy in terms of momentum'
kind: 'formula'
level: 'intermediate'
expression: '\mag{E_\mathrm{k}}=\frac{\mag{p}^{2}}{2\mag{m}}'
terms:
  E_\mathrm{k}:
    kind: 'magnitude'
    ref: 'kinetic-energy'
  p:
    kind: 'magnitude'
    ref: 'momentum'
  m:
    kind: 'magnitude'
    ref: 'mass'
