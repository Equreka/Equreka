description:
  en: >-
    The kinetic energy of a body can be written in terms of its momentum instead of its speed: it
    equals the square of the momentum divided by twice the mass. The form is standard in collision
    problems, where momentum is the conserved quantity, and in atomic and particle physics, where an
    accelerating voltage fixes the kinetic energy and the momentum sets the de Broglie wavelength.

    In the formula, $\mag{E_\mathrm{k}}$ is the kinetic energy in joules, $\mag{p}$ the momentum in
    kilogram metres per second, and $\mag{m}$ the mass in kilograms. Momentum is signed along a
    chosen axis, positive in the chosen direction, while kinetic energy and mass are never negative;
    because the momentum appears squared, a body moving either way along the axis has the same
    kinetic energy. Solving for the momentum therefore gives a positive root, listed first, and a
    negative root of the same size for motion in the opposite sense.

    The relation follows from substituting the speed, momentum divided by mass, into the usual
    expression of kinetic energy as half the mass times the speed squared. Read the other way, two
    bodies carrying equal momentum do not carry equal kinetic energy: the lighter one has more, in
    inverse proportion to the mass. This is why, when a gun fires, the light bullet takes almost all
    the kinetic energy while the gun and the bullet share equal and opposite momenta. Doubling the
    momentum of a given body quadruples its kinetic energy.

    The formula is Newtonian and holds only at speeds well below the speed of light. At relativistic
    speeds the kinetic energy and momentum are related through the rest energy of the body, and the
    quadratic form understates the momentum needed for a given energy. It applies to
    translation; a spinning body has rotational kinetic energy in addition, not included here.

    An electron accelerated from rest through 54 volts gains 54 electronvolts of kinetic energy and
    a momentum of about $3.97\times10^{-24}\,\mathrm{kg\,m/s}$.
