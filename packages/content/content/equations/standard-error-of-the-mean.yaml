description:
  en: >-
    The standard error of the mean measures how much the mean of a random sample is expected to vary
    from one sample to the next: it is the population standard deviation over the root of the number
    of observations. Abbreviated SE or SEM, it gives the spread of the sample means that repeated
    sampling would produce, the basic yardstick of precision in inferential statistics.

    In the formula, $\var{\mathrm{SE}}$ is the standard error of the mean, $\var{\sigma}$ the
    standard deviation of the individual values and $\var{n}$ the sample size, a positive whole
    number. The standard error and the standard deviation share the unit of the data, which the
    formula leaves open, and neither is ever negative.

    Each observation adds independent random noise to the sample mean, and averaging $\var{n}$ such
    values divides the variance of the mean by $\var{n}$; the square root turns that into the
    division of the standard deviation by the root of $\var{n}$. The standard error therefore falls
    slowly with sample size: halving it takes four times as many observations. Solving for the
    sample size from a target standard error gives the square of the ratio of the two spreads,
    rounded up to the next whole number in practice.

    The formula assumes independent observations drawn at random from one population, as in a simple
    random sample; when successive observations are correlated the true spread of the mean differs
    from this value, larger or smaller depending on the sign of the correlation. The
    population standard deviation is rarely known, so the sample standard deviation
    usually takes its place, which makes the result an estimate. By the central limit theorem the
    sample mean is close to normally distributed for large samples, so the standard error sets the
    width of confidence intervals and the scale of tests on a mean.

    Reports of measurements and survey results quote it beside the mean. For a population with a
    standard deviation of 15, samples of 25 values give a standard error of 3.
