name:
  en: 'Area of a triangle from two sides and the included angle'
kind: 'formula'
level: 'intro'
expression: '\mag{A}=\frac{1}{2}\var{a}\var{b}\sin\mag{\gamma}'
terms:
  A:
    kind: 'magnitude'
    ref: 'area'
  a:
    kind: 'symbol'
