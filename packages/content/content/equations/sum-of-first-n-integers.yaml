name:
  en: 'Sum of the first n positive integers'
kind: 'formula'
level: 'intro'
expression: '\var{S_{n}}=\frac{\var{n}\left(\var{n}+1\right)}{2}'
terms:
  S_{n}:
    kind: 'symbol'
    label:
      en: 'Sum of the first n integers'
  n:
    kind: 'symbol'
    label:
      en: 'Number of integers'
    integer: true
solutions:
  S_{n}: 'n * (n + 1) / 2'
  n:
    - '(sqrt(8 * S_n + 1) - 1) / 2'
    - '-(sqrt(8 * S_n + 1) + 1) / 2'
