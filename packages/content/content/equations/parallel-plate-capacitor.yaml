references:
  - title: 'OpenStax, University Physics Volume 2, 8.1 Capacitors and Capacitance (Examples 8.1 and 8.2)'
    url: 'https://openstax.org/books/university-physics-volume-2/pages/8-1-capacitors-and-capacitance'
