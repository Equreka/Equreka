description:
  en: >-
    The capacitance of a parallel-plate capacitor in vacuum equals the vacuum electric permittivity
    times the area of one plate, divided by the gap between the plates. Two flat conducting plates
    facing each other across a narrow gap form the simplest capacitor to analyse, so this result is
    the standard first model of a capacitor in electrostatics and circuit design.

    $\mag{C}$ is the capacitance in farads, $\mag{A}$ the area of each plate in square metres, and
    $\var{d}$ the separation between the plates in metres; all three are positive.
    $\const{\varepsilon_{0}}$ is the vacuum electric permittivity, a measured constant whose
    CODATA 2022 value is about $8.854\times10^{-12}\,\mathrm{F/m}$. The capacitance depends only on
    this geometry, not on the charge stored or on the voltage applied.

    Equal and opposite charges spread over the inner faces of the plates and set up a nearly
    uniform field between them, equal to the charge per unit area divided by the permittivity. The
    voltage across the gap is that field times the separation, so the charge divided by the voltage
    leaves the permittivity times the area over the gap. Wider plates hold more charge at a given
    voltage, and bringing the plates closer lets the same voltage hold more charge as well.

    The formula assumes a gap that is small compared with the size of the plates, so that the
    weaker, bulging field near the edges can be neglected. Filling the gap with an insulator
    multiplies the capacitance by its dielectric constant $\kappa$, which is one for vacuum, close
    to one for air and greater than one for every material medium.

    Two plates of 1.00 square metre each, 1.00 mm apart in vacuum, have a capacitance of about
    8.85 nF, so a capacitance of one farad at that spacing would need square plates roughly ten
    kilometres on a side.
