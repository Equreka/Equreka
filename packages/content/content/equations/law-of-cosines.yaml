description:
  en: >-
    The law of cosines relates the three sides of a triangle to one of its angles: the side facing
    the angle, squared, equals the Pythagorean total of the two enclosing sides, reduced by twice
    the product of those two sides multiplied by the cosine of the angle. Also called the cosine
    rule, it extends the Pythagorean theorem to triangles of any shape and solves
    a triangle when two sides and the included angle, or all three sides, are known.

    In the equation, $\var{a}$ and $\var{b}$ are the two sides that enclose the angle
    $\mag{\gamma}$, and $\var{c}$ is the side facing that angle. The sides are positive lengths in
    metres or in any shared unit; the angle, in radians, lies strictly between zero and a straight
    angle. Its cosine is positive for an acute angle, zero for a right angle and negative for an
    obtuse one, so the last term shortens $\var{c}$ below the Pythagorean value when the angle is
    acute and lengthens it when the angle is obtuse.

    For a right angle the cosine vanishes and the Pythagorean theorem remains. To derive the law,
    place the vertex of the angle at the origin with one side along the horizontal axis; the free
    end of the other side then has coordinates given by its length times the cosine and the sine of
    the angle, and the distance between the two free vertices, squared, yields the law once the
    squares of sine and cosine are added to one.

    Solving for the angle uses the inverse cosine and gives one angle, because the cosine takes each
    value once between zero and a straight angle; three lengths that break the triangle inequality
    give no real angle. Solving for one enclosing side leads to a quadratic with two roots, listed
    with the larger first. Each root is a side length only when it is positive: in the ambiguous
    case both can be, and a negative result means that no triangle fits the data. The law holds in
    the flat plane.

    Euclid's Elements states geometric versions in Book II, Propositions 12 and 13, phrased with
    areas of rectangles. Sides of 8 and 10 units enclosing 160 degrees leave a third side of about
    17.7 units.
