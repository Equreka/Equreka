name:
  en: 'Law of cosines'
kind: 'equation'
level: 'intro'
expression: '\var{c}^{2}=\var{a}^{2}+\var{b}^{2}-2\var{a}\var{b}\cos\mag{\gamma}'
terms:
  c:
    kind: 'symbol'
    label:
      en: 'Side c'
    unit: 'metre'
  a:
    kind: 'symbol'
    label:
      en: 'Side a'
    unit: 'metre'
  b:
    kind: 'symbol'
    label:
      en: 'Side b'
    unit: 'metre'
  \gamma:
    kind: 'magnitude'
    ref: 'plane-angle'
solutions:
  c: 'sqrt(a^2 + b^2 - 2 * a * b * cos(gamma))'
  \gamma: 'acos((a^2 + b^2 - c^2) / (2 * a * b))'
  a:
    - 'b * cos(gamma) + sqrt(c^2 - b^2 * sin(gamma)^2)'
    - 'b * cos(gamma) - sqrt(c^2 - b^2 * sin(gamma)^2)'
  b:
    - 'a * cos(gamma) + sqrt(c^2 - a^2 * sin(gamma)^2)'
    - 'a * cos(gamma) - sqrt(c^2 - a^2 * sin(gamma)^2)'
