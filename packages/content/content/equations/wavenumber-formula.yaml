description:
  en: >-
    The wavenumber from the wavelength is the defining relation of the wavenumber: one divided by
    the wavelength, which counts how many whole wavelengths of a wave fit into one metre. Physics,
    optics and spectroscopy use it to say how finely a wave is divided in space, and infrared and
    Raman spectra are plotted against wavenumber, usually in reciprocal centimetres.

    Here $\mag{\sigma}$ is the wavenumber in reciprocal metres and $\mag{\lambda}$ is the
    wavelength in metres, the distance between two neighbouring crests. Both are positive. ISO
    80000-3 writes the wavenumber with sigma and allows nu with a tilde; the IUPAC Green Book keeps
    nu with a tilde for the wavenumber in vacuum, the form used in spectroscopy, and sigma for the
    wavenumber in a medium. The SI Brochure gives the reciprocal metre as its coherent unit; one
    reciprocal centimetre equals 100 reciprocal metres.

    Wavelength and wavenumber hold the same information in reciprocal form: halving the wavelength
    doubles the wavenumber. For light in vacuum the wavenumber also equals the frequency divided by
    the speed of light, so it rises in proportion to the photon energy, which is why spectral lines
    are so often labelled by it rather than by wavelength.

    The relation is a definition and holds for any periodic wave, but two cautions apply. Many
    physics textbooks, OpenStax among them, give the name wave number and the symbol k to the
    angular wavenumber, two pi divided by the wavelength, measured in radians per metre; that
    quantity is larger by a factor of two pi and is the one that sits beside the angular frequency
    in the function of a travelling wave. And because light shortens its wavelength inside a
    medium, the wavenumber quoted for a spectral line normally refers to the wavelength in vacuum,
    as the Green Book notes.

    A wavelength of 10 micrometres, in the thermal infrared, corresponds to 100 000 reciprocal
    metres, or 1000 reciprocal centimetres; a sound wave 2 metres long has a wavenumber of 0.5
    reciprocal metres.
