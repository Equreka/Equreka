name:
  en: 'Markup and discount'
kind: 'formula'
level: 'intro'
expression: '\var{p}=\var{c}\left(1+\var{m}\right)\left(1-\var{d}\right)'
terms:
  p:
    kind: 'symbol'
    label:
      en: 'Final price'
  c:
    kind: 'symbol'
    label:
      en: 'Cost or original price'
  m:
    kind: 'symbol'
    label:
      en: 'Markup rate (as a fraction)'
  d:
    kind: 'symbol'
    label:
      en: 'Discount rate (as a fraction)'
solutions:
  p: 'c * (1 + m) * (1 - d)'
  c: 'p / ((1 + m) * (1 - d))'
  m: 'p / (c * (1 - d)) - 1'
  d: '1 - p / (c * (1 + m))'
calculator:
  enabled: true
categories:
  - 'mathematics'
branches:
  - 'arithmetic'
