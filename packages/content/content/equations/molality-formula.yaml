name:
  en: 'Molality of a solution'
kind: 'formula'
level: 'intro'
expression: '\mag{b}=\frac{\mag{n}}{\var{m_\mathrm{solvent}}}'
terms:
  b:
    kind: 'magnitude'
    ref: 'molality'
  n:
    kind: 'magnitude'
    ref: 'substance'
  m_\mathrm{solvent}:
    kind: 'symbol'
    label:
      en: 'Mass of the solvent'
    unit: 'kilogram'
solutions:
  b: 'n / m_solvent'
  n: 'b * m_solvent'
  m_\mathrm{solvent}: 'n / b'
calculator:
  enabled: true
categories:
  - 'chemistry'
branches:
  - 'solutions'
aliases:
  - 'molality formula'
  - 'molal concentration'
  - 'moles per kilogram of solvent'
  - 'b = n / m'
