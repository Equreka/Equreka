description:
  en: >-
    Henry's law states that the concentration of a gas dissolved in a liquid at equilibrium is
    proportional to the partial pressure of that gas above the liquid. In solution chemistry and
    atmospheric science it governs how much oxygen, carbon dioxide or a pollutant a body of water
    takes up, and how that amount follows the pressure of the gas above it.

    $\mag{c}$ is the amount concentration of the dissolved gas, in moles per cubic metre with moles
    per litre offered. $\var{p_\mathrm{gas}}$ is the partial pressure of the gas in the phase above
    the liquid, in pascals. $\var{k_\mathrm{H}}$ is the Henry's law constant in its solubility form,
    in moles per cubic metre and pascal, with moles per litre and atmosphere offered; it depends on
    the gas, the solvent and the temperature, and for oxygen it falls as the water warms.

    The constant has several conventions, and their values cannot be compared without them. This
    form, concentration over pressure, is the one Rolf Sander's compilation uses; many engineering
    and physical chemistry texts define the inverse, pressure over concentration or over mole
    fraction, which the IUPAC Green Book calls the Henry's law constant and measures in pascals,
    and a dimensionless form compares the concentrations in the two phases. A volatility constant
    is large where a solubility constant is small.

    The law holds in the limit of dilute solutions and for gases that do not react with the
    solvent; at high pressures or concentrations the proportionality fails. Gases that react with
    water, such as ammonia, dissolve more than it predicts. Sander's compilation leaves out values
    obtained well above 1000 hectopascals or above 373 kelvin.

    William Henry reported the measurements behind the law in 1803, from experiments on how much
    gas water absorbs at different temperatures and pressures. Sander
    gives oxygen in water at 298.15 kelvin a constant of $1.3\times10^{-5}$ moles per cubic metre
    and pascal, so an oxygen partial pressure of 20 kilopascals dissolves about 0.26 moles per
    cubic metre, or $2.6\times10^{-4}$ moles per litre.
