name:
  en: 'Continuity equation'
kind: 'equation'
level: 'intro'
expression: '\var{A_{1}}\var{v_{1}}=\var{A_{2}}\var{v_{2}}'
terms:
  A_{1}:
    kind: 'symbol'
    label:
      en: 'Cross-sectional area at section 1'
    unit: 'square-metre'
  v_{1}:
    kind: 'symbol'
    label:
      en: 'Flow speed at section 1'
    unit: 'metre-per-second'
  A_{2}:
    kind: 'symbol'
    label:
      en: 'Cross-sectional area at section 2'
    unit: 'square-metre'
  v_{2}:
    kind: 'symbol'
    label:
      en: 'Flow speed at section 2'
    unit: 'metre-per-second'
solutions:
  A_{1}: 'A_2 * v_2 / v_1'
  v_{1}: 'A_2 * v_2 / A_1'
  A_{2}: 'A_1 * v_1 / v_2'
  v_{2}: 'A_1 * v_1 / A_2'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'fluid-mechanics'
aliases:
  - 'equation of continuity'
  - 'continuity equation for incompressible flow'
  - 'A1 v1 = A2 v2'
  - 'conservation of mass in fluid flow'
  - 'ecuación de continuidad'
