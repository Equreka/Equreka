    url: 'https://chem.libretexts.org/Bookshelves/General_Chemistry/Chem1_(Lower)/13:_Acid-Base_Equilibria/13.03:_Finding_the_pH_of_weak_Acids_Bases_and_Salts'
  - title: 'IUPAC, Quantities, Units and Symbols in Physical Chemistry, 3rd ed. (Green Book), section 2.11.1 (v) (standard concentration)'
    url: 'https://iupac.org/wp-content/uploads/2019/05/IUPAC-GB3-2012-2ndPrinting-PDFsearchable.pdf'
description:
  en: >-
    The pH of a weak acid solution follows, to a good approximation, from the pKa of the acid and its
    concentration: it is half of the pKa minus the base-ten logarithm of the concentration in moles
    per litre. This shortcut of acid-base chemistry is the logarithmic form of the rule that the
    hydrogen ion concentration is the square root of the acid dissociation constant times the acid
    concentration.

    $\mag{\mathrm{pH}}$ is the pH of the solution and $\var{\mathrm{p}K_\mathrm{a}}$ the pKa of the
    acid, both pure numbers. $\var{c_\mathrm{a}}$ is the analytical concentration of the acid, the
    amount of acid put into the solution per unit volume whether or not it has ionized, usually
    entered in moles per litre. $\const{c^{\circ}}$ is the standard amount concentration, exactly one
    mole per litre, which makes the argument of the logarithm a pure number.

    Each acid molecule that ionizes gives one hydronium ion and one conjugate base ion, so the two
    concentrations are equal. When only a small share ionizes, the acid left intact is almost the
    whole analytical concentration, and the acid dissociation constant reduces to the square of the
    hydronium concentration over that concentration. Taking minus the logarithm of the square root
    gives the formula: diluting a weak acid tenfold raises its pH by only half a unit.

    The approximation holds while the fraction ionized stays below about 5 percent of the
    analytical concentration, which is the usual check; beyond that the full quadratic must be
    solved. It also fails for very weak or very dilute acids, where the hydronium from water itself
    is no longer negligible, and it assumes concentrations can stand in for activities.

    A 0.534 mol/L solution of formic acid, whose acid dissociation constant is
    $1.8\times10^{-4}$, has a pH of 2.01.
