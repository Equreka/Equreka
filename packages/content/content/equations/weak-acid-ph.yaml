name:
  en: 'pH of a weak acid solution'
kind: 'formula'
level: 'intermediate'
expression: '\mag{\mathrm{pH}}=\frac{1}{2}\left(\var{\mathrm{p}K_\mathrm{a}}-\log_{10}\left(\frac{\var{c_\mathrm{a}}}{\const{c^{\circ}}}\right)\right)'
terms:
  \mathrm{pH}:
    kind: 'magnitude'
    ref: 'ph'
  \mathrm{p}K_\mathrm{a}:
    kind: 'symbol'
    label:
      en: 'pKa of the acid'
    identifier: 'pK_a'
  c_\mathrm{a}:
    kind: 'symbol'
    label:
      en: 'Analytical concentration of the acid'
    unit: 'mole-per-cubic-metre'
  c^{\circ}:
    kind: 'constant'
    ref: 'standard-amount-concentration'
    identifier: 'c_std'
solutions:
  \mathrm{pH}: '(pK_a - log10(c_a / c_std)) / 2'
  \mathrm{p}K_\mathrm{a}: '2 * pH + log10(c_a / c_std)'
  c_\mathrm{a}: 'c_std * 10^(pK_a - 2 * pH)'
