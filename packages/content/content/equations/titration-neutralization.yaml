description:
  en: >-
    The acid-base titration equation relates the concentrations and volumes of an acid and a base
    that have exactly neutralized each other at the equivalence point. Weighted by the coefficients
    of the balanced neutralization reaction, it is the working rule of volumetric analysis for
    finding an unknown concentration from the volume of a standard solution added from a burette.

    $\var{c_\mathrm{a}}$ and $\var{V_\mathrm{a}}$ are the amount concentration and the volume of the
    acid solution, and $\var{c_\mathrm{b}}$ and $\var{V_\mathrm{b}}$ those of the base solution;
    concentrations are stored in moles per cubic metre and volumes in cubic metres, though moles per
    litre with millilitres serve as long as both sides use the same units. $\var{\nu_\mathrm{a}}$
    and $\var{\nu_\mathrm{b}}$ are the whole-number coefficients of the acid and the base in the
    reaction. All six are positive.

    Each concentration times its volume is an amount in moles. At the equivalence point the amounts
    that have reacted stand in the ratio of the coefficients, so the amount of acid divided by its
    coefficient equals the amount of base divided by its own, and clearing the fractions gives the
    equation. When both coefficients are one, as for hydrochloric acid with sodium hydroxide, it
    reduces to the short form in which concentration times volume is equal on both sides. That short
    form fails for other ratios: sulfuric acid needs two moles of sodium hydroxide per mole.

    The equation assumes a single reaction that goes to completion with known coefficients, and an
    indicator whose colour change, the end point, falls close enough to the equivalence point.
    Introductory textbooks teach the general stoichiometric route and treat the one-to-one form as a
    special case of it.

    When 26.60 millilitres of sulfuric acid are neutralized by 32.20 millilitres of sodium hydroxide
    at 0.250 moles per litre, the acid concentration is 0.151 moles per litre.
