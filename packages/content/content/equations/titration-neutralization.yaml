name:
  en: 'Acid-base titration equation'
kind: 'equation'
level: 'intro'
expression: '\var{c_\mathrm{a}}\var{V_\mathrm{a}}\var{\nu_\mathrm{b}}=\var{c_\mathrm{b}}\var{V_\mathrm{b}}\var{\nu_\mathrm{a}}'
terms:
  c_\mathrm{a}:
    kind: 'symbol'
    label:
      en: 'Concentration of the acid'
    unit: 'mole-per-cubic-metre'
  V_\mathrm{a}:
    kind: 'symbol'
    label:
      en: 'Volume of the acid solution'
    unit: 'cubic-metre'
  \nu_\mathrm{b}:
    kind: 'symbol'
    label:
      en: 'Stoichiometric coefficient of the base'
    integer: true
  c_\mathrm{b}:
    kind: 'symbol'
    label:
      en: 'Concentration of the base'
    unit: 'mole-per-cubic-metre'
  V_\mathrm{b}:
    kind: 'symbol'
    label:
      en: 'Volume of the base solution'
    unit: 'cubic-metre'
  \nu_\mathrm{a}:
    kind: 'symbol'
    label:
      en: 'Stoichiometric coefficient of the acid'
    integer: true
solutions:
  c_\mathrm{a}: 'c_b * V_b * nu_a / (V_a * nu_b)'
  V_\mathrm{a}: 'c_b * V_b * nu_a / (c_a * nu_b)'
  \nu_\mathrm{b}: 'c_b * V_b * nu_a / (c_a * V_a)'
  c_\mathrm{b}: 'c_a * V_a * nu_b / (V_b * nu_a)'
  V_\mathrm{b}: 'c_a * V_a * nu_b / (c_b * nu_a)'
  \nu_\mathrm{a}: 'c_a * V_a * nu_b / (c_b * V_b)'
