name:
  en: 'Exponential growth'
kind: 'formula'
level: 'intro'
expression: '\var{N}=\var{N_{0}}\left(1+\var{r}\right)^{\var{t}}'
terms:
  N:
    kind: 'symbol'
    label:
      en: 'Final amount'
  N_{0}:
    kind: 'symbol'
    label:
      en: 'Initial amount'
  r:
    kind: 'symbol'
    label:
      en: 'Growth rate per period (as a fraction)'
  t:
    kind: 'symbol'
    label:
      en: 'Elapsed time in periods'
solutions:
  N: 'N_0 * (1 + r)^t'
  N_{0}: 'N / (1 + r)^t'
  r: '(N / N_0)^(1 / t) - 1'
  t: 'ln(N / N_0) / ln(1 + r)'
