description:
  en: >-
    The luminous efficacy of a light source is the luminous flux it emits divided by the electrical
    power it consumes. Quoted in lumens per watt, it measures how much useful light, as judged by
    the human eye, a lamp delivers for each watt drawn from the supply, and it is the figure used to
    compare incandescent, fluorescent and LED lamps.

    The luminous efficacy of the source $\var{\eta_\mathrm{v}}$ is in lumens per watt; the luminous
    flux $\mag{\Phi_\mathrm{v}}$, the total light output of the lamp, is in lumens; and the power
    $\mag{P}$ is the electrical power consumed, in watts. All three are positive.

    A lamp turns electrical power into radiation, and only part of that radiation is visible; the
    luminous flux then weights the visible part by the sensitivity of the eye, which peaks in the
    green. Heat, infrared and ultraviolet output add to the power consumed but not to the luminous
    flux, which is why a hot filament scores poorly.

    The CIE asks that the power include or exclude auxiliary equipment, such as ballasts and
    drivers, explicitly, since the two choices give different figures. This quantity is distinct
    from the luminous efficacy of radiation, which divides the luminous flux by the radiant power of
    the light itself; a lamp cannot radiate more power than it consumes, so its efficacy never
    exceeds that of its radiation, and no source exceeds 683 lumens per watt, the value for green
    monochromatic light of 540 terahertz. Efficacy also differs from efficiency, which is a pure
    number.

    HyperPhysics gives about 1700 lumens for a typical 100 watt incandescent bulb, an efficacy of
    about 17 lumens per watt.
