description:
  en: >-
    Molarity, also called molar concentration or amount concentration, measures how many moles of a
    solute are present per unit volume of the finished solution. It is the measure of concentration
    used most often in a chemistry laboratory, where it is stated as the moles of dissolved
    substance in each litre of solution.

    $\mag{c}$ is the amount concentration of the solute, $\mag{n}$ its amount of substance and
    $\mag{V}$ the volume of the whole solution, solvent and solute together. The coherent SI unit of
    $\mag{c}$ is the mole per cubic metre, but laboratories state it in $\mathrm{mol/L}$, a thousand
    times larger. All three quantities are positive. NIST considers the name molarity and the symbol
    M for mol/L obsolete.

    Because a mole always holds the same number of entities, two solutions with equal molarity carry
    the same number of solute particles per litre, whatever the solute. Multiplying the
    concentration by a volume therefore counts the moles delivered by that volume, the step behind
    dilution and titration. For a dissolved salt, the concentration of each ion follows from the
    formula unit: one mole per litre of calcium chloride gives two moles per litre of chloride ions.

    The volume is that of the finished solution, which is why it is prepared by filling a volumetric
    flask to its mark rather than by adding a measured volume of solvent. A solution expands as it
    warms while its amount of solute stays the same, so its molarity falls slightly with
    temperature; molality, which uses the mass of the solvent, does not change.

    A 355 mL soft drink with 0.133 mol of sucrose has a sucrose concentration of 0.375 mol/L.
