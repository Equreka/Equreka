name:
  en: 'Half-life of a zero-order reaction'
kind: 'formula'
level: 'intermediate'
expression: '\var{t_{1/2}}=\frac{\var{c_\mathrm{A,0}}}{2\var{k}}'
terms:
  t_{1/2}:
    kind: 'symbol'
    label:
      en: 'Half-life'
    unit: 'second'
  c_\mathrm{A,0}:
    kind: 'symbol'
    label:
      en: 'Initial concentration of A'
    unit: 'mole-per-cubic-metre'
    identifier: 'c_A0'
  k:
    kind: 'symbol'
    label:
      en: 'Rate constant'
    unit: 'mole-per-cubic-metre-second'
solutions:
  t_{1/2}: 'c_A0 / (2 * k)'
  c_\mathrm{A,0}: '2 * k * t_12'
  k: 'c_A0 / (2 * t_12)'
calculator:
  enabled: true
categories:
  - 'chemistry'
branches:
  - 'chemical-kinetics'
aliases:
  - 'zero order half life'
  - 'zero-order half-life'
  - 'half-life of a zeroth-order reaction'
  - 't1/2 = [A]0/2k'
  - 'semivida de orden cero'
references:
  - title: 'OpenStax, Chemistry 2e, 12.4 Integrated Rate Laws, Zero-Order Reactions, Example 12.10 and Table 12.2'
    url: 'https://openstax.org/books/chemistry-2e/pages/12-4-integrated-rate-laws'
  - title: 'IUPAC, Quantities, Units and Symbols in Physical Chemistry, 3rd ed. (Green Book), section 2.12, p. 64, half life'
    url: 'https://iupac.org/wp-content/uploads/2019/05/IUPAC-GB3-2012-2ndPrinting-PDFsearchable.pdf'
description:
  en: >-
    For a reaction of zero order, the half-life, the time in which half of the reactant present at
    the start is consumed, equals the initial concentration divided by twice the rate constant. In
    chemical kinetics it is the half-life of a reaction whose rate does not depend on how much
    reactant remains, such as the decomposition of ammonia on hot tungsten.

    $\var{t_{1/2}}$ is the half-life, in seconds. $\var{c_\mathrm{A,0}}$ is the initial
    concentration of the reactant A, in moles per cubic metre with moles per litre offered, and
    $\var{k}$ the zero-order rate constant, in moles per cubic metre and second with moles per litre
    and second offered; it describes the disappearance of A. All three are positive.

    The formula follows from the zero-order integrated rate law, in which the concentration falls in
    a straight line with time: half of the initial concentration is gone when the rate constant
    times the time equals half the initial value. The half-life is therefore proportional to the
    starting concentration, and it shortens as the reaction proceeds, each successive half-life
    being half as long as the one before.

    This sets zero order apart. A first-order reaction has a constant half-life, the logarithm of two
    over the rate constant, independent of the concentration, while a second-order half-life is
    inversely proportional to it. A half-life that grows with the initial concentration therefore
    points to zero order. Zero-order kinetics appear only under particular conditions: ammonia
    decomposes at zero order on tungsten but at first order on quartz, and outside those conditions
    the formula does not apply.

    Ammonia decomposes on a hot tungsten surface with a rate constant of
    $1.3\times10^{-6}$ moles per litre and second, as OpenStax reports; from an initial
    concentration of 0.0028 moles per litre, half is gone after about 1080 seconds, roughly 18
    minutes.
