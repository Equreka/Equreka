name:
  en: 'Electric field of a point charge'
kind: 'formula'
level: 'intro'
expression: '\mag{E}=\const{k_\mathrm{e}}\frac{\mag{q}}{\var{r}^{2}}'
terms:
  E:
    kind: 'magnitude'
    ref: 'electric-field-strength'
  k_\mathrm{e}:
    kind: 'constant'
    ref: 'coulomb-constant'
  q:
    kind: 'magnitude'
    ref: 'electric-charge'
  r:
    kind: 'symbol'
    label:
      en: 'Distance from the charge'
    unit: 'metre'
