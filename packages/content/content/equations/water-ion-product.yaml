name:
  en: 'Ion product of water'
kind: 'equation'
level: 'intro'
expression: '\var{K_\mathrm{w}}=\frac{\var{[\mathrm{H}^{+}]}\var{[\mathrm{OH}^{-}]}}{\const{c^{\circ}}^{2}}'
terms:
  K_\mathrm{w}:
    kind: 'symbol'
    label:
      en: 'Ion product of water'
  '[\mathrm{H}^{+}]':
    kind: 'symbol'
    label:
      en: 'Hydrogen ion concentration'
    unit: 'mole-per-cubic-metre'
    identifier: 'cH'
  '[\mathrm{OH}^{-}]':
    kind: 'symbol'
    label:
      en: 'Hydroxide ion concentration'
    unit: 'mole-per-cubic-metre'
    identifier: 'cOH'
  c^{\circ}:
    kind: 'constant'
    ref: 'standard-amount-concentration'
    identifier: 'c_std'
solutions:
  K_\mathrm{w}: 'cH * cOH / c_std^2'
  '[\mathrm{H}^{+}]': 'K_w * c_std^2 / cOH'
  '[\mathrm{OH}^{-}]': 'K_w * c_std^2 / cH'
