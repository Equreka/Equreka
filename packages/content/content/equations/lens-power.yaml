description:
  en: >-
    The power of a lens is the reciprocal of its focal length. This optical power, or dioptric
    power, measures how strongly the lens converges or diverges light, and with the focal length in
    metres it comes out in dioptres, the unit of spectacle prescriptions, contact lenses and
    magnifiers.

    Here $\mag{P}$ is the optical power, in dioptres, not a power in watts; where one dioptre is one
    reciprocal metre, and $\var{f}$ is the focal length, in metres. Both carry the sign of the
    real-is-positive convention used for the thin lens equation: a converging lens has a positive
    focal length and a positive power, a diverging lens negative ones.

    A short focal length means rays are bent sharply and brought to a focus close to the lens, so
    the power is large; a weak lens has a long focal length and a power near zero. Writing the thin
    lens equation in terms of power turns the reciprocal of the focal length into a single number
    that eye specialists can add and subtract: two thin lenses in contact have very nearly the sum
    of their powers.

    The formula holds for a thin lens, with the focal length measured from its centre; for a thick
    lens or a system of separated lenses the power is the reciprocal of an equivalent focal length.
    The same definition applies to curved mirrors, a concave mirror having positive power.

    The French ophthalmologist Ferdinand Monoyer proposed the dioptre as the unit of lens power in
    1872. OpenStax gives the power of the human eye as 50.0 to 54.0 dioptres, and a magnifier with a
    focal length of 8.00 centimetres has a power of 12.5 dioptres.
