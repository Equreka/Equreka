name:
  en: 'Average velocity'
kind: 'formula'
level: 'intro'
expression: '\mag{\bar{v}}=\frac{\var{\Delta x}}{\mag{t}}'
terms:
  \bar{v}:
    kind: 'magnitude'
    ref: 'velocity'
    identifier: 'v_avg'
  \Delta x:
    kind: 'symbol'
    label:
