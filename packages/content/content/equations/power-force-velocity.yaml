description:
  en: >-
    The power delivered by a force to a moving body is the force along the direction of motion times
    the speed. It is the instantaneous rate at which the force does work, and it gives the power an
    engine or a cyclist must supply to keep a vehicle moving at a given speed against friction, air
    resistance or a slope.

    In the formula, $\mag{P}$ is the power in watts; $\mag{F}$ is the component of the force along
    the velocity, in newtons, positive when it points in the direction of motion and negative when
    it opposes the motion, as drag and braking forces do; and $\mag{v}$ is the speed in metres per
    second, never negative. A force at right angles to the velocity, such as the normal force on a
    level road, delivers no power, and a negative power means the force is removing energy from the
    body.

    During a short time interval the body moves a distance equal to its speed times the interval, so
    the force does work equal to the force times that distance; dividing that work by the interval
    gives the formula. For a force at an angle to the velocity only the component along the velocity
    counts, which makes the general relation the scalar product of the force and velocity vectors.

    The formula gives the power at one instant and holds even while the speed changes; averaged over
    an interval it gives the work done divided by the time. At constant speed on level ground the
    driving force equals the total resistance, and because air drag grows with speed, the power a
    car needs rises steeply at motorway speeds. For the same reason an engine of limited power can
    pull hard only at low speed, which is the purpose of low gears.

    Vehicle and motor powers are often stated in horsepower, a unit equal to about 746 watts.
