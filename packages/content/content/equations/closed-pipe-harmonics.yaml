name:
  en: 'Harmonics of a pipe closed at one end'
kind: 'formula'
level: 'intro'
expression: '\mag{f_{n}}=\frac{\var{n}\mag{v}}{4\var{L}}'
terms:
  f_{n}:
    kind: 'magnitude'
    ref: 'frequency'
  n:
    kind: 'symbol'
    label:
      en: 'Harmonic number (odd)'
    integer: true
  v:
    kind: 'magnitude'
    ref: 'speed'
  L:
    kind: 'symbol'
    label:
      en: 'Length of the pipe'
    unit: 'metre'
solutions:
  f_{n}: 'n * v / (4 * L)'
  n: '4 * L * f_n / v'
  v: '4 * L * f_n / n'
  L: 'n * v / (4 * f_n)'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'waves-and-oscillations'
aliases:
  - 'f_n = n v / 4L'
  - 'closed pipe'
  - 'stopped pipe'
  - 'closed tube resonance'
