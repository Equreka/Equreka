name:
  en: 'Recoil velocity'
kind: 'equation'
level: 'intro'
expression: '\var{v_{2}}=-\frac{\var{m_{1}}\var{v_{1}}}{\var{m_{2}}}'
terms:
  v_{2}:
    kind: 'symbol'
    label:
      en: 'Recoil velocity'
    unit: 'metre-per-second'
  m_{1}:
    kind: 'symbol'
    label:
      en: 'Mass of the projectile'
    unit: 'kilogram'
  v_{1}:
    kind: 'symbol'
    label:
      en: 'Velocity of the projectile'
    unit: 'metre-per-second'
  m_{2}:
    kind: 'symbol'
    label:
      en: 'Mass of the recoiling body'
    unit: 'kilogram'
solutions:
  v_{2}: '-m_1 * v_1 / m_2'
  v_{1}: '-m_2 * v_2 / m_1'
  m_{1}: '-m_2 * v_2 / v_1'
  m_{2}: '-m_1 * v_1 / v_2'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'mechanics'
aliases:
  - 'recoil speed'
  - 'gun recoil'
  - 'rifle recoil velocity'
  - 'kickback velocity'
