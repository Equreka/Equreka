name:
  en: 'Speed in free fall'
kind: 'equation'
level: 'intro'
expression: '\mag{v}=\var{g}\mag{t}'
terms:
  v:
    kind: 'magnitude'
    ref: 'speed'
  g:
    kind: 'symbol'
    label:
      en: 'Gravitational acceleration'
    unit: 'metre-per-second-squared'
  t:
    kind: 'magnitude'
    ref: 'time'
solutions:
  v: 'g * t'
  g: 'v / t'
  t: 'v / g'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'mechanics'
aliases:
  - 'free fall velocity'
  - 'free-fall velocity'
  - 'free-fall speed'
  - 'velocity of a falling body'
  - 'speed of a falling object'
