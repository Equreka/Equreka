name:
  en: 'Coefficient of restitution'
kind: 'formula'
level: 'intermediate'
expression: '\var{e}=\frac{\var{v_{2}}-\var{v_{1}}}{\var{u_{1}}-\var{u_{2}}}'
terms:
  e:
    kind: 'symbol'
    label:
      en: 'Coefficient of restitution'
    unit: 'unitless'
  v_{1}:
    kind: 'symbol'
    label:
      en: 'Final velocity of body 1'
    unit: 'metre-per-second'
  v_{2}:
    kind: 'symbol'
    label:
      en: 'Final velocity of body 2'
    unit: 'metre-per-second'
  u_{1}:
    kind: 'symbol'
    label:
      en: 'Initial velocity of body 1'
    unit: 'metre-per-second'
  u_{2}:
    kind: 'symbol'
    label:
      en: 'Initial velocity of body 2'
    unit: 'metre-per-second'
solutions:
  e: '(v_2 - v_1) / (u_1 - u_2)'
  v_{1}: 'v_2 - e * (u_1 - u_2)'
  v_{2}: 'v_1 + e * (u_1 - u_2)'
  u_{1}: 'u_2 + (v_2 - v_1) / e'
  u_{2}: 'u_1 - (v_2 - v_1) / e'
