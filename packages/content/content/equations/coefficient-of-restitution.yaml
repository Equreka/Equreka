description:
  en: >-
    The coefficient of restitution measures how bouncy a collision is: it is the speed at which two
    colliding bodies separate after impact divided by the speed at which they approached before it.
    A value of one marks a perfectly elastic collision, zero a perfectly inelastic one in which the
    bodies stick together, and values in between the partly inelastic collisions of everyday life.

    In the formula, $\var{e}$ is the coefficient of restitution, a dimensionless number normally
    between 0 and 1; $\var{u_{1}}$ and $\var{u_{2}}$ are the velocities of bodies 1 and 2 before the
    collision and $\var{v_{1}}$ and $\var{v_{2}}$ their velocities after it, in metres per second.
    Velocities are signed along the line of impact, positive in a chosen direction, with body 1
    initially behind body 2 and catching up with it, so that both the numerator, the speed of
    separation, and the denominator, the speed of approach, are positive.

    For a head-on collision, conserving kinetic energy as well as momentum forces the relative
    velocity to reverse with unchanged size, which is the case of a coefficient equal to one. A
    smaller coefficient means the relative velocity reverses but shrinks, the missing kinetic energy
    having gone into deformation, heat and sound. Combined with momentum conservation, the
    coefficient fixes both final velocities of a one-dimensional collision. For a ball bouncing off
    a fixed floor the coefficient is the rebound speed over the impact speed, so without air
    resistance it equals the square root of the rebound height over the drop height.

    The coefficient depends on the materials and on how hard they strike each other, so a single
    value describes a pair of surfaces only over a limited range of conditions. Values below zero or above one occur only when a body passes
    through the other or stored energy is released.

    Sports rules reflect that dependence. For a regulation baseball the coefficient against a wall of
    northern white ash must be 0.546, give or take 0.032, at an impact speed fixed at 60 miles per
    hour, since a harder impact deforms the ball more and shifts the value.
