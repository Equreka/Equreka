description:
  en: >-
    The definition of capacitance states that the capacitance of a capacitor is the charge it
    holds divided by the voltage between its two conductors: the charge stored per volt. Every
    capacitor, from the tiny ones on a circuit board to large energy-storage banks, is rated by
    this ratio, and it is the starting point for capacitors in electrostatics and circuits.

    $\mag{C}$ is the capacitance in farads, where one farad is one coulomb per volt. $\mag{Q}$ is
    the charge in coulombs on the positive conductor, or plate; the other plate carries the same
    amount with the opposite sign, so the capacitor as a whole stays neutral. $\mag{V}$ is the
    electric potential difference in volts between the positive and the negative plate. With these
    choices all three quantities are positive.

    Charge and voltage rise together: doubling the voltage across a given capacitor doubles the
    charge it stores, and the ratio stays fixed. The capacitance depends only on the shape and size
    of the conductors and on the insulating material between them, not on how much charge is
    present. For two parallel plates it equals the vacuum permittivity times the plate area divided
    by their separation, and filling the gap with an insulator raises it by the dielectric
    constant of that material.

    The ratio stays constant up to the voltage at which the insulator breaks down and conducts.
    Real capacitors span picofarads to millifarads; a whole farad is a very large capacitance.

    The Leyden jar, developed independently by E. Georg von Kleist and Pieter van Musschenbroek
    around 1745, was the first capacitor: glass between two metal foils. The farad is named after
    Michael Faraday. Two plates of one square metre, one millimetre apart, have a capacitance of
    about $8.85\,\mathrm{nF}$ and hold some 26.6 microcoulombs at 3000 volts.
