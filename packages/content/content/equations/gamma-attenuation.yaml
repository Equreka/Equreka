name:
  en: 'Attenuation of a gamma-ray beam'
kind: 'equation'
level: 'intermediate'
expression: '\var{I}=\var{I_{0}}e^{-\var{\mu}\var{x}}'
terms:
  I:
    kind: 'symbol'
    label:
      en: 'Transmitted intensity'
    unit: 'watt-per-square-metre'
  I_{0}:
    kind: 'symbol'
    label:
      en: 'Incident intensity'
    unit: 'watt-per-square-metre'
  \mu:
    kind: 'symbol'
    label:
      en: 'Linear attenuation coefficient'
    unit: 'reciprocal-metre'
  x:
    kind: 'symbol'
    label:
      en: 'Absorber thickness'
    unit: 'metre'
solutions:
  I: 'I_0 * exp(-mu * x)'
  I_{0}: 'I * exp(mu * x)'
  \mu: 'ln(I_0 / I) / x'
  x: 'ln(I_0 / I) / mu'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'nuclear-physics'
aliases:
  - 'gamma attenuation'
  - 'gamma-ray attenuation'
  - 'exponential attenuation law'
  - 'X-ray attenuation'
  - 'photon beam attenuation'
