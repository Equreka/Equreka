description:
  en: >-
    The work done by a gas in an isobaric process, one that takes place at constant pressure, equals
    the pressure times the change in volume. In thermodynamics and chemistry this pressure–volume
    work is the expansion work of a gas pushing a piston or the surrounding air, and on a
    pressure–volume diagram it is the area of the rectangle under the horizontal line that traces
    the process.

    $\mag{W}$ is the work done by the gas on its surroundings, in joules. $\mag{p}$ is the constant
    pressure, in pascals, an absolute pressure rather than a gauge reading. $\var{\Delta V}$ is the
    final volume minus the initial one, in cubic metres. The sign follows the physics form of the
    first law, in which work done by the system counts as positive: an expanding gas does positive
    work, while a gas being compressed has negative work, meaning its surroundings work on it.
    Chemistry texts count the work done on the system instead, which reverses the sign.

    The formula follows from the force a gas exerts on a piston. That force is the pressure times
    the piston area, and moving the piston a short distance sweeps out a volume equal to the area
    times the distance, so each small step of work is the pressure times the volume swept. At
    constant pressure those steps add up to the pressure times the total change in volume. One
    pascal times one cubic metre is exactly one joule, so no conversion factor is needed.

    The process must be quasi-static, slow enough for the gas to keep one well-defined pressure in
    equilibrium throughout. If the pressure changes during the process, the work is the area under
    the curve on the pressure–volume diagram and this product no longer applies. Nothing in the
    derivation requires an ideal gas: the relation holds for any substance whose pressure stays
    fixed.

    When 1.00 gram of water boils at one atmosphere, its volume grows by about 1.67 litres, and the
    steam does about 169 joules of work pushing back the air.
