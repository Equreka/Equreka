description:
  en: >-
    The mass of one particle of a substance, a single atom, molecule or formula unit, equals the
    molar mass of the substance divided by the Avogadro constant. The formula links the molar mass
    read from a periodic table, a laboratory quantity, to the mass of an individual entity, and it
    shows how small atoms are on the kilogram scale.

    $\var{m}$ is the mass of one entity, in kilograms; the calculator also offers the dalton, the
    unit in which atomic and molecular masses are usually quoted. $\mag{M}$ is the molar mass, in
    kilograms per mole. $\const{N_\mathrm{A}}$ is the Avogadro constant, exactly
    $6.022\,140\,76\times10^{23}\,\mathrm{mol^{-1}}$. Both $\var{m}$ and $\mag{M}$ are positive.

    One mole holds the Avogadro number of entities, so sharing the mass of one mole equally among
    them gives the mass of each. Read the other way, the molar mass is the mass of one entity
    multiplied by the Avogadro constant. Because the dalton is defined as one twelfth of the mass of
    a carbon-12 atom, the mass of a particle in daltons has the same numerical value as the molar
    mass in grams per mole, to about one part in a billion with the CODATA 2022 values.

    For a single atom the result is an average when the molar mass is the standard value for an
    element, which mixes its isotopes; the mass of one particular isotope needs that isotope's own
    molar mass. Molecules of one compound may also contain different isotopes, so the formula gives
    their mean mass.

    When the mole was redefined in 2019, the Avogadro constant was fixed so that the molar mass of
    carbon-12 stayed at 0.012 kilogram per mole to a relative uncertainty of $4.5\times10^{-10}$;
    that molar mass is now measured rather than defined. One carbon-12 atom therefore has a mass of about
    $1.993\times10^{-26}\,\mathrm{kg}$, exactly 12 daltons.
