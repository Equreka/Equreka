# yaml-language-server: $schema=../../dist/schemas/equations.schema.json
name:
  en: 'Mass-energy equivalence'
kind: 'equation'
expression: '\mag{E}=\mag{m}\const{c}^{2}'
terms:
  E:
    kind: 'magnitude'
    ref: 'energy'
  m:
    kind: 'magnitude'
    ref: 'mass'
  c:
    kind: 'constant'
    ref: 'speed-of-light'
solutions:
  E: 'm * c^2'
  m: 'E / c^2'
calculator:
  enabled: true
categories:
  - 'physics'
description:
  en: >-
    This formula states that the equivalent $energy$ $(\mag{E})$ can be calculated as the mass
    $(\mag{m})$ multiplied by the speed of light $(\const{c})$ squared. Similarly, anything having
    energy exhibits a corresponding mass $(\mag{m})$ given by its energy $(\mag{E})$ divided by the
    speed of light squared $(\const{c}^{2})$. Because the speed of light is a very large number in
    everyday units, the formula implies that even an everyday object at rest with a modest amount of
    mass has a very large amount of energy intrinsically.
