name:
  en: 'Escape velocity'
kind: 'formula'
level: 'intro'
expression: '\mag{v}=\sqrt{\frac{2\const{G}\mag{M}}{\var{r}}}'
terms:
  v:
    kind: 'magnitude'
    ref: 'speed'
  G:
    kind: 'constant'
    ref: 'gravitational-constant'
  M:
    kind: 'magnitude'
    ref: 'mass'
  r:
    kind: 'symbol'
    label:
      en: 'Distance between centres'
    unit: 'metre'
solutions:
  v: 'sqrt(2 * G * M / r)'
  M: 'v^2 * r / (2 * G)'
  r: '2 * G * M / v^2'
calculator:
  enabled: true
externalIds:
  wikidata: 'Q166530'
categories:
