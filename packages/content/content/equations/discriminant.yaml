solutions:
  \Delta: 'b^2 - 4 * a * c'
  b:
    - 'sqrt(Delta + 4 * a * c)'
    - '-sqrt(Delta + 4 * a * c)'
  a: '(b^2 - Delta) / (4 * c)'
  c: '(b^2 - Delta) / (4 * a)'
calculator:
  enabled: true
