name:
  en: 'Discriminant of a quadratic'
kind: 'formula'
level: 'intro'
expression: '\var{\Delta}=\var{b}^{2}-4\var{a}\var{c}'
terms:
  \Delta:
    kind: 'symbol'
    label:
      en: 'Discriminant'
  a:
    kind: 'symbol'
    label:
      en: 'Quadratic coefficient'
  b:
    kind: 'symbol'
    label:
      en: 'Linear coefficient'
  c:
    kind: 'symbol'
    label:
