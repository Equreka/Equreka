    kind: 'symbol'
    label:
      en: 'Initial volume'
    unit: 'cubic-metre'
  n_{1}:
    kind: 'symbol'
    label:
      en: 'Initial amount of substance'
    unit: 'mole'
  V_{2}:
    kind: 'symbol'
    label:
      en: 'Final volume'
    unit: 'cubic-metre'
  n_{2}:
    kind: 'symbol'
    label:
      en: 'Final amount of substance'
    unit: 'mole'
solutions:
  V_{1}: 'V_2 * n_1 / n_2'
  n_{1}: 'V_1 * n_2 / V_2'
  V_{2}: 'V_1 * n_2 / n_1'
  n_{2}: 'V_2 * n_1 / V_1'
