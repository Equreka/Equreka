description:
  en: >-
    Linear momentum is the mass of a body multiplied by its velocity. Also called momentum or
    quantity of motion, it measures how much motion a moving object carries in mechanics, and it is
    the quantity that collisions, explosions and impulses redistribute.

    In the formula, $\mag{p}$ is the momentum in kilogram metres per second, $\mag{m}$ the mass in
    kilograms, always positive, and $\mag{v}$ the velocity in metres per second. Momentum is a
    vector that points the same way as the velocity. For motion along a line, a positive direction
    is chosen, and a body moving the opposite way has a negative velocity and therefore a negative
    momentum.

    Doubling the mass at a fixed velocity doubles the momentum, and so does doubling the velocity at
    a fixed mass, so a slow body of large mass can carry as much momentum as a fast body of small
    mass. A body at rest has zero momentum. The momenta of the parts of a system add as vectors, so
    two equal carts moving towards each other at the same speed have a total momentum of zero.
    Solving for the velocity divides the momentum by the mass; solving for the mass needs a non-zero
    velocity.

    The product of mass and velocity is the classical momentum, accurate at everyday speeds. As a
    speed approaches that of light, special relativity replaces it with a larger value, the
    classical product multiplied by the Lorentz factor.

    Isaac Newton defined the quantity of motion as arising from velocity and quantity of matter
    together, the second definition of his Principia, published in 1687. A car of 1400 kilograms
    moving at 15 metres per second has a momentum of $21\,000\,\mathrm{kg\,m/s}$.
