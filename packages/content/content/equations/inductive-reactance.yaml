description:
  en: >-
    Inductive reactance is the opposition that an inductor presents to an alternating current,
    equal to the angular frequency of the current times the inductance. Like a resistance it
    relates the amplitude of the voltage across the element to the amplitude of the current through
    it and is measured in ohms, but it grows in proportion to the frequency, and in an ideal coil it
    dissipates no energy.

    $\mag{X_\mathrm{L}}$ is the inductive reactance in ohms, $\mag{\omega}$ the angular frequency in
    radians per second, two pi times the frequency in hertz, and $\mag{L}$ the inductance in
    henries. All three are positive. In the complex impedance of the coil the reactance is a
    positive imaginary part, the convention in which a capacitor's reactance is negative.

    An inductor opposes changes in its current with an induced electromotive force equal to the
    inductance times the rate of change of the current. For a sinusoidal current that rate is
    largest as the current passes through zero, so the voltage across the coil leads the current by
    a quarter of a cycle, and the ratio of their amplitudes is the angular frequency times the
    inductance. The faster the current alternates, the larger the voltage needed for the same
    current amplitude.

    The relation describes an ideal inductor in a circuit driven at one frequency in steady state;
    the resistance of the winding adds separately to the impedance. At zero frequency, a steady
    current, the reactance vanishes and an ideal coil behaves like a plain wire. Because the
    reactance rises with frequency, an inductor in series with a load holds back high frequencies
    while letting low ones through.

    A 3.00 mH inductor has a reactance of about 1.13 ohms at 60 Hz but about 188 ohms at 10 kHz.
