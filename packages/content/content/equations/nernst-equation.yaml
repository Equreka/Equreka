description:
  en: >-
    The Nernst equation gives the potential of an electrochemical cell at any composition: the
    standard cell potential minus RT over zF times the natural logarithm of the reaction quotient.
    It is the working rule of electrochemistry for cells away from standard conditions, behind
    concentration cells, the voltage of a cell as its reactants are used up, and the response of
    pH electrodes.

    $\var{E_\mathrm{cell}}$ is the cell potential, in volts, measured with no current flowing.
    $\var{E^{\circ}_\mathrm{cell}}$ is the standard cell potential, the cathode's tabulated
    reduction potential minus the anode's. $\const{R}$ is the molar gas constant and $\const{F}$ the
    Faraday constant, both exact in the SI. $\mag{T}$ is the thermodynamic temperature, absolute, in
    kelvin. $\var{z}$ is the number of electrons in the cell reaction as written, a positive whole
    number. $\var{Q}$ is the reaction quotient, with no unit: the product of the activities of the
    products over that of the reactants, each raised to its coefficient, concentrations divided by
    the standard amount concentration of one mole per litre and gas pressures by the standard
    pressure of 1 bar.

    With every species in its standard state the quotient is one, its logarithm vanishes and the
    cell potential equals the standard one. As the cell discharges the quotient grows and the
    potential falls, reaching zero at equilibrium, where the quotient equals the equilibrium
    constant. Dividing the Gibbs energy relation for any composition by minus zF gives the equation.
    At 298.15 kelvin RT/F is about 0.02569 volts, and with base-ten logarithms the slope becomes
    0.05916 volts divided by z per tenfold change in the quotient.

    Concentrations and pressures stand in for activities and fugacities only in dilute solutions and
    ideal gases. The equation describes the equilibrium potential and neglects junction potentials;
    a cell delivering current shows less.

    Walther Nernst set out his theory of galvanic cells in 1889. When cobalt metal reduces iron(II)
    to iron, with a standard potential of −0.17 volts and two electrons, the quotient is the
    cobalt(II) concentration over the iron(II) one; at 0.15 and 1.94 moles per litre the cell gives
    about −0.14 volts.
