name:
  en: 'Nernst equation'
kind: 'equation'
level: 'intermediate'
expression: '\var{E_\mathrm{cell}}=\var{E^{\circ}_\mathrm{cell}}-\frac{\const{R}\mag{T}}{\var{z}\const{F}}\ln\var{Q}'
terms:
  E_\mathrm{cell}:
    kind: 'symbol'
    label:
      en: 'Cell potential'
    unit: 'volt'
    identifier: 'E_cell_cond'
  E^{\circ}_\mathrm{cell}:
    kind: 'symbol'
    label:
      en: 'Standard cell potential'
    unit: 'volt'
    identifier: 'E_cell'
  R:
    kind: 'constant'
    ref: 'molar-gas-constant'
  T:
    kind: 'magnitude'
    ref: 'thermodynamic-temperature'
  z:
    kind: 'symbol'
    label:
      en: 'Electrons transferred in the cell reaction'
    integer: true
  F:
    kind: 'constant'
    ref: 'faraday-constant'
  Q:
    kind: 'symbol'
    label:
      en: 'Reaction quotient'
solutions:
  E_\mathrm{cell}: 'E_cell - R * T / (z * F) * ln(Q)'
  E^{\circ}_\mathrm{cell}: 'E_cell_cond + R * T / (z * F) * ln(Q)'
  T: '(E_cell - E_cell_cond) * z * F / (R * ln(Q))'
  z: 'R * T * ln(Q) / (F * (E_cell - E_cell_cond))'
  Q: 'exp(z * F * (E_cell - E_cell_cond) / (R * T))'
