name:
  en: 'Beat frequency'
kind: 'formula'
level: 'intro'
expression: '\mag{f_\mathrm{beat}}=\left|\var{f_{1}}-\var{f_{2}}\right|'
terms:
  f_\mathrm{beat}:
    kind: 'magnitude'
    ref: 'frequency'
  f_{1}:
    kind: 'symbol'
    label:
      en: 'Frequency of the first source'
    unit: 'hertz'
  f_{2}:
    kind: 'symbol'
    label:
      en: 'Frequency of the second source'
    unit: 'hertz'
solutions:
  f_\mathrm{beat}: 'abs(f_1 - f_2)'
  f_{1}:
    - 'f_2 + f_beat'
    - 'f_2 - f_beat'
  f_{2}:
    - 'f_1 + f_beat'
    - 'f_1 - f_beat'
calculator:
  enabled: true
externalIds:
  wikidata: 'Q106371934'
categories:
  - 'physics'
branches:
