name:
  en: 'Volume of a sphere'
kind: 'formula'
level: 'intro'
expression: '\mag{V}=\frac{4}{3}\const{\pi}\var{r}^{3}'
terms:
  V:
    kind: 'magnitude'
    ref: 'volume'
  \pi:
    kind: 'constant'
    ref: 'pi'
  r:
    kind: 'variable'
    ref: 'radius'
solutions:
  V: '4 * pi * r^3 / 3'
  r: 'cbrt(3 * V / (4 * pi))'
calculator:
  enabled: true
categories:
