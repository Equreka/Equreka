description:
  en: >-
    The mass defect of a nucleus is the amount by which its mass falls short of the total mass of
    its separate nucleons: the number of protons times the proton mass, plus the number of neutrons
    times the neutron mass, minus the mass of the nucleus. In nuclear physics it measures how
    tightly the protons and neutrons are bound together.

    Here $\var{\Delta m}$ is the mass defect and $\var{m_\mathrm{nuc}}$ the mass of the nucleus,
    both in kilograms, or in daltons, which suit atomic-scale masses and are also accepted.
    $\var{Z}$ is the atomic number, the count of protons, and $\var{A}$ the mass number, the count
    of nucleons, so the difference between them is the neutron number. Both are whole numbers read
    off the nuclide: they are inputs only, since an atomic number solved from the masses would hinge
    on the tiny difference between the proton and neutron masses, and the calculator solves for the
    mass defect or the nuclear mass but never for either count. The constants $\const{m_\mathrm{p}}$
    and $\const{m_\mathrm{n}}$ are the proton and neutron masses. The defect is positive for every
    nucleus of more than one nucleon.

    Multiplying the mass defect by the square of the speed of light gives the nuclear binding
    energy, the energy needed to pull the nucleus apart into free nucleons. One dalton of defect
    corresponds to about 931.494 MeV of binding energy.

    Mass tables list atomic masses, which include the electrons, so a common working form uses the
    mass of a hydrogen-1 atom in place of the proton mass and the atomic mass of the nuclide in
    place of the nuclear mass; the electron masses then cancel. Mixing an atomic mass with the
    proton mass leaves an error of one electron mass per proton. Because the defect is a small
    difference between nearly equal masses, those masses must be known to many significant figures.

    For the helium-4 nucleus, the alpha particle, the CODATA 2022 masses give a mass defect of about
    0.030 38 Da, or $5.044\times10^{-29}\,\mathrm{kg}$, which corresponds to a binding energy near
    28.3 MeV.
