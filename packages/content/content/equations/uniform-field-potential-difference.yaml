name:
  en: 'Potential difference in a uniform electric field'
kind: 'formula'
level: 'intro'
expression: '\mag{V}=\mag{E}\var{d}'
terms:
  V:
    kind: 'magnitude'
    ref: 'electric-potential-difference'
  E:
    kind: 'magnitude'
    ref: 'electric-field-strength'
