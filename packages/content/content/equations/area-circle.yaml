description:
  en: >-
    The area of a circle is the size of the flat region that a circle encloses, and it equals pi
    times the square of the radius. This formula of plane geometry gives the area of any disc, from
    a coin to a circular field, from one measured length.

    In the formula, $\mag{A}$ is the area of the disc, measured in square metres, and $\var{r}$ is
    its radius, the distance from the centre to the circle, measured in metres. The constant $\const{\pi}$ is the number of times the diameter of any circle fits into its circumference, a pure number close to 3.14159. Both lengths and areas here are never negative, so no sign convention is needed.
    When the diameter is known instead, the radius is half of it.

    Because the radius enters squared, doubling it multiplies the area by four, and every circle is
    a scaled copy of every other. One way to see the formula is to cut the disc into many thin
    slices, like a pizza, and lay them side by side alternately pointing up and down. As the slices
    get thinner the shape approaches a rectangle whose height is the radius and whose base is half
    the circumference, so its area is pi times the radius times the radius.

    The formula holds in the flat Euclidean plane. On a curved surface, such as the surface of the
    Earth over large distances, a circle of given radius encloses a different area. In calculation
    the result is only as precise as the value used for pi: school exercises often take 3.14 or
    22/7.

    Euclid's Elements proved that the areas of two circles have the same ratio as the squares of
    their diameters, by filling each circle with polygons of more and more sides. Archimedes later
    bounded pi between 223/71 and 22/7 with polygons of 96 sides. A round table of radius half a
    metre covers about 0.785 square metres.
