name:
  en: 'Speed of a wave on a stretched string'
kind: 'formula'
level: 'intermediate'
expression: '\mag{v}=\sqrt{\frac{\var{F_\mathrm{T}}}{\mag{\mu}}}'
terms:
  v:
    kind: 'magnitude'
    ref: 'speed'
  F_\mathrm{T}:
    kind: 'symbol'
    label:
      en: 'Tension in the string'
    unit: 'newton'
  \mu:
    kind: 'magnitude'
    ref: 'linear-density'
