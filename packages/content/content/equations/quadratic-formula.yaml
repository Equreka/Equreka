description:
  en: >-
    The quadratic formula expresses the roots of a quadratic equation, the second-degree polynomial
    equation in one unknown that combines the square of the unknown, its first power and a constant
    term and sets the sum equal to zero. It is the general method of school algebra for solving such
    an equation, including every case that does not factor neatly, and it delivers both solutions in
    one expression.

    In the standard form, $\var{x}$ is the unknown, $\var{a}$ is the coefficient of its square,
    $\var{b}$ the coefficient of its first power and $\var{c}$ the constant term. All four are
    treated here as pure numbers; when the equation models a measurement, each coefficient carries
    whatever unit keeps the three added terms consistent. The coefficient $\var{a}$ must differ from
    zero, otherwise the equation is linear, while $\var{b}$ and $\var{c}$ may be positive, negative
    or zero. A negative root is as valid as a positive one unless the context, such as a length or
    an elapsed time, excludes it.

    Isolating the unknown gives
    $$\var{x}=\frac{-\var{b}\pm\sqrt{\var{b}^{2}-4\var{a}\var{c}}}{2\var{a}}$$ The derivation
    completes the square: divide by $\var{a}$, move the constant to the other side, add the square
    of half the new first-power coefficient to both sides, then take square roots. The plus sign and
    the minus sign produce the two roots, placed symmetrically about the midpoint
    $-\var{b}/(2\var{a})$.

    The expression under the radical is the discriminant. With real coefficients, a positive
    discriminant yields two different real roots, a zero discriminant one repeated root, and a
    negative discriminant a pair of complex roots that no real calculation returns. An equivalent
    rearrangement places the radical in the denominator; it is valid whenever that denominator is
    not zero.

    Babylonian scribes of about 1800 BC solved problems that lead to quadratic equations by a
    procedure equal to completing the square, always with positive answers. Around 800, al-Khwarizmi
    sorted quadratics into six types and gave for each a numerical rule equivalent to the formula,
    proved geometrically. With coefficients 1, 5 and 1 the roots are about -0.209 and -4.791.
