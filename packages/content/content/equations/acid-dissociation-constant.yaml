description:
  en: >-
    The acid dissociation constant, or acidity constant, is the equilibrium constant for the transfer
    of a proton from a weak acid HA to water, giving hydronium ions and the conjugate base A−. It
    equals the hydrogen ion concentration times the conjugate base concentration over the
    concentration of acid left intact, all at equilibrium, and measures the strength of an acid in
    acid-base chemistry.

    $\var{K_\mathrm{a}}$ is the acid dissociation constant, a positive pure number.
    $\var{[\mathrm{H}^{+}]}$ is the concentration of hydrogen ions, present as hydronium,
    $\var{[\mathrm{A}^{-}]}$ that of the conjugate base and $\var{[\mathrm{HA}]}$ that of the
    undissociated acid, all equilibrium amount concentrations, usually entered in moles per litre.
    $\const{c^{\circ}}$ is the standard amount concentration, exactly one mole per litre; dividing
    by it makes the constant dimensionless while keeping the values that tables list.

    A larger constant means a stronger acid, one that gives up more of its protons at equilibrium.
    Weak acids have constants well below one, and the constant is fixed at a given temperature, so
    diluting the acid shifts the equilibrium towards the ions without changing it. Because the
    values span many powers of ten, chemists usually quote the negative base-ten logarithm, the pKa.

    The concentrations stand in for activities, which holds in dilute solutions; at higher ionic
    strength the true thermodynamic constant differs from the concentration ratio. Water, the solvent,
    does not appear in the expression, and the hydronium from the self-ionization of water is
    neglected unless the acid is extremely weak or highly diluted.

    In a solution of acetic acid at equilibrium with 0.0787 moles of acid and 0.00118 moles each of
    hydronium and acetate per litre, the constant is $1.77\times10^{-5}$.
