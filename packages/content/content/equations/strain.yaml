description:
  en: >-
    Linear strain is the change in length of a stretched or compressed body divided by its original
    length. Also called normal or engineering strain, it is the measure of deformation used in the
    mechanics of materials: a pure number that says by what fraction a rod, wire, column or
    specimen has lengthened or shortened under load.

    Here $\var{\varepsilon}$ is the strain, a ratio with no unit that can also be written as a
    percentage or in parts per million; $\var{\Delta L}$ is the change in length in metres, the
    final length minus the original one; and $\var{L_{0}}$ is the original length in metres, never
    negative. A body that lengthens has positive strain, called tensile, and one that shortens has
    negative strain, called compressive, matching the sign convention of normal stress.

    Dividing by the original length makes the result independent of the size of the specimen: a
    long cable and a short sample of the same wire under the same stress stretch by the same
    fraction, though by very different lengths. Strains in steel at typical working stresses are
    small, below a tenth of a percent, so engineers often quote them in microstrain, millionths of
    the original length.

    The formula measures length change along one direction only and assumes the strain is the same
    along the whole length, which holds for a uniform bar under an axial load. The ratio can be
    computed for any deformation, but only small strains stay proportional to the stress; beyond the
    proportional limit the material follows a curved stress-strain path, and rubber stays elastic
    far past it. Strain by itself says nothing about the material; Young's modulus connects it to
    the stress that produced it.

    A steel bar 2.0 metres long that lengthens by 1.4 millimetres has a strain of 0.0007, or 0.07
    percent.
