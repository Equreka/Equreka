description:
  en: >-
    Gay-Lussac's law, also called Amontons's law or the pressure law, states that the pressure of a
    fixed amount of gas in a rigid container is directly proportional to its absolute temperature.
    Written for two states of the same sample at constant volume, the ratio of pressure to
    temperature does not change, so heating a sealed gas raises its pressure and cooling it lowers
    the pressure.

    $\var{p_{1}}$ and $\var{T_{1}}$ are the pressure and the temperature of the gas at the start,
    $\var{p_{2}}$ and $\var{T_{2}}$ at the end. The pressures are absolute and may be in pascals,
    kilopascals or any other pressure unit, provided both match. The temperatures must be
    thermodynamic temperatures in kelvin, as in every gas law: a Celsius reading is first raised by
    273.15. All four quantities are positive.

    In a closed, rigid vessel the molecules cannot spread out, so when they speed up on heating they
    strike the walls more often and harder, and the pressure rises in step with the kelvin
    temperature. On a graph of pressure against temperature the points fall on a straight line;
    extrapolated to zero pressure, it reaches absolute zero, which is how Joseph Lambert proposed to
    define that temperature in 1779. The law is the ideal gas law with volume and amount of
    substance fixed.

    It is exact for an ideal gas and close for real gases at low pressure and well above
    condensation. Strong attraction between molecules at low temperature makes the measured pressure
    fall short of the prediction.

    Guillaume Amontons found the relation by experiment around 1700, and Gay-Lussac measured it more
    precisely about a century later. The name Gay-Lussac's law is also given to his 1808 law of
    combining volumes, a different rule. An aerosol can at 360 kilopascals and 297 kelvin, warmed to
    323 kelvin, reaches about 392 kilopascals, which is why such cans warn against heat.
