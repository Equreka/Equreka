name:
  en: 'Malus''s law'
kind: 'equation'
level: 'intermediate'
expression: '\var{I}=\var{I_{0}}\cos^{2}\mag{\theta}'
terms:
  I:
    kind: 'symbol'
    label:
      en: 'Transmitted intensity'
    unit: 'watt-per-square-metre'
  I_{0}:
    kind: 'symbol'
    label:
      en: 'Intensity of the polarized light reaching the polarizer'
    unit: 'watt-per-square-metre'
  \theta:
    kind: 'magnitude'
    ref: 'plane-angle'
solutions:
  I: 'I_0 * cos(theta)^2'
  I_{0}: 'I / cos(theta)^2'
  \theta: 'acos(sqrt(I / I_0))'
calculator:
  enabled: true
