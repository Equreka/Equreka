name:
  en: 'Volume of a cone'
kind: 'formula'
level: 'intro'
expression: '\mag{V}=\frac{1}{3}\const{\pi}\var{r}^{2}\var{h}'
terms:
  V:
    kind: 'magnitude'
    ref: 'volume'
  \pi:
    kind: 'constant'
    ref: 'pi'
  r:
    kind: 'variable'
    ref: 'radius'
  h:
    kind: 'symbol'
    label:
      en: 'Height'
    unit: 'metre'
solutions:
  V: 'pi * r^2 * h / 3'
  r: 'sqrt(3 * V / (pi * h))'
  h: '3 * V / (pi * r^2)'
calculator:
  enabled: true
categories:
  - 'mathematics'
branches:
  - 'geometry'
aliases:
  - 'cone volume'
  - 'volume of a right circular cone'
  - 'one third pi r squared h'
  - 'volumen de un cono'
references:
  - title: 'OpenStax, Prealgebra 2e, 9.6 Solve Geometry Applications: Volume and Surface Area'
    url: 'https://openstax.org/books/prealgebra-2e/pages/9-6-solve-geometry-applications-volume-and-surface-area'
  - title: 'E. W. Weisstein, Cone, MathWorld'
    url: 'https://mathworld.wolfram.com/Cone.html'
  - title: 'D. E. Joyce, Euclid''s Elements, Book XII, Proposition 10'
    url: 'https://mathcs.clarku.edu/~djoyce/java/elements/bookXII/propXII10.html'
  - title: 'MacTutor History of Mathematics, Eudoxus of Cnidus'
    url: 'https://mathshistory.st-andrews.ac.uk/Biographies/Eudoxus/'
description:
  en: >-
    The volume of a cone equals one third of pi times the square of the base radius times the
    height, which is a third of the volume of the cylinder with the same base and height. A right
    circular cone is the solid formed by a circular base and all the straight segments joining its
    edge to a point, the apex, directly above its centre, and this rule of solid geometry gives the
    capacity of funnels, cups, sand piles and conical roofs.

    In the formula, $\mag{V}$ is the volume, measured in cubic metres, $\var{r}$ is the radius of
    the circular base and $\var{h}$ is the height, the perpendicular distance from the apex to the
    base, both measured in metres. The constant $\const{\pi}$ is a pure number close to 3.14159.
    None of the quantities is negative. The height is not the slant height, the length of a segment
    from the apex to the edge of the base, which is always longer.

    The base area is pi times the radius squared, and a cone holds one third of what a cylinder with
    the same base and height would hold; a pyramid stands in the same relation to its prism.
    Doubling the radius multiplies the volume by four and doubling the height doubles it; solving
    for the radius takes the square root of three times the volume divided by pi and by the height.

    The formula assumes a circular base and a height measured at right angles to it from the apex.
    All lengths must share one unit. A frustum, the part of a cone left after its tip is cut off
    parallel to the base, needs a formula of its own.

    Democritus stated the one-third relation between cone and cylinder, and Eudoxus later proved it
    rigorously, a proof that Archimedes credited to him in On the Sphere and Cylinder. Euclid's
    Elements gives the result as Proposition 10 of Book XII. A cone with a base radius of 3 metres
    and a height of 4 metres holds 12 pi, about 37.70 cubic metres.
