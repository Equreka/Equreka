description:
  en: >-
    Boyle's law, also known as the Boyle-Mariotte law, is the gas law that links pressure and
    volume: for a fixed amount of gas held at one temperature, the pressure is inversely
    proportional to the volume, so their product does not change. Written for an initial and a final
    state of the same sample, it says that squeezing a gas into half the space doubles its pressure.

    $\var{p_{1}}$ and $\var{V_{1}}$ are the pressure and the volume of the gas before the change,
    $\var{p_{2}}$ and $\var{V_{2}}$ after it. The SI units are the pascal and the cubic metre, but
    litres, millilitres, kilopascals or atmospheres serve as well, because the law only compares two
    states. Both pressures are absolute, not gauge readings, and all four quantities are positive.

    Pushing the same molecules into a smaller space makes them strike each square metre of wall more
    often, so the pressure climbs by the same factor by which the volume shrinks. Plotted against
    volume, the pressure traces a hyperbola; plotted against the reciprocal of the volume, it gives
    a straight line through the origin. The relation is the ideal gas law with the amount of
    substance and the temperature both held fixed.

    The law is exact only for an ideal gas. Real gases obey it well at low pressure and high
    temperature, and depart from it under strong compression or near condensation, where the size of
    the molecules and their mutual attraction start to count. The temperature must also stay the
    same: a slow compression that lets heat escape fits the law, a sudden one warms the gas and does
    not.

    Robert Boyle published the quantitative relation in 1662, in the second edition of his book on
    the spring of the air, after trapping air in the sealed end of a J-shaped tube and compressing
    it with mercury. Syringes, bicycle pumps and scuba regulators all work by it: 15.0 millilitres
    of air at 13.0 psi pressed into 7.5 millilitres reaches 26 psi.
