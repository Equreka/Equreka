name:
  en: 'Perimeter of a rectangle'
kind: 'formula'
level: 'intro'
expression: '\var{P}=2\left(\var{l}+\var{w}\right)'
terms:
  P:
    kind: 'symbol'
    label:
      en: 'Perimeter'
    unit: 'metre'
  l:
    kind: 'symbol'
    label:
      en: 'Length'
    unit: 'metre'
  w:
    kind: 'symbol'
    label:
      en: 'Width'
    unit: 'metre'
solutions:
  P: '2 * (l + w)'
  l: 'P / 2 - w'
  w: 'P / 2 - l'
calculator:
  enabled: true
categories:
