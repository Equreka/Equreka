description:
  en: >-
    The energy stored in a capacitor is one half of its capacitance times the square of the voltage
    across it. A charged capacitor holds this energy in the electric field between its plates and
    can release it quickly, which makes the relation the basis for energy storage with capacitors in
    electrostatics and electronics.

    $\mag{E_\mathrm{p}}$ is the stored electric potential energy in joules, $\mag{C}$ is the
    capacitance in farads, and $\mag{V}$ is the electric potential difference between the positive
    and the negative plate in volts. The energy is never negative, and reversing the polarity of
    the voltage leaves it unchanged, because the voltage enters squared. Using the definition of
    capacitance, charge over voltage, the same energy can be written as the charge squared over
    twice the capacitance, or as half the charge times the voltage.

    The factor of one half comes from the charging process. An empty capacitor has no voltage
    across it, so the first charge moved onto it costs almost no work; the voltage climbs in step
    with the charge, and the last charge is pushed against the full voltage. On average each bit
    of charge crosses half the final voltage, so the total work, and hence the stored energy, is
    half the charge times the voltage rather than the full product.

    The relation holds for any capacitor whose capacitance stays fixed while it charges, whatever
    its shape, up to the voltage at which the insulator between the plates breaks down. The energy
    resides in the field itself, spread through the space between the plates, so the same result
    follows from the energy density of the field multiplied by the volume it fills.

    Defibrillators, camera flashes and backup supplies for memory all draw on stored capacitor
    energy. A defibrillator capacitor of $8.00\,\mu\mathrm{F}$ charged to 10.0 kilovolts stores
    $4.00\times10^{2}\,\mathrm{J}$.
