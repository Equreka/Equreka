name:
  en: 'Heron''s formula'
kind: 'formula'
level: 'intro'
expression: '\mag{A}=\frac{1}{4}\sqrt{\left(\var{a}+\var{b}+\var{c}\right)\left(-\var{a}+\var{b}+\var{c}\right)\left(\var{a}-\var{b}+\var{c}\right)\left(\var{a}+\var{b}-\var{c}\right)}'
terms:
  A:
    kind: 'magnitude'
    ref: 'area'
  a:
    kind: 'symbol'
    label:
      en: 'Side a'
    unit: 'metre'
  b:
    kind: 'symbol'
    label:
      en: 'Side b'
    unit: 'metre'
  c:
    kind: 'symbol'
    label:
      en: 'Side c'
    unit: 'metre'
solutions:
  A: 'sqrt((a + b + c) * (-a + b + c) * (a - b + c) * (a + b - c)) / 4'
  a:
    - 'sqrt(b^2 + c^2 - 2 * sqrt(b^2 * c^2 - 4 * A^2))'
    - 'sqrt(b^2 + c^2 + 2 * sqrt(b^2 * c^2 - 4 * A^2))'
  b:
    - 'sqrt(a^2 + c^2 - 2 * sqrt(a^2 * c^2 - 4 * A^2))'
    - 'sqrt(a^2 + c^2 + 2 * sqrt(a^2 * c^2 - 4 * A^2))'
  c:
    - 'sqrt(a^2 + b^2 - 2 * sqrt(a^2 * b^2 - 4 * A^2))'
    - 'sqrt(a^2 + b^2 + 2 * sqrt(a^2 * b^2 - 4 * A^2))'
