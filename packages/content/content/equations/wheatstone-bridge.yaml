description:
  en: >-
    The Wheatstone bridge finds an unknown resistance from three known ones: when the bridge is
    balanced, the unknown resistance equals the product of the two resistances next to it divided by the resistance opposite it. It is a null measurement of resistance in
    electric circuits: the result comes from bringing a current to zero, not from reading a scale.

    The bridge has four arms joined in a diamond, with a source across one diagonal and a
    galvanometer across the other. $\var{R_\mathrm{x}}$ is the unknown resistance and
    $\var{R_{3}}$ the adjustable resistance in the same branch; $\var{R_{1}}$ and $\var{R_{2}}$ are
    the fixed resistances of the other branch, $\var{R_{1}}$ in the arm opposite the unknown and
    $\var{R_{2}}$ in the arm beside it. All four are in ohms and positive.

    Each branch is a voltage divider across the same source, and the galvanometer joins the two midpoints. It reads zero only when both dividers split the source voltage in the same proportion, so the adjustable arm is changed until that happens. Equal proportions mean that the first fixed resistance is to the second as the adjustable resistance is to the unknown, which is the balance condition; equivalently, the products of opposite arms are equal.

    The formula holds only at balance. Its accuracy, often four significant digits, is limited by how
    close to zero the galvanometer current can be brought, by the uncertainties of the three known
    resistances and by the resistance of wires and contacts, which also changes with temperature.

    Samuel Hunter Christie described the circuit in 1833, and Charles Wheatstone made it widely known
    in an 1843 lecture that credited him. The bridge served telegraphy and is still widely used to
    measure resistance.
