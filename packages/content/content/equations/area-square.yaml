name:
  en: 'Square area'
kind: 'formula'
expression: '\mag{A}=\mag{l}^{2}'
terms:
  A:
    kind: 'magnitude'
    ref: 'area'
  l:
    kind: 'magnitude'
    ref: 'length'
solutions:
  A: 'l^2'
  l: 'sqrt(A)'
calculator:
  enabled: true
units:
  - 'metre'
categories:
  - 'mathematics'
description:
  en: >-
    The area of a square is the measure of the surface occupied by it and it's equal to the product
    of the length of its two sides ($lxl$ or $l^{2}$), because fo this the unit of the area is given
    in square units ($m^{2}$).
