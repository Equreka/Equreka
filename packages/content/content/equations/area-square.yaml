name:
  en: 'Area of a square'
kind: 'formula'
level: 'intro'
expression: '\mag{A}=\var{l}^{2}'
terms:
  A:
    kind: 'magnitude'
    ref: 'area'
  l:
    kind: 'symbol'
    label:
      en: 'Side length'
    unit: 'metre'
solutions:
  A: 'l^2'
  l: 'sqrt(A)'
calculator:
  enabled: true
categories:
  - 'mathematics'
branches:
  - 'geometry'
aliases:
  - 'square area'
  - 'side squared'
references:
  - title: 'OpenStax, Prealgebra 2e, 9.4 Use Properties of Rectangles, Triangles, and Trapezoids'
    url: 'https://openstax.org/books/prealgebra-2e/pages/9-4-use-properties-of-rectangles-triangles-and-trapezoids'
  - title: 'E. W. Weisstein, Square, MathWorld'
