    kind: 'magnitude'
    ref: 'force'
  G:
    kind: 'constant'
    ref: 'gravitational-constant'
  M:
    kind: 'symbol'
    label:
      en: 'Mass of the attracting body'
    unit: 'kilogram'
  m:
    kind: 'symbol'
    label:
      en: 'Mass of the other body'
    unit: 'kilogram'
  r:
    kind: 'symbol'
    label:
      en: 'Distance between centres'
    unit: 'metre'
solutions:
  F: 'G * M * m / r^2'
  M: 'F * r^2 / (G * m)'
  m: 'F * r^2 / (G * M)'
  r: 'sqrt(G * M * m / F)'
