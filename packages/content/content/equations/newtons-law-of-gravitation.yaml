description:
  en: >-
    Newton's law of universal gravitation states that any two masses pull on each other, the pull
    growing in step with each mass and weakening with the square of the separation of their centres.
    It is the founding law of gravitation, the same rule governing a falling stone, the Moon and the
    planets.

    $\mag{F}$ is the size of the force in newtons, equal on both bodies and directed along the line
    joining them, each body pulled towards the other. $\var{M}$ and $\var{m}$ are the two masses in
    kilograms; calling one the attracting body only names a point of view, since each attracts the
    other. $\var{r}$ is the distance between their centres in metres, and $\const{G}$ is the
    Newtonian constant of gravitation. Gravity is always attractive, so every quantity here is
    positive.

    Doubling either mass doubles the force, while doubling the distance cuts it to a quarter: the
    inverse-square dependence. The pull on each body is the same size, as Newton's third law
    requires, but the lighter body gets the larger acceleration. Combining this law with the second
    law of motion yields the weight of a body, the gravitational field of a planet and the speeds
    and periods of orbits.

    The law treats both bodies as points. It holds exactly for spherically symmetric bodies, with
    the distance taken between their centres, and approximately for any shapes far apart compared
    with their size. General relativity, which describes gravitation as a bending of space and time,
    refines it where the Newtonian picture is not precise enough.

    Newton published the law in his Principia in 1687, showing that an inverse-square attraction
    towards the Sun accounts for the planetary orbits. Henry Cavendish first determined the constant
    of gravitation accurately in 1798. Two spacecraft of 9000 kilograms each, 10 metres apart, pull
    on each other with only about $5.4\times10^{-5}\,\mathrm{N}$.
