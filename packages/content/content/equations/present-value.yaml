name:
  en: 'Present value'
kind: 'formula'
level: 'intro'
expression: '\var{\mathrm{PV}}=\frac{\var{\mathrm{FV}}}{\left(1+\var{r}\right)^{\var{n}}}'
terms:
  \mathrm{PV}:
    kind: 'symbol'
    label:
      en: 'Present value'
  \mathrm{FV}:
    kind: 'symbol'
    label:
      en: 'Future value'
  r:
    kind: 'symbol'
    label:
      en: 'Rate per period (as a fraction)'
  n:
    kind: 'symbol'
    label:
      en: 'Number of periods'
solutions:
  \mathrm{PV}: 'FV / (1 + r)^n'
  \mathrm{FV}: 'PV * (1 + r)^n'
  r: '(FV / PV)^(1 / n) - 1'
  n: 'ln(FV / PV) / ln(1 + r)'
