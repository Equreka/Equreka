description:
  en: >-
    Present value is the amount that, invested today at a given rate, grows to a stated sum at a
    future date. The present value formula discounts a future value back to today by dividing it by
    the compound growth factor over the number of periods, so a sum received later is worth less
    than the same sum received now. Discounting is the reverse of compounding and the basis of the
    time value of money in finance.

    In the formula, $\var{\mathrm{PV}}$ is the present value, $\var{\mathrm{FV}}$ the future value,
    $\var{r}$ the interest or discount rate per period as a decimal fraction, and $\var{n}$ the
    number of periods. The rate and the count must refer to the same period: an annual rate with
    years, a monthly rate with months. The rate exceeds minus one, and a positive rate makes the
    present value smaller than the future value.

    The relation is the compound growth rule read backwards: a present sum multiplied by one plus
    the rate once per period becomes the future sum, so dividing the future sum by that factor
    undoes the growth. It is compound interest with one compounding per period, or exponential
    growth, solved for the starting amount, which those relations call the principal or initial
    amount. The reciprocal of the factor is the discount factor. Solving for the rate gives the
    return that links two sums, and logarithms give the number of periods needed, which comes out
    fractional when the target is reached partway through a period.

    The formula values one payment at a constant rate. A stream of payments, such as a loan or an
    annuity, is valued by adding one such term per payment. With a nominal annual rate compounded
    several times a year, the rate per period is the annual rate divided by the number of
    compoundings, and the periods are counted in the same steps.

    Present value prices bonds, compares investment projects and values pensions or lump-sum prizes.
    A payment of 5000 due in five years is worth about 3917.63 today at 5 percent a year.
