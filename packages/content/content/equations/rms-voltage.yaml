name:
  en: 'RMS value of a sinusoidal voltage'
kind: 'formula'
level: 'intro'
expression: '\var{V_\mathrm{rms}}=\frac{\var{V_{0}}}{\sqrt{2}}'
terms:
  V_\mathrm{rms}:
    kind: 'symbol'
    label:
      en: 'RMS voltage'
    unit: 'volt'
  V_{0}:
    kind: 'symbol'
    label:
      en: 'Peak voltage'
    unit: 'volt'
solutions:
  V_\mathrm{rms}: 'V_0 / sqrt(2)'
  V_{0}: 'sqrt(2) * V_rms'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'electromagnetism'
aliases:
  - 'RMS voltage'
  - 'root-mean-square voltage'
  - 'effective voltage'
  - 'Vrms = V0 / sqrt 2'
  - 'peak voltage to rms'
