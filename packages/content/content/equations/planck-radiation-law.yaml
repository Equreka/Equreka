solutions:
  B_{\lambda}: '2 * h * c^2 / lambda^5 / (2 * sinh(h * c / (2 * lambda * k_B * T)) * exp(h * c / (2 * lambda * k_B * T)))'
  T: 'h * c / (lambda * k_B * 2 * atanh((2 * h * c^2 / (lambda^5 * B_lambda)) / (2 + 2 * h * c^2 / (lambda^5 * B_lambda))))'
