description:
  en: >-
    Planck's radiation law gives the spectral radiance of a black body, the power it emits for each
    unit of area, of solid angle and of wavelength interval, as a function of wavelength and
    absolute temperature. It describes the whole spectrum of thermal radiation, and the energy
    quanta behind it opened quantum and modern physics.

    $\var{B_{\lambda}}$ is the spectral radiance in watts per cubic metre and steradian. $\mag{\lambda}$
    is the wavelength in vacuum, in metres, and $\mag{T}$ the thermodynamic temperature of the body,
    in kelvin; a Celsius reading needs 273.15 added. The constants are the Planck constant
    $\const{h}$, the speed of light $\const{c}$ and the Boltzmann constant $\const{k_\mathrm{B}}$,
    $1.380\,649\times10^{-23}\,\mathrm{J/K}$, exact in the SI. NIST lists twice h times the square
    of c as the first radiation constant for spectral radiance and h times c over the Boltzmann
    constant as the second radiation constant, about 0.014 39 metre kelvin.

    At long wavelengths the exponential is close to one plus its exponent, and the law reduces to
    the Rayleigh-Jeans law, a radiance that falls with the fourth power of the wavelength but
    would grow without bound at short ones, the ultraviolet catastrophe. At short wavelengths the
    one in the denominator becomes negligible and Wien's approximation remains. The peak follows
    Wien's displacement law, and integrating over all wavelengths and directions gives the
    Stefan-Boltzmann law. Written per unit frequency, the radiance is twice h times the cube of the
    frequency over the square of c, divided by the same exponential term minus one.

    The law describes an ideal black body in thermal equilibrium; real surfaces emit less, by their
    emissivity. OpenStax states it as the power per unit area leaving a cavity opening, pi times this
    radiance. The calculator solves for the radiance or the temperature, because the wavelength has
    no closed form.

    Max Planck solved the black-body problem in 1900 by assuming quantized energies, published the
    law in 1901 and received the 1918 Nobel Prize in Physics. A black body at 6000 kelvin has a
    spectral radiance of about $3.03\times10^{13}$ watts per cubic metre and steradian at 560
    nanometres.
