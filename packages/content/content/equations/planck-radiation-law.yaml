expression: '\var{B_{\lambda}}=\frac{2\const{h}\const{c}^{2}}{\mag{\lambda}^{5}}\cdot\frac{1}{e^{\frac{\const{h}\const{c}}{\mag{\lambda}\const{k_\mathrm{B}}\mag{T}}}-1}'
