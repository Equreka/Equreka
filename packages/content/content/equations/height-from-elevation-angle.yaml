  - title: 'OpenStax, Precalculus 2e, 5.4 Right Triangle Trigonometry'
    url: 'https://openstax.org/books/precalculus-2e/pages/5-4-right-triangle-trigonometry'
  - title: 'GLOBE Program, Investigation Instruments: Clinometer (2014)'
    url: 'https://www.globe.gov/documents/355050/ba6cd381-02be-4525-8fd4-f061515b9862'
