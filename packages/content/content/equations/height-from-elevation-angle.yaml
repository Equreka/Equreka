name:
  en: 'Height from an angle of elevation'
kind: 'formula'
level: 'intro'
expression: '\var{h}=\var{h_{0}}+\var{d}\tan\mag{\theta}'
terms:
  h:
    kind: 'symbol'
    label:
      en: 'Height of the object'
    unit: 'metre'
  h_{0}:
    kind: 'symbol'
    label:
      en: 'Eye height'
    unit: 'metre'
  d:
    kind: 'symbol'
    label:
      en: 'Horizontal distance'
    unit: 'metre'
  \theta:
    kind: 'magnitude'
    ref: 'plane-angle'
solutions:
  h: 'h_0 + d * tan(theta)'
  h_{0}: 'h - d * tan(theta)'
  d: '(h - h_0) / tan(theta)'
  \theta: 'atan((h - h_0) / d)'
calculator:
  enabled: true
categories:
