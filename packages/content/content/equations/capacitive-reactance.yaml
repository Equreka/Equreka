name:
  en: 'Capacitive reactance'
kind: 'formula'
level: 'intermediate'
expression: '\mag{X_\mathrm{C}}=\frac{1}{\mag{\omega}\mag{C}}'
terms:
  X_\mathrm{C}:
    kind: 'magnitude'
    ref: 'reactance'
  \omega:
    kind: 'magnitude'
