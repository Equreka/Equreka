description:
  en: >-
    Capacitive reactance is the opposition that a capacitor presents to an alternating current,
    equal to one over the product of the angular frequency and the capacitance. It is measured in
    ohms and relates the amplitude of the voltage across the capacitor to the amplitude of the
    current in the circuit, but it falls as the frequency rises, and an ideal capacitor dissipates
    no energy.

    $\mag{X_\mathrm{C}}$ is the capacitive reactance in ohms, $\mag{\omega}$ the angular frequency
    in radians per second, two pi times the frequency in hertz, and $\mag{C}$ the capacitance in
    farads. The formula gives a positive size. In the complex impedance, whose imaginary part is the
    reactance, a capacitor contributes the negative of this size, which is why introductory texts
    subtract it from the inductive reactance of a series circuit.

    The current into a capacitor equals the capacitance times the rate of change of the voltage
    across it. For a sinusoidal voltage that rate is largest as the voltage passes through zero, so
    the current leads the voltage by a quarter of a cycle, and the ratio of the voltage amplitude to
    the current amplitude is one over the angular frequency times the capacitance. At a higher
    frequency the plates charge and discharge more often, so more current flows for the same
    voltage.

    The relation describes an ideal capacitor in a circuit driven at one frequency in steady state.
    As the frequency approaches zero the reactance grows without limit, so a charged capacitor
    blocks a steady current; at very high frequency the reactance approaches zero and the capacitor
    acts like a plain wire. A capacitor in series with a sound system therefore removes a low hum
    while passing higher frequencies.

    A 5.00 microfarad capacitor has a reactance of about 531 ohms at 60 Hz and about 3.18 ohms at
    10 kHz.
