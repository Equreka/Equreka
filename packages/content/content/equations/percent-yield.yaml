description:
  en: >-
    The percent yield of a chemical reaction compares the amount of product actually obtained with
    the largest amount the balanced equation allows: the actual yield divided by the theoretical
    yield, usually multiplied by 100 and reported as a percentage. It rates how well a preparation
    or an industrial process performs.

    $\var{Y}$ is the percent yield, a ratio from 0 to 1 that the calculator also shows as a
    percentage. $\var{m_\mathrm{act}}$ is the actual yield, the mass of product recovered and
    weighed, and $\var{m_\mathrm{th}}$ the theoretical yield, the mass predicted by stoichiometry
    from the limiting reactant, both in kilograms or any common mass unit. The ratio is the same
    for amounts in moles of the same product, though the calculator takes masses.

    The theoretical yield assumes that the limiting reactant, the one used up first, turns entirely
    into the desired product. Real reactions fall short: some stop at an equilibrium before the
    limiting reactant is consumed, side reactions make other products, and some product is lost
    while it is separated, washed and dried. The actual yield is therefore normally below the
    theoretical one.

    A value above 1, more than 100 percent, does not mean extra product: it signals an error,
    usually impurities that add their own mass to the weighed product. In a synthesis of several
    steps the overall yield is the product of the yields of the steps, so ten steps at 0.90 each
    end near 0.35.

    Percent yield measures the outcome in practice; the atom economy of the same reaction measures
    in theory how much of the reactant mass the desired product can contain. Copper recovered at
    0.392 grams against a theoretical 0.5072 grams is a yield of 77.3 percent.
