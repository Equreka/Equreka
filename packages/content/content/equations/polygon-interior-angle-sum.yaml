name:
  en: 'Sum of the interior angles of a polygon'
kind: 'formula'
level: 'intro'
expression: '\mag{S}=\left(\var{n}-2\right)\const{\pi}'
terms:
  S:
    kind: 'magnitude'
    ref: 'plane-angle'
  n:
    kind: 'symbol'
    label:
      en: 'Number of sides'
    integer: true
  \pi:
    kind: 'constant'
    ref: 'pi'
solutions:
  S: '(n - 2) * pi'
  n: 'S / pi + 2'
calculator:
  enabled: true
