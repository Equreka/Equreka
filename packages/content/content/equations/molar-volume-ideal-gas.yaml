  V_\mathrm{m}:
    kind: 'magnitude'
    ref: 'molar-volume'
  R:
    kind: 'constant'
    ref: 'molar-gas-constant'
  T:
    kind: 'magnitude'
    ref: 'thermodynamic-temperature'
  p:
    kind: 'magnitude'
    ref: 'pressure'
solutions:
  V_\mathrm{m}: 'R * T / p'
  T: 'V_m * p / R'
  p: 'R * T / V_m'
calculator:
  enabled: true
