expression: '\frac{\var{r_{1}}}{\var{r_{2}}}=\sqrt{\frac{\var{M_{2}}}{\var{M_{1}}}}'
terms:
  r_{1}:
    kind: 'symbol'
    label:
      en: 'Effusion rate of gas 1'
    unit: 'cubic-metre-per-second'
  r_{2}:
    kind: 'symbol'
    label:
      en: 'Effusion rate of gas 2'
    unit: 'cubic-metre-per-second'
  M_{1}:
    kind: 'symbol'
    label:
      en: 'Molar mass of gas 1'
    unit: 'kilogram-per-mole'
  M_{2}:
    kind: 'symbol'
    label:
      en: 'Molar mass of gas 2'
    unit: 'kilogram-per-mole'
solutions:
  r_{1}: 'r_2 * sqrt(M_2 / M_1)'
  r_{2}: 'r_1 * sqrt(M_1 / M_2)'
  M_{1}: 'M_2 * (r_2 / r_1)^2'
  M_{2}: 'M_1 * (r_1 / r_2)^2'
