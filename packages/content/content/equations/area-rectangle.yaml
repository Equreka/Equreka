name:
  en: 'Area of a rectangle'
kind: 'formula'
level: 'intro'
expression: '\mag{A}=\var{l}\var{w}'
terms:
  A:
    kind: 'magnitude'
    ref: 'area'
  l:
    kind: 'symbol'
    label:
      en: 'Length'
    unit: 'metre'
  w:
    kind: 'symbol'
    label:
      en: 'Width'
    unit: 'metre'
