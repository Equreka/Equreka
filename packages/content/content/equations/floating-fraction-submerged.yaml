name:
  en: 'Submerged fraction of a floating body'
kind: 'equation'
level: 'intro'
expression: '\frac{\var{V_\mathrm{sub}}}{\var{V_\mathrm{o}}}=\frac{\var{\rho_\mathrm{o}}}{\var{\rho_\mathrm{f}}}'
terms:
  V_\mathrm{sub}:
    kind: 'symbol'
    label:
      en: 'Submerged volume'
    unit: 'cubic-metre'
  V_\mathrm{o}:
    kind: 'symbol'
    label:
      en: 'Object volume'
    unit: 'cubic-metre'
  \rho_\mathrm{o}:
    kind: 'symbol'
    label:
      en: 'Object density'
    unit: 'kilogram-per-cubic-metre'
  \rho_\mathrm{f}:
    kind: 'symbol'
    label:
      en: 'Fluid density'
    unit: 'kilogram-per-cubic-metre'
solutions:
  V_\mathrm{sub}: 'V_o * rho_o / rho_f'
  V_\mathrm{o}: 'V_sub * rho_f / rho_o'
  \rho_\mathrm{o}: 'rho_f * V_sub / V_o'
  \rho_\mathrm{f}: 'rho_o * V_o / V_sub'
