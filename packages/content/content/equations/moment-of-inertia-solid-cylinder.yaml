name:
  en: 'Moment of inertia of a solid cylinder about its axis'
kind: 'formula'
level: 'intermediate'
expression: '\mag{I}=\frac{1}{2}\mag{M}\var{r}^{2}'
terms:
  I:
    kind: 'magnitude'
    ref: 'moment-of-inertia'
  M:
    kind: 'magnitude'
    ref: 'mass'
  r:
    kind: 'variable'
    ref: 'radius'
solutions:
  I: 'M * r^2 / 2'
  M: '2 * I / r^2'
  r: 'sqrt(2 * I / M)'
