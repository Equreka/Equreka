name:
  en: 'Z-score'
kind: 'formula'
level: 'intro'
expression: '\var{z}=\frac{\var{x}-\var{\mu}}{\var{\sigma}}'
terms:
  z:
    kind: 'symbol'
    label:
      en: 'Z-score'
  x:
    kind: 'symbol'
    label:
