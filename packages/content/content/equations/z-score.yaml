description:
  en: >-
    The z-score, also called the standard score, states how far a single value lies from the mean of
    its data set or distribution, counted in standard deviations. Converting a value into its
    z-score is called standardizing, and it is a basic tool of descriptive statistics for comparing
    observations taken on different scales.

    In the formula, $\var{x}$ is the observed value, $\var{\mu}$ is the mean and $\var{\sigma}$ is
    the standard deviation, all three in the same unit, which the division cancels; the z-score
    $\var{z}$ is therefore a pure number with no unit. The standard deviation must be positive. A
    positive $\var{z}$ marks a value above the mean, a negative one a value below it, and zero a
    value equal to the mean.

    Subtracting the mean shifts the centre of the data to zero, and dividing by the standard
    deviation rescales its spread to one. Read in reverse, the value equals the mean plus $\var{z}$
    standard deviations, which recovers a raw score from a standardized one. For a normal
    distribution, about 68 percent of values have a z-score within one unit of zero, about 95
    percent within two units and about 99.7 percent within three.

    The formula itself holds for any data set, but those percentages, and any tail probability read
    from a standard normal table, assume that the data are close to normally distributed. With a
    sample instead of a whole population, the sample mean and the sample standard deviation take the
    place of the population values, so the result is only an estimate.

    Standardized scores rank test results, flag outliers in quality control and put measurements in
    different units on a common scale. A value of 17 drawn from a distribution with mean 5 and
    standard deviation 6 has a z-score of 2: it lies two standard deviations above the mean.
