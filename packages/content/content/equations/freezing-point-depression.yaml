description:
  en: >-
    Freezing point depression is the drop in the freezing point of a solvent when a solute is
    dissolved in it. For dilute solutions the drop is proportional to the molality of dissolved
    particles, with the solvent's cryoscopic constant as the factor. Like boiling point elevation it
    is a colligative property, set by the number of solute particles rather than by their identity.

    $\var{\Delta T_\mathrm{f}}$ is the depression, the freezing point of the pure solvent minus that
    of the solution, counted positive as the size of the drop, in kelvin or, with the same value,
    degrees Celsius. $\var{i}$ is the van 't Hoff factor, the number of particles per dissolved
    formula unit, and $\var{K_\mathrm{f}}$ the cryoscopic constant of the solvent in kelvin
    kilograms per mole. $\mag{b}$ is the molality of the solute, in moles per kilogram of solvent.

    When the solid that forms is the pure solvent, the dissolved particles lower the escaping
    tendency of the liquid, so the liquid and the solid can only coexist at a lower temperature. The
    same effect lets road salt melt ice and lets antifreeze protect engine coolant.

    The relation assumes a dilute solution whose solute stays in the liquid when the solvent
    freezes. Ions attract one another, so the measured factor is smaller than the ideal count:
    a solution of 1.0 mole of sodium chloride per kilogram of water is expected to freeze 3.7 kelvin
    low but freezes only 3.4 kelvin low. For water the cryoscopic constant is 1.86 kelvin kilograms
    per mole, and a depression measured for a known mass of solute gives its molar mass.

    François-Marie Raoult, who taught chemistry at the science faculty of Grenoble, measured in 1878
    how eighteen salts lower the freezing point of water, and between 1882 and 1884 he turned the
    lowering into a method for finding the molecular mass of organic compounds.
