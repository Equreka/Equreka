name:
  en: 'Gibbs free energy change'
kind: 'formula'
level: 'intro'
expression: '\var{\Delta G}=\var{\Delta H}-\mag{T}\mag{\Delta S}'
terms:
  \Delta G:
    kind: 'symbol'
    label:
      en: 'Gibbs energy change of the reaction'
    unit: 'joule-per-mole'
  \Delta H:
    kind: 'symbol'
    label:
      en: 'Enthalpy change of the reaction'
    unit: 'joule-per-mole'
  T:
    kind: 'magnitude'
    ref: 'thermodynamic-temperature'
  \Delta S:
    kind: 'magnitude'
    ref: 'molar-entropy'
solutions:
  \Delta G: 'DeltaH - T * DeltaS'
  \Delta H: 'DeltaG + T * DeltaS'
  T: '(DeltaH - DeltaG) / DeltaS'
  \Delta S: '(DeltaH - DeltaG) / T'
