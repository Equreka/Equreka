description:
  en: >-
    Boiling point elevation is the rise in the boiling point of a solvent when a non-volatile
    solute is dissolved in it. For dilute solutions the rise is proportional to the molality of
    dissolved particles, with the solvent's ebullioscopic constant as the factor. It is one of the
    colligative properties of solutions, which depend on how many solute particles are present and
    not on what they are.

    $\var{\Delta T_\mathrm{b}}$ is the elevation, the boiling point of the solution minus that of the
    pure solvent, a positive temperature difference in kelvin with the same value in degrees
    Celsius. $\var{i}$ is the van 't Hoff factor, the number of particles each dissolved formula unit
    yields: one for a non-electrolyte such as sucrose, close to two for sodium chloride.
    $\var{K_\mathrm{b}}$ is the ebullioscopic constant, a property of the solvent alone in kelvin
    kilograms per mole, and $\mag{b}$ is the molality of the solute in moles per kilogram of solvent.

    The solute lowers the vapour pressure of the solvent, so the solution must be heated further
    before its vapour pressure reaches the surrounding pressure and it boils. Molality is used
    instead of molarity because it does not change as the solution warms and expands.

    The relation holds for dilute solutions of solutes that do not evaporate. Measured van 't Hoff
    factors fall below the whole number of ions, because ions attract one another and some pair up:
    at 0.050 moles per kilogram, magnesium sulfate behaves as 1.3 particles instead of 2. For water
    the ebullioscopic constant is 0.512 kelvin kilograms per mole.

    A solution of 0.33 moles of a non-electrolyte per kilogram of benzene, whose constant is 2.53,
    boils 0.83 kelvin above the pure solvent.
