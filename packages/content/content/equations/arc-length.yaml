name:
  en: 'Arc length of a circle'
kind: 'formula'
level: 'intro'
expression: '\var{s}=\var{r}\mag{\theta}'
terms:
  s:
    kind: 'symbol'
    label:
      en: 'Arc length'
    unit: 'metre'
  r:
    kind: 'variable'
    ref: 'radius'
  \theta:
    kind: 'magnitude'
    ref: 'plane-angle'
solutions:
  s: 'r * theta'
  r: 's / theta'
  \theta: 's / r'
calculator:
  enabled: true
categories:
