name:
  en: 'Relation between Ka and Kb'
kind: 'equation'
level: 'intermediate'
expression: '\var{K_\mathrm{a}}\var{K_\mathrm{b}}=\var{K_\mathrm{w}}'
terms:
  K_\mathrm{a}:
    kind: 'symbol'
    label:
      en: 'Acid dissociation constant'
  K_\mathrm{b}:
    kind: 'symbol'
    label:
      en: 'Base dissociation constant of the conjugate base'
  K_\mathrm{w}:
    kind: 'symbol'
    label:
      en: 'Ion product of water'
solutions:
