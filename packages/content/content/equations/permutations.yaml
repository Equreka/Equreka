name:
  en: 'Permutations'
kind: 'formula'
level: 'intro'
expression: '\var{P}=\frac{\var{n}!}{\left(\var{n}-\var{k}\right)!}'
terms:
  P:
    kind: 'symbol'
    integer: true
    label:
      en: 'Number of permutations'
  n:
    kind: 'symbol'
    integer: true
    label:
      en: 'Number of objects available'
  k:
    kind: 'symbol'
    integer: true
    label:
      en: 'Number of objects arranged'
solutions:
  P: 'factorial(n) / factorial(n - k)'
calculator:
  enabled: true
  solveFor: ['P']
categories:
  - 'mathematics'
branches:
