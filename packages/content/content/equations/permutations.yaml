references:
  - title: 'OpenStax, Precalculus, 11.5 Counting Principles'
    url: 'https://openstax.org/books/precalculus/pages/11-5-counting-principles'
  - title: 'OpenStax, Contemporary Mathematics, 7.2 Permutations'
