name:
  en: 'Number of entities in an amount of substance'
kind: 'formula'
level: 'intro'
expression: '\var{N}=\mag{n}\const{N_\mathrm{A}}'
terms:
  N:
    kind: 'symbol'
    label:
      en: 'Number of entities'
  n:
    kind: 'magnitude'
    ref: 'substance'
  N_\mathrm{A}:
    kind: 'constant'
    ref: 'avogadro-constant'
