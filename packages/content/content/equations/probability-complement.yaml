name:
  en: 'Complement rule'
kind: 'equation'
level: 'intro'
expression: '\var{P(A'')}=1-\var{P(A)}'
terms:
  P(A'):
    kind: 'symbol'
    identifier: 'P_notA'
    label:
      en: 'Probability that A does not occur'
  P(A):
    kind: 'symbol'
    identifier: 'P_A'
    label:
      en: 'Probability of A'
