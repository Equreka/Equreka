description:
  en: >-
    Poiseuille's law, also called the Hagen–Poiseuille equation, gives the volume of a viscous
    fluid that flows each second through a straight cylindrical tube in steady laminar flow. The
    flow rate is proportional to the pressure difference between the ends and to the fourth power
    of the radius, and inversely proportional to the viscosity and the length, which makes it the
    basic law of fluid mechanics for pipes, needles, capillaries and blood vessels.

    In the equation, $\mag{Q}$ is the volumetric flow rate in cubic metres per second; $\var{r}$ the
    inner radius of the tube and $\var{L}$ its length, both in metres; $\mag{\eta}$ the dynamic
    viscosity of the fluid in pascal seconds; and $\var{\Delta p}$ the pressure difference between
    the ends in pascals, the inlet minus the outlet. The flow runs from high to low pressure, so with
    this sign convention a positive pressure difference gives a positive flow rate.

    Viscosity holds the layer touching the wall at rest, and the speed rises to a maximum on the
    axis along a parabolic profile; adding up the flow through every thin ring of that profile gives
    the law. The quotient of the pressure difference and the flow rate is a resistance to flow,
    eight times the viscosity times the length over pi times the radius to the fourth, which plays
    the role of electrical resistance in Ohm's law. The fourth power dominates: narrowing a tube by
    5 percent cuts the flow to about 0.81 of its value at the same pressure difference.

    The law holds for steady laminar flow of a uniform, incompressible fluid whose viscosity does
    not depend on the flow, a Newtonian fluid, in a rigid tube of constant radius. Turbulence, which
    sets in at high Reynolds numbers, makes the real flow smaller than predicted.

    The law bears the name of J. L. Poiseuille, a French scientist who studied how blood moves through the body. A flow of 0.120 cubic centimetres per second of a water-like solution at 20 degrees Celsius through a needle 2.50 centimetres long and 0.150 millimetres in radius needs about 15.1
    kilopascals across it.
