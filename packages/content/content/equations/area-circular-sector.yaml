name:
  en: 'Area of a circular sector'
kind: 'formula'
level: 'intro'
expression: '\mag{A}=\frac{1}{2}\var{r}^{2}\mag{\theta}'
terms:
  A:
    kind: 'magnitude'
    ref: 'area'
  r:
    kind: 'variable'
    ref: 'radius'
  \theta:
    kind: 'magnitude'
    ref: 'plane-angle'
solutions:
  A: 'r^2 * theta / 2'
  r: 'sqrt(2 * A / theta)'
  \theta: '2 * A / r^2'
calculator:
  enabled: true
categories:
