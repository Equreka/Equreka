name:
  en: 'Area of an ellipse'
kind: 'formula'
level: 'intro'
expression: '\mag{A}=\const{\pi}\var{a}\var{b}'
terms:
  A:
    kind: 'magnitude'
    ref: 'area'
  \pi:
    kind: 'constant'
    ref: 'pi'
  a:
    kind: 'symbol'
