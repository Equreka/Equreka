description:
  en: >-
    Motional emf is the electromotive force that appears across a conductor moving through a
    magnetic field. For a straight rod sliding at right angles to a uniform field, it equals the
    magnetic flux density times the length of the rod times its speed. It is a special case of
    Faraday's law of induction in electromagnetism and the principle of the simplest generators.

    $\mag{\mathcal{E}}$ is the size of the induced emf, in volts. $\mag{B}$ is the magnetic flux
    density in teslas (the gauss is also accepted), $\var{L}$ is the length of the rod in metres,
    and $\mag{v}$ is its speed in metres per second. The field, the rod and the velocity are all at
    right angles to one another. The polarity follows Lenz's law: the end towards which the magnetic
    force drives positive charges becomes the positive terminal. Faraday's law of induction gives
    the same emf with a sign tied to the normal chosen for the flux; this form gives only its size.

    When the rod closes a circuit by sliding along two parallel rails, each second it sweeps out an
    area equal to its length times its speed, so the flux through the circuit grows at the
    rate field times length times speed, and Faraday's law turns that rate into the emf. The same
    result follows from the magnetic force on the free charges inside the rod, which pushes them
    towards one end until the charge that piles up there balances the push.

    The formula holds for a straight rod in a uniform field with all three directions mutually
    perpendicular. When the motion is tilted, only the part of the velocity across the field counts,
    and a rod moving along the field lines has no emf at all. Once current flows, the field pushes
    back on the rod against its motion, so keeping it moving takes work, which reappears as
    electrical energy in the circuit.

    In an orbiting tether experiment, a conductor 20.0 km long moving at 7.80 km/s across Earth's
    field of about $5\times10^{-5}\,\mathrm{T}$ was predicted to develop 7.80 kilovolts; the
    measured value was smaller because the motion was not perpendicular to the field.
