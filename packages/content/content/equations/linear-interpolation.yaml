name:
  en: 'Linear interpolation'
kind: 'formula'
level: 'intro'
expression: '\var{y}=\var{y_{0}}+\left(\var{x}-\var{x_{0}}\right)\frac{\var{y_{1}}-\var{y_{0}}}{\var{x_{1}}-\var{x_{0}}}'
terms:
  y:
    kind: 'symbol'
    label:
      en: 'Estimated output'
  y_{0}:
    kind: 'symbol'
    label:
      en: 'Output of the first known point'
  x:
    kind: 'symbol'
    label:
      en: 'Input to estimate at'
  x_{0}:
    kind: 'symbol'
    label:
      en: 'Input of the first known point'
  y_{1}:
    kind: 'symbol'
    label:
      en: 'Output of the second known point'
  x_{1}:
    kind: 'symbol'
    label:
      en: 'Input of the second known point'
solutions:
  y: 'y_0 + (x - x_0) * (y_1 - y_0) / (x_1 - x_0)'
  y_{0}: '(y * (x_1 - x_0) - (x - x_0) * y_1) / (x_1 - x)'
  x: 'x_0 + (y - y_0) * (x_1 - x_0) / (y_1 - y_0)'
  x_{0}: '(x * (y_1 - y_0) - x_1 * (y - y_0)) / (y_1 - y)'
  y_{1}: 'y_0 + (y - y_0) * (x_1 - x_0) / (x - x_0)'
  x_{1}: 'x_0 + (x - x_0) * (y_1 - y_0) / (y - y_0)'
