name:
  en: 'Moment of inertia of a point mass'
kind: 'formula'
level: 'intermediate'
expression: '\mag{I}=\mag{m}\var{r}^{2}'
terms:
  I:
    kind: 'magnitude'
    ref: 'moment-of-inertia'
  m:
