description:
  en: >-
    A point mass has a moment of inertia about any axis equal to its mass times the square of its
    perpendicular distance from that axis. In rotational mechanics it is the simplest case of
    rotational inertia, the resistance of a body to a change in its rate of turning, and the
    building block from which the moment of inertia of every extended body is assembled.

    Here $\mag{I}$ is the moment of inertia in kilogram square metres, $\mag{m}$ is the mass in
    kilograms and $\var{r}$ is the distance in metres from the axis to the particle, measured at
    right angles to the axis. All three are non-negative, so solving for the distance keeps only the
    non-negative square root. The value belongs to a chosen axis: the same particle has a different
    moment of inertia about every other axis.

    Because the distance enters squared, mass far from the axis counts much more than mass near it:
    moving a particle twice as far out multiplies its moment of inertia by four. For several
    particles turning together about one axis, the moments add, so a system of masses has the sum
    of each mass times the square of its own distance. A continuous body replaces that sum with an
    integral over its mass, which yields the familiar results for rods, cylinders and spheres.

    The formula treats the body as a point, with all its mass at one distance from the axis. It is a
    good approximation when the size of the object is small compared with that distance, such as a
    child on the edge of a playground merry-go-round or a small weight on a long, light arm.

    A child of 25 kilograms sitting 1.0 metre from the axis of a merry-go-round adds
    $25\,\mathrm{kg\,m^{2}}$ to its moment of inertia.
