description:
  en: >-
    The Poisson probability formula gives the chance that exactly k events happen within a set
    stretch of time or region of space when the events occur independently of one another at a known average
    rate. It is the probability mass function of the Poisson distribution, the standard model in
    statistics for counts such as calls to a help desk per hour, typing errors per page or
    radioactive decays per second.

    In the formula, $\var{k}$ is the number of events, a non-negative whole number, and
    $\var{\lambda}$ is the mean number of events expected in the interval, a positive pure number
    equal to the average rate times the length of the interval. $\var{P(X=k)}$ is the probability
    that the count X equals k, a pure number from 0 to 1. The exclamation mark denotes the factorial
    and e is Euler's number.

    The distribution has a single parameter: its mean and its variance both equal $\var{\lambda}$,
    so the standard deviation is the square root of the mean. Summed over every k from zero upwards,
    the probabilities add up to one, because the powers of $\var{\lambda}$ divided by the factorials
    rebuild the exponential series. The formula is also the limit of the binomial probability when
    the number of trials grows large and the probability of success shrinks, with their product held
    at $\var{\lambda}$. The mean appears both as a base and in an exponent, so neither it nor the
    count can be isolated, and the calculator solves only for the probability.

    The model requires a constant average rate across the interval, independent events and no two
    events at exactly the same instant. As an approximation to a binomial, one textbook rule of thumb
    asks for more than 20 trials and a success probability below 0.05.

    Siméon Denis Poisson introduced the distribution in his treatise of 1837 on the probability of
    judgements in criminal and civil matters. With 41.5 text messages a day, about 1.7292 an hour, the
    chance of exactly two in a given hour is about 0.2653.
