description:
  en: >-
    The Compton shift is the increase in wavelength of an X-ray or gamma-ray photon scattered by a
    free electron, given by the Compton wavelength of the electron times one minus the cosine of the
    scattering angle. It describes the Compton effect, the evidence in modern physics that light
    carries momentum in quanta and scatters off electrons as a particle would.

    $\var{\Delta\lambda}$ is the wavelength of the scattered photon minus that of the incident one,
    in metres; it is never negative. $\mag{\theta}$ is the scattering angle between the incident and
    scattered directions, from 0 to 180 degrees. The constants are the Planck constant $\const{h}$,
    the electron mass $\const{m_\mathrm{e}}$ and the speed of light $\const{c}$. Their combination
    h over the electron mass times c is the Compton wavelength of the electron, about
    $2.426\times10^{-12}\,\mathrm{m}$ in the CODATA 2022 value.

    Treating the photon and the electron as colliding particles, with energy and momentum both
    conserved and the electron at rest at the start, yields the formula. The shift is zero for a
    photon that continues straight on, one Compton wavelength at 90 degrees and twice that, its
    largest value, for a photon scattered straight back. The formula holds the angle alone and no trace
    of the incident wavelength, so the shift stands out only for short wavelengths, where a few
    picometres are a sizeable fraction.

    The formula assumes a free electron at rest, a good approximation for loosely bound outer
    electrons. A photon that strikes a tightly bound inner electron in effect collides with the whole
    atom, whose far larger mass makes the shift negligible, so measured spectra also keep a peak at
    the original wavelength.

    Arthur Compton observed the effect with X-rays in 1922, published the quantum explanation in
    1923 and received a share of the Nobel Prize in Physics of 1927 for it. A 71-picometre X-ray scattered
    by 30 degrees lengthens by about 0.325 picometres.
