  c:
    kind: 'constant'
    ref: 'speed-of-light'
  \theta:
    kind: 'magnitude'
    ref: 'plane-angle'
solutions:
  \Delta\lambda: '2 * h / (m_e * c) * sin(theta / 2)^2'
  \theta: '2 * asin(sqrt(Deltalambda * m_e * c / (2 * h)))'
