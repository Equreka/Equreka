name:
  en: 'Compton shift'
kind: 'formula'
level: 'intermediate'
expression: '\var{\Delta\lambda}=\frac{\const{h}}{\const{m_\mathrm{e}}\const{c}}\left(1-\cos\mag{\theta}\right)'
terms:
  \Delta\lambda:
    kind: 'symbol'
    label:
      en: 'Wavelength shift'
    unit: 'metre'
  h:
    kind: 'constant'
    ref: 'planck-constant'
  m_\mathrm{e}:
    kind: 'constant'
