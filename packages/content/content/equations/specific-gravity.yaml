description:
  en: >-
    Specific gravity, also called relative density, is the density of a substance divided by the
    density of water, the reference fluid. As a ratio of two densities it is a pure number with no
    unit, and it shows at once whether a solid sinks or floats in water and how many times heavier
    than the same volume of water a material is.

    Here $\var{\mathrm{SG}}$ is the specific gravity, a pure number; $\var{\rho_\mathrm{o}}$ is the
    density of the object or substance and $\var{\rho_\mathrm{w}}$ the reference density of water,
    both in kilograms per cubic metre, so the units cancel. All three are positive. The usual
    reference is water at 4 degrees Celsius, the temperature of its greatest density, where its
    density is about 1000 kilograms per cubic metre (999.97 in precise tables), and it is slightly
    lower on either side of that temperature.

    Since the reference density is 1000 kilograms per cubic metre, the specific gravity equals the
    density written in grams per cubic centimetre: aluminium has a specific gravity of about 2.7 and
    cork about 0.24. An object with a specific gravity below one floats in fresh water, with that
    same fraction of its volume submerged; above one it sinks.

    Both densities change with temperature, so a precise value states the temperature of the sample
    and of the reference water. The general term relative density also admits other reference
    substances, while specific gravity in the strict sense compares with water. For a hollow or
    composite object the formula gives the specific gravity of its average density.

    Weighing a sample in air and again fully submerged in water yields its specific gravity: the
    loss of weight equals the weight of the water displaced, so the weight in air divided by that
    loss is the ratio of the densities.
