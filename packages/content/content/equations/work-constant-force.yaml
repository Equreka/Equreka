name:
  en: 'Work done by a constant force'
kind: 'formula'
level: 'intro'
expression: '\mag{W}=\mag{F}\var{d}\cos\mag{\theta}'
terms:
  W:
    kind: 'magnitude'
    ref: 'work'
  F:
    kind: 'magnitude'
    ref: 'force'
  d:
    kind: 'symbol'
    label:
      en: 'Displacement magnitude'
    unit: 'metre'
  \theta:
    kind: 'magnitude'
    ref: 'plane-angle'
solutions:
  W: 'F * d * cos(theta)'
  F: 'W / (d * cos(theta))'
  d: 'W / (F * cos(theta))'
  \theta: 'acos(W / (F * d))'
calculator:
  enabled: true
categories:
