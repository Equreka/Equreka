references:
  - title: 'OpenStax, College Physics 2e, 7.1 Work: The Scientific Definition, Example 7.1'
    url: 'https://openstax.org/books/college-physics-2e/pages/7-1-work-the-scientific-definition'
  - title: 'OpenStax, University Physics Volume 1, 7.1 Work'
    url: 'https://openstax.org/books/university-physics-volume-1/pages/7-1-work'
  - title: 'R. Nave, HyperPhysics, Work, energy and power'
    url: 'https://hyperphysics.gsu.edu/hbase/work.html'
