name:
  en: 'Enthalpy of reaction from calorimetry'
kind: 'formula'
level: 'intro'
expression: '\var{\Delta H}=-\frac{\var{m}\mag{c}\var{\Delta T}}{\var{n}}'
terms:
  \Delta H:
    kind: 'symbol'
    label:
      en: 'Enthalpy change of the reaction'
    unit: 'joule-per-mole'
  m:
    kind: 'symbol'
    label:
      en: 'Mass of the solution'
    unit: 'kilogram'
  c:
    kind: 'magnitude'
    ref: 'specific-heat-capacity'
  \Delta T:
    kind: 'symbol'
    label:
      en: 'Temperature change'
    unit: 'kelvin'
    delta: true
  n:
    kind: 'symbol'
    label:
      en: 'Amount of the limiting reactant'
    unit: 'mole'
solutions:
  \Delta H: '-(m * c * DeltaT) / n'
  m: '-(DeltaH * n) / (c * DeltaT)'
  c: '-(DeltaH * n) / (m * DeltaT)'
  \Delta T: '-(DeltaH * n) / (m * c)'
  n: '-(m * c * DeltaT) / DeltaH'
