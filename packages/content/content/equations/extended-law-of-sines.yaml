name:
  en: 'Extended law of sines'
kind: 'equation'
level: 'intermediate'
expression: '\frac{\var{a}}{\sin\mag{\alpha}}=2\var{R}'
terms:
  a:
    kind: 'symbol'
    label:
      en: 'Side a'
    unit: 'metre'
  \alpha:
    kind: 'magnitude'
    ref: 'plane-angle'
  R:
    kind: 'symbol'
    label:
      en: 'Circumradius'
    unit: 'metre'
solutions:
  a: '2 * R * sin(alpha)'
  \alpha:
    - 'asin(a / (2 * R))'
    - 'pi - asin(a / (2 * R))'
  R: 'a / (2 * sin(alpha))'
