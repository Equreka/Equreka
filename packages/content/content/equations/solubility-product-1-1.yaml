description:
  en: >-
    For a sparingly soluble salt that dissolves into one cation and one anion, such as silver
    chloride or copper(I) bromide, the solubility product equals the square of the molar solubility
    taken relative to the standard amount concentration. It is the equilibrium constant for dissolution in
    chemical equilibrium, written for the simplest formula type.

    $\var{K_\mathrm{sp}}$ is the solubility product, a pure number. $\var{s}$ is the molar
    solubility, the amount of salt that dissolves per unit volume of saturated solution, in moles per
    cubic metre with moles per litre offered. $\const{c^{\circ}}$ is the standard concentration,
    exactly one mole per litre, so that a solubility in moles per litre enters as its plain number.

    In a saturated solution the solid is in equilibrium with its ions. Each formula unit that
    dissolves releases one cation and one anion, so both ion concentrations equal the molar
    solubility, and their product over the square of the standard concentration is the constant;
    the solid itself does not appear in the expression. Reading it the other way, the molar
    solubility is the standard concentration times the square root of the constant. Salts of other
    formula types follow other powers: one with two anions per cation gives four times the cube of
    the solubility ratio.

    The formula assumes the salt dissolves in pure water: an ion already present that the salt also releases lowers the solubility, the common ion effect. The solution must be dilute enough for concentrations to stand in for activities, and the constant depends on temperature. IUPAC calls this equilibrium
    constant of dissolution the solubility product, with the symbols Ksol or Ks, and Ksp is the
    textbook form.

    Copper(I) bromide has a solubility product of $6.3\times10^{-9}$, so its molar solubility is
    about $7.9\times10^{-5}$ moles per litre, as OpenStax shows.
