description:
  en: >-
    The Rydberg formula gives the wavelengths of the spectral lines of hydrogen: the reciprocal of
    each wavelength equals the Rydberg constant times the difference between the reciprocal squares
    of two whole numbers. It sums up the whole hydrogen spectrum, from the ultraviolet Lyman series
    to the visible Balmer series and the infrared series beyond, and is a cornerstone of atomic
    spectroscopy and modern physics.

    Here $\mag{\lambda}$ is the wavelength of the emitted or absorbed light in vacuum, in metres.
    $\var{n_{1}}$ and $\var{n_{2}}$ are the principal quantum numbers of the lower and upper levels,
    whole numbers with $\var{n_{1}}$ at least one and $\var{n_{2}}$ greater than $\var{n_{1}}$; the
    calculator cannot enforce that order, and a reversed pair returns a negative wavelength. The
    constant $\const{R_{\infty}}$ is the Rydberg constant, about $1.097\times10^{7}$ reciprocal
    metres.

    In the Bohr model the electron in level n has an energy proportional to minus one over n
    squared. A jump from the upper to the lower level releases a photon carrying the difference, and
    dividing that energy by the Planck constant and the speed of light gives the reciprocal
    wavelength. Each value of the lower number names a series: one for Lyman, two for Balmer, three
    for Paschen.

    The constant as written assumes a nucleus of infinite mass. For hydrogen the electron and proton
    both move about their common centre, and the constant must be divided by one plus the
    electron-to-proton mass ratio, which lowers it by about 0.05 percent, a shift far larger than
    the uncertainty of spectral measurements. The formula applies only to hydrogen and, scaled by
    the square of the nuclear charge, to ions with a single electron.

    Johann Balmer fitted the four visible hydrogen lines in 1885, and Johannes Rydberg had found his
    more general rule by 1887, publishing it in 1890. Niels Bohr derived it from his atomic model in
    1913. The Balmer line from level three to level two lies near 656 nanometres, the red line of
    hydrogen.
