    url: 'https://openstax.org/books/university-physics-volume-3/pages/6-4-bohrs-model-of-the-hydrogen-atom'
  - title: 'HyperPhysics (Georgia State University), Hydrogen energies and spectrum'
    url: 'http://hyperphysics.phy-astr.gsu.edu/hbase/hyde.html'
  - title: 'NIST, CODATA 2022 value: Rydberg constant'
    url: 'https://physics.nist.gov/cgi-bin/cuu/Value?ryd'
  - title: 'NIST, CODATA 2022 value: proton-electron mass ratio'
    url: 'https://physics.nist.gov/cgi-bin/cuu/Value?mpsme'
  - title: 'MacTutor History of Mathematics, Johannes Robert Rydberg (biography)'
    url: 'https://mathshistory.st-andrews.ac.uk/Biographies/Rydberg/'
