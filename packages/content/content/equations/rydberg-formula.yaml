name:
  en: 'Rydberg formula'
kind: 'formula'
level: 'intro'
expression: '\frac{1}{\mag{\lambda}}=\frac{\const{R_{\infty}}}{\var{n_{1}}^{2}}-\frac{\const{R_{\infty}}}{\var{n_{2}}^{2}}'
terms:
  \lambda:
    kind: 'magnitude'
    ref: 'wavelength'
  R_{\infty}:
    kind: 'constant'
    ref: 'rydberg-constant'
  n_{1}:
    kind: 'symbol'
    label:
      en: 'Principal quantum number of the lower level'
    integer: true
  n_{2}:
    kind: 'symbol'
    label:
      en: 'Principal quantum number of the upper level'
    integer: true
solutions:
  \lambda: '1 / (R_infty * (1 / n_1^2 - 1 / n_2^2))'
  n_{1}: '1 / sqrt(1 / (lambda * R_infty) + 1 / n_2^2)'
  n_{2}: '1 / sqrt(1 / n_1^2 - 1 / (lambda * R_infty))'
calculator:
  enabled: true
externalIds:
  wikidata: 'Q661248'
categories:
  - 'physics'
branches:
