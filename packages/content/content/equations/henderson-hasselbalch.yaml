description:
  en: >-
    The Henderson-Hasselbalch equation gives the pH of a buffer solution of a weak acid and its
    conjugate base: the pKa of the acid plus the base-ten logarithm of the ratio of the conjugate
    base concentration to the acid concentration. It is the working equation of acid-base chemistry,
    biochemistry and physiology for buffers that hold the pH of a solution, or of blood, nearly
    constant.

    $\mag{\mathrm{pH}}$ is the pH of the solution and $\var{\mathrm{p}K_\mathrm{a}}$ the pKa of the
    weak acid, both pure numbers. $\var{[\mathrm{A}^{-}]}$ is the equilibrium concentration of the
    conjugate base, often supplied as a salt such as sodium acetate, and $\var{[\mathrm{HA}]}$ that
    of the undissociated acid; both are entered in the same unit, usually moles per litre, because
    only their ratio counts, so the standard amount concentration cancels.

    The equation is the acid dissociation constant rearranged for the hydronium concentration, with
    minus the logarithm taken of both sides. Equal amounts of acid and base give a pH equal to the
    pKa; a tenfold excess of base raises the pH by one unit, a tenfold excess of acid lowers it by
    one. Because added acid or base changes the ratio only a little, the pH of a buffer barely moves.

    It assumes that the ionization of the acid and the hydrolysis of the base hardly change the
    amounts put in, so the concentrations prepared can be used as equilibrium values; this fails
    for very dilute buffers and when one component falls below about a tenth of the other, where a
    buffer also stops resisting pH changes. Concentrations stand in for activities, as in every
    dilute solution.

    Lawrence Henderson wrote the relation for the carbonic acid buffer of blood in 1908, and Karl
    Hasselbalch recast it in logarithmic form in 1916. A buffer with 0.10 mol/L each of acetic acid
    and sodium acetate has a pH of 4.74.
