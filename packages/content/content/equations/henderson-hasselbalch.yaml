name:
  en: 'Henderson-Hasselbalch equation'
kind: 'equation'
level: 'intermediate'
expression: '\mag{\mathrm{pH}}=\var{\mathrm{p}K_\mathrm{a}}+\log_{10}\left(\frac{\var{[\mathrm{A}^{-}]}}{\var{[\mathrm{HA}]}}\right)'
terms:
  \mathrm{pH}:
    kind: 'magnitude'
    ref: 'ph'
  \mathrm{p}K_\mathrm{a}:
    kind: 'symbol'
    label:
      en: 'pKa of the acid'
    identifier: 'pK_a'
  '[\mathrm{A}^{-}]':
    kind: 'symbol'
    label:
      en: 'Conjugate base concentration'
    unit: 'mole-per-cubic-metre'
    identifier: 'cA'
  '[\mathrm{HA}]':
    kind: 'symbol'
    label:
      en: 'Undissociated acid concentration'
    unit: 'mole-per-cubic-metre'
    identifier: 'cHA'
solutions:
  \mathrm{pH}: 'pK_a + log10(cA / cHA)'
  \mathrm{p}K_\mathrm{a}: 'pH - log10(cA / cHA)'
  '[\mathrm{A}^{-}]': 'cHA * 10^(pH - pK_a)'
  '[\mathrm{HA}]': 'cA * 10^(pK_a - pH)'
