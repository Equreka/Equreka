name:
  en: 'Cyclotron radius'
kind: 'formula'
level: 'intro'
expression: '\var{r}=\frac{\mag{m}\mag{v}}{\left|\mag{q}\right|\mag{B}}'
terms:
  r:
    kind: 'symbol'
    label:
      en: 'Radius of the circular path'
    unit: 'metre'
  m:
    kind: 'magnitude'
    ref: 'mass'
  v:
    kind: 'magnitude'
    ref: 'speed'
  q:
    kind: 'magnitude'
    ref: 'electric-charge'
  B:
    kind: 'magnitude'
    ref: 'magnetic-flux-density'
solutions:
  r: 'm * v / (abs(q) * B)'
  m: 'r * abs(q) * B / v'
  v: 'r * abs(q) * B / m'
  q:
    - 'm * v / (r * B)'
    - '-(m * v / (r * B))'
  B: 'm * v / (abs(q) * r)'
