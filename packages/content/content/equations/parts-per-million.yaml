name:
  en: 'Mass fraction in parts per million'
kind: 'formula'
level: 'intro'
expression: '\var{w_\mathrm{B}}=\frac{\var{m_\mathrm{B}}}{\var{m_\mathrm{sample}}}'
terms:
  w_\mathrm{B}:
    kind: 'symbol'
    label:
      en: 'Mass fraction of the trace substance'
    unit: 'unitless'
  m_\mathrm{B}:
    kind: 'symbol'
    label:
      en: 'Mass of the trace substance'
    unit: 'kilogram'
  m_\mathrm{sample}:
    kind: 'symbol'
    label:
      en: 'Mass of the sample'
    unit: 'kilogram'
solutions:
  w_\mathrm{B}: 'm_B / m_sample'
  m_\mathrm{B}: 'w_B * m_sample'
  m_\mathrm{sample}: 'm_B / w_B'
calculator:
  enabled: true
categories:
  - 'chemistry'
branches:
  - 'solutions'
aliases:
  - 'parts per million formula'
  - 'ppm formula'
  - 'ppm concentration'
  - 'parts per billion formula'
