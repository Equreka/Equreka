references:
  - title: 'OpenStax, Chemistry 2e, 3.4 Other Units for Solution Concentrations'
    url: 'https://openstax.org/books/chemistry-2e/pages/3-4-other-units-for-solution-concentrations'
  - title: 'Portland Community College, CH105 Allied Health Chemistry II, 3.2 Units of Concentration (LibreTexts)'
    url: 'https://chem.libretexts.org/Courses/Portland_Community_College/CH105%3A_Allied_Health_Chemistry_II/03%3A_Solutions/3.02%3A_Units_of_Concentration'
  - title: 'NIST, Guide to the SI (SP 811), Chapter 7, 7.10.3 ppm, ppb, and ppt'
    url: 'https://www.nist.gov/pml/special-publication-811/nist-guide-si-chapter-7-rules-and-style-conventions-expressing-values'
