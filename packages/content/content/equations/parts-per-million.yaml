description:
  en: >-
    A concentration in parts per million, ppm, is the mass fraction of a trace substance, its mass
    divided by the mass of the sample that contains it, stated as a number of millionths. It is the
    usual way of stating small amounts of a contaminant in drinking water and other samples, where a
    percentage would need many leading zeros; parts per billion, ppb, state the same ratio in
    thousand-millionths.

    $\var{w_\mathrm{B}}$ is the mass fraction of the trace substance B, a pure number that the
    calculator can show in parts per million, parts per billion or percent. $\var{m_\mathrm{B}}$ is
    the mass of the substance and $\var{m_\mathrm{sample}}$ the mass of the whole sample or solution;
    both are positive and share one unit, the kilogram in SI. A fraction of one millionth is 1 ppm.

    The ratio is the same as in the mass percent formula, shown on a finer scale: one percent is
    ten thousand parts per million. A fraction of 1 ppm means one milligram of substance per kilogram
    of sample, and for dilute solutions in water, whose density is close to one gram per millilitre,
    about one milligram per litre.

    The notation is ambiguous. For gases, ppm usually counts molecules, so the carbon dioxide in air
    is an amount fraction, and some fields use volumes. NIST Special Publication 811 does not accept
    ppm and ppb for values stated with the SI and recommends naming the quantity and writing an
    explicit ratio of units instead, as in its example of a sensitivity of 2 ng/kg; billion also
    means a million million in many countries.

    A wastewater sample of 50.0 g containing 0.48 mg of mercury holds 9.6 ppm of mercury.
