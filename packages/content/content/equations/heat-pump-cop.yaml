description:
  en: >-
    For a heat pump, the coefficient of performance is the heat the machine delivers to the warm
    space divided by the work needed to run it. Abbreviated COP, it is the figure of merit of heat pumps used for
    heating buildings and water in thermodynamics, the same machine as a refrigerator judged by the
    heat it gives off on the hot side instead of the heat it takes from the cold side.

    $\var{K_\mathrm{HP}}$ is the coefficient of performance, a pure number that compares two
    energies and is always greater than 1. $\var{Q_\mathrm{h}}$ is the heat delivered to the hot
    reservoir and $\mag{W}$ the work done on the machine, both in joules over the same cycle or the
    same time interval and both counted as positive; power in watts gives the same ratio. The work
    is done on the machine, the opposite sense to the first-law form, where the work is done by the
    system.

    A heat pump draws heat from a cold reservoir, such as the outdoor air, and the work
    adds to it, so the heat delivered equals the heat extracted plus the work. Dividing by the work
    shows that the coefficient of the heat pump is the coefficient of the same machine run as a
    refrigerator plus one, which is why it exceeds 1 without breaking the conservation of energy.

    The second law caps the value at that of a reversible Carnot cycle, the hot absolute temperature
    divided by the difference between the hot and cold temperatures, so the advantage shrinks as
    the outdoor air gets colder. Real heat pumps stay well below that bound, with values typically
    between 2 and 4.

    Compared with an electric heater, which turns each joule of electrical work into one joule of
    heat, a heat pump supplies several. A Carnot heat pump moving heat from air at -15.0 degrees
    Celsius into a space at 45.0 degrees Celsius would reach about 5.30.
