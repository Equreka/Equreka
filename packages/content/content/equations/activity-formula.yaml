description:
  en: >-
    The activity of a sample of one radionuclide equals its decay constant multiplied by the number
    of radioactive nuclei it contains. Activity is the decay rate, the number of nuclei that
    disintegrate per unit time, and the formula ties this measurable rate, counted in becquerels,
    to the quantity of radioactive material present.

    Here $\mag{A}$ is the activity, in becquerels, one becquerel being one decay per second (the
    curie, a unit outside the SI kept for activity, is also accepted, one curie being exactly
    $3.7\times10^{10}$ becquerels). The
    decay constant $\var{\lambda}$ is the probability per unit time that one nucleus decays, in
    reciprocal seconds, a fixed property of the radionuclide. $\var{N}$ is the number of nuclei
    not yet decayed, a count with no unit. The decay constant is positive; the activity and the
    number of nuclei are never negative.

    Each nucleus has the same chance $\var{\lambda}$ of decaying in each second, so a sample of
    $\var{N}$ nuclei loses on average that chance times their number every second. The formula
    therefore explains why short-lived isotopes are intensely radioactive for their mass while very
    long-lived ones are only weakly so. The number of nuclei in a weighed sample follows from its
    mass divided by the molar mass of the isotope and multiplied by the Avogadro constant.

    The formula is an average over many nuclei and holds at every instant, but the activity
    changes as the sample decays, falling with the number of remaining nuclei. It gives the decays
    of one radionuclide only; a sample that also contains radioactive daughter products has a
    total activity that is the sum of each one's own decay constant times its own count. The
    activity counts decays, not the radiation absorbed by anything nearby, which dose quantities
    describe.

    One gram of strontium-90, about $6.70\times10^{21}$ nuclei, has an activity of about
    $5.1\times10^{12}$ becquerels, close to 140 curies.
