name:
  en: 'Thin lens equation'
kind: 'equation'
level: 'intro'
expression: '\frac{1}{\var{d_\mathrm{o}}}+\frac{1}{\var{d_\mathrm{i}}}=\frac{1}{\var{f}}'
terms:
  d_\mathrm{o}:
    kind: 'symbol'
    label:
      en: 'Object distance'
    unit: 'metre'
  d_\mathrm{i}:
    kind: 'symbol'
    label:
      en: 'Image distance'
    unit: 'metre'
  f:
    kind: 'symbol'
    label:
      en: 'Focal length'
    unit: 'metre'
solutions:
  d_\mathrm{o}: 'd_i * f / (d_i - f)'
  d_\mathrm{i}: 'd_o * f / (d_o - f)'
  f: 'd_o * d_i / (d_o + d_i)'
