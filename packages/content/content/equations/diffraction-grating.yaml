name:
  en: 'Diffraction grating equation'
kind: 'equation'
level: 'intro'
expression: '\var{d}\sin\mag{\theta}=\var{m}\mag{\lambda}'
terms:
  d:
    kind: 'symbol'
    label:
      en: 'Grating spacing'
    unit: 'metre'
  \theta:
    kind: 'magnitude'
    ref: 'plane-angle'
  m:
    kind: 'symbol'
    label:
      en: 'Order of the maximum'
    integer: true
  \lambda:
    kind: 'magnitude'
    ref: 'wavelength'
solutions:
  d: 'm * lambda / sin(theta)'
  \theta: 'asin(m * lambda / d)'
  m: 'd * sin(theta) / lambda'
  \lambda: 'd * sin(theta) / m'
