    url: 'https://geo.libretexts.org/Bookshelves/Sedimentology/Introduction_to_Fluid_Motions_and_Sediment_Transport_(Southard)/03%3A_Flow_Past_a_Sphere_II_-_Stokes''_Law_The_Bernoulli_Equation_Turbulence_Boundary_Layers_Flow_Separation/3.09%3A_Settling_of_Spheres'
  - title: 'J. Southard, Introduction to Fluid Motions and Sediment Transport (MIT, Geosciences LibreTexts), 3.2 Flow Past a Sphere at Low Reynolds Numbers'
    url: 'https://geo.libretexts.org/Bookshelves/Sedimentology/Introduction_to_Fluid_Motions_and_Sediment_Transport_(Southard)/03%3A_Flow_Past_a_Sphere_II_-_Stokes''_Law_The_Bernoulli_Equation_Turbulence_Boundary_Layers_Flow_Separation/3.02%3A_Flow_Past_a_Sphere_at_Low_Reynolds_Numbers'
  - title: 'OpenStax, University Physics Volume 1, 6.4 Drag Force and Terminal Speed (Stokes'' law)'
    url: 'https://openstax.org/books/university-physics-volume-1/pages/6-4-drag-force-and-terminal-speed'
  - title: 'OpenStax, College Physics 2e, 11.2 Density (Table 11.1)'
    url: 'https://openstax.org/books/college-physics-2e/pages/11-2-density'
  - title: 'OpenStax, College Physics 2e, 12.4 Viscosity and Laminar Flow; Poiseuille''s Law (Table 12.1)'
    url: 'https://openstax.org/books/college-physics-2e/pages/12-4-viscosity-and-laminar-flow-poiseuilles-law'
