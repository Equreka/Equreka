name:
  en: 'Stokes terminal velocity'
kind: 'formula'
level: 'intermediate'
expression: '\var{v_\mathrm{t}}=\frac{2\var{r}^{2}\left(\var{\rho_\mathrm{o}}-\var{\rho_\mathrm{f}}\right)\var{g}}{9\mag{\eta}}'
terms:
  v_\mathrm{t}:
    kind: 'symbol'
    label:
      en: 'Terminal velocity'
    unit: 'metre-per-second'
  r:
    kind: 'symbol'
    label:
      en: 'Radius of the sphere'
    unit: 'metre'
  \rho_\mathrm{o}:
    kind: 'symbol'
    label:
      en: 'Density of the sphere'
    unit: 'kilogram-per-cubic-metre'
  \rho_\mathrm{f}:
    kind: 'symbol'
    label:
      en: 'Fluid density'
    unit: 'kilogram-per-cubic-metre'
  g:
    kind: 'symbol'
    label:
      en: 'Gravitational acceleration'
    unit: 'metre-per-second-squared'
  \eta:
    kind: 'magnitude'
    ref: 'dynamic-viscosity'
solutions:
  v_\mathrm{t}: '2 * r^2 * (rho_o - rho_f) * g / (9 * eta)'
  r: 'sqrt(9 * eta * v_t / (2 * (rho_o - rho_f) * g))'
  \rho_\mathrm{o}: 'rho_f + 9 * eta * v_t / (2 * r^2 * g)'
  \rho_\mathrm{f}: 'rho_o - 9 * eta * v_t / (2 * r^2 * g)'
  g: '9 * eta * v_t / (2 * r^2 * (rho_o - rho_f))'
  \eta: '2 * r^2 * (rho_o - rho_f) * g / (9 * v_t)'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'fluid-mechanics'
aliases:
  - 'Stokes settling velocity'
  - 'settling velocity of a sphere'
  - 'terminal velocity in Stokes flow'
  - 'Stokes fall velocity'
  - 'falling ball viscometer equation'
  - 'velocidad de sedimentación'
  - 'velocidad terminal de Stokes'
references:
