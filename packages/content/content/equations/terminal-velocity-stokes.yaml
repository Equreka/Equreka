description:
  en: >-
    The Stokes terminal velocity is the steady speed at which a small sphere sinks or rises through
    a viscous fluid once its weight, the buoyant force and the viscous drag balance. It grows with
    the square of the radius and with the difference between the densities of the sphere and the
    fluid, and falls with the viscosity, so in fluid mechanics it sets the settling rate of silt,
    mist droplets and the balls of falling-ball viscometers.

    Here $\var{v_\mathrm{t}}$ is the terminal velocity in metres per second, positive downward; a
    negative value means the sphere is less dense than the fluid and rises, like a droplet of oil in water. The sign sets it apart from the general terminal speed, entered as a size.
    $\var{r}$ is the radius of the sphere in metres, $\var{\rho_\mathrm{o}}$ the density of the
    sphere and $\var{\rho_\mathrm{f}}$ that of the fluid, both in kilograms per cubic metre, and
    $\mag{\eta}$ the dynamic viscosity of the fluid in pascal seconds. $\var{g}$ is the size of the gravitational acceleration, entered positive; its standard value is 9.80665 metres per second squared, and the local value varies with place and differs on another planet or moon.

    The weight minus the buoyant force is the volume of the sphere times the density difference
    times $\var{g}$. Setting it equal to the Stokes drag, six pi times the viscosity times the radius
    times the speed, and solving for the speed gives the formula. A grain half as wide settles four times more slowly.

    The result holds only while the Reynolds number built from the fluid density, the speed and the
    diameter, divided by the viscosity, stays below about one. Faster or larger spheres shed a wake, and the quadratic drag of the general terminal velocity
    takes over. The formula also assumes a rigid sphere far from walls and other particles in a
    fluid otherwise at rest.

    George Gabriel Stokes published the creeping-flow drag on a sphere in 1851. A steel ball 1
    millimetre across, sinking through glycerine at 20 degrees Celsius, settles at about 2.4
    millimetres per second, with a Reynolds number near 0.002.
