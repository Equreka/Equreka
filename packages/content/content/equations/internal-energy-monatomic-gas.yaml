description:
  en: >-
    For a monatomic ideal gas, the internal energy equals three halves of the amount of substance
    times the molar gas constant times the absolute temperature. In thermodynamics the formula makes the
    internal energy of such a gas a function of its temperature alone, and it fixes the molar heat
    capacity of a monatomic gas held at fixed volume at three halves of the molar gas constant.

    $\mag{U}$ is the internal energy in joules, the total kinetic energy of the random motion of
    the atoms, which in this model vanishes only at absolute zero. $\mag{n}$ is the amount of
    substance in moles. $\const{R}$ is the molar gas constant, about 8.314 joules per mole kelvin
    and exact in the SI. $\mag{T}$ is the thermodynamic temperature in kelvin; the formula needs
    absolute temperature, so a Celsius reading is converted by adding 273.15. All the quantities are
    positive.

    The atoms of a monatomic gas such as helium, neon or argon carry only kinetic energy of
    translation, on average three halves of the Boltzmann constant times the temperature each.
    Multiplying by the number of atoms, the amount of substance times the Avogadro constant, gives
    the formula, because the Avogadro constant times the Boltzmann constant is the molar gas
    constant. The internal energy therefore changes only when the temperature does, never with
    pressure or volume alone; at constant volume the heat a gas absorbs all goes into it.

    The formula assumes an ideal gas, whose atoms exert no forces on one another and so hold no
    potential energy. Diatomic and polyatomic molecules also store energy in rotation and
    vibration, which raises the coefficient: air, mostly diatomic, is commonly modelled with five
    halves instead of three halves.

    Applied to a change of state, the formula shows that heating 0.952 moles of xenon by 15.2
    kelvin at constant volume raises its internal energy by about 180 joules.
