name:
  en: 'Internal energy of a monatomic ideal gas'
kind: 'formula'
level: 'intermediate'
expression: '\mag{U}=\frac{3}{2}\mag{n}\const{R}\mag{T}'
terms:
  U:
    kind: 'magnitude'
    ref: 'internal-energy'
  n:
    kind: 'magnitude'
