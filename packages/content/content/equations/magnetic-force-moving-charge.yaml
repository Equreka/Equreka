description:
  en: >-
    A magnetic field pushes sideways on any electric charge that travels through it. Counted along
    the direction given by the right-hand rule, this magnetic force on a moving charge equals the
    product of the charge, the speed, the magnetic flux density and the sine of the angle between
    velocity and field. In
    electromagnetism it is the magnetic part of the Lorentz force law.

    $\mag{F}$ is the force in newtons. $\mag{q}$ is the charge in coulombs, entered with its sign;
    $\mag{v}$ is the speed of the charge in metres per second; $\mag{B}$ is the magnetic flux
    density in teslas (the gauss is also accepted).
    $\mag{\theta}$ measures the angle from the velocity to the field, from 0 to 180 degrees. The
    force acts at right angles to both the velocity and the field. For a positive charge, sweeping
    the fingers of the right hand from the velocity towards the field leaves the thumb along the
    force; a negative charge gives a negative result, a force in the opposite direction. The force
    on a current-carrying wire follows the same rule with the current entered positive, so there
    the result is never negative.

    A charge at rest, or one moving along the field lines, feels no magnetic force, and the force
    is largest when the charge crosses the field at a right angle. Since the push is always
    perpendicular to the motion, it does no work: it bends the path while the speed and kinetic
    energy stay the same.

    The field is the one at the charge's own position, so in a field that varies from place to
    place the force changes along the path. If an electric field is also present, its force adds
    to the magnetic one, and the sum is the full Lorentz force. Added over the many charges that
    make up a current, the same force acts on a wire.

    The unit of magnetic flux density honours the inventor Nikola Tesla. The force steers particles
    in accelerators and mass spectrometers and guides cosmic-ray particles along Earth's field
    towards the poles, where they help produce auroras. A 20 nC charge moving at 10 m/s across
    Earth's field of about $5\times10^{-5}\,\mathrm{T}$ feels only $10^{-11}$ newtons.
