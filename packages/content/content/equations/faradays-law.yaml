description:
  en: >-
    Faraday's law of induction states that a changing magnetic flux through a coil induces an
    electromotive force in it, equal to minus the number of turns times the change in flux divided
    by the time the change takes. It is the founding law of electromagnetic induction, the effect
    behind electric generators and transformers.

    $\mag{\mathcal{E}}$ is the average induced emf over the interval, in volts. $\var{N}$ is the
    number of turns of the coil, a whole number, each turn enclosing the same flux.
    $\var{\Delta\Phi}$ is the change in magnetic flux through one turn, final minus initial, in
    webers, and $\mag{\Delta t}$ is the time over which it happens, in seconds. The minus sign
    carries Lenz's law: the emf drives a current whose own magnetic field opposes the change in
    flux. The emf is counted positive in the sense that the right-hand rule links to the normal
    used for the flux, so a rising flux gives a negative emf. Motional emf, a special case, is
    usually quoted as a size, with its polarity found from Lenz's law.

    A large but steady flux induces nothing, while a small flux that changes
    quickly can induce a large emf. The flux can change because the field grows or weakens, because
    the area of the coil changes, or because the coil turns in the field. Each turn contributes its
    own emf and the turns are in series, so the total grows in proportion to their number.

    In this form the law gives the average emf over a finite interval; as the interval shrinks, the
    ratio becomes the rate of change of the flux and the emf becomes instantaneous. It assumes that
    every turn links the same flux, which holds for a tightly wound coil.

    Michael Faraday carried out the first productive induction experiments in 1831, finding that a
    moving magnet or a changing current nearby induces an emf only while the field changes. The rule
    that fixes the direction of the induced current carries the name of Heinrich Lenz, who is
    credited with its discovery. A single loop of 0.0113 square
    metres whose field rises by 0.200 T in 0.100 s has an average emf of 22.6 millivolts.
