  H:
    kind: 'magnitude'
    ref: 'equivalent-dose'
  w_\mathrm{R}:
    kind: 'symbol'
    label:
      en: 'Radiation weighting factor'
  D:
    kind: 'magnitude'
    ref: 'absorbed-dose'
solutions:
  H: 'w_R * D'
  w_\mathrm{R}: 'H / D'
  D: 'H / w_R'
calculator:
  enabled: true
categories:
