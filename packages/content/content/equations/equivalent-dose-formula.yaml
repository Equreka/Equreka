description:
  en: >-
    The equivalent dose is the absorbed dose in a tissue or organ multiplied by a radiation
    weighting factor that expresses how much biological harm the type of radiation does. It is a
    quantity of radiological protection, measured in sieverts, that lets doses from alpha particles,
    neutrons, protons and gamma rays be compared on one scale of risk.

    Here $\mag{H}$ is the equivalent dose, in sieverts, with the millisievert and microsievert also
    accepted. $\var{w_\mathrm{R}}$ is the radiation weighting factor, a pure number with no unit,
    and $\mag{D}$ is the absorbed dose averaged over the tissue or organ, in grays. All three
    quantities are non-negative, and a factor of one makes the number of sieverts equal to the
    number of grays.

    The factors in use today were set by the International Commission on Radiological Protection
    in its Publication 103 of 2007: 1 for photons of all energies and for electrons and muons, 2 for
    protons and charged pions, and 20 for alpha particles, fission fragments and heavy ions. For
    neutrons the factor is a continuous function of their energy, read from the curve or equation
    the publication gives. The earlier European table, from 1996, gave protons above 2 MeV a
    factor of 5.

    The formula is written for a single type of radiation; in a mixed field the products for each
    type are added. Multiplying the equivalent dose of each organ by a tissue weighting factor, with
    factors that sum to one, and adding the results gives the effective dose for the whole body,
    also in sieverts. These are calculated protection quantities, not direct measurements,
    and they cannot predict the health effects in one particular person.

    An absorbed dose of 2.00 milligrays from alpha particles is an equivalent dose of 40.0
    millisieverts, while the same absorbed dose of gamma rays is only 2.00 millisieverts.
