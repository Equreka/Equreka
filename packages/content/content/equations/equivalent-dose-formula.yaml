    url: 'https://www.boe.es/buscar/act.php?id=BOE-A-2022-21682'
  - title: 'European Nuclear Society, Glossary: radiation weighting factors (Euratom 1996 and ICRP 103 values)'
    url: 'https://www.euronuclear.org/glossary/radiation-weighting-factors/'
  - title: 'Ministry of the Environment of Japan, Booklet on health effects of radiation, 2.3 Units of radiation dose'
    url: 'https://www.env.go.jp/en/chemi/rhm/basic-info/1st/02-03-04.html'
