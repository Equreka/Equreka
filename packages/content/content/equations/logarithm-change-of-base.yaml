name:
  en: 'Change-of-base formula for logarithms'
kind: 'formula'
level: 'intro'
expression: '\var{y}=\frac{\ln\var{x}}{\ln\var{b}}'
terms:
  y:
    kind: 'symbol'
    label:
      en: 'Logarithm of x to base b'
  x:
    kind: 'symbol'
    label:
      en: 'Argument'
  b:
    kind: 'symbol'
    label:
      en: 'Base'
solutions:
  y: 'ln(x) / ln(b)'
  x: 'b^y'
  b: 'x^(1 / y)'
calculator:
  enabled: true
categories:
  - 'mathematics'
branches:
  - 'algebra'
aliases:
  - 'change of base'
  - 'change of base formula'
  - 'logarithm to any base'
  - 'logarithm base conversion'
  - 'cambio de base'
  - 'logaritmo en cualquier base'
references:
  - title: 'OpenStax, College Algebra 2e, 6.5 Logarithmic Properties, Using the Change-of-Base Formula for Logarithms'
    url: 'https://openstax.org/books/college-algebra-2e/pages/6-5-logarithmic-properties'
  - title: 'NIST Digital Library of Mathematical Functions, 4.2(ii) Logarithms to a General Base'
    url: 'https://dlmf.nist.gov/4.2'
  - title: 'E. W. Weisstein, Logarithm, MathWorld'
    url: 'https://mathworld.wolfram.com/Logarithm.html'
  - title: 'MacTutor History of Mathematics, John Napier'
    url: 'https://mathshistory.st-andrews.ac.uk/Biographies/Napier/'
