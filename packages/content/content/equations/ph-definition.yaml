description:
  en: >-
    The definition of pH gives the acidity of an aqueous solution as minus the base-ten logarithm of
    its hydrogen ion concentration divided by the standard concentration of one mole per litre. In
    school chemistry this pH formula turns a concentration of hydrogen ions, or hydronium ions, into
    a pH value, and turns a measured pH back into a concentration.

    $\mag{\mathrm{pH}}$ is the pH, a quantity of dimension one whose unit is one; it decreases as a
    solution becomes more acidic and can drop below zero for very concentrated acids.
    $\var{[\mathrm{H}^{+}]}$ is the amount concentration of hydrogen ions, which in water are
    bonded to water molecules as hydronium ions; it is positive and is usually entered in moles per
    litre. $\const{c^{\circ}}$ is the standard amount concentration, exactly one mole per cubic
    decimetre, so the ratio inside the logarithm is a pure number equal to the concentration in
    moles per litre.

    A logarithm can only act on a pure number, which is why the concentration is first divided by
    the standard value. One unit of pH stands for a factor of ten in concentration, and the minus
    sign makes the pH larger as the hydrogen ions become scarcer. Read backwards, the concentration
    equals the standard concentration multiplied by ten raised to minus the pH. A concentration
    known to two significant figures gives a pH with two decimal places.

    IUPAC defines pH through the activity of the hydrogen ion, an effective concentration on a
    molality basis, and calls even that definition notional because the activity of a single ion
    cannot be measured. Using the concentration instead is an approximation that suits dilute
    solutions and worsens as ions crowd together in concentrated or salty ones. Values quoted
    without a temperature refer to $25\,^{\circ}\mathrm{C}$, where pure water has a pH of 7.

    S. P. L. Sørensen introduced the pH scale in 1909, while heading the chemistry department of the
    Carlsberg Laboratory. A hydrogen ion concentration of 0.0010 moles per litre gives a pH of 3.00.
