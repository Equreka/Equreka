description:
  en: >-
    For a dilute solution, the osmotic pressure is the extra pressure that must act on the solution
    to stop pure solvent from flowing into it through a membrane that lets the solvent pass but holds
    back the solute. In the van 't Hoff equation it equals the concentration of dissolved particles
    times the molar gas constant times the absolute temperature, a colligative property of solutions.

    $\mag{\Pi}$ is the osmotic pressure in pascals, positive for a solution facing pure solvent.
    $\var{i}$ is the van 't Hoff factor, the number of particles per dissolved formula unit, close
    to one for sugars and below the full ion count for salts. $\mag{c}$ is the amount concentration of
    the solute, entered in moles per litre or per cubic metre; $\const{R}$ is the molar gas constant,
    about 8.314 joules per mole kelvin and exact in the SI, and $\mag{T}$ is the thermodynamic
    temperature, so Celsius values need 273.15 added.

    The form mirrors the ideal gas law: dissolved particles in a dilute solution push like the
    molecules of a gas spread through the same volume. Solvent moves from the side where its
    tendency to escape is higher, the pure solvent, until the extra pressure on the solution
    balances that difference.

    The equation holds for dilute solutions and ideal membranes; concentrated solutions need the
    osmotic coefficient or the activity of the solvent, as IUPAC defines the quantity in general.
    The pressure measured for a known mass of solute gives the molar mass of large molecules such as
    proteins. Osmosis also explains why red blood cells swell in dilute solutions and shrivel in
    concentrated ones, and a pressure above the osmotic one drives reverse osmosis in desalination
    plants.

    Jacobus van 't Hoff received the 1901 Nobel Prize in Chemistry, cited in part for discovering the
    laws of osmotic pressure in solutions. A 0.30 mol/L glucose solution at 310 K has an osmotic pressure of
    about 7.6 atmospheres.
