name:
  en: 'Effective annual rate'
kind: 'formula'
level: 'intermediate'
expression: '\var{r_\mathrm{eff}}=\left(1+\frac{\var{r}}{\var{n}}\right)^{\var{n}}-1'
terms:
  r_\mathrm{eff}:
    kind: 'symbol'
    label:
      en: 'Effective annual rate'
    unit: 'unitless'
  r:
    kind: 'symbol'
    label:
      en: 'Nominal annual rate'
    unit: 'unitless'
  n:
    kind: 'symbol'
    integer: true
    label:
      en: 'Compounding periods per year'
solutions:
  r_\mathrm{eff}: '(1 + r / n)^n - 1'
  r: 'n * ((1 + r_eff)^(1 / n) - 1)'
calculator:
  enabled: true
  solveFor: ['r_\mathrm{eff}', 'r']
