description:
  en: >-
    Conditional probability is the probability that an event A occurs when another event B is known
    to have occurred. The formula defines it as the probability that both events occur divided by
    the probability of the condition B, and it is read "the probability of A given B".

    In the formula, $\var{P(A\mid B)}$ is the conditional probability, where the vertical bar means
    "given". $\var{P(A\cap B)}$ is the probability of the intersection, A and B occurring together,
    and $\var{P(B)}$ is the probability of the conditioning event. All three are pure numbers from 0
    to 1, never negative. The intersection can never be more likely than B itself, so the quotient
    never exceeds 1.

    Knowing that B has happened rules out every outcome outside B, so B becomes a reduced sample
    space. Among the outcomes left, only those that also belong to A count as favourable, and
    dividing by the probability of B rescales the reduced space so that its probabilities add up to
    1 again. Multiplying both sides by the probability of B gives the general multiplication rule,
    the probability of A and B as the probability of B times the probability of A given B.

    The definition requires the probability of B to be greater than zero: conditioning on an
    impossible event has no meaning, and the division is undefined. The order of the condition
    matters, since the probability of A given B usually differs from that of B given A; Bayes'
    theorem converts one into the other. When the conditional probability equals the plain
    probability of A, the two events are independent.

    Conditional probabilities describe medical test results, weather forecasts and risk tables. On a
    fair die, the probability of rolling a 2 or a 3 given that the roll is even is (1/6) ÷ (3/6) =
    1/3, because only the 2 is both even and in the event.
