references:
  - title: 'OpenStax, University Physics Volume 2, 10.5 RC Circuits (Example 10.8)'
    url: 'https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits'
  - title: 'OpenStax, College Physics 2e, 21.6 DC Circuits Containing Resistors and Capacitors'
