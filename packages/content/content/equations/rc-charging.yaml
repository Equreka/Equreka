name:
  en: 'Charging of a capacitor in an RC circuit'
kind: 'formula'
level: 'intermediate'
expression: '\var{V_\mathrm{C}}=\mag{\mathcal{E}}\left(1-e^{-\frac{\mag{t}}{\mag{R}\mag{C}}}\right)'
terms:
  V_\mathrm{C}:
    kind: 'symbol'
    label:
      en: 'Voltage across the capacitor'
    unit: 'volt'
  \mathcal{E}:
    kind: 'magnitude'
    ref: 'electromotive-force'
    identifier: 'emf'
  t:
    kind: 'magnitude'
    ref: 'time'
  R:
    kind: 'magnitude'
    ref: 'electrical-resistance'
  C:
    kind: 'magnitude'
    ref: 'capacitance'
solutions:
  V_\mathrm{C}: 'emf * (1 - exp(-t / (R * C)))'
  \mathcal{E}: 'V_C / (1 - exp(-t / (R * C)))'
  t: 'R * C * ln(emf / (emf - V_C))'
  R: 't / (C * ln(emf / (emf - V_C)))'
  C: 't / (R * ln(emf / (emf - V_C)))'
calculator:
  enabled: true
categories:
