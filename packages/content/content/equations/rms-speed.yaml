description:
  en: >-
    The root-mean-square speed of the molecules of a gas is the square root of three times the
    Boltzmann constant times the absolute temperature, divided by the mass of one molecule. Known
    as the rms speed, it is the typical speed of molecular motion in the kinetic theory of gases,
    found by squaring every molecular speed, averaging the squares and taking the square root.

    $\mag{v_\mathrm{rms}}$ is the rms speed in metres per second, never negative.
    $\const{k_\mathrm{B}}$ is the Boltzmann constant, $1.380\,649\times10^{-23}\,\mathrm{J/K}$,
    exact in the SI. $\mag{T}$ is the thermodynamic temperature in kelvin; the formula needs
    absolute temperature, so a Celsius reading is converted by adding 273.15. $\var{m}$ is the mass
    of one molecule in kilograms, the molar mass divided by the Avogadro constant; the calculator
    also accepts daltons.

    The mean translational kinetic energy of a molecule is one half its mass times the mean squared
    speed, and kinetic theory sets it equal to three halves of the Boltzmann constant times the
    temperature; solving for the square root of the mean squared speed gives the formula.
    Multiplying the numerator and the denominator by the Avogadro constant gives the equivalent
    molar form, with the molar gas constant over the molar mass. At a given temperature lighter
    molecules move faster, in inverse proportion to the square root of their mass.

    The result holds for an ideal gas in thermal equilibrium described by classical mechanics.
    Individual molecules spread over a wide range of speeds, the Maxwell-Boltzmann distribution,
    and the rms speed exceeds both its mean speed and its most probable speed, so the three figures
    must not be mixed up.

    For nitrogen at 293 kelvin, with a molecular mass of $4.65\times10^{-26}$ kilograms, the
    formula gives about 511 metres per second, a little over half a kilometre per second.
