name:
  en: 'Decay of activity with time'
kind: 'equation'
level: 'intro'
expression: '\var{A}=\var{A_{0}}e^{-\var{\lambda}\mag{t}}'
terms:
  A:
    kind: 'symbol'
    label:
      en: 'Activity after the elapsed time'
    unit: 'becquerel'
  A_{0}:
    kind: 'symbol'
    label:
      en: 'Initial activity'
    unit: 'becquerel'
  \lambda:
    kind: 'symbol'
    label:
      en: 'Decay constant'
    unit: 'reciprocal-second'
  t:
    kind: 'magnitude'
    ref: 'time'
solutions:
  A: 'A_0 * exp(-lambda * t)'
  A_{0}: 'A * exp(lambda * t)'
  \lambda: 'ln(A_0 / A) / t'
  t: 'ln(A_0 / A) / lambda'
calculator:
  enabled: true
categories:
