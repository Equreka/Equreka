description:
  en: >-
    Charles's law, the volume-temperature gas law, states that a fixed amount of gas kept at
    constant pressure occupies a volume directly proportional to its absolute temperature. Written
    for two states of the same sample, the ratio of volume to temperature is the same before and
    after a change, so a gas that is warmed at constant pressure expands and one that is cooled
    contracts.

    $\var{V_{1}}$ and $\var{T_{1}}$ are the volume and the temperature of the gas at the start,
    $\var{V_{2}}$ and $\var{T_{2}}$ at the end. Volumes may be in any unit, cubic metres, litres or
    millilitres, as long as both use the same one. The temperatures, however, must be absolute, in
    kelvin: like every gas law, this one needs the thermodynamic temperature, and a reading in
    degrees Celsius has to be raised by 273.15 first. All four quantities are positive.

    Heating a gas makes its molecules move faster; for the pressure to stay the same, they must
    spread through a larger volume, so the collisions with the walls do not become more frequent. A
    graph of volume against kelvin temperature is a straight line that, extended downward, reaches
    zero volume at absolute zero. Doubling the temperature in degrees Celsius does not double the
    volume; doubling it in kelvin does. The law is the ideal gas law with pressure and amount of
    substance fixed.

    It holds for an ideal gas and fits real gases well far above their condensation temperature;
    near liquefaction, the measured volume falls below the prediction.

    Joseph Louis Gay-Lussac showed in 1801 and 1802 that all gases expand by equal amounts for the
    same rise in temperature. The law bears the name of Jacques Charles, the balloon pioneer, who
    had found nearly the same result about fifteen years earlier but never published it. A balloon
    of 0.300 litres at 283 kelvin grows to about 0.321 litres at 303 kelvin.
