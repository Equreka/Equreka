description:
  en: >-
    The resistance of a conductor changes with temperature, and over moderate ranges the change is
    close to linear: the resistance at a new temperature equals the resistance at a reference
    temperature times one plus the temperature coefficient of resistance times the temperature
    change. The relation lies behind resistance thermometers and thermistors, and it explains the
    surge of current a lamp draws at switch-on.

    $\var{R}$ is the resistance at the final temperature and $\var{R_{0}}$ the resistance at the
    reference temperature, usually 20 degrees Celsius, both in ohms. $\var{\alpha}$ is the
    temperature coefficient of resistance of the material, in reciprocal kelvin. $\var{\Delta T}$ is
    the final temperature minus the reference one; a temperature difference has the same value in
    kelvin and in degrees Celsius, so a coefficient per degree Celsius carries the same number.
    Metals have positive coefficients, about 0.0039 per kelvin for copper and aluminium, whereas
    carbon, silicon and germanium have negative ones, so they conduct better as they warm.

    In a metal, heating makes the atoms vibrate more strongly, and they scatter the conduction
    electrons more often, which raises the resistance. In a semiconductor, heating frees additional
    charge carriers, an effect that outweighs the extra scattering. The fractional change, the
    change in resistance divided by the reference value, equals the coefficient times the
    temperature change.

    The linear form is an approximation. For many materials it serves for changes up to about 100
    degrees Celsius, beyond which the coefficient itself drifts; tungsten is an exception that
    follows it fairly well over very wide ranges. At very low temperatures, impurities and defects
    set a floor to the resistance of a metal, and some materials turn superconducting, with no
    resistance at all.

    A tungsten filament of 0.350 ohms at 20 degrees Celsius reaches about 4.8 ohms when heated to
    2850 degrees Celsius, more than ten times its cold value.
