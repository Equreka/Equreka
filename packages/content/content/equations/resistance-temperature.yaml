name:
  en: 'Temperature dependence of resistance'
kind: 'formula'
level: 'intro'
expression: '\var{R}=\var{R_{0}}\left(1+\var{\alpha}\var{\Delta T}\right)'
terms:
  R:
    kind: 'symbol'
    label:
      en: 'Resistance at the final temperature'
    unit: 'ohm'
  R_{0}:
    kind: 'symbol'
    label:
      en: 'Resistance at the reference temperature'
    unit: 'ohm'
  \alpha:
    kind: 'symbol'
    label:
      en: 'Temperature coefficient of resistance'
    unit: 'reciprocal-kelvin'
  \Delta T:
    kind: 'symbol'
    label:
      en: 'Temperature change'
    unit: 'kelvin'
    delta: true
solutions:
  R: 'R_0 * (1 + alpha * DeltaT)'
  R_{0}: 'R / (1 + alpha * DeltaT)'
  \alpha: '(R - R_0) / (R_0 * DeltaT)'
  \Delta T: '(R - R_0) / (R_0 * alpha)'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
