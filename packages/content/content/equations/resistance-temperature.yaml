references:
  - title: 'OpenStax, University Physics Volume 2, 9.3 Resistivity and Resistance (Table 9.1, Example 9.6)'
    url: 'https://openstax.org/books/university-physics-volume-2/pages/9-3-resistivity-and-resistance'
