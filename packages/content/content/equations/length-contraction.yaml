name:
  en: 'Length contraction'
kind: 'equation'
level: 'intro'
expression: '\var{L}=\var{L_{0}}\sqrt{1-\frac{\mag{v}^{2}}{\const{c}^{2}}}'
terms:
  L:
    kind: 'symbol'
    label:
      en: 'Contracted length'
    unit: 'metre'
  L_{0}:
    kind: 'symbol'
    label:
      en: 'Proper length'
    unit: 'metre'
  v:
    kind: 'magnitude'
    ref: 'speed'
  c:
    kind: 'constant'
    ref: 'speed-of-light'
solutions:
  L: 'L_0 * sqrt(1 - v^2 / c^2)'
  L_{0}: 'L / sqrt(1 - v^2 / c^2)'
  v: 'c * sqrt(1 - (L / L_0)^2)'
