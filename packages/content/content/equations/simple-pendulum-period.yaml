name:
  en: 'Period of a simple pendulum'
kind: 'formula'
level: 'intro'
expression: '\mag{T}=2\const{\pi}\sqrt{\frac{\var{L}}{\var{g}}}'
terms:
  T:
    kind: 'magnitude'
    ref: 'period'
  \pi:
    kind: 'constant'
    ref: 'pi'
  L:
    kind: 'symbol'
