description:
  en: >-
    The period of a simple pendulum is the time a small bob hanging from a light string takes to
    swing out and back once: two pi times the square root of the length divided by the gravitational
    acceleration. In waves and oscillations it is the standard example of simple harmonic motion
    driven by gravity, and the formula behind pendulum clocks and classroom measurements of g.

    Here $\mag{T}$ is the period in seconds, the time of one complete swing there and back;
    $\var{L}$ is the length of the pendulum in metres, measured from the pivot to the centre of the
    bob; and $\var{g}$ is the gravitational acceleration in metres per second squared, a positive
    input whose standard value is 9.80665 metres per second squared but which varies with place and
    with the body the pendulum stands on. All three quantities are positive.

    When the bob is pulled aside, the component of its weight along the arc pulls it back. For small
    swings the sine of the angle is close to the angle itself in radians, so the restoring force is
    proportional to the displacement and the motion is simple harmonic, with an angular frequency
    equal to the square root of g over L. The period then depends only on the length and on g, not
    on the mass of the bob and not on the size of the swing.

    The formula rests on this small-angle approximation and holds well for swings below about 15
    degrees, or 0.26 radians; wider swings take measurably longer. It also assumes a point-like bob
    on a string of negligible mass that does not stretch, a fixed pivot, and no air resistance or
    friction.

    Christiaan Huygens patented the first pendulum clock in 1656 and set out the theory of pendulum
    motion in his Horologium Oscillatorium of 1673. Read backwards, the formula gives g from a timed
    swing: a pendulum 75.000 centimetres long with a period of 1.7357 seconds implies 9.8281 metres
    per second squared.
