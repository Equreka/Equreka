name:
  en: 'Total energy of a circular orbit'
kind: 'formula'
level: 'intermediate'
expression: '\var{E}=-\frac{\const{G}\var{M}\var{m}}{2\var{r}}'
terms:
  E:
    kind: 'symbol'
    label:
      en: 'Total mechanical energy of the orbit'
    unit: 'joule'
  G:
    kind: 'constant'
    ref: 'gravitational-constant'
  M:
    kind: 'symbol'
    label:
      en: 'Mass of the attracting body'
    unit: 'kilogram'
  m:
    kind: 'symbol'
    label:
      en: 'Mass of the other body'
    unit: 'kilogram'
  r:
    kind: 'symbol'
    label:
      en: 'Distance between centres'
    unit: 'metre'
solutions:
  E: '-G * M * m / (2 * r)'
  M: '-2 * E * r / (G * m)'
  m: '-2 * E * r / (G * M)'
  r: '-G * M * m / (2 * E)'
