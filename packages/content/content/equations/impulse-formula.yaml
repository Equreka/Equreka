description:
  en: >-
    The impulse of a constant force is the product of the force and the time during which it acts.
    This mechanics formula measures how strongly a push or a pull changes the motion of a body: a
    small force applied for a long time can deliver the same impulse as a large force applied
    briefly.

    In the formula, $\mag{J}$ is the impulse in newton seconds, $\mag{F}$ the force in newtons, and
    $\mag{t}$ the time interval over which the force acts, in seconds, never negative. Impulse is a
    vector pointing the same way as the force. Along a line, with a chosen positive direction, a
    force in the negative direction gives a negative impulse. The newton second equals the kilogram
    metre per second, the unit of momentum.

    The impulse of the net force on a body equals the change in its momentum, the content of the
    impulse-momentum theorem. Spreading the same change of momentum over a longer time therefore
    lowers the force. Airbags, crumple zones, padded helmets and bending the knees on landing all
    work this way: they lengthen the contact time, so the force on the body is smaller for the same
    impulse. Solving for the force divides the impulse by the time, and solving for the time needs a
    non-zero force.

    The formula is exact only for a force that stays constant while it acts. When the force varies,
    as in a bat striking a ball, the impulse is the area under the force-time graph, and the same
    product holds with the average force over the interval in place of the constant one, which is
    how the mean force of an impact is estimated from its duration.

    A force of 948 newtons acting for 2.5 seconds, the average force of an airbag stopping a driver,
    delivers an impulse of about $2370\,\mathrm{N\,s}$.
