name:
  en: 'Relation between period and frequency'
kind: 'formula'
level: 'intro'
expression: '\mag{T}=\frac{1}{\mag{f}}'
terms:
  T:
    kind: 'magnitude'
    ref: 'period'
  f:
    kind: 'magnitude'
    ref: 'frequency'
solutions:
  T: '1 / f'
  f: '1 / T'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
