name:
  en: 'Relativistic kinetic energy'
kind: 'formula'
level: 'intermediate'
expression: '\mag{E_\mathrm{k}}=\mag{m}\const{c}^{2}\left(\frac{1}{\sqrt{1-\mag{v}^{2}/\const{c}^{2}}}-1\right)'
terms:
  E_\mathrm{k}:
    kind: 'magnitude'
    ref: 'kinetic-energy'
  m:
    kind: 'magnitude'
    ref: 'mass'
  v:
    kind: 'magnitude'
    ref: 'speed'
  c:
    kind: 'constant'
    ref: 'speed-of-light'
solutions:
  E_\mathrm{k}: 'm * v^2 / (sqrt(1 - v^2 / c^2) * (1 + sqrt(1 - v^2 / c^2)))'
  m: 'E_k * sqrt(1 - v^2 / c^2) * (1 + sqrt(1 - v^2 / c^2)) / v^2'
  v: 'c * sqrt(E_k / (m * c^2) * (2 + E_k / (m * c^2))) / (1 + E_k / (m * c^2))'
