    url: 'https://doi.org/10.1002/andp.19053221004'
  - title: 'A. Einstein, Zur Elektrodynamik bewegter Körper (1905), transcription, Wikisource (German)'
    url: 'https://de.wikisource.org/wiki/Zur_Elektrodynamik_bewegter_K%C3%B6rper'
