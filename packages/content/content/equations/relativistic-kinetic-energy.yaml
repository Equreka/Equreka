description:
  en: >-
    Relativistic kinetic energy is the energy of motion of a body in special relativity: its rest
    energy, mass times the square of the speed of light, multiplied by the Lorentz factor minus one.
    It is the total energy minus the rest energy, and it replaces the Newtonian one half of mass
    times speed squared when the speed is a sizeable fraction of the speed of light.

    Here $\mag{E_\mathrm{k}}$ is the kinetic energy, in joules, though particle and nuclear physics
    usually state it in megaelectronvolts, which are also accepted. $\mag{m}$ is the mass of the
    body, in kilograms, always its rest mass, and $\mag{v}$ is its speed relative to the observer,
    in metres per second, which must stay below the speed of light in vacuum, $\const{c}$. All
    three quantities are non-negative, and the kinetic energy is zero only for a body at rest.

    The formula follows from the work-energy theorem applied with relativistic momentum: the work
    done to bring a body from rest to a given speed equals the increase in its total energy. For
    speeds well below that of light the Lorentz factor exceeds one by about half the squared speed
    ratio, and the formula reduces to the Newtonian expression. The calculator evaluates an
    algebraically equal form that avoids subtracting two nearly equal numbers, so slow speeds still
    give accurate results.

    The formula holds for a body with mass in an inertial frame and grows without limit as the
    speed approaches that of light, so an infinite amount of work would be needed to reach it. It is
    written with the speed rather than the Lorentz factor, which keeps the inputs consistent.

    Albert Einstein derived this expression for the kinetic energy of an electron in his 1905 paper
    on the electrodynamics of moving bodies. An electron at 0.990 times the speed of light carries
    about 3.11 MeV, roughly twelve times the 0.250 MeV of the Newtonian formula.
