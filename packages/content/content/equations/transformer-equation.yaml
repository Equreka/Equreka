description:
  en: >-
    The transformer equation states that in an ideal transformer the ratio of the secondary voltage
    to the primary voltage is the same as the ratio between the turn counts of the secondary and primary coils. It describes how transformers, devices of electromagnetic induction,
    raise or lower alternating voltages for power grids and for household equipment.

    $\var{V_\mathrm{s}}$ and $\var{V_\mathrm{p}}$ are the voltages across the secondary and primary
    coils, in volts, both stated the same way: both rms values, both peak values or both
    instantaneous values. $\var{N_\mathrm{s}}$ and $\var{N_\mathrm{p}}$ are the numbers of turns of
    the secondary and primary coils, whole numbers. A step-up transformer has more turns on the
    secondary than on the primary and raises the voltage; a step-down transformer has fewer and
    lowers it.

    Both coils are wound on a single iron core that carries the same magnetic flux through every
    turn. By Faraday's law, the emf of each coil is its number of turns times the rate of change of
    that shared flux, so dividing one emf by the other cancels the rate and leaves the turns ratio.
    Because an ideal transformer also conserves power, the currents scale the other way: the
    secondary current over the primary current equals the primary turns over the secondary turns.

    The equation describes an ideal transformer: no flux leaks out of the core, the windings have
    negligible resistance, and the losses from hysteresis and eddy currents in the core are
    neglected. Large real transformers come close, losing as little as about one percent of the
    power they handle. A transformer needs a changing flux, so it works with alternating current; a
    steady direct current induces no secondary voltage.

    Late in the nineteenth century, the ease of changing voltage with transformers helped the
    alternating current championed by George Westinghouse and Nikola Tesla prevail over Thomas
    Edison's direct-current distribution. A charger that reduces 120 V to 15.0 V with 200 primary
    turns needs 25 secondary turns.
