name:
  en: 'Combined gas law'
kind: 'equation'
level: 'intro'
expression: '\frac{\var{p_{1}}\var{V_{1}}}{\var{T_{1}}}=\frac{\var{p_{2}}\var{V_{2}}}{\var{T_{2}}}'
terms:
  p_{1}:
    kind: 'symbol'
    label:
      en: 'Initial pressure'
    unit: 'pascal'
  V_{1}:
    kind: 'symbol'
    label:
      en: 'Initial volume'
    unit: 'cubic-metre'
  T_{1}:
    kind: 'symbol'
    label:
      en: 'Initial temperature'
    unit: 'kelvin'
  p_{2}:
    kind: 'symbol'
    label:
      en: 'Final pressure'
    unit: 'pascal'
  V_{2}:
    kind: 'symbol'
    label:
      en: 'Final volume'
    unit: 'cubic-metre'
  T_{2}:
    kind: 'symbol'
    label:
      en: 'Final temperature'
    unit: 'kelvin'
solutions:
  p_{1}: 'p_2 * V_2 * T_1 / (V_1 * T_2)'
  V_{1}: 'p_2 * V_2 * T_1 / (p_1 * T_2)'
  T_{1}: 'p_1 * V_1 * T_2 / (p_2 * V_2)'
  p_{2}: 'p_1 * V_1 * T_2 / (V_2 * T_1)'
  V_{2}: 'p_1 * V_1 * T_2 / (p_2 * T_1)'
  T_{2}: 'p_2 * V_2 * T_1 / (p_1 * V_1)'
