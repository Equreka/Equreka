description:
  en: >-
    The Schwarzschild radius of a mass is the radius of the sphere into which that mass would have to
    be compressed to form a non-rotating black hole: twice the gravitational constant times the mass
    divided by the square of the speed of light. The sphere of that radius is the event horizon,
    the boundary from inside which no matter, light or signal can escape.

    In the formula, $\var{r_\mathrm{s}}$ is the Schwarzschild radius in metres, $\const{G}$ the
    Newtonian constant of gravitation, $\mag{M}$ the mass in kilograms, and $\const{c}$ the speed of
    light in vacuum. All quantities are positive, and the radius grows in direct proportion to the
    mass, so a black hole of twice the mass has a horizon twice as large.

    The radius comes from the exact solution of the field equations of general relativity for the
    space outside a spherical, non-rotating, uncharged mass. Setting the Newtonian escape speed
    equal to the speed of light gives the same expression, but only by coincidence, since that
    argument treats light with the classical kinetic energy formula and ignores the curvature of
    space-time.

    For an ordinary star or planet the Schwarzschild radius lies deep inside the body, where the
    exterior solution does not apply, and no horizon exists; only a mass squeezed within its own
    Schwarzschild radius becomes a black hole. The formula describes the horizon of a static,
    uncharged black hole only.

    Karl Schwarzschild published the solution in 1916 in the proceedings of the Prussian Academy of
    Sciences; his contemporaries saw it as an abstract result, with no known body small and dense
    enough to apply it to. Compressed to a
    black hole, the Sun would have a radius of about 2.95 kilometres and the Earth one of under a
    centimetre.
