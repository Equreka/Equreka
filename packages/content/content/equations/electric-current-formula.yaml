name:
  en: 'Electric current as charge per unit time'
kind: 'formula'
level: 'intro'
expression: '\mag{I}=\frac{\mag{q}}{\mag{t}}'
terms:
  I:
    kind: 'magnitude'
    ref: 'electric-current'
  q:
    kind: 'magnitude'
    ref: 'electric-charge'
  t:
    kind: 'magnitude'
    ref: 'time'
solutions:
  I: 'q / t'
  q: 'I * t'
  t: 'q / I'
calculator:
  enabled: true
categories:
