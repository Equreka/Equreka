description:
  en: >-
    Electric current is the amount of electric charge that passes through a cross-section of a
    conductor per unit time. Dividing the charge that crosses a wire, an electrolyte or a particle
    beam by the time it takes gives the average current over that interval, and the same relation
    turns a current and a duration into the charge moved, as in the ampere-hour ratings of
    batteries.

    $\mag{I}$ is the current, in amperes. $\mag{q}$ is the net charge carried across the section in
    the chosen reference direction, in coulombs, and $\mag{t}$ is the time interval, in seconds; one
    ampere is one coulomb per second. The current is conventional current, positive in the direction
    positive charge would move and therefore opposite to the drift of electrons in a metal wire.
    Negative charge moving one way counts as positive current the other way, and a negative value
    means a flow against the reference direction.

    The relation defines current rather than stating a law. It counts the charge that crosses the
    section whatever carries it: electrons in a metal, ions of both signs in a salt solution or
    protons in an accelerator. Solved for the charge, it gives current times time, which is how a
    battery capacity in ampere hours is turned into coulombs.

    The quotient is an average. When the current changes during the interval, as while a capacitor
    charges, the instantaneous current is the limit of the quotient for an ever shorter interval,
    the derivative of the charge with respect to time. For a steady direct current the average and
    the instantaneous value coincide.

    The habit of drawing current from the positive terminal towards the negative one comes from
    Benjamin Franklin's eighteenth-century picture of an electrical fluid, formed long before
    electrons were known. A starter motor that moves 720 coulombs in 4.00 seconds draws 180 amperes.
