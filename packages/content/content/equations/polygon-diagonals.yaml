references:
  - title: 'Mathwords, Diagonals of a Polygon'
    url: 'https://www.mathwords.com/p/polygons_diagonals.htm'
  - title: 'Mathwords, Diagonal'
    url: 'https://www.mathwords.com/d/diagonal.htm'
  - title: 'LibreTexts K12, Geometry, 1.18 Classify Polygons'
