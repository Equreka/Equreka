name:
  en: 'Number of diagonals of a polygon'
kind: 'formula'
level: 'intro'
expression: '\var{D}=\frac{\var{n}\left(\var{n}-3\right)}{2}'
terms:
  D:
    kind: 'symbol'
    label:
      en: 'Number of diagonals'
    integer: true
  n:
    kind: 'symbol'
    label:
      en: 'Number of sides'
    integer: true
solutions:
  D: 'n * (n - 3) / 2'
  n:
    - '(3 + sqrt(9 + 8 * D)) / 2'
    - '(3 - sqrt(9 + 8 * D)) / 2'
calculator:
  enabled: true
categories:
