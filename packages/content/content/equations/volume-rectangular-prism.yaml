name:
  en: 'Volume of a rectangular prism'
kind: 'formula'
level: 'intro'
expression: '\mag{V}=\var{l}\var{w}\var{h}'
terms:
  V:
    kind: 'magnitude'
    ref: 'volume'
  l:
    kind: 'symbol'
    label:
      en: 'Length'
    unit: 'metre'
  w:
    kind: 'symbol'
    label:
      en: 'Width'
    unit: 'metre'
  h:
    kind: 'symbol'
    label:
      en: 'Height'
    unit: 'metre'
solutions:
