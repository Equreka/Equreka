name:
  en: 'Energy stored in an inductor'
kind: 'formula'
level: 'intermediate'
expression: '\mag{E}=\frac{1}{2}\mag{L}\mag{I}^{2}'
terms:
  E:
    kind: 'magnitude'
    ref: 'energy'
  L:
    kind: 'magnitude'
    ref: 'inductance'
  I:
    kind: 'magnitude'
    ref: 'electric-current'
solutions:
  E: 'L * I^2 / 2'
  L: '2 * E / I^2'
  I: 'sqrt(2 * E / L)'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'electromagnetism'
aliases:
  - 'inductor energy'
  - 'magnetic energy of an inductor'
  - 'energy stored in a coil'
  - 'E = L I^2 / 2'
  - 'U = 1/2 L I^2'
