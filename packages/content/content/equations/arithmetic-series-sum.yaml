name:
  en: 'Sum of an arithmetic series'
kind: 'formula'
level: 'intro'
expression: '\var{S_{n}}=\frac{\var{n}\left(\var{a_{1}}+\var{a_{n}}\right)}{2}'
terms:
  S_{n}:
    kind: 'symbol'
    label:
      en: 'Sum of the first n terms'
  n:
    kind: 'symbol'
    label:
      en: 'Number of terms'
    integer: true
  a_{1}:
    kind: 'symbol'
    label:
      en: 'First term'
  a_{n}:
    kind: 'symbol'
    label:
      en: 'Last term (nth term)'
solutions:
  S_{n}: 'n * (a_1 + a_n) / 2'
  n: '2 * S_n / (a_1 + a_n)'
  a_{1}: '2 * S_n / n - a_n'
  a_{n}: '2 * S_n / n - a_1'
