  - title: 'C. R. Nave, HyperPhysics, Georgia State University: Refraction of light and Snell''s law'
    url: 'http://hyperphysics.phy-astr.gsu.edu/hbase/geoopt/refr.html'
description:
  en: >-
    The critical angle is the angle of incidence at which light travelling inside a medium towards
    a boundary with a medium of lower refractive index is refracted exactly along the boundary. Its
    sine equals the ratio of the two indices. At any larger angle no light passes through: all of it
    is reflected back, the effect called total internal reflection.

    The light travels in the first medium, of refractive index $\var{n_{1}}$, towards the second
    medium, of index $\var{n_{2}}$, which must be smaller. Both indices are pure numbers. The
    critical angle $\mag{\theta_\mathrm{c}}$ is measured from the normal to the boundary and lies
    between zero and a right angle; it is computed in radians and readily shown in degrees.

    The relation is Snell's law with the angle of refraction set to a right angle, whose sine is
    one. Below the critical angle part of the light is refracted out and part reflected; at the
    critical angle the refracted ray grazes the surface; beyond it the second medium receives no
    refracted ray. The larger the ratio between the indices, the smaller the critical angle.

    A critical angle exists only when the light goes from a higher to a lower index. When the
    second medium has the higher index the ratio exceeds one, the sine cannot reach it, and the
    equation has no real angle: total internal reflection cannot occur. Since the indices depend on
    wavelength, so does the critical angle, slightly.

    Total internal reflection guides light along optical fibres for telecommunications and medical
    endoscopes, turns light in the prisms of binoculars and periscopes, and makes cut diamonds
    sparkle. OpenStax gives 48.6 degrees from water into air and only 24.4 degrees from diamond
    into air.
