name:
  en: 'Critical angle for total internal reflection'
kind: 'equation'
level: 'intro'
expression: '\sin\mag{\theta_\mathrm{c}}=\frac{\var{n_{2}}}{\var{n_{1}}}'
terms:
  \theta_\mathrm{c}:
    kind: 'magnitude'
    ref: 'plane-angle'
  n_{2}:
    kind: 'symbol'
    label:
      en: 'Refractive index of the second medium'
  n_{1}:
    kind: 'symbol'
    label:
      en: 'Refractive index of the first medium'
solutions:
  \theta_\mathrm{c}: 'asin(n_2 / n_1)'
  n_{2}: 'n_1 * sin(theta_c)'
  n_{1}: 'n_2 / sin(theta_c)'
calculator:
  enabled: true
