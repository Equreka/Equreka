description:
  en: >-
    Hess's law states that the enthalpy change of a chemical reaction is the same whatever route
    leads from the reactants to the products: when the reaction is written as a series of steps,
    the steps' enthalpy changes add up to that of the whole reaction. Also called the law
    of constant heat summation, it is a working tool of thermochemistry for reactions whose heat is
    hard to measure directly.

    $\var{\Delta H}$ is the enthalpy change of the overall reaction and $\var{\Delta H_{i}}$ that of
    step $i$, each in joules per mole of reaction as written, and usually quoted in kilojoules per mole. A
    negative value marks an exothermic step or reaction, which releases heat, and a positive value
    an endothermic one. The sum runs over every step, and the steps must add up, species by species,
    to the overall equation.

    The law holds because enthalpy is a state function: its change depends only on the initial and
    final states, not on the path between them. Two rules follow for combining steps. Reversing a
    step reverses the sign of its enthalpy change, and multiplying a step by a factor multiplies its
    enthalpy change by the same factor. Species that appear on both sides of the added steps cancel
    out.

    Every step must be taken at the same temperature and pressure, and each species must be in the
    same physical state wherever it appears, since melting or vaporizing a substance has its own
    enthalpy change. The law is a consequence of conservation of energy and needs no assumption
    about the mechanism.

    Germain Henri Hess published the law in 1840. Burning carbon to carbon monoxide releases 111
    kilojoules per mole of carbon, and burning that carbon monoxide to carbon dioxide releases 283
    kilojoules per mole more, so the direct burning of carbon to carbon dioxide has an enthalpy
    change of −111 + (−283) = −394 kilojoules per mole of reaction.
