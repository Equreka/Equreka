description:
  en: >-
    The area of a trapezoid equals the average of its two parallel sides multiplied by the distance
    between them. A trapezoid is a four-sided plane figure with one pair of parallel sides, the
    bases; the other two sides, the legs, may slant at any angle. In British usage the same figure
    is called a trapezium. The rule is the plane geometry formula for the surface of such a figure.

    In the formula, $\mag{A}$ is the area in square metres, $\var{a}$ and $\var{b}$ are the lengths
    of the two bases in metres, and $\var{h}$ is the height in metres, the perpendicular distance
    between the two parallel lines on which the bases lie. All are positive. The bases can be named
    in either order, since only their sum enters, and the lengths of the slanted legs do not appear
    at all.

    A diagonal splits the trapezoid into two triangles that share the same height, one standing on
    each base; adding their areas, each half a base times the height, gives the formula. Another
    view places a second copy upside down beside the first, forming a parallelogram whose base is
    the sum of the two bases, of which the trapezoid is half. The mean of the bases equals the
    length of the segment that joins the midpoints of the legs.

    The rule needs the perpendicular height, not a leg length. As one base shrinks toward zero the
    figure approaches a triangle and the formula tends to half the base times the height; as the
    bases approach equality the figure approaches a parallelogram, and the formula tends to base
    times height. A trapezoid whose legs are equal is called isosceles, and
    the same rule applies to it unchanged.

    The formula estimates the cross-section of ditches and embankments and the area of irregular
    plots split into strips. Bases of 5 and 3 metres with a 2 metre height enclose 8 square metres.
