name:
  en: 'Thermal equilibrium temperature'
kind: 'formula'
level: 'intro'
expression: '\var{T_\mathrm{f}}=\frac{\var{m_{1}}\var{c_{1}}\var{T_{1}}+\var{m_{2}}\var{c_{2}}\var{T_{2}}}{\var{m_{1}}\var{c_{1}}+\var{m_{2}}\var{c_{2}}}'
terms:
  T_\mathrm{f}:
    kind: 'symbol'
    label:
      en: 'Equilibrium temperature'
    unit: 'kelvin'
  m_{1}:
    kind: 'symbol'
    label:
      en: 'Mass of body 1'
    unit: 'kilogram'
  c_{1}:
    kind: 'symbol'
    label:
      en: 'Specific heat capacity of body 1'
    unit: 'joule-per-kilogram-kelvin'
  T_{1}:
    kind: 'symbol'
    label:
      en: 'Initial temperature of body 1'
    unit: 'kelvin'
  m_{2}:
    kind: 'symbol'
    label:
      en: 'Mass of body 2'
    unit: 'kilogram'
  c_{2}:
    kind: 'symbol'
    label:
      en: 'Specific heat capacity of body 2'
    unit: 'joule-per-kilogram-kelvin'
  T_{2}:
    kind: 'symbol'
    label:
      en: 'Initial temperature of body 2'
    unit: 'kelvin'
solutions:
  T_\mathrm{f}: '(m_1 * c_1 * T_1 + m_2 * c_2 * T_2) / (m_1 * c_1 + m_2 * c_2)'
  m_{1}: 'm_2 * c_2 * (T_2 - T_f) / (c_1 * (T_f - T_1))'
  c_{1}: 'm_2 * c_2 * (T_2 - T_f) / (m_1 * (T_f - T_1))'
  T_{1}: '(T_f * (m_1 * c_1 + m_2 * c_2) - m_2 * c_2 * T_2) / (m_1 * c_1)'
  m_{2}: 'm_1 * c_1 * (T_1 - T_f) / (c_2 * (T_f - T_2))'
  c_{2}: 'm_1 * c_1 * (T_1 - T_f) / (m_2 * (T_f - T_2))'
  T_{2}: '(T_f * (m_1 * c_1 + m_2 * c_2) - m_1 * c_1 * T_1) / (m_2 * c_2)'
