name:
  en: 'Adiabatic process of an ideal gas'
kind: 'equation'
level: 'intermediate'
expression: '\var{p_{1}}\var{V_{1}}^{\var{\gamma}}=\var{p_{2}}\var{V_{2}}^{\var{\gamma}}'
terms:
  p_{1}:
    kind: 'symbol'
    label:
      en: 'Initial pressure'
    unit: 'pascal'
  V_{1}:
    kind: 'symbol'
    label:
      en: 'Initial volume'
    unit: 'cubic-metre'
  p_{2}:
    kind: 'symbol'
    label:
      en: 'Final pressure'
    unit: 'pascal'
  V_{2}:
    kind: 'symbol'
    label:
      en: 'Final volume'
    unit: 'cubic-metre'
  \gamma:
    kind: 'symbol'
    label:
      en: 'Adiabatic index'
solutions:
  p_{1}: 'p_2 * (V_2 / V_1)^gamma'
  V_{1}: 'V_2 * (p_2 / p_1)^(1 / gamma)'
  p_{2}: 'p_1 * (V_1 / V_2)^gamma'
  V_{2}: 'V_1 * (p_1 / p_2)^(1 / gamma)'
  \gamma: 'ln(p_1 / p_2) / ln(V_2 / V_1)'
