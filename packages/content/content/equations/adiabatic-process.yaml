description:
  en: >-
    In a reversible adiabatic process of an ideal gas, the pressure times the volume raised to the
    adiabatic index stays constant, so it has the same value in the initial and the final state.
    The relation describes adiabatic expansion and compression in thermodynamics, where no heat
    crosses the boundary of the gas: the compression stroke of an engine, rising and sinking air in
    the atmosphere, the rapid pressure swings of a sound wave.

    $\var{p_{1}}$ and $\var{p_{2}}$ are the initial and final absolute pressures in pascals, never
    gauge readings, and $\var{V_{1}}$ and $\var{V_{2}}$ the initial and final volumes in cubic
    metres. $\var{\gamma}$ is the adiabatic index, a dimensionless quantity: the ratio of the
    molar heat capacity at constant pressure to that at constant volume, always greater than 1. It
    is five thirds, about 1.67, for a monatomic ideal gas and 1.40 for air, which is mostly
    diatomic.

    With no heat exchanged, the first law makes the work done by the gas come entirely out of its
    internal energy, so an expanding gas cools. Writing that energy balance for a small step,
    eliminating the temperature with the ideal gas law and integrating gives the relation. On a
    pressure-volume diagram the adiabat through a point is steeper than the isotherm through the
    same point, because the temperature falls along it; the final temperature then follows from the
    ideal gas law.

    The relation needs an ideal gas with a constant adiabatic index and a process that is both
    adiabatic and quasi-static. A fast compression approximates it because heat has no time to
    flow, whereas the free expansion of a gas into a vacuum is adiabatic but not quasi-static and
    does not follow it.

    Compressing a diatomic gas such as air, with an adiabatic index of 1.40, from 240 to 40 cubic
    centimetres, starting at 100 kilopascals, raises its pressure to about 1.23 megapascals.
