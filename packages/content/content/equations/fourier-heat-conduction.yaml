description:
  en: >-
    Fourier's law of heat conduction gives the rate at which heat flows through a slab of material:
    the heat flow rate equals the thermal conductivity times the area times the temperature
    difference between the two faces, divided by the thickness. In thermodynamics and building
    physics it estimates the heat lost through walls, windows, pipes and cookware.

    $\mag{P}$ is the heat flow rate, the heat conducted per unit time, in watts. $\mag{k}$ is the
    thermal conductivity of the material, in watts per metre kelvin: about 390 for copper, 0.84 for
    glass and 0.023 for still air. $\mag{A}$ is the area through which the heat passes, in square
    metres, and $\var{d}$ is the thickness of the slab along the flow, in metres. $\var{\Delta T}$
    is the temperature of the hot face minus that of the cold face, a positive difference with the
    same value in kelvin and in degrees Celsius; the heat always travels from the hot face to the
    cold one.

    Conduction carries energy through a material without any bulk motion of the material itself, so
    the flow grows with a steeper temperature drop, a larger area and a better conductor. Doubling
    the thickness halves the flow, which is why insulation adds thickness of a poor conductor; the
    thickness divided by the conductivity is the thermal resistance per unit area, the R factor
    quoted for building materials.

    The relation describes a flat slab of uniform material whose two faces have equal areas and are
    held at constant temperatures. The general law states that the heat flux is proportional to the
    temperature gradient and runs down it; curved or layered walls and temperatures that change over
    time need that general form.

    Joseph Fourier read his memoir on how heat spreads through solids to the Paris Institute in 1807
    and published his Théorie analytique de la chaleur in 1822. Foam walls 2.50 centimetres thick
    and 0.950 square metres in area, with a conductivity of 0.035 watts per metre kelvin, pass about
    46.6 watts across a difference of 35.0 kelvin.
