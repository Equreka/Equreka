description:
  en: >-
    The standard Gibbs energy change of a reaction equals minus the molar gas constant times the
    absolute temperature times the natural logarithm of the equilibrium constant. This relation of
    chemical thermodynamics ties tabulated Gibbs energies to the position of chemical equilibrium,
    so an equilibrium constant can be predicted from thermochemical data alone, without measuring a
    single concentration.

    $\var{\Delta_\mathrm{r} G^{\circ}}$ is the standard Gibbs energy change of the reaction, in
    joules per mole of reaction as written; tables give it in kilojoules per mole. $\const{R}$ is
    the molar gas constant, about 8.314 joules per mole kelvin, exact in the SI. $\mag{T}$ is the
    thermodynamic temperature in kelvin and must be absolute: a Celsius reading needs 273.15 added.
    $\var{K}$ is the standard equilibrium constant, a quantity of dimension one with no unit: every
    concentration inside it is divided by the standard amount concentration of one mole per litre and every
    gas pressure by the standard pressure of 1 bar.

    A negative standard Gibbs energy change gives a constant above one, so products prevail at
    equilibrium; a positive one gives a constant below one, and zero gives exactly one. The
    dependence is logarithmic: at 298.15 kelvin every 5.708 kilojoules per mole changes the
    constant tenfold. The relation follows from the Gibbs energy change under any composition, the
    standard value plus RT times the logarithm of the reaction quotient, which is zero at
    equilibrium, where the quotient equals the constant.

    The constant is defined through activities. Concentrations and partial pressures stand in for
    activities and fugacities only in dilute solutions and ideal gases, so for concentrated
    solutions or compressed gases the result is approximate. The Gibbs energy change must belong to
    the same temperature as the constant. A large constant says how far a reaction goes, not how
    fast.

    For silver chloride dissolving in water, a standard Gibbs energy change of 55.7 kilojoules per
    mole at 298.15 kelvin gives a solubility product of about $1.74\times10^{-10}$.
