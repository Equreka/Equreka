name:
  en: 'Standard Gibbs energy change and equilibrium constant'
kind: 'equation'
level: 'intermediate'
expression: '\var{\Delta_\mathrm{r} G^{\circ}}=-\const{R}\mag{T}\ln\var{K}'
terms:
  \Delta_\mathrm{r} G^{\circ}:
    kind: 'symbol'
    label:
      en: 'Standard Gibbs energy change of the reaction'
    unit: 'joule-per-mole'
    identifier: 'DeltaG_r'
  R:
    kind: 'constant'
    ref: 'molar-gas-constant'
  T:
    kind: 'magnitude'
