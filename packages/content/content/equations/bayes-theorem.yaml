description:
  en: >-
    Bayes' theorem expresses the probability of an event A given an observed event B in terms of the
    probability of B given A. It reverses the direction of a conditional probability, and it is the
    rule for updating the probability of a hypothesis once new evidence arrives, also known as
    Bayes' rule or Bayes' law.

    In the equation, $\var{P(A)}$ is the prior probability of A, its probability before B is
    observed, and $\var{P(A\mid B)}$ is the posterior probability, after B is known.
    $\var{P(B\mid A)}$ is the likelihood, the probability of observing B when A holds, and
    $\var{P(B)}$ is the overall probability of B, often called the evidence. All four are pure
    numbers from 0 to 1, never negative.

    The theorem follows from writing the probability that A and B both occur in two ways, as the
    probability of B times that of A given B and as the probability of A times that of B given A,
    then dividing by the probability of B. When B is not given directly, it is found by the law of
    total probability: the likelihood of B under each possible case, weighted by the probability of
    that case and summed.

    The probability of B must be greater than zero. The result is only as reliable as the prior it
    starts from, and a small prior can outweigh a high likelihood, which is why a positive result
    for a rare condition is often a false alarm. Confusing the probability of A given B with that of
    B given A is a common error that the theorem corrects.

    The theorem is named after Thomas Bayes, whose essay on the doctrine of chances was published in
    1764 in the Philosophical Transactions of the Royal Society, three years after his death, when
    his friend Richard Price sent it in. A test that detects 90 percent of cases and wrongly flags
    0.1 percent of healthy people gives, for a condition affecting 1 person in 10 000, a posterior
    probability of only about 8 percent after a positive result.
