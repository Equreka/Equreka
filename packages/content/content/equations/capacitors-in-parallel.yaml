name:
  en: 'Capacitors in parallel'
kind: 'formula'
level: 'intro'
expression: '\mag{C}=\var{C_{1}}+\var{C_{2}}'
terms:
  C:
    kind: 'magnitude'
    ref: 'capacitance'
  C_{1}:
    kind: 'symbol'
    label:
      en: 'Capacitance of the first capacitor'
    unit: 'farad'
  C_{2}:
    kind: 'symbol'
    label:
