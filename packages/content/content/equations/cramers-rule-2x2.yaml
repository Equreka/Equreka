name:
  en: 'Cramer''s rule for two linear equations'
kind: 'formula'
level: 'intermediate'
expression: '\var{x}=\frac{\var{c_{1}}\var{b_{2}}-\var{b_{1}}\var{c_{2}}}{\var{a_{1}}\var{b_{2}}-\var{b_{1}}\var{a_{2}}}'
terms:
