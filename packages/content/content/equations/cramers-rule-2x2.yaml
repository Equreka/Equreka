  b_{1}:
    kind: 'symbol'
    label:
      en: 'Coefficient of y in the first equation'
  c_{1}:
    kind: 'symbol'
    label:
      en: 'Constant term of the first equation'
  a_{2}:
    kind: 'symbol'
    label:
      en: 'Coefficient of x in the second equation'
  b_{2}:
    kind: 'symbol'
