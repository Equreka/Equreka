  c_{2}:
    kind: 'symbol'
    label:
      en: 'Constant term of the second equation'
solutions:
  x: '(c_1 * b_2 - b_1 * c_2) / (a_1 * b_2 - b_1 * a_2)'
  a_{1}: '(c_1 * b_2 - b_1 * c_2 + x * b_1 * a_2) / (x * b_2)'
  b_{1}: 'b_2 * (c_1 - x * a_1) / (c_2 - x * a_2)'
  c_{1}: '(x * (a_1 * b_2 - b_1 * a_2) + b_1 * c_2) / b_2'
  a_{2}: '(x * a_1 * b_2 - c_1 * b_2 + b_1 * c_2) / (x * b_1)'
  b_{2}: 'b_1 * (x * a_2 - c_2) / (x * a_1 - c_1)'
  c_{2}: '(c_1 * b_2 - x * (a_1 * b_2 - b_1 * a_2)) / b_1'
