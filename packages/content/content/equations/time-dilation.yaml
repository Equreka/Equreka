name:
  en: 'Time dilation'
kind: 'equation'
level: 'intro'
expression: '\var{\Delta t}=\frac{\var{\Delta t_{0}}}{\sqrt{1-\frac{\mag{v}^{2}}{\const{c}^{2}}}}'
