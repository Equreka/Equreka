solutions:
  \Delta t: 'Deltat_0 / sqrt(1 - v^2 / c^2)'
  \Delta t_{0}: 'Deltat * sqrt(1 - v^2 / c^2)'
  v: 'c * sqrt(1 - (Deltat_0 / Deltat)^2)'
