description:
  en: >-
    Time dilation is the effect of special relativity by which a clock moving relative to an
    observer is measured to run slow. The equation gives the interval the observer measures as the
    proper time interval divided by the square root of one minus the speed squared over the speed of
    light squared.

    Here $\var{\Delta t_{0}}$ is the proper time interval, in seconds: the time between two events
    measured by a clock present at both, for which the events happen at the same place.
    $\var{\Delta t}$ is the dilated interval between the same events, in seconds, measured by an
    observer who sees that clock move. The speed $\mag{v}$ of the clock relative to the observer is
    in metres per second and must be less than the speed of light in vacuum, $\const{c}$. All
    terms are non-negative, and the solved speed is the non-negative root.

    The reciprocal of the square root is the Lorentz factor, often written gamma, which is one at
    rest and grows without limit as the speed approaches that of light. A light pulse bouncing
    between two mirrors shows why: for an observer who sees the mirrors move, the pulse follows a
    longer diagonal path at the same speed of light, so each tick takes longer.

    The equation holds between inertial frames moving at constant relative velocity. At everyday
    speeds the factor differs from one by a tiny amount. A traveller who turns round to come home is not in one inertial frame, which is
    why a twin returning from a fast journey is younger without any contradiction.

    Albert Einstein derived the effect in 1905. In 1941 Bruno Rossi and David Hall found that the
    decay rate of cosmic-ray muons depends on their momentum, and in October 1971 Hafele and Keating
    flew caesium clocks around the world on airliners and compared them with clocks on the ground. A muon living
    2.20 microseconds in its own frame, moving at 0.950 times the speed of light, lives about 7.05
    microseconds as measured from the ground.
