name:
  en: 'Volume of a cylinder'
kind: 'formula'
level: 'intro'
expression: '\mag{V}=\const{\pi}\var{r}^{2}\var{h}'
terms:
  V:
    kind: 'magnitude'
    ref: 'volume'
  \pi:
    kind: 'constant'
    ref: 'pi'
  r:
    kind: 'variable'
    ref: 'radius'
  h:
    kind: 'symbol'
    label:
      en: 'Height'
    unit: 'metre'
solutions:
  V: 'pi * r^2 * h'
  r: 'sqrt(V / (pi * h))'
  h: 'V / (pi * r^2)'
calculator:
  enabled: true
categories:
