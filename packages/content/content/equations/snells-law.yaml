name:
  en: 'Snell''s law'
kind: 'equation'
level: 'intro'
expression: '\var{n_{1}}\sin\var{\theta_{1}}=\var{n_{2}}\sin\var{\theta_{2}}'
terms:
  n_{1}:
    kind: 'symbol'
    label:
      en: 'Refractive index of the first medium'
  \theta_{1}:
    kind: 'symbol'
    label:
      en: 'Angle of incidence'
    unit: 'radian'
  n_{2}:
    kind: 'symbol'
    label:
      en: 'Refractive index of the second medium'
  \theta_{2}:
    kind: 'symbol'
    label:
      en: 'Angle of refraction'
    unit: 'radian'
solutions:
  n_{1}: 'n_2 * sin(theta_2) / sin(theta_1)'
  \theta_{1}: 'asin(n_2 * sin(theta_2) / n_1)'
  n_{2}: 'n_1 * sin(theta_1) / sin(theta_2)'
  \theta_{2}: 'asin(n_1 * sin(theta_1) / n_2)'
