name:
  en: 'Distance fallen in free fall'
kind: 'equation'
level: 'intro'
expression: '\var{h}=\frac{1}{2}\var{g}\mag{t}^{2}'
terms:
  h:
    kind: 'symbol'
    label:
      en: 'Drop height'
    unit: 'metre'
  g:
    kind: 'symbol'
    label:
      en: 'Gravitational acceleration'
    unit: 'metre-per-second-squared'
  t:
    kind: 'magnitude'
    ref: 'time'
solutions:
  h: 'g * t^2 / 2'
  g: '2 * h / t^2'
  t: 'sqrt(2 * h / g)'
calculator:
  enabled: true
categories:
