description:
  en: >-
    The distance fallen in free fall is the height a body drops from rest in a given time when
    gravity is the only force acting on it: half the gravitational acceleration times the square of
    the elapsed time. It is the free-fall case of the position equation for constant acceleration in
    kinematics, and it explains why a dropped stone covers four times as far in twice the time.

    Here $\var{h}$ is the drop height, the distance fallen, in metres, measured downward from the
    release point; $\mag{t}$ is the time since release, in seconds; and $\var{g}$ is the size of the
    gravitational acceleration, in metres per second squared, entered as a positive number. All
    three are non-negative, because the formula takes downward as the positive direction. The
    standard value of $\var{g}$ is 9.80665 metres per second squared; the local value varies with
    latitude, altitude and geology, between about 9.78 and 9.83 on the surface of the Earth, and
    differs on another planet or moon.

    A body released from rest gains speed at a steady rate, so after a time $\mag{t}$ its speed is
    $\var{g}\mag{t}$ and its average speed over the interval is half of that; multiplying the
    average speed by the elapsed time gives the distance. The stretches covered in successive equal
    intervals therefore stand in the ratio of the odd numbers 1, 3, 5, 7.

    The relation assumes release from rest, negligible air resistance and a uniform gravitational
    field. Drag grows with speed, so a feather or a parachutist soon falls well short of the
    predicted distance, while a dense, compact body follows it closely for a few seconds. A body
    thrown up or down needs the general constant-acceleration equation with an initial velocity.

    Galileo Galilei formulated the law of falling bodies and checked it by measurement, using
    inclined planes to slow the motion; his Two New Sciences, published in Leiden in 1638, states
    that a body starting from rest and accelerating uniformly travels a distance that grows with the
    time squared. A fall lasting 3 seconds covers about 44 metres.
