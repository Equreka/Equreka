name:
  en: 'Energy levels of a hydrogen-like ion'
kind: 'formula'
level: 'intermediate'
expression: '\var{E_{n}}=-\frac{\var{Z}^{2}\const{h}\const{c}\const{R_{\infty}}}{\var{n}^{2}}'
terms:
  E_{n}:
    kind: 'symbol'
    label:
      en: 'Energy of level n'
    unit: 'joule'
  Z:
    kind: 'symbol'
    label:
      en: 'Atomic number'
    integer: true
  h:
    kind: 'constant'
    ref: 'planck-constant'
  c:
    kind: 'constant'
    ref: 'speed-of-light'
  R_{\infty}:
    kind: 'constant'
    ref: 'rydberg-constant'
  n:
    kind: 'symbol'
    label:
      en: 'Principal quantum number'
    integer: true
solutions:
  E_{n}: '-Z^2 * h * c * R_infty / n^2'
