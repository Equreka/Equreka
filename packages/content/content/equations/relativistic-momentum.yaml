name:
  en: 'Relativistic momentum'
kind: 'formula'
level: 'intermediate'
expression: '\mag{p}=\frac{\mag{m}\mag{v}}{\sqrt{1-\frac{\mag{v}^{2}}{\const{c}^{2}}}}'
terms:
  p:
    kind: 'magnitude'
    ref: 'momentum'
  m:
    kind: 'magnitude'
    ref: 'mass'
  v:
    kind: 'magnitude'
    ref: 'speed'
  c:
    kind: 'constant'
    ref: 'speed-of-light'
solutions:
  p: 'm * v / sqrt(1 - v^2 / c^2)'
  m: 'p * sqrt(1 - v^2 / c^2) / v'
  v: 'p / sqrt(m^2 + p^2 / c^2)'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'modern-physics'
aliases:
  - 'relativistic linear momentum'
  - 'momentum in special relativity'
  - 'p = gamma m v'
  - 'relativistic momentum formula'
