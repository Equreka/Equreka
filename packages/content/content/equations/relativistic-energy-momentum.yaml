    url: 'https://physics.nist.gov/cgi-bin/cuu/Value?mec2mev'
  - title: 'NIST, CODATA 2022 value: speed of light in vacuum'
    url: 'https://physics.nist.gov/cgi-bin/cuu/Value?c'
description:
  en: >-
    The relativistic energy-momentum relation states that the square of the total energy of a
    particle equals the square of its momentum times the speed of light plus the square of its rest
    energy. Central to special relativity and particle physics, it links energy, momentum and mass
    without any reference to speed, and it holds for massive and massless particles alike.

    Here $\mag{E}$ is the total energy, in joules: the rest energy plus the kinetic energy.
    Particle physics usually states it in megaelectronvolts, which are also accepted. $\mag{p}$ is
    the size of the momentum, in kilogram metres per second, and $\mag{m}$ is the mass, in
    kilograms, always the rest mass. The constant $\const{c}$ is the speed of light in vacuum. All
    three quantities are non-negative, so the solved momentum is real only when the energy is at
    least the rest energy, and the solved mass only when the energy is at least the momentum times
    the speed of light.

    The relation follows from the total energy, the Lorentz factor times the rest energy, and the
    relativistic momentum: squaring both and subtracting removes the speed and leaves the squared
    rest energy. That leftover is the same for every inertial observer, which is why the mass found
    from a measured energy and momentum is called the invariant mass. At rest the momentum vanishes
    and the energy reduces to the rest energy; for a massless particle such as the photon the energy
    is the momentum times the speed of light.

    The relation describes a free particle in special relativity, with no potential energy counted,
    and the speed of a massive particle must stay below the speed of light, so its energy always
    exceeds its momentum times the speed of light. Because it fixes the mass from
    energy and momentum, nuclear and particle physics often quote a mass as its rest energy in
    megaelectronvolts.

    An electron at 0.990 times the speed of light has a total energy of about 3.62 MeV, of which
    3.59 MeV is the momentum term and 0.511 MeV the rest energy.
