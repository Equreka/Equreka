name:
  en: 'Relativistic energy-momentum relation'
kind: 'equation'
level: 'intermediate'
expression: '\mag{E}^{2}=\left(\mag{p}\const{c}\right)^{2}+\left(\mag{m}\const{c}^{2}\right)^{2}'
terms:
  E:
    kind: 'magnitude'
    ref: 'energy'
  p:
    kind: 'magnitude'
    ref: 'momentum'
  m:
    kind: 'magnitude'
    ref: 'mass'
  c:
    kind: 'constant'
    ref: 'speed-of-light'
solutions:
  E: 'sqrt((p * c)^2 + (m * c^2)^2)'
  p: 'sqrt((E - m * c^2) * (E + m * c^2)) / c'
  m: 'sqrt((E - p * c) * (E + p * c)) / c^2'
calculator:
  enabled: true
externalIds:
  wikidata: 'Q3502299'
categories:
  - 'physics'
branches:
