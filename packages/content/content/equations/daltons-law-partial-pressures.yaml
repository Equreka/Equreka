description:
  en: >-
    Dalton's law of partial pressures says that when gases that do not react are mixed, the pressure
    of the whole mixture equals the sum of the pressures each component would produce on its own,
    its partial pressures. The partial pressure of a gas is the pressure it would exert if it filled
    the whole container alone at the same temperature. Written here for a mixture of two gases, the
    law extends term by term to any number of them.

    $\var{p_\mathrm{total}}$ is the total pressure of the mixture, the value a pressure gauge reads
    once corrected to absolute pressure. $\var{p_\mathrm{A}}$ and $\var{p_\mathrm{B}}$ are the
    partial pressures of gases A and B. All three are in pascals or any common pressure unit, and
    all are positive; each partial pressure is smaller than the total.

    In an ideal gas the molecules are far apart and do not attract or repel one another, so each gas
    strikes the walls as if the others were absent. At fixed volume and temperature the pressure a
    gas exerts grows in step with its amount in moles, so the partial pressures add like the
    amounts. It follows that the fraction of the total pressure due to one gas equals its mole
    fraction in the mixture. For three or more gases, add their partial pressures, or apply the law
    twice.

    The law is exact for ideal gases and close for real mixtures at low pressure. At high pressure,
    or when the molecules of different gases attract each other strongly, the total departs from the
    sum; gases that react together are not covered at all.

    John Dalton, working on the atmosphere, proposed that each gas in a mixture exerts its pressure
    independently of the others. In the laboratory, a gas collected over water is mixed with water
    vapour, so argon gathered at 750 torr and 26 degrees Celsius, where water contributes 25.2 torr,
    has a partial pressure of about 725 torr.
