name:
  en: 'Wavelength of light in a medium'
kind: 'formula'
level: 'intermediate'
expression: '\var{\lambda_{n}}=\frac{\var{\lambda}}{\mag{n}}'
terms:
  \lambda_{n}:
    kind: 'symbol'
    label:
      en: 'Wavelength in the medium'
    unit: 'metre'
  \lambda:
    kind: 'symbol'
    label:
