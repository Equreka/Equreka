description:
  en: >-
    The Planck–Einstein relation states that the energy of a single photon is the Planck constant
    multiplied by the frequency of the light. Also called the Planck relation or the photon energy
    equation, it is the starting point of quantum and modern physics: light of a given frequency
    exchanges energy with matter only in whole packets of that size.

    In the relation, $\mag{E}$ is the energy of one photon, in joules; atomic and optical work often
    quotes it in electronvolts, one electronvolt being exactly
    $1.602\,176\,634\times10^{-19}\,\mathrm{J}$. The frequency $\mag{f}$ of the radiation is in
    hertz. The constant $\const{h}$ is the Planck constant, exactly
    $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$ since the 2019 revision of the SI. Energy and
    frequency are both non-negative, and the energy grows in direct proportion to the frequency.

    The relation separates the colour of light from its brightness. A higher frequency means more
    energetic photons, so ultraviolet photons carry more energy than red ones; a brighter beam of
    the same frequency carries more photons, each with the same energy. The total energy of a
    monochromatic beam is the number of photons times one photon energy. Combined with the wave
    relation linking frequency, wavelength and the speed of light, it gives the photon energy in
    terms of wavelength.

    The relation holds for every photon, in vacuum or in a material, because a photon keeps its
    frequency when it enters a medium. It describes single quanta: a light source of mixed colours
    emits photons of many energies, and the relation applies to each of them separately.

    Max Planck introduced discrete energy elements of this size in 1900 to explain the spectrum of
    blackbody radiation, publishing the result in Annalen der Physik. In 1905 Albert Einstein
    proposed that light itself travels as such quanta, which explained the photoelectric effect and
    was cited in his 1921 Nobel Prize. A photon of frequency $10^{15}\,\mathrm{Hz}$ carries about
    $6.63\times10^{-19}\,\mathrm{J}$, or 4.14 electronvolts.
