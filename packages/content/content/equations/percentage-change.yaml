name:
  en: 'Percentage change'
kind: 'formula'
level: 'intro'
expression: '\var{r}=\frac{\var{V_{f}}-\var{V_{i}}}{\var{V_{i}}}'
terms:
  r:
    kind: 'symbol'
    label:
      en: 'Relative change (as a fraction)'
  V_{f}:
    kind: 'symbol'
    label:
      en: 'Final value'
  V_{i}:
    kind: 'symbol'
    label:
      en: 'Initial value'
solutions:
  r: '(V_f - V_i) / V_i'
  V_{f}: 'V_i * (1 + r)'
  V_{i}: 'V_f / (1 + r)'
calculator:
  enabled: true
categories:
  - 'mathematics'
branches:
  - 'arithmetic'
aliases:
  - 'percent change'
  - 'relative change'
  - 'percent increase'
  - 'percent decrease'
  - 'percentage increase'
  - 'percentage decrease'
