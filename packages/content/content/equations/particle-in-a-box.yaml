description:
  en: >-
    The energy levels of a particle in a box are the allowed energies of a quantum particle trapped
    in a one-dimensional infinite square well: the square of a whole number times the square of the
    Planck constant, divided by eight times the mass of the particle times the square of the width
    of the box. The model of quantum mechanics shows how confinement alone quantizes energy.

    Here $\var{E_{n}}$ is the energy of level $\var{n}$, in joules, though atomic and nuclear
    examples usually state it in electronvolts, which are also accepted. $\var{n}$ is the quantum
    number, a whole number from one upwards; the calculator accepts only whole numbers for it, and
    the level it solves from an energy is whole only for an allowed energy. $\mag{m}$ is the mass of
    the particle, in kilograms, $\var{L}$ the width of the box, in metres, and $\const{h}$ the
    Planck constant. The energy counts from the flat floor of the well, so every level is positive.

    Inside the box the potential energy is zero and the walls are infinitely high, so the wave
    function must vanish at both walls. Only standing waves that fit a whole number of half
    wavelengths between the walls survive, and each such wavelength fixes a momentum and hence a
    kinetic energy. A zero quantum number would give a wave function that is zero everywhere, so the
    lowest energy, the zero-point energy, is above zero; the levels spread apart as the square of
    the quantum number.

    The formula holds for one non-relativistic particle in one dimension between perfectly rigid
    walls. A well of finite depth lets the wave function leak into the walls and lowers every level,
    and at large quantum numbers the spacing becomes small compared with the energy, as the
    correspondence principle requires.

    A proton confined to a box 10 femtometres wide, about the size of a nucleus, has a ground-state
    energy near 2.05 MeV and a first excited level near 8.19 MeV.
