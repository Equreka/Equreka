description:
  en: >-
    Conservation of mechanical energy states that when gravity is the only force doing work on a
    body, the sum of its kinetic energy and its gravitational potential energy stays constant: what
    the body loses in height it gains in speed, and the reverse. Written per unit mass, it gives the
    speed of a falling stone, a pendulum bob or a frictionless roller coaster at any height.

    $\var{v_{0}}$ and $\var{h_{0}}$ are the speed and the height at the start, $\var{v}$ and
    $\var{h}$ the speed and the height at the end. Speeds are in metres per second and non-negative;
    heights are in metres, measured upward from any reference level and negative below it. $\var{g}$
    is the size of the gravitational acceleration in metres per second squared, a positive number.
    Each side is the mechanical energy per kilogram, kinetic plus potential, in joules per kilogram.

    Multiplying both sides by the mass gives the usual form: initial kinetic plus potential energy
    equals final kinetic plus potential energy. Because the mass cancels, a heavy and a light body
    released at the same speed from the same height reach every lower level with the same speed, and
    the final speed depends only on the change in height, not on the shape of the path.

    Solving for a speed keeps only the non-negative square root, because a speed is never negative.
    A negative number under the root means the two states cannot share one mechanical energy: the
    body would have to climb higher than its energy allows. The relation assumes a uniform field and
    that friction, air resistance and every other non-conservative force do no work; forces
    perpendicular to the motion, such as a normal force, may act. With a spring, elastic potential
    energy joins the sum; with friction, mechanical energy decreases and turns into thermal energy.

    Hermann von Helmholtz set out the mathematical principles of energy conservation in his 1847
    paper Über die Erhaltung der Kraft. A pendulum released from rest 0.134 metres above its lowest
    point passes through it at about 1.62 metres per second.
