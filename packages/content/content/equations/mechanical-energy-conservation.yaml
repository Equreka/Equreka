name:
  en: 'Conservation of mechanical energy'
kind: 'equation'
level: 'intro'
expression: '\frac{1}{2}\var{v_{0}}^{2}+\var{g}\var{h_{0}}=\frac{1}{2}\var{v}^{2}+\var{g}\var{h}'
terms:
  v_{0}:
    kind: 'symbol'
    label:
      en: 'Initial speed'
    unit: 'metre-per-second'
  h_{0}:
    kind: 'symbol'
    label:
      en: 'Initial height'
    unit: 'metre'
  v:
    kind: 'symbol'
    label:
      en: 'Final speed'
    unit: 'metre-per-second'
  h:
    kind: 'symbol'
    label:
      en: 'Final height'
    unit: 'metre'
  g:
    kind: 'symbol'
    label:
      en: 'Gravitational acceleration'
    unit: 'metre-per-second-squared'
solutions:
  v: 'sqrt(v_0^2 + 2 * g * (h_0 - h))'
  v_{0}: 'sqrt(v^2 + 2 * g * (h - h_0))'
  h: 'h_0 + (v_0^2 - v^2) / (2 * g)'
  h_{0}: 'h + (v^2 - v_0^2) / (2 * g)'
  g: '(v^2 - v_0^2) / (2 * (h_0 - h))'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'mechanics'
aliases:
  - 'mechanical energy conservation'
  - 'law of conservation of mechanical energy'
  - 'KE + PE = constant'
  - 'KEi + PEi = KEf + PEf'
  - 'speed from height'
  - 'principio de conservación de la energía mecánica'
