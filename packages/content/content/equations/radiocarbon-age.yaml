description:
  en: >-
    The radiocarbon age formula gives the time since an organism died from the fraction of its
    original carbon-14 that is still present. It is the basis of radiocarbon dating, also called
    carbon-14 dating, the method of nuclear physics and archaeology that dates wood, bone, charcoal,
    shell and other once-living material.

    Here $\mag{t}$ is the age, the time elapsed since death, in seconds, though usually given in
    years. $\var{t_{1/2}}$ is the half-life of carbon-14, in seconds; school texts use the 1962
    Cambridge value of 5730 years, the evaluated value is now 5700 ± 30 years, and either is entered
    as an input rather than built into the formula. $\var{f}$ is the fraction of carbon-14
    remaining, the ratio of the carbon-14 content of the sample to that of living material, a number
    from 0 to 1 (a percentage is also accepted). A fraction below one gives a positive age.

    Living organisms keep exchanging carbon with the atmosphere, where cosmic rays produce
    carbon-14 from nitrogen, so their carbon-14 share stays near that of the air. At death the
    exchange stops and the carbon-14 decays without being replaced. Solving the half-life form of
    the decay law for the time gives the formula: the logarithm counts how many half-lives have
    passed. Each halving of the fraction adds one half-life to the age.

    The formula assumes that the carbon-14 level of the atmosphere has always been the same, which
    is only approximately true, so laboratories calibrate raw ages against tree-ring and other
    records. By convention they report a conventional radiocarbon age computed with the Libby
    half-life of 5568 years and counted before 1950, then convert it to a calendar age. The
    method reaches back about 50 000 years, beyond which too little carbon-14 remains to measure.

    Willard Libby developed the method in 1949 and received the 1960 Nobel Prize in Chemistry for
    it. With the 5730-year half-life, wood that keeps 80 percent of its carbon-14 is about 1840
    years old.
