  v_\mathrm{t}: 'sqrt(2 * m * g / (C_d * rho * A))'
  m: 'C_d * rho * A * v_t^2 / (2 * g)'
  g: 'C_d * rho * A * v_t^2 / (2 * m)'
  C_\mathrm{d}: '2 * m * g / (rho * A * v_t^2)'
  \rho: '2 * m * g / (C_d * A * v_t^2)'
  A: '2 * m * g / (C_d * rho * v_t^2)'
