description:
  en: >-
    Terminal velocity is the steady speed that a body falling through a fluid approaches when the
    drag on it has grown to equal its weight, so that it stops accelerating. For drag that grows
    with the square of the speed, as for skydivers and other large bodies falling through air, it
    is the square root of twice the weight divided by the product of the drag coefficient, the
    density of the fluid and the reference area.

    In the formula, $\mag{v_\mathrm{t}}$ is the terminal speed in metres per second, $\mag{m}$ the
    mass of the falling body in kilograms, $\var{g}$ the gravitational acceleration, entered as a
    positive number (standard value 9.80665 metres per second squared, varying with place),
    $\var{C_\mathrm{d}}$ the dimensionless drag coefficient, $\mag{\rho}$ the density of the fluid in
    kilograms per cubic metre, and $\var{A}$ the reference area, usually the area the body presents
    to the flow, in square metres. All are non-negative, and the speed is the non-negative root.

    A body released from rest speeds up while its weight exceeds the drag, but the drag grows with
    the square of the speed until the two balance and the net force vanishes. Setting the weight
    equal to the drag equation and solving for the speed gives the formula. A heavier body, or one
    presenting a smaller area, falls faster: a skydiver who changes from a streamlined dive to a
    spread-eagle position raises the area and the drag coefficient and slows markedly.

    The formula neglects buoyancy, which is small in air but not in water, assumes a constant drag
    coefficient and fluid density, and applies to the quadratic drag of larger, faster bodies.
    Small particles, droplets and microorganisms moving slowly through a viscous fluid follow Stokes'
    law instead, with a terminal speed proportional to the weight rather than to its square root.

    An 85-kilogram skydiver in the spread-eagle position, with area 0.70 square metres and
    coefficient 1.0, reaches a terminal speed of about 44 metres per second in air of density 1.21
    kilograms per cubic metre.
