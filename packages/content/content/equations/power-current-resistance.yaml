description:
  en: >-
    The power dissipated in a resistor equals the square of the current through it multiplied by its
    resistance. Known as Joule's first law, the relation gives the rate at which a resistance turns
    electrical energy into heat: the Joule heating that toasters, electric heaters and fuses rely on
    and that power lines and wiring waste.

    $\mag{P}$ is the dissipated power, in watts. $\mag{I}$ is the current through the resistor, in
    amperes, and $\mag{R}$ its resistance, in ohms. Because the current enters squared, the power is
    never negative: reversing the conventional current leaves it unchanged, and a resistor always
    takes energy from the circuit. Solved for the current, the relation gives two values of equal
    size and opposite sign; the positive one is the current in the chosen reference direction.

    The result follows from the general electric power, voltage times current, once Ohm's law
    replaces the voltage with current times resistance. On the microscopic scale, the electric field
    accelerates the charge carriers, which hand that energy to the atoms of the conductor in
    collisions, so it ends up as thermal motion.

    The relation assumes a resistance that does not change with the current, which makes it exact
    for ohmic resistors; for a lamp filament, whose resistance rises as it heats, the hot value is
    needed. It covers direct current, and alternating current when the current is the RMS value.
    Since the loss grows with the square of the current, electricity grids transmit power at high
    voltage and low current.

    James Prescott Joule published measurements of the heat that currents produce in metal wires in
    1841. A motor winding of 1.67 ohms carrying 20.0 amperes turns about 668 watts into heat.
