name:
  en: 'Gravitational potential energy of two masses'
kind: 'formula'
level: 'intro'
expression: '\mag{E_\mathrm{p}}=-\frac{\const{G}\var{M}\var{m}}{\var{r}}'
terms:
  E_\mathrm{p}:
    kind: 'magnitude'
    ref: 'potential-energy'
  G:
    kind: 'constant'
    ref: 'gravitational-constant'
  M:
    kind: 'symbol'
    label:
      en: 'Mass of the attracting body'
    unit: 'kilogram'
  m:
    kind: 'symbol'
    label:
      en: 'Mass of the other body'
    unit: 'kilogram'
  r:
    kind: 'symbol'
    label:
      en: 'Distance between centres'
    unit: 'metre'
solutions:
  E_\mathrm{p}: '-G * M * m / r'
  M: '-E_p * r / (G * m)'
  m: '-E_p * r / (G * M)'
  r: '-G * M * m / E_p'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
