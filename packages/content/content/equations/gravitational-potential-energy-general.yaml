description:
  en: >-
    The gravitational potential energy of two masses is the energy stored in their separation: minus
    the gravitational constant times the product of the masses, divided by the distance between
    their centres. It is the general form of gravitational potential energy in gravitation, valid at
    any distance from a planet or star, and it takes its zero when the bodies are infinitely far
    apart.

    $\mag{E_\mathrm{p}}$ is the potential energy of the pair in joules, always negative or, in the
    limit of infinite separation, zero. $\const{G}$ is the Newtonian constant of gravitation,
    $\var{M}$ and $\var{m}$ are the two masses in kilograms, and $\var{r}$ is the distance between
    their centres in metres, a positive length.

    The minus sign comes from the choice of zero. Pulling two attracting bodies apart takes positive
    work, so their potential energy rises as they separate and climbs towards zero from below; bound
    systems such as a planet and its moon therefore have negative potential energy. Only differences
    in potential energy matter physically, and the choice of zero is a matter of convenience. Near
    the surface of a planet the change between two nearby heights reduces to weight times the rise
    in height, the familiar uniform-field formula.

    The formula treats both bodies as points or as spherically symmetric bodies separated by more
    than the sum of their radii. It belongs to Newtonian gravitation and ignores any other forces
    acting on the bodies.

    Equating the kinetic energy of a launched body with the size of this potential energy gives the
    escape velocity. A satellite of 1000 kilograms resting on the surface of the Earth has a
    potential energy of about $-6.26\times10^{10}\,\mathrm{J}$ relative to infinity.
