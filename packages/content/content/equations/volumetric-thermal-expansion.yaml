description:
  en: >-
    Volumetric thermal expansion is the change in volume of a solid, liquid or gas when its
    temperature changes: the change equals the volumetric expansion coefficient times the original
    volume times the temperature change. In thermodynamics it is the form of thermal expansion that
    applies to liquids, used to size fuel tanks, explain liquid-in-glass thermometers and predict
    when a full container will overflow.

    $\var{\Delta V}$ is the change in volume, in cubic metres, positive when the body expands.
    $\var{\beta}$ is the volumetric expansion coefficient, in reciprocal kelvin; tables at 20
    degrees Celsius list about 35 millionths per kelvin for steel, 180 for mercury, 210 for water
    and 950 for petrol. $\var{V_{0}}$ is the volume before the change, in cubic metres. $\var{\Delta
    T}$ is the final temperature minus the initial one, a difference with the same value in kelvin
    and in degrees Celsius.

    In an isotropic solid each of the three dimensions grows by the same small fraction, so the
    volumetric coefficient is very nearly three times the linear expansion coefficient. A liquid
    takes the shape of its container and has no length of its own, so only its volume coefficient is
    defined, and it usually exceeds that of the container: a steel tank filled to the brim with cold
    petrol spills fuel as both warm up.

    The relation is accurate for small temperature changes, over which the coefficient stays nearly
    constant. Water is the notable exception: between 0 and 4 degrees Celsius it shrinks as it
    warms, so its coefficient is negative there and its density peaks at 4 degrees Celsius, which is
    why ponds freeze from the surface down. For air and similar gases at normal atmospheric pressure
    the coefficient is about 3400 millionths per kelvin and depends strongly on the conditions, so
    the ideal gas law describes their expansion better.

    A 60.0-litre steel tank filled with petrol at 15.0 degrees Celsius spills about 1.10 litres when
    tank and fuel warm to 35.0 degrees Celsius.
