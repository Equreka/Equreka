description:
  en: >-
    The triangle angle sum theorem states that the three interior angles of any triangle in a plane
    add up to a straight angle, which is pi radians or 180 degrees. It is a basic result of
    Euclidean geometry and trigonometry, used to find the third angle of a triangle from the other
    two before any side is computed.

    In the equation, $\mag{\alpha}$, $\mag{\beta}$ and $\mag{\gamma}$ are the interior angles at the
    three vertices, measured in radians in the SI and commonly entered in degrees. Each is positive
    and smaller than a straight angle. Since the total is fixed, a triangle has at most one right or
    obtuse angle, and in a right triangle the two acute angles are complementary, adding up to a
    right angle.

    Through one vertex draw the line parallel to the opposite side. The two other angles of the
    triangle reappear at that vertex as alternate angles on either side of the angle already there,
    and together the three fill the straight line through the vertex. The same construction shows
    that an exterior angle, formed by extending one side, equals the sum of the two interior angles
    not adjacent to it. Solving for any angle subtracts the other two from pi.

    The theorem rests on the parallel postulate and holds only in the flat Euclidean plane. On a
    sphere the angles of a triangle add up to more than a straight angle, and the surplus, called
    the spherical excess, grows with the area of the triangle; in hyperbolic geometry, which drops
    the postulate, the sum falls short instead, and by more for larger triangles. For a triangle
    drawn on a sheet of paper or laid out on a building site the flat-plane result applies.

    Euclid's Elements proves the result as Proposition 32 of Book I, stating the sum as two right
    angles. Legendre later showed that the result is equivalent to the parallel postulate itself.
    Angles of 55 and 82 degrees leave 43 degrees for the third angle.
