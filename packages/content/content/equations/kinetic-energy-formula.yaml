name:
  en: 'Kinetic energy of a body in translation'
kind: 'formula'
level: 'intro'
expression: '\mag{E_\mathrm{k}}=\frac{1}{2}\mag{m}\mag{v}^{2}'
terms:
  E_\mathrm{k}:
    kind: 'magnitude'
    ref: 'kinetic-energy'
  m:
    kind: 'magnitude'
    ref: 'mass'
  v:
    kind: 'magnitude'
    ref: 'speed'
