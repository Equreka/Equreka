description:
  en: >-
    The kinetic energy of a body in translation is the energy it has because of its motion: half its
    mass times the square of its speed. The formula gives the energy of motion of a particle, or of
    a rigid body moving without rotation, and equals the work needed to bring the body from rest up
    to that speed, as well as the work it can do on whatever stops it.

    Here $\mag{E_\mathrm{k}}$ is the kinetic energy in joules, $\mag{m}$ the mass in kilograms and
    $\mag{v}$ the speed in metres per second, the size of the velocity whatever its direction. All
    three are non-negative: kinetic energy is never negative, and a body at rest has none. Solving
    for the speed therefore keeps only the non-negative square root.

    Because the speed enters squared, doubling it multiplies the kinetic energy by four, which is
    why the braking distance of a car grows so quickly with speed. Kinetic energy depends on the
    frame of reference: a passenger sitting in a moving train has none relative to the carriage but
    a great deal relative to the track. The formula follows from a constant net force acting over a
    distance: Newton's second law and the constant-acceleration relation between speed and
    displacement turn the work done from rest into half the mass times the square of the final
    speed.

    The formula holds at speeds much lower than the speed of light; closer to that speed, special
    relativity replaces it with a larger value. For a spinning or rolling body it gives only the
    translational part, computed with the speed of the centre of mass, and the rotational kinetic
    energy has to be added.

    In his 1829 book Du calcul de l'effet des machines, Gaspard-Gustave de Coriolis gave the name
    force vive to half the mass times the squared speed, the quantity now called kinetic energy. A
    runner of 80 kilograms moving at 10 metres per second has a kinetic energy of 4000 joules.
