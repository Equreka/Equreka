description:
  en: >-
    The half-value layer is how much absorber it takes to cut the intensity of a narrow photon beam
    to half its incident value; for a beam of one energy it equals the natural
    logarithm of two divided by the linear attenuation coefficient. In nuclear physics, radiation
    protection and medical imaging it is the common way to state how penetrating a beam of gamma
    rays or X-rays is, and how effective a shielding material is.

    $\var{x_{1/2}}$ is the half-value layer, in metres, though tables and beam specifications quote
    it in millimetres or centimetres of a named material such as lead, aluminium or copper.
    $\var{\mu}$ is the linear attenuation coefficient of that material at the photon energy, in
    reciprocal metres. Both are positive, and the natural logarithm of two is about 0.693.

    The formula follows from the exponential attenuation law: setting the transmitted fraction equal
    to one half and taking logarithms leaves the thickness as the logarithm of two over the
    coefficient. Each further half-value layer halves what remains, so n layers transmit one part in
    two to the power n. In the same way the tenth-value layer, which cuts the intensity to a tenth,
    is the natural logarithm of ten over the coefficient, about 3.3 half-value layers.

    The relation is exact only for a narrow, monoenergetic beam. Medical physics usually measures
    the half-value layer through the air kerma rate instead of the intensity, a definition that goes
    back to Christen in 1912; the two agree for a single energy but differ for the spread of
    energies from an X-ray tube. The formula is the attenuation twin of the half-life and decay
    constant relation.

    At 1 megaelectronvolt, the NIST tables give lead a linear attenuation coefficient of about
    80.6 per metre, from 0.071 02 square centimetres per gram and 11.35 grams per cubic centimetre,
    so its half-value layer is about 8.6 millimetres and its tenth-value layer about 2.86
    centimetres.
