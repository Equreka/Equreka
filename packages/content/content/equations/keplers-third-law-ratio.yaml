name:
  en: 'Kepler''s third law for two orbits'
kind: 'equation'
level: 'intro'
expression: '\frac{\var{T_{1}}^{2}}{\var{T_{2}}^{2}}=\frac{\var{a_{1}}^{3}}{\var{a_{2}}^{3}}'
terms:
  T_{1}:
    kind: 'symbol'
    label:
      en: 'Period of orbit 1'
    unit: 'second'
  T_{2}:
    kind: 'symbol'
    label:
      en: 'Period of orbit 2'
    unit: 'second'
  a_{1}:
    kind: 'symbol'
    label:
      en: 'Semi-major axis of orbit 1'
    unit: 'metre'
  a_{2}:
    kind: 'symbol'
    label:
      en: 'Semi-major axis of orbit 2'
    unit: 'metre'
solutions:
  T_{1}: 'T_2 * sqrt((a_1 / a_2)^3)'
  T_{2}: 'T_1 / sqrt((a_1 / a_2)^3)'
  a_{1}: 'a_2 * cbrt((T_1 / T_2)^2)'
  a_{2}: 'a_1 / cbrt((T_1 / T_2)^2)'
