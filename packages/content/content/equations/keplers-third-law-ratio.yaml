description:
  en: >-
    Kepler's third law, also called the law of periods or the harmonic law, states that for bodies
    orbiting the same central body, the period squared varies in direct proportion to the semi-major
    axis cubed. Written for two orbits, it compares their periods and sizes directly, with no need
    for the mass of the central body or the gravitational constant.

    $\var{T_{1}}$ and $\var{T_{2}}$ are the orbital periods of the two bodies, and $\var{a_{1}}$ and
    $\var{a_{2}}$ are the semi-major axes of their orbits, half the longest diameter of each
    ellipse; for a circular orbit the semi-major axis is the radius. All four are positive. Any unit
    works for each pair, as long as both periods share one unit and both axes share another: years
    and astronomical units are common in astronomy.

    Gravity holds each body on its orbit, and Newton's law of universal gravitation gives the square
    of the period as a constant times the cube of the semi-major axis, the constant depending only
    on the central mass. Dividing that relation for one orbit by the same relation for another
    cancels the constant and leaves this ratio. Wider orbits are therefore slower: doubling the axis
    lengthens the period by a factor of about 2.83.

    The law requires both bodies to orbit the same central body, which must be much heavier than
    either of them; otherwise the sum of the masses enters and the constant differs slightly from
    one orbit to the other. Pulls between the orbiting bodies themselves are neglected.

    Johannes Kepler found the law from Tycho Brahe's observations in 1618 and published it in
    Harmonices Mundi in 1619; Newton later drew on it in formulating his law of gravitation. With
    the Earth's semi-major axis of 149.598 million kilometres and Mars's of 227.956 million, the law
    predicts a Martian year of about 687 days.
