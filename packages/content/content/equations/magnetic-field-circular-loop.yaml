name:
  en: 'Magnetic field at the centre of a circular loop'
kind: 'formula'
level: 'intermediate'
expression: '\mag{B}=\frac{\const{\mu_{0}}\mag{I}}{2\var{R}}'
terms:
  B:
    kind: 'magnitude'
    ref: 'magnetic-flux-density'
  \mu_{0}:
    kind: 'constant'
    ref: 'vacuum-magnetic-permeability'
  I:
    kind: 'magnitude'
    ref: 'electric-current'
  R:
    kind: 'symbol'
    label:
      en: 'Radius of the loop'
    unit: 'metre'
solutions:
  B: 'mu_0 * I / (2 * R)'
  I: '2 * R * B / mu_0'
  R: 'mu_0 * I / (2 * B)'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'electromagnetism'
aliases:
  - 'magnetic field of a current loop'
  - 'field at the center of a current loop'
  - 'magnetic field of a circular coil'
  - 'B = mu0 I / (2R)'
  - 'campo magnético de una espira circular'
