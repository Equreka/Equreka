name:
  en: 'Crossover temperature'
kind: 'formula'
level: 'intermediate'
expression: '\mag{T}=\frac{\var{\Delta H}}{\mag{\Delta S}}'
terms:
  T:
    kind: 'magnitude'
    ref: 'thermodynamic-temperature'
  \Delta H:
    kind: 'symbol'
    label:
      en: 'Enthalpy change of the reaction'
    unit: 'joule-per-mole'
  \Delta S:
    kind: 'magnitude'
    ref: 'molar-entropy'
solutions:
  T: 'DeltaH / DeltaS'
  \Delta H: 'T * DeltaS'
  \Delta S: 'DeltaH / T'
calculator:
  enabled: true
categories:
