description:
  en: >-
    The ideal speed on a banked curve is the one speed at which a vehicle can follow a curve whose
    road surface is tilted towards the centre with no help from friction: the tangent of the banking
    angle equals the speed squared divided by the radius times the gravitational acceleration. The
    relation sets the banking of roads, railway tracks, velodromes and racing circuits for a chosen
    design speed.

    Here $\mag{\theta}$ is the banking angle between the road surface and the horizontal, in
    radians, $\mag{v}$ the speed of the vehicle in metres per second, $\var{r}$ the radius of the
    curve in metres, and $\var{g}$ the gravitational acceleration, entered as a positive number; its
    standard value is 9.80665 metres per second squared, while the local value varies with place
    and on other bodies. All four are non-negative, the angle lies between zero and a right angle,
    and the speed is the non-negative square root.

    On a frictionless banked road only two forces act on the vehicle: its weight and the normal force
    perpendicular to the surface. The vertical component of the normal force balances the weight,
    while its horizontal component, pointing towards the centre of the curve, supplies the
    centripetal force, the mass times the speed squared over the radius. Dividing one balance by the
    other cancels the mass and the normal force and leaves the tangent of the angle, so the ideal
    speed is the same for a bicycle and a lorry.

    The relation assumes a curve of constant radius taken at constant speed, a vehicle small
    compared with the radius and no friction. On a real road, static friction lets a vehicle take
    the curve somewhat faster or slower than the ideal speed without sliding up or down the slope;
    with no banking the angle is zero and friction must supply the whole centripetal force.

    A curve of radius 100 metres banked at 65.0 degrees has an ideal speed of about 45.9 metres per
    second, roughly 165 kilometres per hour.
