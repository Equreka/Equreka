name:
  en: 'Ideal speed on a banked curve'
kind: 'formula'
level: 'intermediate'
expression: '\tan\mag{\theta}=\frac{\mag{v}^{2}}{\var{r}\var{g}}'
terms:
  \theta:
    kind: 'magnitude'
    ref: 'plane-angle'
  v:
    kind: 'magnitude'
    ref: 'speed'
  r:
    kind: 'variable'
    ref: 'radius'
  g:
    kind: 'symbol'
