name:
  en: 'Isothermal work of an ideal gas'
kind: 'formula'
level: 'intermediate'
expression: '\mag{W}=\mag{n}\const{R}\mag{T}\ln\left(\frac{\var{V_{2}}}{\var{V_{1}}}\right)'
terms:
  W:
    kind: 'magnitude'
    ref: 'work'
  n:
    kind: 'magnitude'
    ref: 'substance'
  R:
    kind: 'constant'
    ref: 'molar-gas-constant'
  T:
    kind: 'magnitude'
    ref: 'thermodynamic-temperature'
  V_{2}:
    kind: 'symbol'
    label:
      en: 'Final volume'
    unit: 'cubic-metre'
  V_{1}:
    kind: 'symbol'
    label:
      en: 'Initial volume'
    unit: 'cubic-metre'
solutions:
  W: 'n * R * T * ln(V_2 / V_1)'
  n: 'W / (R * T * ln(V_2 / V_1))'
  T: 'W / (n * R * ln(V_2 / V_1))'
  V_{2}: 'V_1 * exp(W / (n * R * T))'
  V_{1}: 'V_2 * exp(-W / (n * R * T))'
