    url: 'http://hyperphysics.phy-astr.gsu.edu/hbase/phyopt/slits.html'
description:
  en: >-
    The double-slit interference maxima condition gives the directions of the bright fringes in
    Young's double-slit experiment: the slit separation times the sine of the angle equals a whole
    number of wavelengths. Where it holds, the waves from the two slits arrive in step and
    reinforce each other, producing the evenly spaced bright bands that first showed light to be a
    wave.

    Here $\var{d}$ is the distance between the centres of the two slits in metres. $\mag{\theta}$
    is the angle of a bright fringe measured from the straight-through direction of the incoming
    beam, in radians. $\var{m}$ is the order of the bright fringe, a whole number: zero for the
    central fringe, positive on one side and negative on the other. $\mag{\lambda}$ is the
    wavelength of the light in metres.

    Rays from the two slits to a distant point on the screen are almost parallel, and the one from
    the farther slit travels an extra distance equal to the slit separation times the sine of the
    angle. When that path difference is a whole number of wavelengths, crests meet crests and the
    interference is constructive; when it is a whole number plus one half, crests meet troughs and
    the screen is dark. Closer slits or longer wavelengths spread the fringes wider.

    The condition assumes coherent light of a single wavelength, slits much narrower than their
    separation and a screen far away compared with that separation. The sine cannot exceed one, so
    only orders up to the separation divided by the wavelength appear; the brightness of the
    fringes is also shaped by diffraction at each slit. For small angles the bright fringes are
    equally spaced on a screen, as the entry on fringe spacing describes.

    Thomas Young demonstrated this interference in 1801. In an OpenStax example, slits 0.0100
    millimetres apart put the third bright fringe at 10.95 degrees, which gives a wavelength of
    633 nanometres.
