references:
  - title: 'OpenStax, University Physics Volume 3, 3.2 Mathematics of Interference (Equations 3.3 to 3.5, Example 3.1)'
    url: 'https://openstax.org/books/university-physics-volume-3/pages/3-2-mathematics-of-interference'
  - title: 'OpenStax, University Physics Volume 3, 3.1 Young''s Double-Slit Interference'
    url: 'https://openstax.org/books/university-physics-volume-3/pages/3-1-youngs-double-slit-interference'
