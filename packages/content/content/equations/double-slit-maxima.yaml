name:
  en: 'Double-slit interference maxima'
kind: 'equation'
level: 'intermediate'
expression: '\var{d}\sin\mag{\theta}=\var{m}\mag{\lambda}'
terms:
  d:
    kind: 'symbol'
    label:
      en: 'Slit separation'
    unit: 'metre'
  \theta:
    kind: 'magnitude'
    ref: 'plane-angle'
  m:
    kind: 'symbol'
    label:
      en: 'Order of the bright fringe'
    integer: true
  \lambda:
    kind: 'magnitude'
    ref: 'wavelength'
solutions:
  d: 'm * lambda / sin(theta)'
  \theta: 'asin(m * lambda / d)'
  m: 'd * sin(theta) / lambda'
  \lambda: 'd * sin(theta) / m'
calculator:
  enabled: true
categories:
