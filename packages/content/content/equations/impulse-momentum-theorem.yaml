name:
  en: 'Impulse-momentum theorem'
kind: 'equation'
level: 'intro'
expression: '\mag{J}=\mag{m}\var{v}-\mag{m}\var{v_{0}}'
terms:
  J:
    kind: 'magnitude'
    ref: 'impulse'
  m:
    kind: 'magnitude'
    ref: 'mass'
  v:
    kind: 'symbol'
    label:
      en: 'Final velocity'
    unit: 'metre-per-second'
  v_{0}:
    kind: 'symbol'
    label:
      en: 'Initial velocity'
    unit: 'metre-per-second'
solutions:
  J: 'm * (v - v_0)'
  m: 'J / (v - v_0)'
  v: 'v_0 + J / m'
  v_{0}: 'v - J / m'
