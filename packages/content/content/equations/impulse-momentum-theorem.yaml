description:
  en: >-
    The impulse-momentum theorem states that the impulse delivered to a body equals the change in
    its momentum: the mass times the final velocity minus the mass times the initial velocity. It
    links the force acting during a collision, a kick or a catch to the change of motion it causes,
    and it is a restatement of Newton's second law in mechanics.

    Here $\mag{J}$ is the impulse of the net force in newton seconds, $\mag{m}$ the mass of the body
    in kilograms, constant during the interaction, and $\var{v_{0}}$ and $\var{v}$ the velocities
    before and after, in metres per second. Along a line, a positive direction is chosen and both
    velocities are signed: a ball that bounces back has velocities of opposite signs, and its
    momentum changes by more than if it had stopped.

    Newton's second law says the net force equals the mass times the acceleration. Over a short
    interval the acceleration is the change of velocity divided by the time, so multiplying the
    force by the time gives the mass times the change of velocity, which is the change of momentum.
    The impulse of the force, its average value times the duration, therefore fixes the change of
    momentum, whatever the detailed shape of the force over time. Solving for the mass needs final
    and initial velocities that differ.

    The relation holds for any force history when the impulse is that of the net force on a body of
    fixed mass. It does not apply to a rocket or other body whose mass changes as it moves, and at
    speeds close to that of light the relativistic momentum replaces the product of mass and
    velocity.

    Newton's Principia of 1687 stated as its second law that the change of motion is proportional to
    the motive force impressed. The Philae lander, 96 kilograms, struck a comet at 1.0 metre per
    second and rebounded at 0.38 metres per second, so it received an impulse of about
    $132\,\mathrm{N\,s}$.
