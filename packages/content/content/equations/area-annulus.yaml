name:
  en: 'Area of an annulus'
kind: 'formula'
level: 'intro'
expression: '\mag{A}=\const{\pi}\left(\var{R}^{2}-\var{r}^{2}\right)'
terms:
  A:
    kind: 'magnitude'
    ref: 'area'
  \pi:
    kind: 'constant'
    ref: 'pi'
  R:
    kind: 'symbol'
    label:
      en: 'Outer radius'
    unit: 'metre'
  r:
    kind: 'symbol'
    label:
      en: 'Inner radius'
    unit: 'metre'
solutions:
  A: 'pi * (R^2 - r^2)'
  R: 'sqrt(A / pi + r^2)'
  r: 'sqrt(R^2 - A / pi)'
calculator:
  enabled: true
categories:
  - 'mathematics'
branches:
