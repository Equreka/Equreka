description:
  en: >-
    A voltage divider, or potential divider, is a pair of resistors in series across a source; the
    voltage across the second resistor equals the input voltage times that resistor's share of the
    total resistance. The circuit is the usual way to obtain a fixed fraction of a supply voltage in
    electronics, from sensor readings taken by microcontrollers to the potentiometer of a volume
    control.

    $\var{V_\mathrm{out}}$ is the output voltage, taken across the second resistor, in volts.
    $\var{V_\mathrm{in}}$ is the input voltage applied across both resistors, in volts.
    $\var{R_{1}}$ is the resistance of the first resistor, between the input and the output point,
    and $\var{R_{2}}$ that of the second, between the output point and the common return, both in
    ohms. Both voltages are measured from the common return with the same polarity, so the output
    has the sign of the input and a smaller absolute value.

    With no current drawn at the output, the two resistors carry the same current, the input voltage
    divided by their sum, as Ohm's law gives for a series pair. The output is that current times the
    second resistance. Only the ratio of the resistances matters: equal resistors halve the input,
    and a larger second resistor yields a larger output.

    The relation holds only while whatever is connected to the output draws negligible current. A
    load resistance sits in parallel with the second resistor and pulls the output down; keeping the
    second resistance below a tenth of the load keeps the change under about ten percent. Current
    flows through the divider all the time, so it dissipates power even with nothing attached.

    With 12 volts applied, a 1000-ohm resistor on the input side and a 3000-ohm resistor on the
    output side give an output of 9 volts.
