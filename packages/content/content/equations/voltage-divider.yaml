name:
  en: 'Voltage divider'
kind: 'formula'
level: 'intro'
expression: '\var{V_\mathrm{out}}=\var{V_\mathrm{in}}\frac{\var{R_{2}}}{\var{R_{1}}+\var{R_{2}}}'
terms:
  V_\mathrm{out}:
    kind: 'symbol'
    label:
      en: 'Output voltage across the second resistor'
    unit: 'volt'
  V_\mathrm{in}:
    kind: 'symbol'
    label:
      en: 'Input voltage'
    unit: 'volt'
  R_{1}:
    kind: 'symbol'
    label:
      en: 'Resistance of the first resistor (input side)'
    unit: 'ohm'
  R_{2}:
    kind: 'symbol'
    label:
      en: 'Resistance of the second resistor (output side)'
    unit: 'ohm'
solutions:
  V_\mathrm{out}: 'V_in * R_2 / (R_1 + R_2)'
  V_\mathrm{in}: 'V_out * (R_1 + R_2) / R_2'
  R_{1}: 'R_2 * (V_in - V_out) / V_out'
  R_{2}: 'R_1 * V_out / (V_in - V_out)'
