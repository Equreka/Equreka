description:
  en: >-
    The Clausius-Clapeyron equation relates the vapour pressures of a liquid at two temperatures to
    its molar enthalpy of vaporization. In physical chemistry and thermochemistry it predicts how
    steeply vapour pressure climbs with temperature, estimates the boiling point under reduced
    pressure and extracts an enthalpy of vaporization from two pressure measurements.

    $\var{p_{1}}$ and $\var{p_{2}}$ are the vapour pressures at the temperatures
    $\var{T_{1}}$ and $\var{T_{2}}$, in pascals; only their ratio enters, so any pressure unit works
    if both share it. The temperatures are absolute, in kelvin: a Celsius reading needs 273.15
    added. $\var{\Delta_\mathrm{vap}H}$ is the molar enthalpy of vaporization, in joules per mole,
    positive because evaporation absorbs heat. $\const{R}$ is the molar gas constant, about 8.314
    joules per mole kelvin.

    The logarithm of the vapour pressure falls on a nearly straight line when plotted against the
    reciprocal of the absolute temperature, with a slope of minus the enthalpy of vaporization over
    the gas constant; the two-point form compares two places on that line. A higher temperature
    always gives a higher vapour pressure, and a liquid boils where its vapour pressure reaches the
    pressure above it.

    The equation comes from the exact Clapeyron relation, which gives the slope of the coexistence
    curve as the latent heat over the temperature times the change in volume. Two approximations
    reduce it: the vapour behaves as an ideal gas, and the volume of the liquid is negligible next to
    that of the vapour. Integrating then treats the enthalpy of vaporization as constant, which holds
    over modest temperature ranges.

    Émile Clapeyron gave Sadi Carnot's ideas on heat an analytical form in 1834, and the relation is
    named after him and after Rudolf Clausius, whose 1850 paper rebuilt the theory of heat without
    the caloric hypothesis. Benzene boils at 353.3 kelvin under 101.3 kilopascals; with 30.8
    kilojoules per mole, the equation puts its boiling point under 83.4 kilopascals near 346.9
    kelvin.
