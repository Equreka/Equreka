name:
  en: 'Clausius-Clapeyron equation'
kind: 'equation'
level: 'intermediate'
expression: '\ln\left(\frac{\var{p_{2}}}{\var{p_{1}}}\right)=-\frac{\var{\Delta_\mathrm{vap}H}}{\const{R}}\left(\frac{1}{\var{T_{2}}}-\frac{1}{\var{T_{1}}}\right)'
terms:
  p_{1}:
    kind: 'symbol'
    label:
      en: 'Vapour pressure at the first temperature'
    unit: 'pascal'
  p_{2}:
    kind: 'symbol'
    label:
      en: 'Vapour pressure at the second temperature'
    unit: 'pascal'
  \Delta_\mathrm{vap}H:
    kind: 'symbol'
    label:
      en: 'Molar enthalpy of vaporization'
    unit: 'joule-per-mole'
    identifier: 'DeltaH_vap'
  R:
    kind: 'constant'
    ref: 'molar-gas-constant'
  T_{1}:
    kind: 'symbol'
    label:
      en: 'First temperature'
    unit: 'kelvin'
  T_{2}:
    kind: 'symbol'
    label:
      en: 'Second temperature'
    unit: 'kelvin'
solutions:
  p_{2}: 'p_1 * exp(DeltaH_vap * (T_2 - T_1) / (R * T_1 * T_2))'
  p_{1}: 'p_2 * exp(DeltaH_vap * (T_1 - T_2) / (R * T_1 * T_2))'
  \Delta_\mathrm{vap}H: 'R * ln(p_2 / p_1) * T_1 * T_2 / (T_2 - T_1)'
  T_{2}: 'T_1 * DeltaH_vap / (DeltaH_vap - R * T_1 * ln(p_2 / p_1))'
  T_{1}: 'T_2 * DeltaH_vap / (DeltaH_vap + R * T_2 * ln(p_2 / p_1))'
