name:
  en: 'Cyclotron frequency'
kind: 'formula'
level: 'intermediate'
expression: '\mag{f}=\frac{\left|\mag{q}\right|\mag{B}}{2\pi\mag{m}}'
terms:
  f:
    kind: 'magnitude'
    ref: 'frequency'
  q:
    kind: 'magnitude'
    ref: 'electric-charge'
  B:
    kind: 'magnitude'
    ref: 'magnetic-flux-density'
  m:
    kind: 'magnitude'
    ref: 'mass'
solutions:
  f: 'abs(q) * B / (2 * pi * m)'
  q:
    - '2 * pi * m * f / B'
    - '-(2 * pi * m * f / B)'
  B: '2 * pi * m * f / abs(q)'
  m: 'abs(q) * B / (2 * pi * f)'
calculator:
  enabled: true
externalIds:
  wikidata: 'Q3090440'
categories:
  - 'physics'
branches:
