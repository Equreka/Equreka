references:
  - title: 'OpenStax, University Physics Volume 2, 11.3 Motion of a Charged Particle in a Magnetic Field'
    url: 'https://openstax.org/books/university-physics-volume-2/pages/11-3-motion-of-a-charged-particle-in-a-magnetic-field'
  - title: 'C. R. Nave, HyperPhysics, Georgia State University: Cyclotron'
    url: 'https://hyperphysics.gsu.edu/hbase/magnetic/cyclot.html'
