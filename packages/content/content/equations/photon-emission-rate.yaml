name:
  en: 'Photon emission rate'
kind: 'formula'
level: 'intro'
expression: '\var{\Phi_\mathrm{p}}=\frac{\mag{\Phi_\mathrm{e}}\mag{\lambda}}{\const{h}\const{c}}'
terms:
  \Phi_\mathrm{p}:
    kind: 'symbol'
    label:
      en: 'Photon emission rate'
    unit: 'reciprocal-second'
  \Phi_\mathrm{e}:
    kind: 'magnitude'
    ref: 'radiant-flux'
  \lambda:
    kind: 'magnitude'
    ref: 'wavelength'
  h:
    kind: 'constant'
    ref: 'planck-constant'
  c:
    kind: 'constant'
    ref: 'speed-of-light'
solutions:
  \Phi_\mathrm{p}: 'Phi_e * lambda / (h * c)'
  \Phi_\mathrm{e}: 'Phi_p * h * c / lambda'
  \lambda: 'Phi_p * h * c / Phi_e'
