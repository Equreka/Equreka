description:
  en: >-
    The photon emission rate formula gives the number of photons a source of single-colour light
    emits each second: its radiant power multiplied by the wavelength, divided by the Planck constant
    and the speed of light. The same count per second, called the photon flux, describes light
    received by a detector or a surface, and it links the power of a beam to the quanta that carry
    it.

    Here $\var{\Phi_\mathrm{p}}$ is the photon emission rate, in reciprocal seconds: a count of
    photons per unit time, which the SI does not express in hertz, a unit kept for periodic
    phenomena. $\mag{\Phi_\mathrm{e}}$ is the radiant flux, the power leaving the source as light,
    in watts; it is not the electrical power the source draws. $\mag{\lambda}$ is the wavelength in
    vacuum, in metres. The constants are the Planck constant $\const{h}$ and the speed of light in
    vacuum $\const{c}$. All three variables are positive.

    Each photon carries the Planck constant times the speed of light over the wavelength, so
    dividing the power by that photon energy counts how many photons pass each second. At equal
    power, a source of longer wavelength therefore emits more photons, each with less energy: a
    watt of red light contains more photons than a watt of blue light. The equivalent form divides
    the radiant flux by the Planck constant times the frequency.

    The formula applies to monochromatic light such as that of a laser. For a source with a broad
    spectrum, the photon rate is the sum of the contributions of every wavelength, weighted by how
    the power is spread across the spectrum.

    The count explains why bright light means many photons rather than more energetic ones: a red
    laser pointer emitting one milliwatt at 633 nanometres sends out about
    $3.19\times10^{15}$ photons every second.
