name:
  en: 'Coefficient of variation'
kind: 'formula'
level: 'intermediate'
expression: '\var{c_\mathrm{v}}=\frac{\var{\sigma}}{\var{\mu}}'
terms:
  c_\mathrm{v}:
    kind: 'symbol'
    label:
      en: 'Coefficient of variation'
    unit: 'unitless'
  \sigma:
    kind: 'symbol'
    label:
      en: 'Standard deviation'
  \mu:
    kind: 'symbol'
    label:
      en: 'Mean'
solutions:
  c_\mathrm{v}: 'sigma / mu'
  \sigma: 'c_v * mu'
  \mu: 'sigma / c_v'
