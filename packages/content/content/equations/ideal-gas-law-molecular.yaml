description:
  en: >-
    The molecular form of the ideal gas law states that the pressure of a gas times its volume
    equals the number of its molecules times the Boltzmann constant times its absolute temperature.
    It is the ideal gas equation of state written for kinetic theory and statistical physics: it
    counts particles one by one instead of in moles, so it ties the bulk properties of a gas
    directly to its molecules.

    $\mag{p}$ is the absolute pressure in pascals, never the gauge reading of a tyre gauge.
    $\mag{V}$ is the volume of the gas in cubic metres. $\var{N}$ is the number of molecules, or of
    atoms for a monatomic gas, a count with no unit so large that it is treated as a continuous
    quantity. $\const{k_\mathrm{B}}$ is the Boltzmann constant,
    $1.380\,649\times10^{-23}\,\mathrm{J/K}$, exact in the SI. $\mag{T}$ is the thermodynamic
    temperature in kelvin; a Celsius reading is converted by adding 273.15. All four quantities are
    positive.

    Writing the number of molecules as the amount of substance times the Avogadro constant turns
    this form into the familiar molar one, because the Avogadro constant times the Boltzmann
    constant is the molar gas constant. Dividing both sides by the volume shows that the number of
    molecules per unit volume depends only on pressure and temperature, whatever the gas: equal
    volumes at equal pressure and temperature hold equal numbers of molecules.

    The law describes an ideal gas, whose molecules take up a negligible share of the volume and
    interact only through brief elastic collisions. Real gases come close to it at low density and
    at temperatures well above their boiling points; at high pressure the size of the molecules and
    the attraction between them make it fail.

    The constant in the law honours Ludwig Boltzmann (1844–1906). By the law, one breath of 500
    millilitres at 0 degrees Celsius and one standard atmosphere holds about
    $1.34\times10^{22}$ molecules.
