name:
  en: 'Magnetic flux through a flat surface'
kind: 'formula'
level: 'intro'
expression: '\mag{\Phi}=\mag{B}\mag{A}\cos\mag{\theta}'
terms:
  \Phi:
    kind: 'magnitude'
    ref: 'magnetic-flux'
  B:
    kind: 'magnitude'
    ref: 'magnetic-flux-density'
  A:
    kind: 'magnitude'
    ref: 'area'
  \theta:
    kind: 'magnitude'
    ref: 'plane-angle'
solutions:
  \Phi: 'B * A * cos(theta)'
  B: 'Phi / (A * cos(theta))'
  A: 'Phi / (B * cos(theta))'
  \theta: 'acos(Phi / (B * A))'
calculator:
  enabled: true
