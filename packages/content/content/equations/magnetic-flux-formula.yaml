references:
  - title: 'OpenStax, College Physics 2e, 23.1 Induced Emf and Magnetic Flux (Equation 23.1)'
    url: 'https://openstax.org/books/college-physics-2e/pages/23-1-induced-emf-and-magnetic-flux'
