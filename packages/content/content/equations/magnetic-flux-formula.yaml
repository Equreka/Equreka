description:
  en: >-
    The magnetic flux through a flat surface in a uniform magnetic field equals the magnetic flux
    density times the area times the cosine of the angle between the field and the normal to the
    surface. It measures how much magnetic field threads a loop or a coil, and in electromagnetism
    its change over time is what Faraday's law of induction turns into an induced emf.

    $\mag{\Phi}$ is the magnetic flux in webers, one weber being one tesla times one square metre.
    $\mag{B}$ is the magnetic flux density in teslas (the gauss is also accepted), $\mag{A}$ is the
    area of the surface in square metres, and $\mag{\theta}$ is the angle between the field and the
    normal, the line perpendicular to the surface, from 0 to 180 degrees. The flux is positive when
    the field crosses the surface along the chosen normal, zero when the field lies in the plane of
    the surface and negative when it crosses against the normal; choosing the opposite normal
    reverses every sign.

    Only the part of the field perpendicular to the surface passes through it, and that part is the
    field times the cosine of the angle. Put another way, the flux is the full field times the area
    of the surface's shadow on a plane at right angles to the field. A coil turning in a steady
    field, as in a generator, sees its flux swing from a maximum through zero to the negative of
    that maximum as the angle changes.

    The formula assumes a flat surface and a field that is the same over all of it. For a curved
    surface or a field that varies, the surface is split into small patches whose fluxes are added,
    which turns the product into an integral. Over any closed surface the total flux is zero,
    because magnetic field lines have no ends.

    The weber honours the German physicist Wilhelm Weber, who worked with Carl Friedrich Gauss on
    one of the earliest electric telegraphs. A loop of 0.0113 square metres facing a 0.250 T field
    head-on holds a flux of about 0.00283 webers.
