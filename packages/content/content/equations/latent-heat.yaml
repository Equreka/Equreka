description:
  en: >-
    Latent heat is the heat a substance absorbs or gives off while it changes phase at a constant
    temperature. It equals the mass that changes phase times the specific latent heat of the
    transition, and in thermodynamics and calorimetry it gives the energy needed to melt ice, boil
    water or condense steam, covering the heats of fusion, vaporization and sublimation.

    $\mag{Q}$ is the heat for the whole mass to change phase, in joules. $\mag{m}$ is the mass that
    changes phase, in kilograms. $\mag{L}$ is the specific latent heat of the transition, in joules
    per kilogram, never negative; for water at a pressure of one atmosphere it is 334 kilojoules per
    kilogram for melting and 2256 kilojoules per kilogram for boiling. The formula gives the size of
    the heat. Melting, vaporization and sublimation take that amount in, while freezing,
    condensation and deposition return the same amount to the surroundings, so for those the heat of
    the substance is negative.

    While a substance melts or boils its temperature stays put until the change is complete, because
    the energy supplied loosens or breaks the bonds between molecules rather than making them move
    faster. A stirred mixture of ice and water therefore remains at 0 degrees Celsius as it is
    heated. Vaporization needs far more energy than melting: the molecules must be pulled fully
    apart, and the vapour must also push back the surrounding air as it expands.

    Specific latent heats are measured values that depend on the pressure and on the temperature of
    the transition: water evaporating at body temperature, 37 degrees Celsius, takes 2430 kilojoules
    per kilogram rather than 2256. Heating cold ice all the way to steam needs this relation once
    for each change of phase and the sensible heat relation for each warming stage in between.

    Joseph Black's experiments on freezing and melting water at the University of Glasgow, where he
    taught from 1756 to 1766, led to the concept of the latent heat of fusion. Melting 18 grams of
    ice at 0 degrees Celsius takes about 6.0 kilojoules.
