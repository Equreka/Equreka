description:
  en: >-
    The resonant frequency of an LC circuit is the frequency at which an inductor and a capacitor
    joined together pass energy back and forth, and the frequency at which a series circuit of a
    resistor, an inductor and a capacitor, driven by an alternating source, carries the largest
    current. It equals one over two pi times the square root of the inductance times the
    capacitance.

    $\mag{f_{0}}$ is the resonant frequency in hertz, $\mag{L}$ the inductance in henries and
    $\mag{C}$ the capacitance in farads, all positive. The matching angular frequency is
    $\omega_{0} = 1/\sqrt{LC}$, in radians per second, which is two pi times the frequency in hertz.

    A charged capacitor connected to an inductor drives a current that builds up a magnetic field;
    when the capacitor is empty the current is at its largest, and the inductor then recharges the
    capacitor with the opposite polarity. The charge oscillates like a mass on a spring, the
    inductance acting as the mass and the reciprocal of the capacitance as the spring constant. In a
    driven circuit, resonance is the frequency at which the two reactances are equal,
    $X_\mathrm{L} = X_\mathrm{C}$, so they cancel and the impedance falls to the resistance alone.

    The free oscillation described here neglects resistance, which turns the energy into heat and
    makes the oscillation die away. In a driven series circuit the resistance does not move the
    resonant frequency but sets how sharp the peak is: the smaller the resistance, the taller and
    narrower the peak, and the better the circuit selects one frequency.

    Radio receivers tune to a station by adjusting a variable capacitor until the resonant frequency
    matches the broadcast. An inductance of 3.00 mH with a capacitance of 5.00 microfarads
    resonates at about 1.30 kHz.
