description:
  en: >-
    The Bohr orbit radius of hydrogen is the radius of the circular path of the electron in the
    Bohr model of the hydrogen atom: the square of a whole number times the Bohr radius. It shows
    that the allowed orbits of atomic physics come in a discrete set whose sizes grow as the square
    of the principal quantum number.

    Here $\var{r_{n}}$ is the radius of orbit $\var{n}$, in metres, and $\var{n}$ is the principal
    quantum number, a whole number from one upwards. The calculator accepts only whole numbers for
    it, and the level it solves from a radius is a whole number only when that radius is an allowed
    orbit. The constant $\const{a_{0}}$ is the Bohr radius, the CODATA 2022 value of which is about
    0.0529 nanometres, the radius of the smallest orbit.

    Bohr required the angular momentum of the electron to be a whole multiple of the reduced Planck
    constant and let the Coulomb attraction of the proton supply the centripetal force. Solving the
    two conditions together gives a radius proportional to the square of the quantum number, so the
    second orbit is four times and the third nine times the size of the first. The same model gives
    the Bohr energy levels of hydrogen, which fall in magnitude as the orbits grow.

    The formula assumes one electron and a nucleus of infinite mass. For a hydrogen-like ion of
    nuclear charge Z, every radius is divided by Z. Allowing the proton to move replaces the
    electron mass by the reduced mass and enlarges each radius by about 0.05 percent, the
    electron-to-proton mass ratio. Quantum mechanics replaces the orbits by probability
    distributions, yet the ground-state electron is still most likely found at about one Bohr radius
    from the proton.

    Niels Bohr published the model in 1913 in the Philosophical Magazine. The second orbit has a
    radius of about $2.12\times10^{-10}\,\mathrm{m}$, and an atom excited to the sixth level is
    36 times larger than in its ground state.
