description:
  en: >-
    Newton's law of cooling states that a body left in surroundings at a constant temperature
    approaches that temperature exponentially: the difference between the two shrinks by the same
    factor in every equal interval of time. It is a simple model of heat transfer in
    thermodynamics, used for a cooling cup of coffee, a warming drink from the refrigerator, or the
    time since a hot object was set aside.

    $\var{T}$ is the temperature of the body at time $\mag{t}$, $\var{T_{0}}$ its temperature at
    the start and $\var{T_\mathrm{env}}$ the constant ambient temperature, all in kelvin; a Celsius
    reading is converted by adding 273.15, and because only differences from the ambient value
    enter, the result is the same as working throughout in Celsius. $\var{k}$ is the cooling
    constant in reciprocal seconds, positive, set by the body and its setting and found from one
    measured temperature. $\mag{t}$ is the time elapsed since the start, in seconds. A body colder
    than its surroundings warms by the same rule.

    The law assumes that the rate of change of the temperature of the body is proportional to its
    difference from the ambient temperature. That difference therefore obeys the equation of
    exponential decay, and its solution is the expression shown. The body never quite reaches the
    ambient temperature; the difference halves every interval equal to the natural logarithm of 2
    divided by the cooling constant.

    The model needs surroundings large enough not to warm, a body at a nearly uniform temperature
    and heat lost by convection at a rate proportional to the temperature excess, which holds for
    moderate differences. Large differences, where radiation grows with the fourth power of
    temperature, break the proportionality.

    Isaac Newton set out the law in a paper on a scale of temperatures, Scala graduum caloris, in the
    Philosophical Transactions of 1701. Coffee poured at 200 degrees Fahrenheit that cools to 180
    in two minutes in a room at 70 has a cooling constant of about 0.0835 per minute.
