name:
  en: 'Newton''s law of cooling'
kind: 'equation'
level: 'intermediate'
expression: '\var{T}=\var{T_\mathrm{env}}+\left(\var{T_{0}}-\var{T_\mathrm{env}}\right)e^{-\var{k}\mag{t}}'
terms:
  T:
    kind: 'symbol'
    label:
      en: 'Temperature of the body at time t'
    unit: 'kelvin'
  T_\mathrm{env}:
    kind: 'symbol'
    label:
      en: 'Ambient temperature'
    unit: 'kelvin'
  T_{0}:
    kind: 'symbol'
    label:
      en: 'Initial temperature of the body'
    unit: 'kelvin'
  k:
    kind: 'symbol'
    label:
      en: 'Cooling constant'
    unit: 'reciprocal-second'
  t:
    kind: 'magnitude'
    ref: 'time'
solutions:
  T: 'T_env + (T_0 - T_env) * exp(-k * t)'
  T_\mathrm{env}: '(T - T_0 * exp(-k * t)) / (1 - exp(-k * t))'
  T_{0}: 'T_env + (T - T_env) * exp(k * t)'
  k: 'ln((T_0 - T_env) / (T - T_env)) / t'
  t: 'ln((T_0 - T_env) / (T - T_env)) / k'
