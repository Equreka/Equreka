description:
  en: >-
    The mean translational kinetic energy of a gas molecule is three halves of the Boltzmann
    constant times the absolute temperature of the gas. This result of the kinetic theory of gases
    gives temperature its microscopic meaning in thermodynamics: the absolute temperature of an
    ideal gas is a measure of the average energy of the random motion of its molecules.

    $\var{\bar{K}}$ is the kinetic energy of translation of one molecule averaged over all the
    molecules of the gas, in joules: the mean of one half the molecular mass times the squared
    speed. It is never negative. $\const{k_\mathrm{B}}$ is the Boltzmann constant,
    $1.380\,649\times10^{-23}\,\mathrm{J/K}$, exact in the SI. $\mag{T}$ is the thermodynamic
    temperature in kelvin; the relation needs absolute temperature, so a Celsius reading is
    converted by adding 273.15.

    Kinetic theory traces the pressure of a gas to molecules rebounding from the walls and finds
    that pressure times volume equals two thirds of the number of molecules times their mean
    kinetic energy. Setting that product equal to the molecular form of the ideal gas law gives the
    formula. The factor three halves splits into one half of the Boltzmann constant times the
    temperature for each of the three directions of motion, as the equipartition theorem states.

    The molecular mass does not appear: at the same temperature a light helium atom and a heavy
    xenon atom carry the same mean energy, the lighter one moving faster. The result assumes an
    ideal gas obeying classical mechanics in thermal equilibrium, and it counts translation only:
    the rotation and vibration of polyatomic molecules store energy on top of it.

    The kinetic theory behind the result goes back to Daniel Bernoulli (1700–1782). At 293 kelvin,
    room temperature, the mean translational kinetic energy of any gas molecule is about
    $6.07\times10^{-21}$ joules.
