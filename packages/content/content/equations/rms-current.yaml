name:
  en: 'RMS value of a sinusoidal current'
kind: 'formula'
level: 'intro'
expression: '\var{I_\mathrm{rms}}=\frac{\var{I_{0}}}{\sqrt{2}}'
terms:
  I_\mathrm{rms}:
    kind: 'symbol'
    label:
      en: 'RMS current'
    unit: 'ampere'
  I_{0}:
    kind: 'symbol'
    label:
      en: 'Peak current'
    unit: 'ampere'
solutions:
  I_\mathrm{rms}: 'I_0 / sqrt(2)'
  I_{0}: 'sqrt(2) * I_rms'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'electromagnetism'
aliases:
  - 'RMS current'
  - 'root-mean-square current'
  - 'effective current'
  - 'Irms = I0 / sqrt 2'
