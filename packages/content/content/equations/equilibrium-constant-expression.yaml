name:
  en: 'Equilibrium constant expression'
kind: 'equation'
level: 'intermediate'
expression: '\var{K}=\frac{\left(\frac{\var{c_\mathrm{C}}}{\const{c^{\circ}}}\right)^{\var{\nu_\mathrm{C}}}\left(\frac{\var{c_\mathrm{D}}}{\const{c^{\circ}}}\right)^{\var{\nu_\mathrm{D}}}}{\left(\frac{\var{c_\mathrm{A}}}{\const{c^{\circ}}}\right)^{\var{\nu_\mathrm{A}}}\left(\frac{\var{c_\mathrm{B}}}{\const{c^{\circ}}}\right)^{\var{\nu_\mathrm{B}}}}'
terms:
  K:
    kind: 'symbol'
    label:
      en: 'Equilibrium constant'
  c_\mathrm{A}:
    kind: 'symbol'
    label:
      en: 'Equilibrium concentration of A'
    unit: 'mole-per-cubic-metre'
  c_\mathrm{B}:
    kind: 'symbol'
    label:
      en: 'Equilibrium concentration of B'
    unit: 'mole-per-cubic-metre'
  c_\mathrm{C}:
    kind: 'symbol'
    label:
      en: 'Equilibrium concentration of C'
    unit: 'mole-per-cubic-metre'
  c_\mathrm{D}:
    kind: 'symbol'
    label:
      en: 'Equilibrium concentration of D'
    unit: 'mole-per-cubic-metre'
  \nu_\mathrm{A}:
    kind: 'symbol'
    label:
      en: 'Stoichiometric coefficient of A'
    integer: true
  \nu_\mathrm{B}:
    kind: 'symbol'
    label:
      en: 'Stoichiometric coefficient of B'
    integer: true
  \nu_\mathrm{C}:
    kind: 'symbol'
    label:
      en: 'Stoichiometric coefficient of C'
    integer: true
  \nu_\mathrm{D}:
    kind: 'symbol'
    label:
      en: 'Stoichiometric coefficient of D'
    integer: true
  c^{\circ}:
    kind: 'constant'
    ref: 'standard-amount-concentration'
    identifier: 'c_std'
solutions:
  K: '(c_C / c_std)^nu_C * (c_D / c_std)^nu_D / ((c_A / c_std)^nu_A * (c_B / c_std)^nu_B)'
  c_\mathrm{A}: 'c_std * ((c_C / c_std)^nu_C * (c_D / c_std)^nu_D / (K * (c_B / c_std)^nu_B))^(1 / nu_A)'
  c_\mathrm{B}: 'c_std * ((c_C / c_std)^nu_C * (c_D / c_std)^nu_D / (K * (c_A / c_std)^nu_A))^(1 / nu_B)'
  c_\mathrm{C}: 'c_std * (K * (c_A / c_std)^nu_A * (c_B / c_std)^nu_B / (c_D / c_std)^nu_D)^(1 / nu_C)'
  c_\mathrm{D}: 'c_std * (K * (c_A / c_std)^nu_A * (c_B / c_std)^nu_B / (c_C / c_std)^nu_C)^(1 / nu_D)'
calculator:
  enabled: true
  solveFor: ['K', 'c_\mathrm{A}', 'c_\mathrm{B}', 'c_\mathrm{C}', 'c_\mathrm{D}']
