description:
  en: >-
    The magnification of an image formed by a thin lens or a spherical mirror, also called the
    lateral or linear magnification, is the ratio of the image height to the object height, and it
    equals minus the image distance divided by the object distance. The relation tells how large
    an image is and whether it stands upright or inverted, once the thin lens equation or the
    mirror equation has located it.

    The magnification $\var{m}$ is a pure number. The image distance $\var{d_\mathrm{i}}$ and the
    object distance $\var{d_\mathrm{o}}$ are lengths in metres with the signs of the real-is-positive
    convention of OpenStax: a real object has a positive distance, a real image a positive distance
    and a virtual image a negative one. A negative magnification means an inverted image, a
    positive one an upright image; an absolute value above one means the image is larger than the
    object, and one below one that it is smaller.

    The ray through the centre of a lens passes undeviated, so the tip of the object, the tip of its
    image and the lens centre lie on one straight line. The two right triangles it forms with the axis are similar,
    and their heights are in the same ratio as their distances; the minus sign records that a real
    image lies on the other side of the axis from its object.

    The relation shares the assumptions of the thin lens and mirror equations: thin lenses or small
    mirrors, and rays close to the axis. It describes the size of the image itself, not the angular
    magnification of a magnifier, telescope or microscope, which compares the angles under which
    the eye sees an object with and without the instrument.

    A real image formed 1.50 metres behind a lens from an object 0.750 metres in front of it has a
    magnification of minus 2.00: twice as tall as the object and upside down.
