# yaml-language-server: $schema=../../dist/schemas/equations.locale.schema.json
name: 'Producto de solubilidad de una sal de cualquier fórmula'
terms:
  K_\mathrm{sp}:
    label: 'Producto de solubilidad'
  x:
    label: 'Cationes por unidad fórmula'
  y:
    label: 'Aniones por unidad fórmula'
  s:
    label: 'Solubilidad molar'
description: >-
  Para una sal poco soluble que se disuelve en x cationes e y aniones por unidad fórmula, el producto
  de solubilidad es igual al producto de las concentraciones de cada ion, elevadas al número de iones
  de ese tipo, escritas mediante la solubilidad molar y tomadas respecto de la concentración molar
  estándar. En el equilibrio químico vincula la constante de equilibrio de la
  disolución con la cantidad que se disuelve de una sal como el fluoruro de calcio o el sulfato de
  plata.

  $\var{K_\mathrm{sp}}$ es el producto de solubilidad, un número puro. $\var{x}$ cuenta los cationes e
  $\var{y}$ los aniones que libera una unidad fórmula, números enteros sin unidad: 1 y 2 para el
  hidróxido de calcio, 2 y 1 para el sulfato de plata. $\var{s}$ es la solubilidad molar, en moles por
  metro cúbico, y la calculadora acepta moles por litro. $\const{c^{\circ}}$ es la concentración
  molar estándar, exactamente un mol por litro, y una solubilidad en moles por litro entra como su
  número.

  Al disolverse, una unidad fórmula libera x cationes e y aniones, así que una disolución saturada
  contiene x veces s del catión e y veces s del anión. Cada uno aparece en la constante de equilibrio
  elevado a su coeficiente estequiométrico, lo que da la expresión. Leída al revés, la solubilidad
  molar es la concentración estándar por la raíz de índice x + y de la constante dividida entre x
  elevado a x por y elevado a y; con x e y iguales a uno se reduce a la fórmula de la sal 1:1.

  La relación solo vale cuando la disolución no implica más que disociación y solvatación, la
  condición que fija OpenStax; los iones que se asocian en pares o reaccionan con el agua quedan
  fuera de ella. Las concentraciones sustituyen a las actividades, lo que solo vale en disolución
  diluida, y un ion ya presente reduce la solubilidad. La constante depende de la temperatura, y la
  IUPAC la escribe Ksol o Ks; Ksp es el símbolo de los libros de texto. La calculadora toma ambos
  recuentos como datos.

  El hidróxido de calcio tiene un producto de solubilidad de $1.3\times10^{-6}$, así que con x = 1 e
  y = 2 su solubilidad molar es de unos $6.9\times10^{-3}$ moles por litro, como obtiene OpenStax.
