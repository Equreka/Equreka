description:
  en: >-
    The moment of inertia of a thin uniform rod about an axis through its centre, perpendicular to
    its length, is one twelfth of its mass times the square of its length. This shape formula of
    rotational mechanics describes a baton, a propeller blade pair, a seesaw plank or a spinning
    stick, any slender body turning end over end about its midpoint.

    Here $\mag{I}$ is the moment of inertia in kilogram square metres, $\mag{M}$ is the mass of the
    rod in kilograms and $\var{L}$ is its full length in metres. All three are non-negative, so
    solving for the length keeps only the non-negative square root.

    The rod can be treated as a line of tiny pieces, each contributing its mass times the square of
    its distance from the centre. With the mass spread evenly along the length, integrating from one
    end to the other, half a length on each side of the centre, gives the factor one twelfth. About
    a parallel axis through one end, the parallel axis theorem adds the mass times the square of
    half the length, and the result becomes one third of the mass times the squared length, four
    times the value about the centre.

    The formula assumes a uniform rod whose thickness is negligible next to its length; a thick bar
    or a cylinder turning about a diameter needs a further term for its radius. It applies only to
    the axis through the centre at right angles to the rod: about the rod's own long axis a thin rod
    has almost no moment of inertia.

    A uniform rod of 2.0 kilograms and length 0.50 metres has a moment of inertia of about
    $0.042\,\mathrm{kg\,m^{2}}$ about its centre and about $0.17\,\mathrm{kg\,m^{2}}$ about one end.
