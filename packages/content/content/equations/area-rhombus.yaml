name:
  en: 'Area of a rhombus'
kind: 'formula'
level: 'intro'
expression: '\mag{A}=\frac{\var{d_{1}}\var{d_{2}}}{2}'
terms:
  A:
    kind: 'magnitude'
    ref: 'area'
  d_{1}:
    kind: 'symbol'
    label:
      en: 'First diagonal'
    unit: 'metre'
  d_{2}:
    kind: 'symbol'
    label:
      en: 'Second diagonal'
    unit: 'metre'
solutions:
  A: 'd_1 * d_2 / 2'
  d_{1}: '2 * A / d_2'
  d_{2}: '2 * A / d_1'
calculator:
  enabled: true
categories:
  - 'mathematics'
branches:
  - 'geometry'
aliases:
  - 'rhombus area'
  - 'area of a rhomb'
  - 'area of a diamond'
  - 'área del rombo'
references:
  - title: 'E. W. Weisstein, Rhombus, MathWorld'
    url: 'https://mathworld.wolfram.com/Rhombus.html'
