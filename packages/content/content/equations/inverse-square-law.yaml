name:
  en: 'Inverse-square law for sound intensity'
kind: 'equation'
level: 'intro'
expression: '\var{I_{2}}=\var{I_{1}}\left(\frac{\var{r_{1}}}{\var{r_{2}}}\right)^{2}'
terms:
  I_{1}:
    kind: 'symbol'
    label:
      en: 'Intensity at the first distance'
    unit: 'watt-per-square-metre'
  I_{2}:
    kind: 'symbol'
    label:
      en: 'Intensity at the second distance'
    unit: 'watt-per-square-metre'
  r_{1}:
    kind: 'symbol'
    label:
      en: 'First distance from the source'
    unit: 'metre'
  r_{2}:
    kind: 'symbol'
    label:
      en: 'Second distance from the source'
    unit: 'metre'
solutions:
  I_{2}: 'I_1 * (r_1 / r_2)^2'
  I_{1}: 'I_2 * (r_2 / r_1)^2'
  r_{1}: 'r_2 * sqrt(I_2 / I_1)'
  r_{2}: 'r_1 * sqrt(I_1 / I_2)'
