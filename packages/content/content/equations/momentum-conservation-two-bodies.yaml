name:
  en: 'Conservation of momentum for two bodies'
kind: 'equation'
level: 'intro'
expression: '\var{m_{1}}\var{u_{1}}+\var{m_{2}}\var{u_{2}}=\var{m_{1}}\var{v_{1}}+\var{m_{2}}\var{v_{2}}'
terms:
  m_{1}:
    kind: 'symbol'
    label:
      en: 'Mass of body 1'
    unit: 'kilogram'
  m_{2}:
    kind: 'symbol'
    label:
      en: 'Mass of body 2'
    unit: 'kilogram'
  u_{1}:
    kind: 'symbol'
    label:
      en: 'Initial velocity of body 1'
    unit: 'metre-per-second'
  u_{2}:
    kind: 'symbol'
    label:
      en: 'Initial velocity of body 2'
    unit: 'metre-per-second'
  v_{1}:
    kind: 'symbol'
    label:
      en: 'Final velocity of body 1'
    unit: 'metre-per-second'
  v_{2}:
    kind: 'symbol'
    label:
      en: 'Final velocity of body 2'
    unit: 'metre-per-second'
solutions:
  v_{1}: '(m_1 * u_1 + m_2 * u_2 - m_2 * v_2) / m_1'
  v_{2}: '(m_1 * u_1 + m_2 * u_2 - m_1 * v_1) / m_2'
  u_{1}: '(m_1 * v_1 + m_2 * v_2 - m_2 * u_2) / m_1'
  u_{2}: '(m_1 * v_1 + m_2 * v_2 - m_1 * u_1) / m_2'
  m_{1}: 'm_2 * (v_2 - u_2) / (u_1 - v_1)'
  m_{2}: 'm_1 * (u_1 - v_1) / (v_2 - u_2)'
