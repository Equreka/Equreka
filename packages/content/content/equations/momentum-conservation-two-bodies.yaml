description:
  en: >-
    The conservation of momentum for two bodies states that, when two bodies interact with no net
    external force on them, their total momentum before the interaction equals their total momentum
    after it. This form of the law of conservation of linear momentum governs collisions, bounces,
    explosions and pushes between pairs of objects in mechanics, whether or not kinetic energy is
    conserved.

    In the equation, $\var{m_{1}}$ and $\var{m_{2}}$ are the masses in kilograms; $\var{u_{1}}$ and
    $\var{u_{2}}$ are the velocities of the two bodies before the interaction, and $\var{v_{1}}$ and
    $\var{v_{2}}$ their velocities after it, all in metres per second. The motion lies along one
    line with a chosen positive direction; a velocity pointing the other way is negative, so two
    bodies approaching head-on have initial velocities of opposite signs.

    During the interaction the two bodies push on each other with forces that are equal in size and
    opposite in direction, by Newton's third law, and they act for the same time. Their impulses are
    therefore equal and opposite, so whatever momentum one body gains the other loses, and the sum
    stays the same. Solving for one final velocity needs the other; a second relation, such as
    conservation of kinetic energy in an elastic collision, is required to find both.

    The law holds exactly for an isolated pair. External forces such as friction or gravity along
    the line spoil it, but in a brief impact their impulse is often small enough to neglect. Solving
    for a mass needs a body whose velocity changes.

    In 1668 the Royal Society, through Henry Oldenburg, invited Christiaan Huygens, John Wallis and
    Christopher Wren to report their work on the laws of impact; the rules Huygens sent kept the
    momentum along a given direction unchanged by a collision, which he confirmed by experiment. In
    a perfectly elastic collision, a puck of 12 grams moving at 2.5 metres per second hits a puck of
    15 grams at rest and rebounds at 0.28 metres per second, while the struck puck leaves at 2.22
    metres per second.
