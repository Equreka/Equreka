description:
  en: >-
    The multiplication rule for independent events states that the probability of two independent
    events both happening is the product of their separate probabilities. Two events are independent
    when the occurrence of one leaves the probability of the other unchanged, and the rule is often
    called the product rule or the "and" rule of probability.

    In the equation, $\var{P(A\cap B)}$ is the probability of the intersection, the event that A and
    B both occur on the same trial, while $\var{P(A)}$ and $\var{P(B)}$ are the probabilities of
    each event alone. All three are pure numbers from 0 to 1 and never negative. Because each factor
    is at most 1, the joint probability can never exceed the smaller of the two.

    The general multiplication rule multiplies the probability of B by the conditional probability
    of A given B. Independence means that knowing B has occurred tells nothing about A, so the
    conditional probability equals the plain probability of A and the general rule collapses to a
    product of the two. The same equation serves as the formal test of independence: two events are
    independent exactly when their joint probability equals that product.

    Independence is a property to be checked, not assumed. Draws without replacement, successive
    attempts by the same player and events linked by a common cause are usually dependent, and
    multiplying their probabilities gives a wrong answer; the conditional form is needed there.
    Independence is also different from mutual exclusivity: two mutually exclusive events with
    nonzero probabilities are always dependent, since one rules the other out.

    For independent trials the rule extends to any number of events by multiplying all their
    probabilities, which underlies repeated coin tosses, dice games and the binomial distribution.
    Two fair coins both land heads with probability 1/2 × 1/2 = 1/4.
