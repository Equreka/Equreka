description:
  en: >-
    Inverse proportion, or inverse variation, is the relation between two quantities whose product
    stays constant: when one is multiplied by some factor, the other is divided by the same factor.
    One quantity equals a fixed constant divided by the other, and the graph of the relation is a
    hyperbola that approaches both axes without ever reaching them.

    In the formula, $\var{x}$ is the independent quantity, $\var{y}$ the quantity that depends on
    it, and $\var{k}$ the constant of proportionality, or constant of variation, which is never
    zero. The unit of $\var{k}$ is the product of the units of the other two, as in the worker-days
    a job requires; written as plain numbers, the terms work in any consistent units. The
    independent quantity cannot be zero. With a positive constant both quantities share a sign, and
    as one grows the other shrinks toward zero.

    The constant follows from one known pair of values by multiplying them: if $\var{y}$ is 20 when
    $\var{x}$ is 8, the constant is 160. Doubling $\var{x}$ then halves $\var{y}$, and tripling it
    divides $\var{y}$ by three. Replacing $\var{x}$ by its reciprocal turns the relation into a
    direct proportion between $\var{y}$ and one over $\var{x}$, which is how inverse proportion is
    recognized in measured data: those two plotted against each other fall on a straight line
    through the origin.

    Real quantities follow the relation only within limits. The time a job takes falls in inverse
    proportion to the number of workers only while the work divides evenly and the workers do not
    hinder one another. The relation differs from a decreasing straight line, which also falls as x
    grows but does not keep the product fixed. Related laws divide by a power of x instead, such as
    its square or its cube.

    Examples include the travel time over a fixed distance against speed, the pressure of a gas kept
    at constant temperature against its volume, and the size of equal shares against the number of
    people sharing. A 120 kilometre trip takes two hours at 60 kilometres per hour and one hour at
    120.
