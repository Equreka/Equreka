name:
  en: 'Harmonics of a string fixed at both ends'
kind: 'formula'
level: 'intro'
expression: '\mag{f_{n}}=\frac{\var{n}\mag{v}}{2\var{L}}'
terms:
  f_{n}:
    kind: 'magnitude'
    ref: 'frequency'
  n:
    kind: 'symbol'
    label:
      en: 'Harmonic number'
    integer: true
  v:
    kind: 'magnitude'
    ref: 'speed'
  L:
    kind: 'symbol'
    label:
      en: 'Length of the string'
    unit: 'metre'
solutions:
  f_{n}: 'n * v / (2 * L)'
  n: '2 * L * f_n / v'
  v: '2 * L * f_n / n'
  L: 'n * v / (2 * f_n)'
calculator:
  enabled: true
categories:
  - 'physics'
branches:
  - 'waves-and-oscillations'
aliases:
  - 'f_n = n v / 2L'
  - 'vibrating string'
  - 'standing waves on a string'
  - 'string harmonics'
