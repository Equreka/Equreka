references:
  - title: 'NIST/SEMATECH e-Handbook of Statistical Methods, 1.3.6.6.1 Normal Distribution'
    url: 'https://www.itl.nist.gov/div898/handbook/eda/section3/eda3661.htm'
  - title: 'OpenStax, Introductory Statistics 2e, 6 Introduction (The Normal Distribution)'
    url: 'https://openstax.org/books/introductory-statistics-2e/pages/6-introduction'
  - title: 'MacTutor History of Mathematics, Abraham de Moivre (biography)'
    url: 'https://mathshistory.st-andrews.ac.uk/Biographies/De_Moivre/'
description:
  en: >-
    The probability density of the normal distribution, also called the Gaussian distribution or
    bell curve, gives how densely the values of a normally distributed random variable crowd around
    a value x, for a given mean and standard deviation. It is the most widely used continuous
    distribution in statistics and probability, the model behind measurement errors, test scores
    and many natural variations.

    In the formula, $\var{x}$ is the value, $\var{\mu}$ the mean and $\var{\sigma}$ the standard
    deviation, which must be positive; $\var{\mu}$ fixes the location of the curve and is also its
    median and mode, while $\var{\sigma}$ sets its width. $\var{f}$ is the probability density. The
    value, the mean and the standard deviation share the unit of the data, and the density carries
    its reciprocal; the calculator treats all four as pure numbers, so they must be entered in one
    consistent unit.

    The curve peaks at the mean, where it reaches one over $\var{\sigma}$ times the square root of
    two pi, and falls away symmetrically on both sides. A density is not a probability: the
    probability that the variable lands between two values is the area under the curve between
    them, and the whole area equals one. Two values at the same distance from the mean have the same
    density, so solving for $\var{x}$ gives the value below the mean first and the one above it
    second, and solving for $\var{\mu}$ lists its two roots in the same order. The standard
    deviation appears both outside and inside the exponential, so it has no closed form and is an
    input only.

    Real data are at best approximately normal, and many statistical tests assume normality that
    should be checked first. The central limit theorem explains the wide use: the mean of a large
    sample is close to normally distributed whatever the distribution of the original variable.

    Abraham de Moivre first published the normal approximation to the binomial distribution for many
    trials in a Latin pamphlet of 13 November 1733. For the standard normal curve, the density
    is about 0.3989 at the mean and 0.2420 one standard deviation away.
