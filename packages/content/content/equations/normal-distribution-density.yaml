# yaml-language-server: $schema=../../dist/schemas/equations.schema.json
name:
  en: 'Probability density of the normal distribution'
kind: 'formula'
level: 'intermediate'
expression: '\var{f}=\frac{1}{\var{\sigma}\sqrt{2\pi}}e^{-\frac{\left(\var{x}-\var{\mu}\right)^{2}}{2\var{\sigma}^{2}}}'
terms:
  f:
    kind: 'symbol'
    label:
      en: 'Probability density'
  x:
    kind: 'symbol'
    label:
      en: 'Value'
  \mu:
    kind: 'symbol'
    label:
      en: 'Mean'
  \sigma:
    kind: 'symbol'
    label:
      en: 'Standard deviation'
solutions:
  f: 'exp(-(x - mu)^2 / (2 * sigma^2)) / (sigma * sqrt(2 * pi))'
  x:
    - 'mu - sigma * sqrt(-2 * ln(f * sigma * sqrt(2 * pi)))'
    - 'mu + sigma * sqrt(-2 * ln(f * sigma * sqrt(2 * pi)))'
  \mu:
    - 'x + sigma * sqrt(-2 * ln(f * sigma * sqrt(2 * pi)))'
    - 'x - sigma * sqrt(-2 * ln(f * sigma * sqrt(2 * pi)))'
calculator:
  enabled: true
  solveFor: ['f', 'x', '\mu']
categories:
  - 'mathematics'
branches:
  - 'statistics-and-probability'
aliases:
  - 'normal distribution'
  - 'normal probability density function'
  - 'normal pdf'
  - 'Gaussian distribution'
  - 'Gaussian function'
  - 'bell curve'
  - 'distribución normal'
  - 'distribución gaussiana'
