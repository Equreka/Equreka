name:
  en: 'Rate law'
kind: 'equation'
level: 'intermediate'
expression: '\var{v}=\var{k}\left(\frac{\var{c_\mathrm{A}}}{\const{c^{\circ}}}\right)^{\var{m}}\left(\frac{\var{c_\mathrm{B}}}{\const{c^{\circ}}}\right)^{\var{n}}'
terms:
  v:
    kind: 'symbol'
    label:
      en: 'Reaction rate'
    unit: 'mole-per-cubic-metre-second'
  k:
    kind: 'symbol'
    label:
      en: 'Rate constant'
    unit: 'mole-per-cubic-metre-second'
  c_\mathrm{A}:
    kind: 'symbol'
    label:
      en: 'Concentration of A'
    unit: 'mole-per-cubic-metre'
  c_\mathrm{B}:
    kind: 'symbol'
    label:
      en: 'Concentration of B'
    unit: 'mole-per-cubic-metre'
  m:
    kind: 'symbol'
    label:
      en: 'Order with respect to A'
  n:
    kind: 'symbol'
    label:
      en: 'Order with respect to B'
  c^{\circ}:
    kind: 'constant'
    ref: 'standard-amount-concentration'
    identifier: 'c_std'
solutions:
  v: 'k * (c_A / c_std)^m * (c_B / c_std)^n'
  k: 'v / ((c_A / c_std)^m * (c_B / c_std)^n)'
  c_\mathrm{A}: 'c_std * (v / (k * (c_B / c_std)^n))^(1 / m)'
  c_\mathrm{B}: 'c_std * (v / (k * (c_A / c_std)^m))^(1 / n)'
  m: 'ln(v / (k * (c_B / c_std)^n)) / ln(c_A / c_std)'
  n: 'ln(v / (k * (c_A / c_std)^m)) / ln(c_B / c_std)'
calculator:
  enabled: true
externalIds:
  wikidata: 'Q904041'
categories:
  - 'chemistry'
branches:
  - 'chemical-kinetics'
aliases:
  - 'rate equation'
  - 'differential rate law'
  - 'rate = k[A]^m[B]^n'
  - 'order of reaction'
  - 'reaction order'
  - 'method of initial rates'
