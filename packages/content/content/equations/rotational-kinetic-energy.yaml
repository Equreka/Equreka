name:
  en: 'Rotational kinetic energy'
kind: 'formula'
level: 'intermediate'
expression: '\mag{E_\mathrm{rot}}=\frac{1}{2}\mag{I}\mag{\omega}^{2}'
terms:
  E_\mathrm{rot}:
    kind: 'magnitude'
