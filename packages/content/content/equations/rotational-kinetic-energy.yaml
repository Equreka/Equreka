description:
  en: >-
    The rotational kinetic energy of a rigid body turning about a fixed axis is half its moment of
    inertia about that axis times the square of its angular velocity. It is the energy of motion
    stored in spinning wheels, flywheels, turbines and rotors, the rotational counterpart in
    mechanics of half the mass times the squared speed.

    Here $\mag{E_\mathrm{rot}}$ is the rotational kinetic energy in joules, $\mag{I}$ is the moment of
    inertia in kilogram square metres and $\mag{\omega}$ is the angular velocity in radians per
    second. The angular velocity is signed, positive for one sense of turning and negative for the
    other, but it enters squared, so the energy is never negative. Solving for it therefore gives
    two roots of equal size, the positive one listed first, and the sense of rotation has to come
    from the situation.

    Every particle of the body shares the same angular velocity, and one at a given distance from
    the axis moves with a speed equal to that distance times the angular velocity. Adding half of
    each particle's mass times its squared speed collects the masses and squared distances into the
    moment of inertia, which leaves the formula. The energy grows with the square of the spin rate:
    doubling the angular velocity stores four times as much energy.

    The angular velocity must be in radians per second for the result to come out in joules;
    revolutions per minute or degrees per second have to be converted first. A body that both moves
    and spins, such as a rolling wheel or a thrown baton, has a total kinetic energy equal to this
    term, taken about an axis through the centre of mass, plus the translational energy of the
    centre of mass. The formula is non-relativistic, like its linear counterpart.

    Four helicopter blades with a combined moment of inertia of $1067\,\mathrm{kg\,m^{2}}$ turning at
    31.4 radians per second store about $5.26\times10^{5}\,\mathrm{J}$.
