name:
  en: 'Zero-order integrated rate law'
kind: 'equation'
level: 'intermediate'
expression: '\var{c_\mathrm{A}}=\var{c_\mathrm{A,0}}-\var{k}\mag{t}'
terms:
  c_\mathrm{A}:
    kind: 'symbol'
    label:
      en: 'Concentration of A at time t'
    unit: 'mole-per-cubic-metre'
  c_\mathrm{A,0}:
    kind: 'symbol'
    label:
      en: 'Initial concentration of A'
    unit: 'mole-per-cubic-metre'
    identifier: 'c_A0'
  k:
    kind: 'symbol'
    label:
      en: 'Rate constant'
    unit: 'mole-per-cubic-metre-second'
  t:
    kind: 'magnitude'
    ref: 'time'
solutions:
  c_\mathrm{A}: 'c_A0 - k * t'
  c_\mathrm{A,0}: 'c_A + k * t'
  k: '(c_A0 - c_A) / t'
  t: '(c_A0 - c_A) / k'
calculator:
  enabled: true
categories:
  - 'chemistry'
branches:
  - 'chemical-kinetics'
aliases:
  - 'zero order integrated rate law'
  - 'integrated rate law for a zero-order reaction'
  - '[A] = [A]0 - kt'
  - 'zero-order kinetics'
  - 'zero-order reaction'
  - 'pseudo-zero-order'
  - 'ley de tasa integrada de orden cero'
  - 'cinética de orden cero'
references:
  - title: 'OpenStax, Chemistry 2e, 12.4 Integrated Rate Laws, Zero-Order Reactions, Example 12.10 and Table 12.2'
    url: 'https://openstax.org/books/chemistry-2e/pages/12-4-integrated-rate-laws'
  - title: 'IUPAC, Quantities, Units and Symbols in Physical Chemistry, 3rd ed. (Green Book), section 2.12, p. 63, notes 4 and 5'
    url: 'https://iupac.org/wp-content/uploads/2019/05/IUPAC-GB3-2012-2ndPrinting-PDFsearchable.pdf'
description:
  en: >-
    In a zero-order reaction the concentration of the reactant falls in a straight line with time:
    the integrated rate law gives the concentration at any moment as the initial concentration
    minus the rate constant multiplied by the elapsed time. In chemical kinetics it follows from a
    rate law in which the rate does not depend on the reactant concentration at all.

    $\var{c_\mathrm{A}}$ is the concentration of reactant A at time $\mag{t}$ and
    $\var{c_\mathrm{A,0}}$ its initial concentration, both in moles per cubic metre, with moles per
    litre offered. $\var{k}$ is the rate constant, positive and in moles per cubic metre second; for
    this order it is the rate itself. $\mag{t}$ is the time elapsed since the start, in seconds.

    The rate law of zero order sets the rate equal to the constant, so A is used up by the same
    amount in every second, written here for a reaction in which one particle of A reacts each time.
    Adding up those equal losses gives the formula, and a graph of the concentration against time is
    a straight line whose slope is minus the rate constant and whose intercept is the initial
    concentration. The half-life, the initial concentration divided by twice the constant, grows
    with the starting amount.

    Zero-order behaviour appears only under particular conditions: ammonia decomposes with zero-order kinetics on a hot tungsten surface but with first-order kinetics on quartz, so the same reaction can change order with its conditions, and the cautious name pseudo-zero-order is also used. The law cannot hold
    to the end: it predicts negative concentrations after the initial concentration divided by the
    constant, whereas the real rate drops once the reactant runs low. Temperature and volume are
    taken as constant.

    For the ammonia on tungsten, OpenStax estimates a constant of
    $1.3\times10^{-6}$ moles per litre second from a start at 0.0028 moles per litre, which reaches
    0.0001 moles per litre after about 35 minutes.
