name:
  en: 'Drag equation'
kind: 'equation'
level: 'intermediate'
expression: '\var{F_\mathrm{d}}=\frac{1}{2}\var{C_\mathrm{d}}\mag{\rho}\var{A}\mag{v}^{2}'
terms:
  F_\mathrm{d}:
    kind: 'symbol'
    label:
      en: 'Drag force'
    unit: 'newton'
  C_\mathrm{d}:
    kind: 'symbol'
    label:
      en: 'Drag coefficient'
  \rho:
    kind: 'magnitude'
    ref: 'density'
  A:
    kind: 'symbol'
    label:
      en: 'Reference area'
    unit: 'square-metre'
  v:
    kind: 'magnitude'
    ref: 'speed'
solutions:
  F_\mathrm{d}: 'C_d * rho * A * v^2 / 2'
  C_\mathrm{d}: '2 * F_d / (rho * A * v^2)'
  \rho: '2 * F_d / (C_d * A * v^2)'
  A: '2 * F_d / (C_d * rho * v^2)'
  v: 'sqrt(2 * F_d / (C_d * rho * A))'
