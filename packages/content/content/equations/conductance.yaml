name:
  en: 'Conductance as the reciprocal of resistance'
kind: 'formula'
level: 'intro'
expression: '\mag{G}=\frac{1}{\mag{R}}'
terms:
  G:
    kind: 'magnitude'
    ref: 'electrical-conductance'
  R:
    kind: 'magnitude'
    ref: 'electrical-resistance'
solutions:
  G: '1 / R'
  R: '1 / G'
calculator:
  enabled: true
