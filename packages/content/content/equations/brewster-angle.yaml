description:
  en: >-
    Brewster's law gives the angle of incidence at which light reflected from the boundary between
    two transparent media is completely polarized: the tangent of that angle, Brewster's angle or
    the polarizing angle, equals the refractive index of the second medium divided by that of the
    first. In optics it explains why glare from water and glass is polarized and how polarizing
    filters remove it.

    $\mag{\theta_\mathrm{B}}$ is Brewster's angle in radians, measured from the normal to the
    surface, between 0 and 90 degrees. $\var{n_{1}}$ is the refractive index of the medium the light
    arrives through, and $\var{n_{2}}$ that of the medium that reflects it; both are pure numbers,
    at least 1 for ordinary materials. The angle exceeds 45 degrees when light reflects off a
    medium of higher index and falls below it when light inside glass or water meets air.

    At this angle the reflected and the refracted rays are at right angles to each other. The
    component of the light whose electric field lies in the plane of incidence is then not
    reflected at all, so the reflected beam keeps only the component parallel to the surface. Snell's
    law combined with that right angle turns the sine of the refraction angle into the cosine of the
    incidence angle, which gives the tangent form.

    The relation describes transparent media meeting at a smooth boundary. At any other angle
    the reflection is only partly polarized, and the transmitted light is never fully polarized,
    because only a small share of the light is reflected.

    Its name honours David Brewster, the Scottish physicist who found it in the nineteenth
    century. For light in air striking water, with an index of 1.333, Brewster's angle is about 53.1
    degrees.
