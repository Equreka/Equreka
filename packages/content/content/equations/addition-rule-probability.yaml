name:
  en: 'Addition rule'
kind: 'equation'
level: 'intro'
expression: '\var{P(A\cup B)}=\var{P(A)}+\var{P(B)}-\var{P(A\cap B)}'
terms:
  P(A\cup B):
    kind: 'symbol'
    identifier: 'P_AorB'
    label:
      en: 'Probability of A or B'
  P(A):
    kind: 'symbol'
    identifier: 'P_A'
    label:
      en: 'Probability of A'
  P(B):
    kind: 'symbol'
    identifier: 'P_B'
    label:
      en: 'Probability of B'
  P(A\cap B):
    kind: 'symbol'
    identifier: 'P_AandB'
    label:
      en: 'Probability of A and B'
solutions:
  P(A\cup B): 'P_A + P_B - P_AandB'
  P(A): 'P_AorB - P_B + P_AandB'
  P(B): 'P_AorB - P_A + P_AandB'
  P(A\cap B): 'P_A + P_B - P_AorB'
calculator:
  enabled: true
categories:
  - 'mathematics'
branches:
  - 'statistics-and-probability'
aliases:
  - 'addition rule of probability'
  - 'general addition rule'
  - 'sum rule of probability'
  - 'probability of a union'
  - 'or rule'
  - 'regla de la adición de la probabilidad'
