description:
  en: >-
    The standard Gibbs energy change of a redox reaction equals minus the number of electrons
    transferred times the Faraday constant times the standard cell potential. This relation of
    electrochemistry converts a voltage obtained from a table of reduction potentials into a Gibbs
    energy, the thermodynamic measure of whether a reaction runs on its own, and converts a Gibbs
    energy back into the voltage a galvanic cell can supply.

    $\var{\Delta_\mathrm{r} G^{\circ}}$ is the standard Gibbs energy change of the reaction, in
    joules per mole of reaction as written; tables give it in kilojoules per mole. $\var{z}$ is the
    number of electrons in the cell reaction as written, a positive whole number. $\const{F}$ is the
    Faraday constant, the charge of one mole of electrons, about 96 485 coulombs per mole and exact
    in the SI. $\var{E^{\circ}_\mathrm{cell}}$ is the standard cell potential, in volts, the
    cathode's reduction potential minus the anode's. A coulomb times a volt is a joule, so the units
    agree.

    The product of the Faraday constant and the number of electrons is the charge that moves through
    the circuit per mole of reaction, and the potential is the energy per unit charge, so their
    product is the electrical energy the reaction delivers per mole when the cell runs reversibly.
    The minus sign makes a positive potential match a negative Gibbs energy change, a spontaneous
    reaction. Doubling every coefficient doubles the number of electrons and the Gibbs energy
    change, while the potential, which does not depend on the amount reacting, stays the same.

    The standard values refer to solutes at one mole per litre and gases at 1 bar. The same form
    without the standard marks links the Gibbs energy change and the cell potential at any
    composition, provided no current flows and junction potentials are negligible.

    For silver ions oxidizing iron to iron(II), with two electrons and a standard potential of
    +1.247 volts, the relation gives about −240.6 kilojoules per mole.
