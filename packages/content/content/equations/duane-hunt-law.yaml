description:
  en: >-
    The Duane-Hunt law gives the shortest wavelength in the X-ray spectrum of a tube as the Planck
    constant times the speed of light, divided by the elementary charge times the accelerating
    voltage. In modern physics it explains the sharp short-wavelength edge of the continuous
    bremsstrahlung spectrum and offers a way to measure the Planck constant.

    $\var{\lambda_{\min}}$ is the shortest X-ray wavelength, also called the cut-off or limit
    wavelength, in metres. $\mag{V}$ is the accelerating voltage between the cathode and the anode
    of the tube, in volts. The constants are the Planck constant $\const{h}$, the speed of light
    $\const{c}$ and the elementary charge $\const{e}$, exactly $1.602\,176\,634\times10^{-19}$
    coulombs. Both the wavelength and the voltage are positive.

    An electron accelerated through the voltage reaches the anode with a kinetic energy equal to the
    elementary charge times the voltage. As it decelerates in the target it radiates; the most
    energetic photon possible takes all of that energy in a single step, and a photon of that
    energy has the shortest wavelength. Conservation of energy therefore forbids any shorter
    wavelength, whatever the anode material, so doubling the voltage halves the limit.

    The law fixes only the edge of the continuous spectrum; the characteristic lines of the anode
    metal sit on top of it at wavelengths set by the atom. Few electrons give up all their energy
    to one photon, so the intensity near the edge is low, and the measured limit depends on the
    voltage alone only when that voltage is steady.

    In 1915 William Duane and Franklin L. Hunt found that the shortest wavelength a tube emits varies
    as the reciprocal of its accelerating voltage. Teaching laboratories still fit the measured limits
    against the reciprocal voltage to obtain the Planck constant. At 30 kilovolts the shortest
    wavelength is about 41.3 picometres.
