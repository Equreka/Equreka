name:
  en: 'Weight of a body'
kind: 'formula'
level: 'intro'
expression: '\mag{W}=\mag{m}\var{g}'
terms:
  W:
    kind: 'magnitude'
    ref: 'weight'
  m:
    kind: 'magnitude'
    ref: 'mass'
  g:
    kind: 'symbol'
    label:
      en: 'Gravitational acceleration'
    unit: 'metre-per-second-squared'
solutions:
  W: 'm * g'
  m: 'W / g'
  g: 'W / m'
calculator:
