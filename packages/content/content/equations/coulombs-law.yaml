    unit: 'metre'
solutions:
  F: 'k_e * q_1 * q_2 / r^2'
  q_{1}: 'F * r^2 / (k_e * q_2)'
  q_{2}: 'F * r^2 / (k_e * q_1)'
  r: 'sqrt(k_e * q_1 * q_2 / F)'
