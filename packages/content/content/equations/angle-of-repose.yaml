description:
  en: >-
    The angle of repose of a body on an inclined plane is the steepest tilt at which it stays at
    rest without sliding, and its tangent equals the coefficient of static friction between the body
    and the surface. It gives the standard tilting-plane method for measuring a static coefficient: raise the plane slowly and note the angle at which sliding
    begins.

    In the relation, $\mag{\theta}$ is the angle of repose between the plane and the horizontal, in
    radians, and $\var{\mu}$ is the coefficient of static friction, a non-negative dimensionless number with
    no unit. The angle lies between zero and a right angle; a larger coefficient means a steeper
    angle, and a coefficient of one corresponds to 45 degrees. A coefficient above one, possible for
    very grippy surfaces, gives an angle beyond 45 degrees.

    On the plane, the weight of the body splits into a component down the slope, the weight times
    the sine of the angle, and a component into the surface, the weight times the cosine, which the
    normal force balances. Static friction holds the body until the down-slope component exceeds its
    maximum, the coefficient times the normal force. At the threshold the two are equal, and
    dividing one by the other leaves the tangent of the angle equal to the coefficient: the mass
    cancels, so a heavy block and a light one with the same surfaces start sliding together.

    The relation assumes dry friction obeying the proportional friction law, a rigid body that
    slides rather than tips over, and a plane tilted slowly enough that no impact starts the motion.
    The kinetic coefficient follows in the same way from the gentler angle at which a body, once
    nudged, slides down at constant speed; since the static coefficient is the larger, sliding needs
    a steeper plane to begin than to continue. For piles of sand, gravel or grain, the same name
    denotes the steepest slope at which the heap stands without slumping.

    With a static coefficient of 0.5, typical of wood on wood, a block starts to slide at about 26.6
    degrees.
