description:
  en: >-
    The amount of substance in a sample of a pure substance equals the mass of the sample divided
    by the molar mass of the substance. This conversion from grams to moles is the first step of
    almost every stoichiometry calculation in chemistry, because a balance measures mass while
    chemical equations count particles in moles.

    $\mag{n}$ is the amount of substance, in moles. $\mag{m}$ is the mass of the sample, in
    kilograms in the SI, though chemists usually weigh in grams. $\mag{M}$ is the molar mass, the
    mass of one mole of the substance, in kilograms per mole; tables list it in grams per mole, and
    one gram per mole is one thousandth of a kilogram per mole. All three quantities are positive,
    and mass and molar mass must be stated with the same mass unit.

    The molar mass of a compound is the sum of the molar masses of the atoms in its formula, and its
    value in grams per mole is numerically the same as the mass of one formula unit in daltons. A
    large molar mass therefore means few moles in a given mass: ten grams of a heavy compound
    contain fewer molecules than ten grams of water.

    The formula holds for any pure substance, solid, liquid or gas, whose formula is known; the
    entity counted (atoms, molecules, formula units, ions) must be stated, since one mole of oxygen
    molecules contains two moles of oxygen atoms. A mixture needs its composition first.

    The 14th CGPM made the mole an SI base unit in 1971, defining it through 0.012 kilogram of
    carbon-12; the 2018 revision instead fixed the Avogadro constant, effective 20 May 2019. As an
    example, 4.7 grams of potassium, at 39.10 grams per mole, is 0.12 mole.
