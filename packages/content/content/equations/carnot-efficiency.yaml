description:
  en: >-
    The Carnot efficiency is the highest efficiency that any heat engine can reach while working
    between a hot and a cold reservoir: one minus the ratio of the absolute temperature of the cold
    reservoir to that of the hot one. In thermodynamics it is the upper limit for steam turbines,
    car engines and power stations, and it shows that the two temperatures alone, not the working
    substance, set that limit.

    $\var{\eta}$ is the Carnot efficiency, a dimensionless ratio between 0 and 1, often quoted as a
    percentage. $\var{T_\mathrm{h}}$ is the temperature of the hot reservoir and
    $\var{T_\mathrm{c}}$ that of the cold reservoir, both thermodynamic temperatures in kelvin, the
    hot one the higher. Like the gas laws, the formula needs absolute temperatures; temperatures in
    degrees Celsius give a wrong result, so 20 degrees Celsius enters as 293.15 kelvin.

    A Carnot engine runs a reversible cycle of two isothermal and two adiabatic steps. For this
    cycle the heat rejected divided by the heat absorbed equals the cold temperature divided by the
    hot one, which gives the formula. No engine working between the same two reservoirs can beat a
    reversible one, so the result is a ceiling for every engine. The efficiency rises as the hot
    reservoir gets hotter or the cold one colder, and it would reach 1 only with a cold reservoir at
    absolute zero.

    Real engines fall well short of the limit because of friction, heat leaking across finite
    temperature differences and other irreversible steps. The formula is a bound, not a prediction:
    a claimed engine that beats it would violate the second law of thermodynamics. Run in reverse,
    the same reservoir temperatures bound the performance of refrigerators and heat pumps.

    Sadi Carnot described the ideal cycle in 1824 in Réflexions sur la puissance motrice du feu, the
    only work he published in his lifetime. An engine with a cold reservoir at 300 kelvin needs a
    hot reservoir at 750 kelvin to reach a Carnot efficiency of 0.60.
