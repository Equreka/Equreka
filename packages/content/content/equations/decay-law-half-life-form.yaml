name:
  en: 'Radioactive decay law in terms of half-life'
kind: 'equation'
level: 'intro'
expression: '\var{N}=\var{N_{0}}\left(\frac{1}{2}\right)^{\mag{t}/\var{t_{1/2}}}'
terms:
  N:
    kind: 'symbol'
    label:
      en: 'Number of undecayed nuclei'
  N_{0}:
    kind: 'symbol'
    label:
      en: 'Initial number of nuclei'
  t:
    kind: 'magnitude'
    ref: 'time'
  t_{1/2}:
    kind: 'symbol'
    label:
      en: 'Half-life'
    unit: 'second'
solutions:
  N: 'N_0 * 2^(-t / t_12)'
  N_{0}: 'N * 2^(t / t_12)'
  t: 't_12 * log2(N_0 / N)'
  t_{1/2}: 't / log2(N_0 / N)'
calculator:
  enabled: true
categories:
