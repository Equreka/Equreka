name:
  en: 'Maximum speed in simple harmonic motion'
kind: 'formula'
level: 'intermediate'
expression: '\mag{v_{\max}}=\var{A}\mag{\omega}'
terms:
  v_{\max}:
    kind: 'magnitude'
    ref: 'speed'
  A:
    kind: 'symbol'
    label:
      en: 'Amplitude'
    unit: 'metre'
  \omega:
    kind: 'magnitude'
    ref: 'angular-frequency'
