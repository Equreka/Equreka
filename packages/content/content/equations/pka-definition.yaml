description:
  en: >-
    The definition of pKa expresses the strength of an acid on a logarithmic scale: the pKa is minus
    the base-ten logarithm of the acid dissociation constant. Chemists use it in acid-base chemistry,
    biochemistry and analytical chemistry because the constants of common acids span many powers of
    ten, while their pKa values fit in a short range of ordinary numbers.

    $\var{\mathrm{p}K_\mathrm{a}}$ is the pKa of the acid, a pure number, and
    $\var{K_\mathrm{a}}$ the acid dissociation constant, a positive pure number defined with every
    concentration taken relative to one mole per litre. The letter p is an operator meaning minus
    the base-ten logarithm, the same one that turns the hydrogen ion concentration into the pH, and
    IUPAC prints it upright.

    The minus sign reverses the order: a smaller pKa means a larger constant and a stronger acid,
    and each unit of pKa is a factor of ten in the constant. The pKa is also the pH at which the acid and
    its conjugate base are present in equal amounts, which is why it sets the working range of a
    buffer.

    Like the constant itself, the pKa depends on temperature and on the solvent, and tabulated
    values refer to dilute aqueous solutions, where concentrations stand in for activities. The
    same operator gives the pKb of a base and the pKw of water.

    Acetic acid, with an acid dissociation constant of $1.8\times10^{-5}$, has a pKa of 4.74.
