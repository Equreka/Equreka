# yaml-language-server: $schema=../../dist/schemas/equations.locale.schema.json
name: 'Equivalencia entre masa y energía'
description: >-
  La equivalencia entre masa y energía establece que un cuerpo en reposo tiene una energía igual al producto de su masa por la velocidad de la luz en el vacío elevada al cuadrado. Escrita como E igual a
  m por c al cuadrado, es un resultado de la relatividad especial: masa y energía son dos medidas de
  la misma propiedad, de modo que un cuerpo que gana o pierde energía gana o pierde masa con ella.

  En la ecuación, $\mag{E}$ es la energía en reposo del cuerpo, en julios, y $\mag{m}$ es su masa,
  en kilogramos. La constante $\const{c}$ es la velocidad de la luz en el vacío, exactamente
  299 792 458 metros por segundo. La masa y la energía en reposo nunca son negativas. Esa velocidad elevada al cuadrado se acerca a 90 000 billones de metros cuadrados por segundo al cuadrado, de
  modo que una masa muy pequeña corresponde a una energía muy grande.

  La energía almacenada en un cuerpo se suma a su masa, y la energía que libera un cuerpo le resta
  parte de ella. En una reacción nuclear los productos tienen una masa apreciablemente menor que los
  reactivos, y la masa que falta reaparece como energía cinética de los fragmentos y como radiación;
  por eso la fisión y la fusión liberan mucha más energía por kilogramo de combustible que la
  combustión. Una reacción química también cambia la masa, pero en una cantidad demasiado pequeña
  para pesarla.

  La ecuación da solo la energía en reposo. Un cuerpo en movimiento tiene una energía total mayor,
  la energía en reposo multiplicada por el factor de Lorentz, y la diferencia es su energía
  cinética, que a velocidades bajas se reduce a la clásica mitad de la masa por la rapidez al
  cuadrado. La masa de la ecuación es la masa medida en reposo, la misma para todo observador.

  Albert Einstein dedujo la relación en 1905, en un breve artículo de Annalen der Physik que se
  preguntaba si la inercia de un cuerpo depende de su contenido de energía. Un solo gramo de
  materia tiene una energía en reposo de unos $8.99\times10^{13}\,\mathrm{J}$.
