description:
  en: >-
    The heat capacity of a body is the heat it absorbs divided by the rise in temperature that the
    heat produces. This definition, used throughout thermodynamics and calorimetry, measures how
    much energy a whole object, such as a saucepan, a calorimeter or a tank of water, needs for each
    kelvin of warming, so that one measured value gives the heat for any temperature change.

    $\mag{C}$ is the heat capacity, in joules per kelvin. $\mag{Q}$ is the heat transferred to the
    body, in joules, positive when the body takes heat in and negative when it gives heat off.
    $\var{\Delta T}$ is the final temperature minus the initial one, in kelvin. A kelvin and a
    degree Celsius are steps of the same size, so a heat capacity per degree Celsius has the same
    value. For ordinary matter the heat and the temperature change share their sign, and the heat
    capacity comes out positive.

    Heat capacity is an extensive property: it grows with the amount of material, so a large iron
    pan has several times the heat capacity of a small one made of the same metal. Dividing it by
    the mass gives the specific heat capacity, a property of the material alone, and for a body made
    of one material the heat capacity equals its mass times that specific heat capacity. Once the
    heat capacity of a calorimeter has been measured, its own share of the heat can be accounted for
    in later experiments.

    The ratio treats the heat capacity as constant over the temperature interval; when it varies
    with temperature, the formula yields an average over the interval. No change of phase may occur,
    since heat absorbed during melting or boiling produces no temperature change at all and the
    ratio would lose its meaning. For gases the value also depends on the conditions under which the
    gas is heated.

    An iron pan of 808 grams that absorbs 18.14 kilojoules while warming by 50.0 degrees Celsius has
    a heat capacity of about 363 joules per kelvin.
