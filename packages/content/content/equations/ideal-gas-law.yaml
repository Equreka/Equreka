description:
  en: >-
    The ideal gas law, also called the ideal gas equation of state, states that the pressure of a
    gas times its volume equals its amount of substance times the molar gas constant times its
    absolute temperature. It is the central relation of the gas laws in chemistry and
    thermodynamics: it ties together the four quantities that describe a sample of gas, so that any
    one of them follows from the other three.

    $\mag{p}$ is the absolute pressure, in pascals, never the gauge pressure a tyre gauge reads.
    $\mag{V}$ is the volume of the gas, in cubic metres. $\mag{n}$ is the amount of substance, in
    moles. $\const{R}$ is the molar gas constant, about 8.314 joules per mole kelvin and exact in
    the SI. $\mag{T}$ is the thermodynamic temperature in kelvin. The gas laws need absolute
    temperature: a Celsius reading must first be converted by adding 273.15. All four quantities are
    positive.

    The law gathers the empirical gas laws into one statement. At fixed amount and temperature the
    pressure varies inversely with the volume (Boyle's law); at fixed pressure the volume is
    proportional to the absolute temperature (Charles's law); at fixed volume the pressure is
    proportional to the absolute temperature (Gay-Lussac's law); and at fixed pressure and
    temperature the volume is proportional to the amount of gas (Avogadro's law). A mole of any
    ideal gas thus fills the same volume under the same conditions, about 22.4 litres at 0 degrees
    Celsius and one atmosphere.

    Real gases obey the law closely at low density, that is at low pressure and high temperature,
    far from the conditions under which they condense into liquids. At high pressure the size of the
    molecules and the attraction between them matter, and corrected equations of state, such as that
    of van der Waals, take over.

    Robert Boyle (1627–1691) found the pressure–volume law, Amontons established the
    pressure–temperature law around 1700, and Avogadro put forward his hypothesis on equal volumes
    of gases in 1811. By the law, 655 grams of methane at 25 degrees Celsius and 745 torr occupy
    about 1020 litres.
