description:
  en: >-
    The de Broglie wavelength is the wavelength of the wave associated with a moving particle: the
    Planck constant divided by the product of the particle's mass and speed. The relation, also
    called the de Broglie equation, states that electrons, neutrons, atoms and every other piece of
    matter show wave behaviour, and it is a founding idea of quantum and modern physics.

    Here $\mag{\lambda}$ is the de Broglie wavelength, in metres; $\mag{m}$ is the mass of the
    particle, in kilograms; and $\mag{v}$ is its speed, in metres per second. The constant
    $\const{h}$ is the Planck constant, exactly $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$. All
    three variables are positive: a particle at rest has no defined de Broglie wavelength.

    The general rule is that the wavelength equals the Planck constant over the momentum, the same
    link between momentum and wavelength that holds for a photon. For a slow particle the momentum is
    mass times speed, which gives the form used here. Because the Planck constant is so small, only
    light particles moving slowly have wavelengths comparable to the spacing of atoms; for everyday
    objects the wavelength is far too short to detect.

    Writing the momentum as mass times speed assumes that the speed is much smaller than the speed of
    light. For fast particles, such as electrons accelerated to a sizeable fraction of the speed of
    light, the momentum must include the relativistic factor, and the wavelength is then the Planck
    constant over that relativistic momentum.

    Louis de Broglie put forward the hypothesis of matter waves in 1924, in work published in the
    Annales de Physique in 1925. In 1927 Davisson and Germer observed electrons
    diffracted by a nickel crystal, at the angles the hypothesis predicted, and de Broglie received
    the 1929 Nobel Prize for discovering the wave nature of electrons. A basketball of mass 0.65
    kilograms thrown at 10 metres per second has a wavelength of only about
    $1.02\times10^{-34}\,\mathrm{m}$.
