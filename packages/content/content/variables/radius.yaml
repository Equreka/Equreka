name:
  en: 'Radius'
symbol:
  tex: 'r'
defaultUnit: 'metre'
categories:
  - 'mathematics'
branches:
  - 'geometry'
description:
  en: >-
    In classical geometry, a radius of a circle or sphere is any of the line segments from its
    center to its perimeter, and in more modern usage, it is also their length. The name comes from
    the Latin radius, meaning ray but also the spoke of a chariot wheel. The plural of radius can be
    either radii (from the Latin plural) or the conventional English plural radiuses. The typical
    abbreviation and mathematical variable name for radius is r.
textSources:
  - title: 'Wikipedia: Radius'
    url: 'https://en.wikipedia.org/wiki/Radius'
