description:
  en: >-
    The radius of a circle or a sphere is the distance from its centre to any point on its boundary:
    the curve of the circle or the surface of the sphere. The word also names any straight segment
    joining the centre to the boundary, and all such segments have the same length. The radius is
    half the diameter, the distance across the figure through its centre.

    The usual symbol is $r$, with a capital $R$ when two radii must be told apart, such as the outer and inner radii of a ring. A
    radius is a length, so its SI unit is the metre, and in practice it is often quoted in
    centimetres, millimetres or kilometres. It is never negative, and the SI Brochure lists $r$
    among the typical symbols for the base quantity length.

    A single radius fixes a circle or a sphere completely, so most of their measures follow from it.
    The circumference of a circle is $2\pi$ times the radius, and its area is pi times the square of
    the radius; the surface area and volume of a sphere grow with the second and third powers of the
    radius. Beyond pure geometry, the radius appears in circular motion, in orbits, in the field of a
    point charge or mass at a given distance, and in quantities such as the radius of curvature of a
    lens or a road.
