# yaml-language-server: $schema=../../dist/schemas/variables.locale.schema.json
name: 'Radio'
description: >-
  El radio de una circunferencia o de una esfera es la distancia desde su centro hasta cualquier
  punto de su borde: la curva de la circunferencia o la superficie de la esfera. La palabra designa
  también cualquier segmento recto que une el centro con el borde, y todos esos segmentos tienen la
  misma longitud. El radio es la mitad del diámetro, la distancia de lado a lado a través del centro.

  El símbolo habitual es $r$, con una $R$ mayúscula cuando hay que distinguir dos radios, como el exterior y el
  interior de un anillo. Un radio es una longitud, de modo que su unidad SI es el metro, y en la práctica se da a
  menudo en centímetros, milímetros o kilómetros. Nunca es negativo, y el folleto del SI incluye $r$
  entre los símbolos habituales de la magnitud básica longitud.

  Un solo radio determina por completo una circunferencia o una esfera, así que la mayoría de sus
  medidas se deducen de él. La longitud de la circunferencia es $2\pi$ veces el radio y el área del
  círculo es pi por el cuadrado del radio; el área y el volumen de una esfera crecen con la segunda y
  la tercera potencia del radio. Fuera de la geometría pura, el radio aparece en el movimiento
  circular, en las órbitas, en el campo de una carga o una masa puntual a una distancia dada y en
  magnitudes como el radio de curvatura de una lente o de una carretera.
