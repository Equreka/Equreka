# yaml-language-server: $schema=../../dist/schemas/paths.schema.json
name:
  en: 'The seven SI base units'
level: 'intro'
estimatedMinutes: '15'
categories:
  - 'physics'
branches:
  - 'mechanics'
  - 'thermodynamics'
  - 'electromagnetism'
  - 'optics-and-photometry'
aliases:
  - 'SI base units'
  - 'base units'
  - 'unidades base'
  - 'sistema internacional'
description:
  en: >-
    Meet the seven base units of the International System, learn which defining constant fixes
    each one since 2019, and see why the kilogram is the odd one out.
steps:
  - id: 'intro'
    kind: 'prose'
    body:
      en: >-
        The International System of Units (SI) builds every unit from seven base units: the second,
        metre, kilogram, ampere, kelvin, mole and candela. Since 20 May 2019 none of them is defined
        by an object or a material property. Each is fixed by assigning an exact numerical value to
        one of seven defining constants of nature, so a laboratory anywhere can realize the unit from
        first principles.
  - id: 'second'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'second'
    note:
      en: >-
        The second comes first because the metre and the kilogram are defined through it. It is
        fixed by the caesium-133 hyperfine transition frequency $\Delta\nu_{\mathrm{Cs}}$, set at
        exactly $9\,192\,631\,770\,\mathrm{Hz}$.
  - id: 'metre'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'metre'
    note:
      en: >-
        Fixed by the speed of light $c$, exactly $299\,792\,458\,\mathrm{m/s}$: one metre is the
        distance light travels in vacuum in $1/299\,792\,458$ of a second.
  - id: 'kilogram'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'kilogram'
    note:
      en: >-
        Fixed by the Planck constant $h$, exactly $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$.
        Because $\mathrm{J\,s} = \mathrm{kg\,m^{2}\,s^{-1}}$, the kilogram follows once the metre
        and the second are known.
  - id: 'kilogram-anomaly'
    kind: 'prose'
    body:
      en: >-
        The kilogram is the anomaly of the set. It is the only base unit whose name already carries
        an SI prefix, a leftover from the metric system's original base unit, the gram. Prefixes
        therefore attach to the gram, never to the kilogram: a thousandth of a kilogram is a gram
        ($\mathrm{g}$), a millionth is a milligram ($\mathrm{mg}$), and $\mu\mathrm{kg}$ is never
        written. It was also the last base unit defined by an artefact: from 1889 until 2019 the
        kilogram was the mass of the international prototype, a platinum-iridium artefact kept at
        the BIPM. At the third periodic verification, from 1989 to 1991, the national copies
        differed from it by a median of about 25 micrograms. Fixing $h$ removed that dependence on a
        single object.
  - id: 'check-prefix'
    kind: 'check'
    prompt:
      en: >-
        A thousandth of a gram is written $\mathrm{mg}$. Why is a millionth of a kilogram not
        written $\mu\mathrm{kg}$?
    answer:
      en: >-
        SI prefixes never stack. The kilogram already contains the prefix kilo, so further prefixes
        attach to the gram: a millionth of a kilogram is a thousandth of a gram, one milligram.
  - id: 'ampere'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'ampere'
    note:
      en: >-
        Fixed by the elementary charge $e$, exactly $1.602\,176\,634\times10^{-19}\,\mathrm{C}$,
        with $\mathrm{C} = \mathrm{A\,s}$: one ampere carries about $6.24\times10^{18}$ elementary
        charges per second.
  - id: 'kelvin'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'kelvin'
    note:
      en: >-
        Fixed by the Boltzmann constant $k$, exactly $1.380\,649\times10^{-23}\,\mathrm{J/K}$, which
        links temperature to energy per particle. The triple point of water, once exactly
        $273.16\,\mathrm{K}$ by definition, is now a measured value.
  - id: 'mole'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'mole'
    note:
      en: >-
        Fixed by the Avogadro constant $N_{\mathrm{A}}$, exactly
        $6.022\,140\,76\times10^{23}\,\mathrm{mol^{-1}}$. The mole is a pure count of entities, so
        it is the only base unit that depends on no other.
  - id: 'candela'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'candela'
    note:
      en: >-
        Fixed by the luminous efficacy of monochromatic radiation at $540\,\mathrm{THz}$,
        $K_{\mathrm{cd}}$, exactly $683\,\mathrm{lm/W}$. It is the one base unit tied to human
        perception: the weighting follows the sensitivity of the eye.
  - id: 'closing'
    kind: 'prose'
    body:
      en: >-
        Notice the order of dependence. The second stands alone; the metre needs the second; the
        kilogram needs both; the ampere, kelvin and candela need the second through their constants'
        units. Every other SI unit, from the joule to the pascal, is a product of powers of these
        seven.
  - id: 'check-dependence'
    kind: 'check'
    prompt:
      en: >-
        Which of the seven base unit definitions do not depend on the second?
    answer:
      en: >-
        Only the mole. The metre uses $c$ in $\mathrm{m/s}$; the kilogram uses $h$ in
        $\mathrm{kg\,m^{2}\,s^{-1}}$; the ampere uses $e$ in $\mathrm{A\,s}$; the kelvin uses $k$ in
        $\mathrm{J/K}$ and the joule contains $\mathrm{s^{-2}}$; the candela uses $\mathrm{W}$ and
        $\mathrm{Hz}$. The Avogadro constant is a count per mole with no time in it.
references:
  - title: 'BIPM, The International System of Units, 9th ed., section 2.3.1 (base units) and Table 1 (defining constants)'
    url: 'https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf'
  - title: 'BIPM, The International System of Units, 9th ed., Appendix 1, 26th CGPM (2018), Resolution 1 (in force 20 May 2019)'
    url: 'https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf'
  - title: 'BIPM, The International System of Units, 9th ed., Appendix 4, Part 3: unit of mass, kilogram (third verification, 1989 to 1991)'
    url: 'https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf'
