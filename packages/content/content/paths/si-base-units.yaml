# yaml-language-server: $schema=../../dist/schemas/paths.schema.json
name:
  en: 'The seven SI base units'
level: 'intro'
estimatedMinutes: '15'
categories:
  - 'physics'
aliases:
  - 'SI base units'
  - 'base units'
  - 'unidades base'
  - 'sistema internacional'
description:
  en: >-
    Meet the seven base units of the International System, learn which defining constant fixes
    each one since 2019, and see why the kilogram is the odd one out.
steps:
  - id: 'intro'
    kind: 'prose'
    body:
      en: >-
        The International System of Units (SI) builds every unit from seven base units: the second,
        metre, kilogram, ampere, kelvin, mole and candela. Since 20 May 2019 none of them is defined
        by an object or a material property. Each is fixed by assigning an exact numerical value to
        one of seven defining constants of nature, so a laboratory anywhere can realize the unit from
        first principles.
  - id: 'second'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'second'
    note:
      en: >-
        The second comes first because the metre and the kilogram are defined through it. It is
        fixed by the caesium-133 hyperfine transition frequency
        $\Delta\nu_{\text{Cs}} = 9\,192\,631\,770\ \text{Hz}$.
  - id: 'metre'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'metre'
    note:
      en: >-
        Fixed by the speed of light, $c = 299\,792\,458\ \text{m/s}$: one metre is the distance light
        travels in vacuum in $\frac{1}{299\,792\,458}$ of a second.
  - id: 'kilogram'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'kilogram'
    note:
      en: >-
        Fixed by the Planck constant, $h = 6.626\,070\,15 \times 10^{-34}\ \text{J s}$. Because
        $\text{J s} = \text{kg}\,\text{m}^{2}\,\text{s}^{-1}$, the kilogram follows once the metre
        and the second are known.
  - id: 'kilogram-anomaly'
    kind: 'prose'
    body:
      en: >-
        The kilogram is the anomaly of the set. It is the only base unit whose name already carries
        an SI prefix, a leftover from the metric system's original base unit, the gram. Prefixes
        therefore attach to the gram, never to the kilogram: a thousandth of a kilogram is a gram
        ($\text{g}$), a millionth is a milligram ($\text{mg}$), and $\mu\text{kg}$ is never written.
        It was also the last base unit defined by an artefact: until 2019 the kilogram was the mass
        of the International Prototype, a platinum-iridium cylinder kept near Paris, whose mass
        drifted by roughly $50\ \mu\text{g}$ relative to its official copies over a century. Fixing
        $h$ removed that dependence on a single object.
  - id: 'check-prefix'
    kind: 'check'
    prompt:
      en: >-
        A thousandth of a gram is written $\text{mg}$. Why is a millionth of a kilogram not written
        $\mu\text{kg}$?
    answer:
      en: >-
        SI prefixes never stack. The kilogram already contains the prefix kilo, so further prefixes
        attach to the gram: a millionth of a kilogram is a thousandth of a gram, one milligram.
  - id: 'ampere'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'ampere'
    note:
      en: >-
        Fixed by the elementary charge, $e = 1.602\,176\,634 \times 10^{-19}\ \text{C}$, with
        $\text{C} = \text{A s}$: one ampere carries about $6.24 \times 10^{18}$ elementary charges
        per second.
  - id: 'kelvin'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'kelvin'
    note:
      en: >-
        Fixed by the Boltzmann constant, $k = 1.380\,649 \times 10^{-23}\ \text{J/K}$, which links
        temperature to energy per particle. The triple point of water, once exactly $273.16\ \text{K}$
        by definition, is now a measured value.
  - id: 'mole'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'mole'
    note:
      en: >-
        Fixed by the Avogadro constant, $N_{\text{A}} = 6.022\,140\,76 \times 10^{23}\ \text{mol}^{-1}$.
        The mole is a pure count of entities, so it is the only base unit that depends on no other.
  - id: 'candela'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'candela'
    note:
      en: >-
        Fixed by the luminous efficacy of monochromatic radiation at $540\ \text{THz}$,
        $K_{\text{cd}} = 683\ \text{lm/W}$. It is the one base unit tied to human perception: the
        weighting follows the sensitivity of the eye.
  - id: 'closing'
    kind: 'prose'
    body:
      en: >-
        Notice the order of dependence. The second stands alone; the metre needs the second; the
        kilogram needs both; the ampere, kelvin and candela need the second through their constants'
        units. Every other unit in this wiki, from the joule to the pascal, is a product of powers of
        these seven, which is exactly how the build verifies each derived unit's dimension.
  - id: 'check-dependence'
    kind: 'check'
    prompt:
      en: >-
        Which of the seven base unit definitions do not depend on the second?
    answer:
      en: >-
        Only the mole. The metre uses $c$ in $\text{m/s}$; the kilogram uses $h$ in
        $\text{kg m}^{2}\text{ s}^{-1}$; the ampere uses $e$ in $\text{A s}$; the kelvin uses $k$ in
        $\text{J/K}$ and the joule contains $\text{s}^{-2}$; the candela uses $\text{W}$ and
        $\text{Hz}$. The Avogadro constant is a count per mole with no time in it.
references:
  - title: 'The International System of Units (SI), 9th edition'
    url: 'https://www.bipm.org/en/publications/si-brochure'
