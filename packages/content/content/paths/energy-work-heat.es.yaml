# yaml-language-server: $schema=../../dist/schemas/paths.locale.schema.json
name: 'Energía, trabajo y calor'
description: >-
  Tres magnitudes, una dimensión: por qué energía, trabajo y calor usan el julio sin ser lo mismo,
  cómo la potencia mide el ritmo de transferencia y qué afirma la equivalencia entre masa y energía.
steps:
  intro:
    body: >-
      La energía es la magnitud conservada de la física: cambia de forma pero nunca se crea ni se
      destruye. El trabajo y el calor son las dos maneras en que la energía cruza la frontera de un
      sistema, una mediante una fuerza que actúa a lo largo de un desplazamiento y la otra mediante
      una diferencia de temperatura. El primer principio de la termodinámica las relaciona: el
      cambio en la energía interna de un sistema es igual al calor suministrado menos el trabajo que
      realiza, $\Delta U = Q - W$. Las tres comparten la dimensión
      $\mathsf{L}^{2}\mathsf{M}\mathsf{T}^{-2}$ y la unidad julio.
  energy:
    note: >-
      Una magnitud de estado: un sistema tiene una energía definida en cada instante, ya sea
      cinética, potencial, térmica o química.
  joule:
    note: >-
      Un julio es el trabajo que realiza una fuerza de un newton a lo largo de un metro:
      $\mathrm{J} = \mathrm{N\,m} = \mathrm{kg\,m^{2}\,s^{-2}}$. El julio se escribe como esa
      composición de unidades básicas, de modo que su dimensión se verifica en lugar de teclearse.
  work:
    note: >-
      Una magnitud de proceso: $W = F\,d\cos\theta$ para una fuerza constante $F$ a lo largo de un
      desplazamiento $d$ con ángulo $\theta$. El trabajo se realiza sobre un sistema o por él; un
      sistema no contiene trabajo.
  heat:
    note: >-
      También una magnitud de proceso: energía en tránsito debida a una diferencia de temperatura.
      Una vez dentro del sistema es energía interna, ya no calor.
  check-same-unit:
    prompt: >-
      Energía, trabajo y calor se miden en julios. ¿Eso los convierte en la misma magnitud?
    answer: >-
      No. Tener la misma dimensión es necesario para que dos magnitudes sean de la misma clase,
      pero no suficiente. La energía es un estado del sistema; el trabajo y el calor son
      transferencias a través de su frontera. El momento de una fuerza también es
      $\mathrm{kg\,m^{2}\,s^{-2}}$, escrito $\mathrm{N\,m}$, y no es una energía. El convertidor
      solo comprueba dimensiones, así que pasa un julio de calor a un julio de trabajo; si esa
      transferencia es posible lo decide el segundo principio.
  power-intro:
    body: >-
      La potencia es el ritmo al que la energía se transfiere o se convierte: $P = \frac{dE}{dt}$.
      Su unidad, el vatio, es un julio por segundo, y en unidades básicas
      $\mathrm{W} = \mathrm{kg\,m^{2}\,s^{-3}}$. Los recibos de electricidad invierten la relación:
      un kilovatio hora es potencia por tiempo, una energía de
      $1\,\mathrm{kW} \times 3600\,\mathrm{s} = 3.6\,\mathrm{MJ}$.
  watt:
    note: >-
      Aquí se escribe como $\mathrm{J\,s^{-1}}$, de modo que la compilación deriva su dimensión de
      la del julio.
  check-lamp:
    prompt: >-
      Una lámpara de $60\,\mathrm{W}$ funciona durante una hora. ¿Cuánta energía convierte, en
      julios y en kilovatios hora?
    answer: >-
      $60\,\mathrm{W} \times 3600\,\mathrm{s} = 216\,000\,\mathrm{J} = 216\,\mathrm{kJ}$, es
      decir, $0.06\,\mathrm{kWh}$.
  mass-energy-intro:
    body: >-
      En 1905 Einstein mostró que la masa misma es una forma de energía. Un cuerpo de masa $m$ en
      reposo tiene energía $E = m c^{2}$, donde $c$ es la velocidad de la luz en el vacío. El factor
      $c^{2}$ es de unos $9\times10^{16}\,\mathrm{m^{2}\,s^{-2}}$, y por eso una masa diminuta
      corresponde a una energía enorme y las reacciones nucleares liberan mucho más que las
      químicas.
  speed-of-light:
    note: >-
      Exacta por definición desde 1983: fijar $c$ es lo que define al metro, así que la
      incertidumbre pasó de la constante a la realización de la unidad.
  mass-energy:
    note: >-
      Comprueba las dimensiones:
      $\mathrm{kg} \times (\mathrm{m/s})^{2} = \mathrm{kg\,m^{2}\,s^{-2}} = \mathrm{J}$. La
      compilación realiza esta comprobación en cada solución escrita.
  try-calculator:
    body: >-
      Abre la calculadora de la equivalencia entre masa y energía desde la página de la ecuación.
      Escribe $m = 0.001$ (un gramo, en kilogramos) y deja $E$ vacío. El motor devuelve alrededor
      de $8.988\times10^{13}\,\mathrm{J}$, unos $25\,\mathrm{GWh}$ o 25 millones de kilovatios
      hora, encerrados en un solo gramo de materia.
  check-exact:
    prompt: >-
      ¿Por qué la velocidad de la luz aparece como exacta cuando la mayoría de las constantes
      físicas tienen incertidumbre?
    answer: >-
      Porque el metro se define fijando $c$ en exactamente $299\,792\,458\,\mathrm{m/s}$. Una
      constante definitoria no tiene incertidumbre por construcción; la incertidumbre experimental
      ahora está en la precisión con que un laboratorio puede realizar el metro, no en $c$.
