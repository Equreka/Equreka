# yaml-language-server: $schema=../../dist/schemas/paths.schema.json
name:
  en: 'Energy, work and heat'
level: 'intermediate'
prerequisites:
  - 'si-base-units'
estimatedMinutes: '20'
categories:
  - 'physics'
branches:
  - 'mechanics'
  - 'thermodynamics'
  - 'modern-physics'
aliases:
  - 'E=mc2'
  - 'energy'
  - 'joule and watt'
  - 'energia'
description:
  en: >-
    Three quantities, one dimension: why energy, work and heat all use the joule yet are not the
    same thing, how power measures the rate of transfer, and what mass-energy equivalence says.
steps:
  - id: 'intro'
    kind: 'prose'
    body:
      en: >-
        Energy is the conserved quantity of physics: it changes form but is never created or
        destroyed. Work and heat are the two ways energy crosses the boundary of a system, one
        through a force acting along a displacement, the other through a temperature difference.
        The first law of thermodynamics ties them together: the change in a system's internal energy
        equals the heat supplied minus the work it does, $\Delta U = Q - W$. All three share the
        dimension $\mathsf{L}^{2}\mathsf{M}\mathsf{T}^{-2}$ and the unit joule.
  - id: 'energy'
    kind: 'entry'
    ref:
      collection: 'magnitudes'
      slug: 'energy'
    note:
      en: >-
        A state quantity: a system has a definite energy at each instant, whether kinetic, potential,
        thermal or chemical.
  - id: 'joule'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'joule'
    note:
      en: >-
        One joule is the work done by a force of one newton over one metre:
        $\mathrm{J} = \mathrm{N\,m} = \mathrm{kg\,m^{2}\,s^{-2}}$. The joule is authored as that
        composition of base units, so its dimension is verified rather than typed.
  - id: 'work'
    kind: 'entry'
    ref:
      collection: 'magnitudes'
      slug: 'work'
    note:
      en: >-
        A process quantity: $W = F\,d\cos\theta$ for a constant force $F$ along a displacement $d$
        at angle $\theta$. Work is done on or by a system; a system does not contain work.
  - id: 'heat'
    kind: 'entry'
    ref:
      collection: 'magnitudes'
      slug: 'heat'
    note:
      en: >-
        Also a process quantity: energy in transit because of a temperature difference. Once inside
        the system it is internal energy, no longer heat.
  - id: 'check-same-unit'
    kind: 'check'
    prompt:
      en: >-
        Energy, work and heat are all measured in joules. Does that make them the same quantity?
    answer:
      en: >-
        No. Equal dimension is necessary for two quantities to be of the same kind, not sufficient.
        Energy is a state of a system; work and heat are transfers across its boundary. Torque is
        another warning: it is also $\mathrm{kg\,m^{2}\,s^{-2}}$, written $\mathrm{N\,m}$, yet it is
        not an energy. The unit converter checks dimensions only, so it turns a joule of heat into a
        joule of work; whether that transfer can happen is decided by the second law.
  - id: 'power-intro'
    kind: 'prose'
    body:
      en: >-
        Power is how fast energy is transferred or converted: $P = \frac{dE}{dt}$. Its unit, the
        watt, is one joule per second, and in base units $\mathrm{W} = \mathrm{kg\,m^{2}\,s^{-3}}$.
        Utility bills invert the relation: a kilowatt-hour is power times time, an energy of
        $1\,\mathrm{kW} \times 3600\,\mathrm{s} = 3.6\,\mathrm{MJ}$.
  - id: 'power'
    kind: 'entry'
    ref:
      collection: 'magnitudes'
      slug: 'power'
  - id: 'watt'
    kind: 'entry'
    ref:
      collection: 'units'
      slug: 'watt'
    note:
      en: >-
        Authored here as $\mathrm{J\,s^{-1}}$, so the build derives its dimension from the joule's.
  - id: 'check-lamp'
    kind: 'check'
    prompt:
      en: >-
        A $60\,\mathrm{W}$ lamp runs for one hour. How much energy does it convert, in joules and in
        kilowatt-hours?
    answer:
      en: >-
        $60\,\mathrm{W} \times 3600\,\mathrm{s} = 216\,000\,\mathrm{J} = 216\,\mathrm{kJ}$, which is
        $0.06\,\mathrm{kWh}$.
  - id: 'mass-energy-intro'
    kind: 'prose'
    body:
      en: >-
        In 1905 Einstein showed that mass itself is a form of energy. A body of mass $m$ at rest
        has energy $E = m c^{2}$, where $c$ is the speed of light in vacuum. The factor $c^{2}$ is
        about $9\times10^{16}\,\mathrm{m^{2}\,s^{-2}}$, which is why a tiny mass corresponds to an
        enormous energy and why nuclear reactions release so much more than chemical ones.
  - id: 'speed-of-light'
    kind: 'entry'
    ref:
      collection: 'constants'
      slug: 'speed-of-light'
    note:
      en: >-
        Exact by definition since 1983: fixing $c$ is what defines the metre, so the uncertainty
        moved from the constant into the realization of the unit.
  - id: 'mass-energy'
    kind: 'entry'
    ref:
      collection: 'equations'
      slug: 'mass-energy-equivalence'
    note:
      en: >-
        Check the dimensions:
        $\mathrm{kg} \times (\mathrm{m/s})^{2} = \mathrm{kg\,m^{2}\,s^{-2}} = \mathrm{J}$. The build
        performs this check on every authored solution.
  - id: 'try-calculator'
    kind: 'prose'
    body:
      en: >-
        Open the calculator for mass-energy equivalence from the equation page. Enter $m = 0.001$
        (one gram, in kilograms) and leave $E$ empty. The engine returns about
        $8.988\times10^{13}\,\mathrm{J}$, roughly $25\,\mathrm{GWh}$ or 25 million kilowatt-hours,
        locked in a single gram of matter.
  - id: 'check-exact'
    kind: 'check'
    prompt:
      en: >-
        Why is the speed of light listed as exact when most physical constants carry an
        uncertainty?
    answer:
      en: >-
        Because the metre is defined by fixing $c$ at exactly $299\,792\,458\,\mathrm{m/s}$. A
        defining constant has no uncertainty by construction; the experimental uncertainty now lives
        in how precisely a laboratory can realize the metre, not in $c$.
references:
  - title: 'A. Einstein, Ist die Trägheit eines Körpers von seinem Energieinhalt abhängig?, Annalen der Physik 323 (1905) 639-641'
    url: 'https://doi.org/10.1002/andp.19053231314'
  - title: 'BIPM, The International System of Units, 9th ed., Appendix 1, 17th CGPM (1983), Resolution 1 (definition of the metre)'
    url: 'https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf'
