# yaml-language-server: $schema=../../dist/schemas/paths.locale.schema.json
name: 'Las siete unidades básicas del SI'
description: >-
  Conoce las siete unidades básicas del Sistema Internacional, aprende qué constante definitoria
  fija cada una desde 2019 y descubre por qué el kilogramo es la excepción.
steps:
  intro:
    body: >-
      El Sistema Internacional de Unidades (SI) construye todas sus unidades a partir de siete
      unidades básicas: el segundo, el metro, el kilogramo, el amperio, el kelvin, el mol y la
      candela. Desde el 20 de mayo de 2019 ninguna se define mediante un objeto ni una propiedad de
      un material: cada una queda fijada al asignar un valor numérico exacto a una de siete
      constantes definitorias de la naturaleza, de modo que cualquier laboratorio puede realizarla
      desde primeros principios.
  second:
    note: >-
      El segundo va primero porque el metro y el kilogramo se definen a través de él. Lo fija la
      frecuencia de la transición hiperfina del cesio-133, $\Delta\nu_{\mathrm{Cs}}$, establecida
      en exactamente $9\,192\,631\,770\,\mathrm{Hz}$.
  metre:
    note: >-
      Lo fija la velocidad de la luz $c$, exactamente $299\,792\,458\,\mathrm{m/s}$: un metro es la
      distancia que la luz recorre en el vacío en $1/299\,792\,458$ de segundo.
  kilogram:
    note: >-
      Lo fija la constante de Planck $h$, exactamente $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$.
      Como $\mathrm{J\,s} = \mathrm{kg\,m^{2}\,s^{-1}}$, el kilogramo queda determinado una vez
      conocidos el metro y el segundo.
  kilogram-anomaly:
    body: >-
      El kilogramo es la anomalía del conjunto. Es la única unidad básica cuyo nombre ya lleva un
      prefijo del SI, herencia de la unidad básica original del sistema métrico, el gramo. Por eso
      los prefijos se aplican al gramo y nunca al kilogramo: la milésima parte de un kilogramo es un
      gramo ($\mathrm{g}$), la millonésima es un miligramo ($\mathrm{mg}$) y $\mu\mathrm{kg}$ jamás
      se escribe. Fue además la última unidad básica definida por un artefacto: desde 1889 hasta
      2019 el kilogramo era la masa del prototipo internacional, un artefacto de platino e iridio
      guardado en el BIPM. En la tercera verificación periódica, de 1989 a 1991, las copias
      nacionales diferían de él en una mediana de unos 25 microgramos. Fijar $h$ eliminó esa
      dependencia de un solo objeto.
  check-prefix:
    prompt: >-
      La milésima de gramo se escribe $\mathrm{mg}$. ¿Por qué la millonésima de kilogramo no se
      escribe $\mu\mathrm{kg}$?
    answer: >-
      Los prefijos del SI nunca se acumulan. El kilogramo ya contiene el prefijo kilo, así que los
      demás prefijos se aplican al gramo: la millonésima de kilogramo es la milésima de gramo, un
      miligramo.
  ampere:
    note: >-
      Lo fija la carga elemental $e$, exactamente $1.602\,176\,634\times10^{-19}\,\mathrm{C}$, con
      $\mathrm{C} = \mathrm{A\,s}$: un amperio transporta unas $6.24\times10^{18}$ cargas
      elementales por segundo.
  kelvin:
    note: >-
      Lo fija la constante de Boltzmann $k$, exactamente $1.380\,649\times10^{-23}\,\mathrm{J/K}$,
      que relaciona la temperatura con la energía por partícula. El punto triple del agua, antes
      exactamente $273.16\,\mathrm{K}$ por definición, ahora es un valor medido.
  mole:
    note: >-
      Lo fija la constante de Avogadro $N_{\mathrm{A}}$, exactamente
      $6.022\,140\,76\times10^{23}\,\mathrm{mol^{-1}}$. El mol es un conteo puro de entidades, por
      lo que es la única unidad básica que no depende de ninguna otra.
  candela:
    note: >-
      La fija la eficacia luminosa de la radiación monocromática de $540\,\mathrm{THz}$,
      $K_{\mathrm{cd}}$, exactamente $683\,\mathrm{lm/W}$. Es la única unidad básica ligada a la
      percepción humana: la ponderación sigue la sensibilidad del ojo.
  closing:
    body: >-
      Observa el orden de dependencia. El segundo se sostiene solo; el metro necesita al segundo; el
      kilogramo necesita a ambos; el amperio, el kelvin y la candela necesitan al segundo a través de
      las unidades de sus constantes. Toda otra unidad del SI, del julio al pascal, es un producto
      de potencias de estas siete.
  check-dependence:
    prompt: >-
      ¿Cuáles de las siete definiciones de unidades básicas no dependen del segundo?
    answer: >-
      Solo el mol. El metro usa $c$ en $\mathrm{m/s}$; el kilogramo usa $h$ en
      $\mathrm{kg\,m^{2}\,s^{-1}}$; el amperio usa $e$ en $\mathrm{A\,s}$; el kelvin usa $k$ en
      $\mathrm{J/K}$ y el julio contiene $\mathrm{s^{-2}}$; la candela usa $\mathrm{W}$ y
      $\mathrm{Hz}$. La constante de Avogadro es un conteo por mol sin tiempo alguno.
