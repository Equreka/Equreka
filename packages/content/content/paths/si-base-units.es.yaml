# yaml-language-server: $schema=../../dist/schemas/paths.locale.schema.json
name: 'Las siete unidades base del SI'
description: >-
  Conoce las siete unidades base del Sistema Internacional, aprende qué constante definitoria fija
  cada una desde 2019 y descubre por qué el kilogramo es la excepción.
steps:
  intro:
    body: >-
      El Sistema Internacional de Unidades (SI) construye todas sus unidades a partir de siete
      unidades base: el segundo, el metro, el kilogramo, el ampere, el kelvin, el mol y la candela.
      Desde el 20 de mayo de 2019 ninguna se define mediante un objeto ni una propiedad de un
      material: cada una queda fijada al asignar un valor numérico exacto a una de siete constantes
      definitorias de la naturaleza, de modo que cualquier laboratorio puede realizarla desde
      primeros principios.
  second:
    note: >-
      El segundo va primero porque el metro y el kilogramo se definen a través de él. Lo fija la
      frecuencia de la transición hiperfina del cesio-133, $\Delta\nu_{\text{Cs}} =
      9\,192\,631\,770\ \text{Hz}$.
  metre:
    note: >-
      Lo fija la velocidad de la luz, $c = 299\,792\,458\ \text{m/s}$: un metro es la distancia que
      la luz recorre en el vacío en $\frac{1}{299\,792\,458}$ de segundo.
  kilogram:
    note: >-
      Lo fija la constante de Planck, $h = 6.626\,070\,15 \times 10^{-34}\ \text{J s}$. Como
      $\text{J s} = \text{kg}\,\text{m}^{2}\,\text{s}^{-1}$, el kilogramo queda determinado una vez
      conocidos el metro y el segundo.
  kilogram-anomaly:
    body: >-
      El kilogramo es la anomalía del conjunto. Es la única unidad base cuyo nombre ya lleva un
      prefijo del SI, herencia de la unidad base original del sistema métrico, el gramo. Por eso los
      prefijos se aplican al gramo y nunca al kilogramo: la milésima parte de un kilogramo es un
      gramo ($\text{g}$), la millonésima es un miligramo ($\text{mg}$) y $\mu\text{kg}$ jamás se
      escribe. Fue además la última unidad base definida por un artefacto: hasta 2019 el kilogramo
      era la masa del Prototipo Internacional, un cilindro de platino e iridio guardado cerca de
      París, cuya masa derivó unos $50\ \mu\text{g}$ respecto a sus copias oficiales en un siglo.
      Fijar $h$ eliminó esa dependencia de un solo objeto.
  check-prefix:
    prompt: >-
      La milésima de gramo se escribe $\text{mg}$. ¿Por qué la millonésima de kilogramo no se
      escribe $\mu\text{kg}$?
    answer: >-
      Los prefijos del SI nunca se acumulan. El kilogramo ya contiene el prefijo kilo, así que los
      demás prefijos se aplican al gramo: la millonésima de kilogramo es la milésima de gramo, un
      miligramo.
  ampere:
    note: >-
      Lo fija la carga elemental, $e = 1.602\,176\,634 \times 10^{-19}\ \text{C}$, con $\text{C} =
      \text{A s}$: un ampere transporta unas $6.24 \times 10^{18}$ cargas elementales por segundo.
  kelvin:
    note: >-
      Lo fija la constante de Boltzmann, $k = 1.380\,649 \times 10^{-23}\ \text{J/K}$, que relaciona
      la temperatura con la energía por partícula. El punto triple del agua, antes exactamente
      $273.16\ \text{K}$ por definición, ahora es un valor medido.
  mole:
    note: >-
      Lo fija la constante de Avogadro, $N_{\text{A}} = 6.022\,140\,76 \times 10^{23}\
      \text{mol}^{-1}$. El mol es un conteo puro de entidades, por lo que es la única unidad base
      que no depende de ninguna otra.
  candela:
    note: >-
      La fija la eficacia luminosa de la radiación monocromática de $540\ \text{THz}$,
      $K_{\text{cd}} = 683\ \text{lm/W}$. Es la única unidad base ligada a la percepción humana: la
      ponderación sigue la sensibilidad del ojo.
  closing:
    body: >-
      Observa el orden de dependencia. El segundo se sostiene solo; el metro necesita al segundo; el
      kilogramo necesita a ambos; el ampere, el kelvin y la candela necesitan al segundo a través de
      las unidades de sus constantes. Toda otra unidad de esta wiki, del joule al pascal, es un
      producto de potencias de estas siete, y así es exactamente como la compilación verifica la
      dimensión de cada unidad derivada.
  check-dependence:
    prompt: >-
      ¿Cuáles de las siete definiciones de unidades base no dependen del segundo?
    answer: >-
      Solo el mol. El metro usa $c$ en $\text{m/s}$; el kilogramo usa $h$ en $\text{kg m}^{2}\text{
      s}^{-1}$; el ampere usa $e$ en $\text{A s}$; el kelvin usa $k$ en $\text{J/K}$ y el joule
      contiene $\text{s}^{-2}$; la candela usa $\text{W}$ y $\text{Hz}$. La constante de Avogadro es
      un conteo por mol sin tiempo alguno.
