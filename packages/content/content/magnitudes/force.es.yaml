# yaml-language-server: $schema=../../dist/schemas/magnitudes.locale.schema.json
name: 'Fuerza'
description: >-
  La fuerza es la magnitud vectorial de la mecánica que describe un empuje o una tracción que
  ejerce sobre un cuerpo otro cuerpo o un campo, capaz de cambiar su estado de movimiento o de
  deformarlo. La fuerza neta que actúa sobre un cuerpo es igual al ritmo de cambio de su cantidad
  de movimiento, que para un cuerpo de masa constante es su masa multiplicada por su aceleración.

  Su unidad SI es el newton, la fuerza que imprime a un kilogramo una aceleración de un metro
  por segundo al cuadrado; en unidades básicas es $\mathrm{kg\,m\,s^{-2}}$, de modo que su
  dimensión es longitud por masa dividida entre tiempo al cuadrado. Entre las unidades antiguas
  están la dina del sistema CGS, igual a diez micronewtons, y la libra fuerza y el kilogramo
  fuerza de los sistemas gravitatorios.

  Una fuerza tiene a la vez tamaño y dirección, y las fuerzas que actúan sobre un mismo cuerpo se
  suman como vectores. Sobre un eje elegido, cada componente es positiva si apunta en el sentido
  positivo de ese eje y negativa en caso contrario. Las fuerzas aparecen siempre por parejas: cuando
  un cuerpo empuja a otro, el segundo empuja al primero con una fuerza del mismo tamaño y sentido
  opuesto, y las dos fuerzas actúan sobre cuerpos distintos.

  Los dinamómetros de resorte, los medidores de fuerza y las celdas de carga miden la fuerza a
  través de la deformación que produce en un elemento elástico. Cerca de la superficie de la
  Tierra, la gravedad tira de un objeto de un kilogramo con unos $9.80\,\mathrm{N}$, mientras que el
  agua retenida por una gran presa empuja la presa con cerca de $1.6\times10^{10}\,\mathrm{N}$.

  La fuerza se distingue de la presión, que es la fuerza dividida entre el área sobre la que
  actúa, y de la energía y la cantidad de movimiento, que describen el efecto de una fuerza que
  actúa a lo largo de una distancia o de un intervalo de tiempo. El peso es una fuerza concreta, la
  atracción de la gravedad; la masa, en cambio, no es una fuerza.
