description:
  en: >-
    Activity, symbol $A$, is the number of nuclei in a sample of a radionuclide that undergo a
    spontaneous transformation per unit of time: the rate of radioactive decay of the sample. Also
    called radioactive activity, decay rate or disintegration rate, it is the quantity of nuclear
    physics and radiation protection that tells how intense a radioactive source is, independently
    of any dose that a nearby person or object receives.

    Its SI unit is the becquerel, $\mathrm{Bq}$, a special name for the reciprocal second, so the
    dimension is time to the power minus one. The SI Brochure keeps the becquerel for random decay
    processes in radionuclides and the hertz for periodic phenomena, and explains that the separate
    name guards against errors that could harm health. The older curie is still met, with one curie
    worth exactly $3.7\times10^{10}\,\mathrm{Bq}$.

    Activity is a scalar and is never negative. Each nucleus of a given radionuclide decays at
    random with a fixed probability per unit of time, so the activity of a pure sample is
    proportional to the number of nuclei that have not yet decayed, the factor being the decay
    constant of that radionuclide. The activity therefore falls exponentially, halving once every
    half-life, and temperature, pressure or chemical form leave that rate unchanged.

    Detectors and survey meters register the radiation emitted by a source, which is how the
    radioactive content of soil, food and water is determined. The values cover many orders of
    magnitude: natural radium-226 in surface water usually amounts to 0.0037 to 0.0185 becquerels
    per litre, while one gram of radium has an activity close to one curie.

    Three ideas are often mixed up with it. Radioactivity is the property of emitting radiation, a
    radioactive material is the substance that has it, and the SI Brochure calls the use of
    radioactivity as a name for activity incorrect. Absorbed dose and equivalent dose, in grays and
    sieverts, describe the receiving side instead. Henri Becquerel discovered radioactivity in 1896
    while studying uranium salts.
