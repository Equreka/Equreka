name:
  en: 'Power'
symbol:
  tex: 'P'
baseUnit: 'watt'
dimension:
  L: 2
  M: 1
  T: -3
categories:
  - 'physics'
description:
  en: >-
    In physics, power is the amount of energy transferred or converted per unit time. In the
    International System of Units, the unit of power is the watt, equal to one joule per second. In
    older works, power is sometimes called activity. Power is a scalar quantity.
