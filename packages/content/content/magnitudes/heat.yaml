description:
  en: >-
    Heat, symbol $Q$, is energy transferred between a system and its surroundings because of a
    difference in temperature, as distinct from energy transferred as work or carried across the
    boundary by matter. Left to itself, heat passes from a hotter body to a colder one until both
    reach the same temperature.

    As an amount of energy, heat is expressed in joules, symbol J, and has the dimension of energy.
    The SI Brochure lists amount of heat beside energy and work under the joule, and in 1948 the
    9th CGPM resolved that quantities of heat be expressed in joules. The calorie, defined through
    the warming of water, survives in nutrition, where the food Calorie is a kilocalorie, about
    4186 joules.

    Heat is a scalar whose sign is fixed by convention. In the first law of thermodynamics as
    usually written in physics, heat is positive when it enters the system and negative when it
    leaves, and the change in internal energy equals the heat received minus the work done by the
    system. Heat is not a state function: the same change of state can be produced by heating, by
    doing work or by a mixture of both, so a body cannot be said to hold a definite amount of heat.

    Heat is measured by calorimetry, from the temperature change of a substance of known mass and
    specific heat capacity or from the mass that melts or boils. Melting 50 grams of ice at 0 degrees
    Celsius takes about 16.8 kilojoules. In 1843 James Joule warmed water by stirring it with
    paddles driven by falling weights and found the temperature rise proportional to the work done,
    which established the energy equivalence of heat and work.

    Heat is often confused with temperature, which describes how hot a body is rather than how much
    energy crosses its boundary, and with internal energy, the total microscopic energy a system
    holds. QUDT classifies heat as a narrower kind of thermal energy, itself a kind of energy.
