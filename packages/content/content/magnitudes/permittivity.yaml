description:
  en: >-
    Permittivity, also called absolute or electric permittivity, is the quantity of
    electromagnetism that describes how a medium responds to an electric field: the ratio of the
    electric flux density, or displacement, in the medium to the electric field strength that
    produces it. The higher the permittivity, the more the medium polarizes and the weaker the
    field left by a given free charge.

    Its coherent SI unit is the farad per metre, which is the same as the square coulomb per
    newton square metre; in SI base units it is the second to the fourth square ampere per
    kilogram cubic metre, so the dimension is time to the fourth times current squared divided
    by mass and length cubed. The vacuum electric permittivity, about $8.85\times10^{-12}\,\mathrm{F/m}$,
    is the reference against which every material is compared.

    In ordinary materials permittivity is a positive scalar, and it is usually quoted as the
    relative permittivity, also called the dielectric constant: the permittivity of the material
    divided by that of vacuum. The SI Brochure treats such a ratio between like quantities as a
    pure number with the unit one. A relative permittivity of exactly 1 belongs to
    vacuum, and every insulator has a value above 1.

    It is measured by filling the gap of a capacitor with the material and comparing the
    capacitance with that of the empty capacitor, since the capacitance grows by the factor of the
    dielectric constant. Typical relative values are 1.00059 for dry air at one atmosphere, 2.1
    for Teflon, about 80 for water and between roughly one thousand and ten thousand for barium
    titanate.

    Permittivity is easily confused with permeability, its magnetic counterpart, and with the
    dielectric strength of an insulator, which is the electric field at which it breaks down and
    starts to conduct, measured in volts per metre rather than in farads per metre.
