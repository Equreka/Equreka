description:
  en: >-
    The moment of inertia, also called rotational inertia or angular mass, measures how strongly a
    body resists a change in its rotation about a given axis. For a set of point masses it is the
    sum of each mass multiplied by the square of its distance from the axis; for a continuous body
    the sum becomes an integral over the mass. In rotation it takes the place that mass holds in
    motion along a line.

    The SI unit is the kilogram square metre, and the dimension is mass times length squared. The
    rotational kinetic energy of a rigid body is one half of its moment of inertia times the square
    of its angular velocity, mirroring one half of mass times speed squared for motion along a line.

    For rotation about a fixed axis the moment of inertia is a scalar, and it is never negative.
    Unlike mass, it is not a single property of the body: it depends on which axis is chosen and on
    how the mass is spread around it. The parallel-axis theorem gives the value about any axis from
    the value about a parallel axis through the centre of mass.

    The moment of inertia is usually calculated from the shape and mass distribution of a body, and
    standard results are tabulated for rods, hoops, discs and spheres. Mass far from the axis counts
    most, because distance enters squared. Six small washers on a light rod half a metre long have
    about $0.0035\,\mathrm{kg\,m^{2}}$ about its centre, while the four rotor blades of a small
    rescue helicopter, turning about the hub, total about $1067\,\mathrm{kg\,m^{2}}$.

    The moment of inertia is distinct from angular momentum, which is the product of the moment of
    inertia and the angular velocity. When a spinning body pulls its mass closer to the axis, its
    moment of inertia drops and its angular velocity rises so that the angular momentum stays the
    same.
