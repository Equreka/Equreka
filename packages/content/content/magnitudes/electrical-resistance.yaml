description:
  en: >-
    Electrical resistance, symbol $R$, measures how strongly a conductor or circuit component
    opposes the passage of electric current. For a component with two terminals it is defined as
    the voltage applied across it divided by the current that flows through it, so a high
    resistance lets only a small current pass for a given voltage. Its reciprocal is electrical
    conductance.

    The SI unit is the ohm, symbol Ω, equal to one volt per ampere and, in base units, to
    $\mathrm{kg\,m^{2}\,s^{-3}\,A^{-2}}$, which gives the dimension of resistance. OpenStax notes
    that the capital Greek omega was chosen for the symbol so that it cannot be mistaken for the
    digit zero.

    Resistance is a scalar that is never negative for passive components, and it drops to zero in
    a superconductor at low temperature. It depends on the material, through its resistivity, and
    on the shape of the object: a uniform wire offers more resistance the longer and thinner it is.
    The resistivity of most metals rises with temperature, while that of semiconductors falls. A
    component whose ratio of voltage to current stays constant is called ohmic, as a resistor is;
    a diode, which conducts in only one direction, is a standard example of a nonohmic component.

    Resistance is measured with an ohmmeter or calculated from simultaneous readings of voltage and
    current. OpenStax lists values that span about seventeen orders of magnitude: a million million
    ohms or more for the ceramic insulators that hold up power lines, about a hundred thousand ohms
    from hand to foot for a dry person, about a thousand ohms for the human heart, and roughly ten
    microohms for a metre of thick copper wire.

    Resistance belongs to an object, whereas resistivity, measured in ohm metres, belongs to a
    material; the two are linked by the length and cross-section of the sample. Resistance is also
    distinct from conductance, its reciprocal in siemens. The ohm honours Georg Simon Ohm.
