name:
  en: 'Electrical resistance'
symbol:
  tex: 'R'
baseUnit: 'ohm'
dimension:
  L: 2
  M: 1
  T: -3
  I: -2
nonNegative: true
categories:
  - 'physics'
aliases:
  - 'resistance'
description:
  en: >-
    The electrical resistance of an object is a measure of its opposition to the flow of electric
    current. Its reciprocal quantity is electrical conductance, measuring the ease with which an
    electric current passes. Electrical resistance shares some conceptual parallels with mechanical
    friction. The SI unit of electrical resistance is the ohm (Ω), while electrical conductance is
    measured in siemens (S) (formerly called "mho"s and then represented by ℧).
