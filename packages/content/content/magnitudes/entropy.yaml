description:
  en: >-
    Entropy, symbol $S$, is a thermodynamic state function that measures how the energy of a system
    is spread over the microscopic states available to it. When a system at absolute temperature
    receives a small amount of heat reversibly, its entropy rises by that heat divided by the
    temperature. The second law of thermodynamics is expressed through entropy: in every
    irreversible process the combined entropy of a system and its surroundings increases.

    The SI unit of entropy is the joule per kelvin, J/K, so its dimension is energy divided by
    temperature. The 13th CGPM, meeting in 1967 and 1968, added the joule per kelvin for entropy to
    the list of SI derived units. Heat capacity shares the same unit, an example the SI Brochure
    gives of why a unit alone never identifies a quantity.

    Entropy is a scalar. Because it is a state function, the change between two states does not
    depend on the path, so it can be computed along any reversible route joining them. The entropy
    of a system can fall, for instance when it gives off heat, but the surroundings then gain at
    least as much. In statistical physics the Boltzmann constant links entropy to the number of
    accessible quantum states through $S = k\ln\Omega$. The third law sets a natural zero: a perfect crystal of a pure substance at absolute
    zero has zero entropy.

    Absolute entropies come from calorimetry, by measuring heat capacities from very low
    temperatures upward and adding up heat divided by temperature. Standard molar entropies at
    298.15 kelvin tabulated by OpenStax include 2.38 joules per mole kelvin for diamond, 70.0 for
    liquid water and 188.8 for water vapour. Melting 50 grams of ice at its melting point raises its
    entropy by about 61 joules per kelvin.

    Entropy is popularly described as disorder, but the measured quantity is defined through heat and temperature or through counts of microscopic
    states. It differs from molar entropy, entropy per amount of substance, and from heat capacity,
    which shares its unit but describes the heat needed to raise the temperature.
