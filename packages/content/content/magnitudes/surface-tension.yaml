description:
  en: >-
    Surface tension is the force per unit length with which the free surface of a liquid pulls along
    any line drawn on it, acting in the surface and at right angles to the line. Equivalently, it is
    the work needed to enlarge that surface by one unit of area at constant temperature. In fluid
    mechanics it explains why drops and bubbles round up, why a needle can rest on water and why
    liquids climb narrow tubes.

    The SI unit is the newton per metre, which the SI Brochure lists for this quantity and which
    equals the kilogram per second squared in base units, so the dimension is mass divided by time
    squared. Since a newton per metre is also a joule per square metre, the same number gives the
    surface energy of the liquid. The CGS unit, the dyne per centimetre, equals one millinewton per
    metre.

    Surface tension is a scalar and is positive for every liquid in contact with its vapour or with
    air. Its symbol is $\gamma$. Molecules at the surface have fewer neighbours than those inside,
    so the cohesive forces draw the surface layer tight like a stretched membrane; heating weakens
    the cohesion, and dissolved soap lowers the value sharply.

    It is measured by pulling a thin wire frame out of a liquid film and recording the force, or
    from the height a liquid climbs in a narrow glass tube. Water has about 0.0756 newtons per metre
    at 0 degrees Celsius, 0.0728 at 20 degrees and 0.0589 at 100 degrees; typical soapy water about
    0.037, ethyl alcohol 0.0223 and mercury 0.465. Liquid helium near −269 degrees Celsius has only
    0.00012, while molten gold at 1070 degrees reaches about 1.000.

    Surface tension is not the tension of a string or cable, which is a force in newtons, nor a
    pressure; the pressure jump across a curved surface follows from it but grows as the radius of
    curvature shrinks. QUDT files it as a kind of energy per area.
