name:
  en: 'Frequency'
symbol:
  tex: 'f'
symbolAlt:
  tex: 'v'
baseUnit: 'hertz'
dimension:
  T: -1
nonNegative: true
categories:
  - 'physics'
description:
  en: 'Frequency is the number of occurrences of a repeating event per unit of time. It is also
    occasionally referred to as temporal frequency to emphasize the contrast to spatial frequency,
    and ordinary frequency to emphasize the contrast to angular frequency. Frequency is measured in
    hertz ($Hz$) which is equal to <strong>one event per second</strong>.'
