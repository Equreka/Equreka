description:
  en: >-
    Amount concentration, in full amount-of-substance concentration, is the amount of a substance B
    present in a mixture divided by the volume of the whole mixture, $c_{\mathrm{B}}=n_{\mathrm{B}}/V$.
    It is the standard way to state how much solute a chemical solution holds, and it is often
    shortened to concentration when no other kind is meant. Clinical chemists call it substance
    concentration, and older textbooks call it molarity.

    Its coherent SI unit is the mole per cubic metre, and its dimension is amount of substance
    divided by length cubed. Laboratory work uses the mole per litre, $\mathrm{mol/L}$, which equals
    1000 moles per cubic metre and is the same unit as the mole per cubic decimetre. The unit symbol
    M, read as molar, survives in teaching and on reagent labels, but NIST lists both that symbol
    and the name molarity as obsolete, and IUPAC discourages molarity because it is easily mistaken
    for molality.

    Amount concentration is a scalar that is never negative, and it is zero when the substance is
    absent. A solution expands as it warms while the amount of solute stays the same, so its amount
    concentration falls slightly with rising temperature. Work that must not depend on temperature,
    such as the treatment of colligative properties, therefore uses molality instead.

    A solution of known amount concentration is made by weighing the solute, converting its mass to
    moles with the molar mass, and adding solvent up to a marked volume. Pure water at
    $25\,^{\circ}\mathrm{C}$ holds about $1.0\times10^{-7}\,\mathrm{mol/L}$ of hydronium ions, a
    sweetened soft drink carries a few tenths of a mole of sucrose per litre, and white vinegar has
    close to 0.84 mole of acetic acid in each litre.

    Mass concentration counts the solute in kilograms instead of moles, and molality divides by the
    mass of the solvent alone rather than by the volume of the solution. In equilibrium expressions
    the amount concentration of a species is often written with square brackets, as [B].
