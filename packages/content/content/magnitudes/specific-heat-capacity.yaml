description:
  en: >-
    Specific heat capacity, usually shortened to specific heat and written $c$, is the heat capacity
    of a material per unit mass: the heat that one kilogram of it must absorb for its temperature to
    rise by one kelvin. It belongs to a substance in a given phase rather than to a particular
    object, and it connects the heat taken in by a sample with the sample's mass and temperature
    change through $Q=mc\Delta T$.

    The SI unit is the joule per kilogram kelvin, which the SI Brochure also assigns to specific
    entropy, and the dimension is length squared divided by time squared and by thermodynamic
    temperature, since mass cancels out. Because a temperature difference has the same size in
    kelvins and in degrees Celsius, a value per degree Celsius is the same number. Older tables use
    the calorie per gram kelvin, which NIST Special Publication 811 converts, in its International Table form, as
    exactly 4186.8 joules per kilogram kelvin.

    Specific heat capacity is a positive scalar that depends on the phase and the temperature of the
    material: ice has roughly half the value of liquid water, and at very low temperatures the
    specific heat of a solid falls in proportion to the cube of its absolute temperature. For gases
    it also depends on what is held fixed during heating; dry air takes about 40 percent more heat
    per kilogram per kelvin at constant pressure than at constant volume.

    It is measured by calorimetry, for example by placing a hot sample in water inside an insulated
    vessel and applying conservation of energy to the final common temperature. Liquid water has one
    of the highest values of any common substance, about $4186\,\mathrm{J/(kg\,K)}$, nearly ten
    times that of iron and more than thirty times that of lead or gold.

    Specific heat capacity differs from heat capacity, which belongs to a whole object and grows
    with its mass, and from molar heat capacity, taken per mole. It also differs from specific
    latent heat: specific heat governs a change of temperature, whereas latent heat governs a change
    of phase that happens at constant temperature.
