name:
  en: 'Luminous efficacy'
symbol:
  tex: 'K'
baseUnit: 'lumen-per-watt'
dimension:
  J: 1
  A: 2
  M: -1
  L: -2
  T: 3
categories:
  - 'physics'
description:
  en: >-
    Luminous efficacy is a measure of how well a light source produces visible light: the ratio of
    luminous flux to power, measured in lumens per watt ($\frac{lm}{W}$). The legacy data classified
    lumen-per-watt under speed; this magnitude corrects that.
