name:
  en: 'Pressure'
symbol:
  tex: 'p'
baseUnit: 'pascal'
dimension:
  L: -1
  M: 1
  T: -2
categories:
  - 'physics'
description:
  en: |-
    Pressure (symbol: $p$ or $P$) is the force applied perpendicular to the surface of an object per unit area over which that force is distributed. Gauge pressure (also spelled gage pressure) is the pressure relative to the ambient pressure.

    Various units are used to express pressure. Some of these derive from a unit of force divided by a unit of area; the SI unit of pressure, the pascal ($Pa$), for example, is one newton per square metre (N/m2); similarly, the pound-force per square inch ($psi$) is the traditional unit of pressure in the imperial and U.S. customary systems. Pressure may also be expressed in terms of standard atmospheric pressure; the atmosphere (atm) is equal to this pressure, and the torr is defined as $\frac{1}{760}$ of this. Manometric units such as the centimetre of water, millimetre of mercury, and inch of mercury are used to express pressures in terms of the height of column of a particular fluid in a manometer.
