description:
  en: >-
    Pressure is the force per unit area that a fluid exerts perpendicular to any surface in contact
    with it, or more generally the normal force pressing on a surface divided by the area of that
    surface. At a point inside a fluid at rest it has the same value whatever the orientation of
    the surface, which makes it a basic variable of fluid mechanics and, for gases, a state
    variable of thermodynamics.

    The SI unit is the pascal, one newton per square metre, so the dimension is mass divided by
    length and by time squared. Other units persist in particular fields: the bar, exactly
    $10^{5}\,\mathrm{Pa}$, and its millibar in meteorology; the standard atmosphere, exactly
    $101\,325\,\mathrm{Pa}$; and the pound per square inch for tyres and compressed gas.

    Pressure is a scalar; the force it produces always acts normal to the surface, but the
    pressure itself has no direction. Two reference levels are in use. Gauge pressure is measured
    relative to the surrounding atmosphere, so it is positive above atmospheric pressure and
    negative below it, as inside a vacuum-packed jar. Absolute pressure is measured from a perfect
    vacuum and, for a fluid at rest, does not drop below zero.

    Barometers measure atmospheric pressure, manometers balance a pressure against the height of a
    liquid column, and many gauges read the deflection of an elastic element. Mean air pressure at
    the surface of the Earth is about 1014 millibars; at a depth of 40 metres in fresh water the
    pressure of the water alone reaches about $392\,\mathrm{kPa}$, and a compressed-air tank can hold
    several million pascals.

    Pressure is not force: the same force spread over a larger area gives a lower pressure.
    Mechanical stress shares the unit and the dimension but describes internal forces in solids,
    which, unlike fluids at rest, can also resist shear. In the kinetic theory of gases, pressure
    arises from the momentum that molecules transfer to the container walls as they collide with
    them.
