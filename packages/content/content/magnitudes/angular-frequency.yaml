description:
  en: >-
    Angular frequency is the rate at which the phase of a periodic process advances with time. For
    an oscillation or a wave it equals $2\pi$ times the frequency, or $2\pi$ divided by the period,
    because the phase grows by one full turn of $2\pi$ radians in every cycle. It is the natural rate in the equations of simple harmonic motion, waves and
    alternating-current circuits.

    The SI unit of angular frequency is the radian per second, with the dimension of a plane angle
    divided by a time. The SI Brochure reserves the hertz for frequency and asks for angular
    frequency to be given explicitly in radians per second, not as a bare reciprocal second, because
    the numerical values of the two quantities differ by a factor of $2\pi$ and mixing them is a
    common source of error.

    Angular frequency is a scalar and is treated here as non-negative. The direction in which a wave
    travels is carried by the sign in front of the time term of its wave function, not by the
    angular frequency itself.

    It is obtained from a measured period or frequency. A block on a spring oscillating with a
    period of 1.57 seconds has an angular frequency of about $4.00\,\mathrm{rad/s}$; an ultrasound
    transducer oscillating with a period of 0.400 microseconds reaches about
    $1.57\times10^{7}\,\mathrm{rad/s}$. For a mass on a spring it depends only on the stiffness and
    the mass, not on the amplitude.

    Angular frequency shares its unit and the symbol omega with angular velocity, and QUDT lists
    the two as matching quantity kinds. The distinction is one of meaning: angular velocity
    describes a physical rotation about an axis, whereas angular frequency describes how fast the
    phase of any oscillation advances, even when nothing rotates.
