# yaml-language-server: $schema=../../dist/schemas/magnitudes.locale.schema.json
name: 'Temperatura termodinámica'
description: >-
  La temperatura termodinámica, de símbolo $T$, también llamada temperatura absoluta, es la
  temperatura contada desde el cero absoluto, la temperatura más baja físicamente posible.
  Determina el sentido del flujo de calor, ya que la energía pasa espontáneamente de un sistema a
  mayor temperatura a otro a menor temperatura, y dos sistemas en equilibrio térmico tienen el
  mismo valor. Es una de las siete magnitudes básicas del Sistema Internacional
  de Unidades.

  Su unidad SI es el kelvin, de símbolo K, una unidad básica que se escribe sin signo de grado.
  Desde el 20 de mayo de 2019 el kelvin se define fijando la constante de Boltzmann en exactamente
  $k = 1.380\,649\times10^{-23}\,\mathrm{J/K}$, de modo que un cambio de un kelvin corresponde a un
  cambio de energía térmica, la constante de Boltzmann por la temperatura, de ese número de julios. La definición anterior fijaba el punto
  triple del agua en exactamente 273.16 kelvin; esa temperatura ahora se mide, y en el momento del
  cambio coincidía con 273.16 kelvin con una incertidumbre relativa de 3.7 partes en diez
  millones.

  La temperatura termodinámica es un escalar que nunca es negativo. El tercer principio de la
  termodinámica establece que el cero absoluto no puede alcanzarse en un número finito de pasos de
  enfriamiento, de modo que todo sistema real está por encima de cero kelvin. La temperatura Celsius se
  define a partir de ella restando exactamente 273.15 kelvin: una diferencia de temperatura tiene el
  mismo valor numérico en kelvin y en grados Celsius, pero una temperatura no.

  Las medidas prácticas siguen la Escala Internacional de Temperatura de 1990, adoptada por el CIPM
  en 1989, cuyos valores se aproximan mucho a las temperaturas termodinámicas. El agua se congela a
  presión normal cerca de 273.15 kelvin, y la temperatura ambiente que se usa en los problemas de
  física, 25 grados Celsius, equivale a 298.15 kelvin.

  La temperatura se confunde a menudo con el calor, la energía que fluye a causa de una diferencia
  de temperatura, y con la energía interna: dos cuerpos a la misma temperatura pueden contener
  cantidades de energía muy distintas. En muchos sistemas la temperatura refleja la energía
  cinética media de traslación de las moléculas, por lo que mide solo una parte de la energía
  interna.
