description:
  en: >-
    Molar mass, symbol $M$, is the mass of a sample of a pure substance divided by the amount of
    substance it contains, so it gives the mass of one mole of the specified entities: atoms,
    molecules, ions or formula units. It is a property of the substance, not of the sample, and
    chemistry uses it to convert between weighed masses and amounts in moles.

    The coherent SI unit is the kilogram per mole, but tables almost always quote molar masses in
    grams per mole, a unit one thousand times smaller. The dimension is mass divided by amount of
    substance. Molar mass is a positive scalar.

    For an element or compound, the molar mass in grams per mole has the same number as its
    relative atomic or molecular mass, which equals the mass of one entity in daltons: one carbon-12
    atom has a mass of 12 daltons, and one mole of carbon-12 has a mass of very nearly 12 grams.
    Molecular nitrogen has a molar mass of $28.01\,\mathrm{g/mol}$ and sodium chloride of about
    58.44 grams per mole. For a gas, it follows from the ideal gas law after weighing a sample
    and measuring its pressure, volume and temperature.

    Molar mass differs from molecular mass, which is the mass of a single molecule rather than of
    a mole of them, and from the dimensionless relative molecular mass, still often called
    molecular weight. Before 2019 the SI fixed the molar mass of carbon-12 at exactly 0.012
    kilograms per mole; since the mole was redefined by fixing the Avogadro constant, that value is
    measured, and CODATA 2022 gives $12.000\,000\,0126(37)\times10^{-3}\,\mathrm{kg/mol}$.
