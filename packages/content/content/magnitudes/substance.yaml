name:
  en: 'Amount of substance'
symbol:
  tex: 'n'
baseUnit: 'mole'
dimension:
  N: 1
nonNegative: true
categories:
  - 'chemistry'
description:
  en: 'The amount of substance, symbol n, of a system is a measure of the number of specified
    elementary entities. An elementary entity may be an atom, a molecule, an ion, an electron, any
    other particle or specified group of particles.'
