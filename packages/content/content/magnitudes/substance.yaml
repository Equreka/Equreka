description:
  en: >-
    Amount of substance, symbol $n$, measures the size of a sample by the number of specified
    elementary entities it contains: atoms, ions, molecules, electrons, other particles or defined
    groups of particles. It is the quantity chemists use to count reacting particles in portions
    large enough to weigh, and one of the seven base quantities on which the International System
    of Units is built. In chemical writing it is often shortened to amount, as in amount of water.

    Its SI unit is the mole, symbol mol, and its base dimension is written N. Since 20 May 2019 one
    mole contains exactly $6.022\,140\,76\times10^{23}$ elementary entities, the numerical value of
    the Avogadro constant expressed in reciprocal moles. The previous definition, adopted by the
    14th CGPM in 1971, linked the mole to carbon-12 by fixing the molar
    mass of that isotope at exactly 12 grams per mole.

    Amount of substance is a non-negative scalar, and it is meaningful only once the entity is
    named: one mole of hydrogen molecules contains two moles of hydrogen atoms. The SI Brochure
    asks for the entity to be stated, preferably by its chemical formula, and the quantity is
    named accordingly, for example amount of hydrogen chloride. It is extensive, so combining two
    samples of the same substance adds their amounts.

    Amount is rarely counted directly. It is usually found by dividing a measured mass by the molar
    mass, or from the volume, pressure and temperature of a gas. With a molar mass of about 18
    grams per mole, a single gram of water holds roughly 33 thousand billion billion molecules. One
    mole of an ideal gas at 273.15 kelvin and 100 kilopascals fills about 22.71 litres.

    Amount of substance is often confused with mass and with the bare number of entities, which is
    a pure number; the Avogadro constant converts between amount and number. Calling it the number
    of moles names the quantity after its unit, much as calling mass the number of kilograms would.
