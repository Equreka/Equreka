description:
  en: >-
    Acceleration is the rate at which the velocity of a body changes with time. It is a vector
    quantity of kinematics that records any change in velocity, whether in magnitude, in direction
    or in both. The instantaneous acceleration is the time derivative of velocity; the average
    acceleration over an interval is the change in velocity divided by the time taken.

    In the SI, acceleration is measured in metres per second squared, with the dimension of a length
    divided by a time squared: an acceleration of one metre per second squared adds one metre per
    second to the velocity every second. Geodesy and geophysics still quote the gal of the CGS
    system, one hundredth of the SI unit.

    The direction of acceleration is that of the velocity change, which need not be the direction
    of motion. Along a line it is one signed component, and its sign alone says nothing about
    speeding up: a body speeds up when acceleration and velocity share a sign and slows down when
    the signs differ. A body moving on a circle at constant speed is still accelerating, towards the
    centre, because the direction of its velocity keeps changing.

    Accelerometers measure it directly, and it can also be found from the slope of a
    velocity–time graph. Typical magnitudes range from about $0.25\,\mathrm{m/s^{2}}$ for a
    high-speed train to $1.9\times10^{9}\,\mathrm{m/s^{2}}$ for a proton in the Large
    Hadron Collider. Free fall near the surface of the Earth is close to the standard acceleration
    of gravity, $9.806\,65\,\mathrm{m/s^{2}}$, the conventional value adopted by the 3rd CGPM in
    1901.

    Acceleration is not velocity: a stone thrown upwards, with air resistance neglected, has zero velocity at the top of its path,
    yet its acceleration there is the same downward value as at every other point of the flight.
    Deceleration is an everyday word for slowing down, not a separate quantity.
