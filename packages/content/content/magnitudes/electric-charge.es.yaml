# yaml-language-server: $schema=../../dist/schemas/magnitudes.locale.schema.json
name: 'Carga eléctrica'
description: >-
  La carga eléctrica, de símbolo $q$, es la propiedad de la materia por la que los cuerpos ejercen
  entre sí fuerzas eléctricas y magnéticas y responden a los campos electromagnéticos. Existe en
  dos clases, llamadas positiva y negativa: las cargas de la misma clase se repelen y las de clases
  opuestas se atraen. La carga de un objeto es la suma algebraica de las cargas de las partículas
  que lo forman, de modo que cantidades iguales de ambas clases lo dejan eléctricamente neutro.

  La unidad SI de carga es el culombio, de símbolo C, una unidad derivada igual a un amperio
  segundo, por lo que la dimensión de la carga es la corriente eléctrica multiplicada por el
  tiempo. Un culombio es la carga que una corriente constante de un amperio transporta a través de
  un punto en un segundo. Con la revisión del SI de 2019, vigente desde el 20 de mayo, la
  carga elemental tiene el valor exacto $e = 1.602\,176\,634\times10^{-19}\,\mathrm{C}$, y ese
  número fijo define el amperio y, a través de él, el culombio.

  La carga es una magnitud escalar cuyo signo tiene significado físico. Un protón lleva una carga
  elemental y un electrón, menos una; los cuerpos ordinarios se cargan al ganar o perder
  electrones. La carga está cuantizada, pues toda partícula libre lleva un múltiplo entero de la
  carga elemental, y se conserva: la carga neta de un sistema aislado no cambia aunque se creen o
  se aniquilen partículas. Qué clase se llama positiva es una convención que se remonta a Benjamin
  Franklin.

  La carga rara vez se mide directamente. Suele obtenerse integrando en el tiempo una corriente
  medida, o deducirse de la fuerza entre cuerpos cargados. HyperPhysics señala que una lámpara de
  120 vatios conectada a 120 voltios deja pasar aproximadamente un culombio por segundo, y OpenStax
  describe una batería de automóvil de 12 voltios capaz de mover unos sesenta mil culombios.

  La carga se confunde a menudo con la corriente eléctrica, que es el ritmo al que fluye la carga,
  y con la energía que almacena una batería, que depende además de su tensión. También se habla de
  una carga para referirse a una partícula cargada; en sentido estricto, la carga es una propiedad
  que la partícula tiene, como la masa.
