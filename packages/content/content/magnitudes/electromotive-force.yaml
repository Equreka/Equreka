# yaml-language-server: $schema=../../dist/schemas/magnitudes.schema.json
name:
  en: 'Electromotive force'
symbol:
  tex: '\mathcal {E}'
  text: 'ℰ'
baseUnit: 'volt'
dimension:
  L: 2
  M: 1
  T: -3
  I: -1
kindOf: 'electric-potential'
categories:
  - 'physics'
description:
  en: >-
    In electromagnetism and electronics, **electromotive force** (**emf**, denoted $\mathcal {E}$
    and measured in volts) is the electrical action produced by a non-electrical source. Devices
    (known as transducers) provide an emf by converting other forms of energy into electrical
    energy, such as batteries (which convert chemical energy) or generators (which convert
    mechanical energy). Sometimes an analogy to water pressure is used to describe electromotive
    force. (The word "force" in this case is not used to mean forces of interaction between bodies).
