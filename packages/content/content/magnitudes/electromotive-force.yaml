description:
  en: >-
    Electromotive force, abbreviated emf and written $\mathcal{E}$, is the energy per unit charge
    that a source such as a battery, a generator or a solar cell gives to the charges it drives
    around a circuit. It equals the work done by the non-electrostatic action of the source on each
    unit of charge carried from its negative to its positive terminal when no current flows.
    Despite the name, it is not a force.

    Being energy per unit charge, emf is measured in volts, joules per coulomb, and has the same
    dimension as electric potential difference. QUDT classifies it as a narrower kind of electric
    potential and voltage and remarks that the ISO system of quantities deprecates the term;
    Wikidata records source voltage as another name for it.

    Emf is a scalar. Its sign follows the direction in which the source pushes conventional
    current: it is positive when the source raises the potential of charges passing through it from
    the negative to the positive terminal. Chemical reactions provide it in cells, the magnetic
    force on moving conductors provides it in generators, as Faraday's law describes, and light
    provides it in solar cells.

    A real source has internal resistance, so when it delivers current its terminal voltage falls
    below the emf by the product of the current and that resistance. Emf is therefore found as the
    terminal voltage with no current drawn, or from the terminal voltage at several known currents.
    HyperPhysics gives about 1.5 volts for a fresh carbon-zinc cell, and a lead-acid car battery
    joins six cells to supply about 12 volts.

    According to OpenStax, Alessandro Volta coined the term in the 1800s, when he built the voltaic
    pile, the first battery. HyperPhysics notes that the name is kept for historical reasons and
    that it helps to separate voltages generated by a source from the voltage drops in resistors,
    where energy is dissipated. In ordinary use the emf of a battery and its voltage are often
    treated as the same, which holds only when no current flows.
