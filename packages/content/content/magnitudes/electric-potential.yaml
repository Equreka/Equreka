description:
  en: >-
    Electric potential, symbol $V$, is the electric potential energy that a small test charge would
    have at a point in an electric field, divided by that charge. Because the charge cancels out,
    the potential describes the field at every point by a single number that does not depend on the
    test charge. It is also called the electrostatic or electric scalar potential, and it is always
    stated relative to a chosen reference point.

    The SI unit is the volt, symbol V, equal to one joule per coulomb and, in base units, to one
    kilogram square metre per second cubed per ampere. The dimension of potential is therefore
    energy divided by charge. Potential difference and electromotive force share both the unit and
    the dimension.

    Potential is a scalar that can be positive, negative or zero, and its zero is a matter of
    choice. For isolated charges the reference is usually placed infinitely far away, so
    the potential near a positive point charge is positive and near a negative one is negative; in
    practical measurements the potential of the ground is often taken as zero. QUDT defines the potential at a point by integrating the
    electric field along a path from that point out to infinity, a result independent of the
    path only when the field does not change with time.

    Since only differences can be observed, a voltmeter always compares the point of interest with
    the reference. Values range from about 1.5 volts between the terminals of a fresh dry cell and
    12 volts for a car battery to the 5000 volts that accelerate electrons in the electron gun
    described by OpenStax. On the atomic scale, energies are given in electronvolts, the energy an
    elementary charge gains across one volt.

    Electric potential is not electric potential energy: potential is energy per unit charge, so a
    small and a large battery with the same voltage hold very different energies. It also differs
    from potential difference, or voltage, which compares two points, and from the electric field,
    whose strength is the rate at which the potential changes with distance.
