# yaml-language-server: $schema=../../dist/schemas/magnitudes.schema.json
name:
  en: 'Luminous flux'
symbol:
  tex: '\Phi_{v}'
  text: 'Φv'
baseUnit: 'lumen'
dimension:
  J: 1
  A: 2
nonNegative: true
categories:
  - 'physics'
description:
  en: >-
    In photometry, luminous flux or luminous power is the measure of the perceived power of light.
    It differs from radiant flux, the measure of the total power of electromagnetic radiation
    (including infrared, ultraviolet, and visible light), in that luminous flux is adjusted to
    reflect the varying sensitivity of the human eye to different wavelengths of light.
