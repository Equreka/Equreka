name:
  en: 'Radiant flux'
symbol:
  tex: '\Phi _{\mathrm {e}}'
  text: 'Φe'
baseUnit: 'watt'
dimension:
  L: 2
  M: 1
  T: -3
categories:
  - 'physics'
description:
  en: >-
    In radiometry, radiant flux or radiant power is the radiant energy emitted, reflected,
    transmitted or received, per unit time, and spectral flux or spectral power is the radiant flux
    per unit frequency or wavelength, depending on whether the spectrum is taken as a function of
    frequency or of wavelength. The SI unit of radiant flux is the watt ($W$), that is the joule per
    second ($\frac{J}{s}$) in SI base units, while that of spectral flux in frequency is the watt
    per hertz ($\frac{W}{Hz}$) and that of spectral flux in wavelength is the watt per metre
    ($\frac{W}{m}$)—commonly the watt per nanometre ($\frac{W}{nm}$).
