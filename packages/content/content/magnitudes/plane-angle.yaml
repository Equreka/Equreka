description:
  en: >-
    Plane angle is the geometric quantity that measures the opening between two rays leaving a
    common vertex, or equivalently the amount of turning in a plane needed to bring one ray onto
    the other. It is the angle of school geometry and trigonometry, and in mechanics it gives the
    angular position of a rotating body.

    The coherent SI unit is the radian: the angle at the centre of a circle that cuts off an arc
    exactly as long as the radius, so an angle in radians is the ratio of arc length to radius. A
    full turn is $2\pi\,\mathrm{rad}$ and a right angle is half of pi radians. The SI treats plane
    angle as a quantity with the unit one, writing rad to make clear that an angle is meant; the
    20th CGPM settled that status in 1995 by ending the separate class of supplementary units. The
    degree, $1^{\circ}=(\pi/180)\,\mathrm{rad}$, with its minute and second of arc, is a non-SI
    unit still in wide use, and astronomers work in arcseconds and smaller.

    Plane angle is a scalar that may carry a sign. In the usual convention an angle measured
    counterclockwise from a reference direction is positive and a clockwise one negative, and the
    angular position of a spinning body keeps growing beyond one full turn, so values above
    $2\pi\,\mathrm{rad}$ count completed revolutions.

    Protractors, theodolites, goniometers and rotary encoders measure angles directly. The Moon
    seen from the Earth spans about 1900 arcseconds, close to half a degree, and the axis of the
    Earth is tilted about 23.44 degrees from the perpendicular to its orbit.

    Plane angle is often confused with solid angle, its three-dimensional counterpart measured in
    steradians. A frequent practical error is feeding degrees into a formula that expects radians,
    such as the arc length rule or the series for the sine.
