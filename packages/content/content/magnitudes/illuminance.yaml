description:
  en: >-
    Illuminance, symbol $E_{\mathrm{v}}$, is the luminous flux incident on a surface divided by the area
    that receives it: the amount of visible light, weighted by the spectral sensitivity of the
    human eye, that falls on each square metre of a real or imaginary surface at a given point. It
    is the photometric quantity used to judge whether a desk, a corridor or a road is lit well
    enough for a task.

    Its SI unit is the lux, symbol lx, equal to one lumen per square metre. The SI Brochure lists
    the lux among the units with special names and expresses it as the candela steradian per
    square metre. The dimension of illuminance is therefore luminous intensity divided by length
    squared, with the solid angle of the steradian carried along explicitly.

    Illuminance is a non-negative scalar. It describes light received, not light emitted, and it
    depends on the position and orientation of the surface. From a small source it falls with the
    square of the distance: a lamp of luminous intensity one candela gives one lux on a surface
    facing it one metre away and a quarter of a lux at two metres.

    Most light meters read illuminance directly. The UK Health and Safety Executive recommends
    average illuminances of about 20 lux for corridors and vehicle routes, 200 lux for offices and
    500 lux for work with fine detail such as drawing offices or the assembly of electronic
    components. The CIE vocabulary defines illuminance as incident luminous flux per unit area
    at a point of a surface, and notes that it can also be derived from spectral irradiance
    weighted by the eye's spectral luminous efficiency.

    Illuminance is often confused with luminous flux and with luminance. Luminous flux, in lumens,
    is the total light a source emits; illuminance is that flux per unit area where it lands;
    luminance, in candelas per square metre, describes how bright a surface appears from a given
    direction. The radiometric counterpart is irradiance, which counts radiant power without
    weighting by the eye. The older foot-candle, one lumen per square foot, equals about 10.76 lux.
