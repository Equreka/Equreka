name:
  en: 'Speed'
symbol:
  tex: 'v'
baseUnit: 'metre-per-second'
dimension:
  L: 1
  T: -1
nonNegative: true
categories:
  - 'physics'
description:
  en: >-
    In everyday use and in kinematics, the speed (commonly referred to as v) of an object is the
    magnitude of the rate of change of its position with time or the magnitude of the change of its
    position per unit of time; it is thus a scalar quantity.
