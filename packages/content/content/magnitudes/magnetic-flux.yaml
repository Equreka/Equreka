description:
  en: >-
    Magnetic flux is the scalar quantity of electromagnetism that measures how much magnetic
    field passes through a surface: the magnetic flux density integrated over the surface, each
    element of area counting only the part of the field perpendicular to it. For a uniform field
    crossing a flat area it is the field times the area times the cosine of the angle between the
    field and the normal to the surface.

    Its coherent SI unit is the weber, equal to the tesla square metre and to the volt second; in
    SI base units it is the kilogram square metre per second squared per ampere, so the dimension
    is length squared times mass divided by time squared and electric current. The weber was
    defined in 1946 as the flux that, linking a single turn and falling steadily to zero in one
    second, induces one volt in that turn.

    Flux is a scalar, but it carries a sign set by the chosen direction of the normal to the
    surface: it is positive when the field crosses along the normal and negative when it crosses
    against it. Through a closed surface the total flux is always zero, because magnetic field
    lines form closed loops. For a coil of several tightly wound turns, the flux through one turn
    multiplied by the number of turns gives the flux linkage of the coil.

    It is measured with fluxmeters, or worked out from the voltage induced in a coil while the
    flux through it changes. A one-square-metre loop held perpendicular to the field of the
    Earth, about half a gauss, encloses roughly $5\times10^{-5}\,\mathrm{Wb}$. The older CGS unit, the maxwell, is exactly
    $10^{-8}\,\mathrm{Wb}$.

    Magnetic flux is often confused with magnetic flux density, which is flux per unit area and
    is measured in teslas. Its rate of change drives electromagnetic induction, which Michael
    Faraday studied in a series of experiments in 1831; the weber is named after the physicist Wilhelm
    Weber.
