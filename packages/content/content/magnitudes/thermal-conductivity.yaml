description:
  en: >-
    Thermal conductivity, symbol $\lambda$ and in many textbooks $k$, is the property of a material
    that measures how readily heat passes through it by conduction, without any bulk motion of the
    material. It is the rate of heat flow per unit cross-sectional area divided by the temperature
    gradient along the flow: through a flat slab, the conducted power equals the conductivity times
    the area times the temperature difference across the slab, divided by its thickness.

    The SI unit is the watt per metre kelvin, listed in the SI Brochure among the coherent derived
    units, and the dimension is mass times length divided by time cubed and by thermodynamic
    temperature. Because temperature differences are equal in kelvins and degrees Celsius, a value
    in watts per metre degree Celsius is the same number.

    Thermal conductivity is a positive scalar; the direction of the heat flow comes from the
    temperature gradient, always from hot to cold, not from the conductivity. Its value depends on
    temperature. In metals, mobile electrons carry both electric current and heat, so a metal that
    conducts electricity well also conducts heat well, a link expressed by the Wiedemann-Franz law.
    Non-metallic solids conduct through vibrations of their crystal lattice, and gases conduct
    poorly because their molecules are far apart.

    The conductivity of a sample is found by maintaining a known temperature difference across it
    and measuring the steady heat flow. Copper, at about $390\,\mathrm{W/(m\,K)}$ near the freezing
    point of water, conducts some seventeen thousand times better than still air, and diamond
    exceeds copper about fivefold. Good insulators such as glass wool, down and polystyrene foam owe
    their performance to small pockets of trapped air; the ratio of an insulating layer's thickness
    to its conductivity is the R factor quoted for building insulation.

    Thermal conductivity, a property of a material, differs from the thermal resistance of a
    particular wall or rod, which also depends on its length and area. It also differs from
    electrical conductivity, although in metals the two are closely tied.
