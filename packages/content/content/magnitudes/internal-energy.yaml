description:
  en: >-
    Internal energy, symbol $U$ and also called thermodynamic energy, is the energy a thermodynamic
    system holds at the scale of its atoms and molecules. It is the total of the kinetic energy of
    every particle, counting translation, rotation and vibration relative to the centre of mass of
    the system, plus the potential energy of the forces the particles exert on one another. Carrying
    the system somewhere else, or lifting it, leaves this total unchanged.

    Like every form of energy it is measured in joules, with the dimension of mass times length
    squared divided by time squared, and QUDT classes it as a narrower kind of energy. It is a
    scalar and a function of state: its value is fixed by the present condition of the system, such
    as its temperature and volume, whatever sequence of processes led there. For that reason
    thermodynamics works with its changes, which the first law of thermodynamics accounts for as
    $\Delta U=Q-W$: heat flowing into the system and work done by the system both count as positive,
    so a positive change means the system has gained energy.

    No instrument reads internal energy itself; its changes are obtained from calorimetry and from
    measured work. In an ideal monatomic gas the particles are single atoms that do not interact, so
    the internal energy is purely translational kinetic energy, proportional to the absolute
    temperature and independent of pressure and volume. In liquids and solids the forces between
    molecules store a large share: the same temperature rise costs far more energy for water than
    for an equal mass of copper, because much of what water absorbs goes into intermolecular
    potential energy.

    Internal energy is often confused with heat and with temperature. Heat is energy crossing the
    boundary of a system because of a temperature difference, so a body contains internal energy but
    never contains heat. Temperature follows the average kinetic energy of the particles rather than
    the total stored energy, which is why ice melting at its melting point keeps absorbing energy
    while its temperature stays the same.
