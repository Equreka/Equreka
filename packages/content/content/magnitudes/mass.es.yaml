# yaml-language-server: $schema=../../dist/schemas/magnitudes.locale.schema.json
name: 'Masa'
description: >-
  La masa es la magnitud básica de la mecánica que mide cuánto se opone un cuerpo a un cambio en
  su movimiento y con qué intensidad participa en la atracción gravitatoria. En la segunda ley de
  Newton es el factor que relaciona la fuerza con la aceleración, y en la ley de la gravitación de
  Newton determina la atracción entre dos cuerpos.

  Su unidad básica en el SI es el kilogramo, y su dimensión se escribe M. Desde la revisión del SI
  de 2019, el kilogramo se define fijando la constante de Planck en exactamente
  $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$, lo que, junto con las definiciones del metro y del
  segundo, determina la unidad de masa.

  La masa es un escalar y nunca es negativa, y en la mecánica ordinaria la masa de un cuerpo
  compuesto es la suma de las masas de sus partes. A diferencia del peso, no depende del lugar: un
  cuerpo tiene la misma masa en el suelo, en órbita y en la Luna.

  Las balanzas miden la masa comparando un cuerpo desconocido con masas de referencia, de modo que
  el resultado no depende de la gravedad local, mientras que los dinamómetros de resorte leen una
  fuerza y deducen de ella la masa. Los valores van desde el dalton, unos
  $1.66\times10^{-27}\,\mathrm{kg}$, usado para átomos y moléculas, pasando por la tonelada de 1000
  kilogramos del comercio, hasta la masa de la Tierra, cercana a $5.97\times10^{24}\,\mathrm{kg}$.

  En el habla cotidiana se confunden masa y peso; la 3.ª CGPM declaró en 1901 que la masa tiene
  por unidad el kilogramo y que el peso pertenece a la misma clase de magnitud que la fuerza. Desde 1889
  el kilogramo era la masa de un prototipo de platino e iridio guardado en el BIPM. Las
  comparaciones periódicas mostraron que las masas de sus copias nacionales se iban alejando de
  la suya, con una mediana de unos 25 microgramos en la verificación de 1989 a 1991, y la 26.ª CGPM adoptó en 2018 la
  definición basada en la constante de Planck.
