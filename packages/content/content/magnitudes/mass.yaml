description:
  en: >-
    Mass is the base quantity of mechanics that measures how much a body resists a change in its
    motion and how strongly it takes part in gravitational attraction. In Newton's second law it is
    the factor linking force to acceleration, and in Newton's law of gravitation it sets the pull
    between two bodies.

    The SI base unit is the kilogram, and the dimension is written M. Since the 2019 revision of
    the SI the kilogram is defined by fixing the Planck constant at exactly
    $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$, which, together with the definitions of the
    metre and the second, determines the unit of mass.

    Mass is a scalar and never negative, and in ordinary mechanics the mass of a combined body is
    the sum of the masses of its parts. Unlike weight, it does not depend on location: a body has
    the same mass on the ground, in orbit and on the Moon.

    Balances measure mass by comparing an unknown body with reference masses, so the result does
    not depend on local gravity, while spring scales read a force and infer mass from it.
    Values range from the dalton, about $1.66\times10^{-27}\,\mathrm{kg}$, used for atoms and
    molecules, through the tonne of 1000 kilograms used in trade, to the mass of the Earth, close to
    $5.97\times10^{24}\,\mathrm{kg}$.

    Mass and weight are confused in everyday speech; the 3rd CGPM declared in 1901 that mass
    has the kilogram as its unit and that weight belongs to the same kind of quantity as force. From 1889
    the kilogram was the mass of a platinum-iridium prototype kept at the BIPM. Periodic
    comparisons showed the masses of its national copies drifting away from it, by a median of
    about 25 micrograms in the 1989 to 1991 verification, and the 26th CGPM adopted the Planck-constant definition in 2018.
