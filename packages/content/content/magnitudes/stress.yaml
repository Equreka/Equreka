description:
  en: >-
    Stress, or mechanical stress, is the internal force per unit area that neighbouring parts of a
    deformed solid exert on each other across an imagined cut through the material. It is the
    basic load measure of continuum mechanics and strength of materials: tensile stress arises
    when a body is stretched, compressive stress when it is squeezed along one direction, bulk
    stress when it is squeezed from all sides, and shear stress when forces act parallel to the cut.

    The SI unit is the pascal, one newton per square metre, the same unit as pressure, so the
    dimension is mass divided by length and by time squared. Because materials withstand large
    stresses, engineers usually work in megapascals and gigapascals, and in the pound per square
    inch where customary units persist.

    On a single chosen plane, stress splits into a normal component, perpendicular to the plane,
    and a shear component lying in it. The full state of stress at a point, which links the force
    on a cut to the orientation of the cut, is a tensor rather than a single number. In mechanics
    of materials a tensile normal stress is counted as positive and a compressive one as negative.

    Stress cannot be read directly; strain gauges measure the small deformation it produces, and
    the stress follows from the elastic modulus of the material. A textbook example finds about
    $128\,\mathrm{kPa}$ of compression in a granite pillar carrying a statue, and about
    $1.8\times10^{8}\,\mathrm{Pa}$ of tension in a steel rod that suspends heavy equipment.

    Stress is often confused with strain, the dimensionless relative deformation that a stress
    causes, and with pressure. A fluid at rest cannot withstand a shearing force, so its state of
    stress reduces to a pressure acting equally in every direction, whereas a solid can carry shear.
