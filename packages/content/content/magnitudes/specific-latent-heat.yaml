description:
  en: >-
    Specific latent heat, symbol $L$, is the energy per unit mass that a substance absorbs or gives
    out while it changes phase at a fixed temperature and pressure. Its two everyday forms are the
    specific latent heat of fusion, which applies to melting and freezing, and its counterpart for
    vaporization, which applies to boiling and condensation. The heat needed for a whole sample is
    its mass multiplied by this quantity.

    The SI unit is the joule per kilogram, and the dimension is length squared divided by time
    squared, the same as that of any energy per unit mass. Tables usually quote kilojoules per
    kilogram. The gray and the sievert, the units of absorbed dose and dose equivalent, share this
    dimension; the SI Brochure explains that they received special names so that a radiation dose is
    never mistaken for some other quantity in joules per kilogram.

    It is a positive scalar, quoted for the direction in which the substance takes in energy:
    melting and vaporization absorb heat, while freezing and condensation release exactly the same
    amount per kilogram. Throughout the change the temperature holds steady, because the energy goes
    into loosening the attraction between molecules and, during vaporization, into the work the
    vapour does as it expands, rather than into faster molecular motion.

    It is measured by calorimetry, for instance by dropping carefully dried ice into warm water and
    recording how far the water cools; ice that is already wet gives a value that is too low. For
    water at normal atmospheric pressure, fusion takes $334\,\mathrm{kJ/kg}$ and vaporization
    $2256\,\mathrm{kJ/kg}$, almost seven times as much. Among the substances of a standard
    textbook table, the values run from about one sixtieth of that fusion figure, for helium melting
    under high pressure, to about five times the vaporization figure of water, for boiling
    aluminium.

    Specific latent heat is often confused with specific heat capacity. Latent heat is energy per
    kilogram for a change of phase with no change of temperature, whereas specific heat capacity is
    energy per kilogram for each kelvin of warming.
