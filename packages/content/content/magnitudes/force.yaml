description:
  en: >-
    Force is the vector quantity of mechanics that describes a push or a pull exerted on a body by
    another body or by a field, able to change the body's state of motion or to deform it. The net
    force acting on a body equals the rate of change of its momentum, which for a body of constant
    mass is its mass multiplied by its acceleration.

    The SI unit is the newton, the force that gives a mass of one kilogram an acceleration of one
    metre per second squared; in base units it is $\mathrm{kg\,m\,s^{-2}}$, so the dimension is
    length times mass divided by time squared. Older units include the dyne of the CGS system,
    equal to ten micronewtons, and the pound-force and kilogram-force of gravitational systems.

    A force has both a size and a direction, and forces acting on the same body add as vectors.
    Along a chosen axis, each component is positive when it points in the positive direction of
    that axis and negative otherwise. Forces always come in pairs: when one body pushes on a second,
    the second pushes back on the first with a force of equal size and opposite direction, and the
    two forces act on different bodies.

    Spring scales, force gauges and load cells measure force through the deformation it causes in
    an elastic element. Near the surface of the Earth, gravity pulls on a one-kilogram object with
    about $9.80\,\mathrm{N}$, while the water behind a large dam presses on the dam with
    roughly $1.6\times10^{10}\,\mathrm{N}$.

    Force differs from pressure, which is force divided by the area over which it acts, and from
    energy and momentum, which describe the effect of a force acting over a distance or over a
    time. Weight is one particular force, the pull of gravity; mass, by contrast, is not a force at
    all.
