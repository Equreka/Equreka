description:
  en: >-
    Electric flux is the surface integral of the electric field strength over a surface: each small
    patch of the surface contributes the component of the field along the patch's normal times the
    patch's area, and the contributions are summed. It counts how much electric field passes
    through the surface, and it is the quantity that Gauss's law relates to the charge enclosed.

    Its coherent SI unit is the volt metre, the same unit as the newton square metre per coulomb,
    and its dimension is length cubed times mass divided by time cubed and by electric current. For
    a flat surface in a uniform field it reduces to the field strength times the area times the
    cosine of the angle between the field and the normal.

    Electric flux is a signed scalar. Its sign depends on the normal chosen: a field crossing along
    the normal gives a positive flux and one crossing against it a negative flux. For a closed
    surface the normal points outward, so field lines leaving the surface count positive and those
    entering count negative.

    The flux is seldom measured directly; it is computed from a known or measured field, or from
    the enclosed charge divided by the vacuum electric permittivity. A field of 10 volts per metre
    through 6.0 square metres at 30 degrees from the normal gives about 52 volt metres, while a
    closed surface around a charge of 2.0 microcoulombs carries about $2.3\times10^{5}\,\mathrm{V\,m}$
    whatever its shape or size.

    Electric flux is not the magnetic flux, measured in webers, nor the flux of the electric
    displacement, the quantity often written $\Psi$ and measured in coulombs. QUDT and
    Wikidata keep the two electric fluxes as separate kinds; OpenStax writes the field flux as plain $\Phi$, and in a vacuum it equals the displacement
    flux divided by the vacuum electric permittivity.
