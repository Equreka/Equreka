name:
  en: 'Energy'
symbol:
  tex: 'E'
baseUnit: 'joule'
dimension:
  L: 2
  M: 1
  T: -2
externalIds:
  wikidata: 'Q11379'
  qudt: 'http://qudt.org/vocab/quantitykind/Energy'
categories:
  - 'physics'
branches:
  - 'mechanics'
  - 'thermodynamics'
description:
  en: >-
    In physics, energy is the quantitative property that must be transferred to an object in order
    to perform work on, or to heat, the object. Energy is a conserved quantity; the law of
    conservation of energy states that energy can be converted in form, but not created or
    destroyed. The SI unit of energy is the joule, which is the energy transferred to an object by
    the work of moving it a distance of 1 metre against a force of 1 newton.
