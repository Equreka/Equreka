description:
  en: >-
    Absorbed dose, symbol $D$, is the energy that ionizing radiation deposits in matter divided by
    the mass of that matter. It is the basic physical quantity of radiation dosimetry, the radiation
    dose that radiotherapy, medical imaging and radiation protection start from, whether the
    radiation is made of X-rays, gamma rays, charged particles or neutrons.

    Its SI unit is the gray, $\mathrm{Gy}$, the special name of the joule per kilogram, so its
    dimension is length squared divided by time squared, the same as that of specific energy. The
    15th CGPM adopted the gray in 1975, and the CIPM later allowed it also for kerma and for the
    specific energy imparted. The older rad equals exactly 0.01 gray.

    Absorbed dose is a scalar that cannot be negative, and it always refers to a specified material
    at a given place, such as soft tissue in one organ. It is a purely physical quantity that ignores
    the kind of radiation: a gray of alpha particles and a gray of gamma rays deposit the same energy
    in each kilogram, yet the alpha particles do far more biological harm.

    Organ doses are calculated or measured for each tissue that is exposed, and they are the first
    step in any estimate of radiation risk. Medical imaging works in milligrays: a chest CT scan
    gives the thyroid about 10 milligrays, and a brain CT scan gives the lens of the eye about 60
    milligrays.

    Absorbed dose is easily mistaken for equivalent dose and effective dose, which correct it for the
    kind of radiation and for how sensitive each organ is and are expressed in sieverts, and for
    activity, which describes the source rather than the irradiated body. In 1953 the ICRU gave the
    name rad to the unit of absorbed dose; the SI unit that replaced it honours the British
    radiobiologist Louis Harold Gray.
