description:
  en: >-
    Optical power, also called dioptric power or refractive power, symbol $P$, is one over the focal
    length of a lens, a curved mirror or a complete optical system. It measures how strongly the
    element bends a beam of parallel rays towards a focus or away from one: the shorter the focal
    length, the greater the power.

    Its coherent SI unit is the reciprocal metre, and its dimension is inverse length. Optics and
    eye care express it in dioptres, a name that European Union law permits for the vergence of
    optical systems with one dioptre equal to one reciprocal metre. A lens with a focal length of
    half a metre therefore has a power of two dioptres.

    Optical power is a signed scalar. Under the real-is-positive sign convention used in school
    optics, a converging lens or a concave mirror has a positive power and a diverging lens or a
    convex mirror a negative one; a flat window or a plane mirror has zero power.

    The power of a lens is found by measuring its focal length, for instance by focusing a distant
    object onto a screen, and taking the reciprocal in metres. OpenStax gives 1.0 to 3.5 dioptres
    for common reading glasses, 12.5 dioptres for a magnifier with an 8.00 cm focal length, and
    between 50.0 and 54.0 dioptres for the whole human eye, of which the cornea supplies about two
    thirds.

    Optical power is not power in the sense of energy per unit time, measured in watts, although
    laser and fibre work often uses the same words for the radiant power of a beam. It also differs
    from wavenumber, which shares the dimension and the reciprocal metre but counts the wavelengths
    of a wave per unit length. QUDT files the dioptre under curvature rather than under a separate
    quantity kind.
