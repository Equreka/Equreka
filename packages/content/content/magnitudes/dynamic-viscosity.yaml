description:
  en: >-
    Dynamic viscosity, also called shear viscosity or viscosity for short, is the property of a
    fluid that measures its internal friction: the shear stress needed to make neighbouring layers
    of a liquid or gas slide past one another, divided by the rate at which the flow speed changes
    across the layers. It is the quantity that makes honey flow more slowly than water in fluid
    mechanics.

    Its SI unit is the pascal second, which the SI Brochure lists among the coherent derived units
    whose names contain a unit with a special name; in base units it is the kilogram per metre per
    second, so the dimension is mass divided by length and time. The poise of the CGS system equals
    exactly one tenth of a pascal second, and the centipoise equals one millipascal second.

    Viscosity is a scalar and is never negative. A fluid with negligible viscosity is called ideal,
    an approximation used in many flow problems; in a real fluid flowing through a pipe, the layer
    touching the wall stays at rest and the speed is greatest along the axis.

    It can be found by dragging a flat plate over a thin film of fluid and measuring the force, or
    by timing the flow through a narrow tube. Air at 20 degrees Celsius has about
    $1.81\times10^{-5}\,\mathrm{Pa\,s}$, water about one millipascal second, glycerine about
    $1.5\,\mathrm{Pa\,s}$ and honey several pascal seconds. Heating lowers the viscosity of a liquid
    but raises that of a gas.

    Dynamic viscosity is not the same as kinematic viscosity, the ratio of dynamic viscosity to
    density, measured in square metres per second. The idea goes back to Isaac Newton, whose
    Principia of 1687 assumed that the resistance between sliding layers of a fluid grows with the
    speed at which they separate.
