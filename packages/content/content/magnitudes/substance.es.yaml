# yaml-language-server: $schema=../../dist/schemas/magnitudes.locale.schema.json
name: 'Cantidad de sustancia'
description: >-
  La cantidad de sustancia, de símbolo $n$, mide el tamaño de una muestra por el número de
  entidades elementales especificadas que contiene: átomos, iones, moléculas, electrones, otras
  partículas o grupos definidos de partículas. Con ella la química cuenta partículas en porciones
  que pueden pesarse, y es una de las siete magnitudes básicas del SI. En los textos
  químicos suele abreviarse como cantidad, por ejemplo cantidad de agua.

  Su unidad SI es el mol, de símbolo mol, y su dimensión básica se escribe N. Desde el 20 de mayo
  de 2019 un mol contiene exactamente $6.022\,140\,76\times10^{23}$ entidades elementales, el valor
  numérico fijado para la constante de Avogadro expresada en moles a la menos uno. La definición anterior,
  adoptada por la 14.ª CGPM en 1971, vinculaba el mol al carbono-12 fijando la masa molar
  de ese isótopo en exactamente 12 gramos por mol.

  La cantidad de sustancia es un escalar no negativo, y solo tiene sentido una vez nombrada la
  entidad: un mol de moléculas de hidrógeno contiene dos moles de átomos de hidrógeno. El folleto
  del SI pide indicar la entidad, preferiblemente con su fórmula química, y la magnitud se nombra
  en consecuencia, por ejemplo cantidad de cloruro de hidrógeno. Es extensiva, de modo que al
  reunir dos muestras de la misma sustancia se suman sus cantidades.

  La cantidad rara vez se cuenta directamente. Suele obtenerse dividiendo una masa medida entre la
  masa molar, o a partir del volumen, la presión y la temperatura de un gas. Con una masa molar de unos 18
  gramos por mol, un solo gramo de agua contiene unos 33 000 trillones de moléculas. Un mol de gas ideal a 273.15 kelvin y 100 kilopascales ocupa unos 22.71
  litros.

  La cantidad de sustancia se confunde a menudo con la masa y con el simple número de entidades,
  que es un número puro; la constante de Avogadro convierte entre cantidad y número. Llamarla
  número de moles nombra la magnitud por su unidad, igual que llamar a la masa número de
  kilogramos.
