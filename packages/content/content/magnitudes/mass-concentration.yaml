description:
  en: >-
    Mass concentration is the mass of one constituent B of a mixture divided by the volume of the
    whole mixture, $\gamma_{\mathrm{B}}=m_{\mathrm{B}}/V$. It states how many grams or kilograms of a
    dissolved or suspended substance are held in a given volume of a solution, of water or of air,
    and it is the usual measure for solutes in body fluids and for pollutants.

    Its SI unit is the kilogram per cubic metre, the same coherent unit as density, and the SI
    Brochure lists it separately for each of the two quantities. The dimension is mass divided by
    length cubed. One gram per litre equals exactly one kilogram per cubic metre, so values in the
    two units are numerically identical, and the milligram per litre serves for trace substances.
    IUPAC gives the symbol $\gamma$ and also allows $\rho$.

    Mass concentration is a scalar and is never negative. It refers to the volume of the whole
    solution, so it shifts slightly with temperature as the solution expands or contracts. QUDT
    files it as a narrower kind of density: adding the mass concentrations of every constituent of
    a mixture gives the density of the mixture.

    It is measured by dissolving a weighed mass of substance in a measured volume, or by evaporating
    a known volume of solution and weighing what remains. Physiological saline holds 9 grams of
    sodium chloride per litre, and the fasting level of glucose in blood lies near 0.7 to 1.0 grams
    per litre, which medical reports write as 70 to 100 milligrams per decilitre.

    Mass concentration is not the same as mass fraction, which divides by the mass of the mixture
    and has no unit. It differs from amount concentration by the molar mass of the substance,
    $\gamma_{\mathrm{B}}=M_{\mathrm{B}}c_{\mathrm{B}}$, since amount concentration counts moles
    rather than kilograms.
