# yaml-language-server: $schema=../../dist/schemas/magnitudes.locale.schema.json
name: 'Calor'
description: >-
  El calor, de símbolo $Q$, es la energía que se transfiere entre un sistema y su entorno a causa
  de una diferencia de temperatura, a diferencia de la energía transferida como trabajo o
  arrastrada a través de la frontera por la materia. Por sí solo, el calor pasa de un cuerpo más
  caliente a otro más frío hasta que ambos alcanzan la misma temperatura.

  Como cantidad de energía, el calor se expresa en julios, de símbolo J, y tiene la dimensión de
  la energía. El folleto del SI recoge la cantidad de calor junto a la energía y el trabajo bajo
  el julio, y en 1948 la 9.ª CGPM resolvió que las cantidades de calor se expresaran en julios. La
  caloría, definida a partir del calentamiento del agua, sobrevive en nutrición, donde la Caloría
  alimentaria es una kilocaloría, unos 4186 julios.

  El calor es un escalar cuyo signo se fija por convención. En el primer principio de la
  termodinámica tal como suele escribirse en física, el calor es positivo cuando entra en el
  sistema y negativo cuando sale, y la variación de energía interna es igual al calor recibido
  menos el trabajo realizado por el sistema. El calor no es una función de estado: el mismo cambio
  de estado puede lograrse calentando, realizando trabajo o combinando ambos, de modo que no puede
  decirse que un cuerpo tenga una cantidad definida de calor.

  El calor se mide por calorimetría, a partir del cambio de temperatura de una sustancia de masa y
  capacidad calorífica específica conocidas o de la masa que se funde o hierve. Fundir 50 gramos de
  hielo a 0 grados Celsius requiere unos 16.8 kilojulios. En 1843 James Joule calentó agua
  removiéndola con paletas movidas por pesas en caída y comprobó que el aumento de temperatura era
  proporcional al trabajo realizado, lo que estableció la equivalencia energética entre calor y
  trabajo.

  El calor se confunde a menudo con la temperatura, que describe lo caliente que está un cuerpo y
  no cuánta energía cruza su frontera, y con la energía interna, la energía microscópica total que
  contiene un sistema. QUDT clasifica el calor como una clase más restringida de energía térmica,
  que a su vez es una clase de energía.
