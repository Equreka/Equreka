description:
  en: >-
    Solid angle is the three-dimensional counterpart of the plane angle: it measures how large an
    object or a surface appears from a given point. Lines drawn from that point to every point of
    the object's outline form a cone, and the solid angle is the area that this cone cuts out of a
    sphere centred on the point, divided by the square of the sphere's radius. The quantity belongs
    to geometry and is used throughout radiometry and photometry.

    The coherent SI unit is the steradian, the solid angle at the centre of a sphere subtended by a
    patch of its surface whose area equals the square of the radius. A whole sphere seen from its
    centre therefore subtends $4\pi\,\mathrm{sr}$, and a hemisphere half that. Like the radian,
    the steradian is treated in the SI as the unit one; it is kept in unit symbols, especially in
    photometry, to separate quantities such as luminous intensity, measured in candela or lumen per
    steradian, from luminous flux. The CIPM in 1980 and the 20th CGPM in 1995 classed the radian
    and steradian as dimensionless derived units.

    Solid angle is a scalar and is never negative; a closed surface surrounding the point
    subtends the full $4\pi\,\mathrm{sr}$, the largest possible value.

    Solid angles are seldom measured directly. They are computed from the geometry of the
    arrangement, such as the distance to a source and the area of a detector, or from the angular
    size of an object. The full Moon, about 1900 arcseconds across as seen from the Earth, covers
    roughly $6.6\times10^{-5}\,\mathrm{sr}$, a small fraction of the sky.

    Solid angle is distinct from plane angle, and the two are not interchangeable even though both
    carry the unit one. A solid angle also says nothing about shape: a circular cone, a square
    pyramid and an irregular patch of sky that cut equal areas from the same sphere subtend equal
    solid angles.
