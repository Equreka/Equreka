description:
  en: >-
    Surface charge density is the electric charge carried per unit area of a surface: the charge
    on a small patch divided by the area of that patch, in the limit of a vanishing patch. It
    describes charge spread in a layer much thinner than the distances of interest, such as the
    excess charge on the surface of a conductor, a charged plastic sheet or the plates of a
    capacitor.

    Its coherent SI unit is the coulomb per square metre, which the SI Brochure lists by name for
    this quantity, and its dimension is time times electric current divided by length squared.

    It is a signed scalar that carries the sign of the charge: positive where the surface holds an
    excess of positive charge and negative where electrons are in excess. One surface can be
    positive in one region and negative in another, as on a neutral conductor placed in an external
    field.

    It is usually found from the field it produces. Immediately outside a conductor the field equals the
    surface charge density divided by the vacuum electric permittivity, so a measured field gives
    the charge per area. Plates carrying $6.81\times10^{-7}\,\mathrm{C/m^{2}}$, an OpenStax example,
    produce about 77 kilovolts per metre between them. Air breaks down at about 3.0 megavolts per
    metre, which limits a conductor surrounded by air to roughly
    $2.7\times10^{-5}\,\mathrm{C/m^{2}}$.

    Surface charge density is distinct from the volume charge density, in coulombs per cubic metre,
    and the linear charge density of a thin wire, in coulombs per metre. It shares its unit with
    the electric displacement, also called electric flux density, a vector field rather than a
    property of a surface; at the face of a conductor the two are equal in size. Textbooks write it
    $\sigma$, while QUDT and Wikidata also give the symbol rho with a subscript A.
