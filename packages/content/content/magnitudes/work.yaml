name:
  en: 'Work'
symbol:
  tex: 'W'
baseUnit: 'joule'
dimension:
  L: 2
  M: 1
  T: -2
kindOf: 'energy'
externalIds:
  wikidata: 'Q42213'
  qudt: 'http://qudt.org/vocab/quantitykind/Work'
categories:
  - 'physics'
branches:
  - 'mechanics'
  - 'thermodynamics'
description:
  en: >-
    In physics, work is the energy transferred to or from an object via the application of force
    along a displacement. In its simplest form, it is often represented as the product of force and
    displacement. A force is said to do positive work if (when applied) it has a component in the
    direction of the displacement of the point of application. A force does negative work if it has
    a component opposite to the direction of the displacement at the point of application of the
    force.
