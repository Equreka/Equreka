description:
  en: >-
    Equivalent dose, symbol $H$, is the absorbed dose of ionizing radiation multiplied by a
    dimensionless factor that expresses how much biological damage a given type of radiation does
    for each joule it deposits. Also called dose equivalent, it is the quantity of radiation
    protection that lets exposures to alpha particles, beta particles, gamma rays and neutrons be
    compared and added on one scale of harm to human tissue.

    Its SI unit is the sievert, $\mathrm{Sv}$, which like the gray equals the joule per kilogram, so
    the dimension is again length squared over time squared. The 16th CGPM gave this unit its own
    name in 1979 because confusing absorbed dose with equivalent dose could lead to an
    underestimated risk. The older rem equals exactly 0.01 sievert.

    Equivalent dose is a scalar that is never negative. Since a 2002 CIPM decision, the SI Brochure
    explains it as the product of the absorbed dose and a quality factor that depends on the
    energy and kind of radiation, $H=QD$. The International Commission on Radiological Protection
    applies a close relative to each organ or tissue, weighting its absorbed dose with a radiation
    weighting factor of 1 for beta particles and gamma rays and 20 for alpha particles.

    It is obtained by calculation, applying weighting factors to absorbed doses that are measured
    or estimated. Values are small fractions of a sievert in daily life: natural sources give a
    worldwide average of about 2.4 millisieverts a year, and the annual dose limit for radiation
    workers in the United States is 0.05 sievert.

    Two quantities share its unit and its confusion. Absorbed dose, in grays, is the unweighted
    physical energy per kilogram; effective dose adds up the equivalent doses of all organs, each
    multiplied by a tissue weighting factor, and is the figure quoted for a whole person. The
    sievert is named after the Swedish radiation-protection researcher Rolf Sievert.
