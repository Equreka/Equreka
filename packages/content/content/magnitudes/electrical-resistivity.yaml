description:
  en: >-
    Electrical resistivity, symbol $\rho$, is the material property that expresses how much a
    substance hinders the passage of electric current, regardless of the size or shape of the
    piece. It is the reciprocal of electrical conductivity. For a uniform conductor, the
    resistance equals the resistivity multiplied by the length and divided by the cross-sectional
    area.

    Its SI unit is the ohm metre, symbol $\Omega\,\mathrm{m}$. A material has a resistivity of one
    ohm metre when a cube of it one metre on each edge shows a resistance of one ohm between two
    opposite faces. In base units the ohm metre is the kilogram cubic metre per second cubed per
    ampere squared, which is the dimension of resistance multiplied by a length.

    Resistivity is a positive scalar quoted at a stated temperature, because it changes as the
    material warms. In most metals it rises with temperature, as the vibrating atoms scatter the
    moving electrons more often, while in carbon and in semiconductors it falls. Over moderate
    ranges the change is close to linear and is described by a temperature coefficient of
    resistivity.

    Resistivity is found by measuring the resistance of a sample of known length and
    cross-section. Its values span more than twenty powers of ten. OpenStax tabulates, at 20 °C,
    $1.68\times10^{-8}\,\Omega\,\mathrm{m}$ for copper, with silver slightly lower; pure silicon
    and germanium lie many orders of magnitude higher, and fused quartz reaches about
    $7.5\times10^{17}\,\Omega\,\mathrm{m}$.

    Resistivity describes a material, whereas resistance describes a particular object: a long,
    thin copper wire and a short, thick copper bar share one resistivity but have very different
    resistances. Its low resistivity, together with its strength and ductility, is why copper is
    the usual metal for electrical wiring.
