description:
  en: >-
    Inductance, or self-inductance, is the property of an electric circuit or coil that relates
    the magnetic flux it produces to the current that produces it: the total flux linked with the
    circuit divided by that current. Because a changing flux induces a voltage, inductance also
    sets how strongly a coil resists any change in its own current.

    Its coherent SI unit is the henry, equal to the weber per ampere and to the volt second per
    ampere; in SI base units it is the kilogram square metre per second squared per square
    ampere, so the dimension is length squared times mass divided by time squared and by current
    squared. A circuit has an inductance of one henry when a current changing steadily by one
    ampere each second induces one volt in it, the definition the CIPM adopted in 1946.

    Self-inductance is a scalar and, with the usual convention that relates the normal of the
    loop and its current through the right-hand rule, it is always positive. The induced voltage always
    opposes the change in current, as Lenz's law requires, so an inductor slows the growth of a
    current and also resists its decrease. Like capacitance, it is a geometric quantity: for a
    coil in air it depends on the shape, the size and the number of turns, not on the current.

    It is measured from the voltage across a coil while its current changes at a known rate: if
    a current rising by 50 amperes per second induces 20 millivolts, the inductance is
    $0.40\,\mathrm{mH}$. An inductor carrying a current stores energy in its
    magnetic field, equal to half the inductance times the square of the current.

    Inductance is distinct from mutual inductance, which links the flux through one coil to the
    current in a neighbouring coil and is also measured in henries; transformers rely on a large
    mutual inductance, while traffic-light sensors buried in roads detect the change in
    self-inductance caused by a car above them. The henry honours the
    American scientist Joseph Henry, who discovered induced voltages independently of Faraday.
