name:
  en: 'Thermodynamic temperature'
symbol:
  tex: 'T'
baseUnit: 'kelvin'
dimension:
  Th: 1
nonNegative: true
externalIds:
  wikidata: 'Q264647'
  qudt: 'http://qudt.org/vocab/quantitykind/ThermodynamicTemperature'
categories:
