description:
  en: >-
    Thermodynamic temperature is the measure of absolute temperature and is one of the principal
    parameters of thermodynamics. A thermodynamic temperature reading of zero denotes the point at
    which the fundamental physical property that imbues matter with a temperature, transferable
    kinetic energy due to atomic motion, begins. In science, thermodynamic temperature is measured
    on the Kelvin scale and the unit of measure is the $kelvin$ ($K$).
