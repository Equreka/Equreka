description:
  en: >-
    The Stefan-Boltzmann constant, symbol $\sigma$, has the CODATA 2022 value
    $5.670\,374\,419\ldots\times10^{-8}\,\mathrm{W\,m^{-2}\,K^{-4}}$. It is exact, with no
    uncertainty, because NIST expresses it through the Planck constant, the Boltzmann constant and
    the speed of light in vacuum, whose values the SI has fixed by definition since 2019. Its
    decimal expansion never ends, so any printed value is cut short.

    The constant measures how strongly a perfect absorber, a black body, radiates: the total power
    such a body emits per square metre of surface, summed over all wavelengths, equals the constant
    multiplied by the fourth power of its absolute temperature. Real surfaces radiate less, by a
    factor called the emissivity, which lies between zero for a perfect reflector and one for a
    black body.

    It is the coefficient of the Stefan-Boltzmann law, $P=\sigma AT^{4}$, which gives the power
    radiated by a surface from its area in square metres and its temperature in kelvins; for an
    ordinary object the right side is multiplied by its emissivity, and the net exchange with
    surroundings depends on the difference of the fourth powers of the two temperatures. NIST
    relates it to other constants through $\sigma=(\pi^{2}/60)k^{4}/(\hbar^{3}c^{2})$. Astronomers
    combine the law with a star's surface temperature to estimate the power it emits.

    Josef Stefan concluded empirically in 1879, from Tyndall's measurements of the radiation of a
    heated platinum wire, that the total radiation of a body grows as the fourth power of its
    absolute temperature, and used the relation to estimate the temperature of the surface of the
    Sun. In 1884 Ludwig Boltzmann, his former student, derived the same law from thermodynamics. The
    2019 revision of the SI made its value exact.
