description:
  en: >-
    The speed of light in vacuum, symbol $c$, is the speed at which light and every other kind of
    electromagnetic radiation travel through empty space. Its value is exactly
    $299\,792\,458\,\mathrm{m/s}$, close to 300 000 kilometres per second. The value is exact
    because the metre has been defined through it since 1983, and since 20 May 2019 it has been one
    of the seven constants whose fixed values define the International System of Units (SI).

    In special relativity the speed of light bounds every motion: accelerating any body that
    has mass up to it would require energy without limit, and nothing that carries matter,
    energy or information travels faster. The SI Brochure groups it with the Planck constant as a
    truly fundamental constant, one that fixes the properties of space and time and acts alike on
    all particles and fields.

    The constant sets the scale of mass-energy equivalence, in which the rest energy of a body is its
    mass times the square of the speed of light. In electromagnetism it links the two vacuum
    constants: the product of the magnetic permeability and the electric permittivity of vacuum
    equals one over its square, a relation that stayed exact when the 2019 redefinition made each of
    them a measured quantity. For any light wave in vacuum it equals the frequency times the
    wavelength.

    Louis Essen at the National Physical Laboratory obtained 299 792 kilometres per second for
    the speed of light in 1946 and refined it to 299 792.5 kilometres per second in 1950. Laser
    measurements of frequency and wavelength led the 15th CGPM in 1975 to recommend 299 792 458 metres per second as the value, and in 1983 the 17th CGPM redefined the metre as the distance light
    covers in vacuum in 1/299 792 458 of a second, which made that value exact.
