description:
  en: >-
    The neutron mass, symbol $m_{\mathrm{n}}$, is the rest mass of a free neutron. Its CODATA 2022
    recommended value is $1.674\,927\,500\,56(85)\times10^{-27}\,\mathrm{kg}$, a measured value with
    a relative standard uncertainty of $5.1\times10^{-10}$, and it was not fixed by the 2019
    redefinition of the SI.

    The neutron is the electrically neutral constituent of atomic nuclei. It is slightly heavier
    than the proton, by about 0.14 percent, a mass difference whose energy equivalent is about
    1.293 megaelectronvolts, and its own rest energy is about 939.57 megaelectronvolts. Outside a
    nucleus the neutron is unstable and decays with a mean life of about 878 seconds, which
    corresponds to a half-life of about 10 minutes.

    The neutron mass enters the mass defect and binding energy of every nucleus, the difference
    between the summed masses of the separate protons and neutrons and the mass of the nucleus they
    form, converted to energy with the square of the speed of light. Together with the speed of a
    neutron it also gives the momentum and kinetic energy of that neutron.

    James Chadwick showed in 1932 that the penetrating radiation from beryllium struck by alpha
    particles consists of neutral particles with about the mass of the proton, the neutron. Being
    uncharged, the neutron is not weighed in an ion trap, and its mass is obtained indirectly: the wavelength of the gamma ray emitted when a neutron is captured by a proton gives
    the binding energy of the deuteron, and the deuteron and proton masses then fix the neutron
    mass.
