# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Constante de estructura fina'
description: >-
  La constante de estructura fina, de símbolo $\alpha$, es el número adimensional que mide la
  intensidad de la interacción electromagnética entre las partículas cargadas y la luz. Su valor
  recomendado CODATA 2022 es $7.297\,352\,5643(11)\times10^{-3}$, cercano a 1/137, con una
  incertidumbre típica relativa de $1.6\times10^{-10}$; su inverso vale unos 137.035 999 177. Es
  una constante medida, no fijada por la definición del SI.

  En magnitudes del SI equivale al cuadrado de la carga elemental dividido entre cuatro pi por la
  permitividad eléctrica del vacío, la constante de Planck reducida y la velocidad de la luz. Al ser
  un número puro, tiene el mismo valor en cualquier sistema de unidades. En el modelo de Bohr es el
  cociente entre la rapidez del electrón en la primera órbita y la velocidad de la luz, y fija el
  tamaño de la estructura fina, el pequeño desdoblamiento de las líneas espectrales del hidrógeno
  que dio nombre a la constante.

  Enlaza muchas constantes atómicas: la constante de Rydberg es proporcional a su cuadrado, el radio
  de Bohr a su inverso, y la energía de Hartree es igual a su cuadrado por la energía en reposo del
  electrón. Desde que la redefinición de 2019 fijó la carga elemental, la permeabilidad magnética
  del vacío ha dejado de ser exacta y se obtiene a partir de la constante de estructura fina medida,
  con la misma incertidumbre relativa. El folleto del SI añade que los límites experimentales a una
  posible variación de la constante con el tiempo son demasiado pequeños para afectar a las
  medidas prácticas.

  Arnold Sommerfeld introdujo la constante en 1916, al ampliar la teoría de Bohr con órbitas
  elípticas y mecánica relativista para explicar la estructura fina del hidrógeno. Hoy sus valores
  más precisos proceden de la anomalía del momento magnético del electrón, medida y combinada con la
  electrodinámica cuántica, y de experimentos de retroceso atómico con cesio y rubidio; como estas
  determinaciones discrepan ligeramente, CODATA 2022 amplió sus incertidumbres en un factor de 2.5.
