name: 'Pi'
description: >-
  Pi, que se escribe $\pi$, es el número de veces que el diámetro de una circunferencia cabe en su longitud, en la geometría euclidiana, el mismo para cualquier circunferencia sea cual sea su tamaño. Es un
  número puro, de aproximadamente 3.14159, e irracional: su desarrollo decimal no termina nunca ni
  se vuelve periódico, de modo que todo valor escrito, por largo que sea, es un truncamiento. Las aproximaciones 3.14 y 22/7 bastan para la aritmética cotidiana.

  Como todas las circunferencias son copias a escala unas de otras, la longitud crece en proporción
  exacta al diámetro, y pi es esa proporción fija. El mismo número rige el área: Euclides demostró
  que las áreas de dos círculos guardan la misma razón que los cuadrados de sus diámetros, y la
  constante de esa proporción es la cuarta parte de pi si se usa el diámetro, o pi mismo si se usa
  el radio. Los ángulos también lo heredan, pues media vuelta mide pi radianes.

  La longitud de una circunferencia es $2\pi$ veces su radio, y el área del círculo es pi por el
  cuadrado del radio. En trigonometría, el seno y el coseno se repiten cada $2\pi$ radianes, y por
  eso la constante aparece siempre que se describen movimientos periódicos, ondas o rotaciones,
  desde la frecuencia angular hasta la constante de Planck reducida, la constante de Planck dividida
  entre $2\pi$.

  Un valor mesopotámico de 25/8 y un valor egipcio cercano a 3.16, del papiro Rhind de hacia el
  1650 a. C., figuran entre las estimaciones más antiguas que se conocen. Arquímedes (287–212 a. C.)
  encerró pi entre 223/71 y 22/7 inscribiendo y circunscribiendo polígonos regulares de 96 lados.
  William Jones introdujo la letra griega para este cociente en 1706, la adopción de Euler a partir
  de 1737 convirtió la notación en estándar y Lambert demostró en 1761 que el número es irracional;
  más tarde Lindemann demostró que es trascendente, lo que zanjó que un círculo no puede cuadrarse
  con regla y compás.
