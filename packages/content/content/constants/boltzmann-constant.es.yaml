# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Constante de Boltzmann'
description: >-
  La constante de Boltzmann, de símbolo $k$ o $k_{\mathrm{B}}$, es el factor de proporcionalidad que
  convierte la temperatura termodinámica en energía a la escala de partículas individuales. Desde el
  20 de mayo de 2019 es una de las siete constantes definitorias del Sistema Internacional de
  Unidades (SI), fijada en exactamente $1.380\,649\times10^{-23}\,\mathrm{J/K}$; define el kelvin y
  no tiene incertidumbre.

  Al multiplicar una temperatura por la constante se obtiene una energía térmica característica por
  partícula. El folleto del SI subraya que la temperatura sigue a esta energía térmica, pero no
  necesariamente a toda la energía interna de un sistema. El factor es diminuto porque una sola
  molécula contiene muy poca energía: a 293 kelvin, o 20 grados Celsius, una temperatura ambiente habitual, la energía
  cinética media de traslación de una molécula de gas es de solo $6.07\times10^{-21}\,\mathrm{J}$.

  En la teoría cinética, el producto de la presión por el volumen de un gas ideal es igual al
  número de moléculas por la constante por la temperatura absoluta, y la energía cinética media de
  traslación de cada molécula vale tres medios de la constante por la temperatura, sea cual sea el
  gas. Multiplicada por la constante de Avogadro se convierte en la constante molar de los gases, la
  misma relación por mol. En física estadística enlaza la entropía de un sistema con el logaritmo
  del número de estados microscópicos accesibles.

  La constante lleva el nombre del físico austriaco Ludwig Boltzmann (1844–1906), que construyó la
  mecánica estadística sobre la probabilidad. Hasta 2019 el kelvin se definía mediante el punto
  triple del agua, fijado en exactamente 273.16 kelvin, y la constante debía medirse. Los valores
  decisivos procedieron de la termometría acústica de gases, que deduce la temperatura a partir de
  la rapidez del sonido en un gas, contrastada con la termometría de gas por constante dieléctrica
  y la termometría de ruido de Johnson. La redefinición exigía un método por debajo de una parte por
  millón y otro independiente que coincidiera dentro de tres partes por millón; una vez fijada la
  constante, el punto triple del agua pasó a ser una temperatura medida.
