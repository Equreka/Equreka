description:
  en: >-
    The reduced Planck constant, symbol $\hbar$ and read h-bar, is the Planck constant divided by
    two pi. Its CODATA 2022 value is $1.054\,571\,817\ldots\times10^{-34}\,\mathrm{J\,s}$, exact
    because the SI has fixed the Planck constant at $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$
    since 20 May 2019. Pi is irrational, so NIST publishes the endless decimal expansion truncated.

    The constant is the natural unit of quantum action and angular momentum. The Planck constant
    links a photon's energy to its ordinary frequency in hertz, while the reduced constant
    does the same for angular frequency in radians per second: the factor of two pi that links the
    two frequencies is absorbed into the constant. QUDT records it as a narrower form of the
    Planck constant for that reason.

    The reduced constant appears throughout quantum physics. In Bohr's 1913 model of the hydrogen
    atom, the angular momentum of the electron takes only whole-number multiples of it. The de
    Broglie relations give a particle a momentum equal to the reduced constant times the
    angular wavenumber and an energy equal to it times the angular frequency. By Heisenberg's uncertainty
    principle, half the reduced constant is a floor that the position and momentum uncertainties,
    multiplied together, never fall below.

    The value of the reduced constant has always followed that of the Planck constant. Until 2019
    the Planck constant was a measured quantity with an uncertainty; the 26th General Conference
    on Weights and Measures, in 2018, fixed its numerical value to define the kilogram, and the
    reduced constant, a fixed multiple of it, became exact at the same time.
