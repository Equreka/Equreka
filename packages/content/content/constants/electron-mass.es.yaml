# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Masa del electrón'
description: >-
  La masa del electrón, de símbolo $m_{\mathrm{e}}$, es la masa en reposo de un electrón libre. Su
  valor recomendado CODATA 2022 es $9.109\,383\,7139(28)\times10^{-31}\,\mathrm{kg}$, un valor
  medido con una incertidumbre típica relativa de $3.1\times10^{-10}$. No figura entre las siete
  constantes que definen el SI, así que tras la redefinición de 2019 sigue siendo una magnitud
  medida.

  El electrón es el componente ligero de todo átomo: el protón es unas 1836.15 veces más pesado, de
  modo que los electrones aportan poca masa a la materia, aunque determinan el tamaño de los
  átomos, el enlace químico y los espectros atómicos. Expresada como energía mediante el cuadrado de
  la velocidad de la luz, la masa del electrón corresponde a unos 0.511 megaelectronvoltios.

  La constante aparece en la mayoría de las fórmulas de la física atómica. La constante de Rydberg
  es proporcional a ella, el radio de Bohr es inversamente proporcional a ella, y la energía de
  Hartree, la unidad atómica de energía, es igual a la masa del electrón por el cuadrado del
  producto de la constante de estructura fina y la velocidad de la luz. También fija el cociente
  carga-masa del electrón y su longitud de onda Compton reducida.

  En 1897 J. J. Thomson demostró que los rayos catódicos están formados por electrones, y entre 1897
  y 1938 muchos experimentos midieron su cociente carga-masa desviando haces de electrones con
  campos eléctricos y magnéticos. El valor actual procede de un solo electrón ligado en un ion
  hidrogenoide de carbono o de silicio dentro de una trampa de Penning: comparar sus frecuencias de
  precesión del espín y de ciclotrón da la masa atómica relativa del electrón, y las medidas de
  retroceso atómico convierten después las masas atómicas en kilogramos.
