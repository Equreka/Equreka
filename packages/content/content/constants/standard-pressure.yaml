description:
  en: >-
    The standard pressure, symbol $p^{\circ}$, is exactly 100 000 pascals, which is 100 kilopascals
    or one bar. It is a reference value chosen by convention in physical chemistry, not a measured
    constant, so it has no uncertainty. It is also called the standard state pressure, and its
    symbol is also written $p^{\ominus}$.

    The value fixes the pressure of the standard states that thermodynamic tables refer to. The
    standard state of a gas is the hypothetical ideal gas at this pressure, and that of a pure
    liquid or solid is the substance itself under it; standard enthalpies of formation and standard
    Gibbs energies of reaction are tabulated on this basis. Nothing in physics forbids another
    reference pressure, so a text that departs from the bar has to declare its own.

    Dividing a partial pressure by $p^{\circ}$ gives a pure number, which is how a gas enters an
    equilibrium constant: at low pressures the constant written with partial pressures, divided by
    the standard pressure raised to the change in the amount of gas, approximates the dimensionless
    standard equilibrium constant. It is the companion of the standard amount concentration, and the
    relation between the pressure-based and concentration-based constants of a gas reaction involves
    their ratio through the molar gas constant, about 0.08314 per kelvin.

    Older tables were built on one standard atmosphere, 101 325 pascals, and that figure survives in
    many textbooks, OpenStax among them for standard temperature and pressure. The rounder bar
    became the IUPAC basis in 1982, and data from the atmosphere era are carried over to it by
    published conversion procedures. The bar itself, exactly 100 000 pascals, is a unit outside the
    SI.
