description:
  en: >-
    The reference sound intensity, symbol $I_{0}$, is exactly $10^{-12}\,\mathrm{W/m^{2}}$, one
    picowatt per square metre. Being fixed by agreement, not measured, it carries no uncertainty:
    ISO 1683 sets it as the reference for sound intensity levels in air and other gases, and the
    same value serves for water and other liquids. Because it lies close to the weakest sound that
    normal hearing detects, it is also called the threshold of hearing intensity.

    Physically it stands for a tone of 1000 hertz at the edge of audibility for a person with normal
    hearing. The standard notes that the reference decides whether a level comes out positive or
    negative, and that levels of one kind are best kept consistently positive; a reference this low
    does that for ordinary sounds, while a sound fainter than it has a negative level. ISO writes
    each such reference as the number one times an SI unit with a suitable prefix, here the picowatt
    per square metre.

    The reference appears in the sound intensity level, ten times the base-ten logarithm of an
    intensity divided by it. An intensity equal to the reference gives 0 decibels, and a loud rock
    concert at one watt per square metre is a million million times the reference, or 120 decibels.
    The SI Brochure requires the reference to be stated with any level given in decibels, since the
    same number of decibels means different intensities against different references.

    The value quoted here comes from the third edition of ISO 1683, published in 2015, which
    replaced the edition of 2008. Its table for air lists this intensity beside one picowatt of
    sound power and 20 micropascals of sound pressure, the references for sound power level and
    sound pressure level.
