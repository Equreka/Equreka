# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Constante de Planck'
description: >-
  La constante de Planck, de símbolo $h$, es el cuanto de acción: el factor que convierte la
  frecuencia de una radiación en la energía de uno de sus cuantos. Desde el 20 de mayo de 2019 es
  una de las siete constantes definitorias del Sistema Internacional de Unidades (SI), fijada en
  exactamente $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$; no tiene incertidumbre y define el
  kilogramo.

  Su unidad, el julio segundo, equivale al kilogramo metro cuadrado por segundo, la unidad que
  comparten la acción y el momento angular. La constante es tan pequeña que la cuantización pasa
  inadvertida en los objetos cotidianos, pero gobierna el comportamiento de los átomos, los
  electrones y la luz. El folleto del SI la agrupa con la velocidad de la luz como constantes
  verdaderamente fundamentales: la constante de Planck fija los efectos cuánticos, la velocidad de
  la luz la estructura del espacio-tiempo, y ambas actúan por igual sobre toda partícula y todo
  campo.

  La energía de un cuanto de radiación es la constante de Planck por la frecuencia, y al dividir la
  constante entre $2\pi$ se obtiene la constante de Planck reducida, presente en toda la mecánica
  cuántica. Combinada con la equivalencia entre masa y energía, esa misma relación enlaza la masa
  con la constante de Planck, y eso es lo que le permite definir el kilogramo. Junto con la carga
  elemental rige además el efecto Josephson y el efecto Hall cuántico, la base de los patrones
  eléctricos actuales.

  Max Planck introdujo la constante en 1900, al proponer que la radiación de una frecuencia dada
  solo se emite en cantidades discretas de energía, el paso que eliminó el fallo de la teoría clásica
  para la radiación térmica a frecuencias altas. Hasta 2019 el kilogramo era la masa del prototipo
  internacional y la constante debía medirse. Las balanzas de Kibble, ideadas por Bryan Kibble en el
  National Physical Laboratory en 1975, equilibran una masa con una fuerza electromagnética y
  comparan así la potencia mecánica con la eléctrica; la balanza NIST-4 alcanzó una incertidumbre de
  34 partes por mil millones. El valor fijado se eligió para que, en el momento de adoptarlo, el
  kilogramo siguiera igualando al prototipo con una incertidumbre típica relativa de una parte en
  cien millones.
