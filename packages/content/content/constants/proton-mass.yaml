description:
  en: >-
    The proton mass, symbol $m_{\mathrm{p}}$, is the rest mass of a free proton. Its CODATA 2022
    recommended value is $1.672\,621\,925\,95(52)\times10^{-27}\,\mathrm{kg}$, a measured value with
    a relative standard uncertainty of $3.1\times10^{-10}$. Like the masses of the other particles,
    it is not among the SI defining constants and remains a measured quantity after
    the 2019 redefinition.

    The proton is the nucleus of ordinary hydrogen, a single positively charged particle, and every
    atomic nucleus is built from protons and neutrons, with the number of protons, the atomic
    number, deciding the chemical element. The proton is about 1836.15 times as heavy as the
    electron, so nearly all the mass of an atom sits in its nucleus. Its rest energy is about 938.27
    megaelectronvolts.

    The ratio of the electron mass to the proton mass appears in the reduced-mass corrections to
    the energy levels of hydrogen and of simple molecular ions. Combined with the neutron mass, the
    proton mass gives the binding energy of nuclei: the deuteron, for example, weighs the sum of a
    proton and a neutron minus its binding energy divided by the square of the speed of light.

    The proton mass is determined through relative atomic masses. Penning-trap mass spectrometers
    cooled to a few kelvins compare the cyclotron frequencies of pairs of ions, such as protons,
    molecular hydrogen ions and highly charged carbon-12 ions, against the carbon-12 standard. Since
    2020 laser spectroscopy of the molecular ion HD+ has added independent constraints on the
    ratios of proton, deuteron and electron masses.
