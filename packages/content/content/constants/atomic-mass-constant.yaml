description:
  en: >-
    The atomic mass constant, symbol $m_{\mathrm{u}}$, also called the unified atomic mass
    constant, is the mass of one carbon-12 atom divided by twelve, the atom being unbound,
    motionless and in its lowest energy state. Its CODATA 2022 value is $1.660\,539\,068\,92(52)\times10^{-27}\,\mathrm{kg}$, a measured value with
    a relative standard uncertainty of $3.1\times10^{-10}$.

    The constant is the mass of the dalton, or unified atomic mass unit, expressed in kilograms: the
    SI Brochure gives the dalton this same CODATA 2022 value, uncertainty included. It sets the scale on which the masses of
    atoms and molecules are compared. A relative atomic mass, such as 12 exactly for carbon-12 or
    about 1.00727 for the proton, is the mass of the particle divided by the atomic mass constant.

    Multiplied by the Avogadro constant, the atomic mass constant gives the molar mass constant,
    $1.000\,000\,001\,05(31)\times10^{-3}\,\mathrm{kg/mol}$ in CODATA 2022. The SI Brochure writes
    the molar mass of an atom or a molecule as the Avogadro constant times its relative atomic mass
    times the atomic mass constant, which is how the mass of a single entity connects to the mass
    of one mole of it.

    The carbon-12 scale behind the constant dates from 1959 and 1960, when the international unions
    of physics and of chemistry replaced their two oxygen-based scales with a single one. From 1971
    until 2019 the mole was defined so that the molar mass of carbon-12 was exactly 0.012 kilograms
    per mole, which made the molar mass constant exact and left the uncertainty of the atomic mass
    constant tied to that of the Avogadro constant. Since the 2019 redefinition fixed the Avogadro
    constant instead, the molar mass constant is measured, and it now differs from one gram per
    mole by about one part in a thousand million.
