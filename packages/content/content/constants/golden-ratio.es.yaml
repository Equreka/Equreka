# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Número áureo'
description: >-
  El número áureo, escrito habitualmente $\varphi$, es el número irracional
  $\varphi=(1+\sqrt{5})/2$, aproximadamente 1.618. Un segmento queda dividido en la proporción
  áurea cuando el segmento entero es a su parte mayor como la parte mayor es a la menor; el número
  se conoce también como razón áurea, sección áurea y, en textos antiguos, razón extrema y media o
  divina proporción.

  Como contiene la raíz cuadrada de cinco, el número áureo carece de desarrollo decimal finito o
  periódico, así que todo valor decimal suyo es una aproximación. Es la raíz positiva de la
  ecuación de segundo grado en la que el cuadrado de un número es igual al número más uno, lo que
  le da dos propiedades poco comunes: su cuadrado lo supera exactamente en uno,
  $\varphi^{2}=\varphi+1$, y su inverso se queda exactamente en uno por debajo de él,
  $1/\varphi=\varphi-1$. La otra raíz de esa ecuación es negativa y vale uno menos el número
  áureo.

  En geometría la razón aparece en el pentágono regular, donde una diagonal mide $\varphi$ veces
  el lado, y por tanto en el pentagrama, el dodecaedro regular y el icosaedro. En álgebra es el
  límite de los cocientes de números de Fibonacci consecutivos, 1, 1, 2, 3, 5, 8, etcétera, y la
  fórmula cerrada de los números de Fibonacci se escribe con potencias de $\varphi$.

  Los Elementos de Euclides definen la división de un segmento en extrema y media razón y la usan
  para construir el pentágono regular y dos de los sólidos regulares. Pacioli la llamó divina
  proporción en un libro con ese título, y en 1597 Michael Mästlin dio el primer valor decimal
  conocido, en una carta a su antiguo alumno Kepler. El nombre de sección áurea aparece impreso
  hacia 1835. Las afirmaciones de que arquitectos antiguos y pintores se basaron en esta razón se
  repiten mucho, pero siguen siendo objeto de debate.
