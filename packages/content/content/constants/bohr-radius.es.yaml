name: 'Radio de Bohr'
description: >-
  El radio de Bohr, de símbolo $a_{0}$, es la unidad natural de longitud de la física atómica,
  igual al radio de la órbita electrónica más pequeña en el modelo de Bohr de un átomo de hidrógeno
  cuyo núcleo tiene masa infinita. Su valor recomendado CODATA 2022 es
  $5.291\,772\,105\,44(82)\times10^{-11}\,\mathrm{m}$, con una incertidumbre típica relativa de
  $1.6\times10^{-10}$; como las demás constantes atómicas, se mide y no lo fija el SI.

  El valor es algo mayor que medio ángstrom, y por eso los átomos y los enlaces químicos se miden en
  décimas de nanómetro. En mecánica cuántica el radio de Bohr ya no es el radio de una órbita, sino
  la escala de longitud de la nube electrónica del hidrógeno, la distancia más probable entre su
  electrón en el estado fundamental y un núcleo infinitamente pesado. Como unidad atómica de
  longitud recibe también el nombre de bohr.

  Puede escribirse como la constante de Planck reducida dividida entre el producto de la constante
  de estructura fina, la masa del electrón y la velocidad de la luz, o bien como cuatro pi por la
  permitividad eléctrica del vacío por el cuadrado de la constante de Planck reducida, dividido
  entre la masa del electrón y el cuadrado de la carga elemental. La energía de Hartree es el
  cuadrado de la carga elemental dividido entre cuatro pi por la permitividad del vacío por el radio
  de Bohr, y el producto del radio de Bohr por la constante de Rydberg es igual a la constante de
  estructura fina dividida entre cuatro pi.

  Niels Bohr presentó en 1913 su modelo cuantizado del átomo de hidrógeno, en el que el electrón
  solo puede ocupar órbitas prescritas, y recibió el Premio Nobel de Física de 1922 por su trabajo
  sobre la estructura atómica. El radio no se mide por sí solo: su valor recomendado se deduce de la
  constante de estructura fina y de la constante de Rydberg, y su incertidumbre relativa es en la
  práctica la de la constante de estructura fina.
