description:
  en: >-
    The fine-structure constant, symbol $\alpha$, is the dimensionless number that measures the
    strength of the electromagnetic interaction between charged particles and light. Its CODATA 2022
    recommended value is $7.297\,352\,5643(11)\times10^{-3}$, close to 1/137, with a relative
    standard uncertainty of $1.6\times10^{-10}$; its reciprocal is about 137.035 999 177. It is a
    measured constant, not one fixed by the definition of the SI.

    In SI quantities it equals the square of the elementary charge divided by four pi times the
    vacuum electric permittivity, the reduced Planck constant and the speed of light. Being a pure
    number, it has the same value in every system of units. In the Bohr model it is the ratio of the
    speed of the electron in the first orbit to the speed of light, and it sets the size of the fine
    structure, the small splitting of the spectral lines of hydrogen that gave the constant its
    name.

    It links many atomic constants: the Rydberg constant is proportional to its square, the Bohr
    radius to its reciprocal, and the Hartree energy equals its square times the rest energy of the
    electron. Since the 2019 redefinition fixed the elementary charge, the vacuum magnetic
    permeability is no longer exact and is obtained from the measured fine-structure constant, with
    the same relative uncertainty. The SI Brochure adds that experimental limits on any drift of the
    constant over time are far too small to affect practical measurements.

    Arnold Sommerfeld introduced the constant in 1916, when he extended the Bohr theory with
    elliptical orbits and relativistic mechanics to explain the fine structure of hydrogen. Today
    its most precise values come from the measured magnetic-moment anomaly of the electron combined
    with quantum electrodynamics, and from atom-recoil experiments with caesium and rubidium; these
    determinations disagree slightly, so CODATA 2022 expanded their uncertainties by a factor of 2.5.
