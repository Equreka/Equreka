# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Frecuencia de la transición hiperfina del cesio-133'
description: >-
  La frecuencia de la transición hiperfina del cesio-133, de símbolo $\Delta\nu_{\mathrm{Cs}}$, es la
  frecuencia de la radiación de microondas que absorbe o emite un átomo de cesio-133 no perturbado,
  en su estado fundamental, al pasar entre sus dos niveles hiperfinos. Su valor es exactamente
  $9\,192\,631\,770\,\mathrm{Hz}$, unos 9.19 gigahercios. Define el segundo y es una de las siete
  constantes definitorias del Sistema Internacional de Unidades (SI) desde mayo de 2019.

  En el cesio-133 el estado fundamental se desdobla en dos niveles hiperfinos muy próximos,
  identificados por los números cuánticos F = 4 y F = 3, y la radiación de esta frecuencia lleva el
  átomo de uno a otro. A diferencia de la constante de Planck o de la velocidad de la luz, esta
  frecuencia es una propiedad de un tipo de átomo y no una constante de la naturaleza. El folleto
  del SI advierte que los campos electromagnéticos pueden desplazarla, por lo que la definición se
  refiere a un átomo aislado y libre de todo campo externo, incluida la radiación térmica del
  entorno, y considera la elección una transición de referencia estable y bien comprendida.

  Un segundo abarca 9 192 631 770 periodos de esta radiación, y de él se deduce el
  hercio, el inverso del segundo. A través del segundo, la frecuencia entra también en las
  definiciones del metro, el kilogramo, el amperio, el kelvin y la candela; de las siete unidades
  básicas, solo el mol es independiente de ella. Los relojes primarios de cesio realizan el segundo,
  y sus señales combinadas, corregidas de los desplazamientos relativistas de frecuencia, forman las
  escalas de tiempo coordinadas que se usan en todo el mundo.

  En 1955 Louis Essen y J. V. L. Parry terminaron el primer reloj de cesio preciso en el NPL, el
  Laboratorio Nacional de Física británico. En 1964 el CIPM designó esta transición, a
  $9\,192\,631\,770\,\mathrm{Hz}$, como patrón de frecuencia provisional para las mediciones de
  tiempo en física, y la
  13.ª CGPM (1967/68) definió el segundo a partir de ella. La revisión de 2018 mantuvo el número y lo
  reformuló como valor fijo de una constante definitoria.
