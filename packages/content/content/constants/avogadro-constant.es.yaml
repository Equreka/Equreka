# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Constante de Avogadro'
description: >-
  La constante de Avogadro, de símbolo $N_{\mathrm{A}}$, da el número de entidades elementales que
  contiene un mol de cualquier sustancia. Es una de las siete constantes definitorias del Sistema
  Internacional de Unidades (SI): desde el 20 de mayo de 2019 su valor está fijado en exactamente
  $6.022\,140\,76\times10^{23}$ por mol, sin incertidumbre. Las mismas cifras sin la unidad reciben
  el nombre de número de Avogadro.

  La constante convierte entre dos maneras de expresar cuánta materia hay en una muestra. La
  cantidad de sustancia, magnitud básica del SI que se mide en moles, cuenta entidades en bloque,
  mientras que el número de entidades es un simple conteo cuya unidad es uno. Átomos, moléculas, iones,
  electrones y otros grupos definidos de partículas cuentan como entidades, de modo que
  toda cantidad debe indicar qué se cuenta: un mol de átomos de oxígeno y un mol de moléculas de
  oxígeno tienen el mismo número de entidades, pero masas distintas.

  El número de entidades de una muestra es su cantidad de sustancia multiplicada por la constante
  de Avogadro. La masa molar de una sustancia es igual a la constante por la masa de una entidad, y
  así la escala de masas atómicas se enlaza con los gramos por mol. Multiplicada por la constante
  de Boltzmann da la constante molar de los gases, y multiplicada por la carga elemental da la
  constante de Faraday, la carga de un mol de electrones.

  El nombre recuerda a Amedeo Avogadro (1776–1856), quien sostuvo que volúmenes iguales de gases a
  la misma temperatura y presión contienen el mismo número de moléculas. A comienzos del siglo XX se
  dio el nombre de número de Avogadro a la cantidad de moléculas de oxígeno que hay en una
  molécula-gramo de oxígeno, y pasó a ser la
  constante de Avogadro cuando el mol entró en el SI en 1971. Desde entonces y hasta 2019 el mol
  dependía de 0.012 kilogramos de carbono-12, así que la constante debía medirse; el valor fijado
  descansa sobre todo en el recuento de los átomos de esferas casi perfectas de silicio enriquecido
  en silicio-28, un proyecto de la International Avogadro Coordination iniciado en 2004.
