description:
  en: >-
    The luminous efficacy of monochromatic radiation of frequency 540 terahertz, symbol
    $K_{\mathrm{cd}}$, is the number of lumens of luminous flux produced by each watt of radiant
    power in green light of that single frequency. Its value is exactly $683\,\mathrm{lm/W}$, fixed by
    definition. It defines the candela, the base unit of luminous intensity, and it is one of the
    seven constants whose fixed values define the International System of Units (SI).

    Radiometric quantities measure electromagnetic power as such, in watts. Photometric quantities
    weight that power by how strongly a standard human observer perceives it, which gives the lumen
    and the candela. This constant is the exact bridge between the two at one frequency, chosen in
    the green part of the spectrum where daylight vision is close to its most sensitive. The SI
    Brochure calls it a technical constant: unlike the Planck constant or the speed of light, it
    expresses a convention about human vision, so its value could in principle have been chosen
    freely.

    One watt of radiant power at 540 terahertz therefore corresponds to 683 lumens, and the candela
    equals the luminous intensity, in a chosen direction, of a source emitting that radiation with a
    radiant intensity of one 683rd of a watt per steradian. At other wavelengths the luminous flux is
    the radiant flux weighted by the spectral luminous efficiency function for daylight vision,
    which the International Commission on Illumination (CIE) defined in 1924 with its peak at 555
    nanometres. The frequency 540 terahertz corresponds to 555.016 nanometres in standard air, close to
    but not exactly at that peak; the efficacy at 555 nanometres, 683.002 lumens per watt, is
    normally rounded to 683.

    Photometric units were long based on flames and glowing materials, from standard candles to
    heated platinum and later a black-body radiator. The 16th CGPM redefined the candela in 1979
    through monochromatic radiation at 540 terahertz and the factor 683, chosen so that the new unit
    matched the old one closely. The 2018 revision of the SI kept the same number and restated it as
    the fixed value of this constant.
