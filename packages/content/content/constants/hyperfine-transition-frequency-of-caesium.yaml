description:
  en: >-
    The hyperfine transition frequency of caesium-133, symbol $\Delta\nu_{\mathrm{Cs}}$, is the
    frequency of the microwave radiation absorbed or emitted when an unperturbed caesium-133 atom
    in its ground state passes between its two hyperfine levels. Its value is exactly
    $9\,192\,631\,770\,\mathrm{Hz}$, about 9.19 gigahertz. It defines the second and has been one
    of the seven constants whose fixed values define the International System of Units (SI) since 20 May 2019.

    In caesium-133 the ground state is split into two closely spaced hyperfine levels,
    labelled by the quantum numbers F = 4 and F = 3, and radiation at this frequency drives the atom
    from one to the other. Unlike the Planck constant or the speed of light, the frequency is a
    property of one kind of atom rather than a constant of nature. The SI Brochure notes that
    electromagnetic fields can shift it, so the definition refers to an isolated atom free of any
    external field, including ambient thermal radiation, and treats the choice as a well-understood,
    stable reference transition.

    One second spans 9 192 631 770 periods of this radiation, and the hertz, the
    reciprocal second, follows from it. Through the second the frequency also enters the definitions of the metre, the
    kilogram, the ampere, the kelvin and the candela; of the seven base units, only the mole is
    independent of it. Primary caesium clocks realize the second, and their combined signals,
    corrected for relativistic frequency shifts, build the coordinated time scales used worldwide.

    In 1955 Louis Essen and J. V. L. Parry completed the first accurate caesium clock at the NPL,
    the British National Physical Laboratory. In 1964 the CIPM named this transition, at
    $9\,192\,631\,770\,\mathrm{Hz}$, as a temporary frequency standard for time measurements in physics, and the 13th CGPM (1967/68)
    defined the second through it. The 2018 revision kept the number and restated it as the fixed
    value of a defining constant.
