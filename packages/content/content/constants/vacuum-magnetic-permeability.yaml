description:
  en: >-
    The vacuum magnetic permeability, symbol $\mu_{0}$, also called the magnetic constant or the
    permeability of free space, has the CODATA 2022 recommended value
    $1.256\,637\,061\,27(20)\times10^{-6}\,\mathrm{N\,A^{-2}}$, the same as henries per metre. It
    is a measured value with a relative standard uncertainty of $1.6\times10^{-10}$, and it
    agrees with the former exact value of four pi times ten to the minus seven henries per metre
    to within its standard uncertainty.

    It is the permeability of empty space: in vacuum the magnetic flux density equals this
    constant times the magnetic field strength. In SI units it sets how strongly electric currents
    produce magnetic fields and attract or repel one another, and it is the reference for the
    relative permeability of materials.

    The constant appears in the Biot-Savart law for the field of a current element, in the field
    inside a long solenoid, which equals the constant times the number of turns per metre times
    the current, and in the inductance of that solenoid. The energy density of a magnetic field is
    the square of the flux density divided by twice this constant, and its product with the
    vacuum electric permittivity equals one over the square of the speed of light.

    From 1948 the ampere was defined through the force between two parallel wires carrying
    current, a choice that fixed the magnetic constant at exactly four pi times ten to the minus
    seven. The 2019 revision of the SI defined the ampere by fixing the elementary charge instead,
    so the constant must now be measured. Its value comes in practice from the fine-structure
    constant, whose relative uncertainty it shares, and when the revision was adopted it was
    still equal to four pi times ten to the minus seven within that uncertainty.
