# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Velocidad de la luz en el vacío'
description: >-
  La constante $c$, velocidad de la luz en el vacío, mide la rapidez con que la luz y cualquier otra
  radiación electromagnética se propagan por el espacio vacío. Su valor es exactamente
  $299\,792\,458\,\mathrm{m/s}$, cerca de 300 000 kilómetros por segundo. El valor es exacto porque
  el metro se define a partir de él desde 1983, y desde el 20 de mayo de 2019 es una de las siete
  constantes definitorias del Sistema Internacional de Unidades (SI).

  En la relatividad especial, la velocidad de la luz es el límite máximo de rapidez: acelerar hasta
  ella un cuerpo con masa exigiría una cantidad infinita de energía, y nada que transporte materia,
  energía o información viaja más deprisa. El folleto del SI la agrupa con la constante de Planck
  como constante verdaderamente fundamental, que fija las propiedades del espacio y del tiempo y
  actúa por igual sobre todas las partículas y campos.

  La constante fija la escala de la equivalencia entre masa y energía, en la que la energía en
  reposo de un cuerpo es su masa por el cuadrado de la velocidad de la luz. En electromagnetismo
  enlaza las dos constantes del vacío: el producto de la permeabilidad magnética y la permitividad
  eléctrica del vacío es igual al inverso de su cuadrado, una relación que siguió siendo exacta
  cuando la redefinición de 2019 convirtió a cada una de ellas en una magnitud medida. Para
  cualquier onda luminosa en el vacío es igual a la frecuencia por la longitud de onda.

  Louis Essen, en el National Physical Laboratory, midió la velocidad de la luz en 299 792
  kilómetros por segundo en 1946 y la afinó a 299 792.5 kilómetros por segundo en 1950. Las medidas
  con láser de frecuencias y longitudes de onda llevaron a la 15.ª CGPM, en 1975, a recomendar 299 792 458 metros por segundo como valor, y en 1983 la 17.ª CGPM redefinió el metro como la
  distancia que recorre la luz en el vacío en 1/299 792 458 de segundo, con lo que ese valor pasó a
  ser exacto.
