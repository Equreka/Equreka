description:
  en: >-
    The electron mass, symbol $m_{\mathrm{e}}$, is the rest mass of a free electron. Its CODATA 2022
    recommended value is $9.109\,383\,7139(28)\times10^{-31}\,\mathrm{kg}$, a measured value with a
    relative standard uncertainty of $3.1\times10^{-10}$. It is not among the seven defining
    constants of the SI, so the 2019 redefinition of the units left it to experiment.

    The electron is the light partner in every atom: the proton is about 1836.15 times heavier, so
    electrons add only a small fraction to the mass of matter while governing the size of atoms,
    chemical bonding and atomic spectra. Expressed as energy through the square of the speed of
    light, the electron mass corresponds to about 0.511 megaelectronvolt.

    The constant enters most formulas of atomic physics. The Rydberg constant is proportional to it,
    the Bohr radius is inversely proportional to it, and the Hartree energy, the atomic unit of
    energy, equals the electron mass times the square of the product of the fine-structure constant
    and the speed of light. It also fixes the charge-to-mass quotient of the electron and its
    reduced Compton wavelength.

    In 1897 J. J. Thomson found that cathode rays are streams of electrons, and between 1897 and 1938
    many experiments measured their charge-to-mass ratio by deflecting electron beams with electric
    and magnetic fields. The modern value comes from a single electron bound in a hydrogen-like
    carbon or silicon ion inside a Penning trap: comparing its spin-precession and cyclotron
    frequencies gives the relative atomic mass of the electron, and atom-recoil measurements then
    convert atomic masses into kilograms.
