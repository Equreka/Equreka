name: 'Permeabilidad magnética del vacío'
description: >-
  La permeabilidad magnética del vacío, de símbolo $\mu_{0}$, llamada también constante magnética o
  permeabilidad del espacio libre, tiene el valor recomendado CODATA 2022
  $1.256\,637\,061\,27(20)\times10^{-6}\,\mathrm{N\,A^{-2}}$, lo mismo que henrios por metro. Es un
  valor medido con una incertidumbre típica relativa de $1.6\times10^{-10}$, y coincide con el
  antiguo valor exacto de cuatro pi por diez a la menos siete henrios por metro dentro de su
  incertidumbre típica.

  Es la permeabilidad del espacio vacío: en el vacío, la densidad de flujo magnético es igual a
  esta constante por la intensidad de campo magnético. En unidades SI fija con qué intensidad las
  corrientes eléctricas producen campos magnéticos y se atraen o se repelen entre sí, y es la
  referencia para la permeabilidad relativa de los materiales.

  La constante aparece en la ley de Biot-Savart para el campo de un elemento de corriente, en el
  campo dentro de un solenoide largo, igual a la constante por el número de espiras por metro por
  la corriente, y en la inductancia de ese solenoide. La densidad de energía de un campo magnético
  es el cuadrado de la densidad de flujo dividido entre el doble de esta constante, y su producto
  por la permitividad eléctrica del vacío es igual a uno dividido entre el cuadrado de la velocidad
  de la luz.

  Desde 1948 el amperio se definía mediante la fuerza entre dos hilos paralelos recorridos por
  corriente, una elección que fijaba la constante magnética en exactamente cuatro pi por diez a la
  menos siete. La revisión del SI de 2019 definió el amperio fijando en su lugar la carga
  elemental, de modo que ahora la constante debe medirse. En la práctica su valor procede de la
  constante de estructura fina, cuya incertidumbre relativa comparte, y cuando se adoptó la
  revisión seguía siendo igual a cuatro pi por diez a la menos siete dentro de esa incertidumbre.
