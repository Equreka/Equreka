# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Constante de gravitación universal'
description: >-
  La constante de gravitación universal, de símbolo $G$ y llamada a menudo «G grande», fija la
  intensidad de la atracción gravitatoria entre masas. Su valor recomendado CODATA 2022 es
  $6.674\,30(15)\times10^{-11}\,\mathrm{m^{3}\,kg^{-1}\,s^{-2}}$, un valor medido con una
  incertidumbre típica relativa de $2.2\times10^{-5}$. No es una de las siete constantes que
  definen el SI, por lo que la redefinición de las unidades de 2019 la dejó como magnitud medida.

  En la ley de la gravitación de Newton, $F=Gm_{1}m_{2}/r^{2}$, la constante convierte el
  producto de dos masas dividido entre el cuadrado de su separación en una fuerza en newtons. Su
  pequeñez explica por qué la gravedad entre objetos cotidianos pasa inadvertida, mientras que la
  enorme masa de un planeta o de una estrella hace que esa misma fuerza domine el movimiento de
  lunas, planetas y galaxias.

  Además de en la ley de fuerza, la constante aparece en la energía potencial gravitatoria de dos
  masas, en la intensidad del campo gravitatorio en la superficie de un planeta, en la rapidez
  orbital y el periodo orbital de un satélite, en la velocidad de escape de un planeta y en la
  tercera ley de Kepler, que relaciona el periodo de una órbita con su tamaño y con la masa del
  cuerpo central.

  La primera medida de laboratorio la hizo Henry Cavendish en 1798, con una balanza de torsión que
  detectaba la atracción entre bolas de plomo; expresó su resultado como la densidad de la Tierra,
  y equivale a un valor de la constante a menos de un uno por ciento del actual. Las balanzas de
  torsión siguen siendo la herramienta principal, pero los mejores experimentos modernos
  discrepan entre sí más de lo que permiten sus incertidumbres declaradas. En 2026 el NIST publicó
  una nueva determinación, fruto de diez años de trabajo con la balanza de torsión del BIPM
  instalada en el NIST, que añade datos a ese problema aún sin resolver.
