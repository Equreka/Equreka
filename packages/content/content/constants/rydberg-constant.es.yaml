name: 'Constante de Rydberg'
description: >-
  La constante de Rydberg, de símbolo $R_{\infty}$, es la constante de la física atómica que fija
  los números de ondas de las líneas espectrales del hidrógeno. Su valor recomendado CODATA 2022 es
  $10\,973\,731.568\,157(12)\,\mathrm{m^{-1}}$, un valor medido con una incertidumbre típica
  relativa de $1.1\times10^{-12}$; la redefinición del SI de 2019 no la fijó.

  El subíndice infinito señala el caso ideal de un núcleo de masa infinita. Multiplicada por la
  constante de Planck y la velocidad de la luz, la constante se convierte en la energía de Rydberg,
  de unos 13.6057 electronvoltios, que es la mitad de la energía de Hartree y fija la escala de las
  energías de enlace del átomo de hidrógeno. El hidrógeno real y sus isótopos requieren
  correcciones por la masa del núcleo.

  En función de constantes más básicas, la constante de Rydberg es igual al cuadrado de la constante
  de estructura fina por la masa del electrón por la velocidad de la luz, dividido entre el doble de
  la constante de Planck. En el modelo de Bohr, el número de ondas de una línea del hidrógeno es esta
  constante, corregida por la masa reducida, multiplicada por la diferencia entre los inversos de
  los cuadrados de los números cuánticos principales de los dos niveles, de modo que la constante
  enlaza los espectros atómicos con la masa del electrón y la constante de estructura fina.

  El físico sueco Johannes Rydberg había hallado ya en 1887 sus regularidades espectrales y las
  publicó en 1890, insistiendo en que una sola constante del hidrógeno debía figurar en todas las
  series. En 1913, el modelo del átomo de hidrógeno propuesto por Niels Bohr explicó por qué el
  hidrógeno solo emite esas longitudes de onda fijas. Hoy se obtiene comparando medidas precisas de
  frecuencias de transición en el hidrógeno y el deuterio atómicos con la electrodinámica cuántica,
  un ajuste que da también los radios de carga del protón y del deuterón.
