# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Carga elemental'
description: >-
  La carga elemental, de símbolo $e$, es la carga eléctrica de un protón y el valor absoluto de la
  carga de un electrón. Desde el 20 de mayo de 2019 es una de las siete constantes definitorias del
  Sistema Internacional de Unidades (SI), fijada en exactamente
  $1.602\,176\,634\times10^{-19}\,\mathrm{C}$; no tiene incertidumbre y define el amperio.

  La carga de un electrón libre, de un protón o de un ion es un múltiplo entero de esta cantidad:
  un electrón lleva menos una carga elemental, un protón más una y un átomo que ha perdido dos
  electrones más dos. El valor es minúsculo a escala cotidiana, pues un culombio corresponde a unos
  6.24 trillones de cargas elementales. El folleto del SI señala además que la carga elemental fija
  la intensidad de la interacción electromagnética a través de la constante de estructura fina, que
  la combina con la constante de Planck, la velocidad de la luz y la permitividad eléctrica del
  vacío.

  Multiplicada por la constante de Avogadro da la constante de Faraday, la carga de un mol de
  electrones, que enlaza la electrólisis con el recuento de átomos. El electronvoltio, la energía
  cinética que gana un electrón al atravesar una diferencia de potencial de un voltio, es igual a la
  carga elemental por un voltio y, desde la redefinición de 2019, es un múltiplo exacto del julio.
  Tanto el efecto Josephson como el efecto Hall cuántico, que proporcionan patrones de tensión
  eléctrica y de resistencia, dependen de la carga elemental junto con la constante de Planck.

  George Stoney propuso en 1874 una unidad natural de electricidad, a partir de las leyes de la
  electrólisis de Faraday, y a comienzos de la década de 1890 la llamó electrón. Los experimentos de
  la gota de aceite de Robert Millikan, publicados en su forma definitiva en 1913, mostraron que la
  carga se presenta en unidades discretas y midieron su tamaño. Desde 1948 el amperio se definía por
  la fuerza entre corrientes paralelas, de modo que la carga elemental no intervenía en la
  definición de las unidades; al fijarla en 2019, un amperio pasó a ser el paso de exactamente
  $1/(1.602\,176\,634\times10^{-19})$ cargas elementales por segundo.
