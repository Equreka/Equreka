name: 'Masa del neutrón'
description: >-
  La masa del neutrón, de símbolo $m_{\mathrm{n}}$, es la masa en reposo de un neutrón libre. Su
  valor recomendado CODATA 2022 es $1.674\,927\,500\,56(85)\times10^{-27}\,\mathrm{kg}$, un valor
  medido con una incertidumbre típica relativa de $5.1\times10^{-10}$, y la redefinición del SI de
  2019 no lo fijó.

  El neutrón es el componente sin carga eléctrica de los núcleos atómicos. Es algo más pesado que el
  protón, en torno a un 0.14 por ciento, una diferencia de masa cuyo equivalente energético es de
  unos 1.293 megaelectronvoltios, y su propia energía en reposo es de unos 939.57
  megaelectronvoltios. Fuera del núcleo, el neutrón es inestable y se desintegra con una vida media
  de unos 878 segundos, lo que corresponde a una semivida de unos 10 minutos.

  La masa del neutrón interviene en el defecto de masa y la energía de enlace de todo núcleo, la
  diferencia entre la suma de las masas de los protones y neutrones por separado y la masa del
  núcleo que forman, convertida en energía con el cuadrado de la velocidad de la luz. Junto con la
  rapidez de un neutrón, da también la cantidad de movimiento y la energía cinética de ese neutrón.

  James Chadwick demostró en 1932 que la radiación penetrante que emite el berilio bombardeado con
  partículas alfa está formada por partículas neutras con una masa parecida a la del protón: el
  neutrón. Al no tener carga, el neutrón no se pesa en una trampa de iones, y su masa se obtiene de
  forma indirecta: la longitud de onda del rayo gamma emitido cuando un protón captura un neutrón
  da la energía de enlace del deuterón, y las masas del deuterón y del protón fijan entonces la
  masa del neutrón.
