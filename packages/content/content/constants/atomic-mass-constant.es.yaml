# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Constante de masa atómica'
description: >-
  La constante de masa atómica, de símbolo $m_{\mathrm{u}}$, llamada también constante de masa
  atómica unificada, es la masa de un átomo de carbono-12 dividida entre doce, considerando el
  átomo sin enlazar, inmóvil y en su estado de menor energía. Su valor CODATA 2022 es
  $1.660\,539\,068\,92(52)\times10^{-27}\,\mathrm{kg}$, un valor medido con una incertidumbre
  típica relativa de $3.1\times10^{-10}$.

  La constante es la masa del dalton, o unidad de masa atómica unificada, expresada en kilogramos:
  el folleto del SI asigna al dalton este mismo valor CODATA 2022, incertidumbre incluida. Fija la escala con la que se
  comparan las masas de átomos y moléculas. Una masa atómica relativa, como exactamente 12 para el
  carbono-12 o unos 1.00727 para el protón, es la masa de la partícula dividida entre la constante
  de masa atómica.

  Multiplicada por la constante de Avogadro, la constante de masa atómica da la constante de masa
  molar, $1.000\,000\,001\,05(31)\times10^{-3}\,\mathrm{kg/mol}$ según CODATA 2022. El folleto del
  SI escribe la masa molar de cualquier átomo o molécula como la constante de Avogadro por su masa
  atómica relativa por la constante de masa atómica, y así la masa de una sola entidad se enlaza
  con la de un mol de ellas.

  La escala del carbono-12 en la que se basa la constante data de 1959 y 1960, cuando las uniones
  internacionales de física y de química sustituyeron sus dos escalas basadas en el oxígeno por una
  sola. De 1971 a 2019 el mol se definía de modo que la masa molar del carbono-12 era exactamente
  0.012 kilogramos por mol, lo que hacía exacta la constante de masa molar y ligaba la
  incertidumbre de la constante de masa atómica a la de la constante de Avogadro. Desde que la
  redefinición de 2019 fijó en su lugar la constante de Avogadro, la constante de masa molar es
  medida, y hoy difiere de un gramo por mol en alrededor de una parte en mil millones.
