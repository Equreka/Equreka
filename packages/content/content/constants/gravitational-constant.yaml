description:
  en: >-
    The Newtonian constant of gravitation, symbol $G$ and often called big G, sets the strength of
    the gravitational attraction between masses. Its CODATA 2022 recommended value is
    $6.674\,30(15)\times10^{-11}\,\mathrm{m^{3}\,kg^{-1}\,s^{-2}}$, a measured value with a relative
    standard uncertainty of $2.2\times10^{-5}$. It is not one of the seven defining constants of
    the SI, so the 2019 redefinition of the units left it a measured quantity.

    In Newton's law of universal gravitation, $F=Gm_{1}m_{2}/r^{2}$, the constant converts the
    product of two masses divided by the square of their separation into a force in newtons. Its
    tiny size explains why gravity between everyday objects goes unnoticed, while the enormous
    mass of a planet or a star makes the same force dominate the motion of moons, planets and
    galaxies.

    Beyond the force law, the constant enters the gravitational potential energy of two masses,
    the gravitational field strength at the surface of a planet, the orbital speed and orbital
    period of a satellite, the escape velocity from a planet and Kepler's third law, which ties
    the period of an orbit to its size and to the mass of the central body.

    The first laboratory measurement was made in 1798 by Henry Cavendish, who used a torsion
    balance to detect the attraction between lead balls; he reported his result as the density of
    the Earth, and it corresponds to a value of the constant within about one percent of today's.
    Torsion balances remain the main tool, yet the best modern experiments disagree with one
    another by more than their stated uncertainties. In 2026 NIST published a decade-long
    redetermination made with the BIPM torsion balance operated at NIST, adding new data to that
    unresolved puzzle.
