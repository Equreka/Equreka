name:
  en: 'Boltzmann constant'
symbol:
  tex: 'k'
symbolAlt:
  tex: 'k_{\rm {B}}'
  text: 'kB'
value: '1380649e-23'
unit: 'joule-per-kelvin'
exact: true
categories:
  - 'universal'
  - 'physics'
description:
  en: 'Boltzmann''s constant ($k$ or $k_{\rm {B}}$) is the physical constant that relates absolute
    temperature and energy. Named after the Austrian physicist Ludwig Boltzmann, who made important
    contributions to the theory of statistical mechanics, in fundamental equations this constant
    plays a central role. Its value is a fixed number without uncertainty (November 26, 2018 CGPM,
    effective from May 20, 2019)'
