description:
  en: >-
    The Boltzmann constant, symbol $k$ or $k_{\mathrm{B}}$, is the proportionality factor that
    converts thermodynamic temperature into energy at the scale of single particles. Since 20 May
    2019 it has been one of the seven constants whose fixed values define the International System of Units (SI),
    set at exactly $1.380\,649\times10^{-23}\,\mathrm{J/K}$; it defines the kelvin and carries no
    uncertainty.

    Multiplying a temperature by the constant gives a characteristic thermal energy per particle.
    The SI Brochure stresses that temperature tracks this thermal energy, though not necessarily the
    whole internal energy of a system. The factor is tiny because a single molecule holds very little
    energy: at 293 kelvin, or 20 degrees Celsius, a common room temperature, the mean translational kinetic energy of a gas
    molecule is only $6.07\times10^{-21}\,\mathrm{J}$.

    In kinetic theory, the product of the pressure and volume of an ideal gas equals the number of
    molecules times the constant times the absolute temperature, and the mean translational kinetic
    energy of each molecule is three halves of the constant times the temperature, whatever the gas.
    Scaled up by the Avogadro constant it becomes the molar gas constant, the same relation per mole.
    In statistical physics it links the entropy of a system to the logarithm of the number of
    microscopic states accessible to it.

    The constant bears the name of the Austrian physicist Ludwig Boltzmann (1844–1906), who built
    statistical mechanics on probability. Until 2019 the kelvin was defined by the triple point of
    water, set at exactly 273.16 kelvin, and the constant had to be measured. The decisive values came
    from acoustic gas thermometry, which infers temperature from the speed of sound in a gas, checked
    against dielectric-constant gas thermometry and Johnson noise thermometry. The redefinition
    required one method below one part per million and an independent one agreeing within three
    parts per million; once the constant was fixed, the triple point of water became a measured
    temperature.
