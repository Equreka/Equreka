description:
  en: >-
    The standard acceleration of gravity, symbol $g_{\mathrm{n}}$, is a conventional reference
    value for the acceleration of a body falling freely near the surface of the Earth, fixed at
    exactly $9.806\,65\,\mathrm{m/s^{2}}$. It is exact by definition, not by measurement: CODATA
    2022 lists it with no uncertainty, because it was adopted by agreement and never needs
    remeasuring.

    The real free-fall acceleration varies from place to place, above all with latitude and
    altitude, so no single measured number describes the whole planet. The standard value
    gives engineers and metrologists one agreed figure to use whenever a calculation needs an
    acceleration of gravity that does not depend on where it is done. It is a quantity of the same
    kind as any other acceleration, measured in metres per second squared.

    Several units and quantities rest on it. The standard weight of a body is the product of its
    mass and $g_{\mathrm{n}}$. The obsolete kilogram-force is the weight of one kilogram under
    standard gravity, $1\,\mathrm{kgf}=9.806\,65\,\mathrm{N}$, and the pound-force is defined the
    same way from the avoirdupois pound. The conventional millimetre of mercury and the
    conventional millimetre of water also use it to turn the height of a liquid column into a
    pressure.

    The 3rd CGPM adopted the value in 1901, in the same declaration that settled the difference
    between mass and weight, stating it as $980.665\,\mathrm{cm/s^{2}}$, a figure already written
    into the laws of some countries. The SI Brochure notes that the value served as the reference
    for the kilogram-force, which the NIST guide now lists among the units its authors should not
    use.
