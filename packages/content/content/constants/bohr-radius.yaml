description:
  en: >-
    The Bohr radius, symbol $a_{0}$, is the natural unit of length of atomic physics, equal to the
    radius of the smallest electron orbit in the Bohr model of a hydrogen atom whose nucleus is
    infinitely heavy. Its CODATA 2022 recommended value is
    $5.291\,772\,105\,44(82)\times10^{-11}\,\mathrm{m}$, with a relative standard uncertainty of
    $1.6\times10^{-10}$; like the other atomic constants it is measured, not fixed by the SI.

    The value is a little over half an ångström, which is why atoms and chemical bonds are measured
    in tenths of a nanometre. In quantum mechanics the Bohr radius is no longer the radius of an
    orbit but the length scale of the electron cloud of hydrogen, the most probable distance of its
    ground-state electron from an infinitely heavy nucleus. As the atomic unit of length it is also
    called the bohr.

    It can be written as the reduced Planck constant divided by the product of the fine-structure
    constant, the electron mass and the speed of light, or equivalently as four pi times the vacuum
    electric permittivity times the square of the reduced Planck constant, divided by the electron
    mass and the square of the elementary charge. The Hartree energy is the square of the elementary
    charge divided by four pi times the vacuum permittivity times the Bohr radius, and the product of
    the Bohr radius and the Rydberg constant equals the fine-structure constant divided by four pi.

    Niels Bohr introduced his quantized model of the hydrogen atom in 1913, with the electron
    allowed only on prescribed orbits, and received the 1922 Nobel Prize in Physics for his work on
    atomic structure. The radius is not measured on its own: its recommended value follows from the
    fine-structure constant and the Rydberg constant, and its relative uncertainty is essentially
    that of the fine-structure constant.
