description:
  en: >-
    The Avogadro constant, symbol $N_{\mathrm{A}}$, gives the number of elementary entities in
    one mole of any substance. It is one of the seven constants whose fixed values define the International System of Units (SI): since 20 May 2019 its value has been fixed at exactly
    $6.022\,140\,76\times10^{23}$ per mole, with no uncertainty. The same digits without the unit
    are called the Avogadro number.

    The constant converts between two ways of stating how much matter a sample holds. Amount of
    substance, the SI base quantity measured in moles, counts entities in bulk, while the number of
    entities is a plain count whose unit is one. Atoms, molecules, ions, electrons and other defined groups of
    particles all qualify as entities, so a statement of amount must say what is being counted: a mole of oxygen atoms
    and a mole of oxygen molecules hold the same number of entities but have different masses.

    The number of entities in a sample is its amount of substance multiplied by the Avogadro
    constant. The molar mass of a substance equals the constant times the mass of one entity, which
    is how the scale of atomic masses connects to grams per mole. Multiplied by the Boltzmann
    constant it gives the molar gas constant, and multiplied by the elementary charge it gives the
    Faraday constant, the charge carried by one mole of electrons.

    The name honours Amedeo Avogadro (1776–1856), who held that equal volumes of gases at the same
    temperature and pressure contain equal numbers of molecules. Early in the twentieth century the
    name Avogadro number was given to the number of oxygen molecules in a gram-molecule of oxygen, and it became
    the Avogadro constant when the mole entered the SI in 1971. From then until 2019 the mole was
    tied to 0.012 kilogram of carbon-12, so the constant had to be measured; the value finally fixed
    rests largely on counting the atoms in nearly perfect spheres of silicon enriched in silicon-28,
    a project of the International Avogadro Coordination begun in 2004.
