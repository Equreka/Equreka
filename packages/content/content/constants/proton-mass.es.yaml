# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Masa del protón'
description: >-
  La masa del protón, de símbolo $m_{\mathrm{p}}$, es la masa en reposo de un protón libre. Su
  valor recomendado CODATA 2022 es $1.672\,621\,925\,95(52)\times10^{-27}\,\mathrm{kg}$, un valor
  medido con una incertidumbre típica relativa de $3.1\times10^{-10}$. Como las masas de las demás
  partículas, no es una de las siete constantes que definen el SI y sigue siendo una magnitud
  medida tras la redefinición de 2019.

  El protón es el núcleo del hidrógeno ordinario, una única partícula con carga positiva, y todo
  núcleo atómico está formado por protones y neutrones; el número de protones, el número atómico,
  decide de qué elemento químico se trata. El protón es unas 1836.15 veces más pesado que el
  electrón, así que casi toda la masa de un átomo está en su núcleo. Su energía en reposo es de
  unos 938.27 megaelectronvoltios.

  El cociente entre la masa del electrón y la del protón aparece en las correcciones de masa
  reducida de los niveles de energía del hidrógeno y de iones moleculares sencillos. Junto con la
  masa del neutrón, la masa del protón da la energía de enlace de los núcleos: el deuterón, por
  ejemplo, pesa la suma de un protón y un neutrón menos su energía de enlace dividida entre el
  cuadrado de la velocidad de la luz.

  La masa del protón se determina mediante masas atómicas relativas. Espectrómetros de masas con
  trampas de Penning, enfriados a unos pocos kelvin, comparan las frecuencias de ciclotrón de pares
  de iones, como protones, iones de hidrógeno molecular e iones de carbono-12 muy cargados, con el
  patrón del carbono-12. Desde 2020, la espectroscopia láser del ion molecular HD+ aporta
  restricciones independientes sobre los cocientes entre las masas del protón, del deuterón y del
  electrón.
