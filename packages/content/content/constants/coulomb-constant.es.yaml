# yaml-language-server: $schema=../../dist/schemas/constants.locale.schema.json
name: 'Constante de Coulomb'
description: >-
  La constante de Coulomb, de símbolo $k_{\mathrm{e}}$, llamada también constante electrostática,
  se define como uno dividido entre cuatro pi por la permitividad eléctrica del vacío. CODATA no la
  da por separado; calculada a partir de la permitividad CODATA 2022 vale
  $8.987\,551\,7862(14)\times10^{9}\,\mathrm{N\,m^{2}\,C^{-2}}$, un valor medido con la misma
  incertidumbre típica relativa que la permitividad, $1.6\times10^{-10}$, porque cuatro pi es
  exacto.

  La constante es el factor de proporcionalidad de la ley de Coulomb: la fuerza entre dos cargas
  puntuales es igual a la constante por el producto de las cargas dividido entre el cuadrado de su
  distancia. Su tamaño muestra lo intensas que son las fuerzas eléctricas: dos cargas de un
  culombio situadas a un metro de distancia se empujarían con casi nueve mil millones de newtons.

  El mismo factor fija el campo eléctrico de una carga puntual, la constante por la carga dividida
  entre el cuadrado de la distancia, el potencial eléctrico de esa carga y la energía potencial de
  dos cargas, la constante por su producto dividido entre su separación. Muchos textos escriben el
  factor completo, uno dividido entre cuatro pi por la permitividad, e introducen el símbolo más
  corto solo por comodidad.

  Como el producto de las constantes eléctrica y magnética es igual a uno dividido entre el
  cuadrado de la velocidad de la luz, la constante de Coulomb es también el cuadrado de esa
  velocidad por la constante magnética dividido entre cuatro pi. Desde 1948 la constante magnética
  se fijaba en exactamente cuatro pi por diez a la menos siete, y cuando la velocidad de la luz
  pasó a ser exacta en 1983, la constante de Coulomb quedó como exactamente esa velocidad al
  cuadrado por diez a la menos siete. La revisión del SI de 2019 liberó la constante magnética, de
  modo que la constante de Coulomb lleva ahora la incertidumbre medida de la permitividad; su
  valor CODATA 2022 queda por debajo del antiguo valor exacto en menos de una incertidumbre típica.
