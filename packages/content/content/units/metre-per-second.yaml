description:
  en: >-
    The metre per second, symbol $\mathrm{m/s}$, is the coherent SI derived unit of speed and of
    velocity in mechanics: a body moving at one metre per second covers one metre of distance in
    each second. It joins two SI base units, the metre and the second, and measures every rate of
    change of position.

    The 11th CGPM listed the metre per second among the derived units of the new International
    System in 1960, and the SI Brochure gives it in its table of derived units expressed in base
    units. The tie runs both ways, since the metre itself is now defined by fixing the speed of
    light in vacuum at exactly $299\,792\,458\,\mathrm{m/s}$.

    Other speed units convert by exact factors. A kilometre per hour is one thousand metres in
    3600 seconds, so it equals $5/18$ of a metre per second, and the SI Brochure states the knot as
    $1852/3600$ of a metre per second. The SI Brochure itself writes one speed both ways, as 25
    metres per second or 90 kilometres per hour.

    Physics and engineering quote speeds of sound, winds, vehicles and particles in this unit:
    OpenStax gives the speed of sound in air as 331 metres per second at 0 degrees Celsius and 343
    metres per second at 20 degrees Celsius. Speed is a scalar and velocity a vector, yet both take
    the same unit; a velocity also states a direction.

    The symbol may also be written with a negative exponent on the second, and the plural is metres
    per second, spelled meters per second in American English. The SI Brochure rejects
    abbreviations such as mps in place of the symbol.
