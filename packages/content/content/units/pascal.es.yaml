# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pascal'
namePlural: 'pascales'
description: >-
  El pascal, de símbolo $\mathrm{Pa}$, es la unidad SI derivada coherente de presión y de tensión
  mecánica, igual a un newton por metro cuadrado. Mide cualquier fuerza repartida sobre una
  superficie: la presión de un gas o de un líquido, las tensiones normales y tangenciales en el
  interior de un sólido y los módulos elásticos, como el módulo de Young, que tienen la misma
  dimensión. En unidades básicas del SI es el kilogramo por metro y por segundo al cuadrado.

  El folleto del SI incluye el pascal entre las 22 unidades con nombre especial y lo expresa en
  otras unidades SI como el newton por metro cuadrado. Como las demás unidades derivadas, carece de
  patrón propio y se deduce del kilogramo, el metro y el segundo. La presión es un escalar, definido
  a partir de la fuerza perpendicular a una superficie; un fluido no puede soportar tensiones tangenciales, mientras que un sólido también las transmite, y ambos tipos de
  tensión se miden en pascales.

  Un newton sobre todo un metro cuadrado es una presión pequeña, de modo que los valores
  cotidianos alcanzan miles o cientos de miles de pascales. La atmósfera estándar se define como
  exactamente $101\,325\,\mathrm{Pa}$ y el bar como exactamente $10^{5}\,\mathrm{Pa}$, lo que hace
  que el hectopascal sea igual al milibar. La libra por pulgada cuadrada equivale a unos 6895
  pascales.

  La presión es también una densidad de energía, ya que un pascal equivale a un julio por metro
  cúbico, y en los fluidos aumenta con la profundidad según el peso de la columna situada encima.
  Los nombres con prefijo, como micropascal, kilopascal y megapascal, se escriben en una sola
  palabra.

  La 14.ª CGPM dio al newton por metro cuadrado el nombre especial de pascal, con el símbolo Pa, en
  1971. El nombre rinde homenaje a Blaise Pascal (1623-1662), matemático y físico francés. El
  plural es pascales.
