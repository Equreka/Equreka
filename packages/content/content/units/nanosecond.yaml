name:
  en: 'Nanosecond'
symbol:
  tex: 'ns'
unitOf:
  - 'time'
system: 'si-derived'
prefixOf:
  prefix: 'nano'
  base: 'second'
categories:
  - 'universal'
  - 'physics'
description:
  en: >-
    A nanosecond is an SI unit of time equal to one millionth ($0.000001$ or $10^{−9}$ or
    $\frac{1}{1,000,000,000}$) of a second.
