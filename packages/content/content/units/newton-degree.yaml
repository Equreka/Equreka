description:
  en: >-
    The degree Newton, symbol °N, is the unit of a historical temperature scale that goes back to
    Isaac Newton's table of the degrees of heat of 1701. It places 0 at the freezing point of
    water and, in its modern reading, 33 at the boiling point. It lies outside the SI.

    Conversions follow those two fixed points: a reading of 0 equals 0 degrees Celsius and a
    reading of 33 equals 100 degrees Celsius. One degree Newton is therefore exactly 100/33 of a
    kelvin, about 3.03 kelvin, a kelvin temperature is 100/33 times the Newton reading plus 273.15, and absolute zero lies at
    about -90.14 on the Newton scale.

    The table appeared in Latin, without an author's name, in the Philosophical Transactions of
    1701. For low temperatures it relied on a thermometer filled with linseed oil, marked 0 for
    water starting to freeze and 12 for the heat of the human body, with equal steps carried
    upward from there; boiling water stood at 33 to 34 and melting lead at 96, the top of that
    instrument's range. Higher degrees were inferred from the times that pieces of metal on a
    glowing iron bar took to set and cool, the reasoning behind Newton's law of cooling.

    The Royal Society's records note only that the paper was read on 28 May 1701. The attribution
    to Newton rests on later testimony, including memoranda by David Gregory and a biography by
    David Brewster, as a 1962 study of the paper sets out.
