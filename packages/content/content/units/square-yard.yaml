description:
  en: >-
    The square yard, symbol $\mathrm{yd^{2}}$, is a unit of area of the British imperial and United
    States customary systems, equal to the area of a square whose sides are one yard long. It is not
    an SI unit and is not accepted for use with the SI; it measures areas between those of a room
    and those of a plot of land.

    The yard is exactly 0.9144 metre, so the square yard is exactly
    $0.836\,127\,36\,\mathrm{m^{2}}$, the multiplier that QUDT stores. NIST Special Publication 811
    prints the factor rounded to seven significant digits, 0.836 127 4, without the boldface it
    reserves for exact values.

    NIST Handbook 44 makes the square yard nine square feet or 1296 square inches. Since an acre is
    43 560 square feet, it holds 4840 square yards, and a square mile holds 3 097 600 of them. A
    square metre is about 1.196 square yards, a little under one and one fifth.

    Carpets, floor coverings, turf, paving and fabric are often measured and priced by the square
    yard in the United States and the United Kingdom, and builders estimate plastering and painting
    work with it. The weight of a textile in customary trade is stated in ounces per square yard, a
    unit that NIST includes among its conversion factors.

    The plural is square yards. Besides the symbol yd², texts write the abbreviations sq yd and sq.
    yd. and the plain-text form yd2. Unlike the acre and the square mile, the square yard has no
    survey-foot variant in the area table of NIST Special Publication 811.
