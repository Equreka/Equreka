# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Metro cúbico por kilogramo y segundo al cuadrado'
description: >-
  El metro cúbico por kilogramo y segundo al cuadrado, de símbolo $\mathrm{m^{3}\,kg^{-1}\,s^{-2}}$,
  es la unidad SI coherente en la que se expresa la constante de gravitación universal. Es una
  unidad compuesta formada por tres unidades básicas del SI, el metro, el kilogramo y el segundo,
  y no tiene nombre especial propio. Como es un producto de unidades básicas con un factor
  numérico igual a uno, el folleto del SI la cuenta entre las unidades derivadas coherentes.

  La unidad se deduce de la ley de gravitación universal de Newton. La fuerza entre dos masas es
  proporcional al producto de las masas dividido entre el cuadrado de su separación, de modo que
  la constante que convierte esa razón en newtons debe llevar newtons por metro cuadrado y por
  kilogramo al cuadrado. Al escribir el newton en unidades básicas, como kilogramo metro por
  segundo al cuadrado, la expresión se reduce al metro cúbico por kilogramo y segundo al cuadrado,
  y las dos formas $\mathrm{N\,m^{2}\,kg^{-2}}$ y $\mathrm{m^{3}\,kg^{-1}\,s^{-2}}$ son idénticas.

  Ninguna clase de magnitud propia se mide con esta unidad: su dimensión corresponde al
  acoplamiento gravitatorio y no a una propiedad cotidiana de la materia, por lo que se trata como
  una unidad compuesta sin magnitud asociada. El NIST da el valor CODATA de la constante de
  gravitación en esta forma, y la propia constante, unas $6.674\times10^{-11}$ de estas unidades,
  muestra lo débil que es la gravedad entre masas de laboratorio.
