# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Gramo por litro'
namePlural: 'gramos por litro'
description: >-
  El gramo por litro, de símbolo $\mathrm{g/L}$, es una unidad de concentración másica: un gramo de
  una sustancia disuelta o dispersa en cada litro de una mezcla. No es una unidad coherente del SI,
  porque combina el gramo, submúltiplo del kilogramo, con el litro, una unidad aceptada para su uso
  con el SI.

  El gramo es la milésima parte del kilogramo y el litro la milésima parte del metro cúbico, de modo
  que ambos factores se compensan: un gramo por litro equivale exactamente a un kilogramo por metro
  cúbico, la unidad SI coherente tanto de la concentración másica como de la densidad. Un valor
  conserva, por tanto, el mismo número al pasar de una unidad a la otra.

  Su submúltiplo, el miligramo por litro, igual a un gramo por metro cúbico, sirve para las
  sustancias disueltas en trazas en el agua. Un gramo por litro es también un miligramo por
  mililitro, y el miligramo por decilitro de los análisis médicos equivale a una centésima de gramo
  por litro.

  El suero fisiológico, etiquetado como 0.9 % masa por volumen, contiene 9 gramos de cloruro de sodio
  en cada litro, y la glucosa en sangre en ayunas, expresada como 70 a 100 miligramos por decilitro,
  corresponde a 0.70 a 1.00 gramos por litro. QUDT asocia también la unidad a la densidad, para la
  que resulta cómoda con los gases: el aire en el punto de congelación del agua y a presión
  atmosférica tiene unos 1.29 gramos por litro.

  El folleto del SI admite tanto l como L para el litro, de modo que g/l y g/L son igualmente
  correctos. En inglés estadounidense el nombre se escribe gram per liter, y el plural es gramos por
  litro.
