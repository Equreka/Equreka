# yaml-language-server: $schema=../../dist/schemas/units.schema.json
name:
  en: 'Hertz'
symbol:
  tex: 'Hz'
unitOf:
  - 'frequency'
system: 'si-derived'
compose:
  of:
    - unit: 'second'
      exp: -1
categories:
  - 'physics'
description:
  en: >-
    The $hertz$ (symbol: $Hz$) is the derived unit of frequency in the International System of Units
    (SI) and is defined as <strong>one cycle per second</strong>. It is named after Heinrich Rudolf
    Hertz (1857-1894)
