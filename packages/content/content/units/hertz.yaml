description:
  en: >-
    The hertz, symbol $\mathrm{Hz}$, is the coherent SI derived unit of frequency, the number of
    cycles that a periodic phenomenon completes per unit of time. One hertz is one cycle per
    second, and in SI base units it is the reciprocal second, $\mathrm{s^{-1}}$.

    The SI Brochure reserves the hertz for periodic phenomena. The reciprocal second also measures
    the activity of a radionuclide, but that quantity takes the becquerel, and angular frequency
    and angular velocity take the radian per second. Because angular frequency is larger than
    frequency by the number of radians in a turn, the brochure recommends stating frequencies in
    hertz and angular quantities in rad/s rather than as bare reciprocal seconds. It also notes
    that cycle and revolution, though used in expressions such as cycles per second, are not SI
    units.

    The period of an oscillation is the reciprocal of its frequency, so a vibration at 50 hertz
    repeats every 20 milliseconds. The hertz also anchors the definition of the second, since the
    SI fixes the frequency of the caesium-133 hyperfine transition at exactly
    $9\,192\,631\,770\,\mathrm{Hz}$, and it is one of the units named in the present definition of
    the SI.

    Prefixed forms cover a very wide range: the candela is defined with radiation of 540
    terahertz, and the terahertz appears among the brochure's examples of prefixed units. Prefixed
    names such as kilohertz and megahertz are written as single words.

    The unit honours Heinrich Hertz (1857-1894), a German physicist who in 1887
    began the experiments in which he first generated and detected electromagnetic waves in the
    laboratory. The 11th CGPM listed the hertz among the derived units of the SI in 1960. The
    plural is hertz, the same as the singular.
