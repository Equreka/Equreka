# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Minuto de arco'
description: >-
  El minuto de arco es una unidad de ángulo plano igual a la sexagésima parte de un grado. Pertenece
  a la subdivisión sexagesimal del grado y, como este, es una unidad no SI que el folleto del SI
  incluye para su uso junto al SI, donde recibe el nombre de minuto.

  El folleto del SI lo define a partir del grado y del radián: un minuto de arco es la sexagésima
  parte de un grado, o $\pi/10\,800$ radián. Su factor de conversión es, por tanto, irracional y se
  lleva a las mismas 36 cifras significativas que el del grado, unos 0.000 290 89 radianes.

  Sesenta minutos de arco forman un grado, 21 600 forman una vuelta completa, y cada minuto de arco
  se divide en 60 segundos de arco. Un ángulo escrito en forma sexagesimal, como 30°22′, combina
  grados y minutos de arco en una sola expresión, una excepción que el folleto del SI admite para
  los ángulos planos y el tiempo.

  Los minutos de arco siguen siendo habituales en navegación, cartografía y astronomía, donde las
  coordenadas geográficas y las posiciones de las estrellas se escriben en grados, minutos y
  segundos. Fuera de esos campos, el folleto del SI prefiere las fracciones decimales del grado. Los
  tiradores y los diseñadores ópticos también expresan en minutos de arco la resolución angular y
  el ajuste de las miras.

  El símbolo es la prima, ′, escrita justo después del número sin espacio; a menudo la sustituye un
  apóstrofo mecanográfico. La palabra minuto sola es ambigua, porque también designa la unidad de
  tiempo de 60 segundos, de símbolo min, por lo que se usa la forma minuto de arco cuando puede haber
  confusión.
