description:
  en: >-
    The hectare, symbol ha, is a metric unit of area equal to ten thousand square metres, the area
    of a square one hundred metres on each side. It is not a coherent SI unit, but the SI Brochure
    lists it among the non-SI units in common use and notes that it serves to express land area,
    which makes it the usual measure for fields, forests and plots of land.

    The SI Brochure gives the definition as $1\,\mathrm{ha}=1\,\mathrm{hm^{2}}=10^{4}\,\mathrm{m^{2}}$,
    that is, one square hectometre. The factor is exact, and NIST Special Publication 811 lists it
    as exact as well. The name joins the prefix hecto, one hundred, to the are, a smaller metric
    unit of land area equal to one square decametre, so a hectare is one hundred ares.

    One hundred hectares make one square kilometre, which links the hectare to the larger areas of
    maps and geography. The acre of the English-speaking world is a little under half a hectare,
    and a hectare is a little under two and a half acres; NIST gives the acre exactly in square
    metres, so the ratio between the two units is known to any number of digits.

    The CIPM adopted the are and the hectare, together with their symbols, in 1879, decades before
    the International System of Units existed. The symbol ha is written in upright lowercase
    letters, with no full stop and no plural ending. Its name already contains the prefix hecto,
    and the SI never stacks prefixes, so larger areas are given in square kilometres instead.
