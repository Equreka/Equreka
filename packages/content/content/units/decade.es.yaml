# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Década'
description: >-
  La década es una unidad de tiempo de diez años, ajena al SI. Para las conversiones se toma como
  diez años comunes de 365 días, la misma convención aplicada al año y al siglo. Mide
  tendencias y periodos largos en climatología, demografía e historia.

  Ninguna norma define la década como unidad. Diez veces el año de 365 días, que la publicación
  especial 811 del NIST tabula como 31 536 000 segundos, dan 315 360 000 segundos, o 3650 días.

  Un intervalo real de diez años consecutivos del calendario es algo más largo. Según la regla
  gregoriana, un año divisible entre cuatro es bisiesto salvo que sea un año secular no divisible
  entre 400, así que diez años contienen de uno a tres días bisiestos y duran entre 3651 y 3653
  días. Diez décadas forman un siglo.

  La palabra también agrupa los años del calendario por su cifra de las decenas, como en la década
  de 1990, los años de 1990 a 1999. En la respuesta en frecuencia de amplificadores y filtros, la
  misma palabra, con la misma abreviatura dec, designa otra cosa: una razón de frecuencias de
  diez, que QUDT recoge como unidad logarítmica. El contexto decide de cuál se trata, y un tiempo
  en décadas se convierte a segundos antes de entrar en una fórmula.
