description:
  en: >-
    The pint (/ˈpaɪnt/, symbol $pt$, sometimes abbreviated as $p$) is a unit of volume or capacity
    in both the imperial and United States customary measurement systems. In both of those systems
    it is traditionally one eighth of a gallon. The British imperial pint is about 20% larger than
    the American pint because the two systems are defined differently. Almost all other countries
    have standardized on the metric system, so the size of what may be called a pint, from the
    French la pinte, varies depending on local custom.
