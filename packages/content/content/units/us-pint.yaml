description:
  en: >-
    The U.S. pint, written pt, liq pt or US pt, is the liquid pint of the United States customary system,
    equal to one eighth of a U.S. gallon or 28.875 cubic inches. It measures liquids only, since
    American dry goods have their own pint, and it is about one sixth smaller than the British
    imperial pint.

    The U.S. gallon is 231 cubic inches and the inch is exactly 25.4 millimetres, so the pint is
    exactly $473.176\,473\,\mathrm{mL}$. NIST Special Publication 811 lists the liquid pint, rounded,
    as 0.473 176 5 litre.

    Two pints make a liquid quart and eight make a gallon; a pint is four gills or sixteen U.S. fluid
    ounces. The imperial pint, at about 568.26 millilitres, holds twenty slightly smaller imperial
    fluid ounces, so the two units sharing the name differ by about a fifth.

    A separate U.S. dry pint, one half of a dry quart and about 550.6 millilitres, belongs to the
    dry measures of the bushel family. NIST Handbook 44 asks for the word liquid or dry whenever the
    two pints could be confused, and NIST Special Publication 811 abbreviates them as liq pt and
    dry pt.

    The American pint is an eighth of the 231-cubic-inch measure that England once used for wine,
    a gallon the colonists kept after Britain moved to the imperial gallon in 1824. NIST observes that the ancient Egyptian
    hon, a volume unit that held about one mina of water, was almost identical in size to the present
    U.S. pint.
