description:
  en: >-
    The year, symbol a, is a unit of time outside the SI. In conversions the year stands for the
    common year of exactly 365 days, the length of every year of the Gregorian calendar that is
    not a leap year. It measures ages, long durations and yearly rates in every science.

    No international standard defines a 365-day year as a unit, so its value rests on a
    convention: 365 days of 86 400 seconds each give 31 536 000 seconds, the factor that NIST
    Special Publication 811 lists in Appendix B.8 for the year of 365 days. QUDT gives the same
    multiplier for its common year.

    Other years differ from it by a fraction of a day. The Gregorian calendar adds a leap day in
    every year divisible by four, except century years not divisible by 400, so 400 calendar
    years hold 146 097 days, an average of 365.2425 days per year. The mean tropical year, the
    cycle of the seasons, lasted about 365.242 19 days in 2000 according to the tables of the US
    Naval Observatory. Astronomy prefers the Julian year of exactly 365.25 days.

    Interest and growth rates, the half-lives of long-lived isotopes and the ages of rocks and
    stars are stated per year or in years, often with a prefix such as mega. A duration in years
    is converted to seconds before it enters a physics formula.

    Julius Caesar introduced the Julian calendar in 45 BC, and Pope Gregory XIII introduced its
    Gregorian reform in 1582. The International Astronomical Union recommends the symbol a rather
    than yr but reads an unqualified year as the Julian year. The a of this unit is therefore the
    365-day year, about 0.07 per cent shorter than the IAU's a, and a careful text states which
    year it uses.
