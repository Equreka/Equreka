description:
  en: >-
    A year is the orbital period of a planetary body, for example, the Earth, moving in its orbit
    around the Sun. Due to the Earth's axial tilt, the course of a year sees the passing of the
    seasons, marked by change in weather, the hours of daylight, and, consequently, vegetation and
    soil fertility.
