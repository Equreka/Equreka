name:
  en: 'Milligram'
symbol:
  tex: 'mg'
unitOf:
  - 'mass'
system: 'si-derived'
prefixOf:
  prefix: 'milli'
  base: 'gram'
categories:
  - 'physics'
description:
  en: >-
    The milligram (symbol $mg$) is a unit of mass in the International System of Units. It is the
    third submultiple of the gram and the sixth of the kilogram, being one thousandth of the gram
    and one millionth of the kilogram.
