description:
  en: >-
    The part per billion, symbol ppb, states a ratio of two quantities of the same kind as a number
    of billionths, where a billion is a thousand million. Like the part per million, it is a name for
    a pure number rather than an SI unit, used for very small mass fractions of contaminants in water
    and for trace gases in air.

    Its value rests on the short-scale billion of American and modern British usage, so that
    $1\,\mathrm{ppb}=10^{-9}$ exactly. NIST Special Publication 811 points out that many countries
    read a billion as a million million instead. Spanish is one of them: there a billón is a million
    million, and ppb is read as partes por mil millones rather than partes por billón, which would
    mean $10^{-12}$.

    One part per billion is a thousandth of a part per million. A mass fraction of 1 ppb is one
    microgram of substance in each kilogram of sample, and in dilute solutions in water, about one
    microgram per litre.

    The unit suits the lowest concentrations that analysts report. OpenStax notes that the United
    States Environmental Protection Agency requires remedial action once lead in tap water reaches
    15 ppb, which is 0.015 ppm.

    Two separate ambiguities follow the symbol. One is the meaning of billion, which led the SI
    Brochure to advise against ppb and ppt. The other is the kind of fraction, since ppb may count
    mass, amount of substance or volume, the last sometimes marked ppbV. NIST does not accept ppb for
    values stated with the SI and recommends an explicit ratio of units or a power of ten.
