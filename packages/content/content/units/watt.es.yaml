# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Vatio'
namePlural: 'vatios'
description: >-
  El vatio, de símbolo $\mathrm{W}$, es la unidad SI derivada coherente de potencia, el ritmo al que
  la energía se transfiere o se transforma, y de flujo radiante, la potencia que transporta la
  radiación electromagnética. Un vatio es un julio por segundo; en unidades básicas del SI es el
  kilogramo metro cuadrado por segundo al cubo.

  El CIPM definió en 1946 el vatio como la potencia que da lugar a una energía de un julio en un
  segundo, y la misma resolución empleó el vatio para definir el voltio. En un circuito, la
  potencia entregada es el producto de la diferencia de potencial por la corriente, de modo que en
  corriente continua un vatio es un voltio amperio. El folleto del SI recoge el var como nombre
  especial del voltio amperio cuando expresa potencia reactiva, una unidad de igual tamaño que el
  vatio pero reservada a esa magnitud. El vatio es además una de las unidades que
  nombra la definición vigente del SI.

  La energía es la potencia multiplicada por el tiempo, así que un kilovatio mantenido durante una
  hora entrega un kilovatio hora, exactamente $3.6\times10^{6}\,\mathrm{J}$, y la electricidad se
  vende en esa unidad. El caballo de fuerza de 550 pies libra fuerza por segundo equivale
  a unos 745.7 vatios.

  En fotometría el vatio enlaza la luz con la energía: el SI asigna a la radiación
  monocromática de 540 terahercios una eficacia luminosa de exactamente $683\,\mathrm{lm/W}$, lo que define la
  candela y, a través de ella, el lumen.

  La unidad debe su nombre a James Watt (1736-1819), el ingeniero e inventor escocés que encontró
  formas de obtener más potencia de las máquinas de vapor. La 11.ª CGPM incluyó el vatio entre las
  unidades derivadas del SI en 1960. El plural es vatios.
