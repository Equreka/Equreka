description:
  en: >-
    The imperial quart, written qt or imp qt, is a unit of volume of the British imperial system
    equal to a quarter of an imperial gallon, or two imperial pints. Unlike its American
    counterpart, it measures liquids and dry goods alike, because the British system uses one set
    of capacity units for both.

    The imperial gallon is exactly 4.546 09 litres, so the quart is exactly
    $1.136\,522\,5\,\mathrm{L}$, a little more than a litre. Canada's Weights and Measures Act gives
    the same definition, one quarter of the gallon.

    One imperial quart contains two pints, eight gills or 40 imperial fluid ounces. The United States has
    two smaller quarts: the U.S. liquid quart, about 0.946 litre, is divided into 32 U.S. fluid
    ounces, and the U.S. dry quart is about 1.101 litres. Apart from the fluid ounce, the British
    capacity units are larger than the American units of the same name.

    The quart is not on the short list of imperial units that British law still allows on their own
    in trade, so a quart can appear on a British label only as a supplementary figure beside a more
    prominent metric quantity.

    The quart inherits the history of the imperial gallon, which Britain adopted in 1824 and defined
    by the volume of ten pounds of water, replacing the older wine and ale gallons. QUDT labels the
    unit Quart (UK), and imp qt marks it whenever the American quarts could be meant.
