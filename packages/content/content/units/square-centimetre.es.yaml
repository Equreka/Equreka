# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Centímetro cuadrado'
description: >-
  El centímetro cuadrado, de símbolo $\mathrm{cm^{2}}$, es una unidad de área igual al área de un
  cuadrado cuyos lados miden un centímetro cada uno. Es un submúltiplo decimal del metro cuadrado,
  la unidad SI coherente de área, y fue la unidad de área del sistema centímetro-gramo-segundo.

  El SI trata un prefijo y la unidad a la que se une como un solo símbolo, de modo que un exponente
  actúa sobre ambos a la vez: un centímetro cuadrado es el cuadrado de una centésima de metro, lo
  que da $1\,\mathrm{cm^{2}}=10^{-4}\,\mathrm{m^{2}}$ exactamente. El folleto del SI ilustra la
  regla con el centímetro cúbico, y el cuadrado se obtiene con el mismo razonamiento.

  Las unidades métricas de área avanzan de cien en cien en las tablas del manual 44 del NIST: cien
  milímetros cuadrados forman un centímetro cuadrado, y cien centímetros cuadrados forman un
  decímetro cuadrado, así que un metro cuadrado contiene diez mil centímetros cuadrados. La
  publicación especial 811 del NIST da la pulgada cuadrada como exactamente 6.4516 centímetros
  cuadrados, de modo que un centímetro cuadrado es algo más de quince centésimas de pulgada
  cuadrada.

  La unidad conviene a áreas que caben en una mano o sobre una mesa: una moneda, un sello de
  correos, una página, la sección de una barra en un problema escolar o la zona sobre la que se
  reparte una fuerza al calcular una presión. También forma unidades CGS de otras magnitudes, como
  la dina por centímetro cuadrado para la presión, que el NIST todavía incluye entre sus factores de
  conversión.

  Solo el símbolo cm² es correcto; el folleto del SI no admite abreviaturas de los símbolos ni de
  los nombres de unidad, y cita como ejemplo mm cuad. en la edición del CEM. En inglés
  estadounidense el nombre se escribe square centimeter, y el plural es centímetros cuadrados.
