  - 'liters'
  - 'L'
description:
  en: >-
    The litre (British English spelling) or liter (American English spelling) (SI symbols $l$ and
    $L$, other symbol used: $ℓ$) is a metric unit of volume. It is equal to 1 cubic decimetre
    ($dm^{3}$), 1000 cubic centimetres ($cm^{3}$) or 0.001 cubic metre ($m^{3}$). A cubic decimetre
    (or litre) occupies a volume of $10 cm × 10 cm × 10 cm$ and is thus equal to one-thousandth of a
    cubic metre.
