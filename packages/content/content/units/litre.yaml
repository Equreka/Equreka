name:
  en: 'Litre'
namePlural:
  en: 'litres'
symbol:
  tex: 'l'
unitOf:
  - 'volume'
system: 'other'
prefixes:
  - 'femto'
  - 'pico'
  - 'nano'
  - 'micro'
  - 'milli'
  - 'centi'
  - 'deci'
  - 'deca'
  - 'hecto'
  - 'mega'
  - 'giga'
  - 'tera'
toBase:
  factor: '0.001'
  source:
    name: 'SI Brochure (9th ed.)'
    url: 'https://www.bipm.org/en/publications/si-brochure'
    ref: 'Table 8: litre, 1 L = 1 dm³'
status: 'reviewed'
externalIds:
  wikidata: 'Q11582'
