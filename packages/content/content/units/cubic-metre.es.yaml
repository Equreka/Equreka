# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Metro cúbico'
description: >-
  El metro cúbico, de símbolo $\mathrm{m^{3}}$, es la unidad SI derivada coherente de volumen: el
  volumen de un cubo cuyas aristas miden un metro cada una. Conviene a volúmenes grandes, como
  depósitos, embalses, habitaciones, tierra excavada, hormigón y carga, y sirve de base a unidades
  de densidad y de caudal como el kilogramo por metro cúbico y el metro cúbico por segundo.

  La unidad no tiene nombre especial y se deriva directamente del metro. Con un prefijo, el
  exponente afecta a toda la unidad con prefijo, de modo que un decímetro cúbico es la milésima
  parte de un metro cúbico y un centímetro cúbico la millonésima.

  El litro es un nombre especial del decímetro cúbico, condición que le dio la 12.ª CGPM en 1964;
  por eso $1\,\mathrm{m^{3}}=1000\,\mathrm{L}$ exactamente. La definición de 1901 había hecho del
  litro el volumen de un kilogramo de agua pura, y en 1960 la 11.ª CGPM señaló que ese volumen y el
  decímetro cúbico diferían en unas 28 partes por millón. La publicación especial 811 del NIST da
  para el galón estadounidense unos $3.785\,412\times10^{-3}\,\mathrm{m^{3}}$ y para el pie cúbico
  unos 0.028 316 85 metros cúbicos.

  La ingeniería, la construcción, el transporte marítimo y la medición del agua y del gas trabajan
  en metros cúbicos, mientras que los volúmenes menores de líquidos suelen darse en litros.

  La 9.ª CGPM recogió el símbolo m³ en 1948, junto con st para el estéreo, una unidad de volumen
  usada entonces para la leña. El símbolo se escribe con un 3 en superíndice y sin punto;
  abreviaturas como cc por el centímetro cúbico no se admiten como símbolos. En inglés estadounidense el nombre se
  escribe cubic meter, y el plural es metros cúbicos.
