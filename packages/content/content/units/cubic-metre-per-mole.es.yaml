# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Metro cúbico por mol'
description: >-
  El metro cúbico por mol, de símbolo $\mathrm{m^{3}/mol}$, es la unidad SI derivada coherente de
  volumen molar, el volumen que ocupa una sustancia dividido entre su cantidad de sustancia. Se
  construye con el cubo del metro, la unidad básica de longitud del SI, y el inverso del mol, la
  unidad básica de cantidad de sustancia, y no tiene nombre especial.

  Una sustancia tiene un volumen molar de un metro cúbico por mol cuando un mol de ella, exactamente
  $6.022\,140\,76\times10^{23}$ entidades especificadas, llena un metro cúbico. Como ambos factores
  son unidades básicas del SI o potencias de ellas, la unidad no lleva coeficiente numérico.

  El metro cúbico es un volumen grande frente a un mol de la mayoría de las sustancias, por lo que
  los valores prácticos son pequeños en esta unidad. CODATA da el volumen molar de un gas ideal como
  $22.710\,954\,64\ldots\times10^{-3}\,\mathrm{m^{3}/mol}$ a 273.15 kelvin y 100 kilopascales, y
  como unas 22.414 milésimas de metro cúbico por mol a la misma temperatura y 101.325 kilopascales.
  Un metro cúbico por mol equivale a 1000 litros por mol, o a un millón de centímetros cúbicos por
  mol, razón por la cual los datos de gases se tabulan en litros o decímetros cúbicos por mol y los
  de líquidos y sólidos en centímetros cúbicos por mol.

  La unidad aparece cuando la ley de los gases ideales se aplica con todas las magnitudes en
  unidades SI coherentes, con la presión en pascales y la temperatura en kelvin. Su símbolo puede
  escribirse también m³ mol⁻¹, y el plural es metros cúbicos por mol.
