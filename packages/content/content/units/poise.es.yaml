# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Poise'
namePlural: 'poises'
description: >-
  El poise, de símbolo $\mathrm{P}$, es la unidad de viscosidad dinámica del sistema
  centímetro-gramo-segundo (CGS). Es la viscosidad de un fluido en el que una tensión tangencial de
  una dina por centímetro cuadrado mantiene un gradiente de velocidad de un centímetro por segundo
  por centímetro. No es una unidad del SI, pero pervive en forma de centipoise.

  Un poise equivale exactamente a $0.1\,\mathrm{Pa\,s}$; la publicación especial 811 del NIST
  imprime el factor en negrita en su apéndice B.8, su señal de una conversión exacta. El factor se
  deduce de las unidades básicas CGS, ya que el poise es un gramo por centímetro y por segundo, y el
  gramo y el centímetro son una milésima de kilogramo y una centésima de metro.

  Diez poises forman un pascal segundo, y el centipoise, una centésima de poise, equivale
  exactamente a un milipascal segundo. El agua a 20 grados Celsius tiene una viscosidad muy próxima
  a un centipoise, lo que convierte al centipoise en una escala cómoda para los líquidos.

  Las tablas de viscosidad y las fichas técnicas aún expresan a menudo los líquidos en centipoises,
  y las tablas antiguas usan el propio poise: la glicerina tiene unos 15 poises a 20 grados Celsius,
  mientras que el aire solo tiene unos $1.8\times10^{-4}\,\mathrm{P}$.

  La unidad honra al científico francés Jean Léonard Marie Poiseuille, que, interesado en la
  circulación de la sangre, midió el paso de líquidos por capilares de vidrio de calibre muy fino y
  publicó sus resultados en 1840 y 1846. En 1948, la 9.ª Conferencia General de Pesas y Medidas
  incluyó el poise, con el símbolo P, en su lista de símbolos de unidades. El plural es poises.
