# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Kilogramo metro cuadrado'
description: >-
  El kilogramo metro cuadrado, de símbolo $\mathrm{kg\,m^{2}}$, es la unidad derivada coherente
  del SI para el momento de inercia, la oposición de un cuerpo a que cambie su rotación alrededor
  de un eje. Una masa puntual de un kilogramo situada a un metro del eje tiene un momento de
  inercia de un kilogramo metro cuadrado.

  La unidad es el kilogramo multiplicado por el cuadrado del metro y no tiene nombre especial, de
  modo que se define solo a través de esas dos unidades básicas del SI. Al multiplicarla por el
  cuadrado de una velocidad angular en radianes por segundo se obtiene el doble de una energía
  cinética de rotación en julios, y por eso encaja directamente en las ecuaciones de la dinámica de
  rotación.

  Según la publicación especial 811 del NIST, la libra pie cuadrado vale unos 0.042 14 en esta
  unidad y la libra pulgada cuadrada unos 0.000 292 6. En unidades CGS, el gramo centímetro cuadrado es
  exactamente una diezmillonésima de kilogramo metro cuadrado.

  Los momentos de inercia en esta unidad varían mucho. Seis arandelas pequeñas sobre una varilla
  ligera de medio metro tienen unos $0.0035\,\mathrm{kg\,m^{2}}$ respecto de su centro, y las
  cuatro palas del rotor de un helicóptero de rescate pequeño, unos $1067\,\mathrm{kg\,m^{2}}$
  respecto del buje. Los volantes de inercia destinados a almacenar energía se construyen con
  momentos de inercia grandes, porque la energía de rotación almacenada crece en proporción a
  ellos.

  El símbolo lleva un espacio o un punto a media altura entre kg y m², y el nombre también se lee
  kilogramo metro al cuadrado.
