description:
  en: >-
    The degree Réaumur (°Ré, °Re, °r) is an unused unit of temperature. Named in honor of René
    Antoine Ferchault de Réaumur (1683-1757) who proposed it as a unit in 1731. A value of 0 °
    Réaumur corresponds to the freezing point of water and 80 ° Réaumur to the boiling point of
    water.
