description:
  en: >-
    The degree Réaumur, symbol °Ré, is the unit of a historical temperature scale that places 0 at
    the freezing point of water and 80 at its boiling point under normal atmospheric pressure. It
    was among the most successful thermometer scales of the eighteenth century and lies outside
    the SI.

    No current standard defines it, so conversions follow its two fixed points: 0 degrees Réaumur
    equals 0 degrees Celsius and 80 degrees Réaumur equals 100 degrees Celsius. One degree Réaumur is therefore exactly five fourths of a degree
    Celsius, or 1.25 kelvin, and a kelvin temperature is 1.25 times the Réaumur reading plus
    273.15.

    Because the Réaumur and Celsius scales share their zero, a single factor converts one into the
    other, while the kelvin needs the offset as well. Absolute zero lies at -218.52 degrees
    Réaumur.

    The Museo Galileo in Florence keeps an alcohol thermometer with a Réaumur scale made in Paris
    and used by chemists to follow the heat of reactions, and its account of early thermometry
    names the 80-degree scale beside those of Celsius and Fahrenheit. Anders Celsius himself was used to Réaumur thermometers before devising his own scale.

    René-Antoine Ferchault de Réaumur (1683-1757), the French scientist whose name the scale
    bears, set out rules for building comparable thermometers in a memoir to the Paris Academy of
    Sciences for 1730 and in a second memoir for 1731; his instruments were filled with wine
    spirit. Some texts write the symbol °R, which clashes with the degree Rankine.
