references:
  - title: 'OpenStax, Chemistry 2e, 11.3 Solubility, Henry''s law, Examples 11.1 and 11.2'
    url: 'https://openstax.org/books/chemistry-2e/pages/11-3-solubility'
  - title: 'R. Sander, Henry''s Law Constants (online database, version 5.0.0): symbols, definitions, units and converter'
    url: 'https://henrys-law.org/henry/'
  - title: 'NIST SP 811, Appendix B.8, Factors for units listed alphabetically: atmosphere, standard'
