name:
  en: 'Mole per litre atmosphere'
symbol:
  tex: 'mol/(L\,atm)'
  text: 'mol/(L·atm)'
unitOf: []
system: 'other'
compose:
  of:
    - unit: 'mole'
      exp: 1
    - unit: 'litre'
      exp: -1
    - unit: 'standard-atmosphere'
      exp: -1
