description:
  en: >-
    The tesla, symbol $\mathrm{T}$, is the coherent SI derived unit of magnetic flux density, the
    quantity usually called the magnetic field. It is one of the 22 SI units with a special name,
    equal to one weber per square metre, and in SI base units it is the kilogram per second
    squared per ampere.

    The SI Brochure gives the tesla in its table of units with special names, expressed in other
    SI units as the weber per square metre. The magnetic force law gives an equivalent reading: a
    field of one tesla pushes a charge of one coulomb moving across it at one metre per second
    with a force of one newton, so the tesla is also the newton second per coulomb metre.

    The tesla is a large unit for everyday fields. The field of the Earth at its surface is about
    $5\times10^{-5}\,\mathrm{T}$, roughly fifty microteslas. In the CGS system the gauss equals
    exactly one ten-thousandth of a tesla, and the older gamma equals exactly
    one nanotesla; NIST Special Publication 811 lists both factors as exact.

    Fields of the order of one tesla belong to strong magnets and medical equipment. The strongest
    permanent magnets come close to 2 teslas, hospital MRI scanners typically operate at 1.5 to 3
    teslas, with research scanners at 10.5, and superconducting electromagnets reach 10 teslas or
    more.

    The unit is named after the inventor Nikola Tesla. The 11th CGPM included it,
    with the symbol $\mathrm{T}$, among the derived units of the SI in 1960. Following the SI
    rules, the name is written in lowercase in running text, the plural is teslas, and the symbol
    is a capital T because it comes from a proper name.
