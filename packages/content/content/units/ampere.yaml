description:
  en: >-
    The ampere, symbol $\mathrm{A}$, is the SI base unit of electric current, the rate at which
    electric charge flows past a point of a circuit. It is the only electrical unit among the seven
    SI base units, and the coulomb, the volt, the ohm and the other electrical units are built from
    it together with the metre, the kilogram and the second.

    Since 20 May 2019 the ampere has been defined by fixing the elementary charge at exactly
    $e=1.602\,176\,634\times10^{-19}\,\mathrm{C}$, where the coulomb equals the ampere second and
    the second is defined through the caesium frequency. A steady current of one ampere therefore
    carries about $6.241\times10^{18}$ elementary charges past a given point each second. As a side
    effect, the magnetic constant is no longer exact and has to be measured.

    One coulomb is the charge moved by one ampere in one second, and the ampere hour, used to rate
    batteries, equals 3600 coulombs. Multiplying a current in amperes by a potential difference in
    volts gives a power in watts.

    NIST quotes everyday values: about 15 amperes for an 1800-watt hair dryer, 15 to 20 amperes for
    a household circuit breaker, a few thousandths of an ampere for a small LED and 100 000 amperes
    or more in a lightning stroke. Laboratories realize electrical units through quantum standards
    based on the Josephson and quantum Hall effects.

    International ampere and ohm units were introduced by an electrical congress in Chicago in 1893.
    In 1946 the CIPM defined the ampere through the force between two long parallel wires one metre
    apart, and the 10th CGPM made it a base unit in 1954. The unit honours the French scientist
    André-Marie Ampère, whose experiments in the 1820s inspired that older definition; amp is an
    informal short form of the name.
