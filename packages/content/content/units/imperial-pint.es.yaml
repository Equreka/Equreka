# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pinta imperial'
description: >-
  La pinta imperial, escrita pt o imp pt, es una unidad de volumen del sistema imperial británico
  igual a la octava parte de un galón imperial. Es la pinta de la cerveza y la sidra de barril
  británicas y de la leche en envases retornables, algunas de las pocas mercancías que la ley del
  Reino Unido todavía permite vender solo con una medida imperial.

  Con el galón imperial fijado en exactamente 4.546 09 litros, la pinta vale exactamente
  $568.261\,25\,\mathrm{mL}$, algo más de medio litro. La ley de pesas y medidas de Canadá define su
  pinta de la misma manera, como la octava parte del galón.

  Dos pintas forman un cuarto de galón, y una pinta se divide en cuatro gills o veinte onzas
  líquidas imperiales. La pinta líquida estadounidense contiene 16 onzas líquidas estadounidenses,
  cada una algo mayor que la imperial, para un total de unos 473.18 mililitros, de modo que la pinta
  imperial es aproximadamente una quinta parte mayor.

  Una guía del Gobierno británico explica que los comerciantes pueden mostrar cifras imperiales
  junto a las métricas en cualquier producto, siempre que la cifra métrica sea la más destacada. La
  cerveza y la sidra de barril y la leche en envases retornables son las excepciones que pueden
  venderse por pintas sin ninguna cifra métrica, junto con los metales preciosos vendidos por onzas
  troy.

  La pinta comparte la historia del galón imperial, que Gran Bretaña adoptó en 1824 en lugar de los
  antiguos galones de vino y de cerveza, de modo que las pintas británica y estadounidense difieren
  desde entonces. El símbolo pt sirve para ambas, y por eso se escribe imp pt cuando pueden
  confundirse; el vocabulario QUDT denomina esta unidad Pint (UK).
