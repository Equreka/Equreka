# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Cuarto de galón estadounidense'
description: >-
  El cuarto de galón estadounidense, escrito qt o liq qt, es el cuarto de galón para líquidos del
  sistema consuetudinario estadounidense, igual a la cuarta parte de un galón estadounidense o 57.75
  pulgadas cúbicas, algo menos que un litro. Es uno de los tres cuartos de galón en uso actual, junto
  al cuarto seco estadounidense y al cuarto de galón imperial.

  Con el galón definido como 231 pulgadas cúbicas y la pulgada como exactamente 25.4 milímetros, el
  cuarto de galón vale exactamente $946.352\,946\,\mathrm{mL}$. La publicación especial 811 del NIST
  lo recoge, redondeado, como 0.946 352 9 litros.

  Un cuarto de galón líquido contiene dos pintas, ocho gills o 32 onzas líquidas estadounidenses, y cuatro
  cuartos forman un galón. El cuarto de galón imperial del sistema británico, de unos 1.136 litros, se
  divide en 40 onzas líquidas imperiales más pequeñas y es aproximadamente una quinta parte mayor.

  Estados Unidos tiene además un cuarto de galón seco para los productos que se venden por bushels.
  Mide 67.2006 pulgadas cúbicas, unos 1.101 litros, y 32 cuartos secos forman un bushel; el manual 44
  del NIST pide añadir las palabras líquido o seco siempre que los dos cuartos puedan confundirse.
  El NIST incluye esta separación estadounidense entre medidas de líquidos y de áridos entre las
  diferencias con el sistema británico, que usa un solo conjunto de unidades de capacidad.

  Como el galón estadounidense, el cuarto de galón procede del galón de vino inglés que adoptaron los
  colonos americanos, por lo que su tamaño se ha mantenido distinto del cuarto británico desde que
  Gran Bretaña pasó al galón imperial en 1824. Las formas US qt y liq qt lo identifican siempre que
  pudiera entenderse otro cuarto de galón.
