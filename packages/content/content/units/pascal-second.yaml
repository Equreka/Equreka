description:
  en: >-
    The pascal second, symbol $\mathrm{Pa\,s}$, is the coherent SI derived unit of dynamic
    viscosity, the internal friction of a liquid or gas. It is the product of the pascal, the unit
    of pressure and stress, and the second, so it measures how large a shear stress is needed to
    keep a given rate of shear going in a flowing fluid.

    The SI Brochure lists it in its table of coherent derived units whose names include a unit with
    a special name, and expresses it in base units as the kilogram per metre per second. It has no
    special name of its own and no separate standard: its definition follows from those of the
    kilogram, the metre and the second.

    One pascal second equals exactly ten poises, the CGS unit of viscosity, and the millipascal
    second equals exactly one centipoise, as NIST Special Publication 811 lists. NIST also converts
    the pound per foot second, a customary unit, to about 1.488 pascal seconds.

    Viscosity tables give most liquids in millipascal seconds: water at 20 degrees Celsius has about
    one, whole blood a few, and olive oil over a hundred, while glycerine reaches about
    $1.5\,\mathrm{Pa\,s}$. Gases are far less viscous, with values in micropascal seconds.

    When the 11th CGPM listed the derived units of the new SI in 1960, it wrote this unit as the
    newton second per square metre; the 14th CGPM gave the newton per square metre the name pascal
    in 1971. The symbol is written with a space or a half-high dot between Pa and s, and the name
    with a space or a hyphen. The plural is pascal seconds.
