# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Voltio metro'
description: >-
  El voltio metro, de símbolo $\mathrm{V\,m}$, es la unidad SI derivada coherente de flujo
  eléctrico, la integral de superficie de la intensidad de campo eléctrico. Es el producto del
  voltio, la unidad de diferencia de potencial eléctrico, por el metro, y en unidades básicas del
  SI es el kilogramo metro cúbico por segundo al cubo y por amperio. No tiene nombre especial.

  La unidad se deduce de la definición del flujo: una intensidad de campo en voltios por metro
  multiplicada por un área en metros cuadrados deja el producto de voltio y metro. Un campo uniforme de un
  voltio por metro que atraviesa un metro cuadrado en ángulo recto lleva un flujo de un voltio
  metro.

  Como el voltio equivale al julio por culombio y el julio al newton metro, el voltio metro es
  idéntico al newton metro cuadrado por culombio, la forma que usa OpenStax para el flujo eléctrico. Es también la unidad de una carga dividida entre una
  permitividad, culombios entre faradios por metro, y por eso la ley de Gauss da el flujo que sale
  de una superficie cerrada directamente en esta unidad.

  El voltio metro aparece casi solo en electrostática, en la ley de Gauss y en los cálculos de
  flujo que se apoyan en ella. Una superficie cerrada alrededor de una carga de un microculombio
  recoge aproximadamente $1.13\times10^{5}\,\mathrm{V\,m}$, sea cual sea su forma.

  El símbolo se escribe con un espacio o con un punto a media altura entre los factores,
  $\mathrm{V\,m}$ o V·m, según la regla del SI para los productos de unidades. El voltio metro no
  es el voltímetro, el instrumento que mide la diferencia de potencial, aunque la grafía
  estadounidense en inglés los haga parecer iguales.