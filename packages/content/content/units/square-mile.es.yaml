# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Milla cuadrada'
description: >-
  La milla cuadrada, de símbolo $\mathrm{mi^{2}}$, es una unidad de área del sistema imperial
  británico y del sistema consuetudinario estadounidense, igual al área de un cuadrado de una milla
  de lado. No es una unidad del SI y se emplea para grandes extensiones de tierra y de agua:
  condados, estados, parques nacionales, lagos y la superficie afectada por inundaciones o incendios
  forestales.

  La milla internacional mide exactamente 1609.344 metros, de modo que la milla cuadrada equivale
  exactamente a $2\,589\,988.110\,336\,\mathrm{m^{2}}$, unos 2.59 kilómetros cuadrados. QUDT guarda
  este multiplicador exacto para la milla internacional cuadrada; la publicación especial 811 del
  NIST redondea el factor a 2.589 988 kilómetros cuadrados.

  En el manual 44 del NIST una milla cuadrada son 640 acres o 27 878 400 pies cuadrados, y también 3
  097 600 yardas cuadradas. Un kilómetro cuadrado equivale a unas 0.386 millas cuadradas, y una
  hectárea a unas 0.003 86 millas cuadradas.

  El Public Land Survey System de Estados Unidos, que abarca la mayor parte del país salvo los trece
  estados originales, Alaska y Hawái, divide el terreno en secciones de una milla cuadrada nominal,
  y el Dominion Lands Survey del oeste de Canadá usa la misma sección. Como la cuadrícula sigue
  meridianos y paralelos sobre una Tierra curva, las secciones reales difieren algo del tamaño
  nominal.

  La publicación especial 811 del NIST recoge también una milla cuadrada basada en el pie
  topográfico estadounidense, de 2.589 998 kilómetros cuadrados, algo mayor que la unidad
  internacional. El NIST declaró obsoleto el pie topográfico a partir del 1 de enero de 2023. El
  plural es millas cuadradas, y sq mi es una abreviatura frecuente.
