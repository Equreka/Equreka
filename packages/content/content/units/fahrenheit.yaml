description:
  en: >-
    The degree Fahrenheit, symbol °F, is the unit of the Fahrenheit temperature
    scale, which today is used mainly in the United States, for weather reports and daily life
    as well as in engineering. It is not an SI unit: one degree Fahrenheit is five ninths of a
    kelvin, and the scale places its zero far from absolute zero.

    NIST Special Publication 811 gives the conversion to the kelvin in Appendix B.8:
    $T/\mathrm{K}=(t/^{\circ}\mathrm{F}+459.67)/1.8$, and a Celsius temperature is the Fahrenheit
    reading minus 32, divided by 1.8. Absolute zero therefore falls at -459.67 degrees Fahrenheit,
    0 degrees Celsius reads as 32 degrees Fahrenheit and 100 degrees Celsius as 212, so 180
    degrees separate the freezing and boiling points of water at standard pressure.

    A temperature interval of one degree Fahrenheit equals five ninths of a kelvin, about
    0.555 556 kelvin in the NIST table. The degree Rankine has the same size but counts from
    absolute zero, and the Fahrenheit and Celsius scales read the same number at -40.

    In engineering work in US customary units the degree Fahrenheit enters derived units: NIST lists
    conversion factors for thermal conductivity, heat transfer coefficients and specific heat
    capacity expressed per degree Fahrenheit.

    The scale is named after Daniel Gabriel Fahrenheit (1686-1736), a maker of mercury
    thermometers. In a letter of 1729 he recalled a visit to the Danish astronomer Ole Rømer in
    1708, after which he copied Rømer's scale and then divided each of its degrees into four; by
    1717 his fixed points stood at 32 and 96. His Latin paper on the boiling points of several
    liquids came before the Society on 5 March 1723 and appeared in the 1724 volume of the
    Philosophical Transactions.
