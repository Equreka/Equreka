# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pulgada cuadrada'
description: >-
  La pulgada cuadrada, de símbolo $\mathrm{in^{2}}$, es una unidad de área del sistema imperial
  británico y del sistema consuetudinario estadounidense, igual al área de un cuadrado cuyos lados
  miden una pulgada. Queda fuera del SI y sirve a la ingeniería consuetudinaria para áreas pequeñas,
  como secciones, caras de pistones y superficies de contacto.

  Como la pulgada mide exactamente 2.54 centímetros, la pulgada cuadrada equivale exactamente a
  $6.451\,6\times10^{-4}\,\mathrm{m^{2}}$, es decir, 6.4516 centímetros cuadrados o 645.16
  milímetros cuadrados. La publicación especial 811 del NIST imprime en negrita, como exactos, sus
  dos factores para la unidad, y QUDT guarda el mismo multiplicador.

  El manual 44 del NIST sitúa 144 pulgadas cuadradas en un pie cuadrado y 1296 en una yarda
  cuadrada. En sentido inverso, un centímetro cuadrado equivale a unas 0.155 pulgadas cuadradas, de
  modo que un área del tamaño de una postal, de unos cientos de centímetros cuadrados, ocupa unas
  decenas de pulgadas cuadradas.

  La unidad da nombre a la libra por pulgada cuadrada, psi, la unidad consuetudinaria de presión en
  Estados Unidos para neumáticos, sistemas hidráulicos, gases comprimidos y resistencia de
  materiales: una fuerza de una libra fuerza repartida sobre una pulgada cuadrada. El NIST recoge la
  conversión de la psi al pascal junto a la de la propia pulgada cuadrada.

  El plural es pulgadas cuadradas; sq in es una abreviatura frecuente e in2 una forma de texto
  plano. Como el símbolo in coincide con una palabra inglesa, escribir in² con su exponente, o el
  nombre completo, evita que la unidad se lea mal dentro de un texto.
