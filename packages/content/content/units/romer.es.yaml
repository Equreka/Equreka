# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Grado Rømer'
description: >-
  El grado Rømer, de símbolo °Rø, es la unidad de una escala histórica de temperatura ideada por
  el astrónomo danés Ole Rømer, en la que el agua se congela a 7.5 grados y hierve a 60. Queda
  fuera del SI, y su legado duradero es la escala Fahrenheit, que nació de ella.

  Ninguna norma la define hoy, así que las conversiones siguen sus dos puntos fijos: 7.5 grados
  Rømer equivalen a 0 grados Celsius y 60 grados Rømer a 100 grados Celsius. Los 52.5 grados que
  hay entre ellos hacen que un grado Rømer sea exactamente 40/21 de kelvin, unos 1.905 kelvin, y
  el cero absoluto cae en unos -135.90 grados Rømer.

  Rømer situó su cero por debajo del punto de congelación, de modo que el tiempo meteorológico
  ordinario nunca exigía lecturas negativas, una elección que Fahrenheit copió después. Una
  temperatura Celsius es la lectura Rømer menos 7.5, multiplicada por 40/21.

  Rømer necesitaba correcciones de temperatura para el reloj de péndulo y el arco graduado del
  instrumento con el que observaba en su casa. Sus notas de trabajo, los Adversaria, registran el
  punto de congelación en 7½ y el de ebullición en 60 en 1702, con termómetros llenos de una
  mezcla de alcohol y agua; no se conserva ninguno de sus termómetros. En una carta de 1729 al
  químico neerlandés Boerhaave, Fahrenheit describió una mañana de 1708 en casa de Rømer, donde
  se marcaban termómetros en agua con hielo y en agua tibia como la sangre, en 7½ y 22½.

  El símbolo °Rø distingue esta escala del grado Rankine, °R, y del grado Réaumur, °Ré.
