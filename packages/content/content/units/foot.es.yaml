# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pie'
description: >-
  El pie, de símbolo ft, es una unidad de longitud del sistema imperial británico y del sistema
  consuetudinario estadounidense. Se sitúa entre la pulgada y la yarda y es la medida habitual de la
  estatura de las personas y de la altitud allí donde esos sistemas siguen en uso.

  Su definición pasa por la yarda. Desde 1959 la yarda mide exactamente 0.9144 metros, y el pie es
  un tercio de ella, de modo que $1\,\mathrm{ft}=0.304\,8\,\mathrm{m}$ sin redondeo alguno. La
  publicación especial 811 del NIST da este factor como exacto, y el NIST llama a la unidad pie
  internacional cuando hay que distinguirla del antiguo pie topográfico.

  Doce pulgadas forman un pie, tres pies forman una yarda y 5280 pies forman una milla. Un metro es,
  por tanto, algo más de tres pies y tres pulgadas, y un pie cuadrado equivale a 144 pulgadas
  cuadradas.

  El NIST señala que los altímetros de los aviones y los mapas de elevación del terreno expresan las
  alturas en pies aunque alcancen varias millas. Una guía del Gobierno británico cita la estatura en
  pies y pulgadas entre las costumbres imperiales que siguen vigentes en el Reino Unido.

  Según el NIST, los romanos tomaron el pie de los egipcios y lo dividieron en doce partes. Desde
  1893 Estados Unidos ligó su pie al metro como 1200/3937 metros. El ajuste de 1959 acortó el pie
  en dos partes por millón, pero la geodesia estadounidense conservó el valor de 1893, que pasó a
  llamarse pie topográfico estadounidense. El NIST y la NOAA lo declararon obsoleto desde el 1 de
  enero de 2023, salvo para trabajos históricos y heredados, así que hoy rige un único pie. El
  plural del nombre es pies.
