description:
  en: >-
    The gal, symbol Gal, is the unit of acceleration of the centimetre-gram-second system, equal to
    one centimetre per second squared. Geodesists and geophysicists state gravity and its small
    variations from place to place in it, mostly through its submultiple the milligal, mGal.

    The definition gives $1\,\mathrm{Gal}=1\,\mathrm{cm/s^{2}}=10^{-2}\,\mathrm{m/s^{2}}$ exactly.
    The SI Brochure lists the gal in its table of non-SI units among the internationally recognized
    units that are not decimal multiples of SI units, noting its origin in the CGS system. NIST
    Special Publication 811 counts it among the CGS units with special names that its guide does not
    accept for use with the SI, and gives the exact factor 0.01 in its conversion appendix.

    The standard acceleration of gravity equals 980.665 gals exactly, and the free-fall acceleration
    at sea level spans roughly 978 to 983 gals between the equator and the poles. One milligal is
    $10^{-5}\,\mathrm{m/s^{2}}$, about one millionth of standard gravity, which is the scale of the
    anomalies that gravity surveys look for.

    Gravimetry maps tiny local differences in the pull of gravity, reported in milligals, and reads
    them as differences in the density of the rocks below, which reveal the geological structure of
    an area. Geodesists use the same unit when they model the Earth's gravity field.

    The name honours the Italian scientist Galileo Galilei, and the unit is sometimes called the
    galileo, the label QUDT uses. Its symbol is Gal with a capital G, which keeps it apart from gal,
    the usual abbreviation of the gallon.
