description:
  en: >-
    The gray, symbol $\mathrm{Gy}$, is the coherent SI derived unit of absorbed dose, the energy
    that ionizing radiation deposits per unit mass of the matter it crosses. One gray corresponds to
    one joule absorbed by each kilogram, and the gray is one of the 22 SI units with a special name
    and symbol.

    The 15th CGPM adopted the name in 1975 through Resolution 9, setting the gray equal to the joule
    per kilogram, $\mathrm{J/kg}$. The following year the CIPM, on the advice of the ICRU, extended
    its use to kerma and to specific energy imparted. The SI Brochure insists on the special name
    rather than the joule per kilogram so that absorbed dose is never mistaken for equivalent dose,
    whose unit, the sievert, has the same dimension.

    The older rad equals exactly 0.01 gray, so one gray is 100 rad. Doses received by patients are
    usually quoted in milligrays: a chest CT scan delivers
    about 10 milligrays to the thyroid, and a brain CT scan about 60 milligrays to the lens of the
    eye.

    The unit honours Louis Harold Gray, the British physicist who helped found radiobiology. With
    John Read he defined an early unit of absorbed energy for all kinds of ionizing radiation, a
    forerunner of the rad that the ICRU named in 1953. The name is written in lowercase in running
    text, its plural is grays, and the symbol Gy begins with a capital letter.
