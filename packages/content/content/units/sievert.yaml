description:
  en: >-
    The sievert, symbol $\mathrm{Sv}$, is the coherent SI derived unit of equivalent dose, also
    called dose equivalent: absorbed dose of ionizing radiation weighted for the biological
    effectiveness of the radiation. Like the gray it equals one joule per kilogram, and its separate
    name tells the reader that such a weighting has been applied.

    The 16th CGPM adopted the special name in 1979 through Resolution 5, for the unit of dose
    equivalent in radiation protection, stating that it equals the joule per kilogram and that a new
    name was justified to protect human health. Following a CIPM recommendation of 2002, the SI
    Brochure defines dose equivalent as absorbed dose multiplied by a dimensionless quality factor,
    and recommends the names sievert and gray instead of joule per kilogram.

    The older rem equals exactly 0.01 sievert, so one sievert is 100 rem. In protection work the
    ICRP radiation weighting factor plays the part of the quality factor: it is 1 for gamma rays and
    beta particles, so an absorbed dose of one milligray becomes one millisievert, while alpha
    particles carry a factor of 20.

    Everyday doses are small and are given in millisieverts and microsieverts. Natural sources give
    a worldwide average of about 2.4 millisieverts per year, and ambient dose rates in most living
    spaces lie between 0.01 and 1 microsievert per hour. The sievert also measures effective dose,
    the organ-weighted sum used for limits on exposure.

    The name honours the Swede Rolf Sievert. In 1928, at a radiology congress in Stockholm, he
    became the first chairman of a committee on X-ray and radium protection, which took its present
    name, International Commission on Radiological Protection, in 1950. The name is lowercase in running text, the
    plural is sieverts, and the symbol Sv has a capital S and a lowercase v.
