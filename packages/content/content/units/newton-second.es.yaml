# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Newton segundo'
description: >-
  El newton segundo, de símbolo $\mathrm{N\,s}$, es la unidad derivada coherente del SI para el
  impulso: el impulso que transmite una fuerza constante de un newton que actúa durante un
  segundo. Sirve igualmente como unidad de cantidad de movimiento, ya que un impulso cambia la
  cantidad de movimiento de un cuerpo en la misma cantidad.

  Es el producto del newton, la unidad derivada del SI con nombre especial para la fuerza, por el
  segundo, la unidad básica de tiempo; no tiene nombre especial propio. Expresado en unidades
  básicas es el kilogramo metro por segundo, de modo que un newton segundo equivale exactamente a
  un kilogramo metro por segundo.

  Los textos de física suelen dar el impulso con el newton segundo y la cantidad de movimiento
  con el kilogramo metro por segundo, lo que mantiene separadas ambas magnitudes y permite comprobar
  el teorema del impulso unidad por unidad. El signo indica el sentido sobre un eje: un impulso de
  cierto tamaño en sentido negativo modifica el movimiento de forma exactamente opuesta a otro
  igual en sentido positivo. La libra fuerza segundo, su equivalente basado en la libra fuerza,
  vale exactamente $4.448\,221\,615\,260\,5\,\mathrm{N\,s}$, el mismo número de newtons que tiene
  la libra fuerza.

  La unidad se usa siempre que una fuerza actúa durante un tiempo medido: una raqueta que golpea
  una pelota, un cinturón y un airbag que detienen a un pasajero, o un impacto estimado a partir
  de la variación de la cantidad de movimiento.

  Las reglas del SI para símbolos compuestos exigen un espacio o un punto a media altura entre los
  dos símbolos, de modo que $\mathrm{N\,s}$ y $\mathrm{N\cdot s}$ son formas correctas. En el
  nombre, un espacio o un guion separa las dos unidades: newton segundo o newton-segundo.
