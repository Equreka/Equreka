description:
  en: 'The yard (symbol: $yd$) is an English unit of length, in both the British imperial and US
    customary systems of measurement, that comprises 3 feet or 36 inches. Since 1959 it is by
    international agreement standardized as exactly 0.9144 meters. 1,760 yards is equal to 1 mile.'
