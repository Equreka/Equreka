description:
  en: >-
    The yard, symbol yd, is a unit of length of the British imperial system and the United States
    customary system, equal to three feet or thirty-six inches. Since 1959 it has been the unit
    through which the foot, the inch and the mile of both systems are tied to the metre.

    The yard is exactly 0.9144 metre, $1\,\mathrm{yd}=0.914\,4\,\mathrm{m}$. The United States
    announced this value in a Federal Register notice effective on 1 July 1959; the metrology
    institutes of the United Kingdom, Canada, Australia, New Zealand and South Africa took up the
    same figure, which became known as the international yard. Canada's Weights and
    Measures Act writes it as 9144/10 000 metre, and NIST Special Publication 811 lists it as exact.

    A mile is 1760 yards, a square yard holds nine square feet and a cubic yard holds twenty-seven
    cubic feet. A metre is a little more than one yard and three inches.

    British road signs still count short distances in yards. The Department for Transport describes
    plates that give the distance to a low bridge in yards or miles, and countdown markers before a
    motorway exit in which each bar stands for about 100 yards.

    NIST regards the origin of the yard as uncertain: it may come from a double cubit or from early
    measures of volume. The early yard was halved repeatedly into the half-yard, span, finger and
    nail, and stories linking it to the waist or to the reach of King Henry I probably reflect acts
    of standardization. From 1893 to 1959 the American yard was 3600/3937 metre, two parts per
    million longer than the present yard.
