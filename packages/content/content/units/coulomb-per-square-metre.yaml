description:
  en: >-
    The coulomb per square metre, symbol $\mathrm{C/m^{2}}$, is the coherent SI derived unit of
    surface charge density, the electric charge held by each unit area of a surface. It is the
    coulomb, the SI unit of electric charge, divided by the square metre, and in SI base units it
    is the ampere second per square metre. It has no special name.

    The SI Brochure lists it in its table of coherent derived units for two quantities: surface
    charge density, and electric flux density, also called electric displacement. A surface on
    which every square metre carries one coulomb has a surface charge density of one coulomb per
    square metre.

    The unit is large for everyday electrostatics. Divided by the vacuum electric permittivity,
    about $8.854\times10^{-12}\,\mathrm{F/m}$, a surface charge in coulombs per square metre gives
    the field immediately outside a conductor in volts per metre, so one microcoulomb per square metre
    corresponds to about 113 kilovolts per metre. Laboratory values are therefore usually written
    with the prefixes micro or nano, in microcoulombs or nanocoulombs per square metre.

    The unit appears wherever charge lies on surfaces: capacitor plates, charged sheets and the
    surfaces of conductors, as well as the polarization of dielectrics, which QUDT also measures in
    it. Capacitor plates charged to $6.81\times10^{-7}\,\mathrm{C/m^{2}}$, an OpenStax example,
    set up a field of about 77 kilovolts per metre between them.

    The symbol may also be written C m⁻², with a negative exponent. The plural is coulombs per square metre.
