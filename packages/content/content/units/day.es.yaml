# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Día'
description: >-
  El día, de símbolo d, es una unidad de tiempo igual a 24 horas u 86 400 segundos. Queda fuera del
  SI, pero el folleto del SI lo incluye en la tabla 8 con el minuto y la hora entre las unidades
  de tiempo no SI de larga tradición cuyo uso prevé que continúe. En términos
  cotidianos es el periodo de luz y oscuridad que marca la rotación de la Tierra.

  Como unidad, el día se fija mediante el segundo del SI y no mediante la Tierra: la tabla 8 del
  folleto del SI da $1\,\mathrm{d}=24\,\mathrm{h}=86\,400\,\mathrm{s}$ exactamente, y la publicación
  especial 811 del NIST recoge el mismo factor. Por eso su duración nunca varía, a diferencia del
  día solar del que toma el nombre.

  Siete días forman una semana, y el NIST tabula un año de 365 días como 31 536 000 segundos y,
  para la astronomía, un siglo juliano como exactamente 36 525 días. El día sidéreo, una vuelta de
  la Tierra medida respecto de las estrellas, es más corto: unos 86 164.09 segundos en la tabla del
  NIST.

  Las edades, los calendarios, los periodos de incubación, la dosificación de fármacos y las
  semividas de muchos isótopos radiactivos se expresan en días. En astronomía la unidad cuenta las
  fechas de las observaciones, mientras que en los cálculos de física un tiempo en días se convierte
  a segundos antes de entrar en una fórmula.

  La rotación de la Tierra es irregular y, en promedio a largo plazo, se frena. El NIST explica que
  desde 1972 se intercalan segundos en el tiempo universal coordinado para mantenerlo a menos de 0.9
  segundos de la escala de tiempo basada en esa rotación, así que un día civil dura a veces 86 401
  segundos. La división del día en 24 horas se remonta al antiguo Egipto, donde relojes de sol y
  tablas de estrellas repartían la luz del día y la noche en 12 partes cada una. El símbolo d no
  lleva marca de plural ni punto.
