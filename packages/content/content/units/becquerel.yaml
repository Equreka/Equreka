description:
  en: >-
    The becquerel, symbol $\mathrm{Bq}$, is the coherent SI derived unit of activity, the rate at
    which the nuclei of a radionuclide undergo spontaneous transformation. An activity of one
    becquerel means one nuclear decay per second on average. It is one of the 22 units of the SI
    with a special name and symbol.

    In SI terms the becquerel is the reciprocal second, $\mathrm{s^{-1}}$. The 15th CGPM adopted the
    name in 1975 through Resolution 8, after the ICRU, the international commission on radiation units,
    asked for it, citing the danger that errors pose in radiotherapy. The SI
    Brochure restricts it to random decay processes in radionuclides and leaves the hertz, also a
    reciprocal second, for periodic phenomena, so that a decay count is never read as a frequency.

    The older curie equals exactly $3.7\times10^{10}\,\mathrm{Bq}$, so the becquerel is a very small
    unit, and practical results often carry prefixes such as the kilobecquerel, the megabecquerel
    and the gigabecquerel.

    The becquerel expresses how much radioactive material soil, food or tap water contains, usually
    per kilogram or per litre. Natural radium-226 in surface water, for example, generally lies
    between a few thousandths and about two hundredths of a becquerel per litre.

    The unit is named after the French physicist Henri Becquerel, who in 1896 found that uranium
    salts emit a penetrating radiation able to darken a photographic plate, the discovery of
    radioactivity. As for every SI unit named after a person, the name is written in lowercase in
    running text and the symbol starts with a capital letter; the plural is becquerels.
