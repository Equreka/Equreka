# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Segundo'
namePlural: 'segundos'
description: >-
  El segundo, de símbolo $\mathrm{s}$, es la unidad básica SI de tiempo. Mide duraciones, los
  intervalos entre sucesos y los periodos de oscilaciones y órbitas, y a través de su inversa, el
  hercio, fija también la unidad de frecuencia.

  La definición se apoya en el átomo de cesio-133. La frecuencia de la transición hiperfina de su
  estado fundamental no perturbado se fija en exactamente
  $\Delta\nu_{\mathrm{Cs}}=9\,192\,631\,770\,\mathrm{Hz}$, de modo que un segundo dura lo mismo que
  ese número de periodos de la radiación correspondiente. El folleto del SI se refiere a un átomo
  aislado, libre de campos que lo perturben, y trata el segundo como la unidad de tiempo propio de
  la relatividad general. Las definiciones del metro, del kilogramo y de la mayoría de las demás
  unidades SI recurren a esa frecuencia.

  El minuto, la hora y el día se aceptan para su uso con el SI como múltiplos exactos; el día
  equivale a $1\,\mathrm{d}=86\,400\,\mathrm{s}$. Las formas con prefijo, como el milisegundo y el
  nanosegundo, se emplean en electrónica y en física.

  Los relojes atómicos realizan la unidad, y las lecturas de muchos de ellos se combinan en el
  Tiempo Atómico Internacional, una escala definida por primera vez en 1970. Según el NIST, los
  relojes de cesio comerciales no se desvían más de un tercio de microsegundo al año.

  El segundo nació como una subdivisión astronómica: el Almagesto de Ptolomeo, hacia el año 150,
  dividía el grado en sesenta minutos y cada uno de ellos en sesenta segundos. Hasta 1960 la unidad
  de tiempo fue la 86 400.ª parte del día solar medio; las irregularidades de la rotación terrestre
  llevaron a la 11.ª CGPM a ratificar en 1960 un segundo basado en el año trópico de 1900, y la 13.ª
  CGPM adoptó la definición del cesio en 1967. La 26.ª CGPM la reformuló en 2018 a partir de una
  constante fija. El símbolo es s, nunca seg.
