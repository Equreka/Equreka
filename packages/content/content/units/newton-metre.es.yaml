# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Newton metro'
description: >-
  El newton metro, de símbolo $\mathrm{N\,m}$, es la unidad derivada coherente del SI para el
  momento de una fuerza: el momento de una fuerza de un newton que actúa perpendicularmente a un
  brazo de palanca de un metro. El folleto del SI la recoge en su tabla de unidades derivadas
  coherentes cuyos nombres incluyen unidades con nombre especial.

  Es el producto del newton por el metro y, en unidades básicas, equivale al kilogramo metro
  cuadrado por segundo al cuadrado, la misma combinación que el julio. Aun así, el folleto del SI
  mantiene separadas ambas unidades: establece que el julio nunca se usa para expresar el momento
  de una fuerza, porque este se define multiplicando vectorialmente un vector de posición por una
  fuerza, no como una cantidad de energía. Por eso el newton metro queda reservado para el momento de una
  fuerza, aunque un newton metro y un julio se reduzcan a las mismas unidades básicas.

  La publicación especial 811 del NIST da el kilogramo fuerza metro como exactamente 9.806 65
  veces el newton metro y la libra fuerza pie como unos $1.355\,818\,\mathrm{N\,m}$, y la
  dina centímetro del sistema CGS como exactamente una diezmillonésima de newton metro.

  La unidad describe el efecto de giro de las fuerzas allí donde importa la rotación, desde una
  llave sobre un perno hasta un motor que mueve su eje. Una fuerza de cuarenta newtons aplicada
  perpendicularmente a cuatro metros de un pivote produce un momento de $160\,\mathrm{N\,m}$.

  Las reglas del SI exigen un espacio o un punto a media altura entre los dos símbolos, porque un
  producto escrito sin separación puede confundirse con un prefijo: mN es el milinewton, no un
  metro newton. El nombre puede escribirse con espacio o con guion: newton metro o newton-metro.
