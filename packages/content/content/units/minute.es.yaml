# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Minuto'
description: >-
  El minuto, de símbolo min, es una unidad de tiempo igual a 60 segundos. No es una unidad del SI,
  pero el folleto del SI lo incluye en la tabla 8, junto con la hora y el día, entre las unidades de
  tiempo no SI de larga tradición cuyo uso prevé que continúe, y es la unidad de relojes,
  horarios y duraciones cotidianas.

  Su definición descansa por completo en el segundo del SI: $1\,\mathrm{min}=60\,\mathrm{s}$
  exactamente, como figura en la tabla 8 del folleto del SI y en la publicación especial 811 del
  NIST. Como el segundo se fija mediante la frecuencia hiperfina del cesio, el minuto hereda esa
  definición atómica y no necesita un patrón propio.

  Sesenta minutos forman una hora y 1440 minutos forman un día. Una rapidez en metros por minuto o
  un caudal en litros por minuto se pasa a unidades SI dividiendo entre 60, y una frecuencia por
  minuto, como un ritmo cardiaco de 72 latidos por minuto, equivale a 1.2 sucesos por segundo.

  La medicina, el deporte, la cocina, el transporte y la radiodifusión cuentan el tiempo en
  minutos, igual que muchos protocolos de laboratorio y las semividas de isótopos de vida corta. En
  la escala de tiempo civil, un minuto que recibe un segundo intercalar dura 61 segundos; el NIST
  señala que esas correcciones se aplican al tiempo universal coordinado desde 1972.

  El nombre procede de las fracciones sexagesimales de la astronomía griega: en el Almagesto,
  hacia el año 150, Ptolomeo dividió cada grado en 60 partes y cada parte de nuevo en 60, y los
  nombres latinos de la primera y la segunda división dieron minuto y segundo. Según el metrólogo
  del NIST Michael Lombardi, los relojes no empezaron a mostrar minutos hasta finales del siglo XVI.
  El símbolo min no lleva marca de plural ni punto, y el minuto de arco, una unidad de ángulo, es
  una unidad distinta con el símbolo ′.
