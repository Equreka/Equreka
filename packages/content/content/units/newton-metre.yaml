name:
  en: 'Newton metre'
symbol:
  tex: 'N\,m'
  text: 'N m'
unitOf:
  - 'torque'
system: 'si-derived'
compose:
  of:
    - unit: 'newton'
      exp: 1
    - unit: 'metre'
      exp: 1
