name:
  en: 'Radian per second'
symbol:
  tex: 'rad/s'
unitOf:
  - 'angular-velocity'
  - 'angular-frequency'
system: 'si-derived'
compose:
  of:
    - unit: 'radian'
      exp: 1
    - unit: 'second'
      exp: -1
