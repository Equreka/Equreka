description:
  en: >-
    The percent, symbol %, expresses a ratio or a fraction as a number of hundredths: one percent
    is the pure number 0.01. It belongs to no system of units in the strict sense, but the SI
    Brochure states that the internationally recognized symbol may be used with the SI to express
    the values of quantities of dimension one.

    Its value is fixed by definition, so that $1\,\%=0.01$ exactly and 100 % equals one. NIST
    Special Publication 811 gives the same reading, treating the symbol as standing for the number
    0.01. Both documents ask for a space between the number and the sign and prefer the symbol to
    the written name in technical text.

    A percentage is converted to a plain ratio by dividing by 100, so a mass fraction of 0.10 is
    10 %. Parts per million play the same role on a finer scale, meaning a relative value of one
    millionth, ten thousand times smaller than one percent.

    Percentages appear wherever a part is compared with a whole: discounts, interest rates, the
    relative change of a price, and the composition of mixtures in chemistry. Household bleach has
    a sodium hypochlorite mass fraction of 7.4 %, and wine an ethanol volume fraction of roughly
    12 %. Physiological saline, often labelled 0.9 %, is better stated as a mass concentration of
    0.9 grams of sodium chloride per 100 millilitres.

    Because the symbol stands for a number, the SI Brochure and NIST reject phrases such as
    percentage by mass or by volume and marks such as % (m/m); the kind of fraction should be named
    in the quantity instead, as in a mass fraction of 7.4 %. The SI Brochure spells the name per
    cent, in two words, while NIST writes percent.
