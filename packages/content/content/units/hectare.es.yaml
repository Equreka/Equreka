# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Hectárea'
description: >-
  La hectárea, de símbolo ha, es una unidad métrica de superficie igual a diez mil metros
  cuadrados, el área de un cuadrado de cien metros de lado. No es una unidad SI coherente, pero el
  folleto del SI la incluye entre las unidades no SI de uso común y señala que sirve para expresar
  superficies de terreno, lo que la convierte en la medida habitual de campos, bosques y parcelas.

  El folleto del SI da la definición
  $1\,\mathrm{ha}=1\,\mathrm{hm^{2}}=10^{4}\,\mathrm{m^{2}}$, es decir, un hectómetro cuadrado. El
  factor es exacto, y la publicación especial 811 del NIST también lo da como exacto. El nombre
  une el prefijo hecto, cien, al área, una unidad métrica menor de superficie agraria igual a un
  decámetro cuadrado, de modo que una hectárea son cien áreas.

  Cien hectáreas forman un kilómetro cuadrado, lo que enlaza la hectárea con las superficies
  mayores de los mapas y la geografía. El acre del mundo anglosajón es algo menos de media
  hectárea, y una hectárea es algo menos de dos acres y medio; el NIST da el acre exactamente en
  metros cuadrados, así que la razón entre ambas unidades se conoce con cualquier número de
  cifras.

  El CIPM adoptó el área y la hectárea, junto con sus símbolos, en 1879, décadas antes de que
  existiera el Sistema Internacional de Unidades. El símbolo ha se escribe en letra redonda
  minúscula, sin punto y sin marca de plural. Su nombre ya contiene el prefijo hecto, y el SI
  nunca acumula prefijos, así que las superficies mayores se expresan en kilómetros cuadrados.
