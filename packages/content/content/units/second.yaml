description:
  en: >-
    The second, symbol $\mathrm{s}$, is the SI base unit of time. It measures durations, the
    intervals between events and the periods of oscillations and orbits, and through its reciprocal,
    the hertz, it also sets the unit of frequency.

    The definition rests on the caesium-133 atom. The frequency of the hyperfine transition in its
    unperturbed ground state is fixed at exactly
    $\Delta\nu_{\mathrm{Cs}}=9\,192\,631\,770\,\mathrm{Hz}$, so one second lasts as long as that
    many periods of the corresponding radiation. The SI Brochure specifies an isolated atom, free of
    disturbing fields, and treats the second as the unit of proper time of general relativity. The
    definitions of the metre, the kilogram and most other SI units call on this frequency.

    The minute, the hour and the day are accepted for use with the SI as exact multiples, the day
    being $1\,\mathrm{d}=86\,400\,\mathrm{s}$. Prefixed forms such as the millisecond and the
    nanosecond serve in electronics and physics.

    Atomic clocks realize the unit, and the readings of many of them are combined into International
    Atomic Time, a scale first defined in 1970. NIST notes that commercial caesium clocks stay
    within about a third of a microsecond per year.

    The second began as an astronomical subdivision: the Almagest of Ptolemy, around 150 CE, divided
    the degree into sixty minutes and each of those into sixty seconds. Until 1960 the time unit was
    one 86 400th of the mean solar day; irregularities in the rotation of the Earth led the 11th
    CGPM to ratify in 1960 a second based on the tropical year 1900, and the 13th CGPM adopted the
    caesium definition in 1967. The 26th CGPM restated it in terms of a fixed constant in 2018. The
    symbol is s, never sec.
