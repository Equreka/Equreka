description:
  en: >-
    The pound per square inch, symbol psi, is the customary unit of pressure and stress in the
    United States, where tyre, hydraulic and boiler pressures are stated in it. Its full name is pound-force
    per square inch, because it measures the force that a weight of one pound exerts under standard
    gravity when spread over one square inch.

    The unit is defined through two exact units: the pound-force, the weight of one avoirdupois
    pound under the standard acceleration of gravity, and the inch, which NIST lists as an exact
    fraction of the metre.
    Their quotient fixes $1\,\mathrm{psi}\approx6894.757\,\mathrm{Pa}$, a value that NIST Special
    Publication 811 prints to seven digits in its table of conversion factors. The quotient is
    exact but not a terminating decimal, because dividing by the square of the inch brings in the
    factor 127, so the value is quoted rounded.

    One psi is a small pressure: the standard atmosphere is close to fifteen of them. For larger
    loads, engineers in the United States use the kip per square inch, or ksi, one thousand times
    larger, to state the strength and stiffness of steel and other structural materials. The
    pound per square inch therefore serves both kinds of force per area: the pressure of a fluid
    against a wall and the stress inside a loaded solid.

    Gauges often add a letter to the symbol, writing psig for a reading above the surrounding air
    and psia for an absolute reading. The SI Brochure rejects that practice for its own units,
    since a unit symbol must not carry information about the quantity: the reference belongs in
    the name of the quantity, as gauge pressure or absolute pressure. The symbol psi itself is an
    abbreviation, while the symbol that follows the rules for compound units is lbf/in².
