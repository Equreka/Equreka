description:
  en: >-
    The degree is a unit of plane angle equal to one 360th of a full turn. It is not an SI unit, but
    the SI Brochure lists it among the non-SI units that remain in use alongside the SI, and it is
    the angle unit of school geometry, trigonometry, navigation and maps.

    The SI Brochure defines the degree in terms of the radian: one degree equals $\pi/180$ radian.
    Because $\pi$ is irrational, this factor has no finite decimal form; the value used for
    conversion here is rounded to 36 significant digits, about 0.017 453 radian.

    A right angle is 90 degrees, a straight angle 180 degrees and a full turn 360 degrees, or
    $2\pi$ radians. Each degree divides into 60 arcminutes, and each arcminute into 60 arcseconds,
    so a degree holds 3600 arcseconds. One radian is a little more than 57 degrees.

    Degrees describe latitude and longitude, compass bearings, the slope of roads and roofs, the
    angles of a triangle and the settings of protractors and theodolites. Pocket calculators offer
    a degree mode alongside a radian mode, and the trigonometric functions of a calculator give
    wrong results when the two are mixed up. The SI Brochure advises dividing the degree decimally,
    as in 12.25° rather than 12°15′, except in navigation, cartography, astronomy and the measurement of very small
    angles, where degrees, minutes and seconds remain customary.

    The symbol ° follows the number with no space, unlike most unit symbols: 30° rather than 30 °.
    The same rule applies to the arcminute and arcsecond. The degree of plane angle is distinct
    from the degree Celsius, a unit of temperature that does take a space before its symbol.
