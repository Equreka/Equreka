description:
  en: >-
    The dioptre, symbol D, is the unit in which the optical power of lenses, curved mirrors and the
    eye is expressed. It is a special name for the reciprocal metre, used in optics, optometry and
    ophthalmology, and it lies outside the International System of Units.

    By definition, one dioptre equals exactly one reciprocal metre. Council Directive 80/181/EEC of
    the European Union lists the dioptre, with that value, among the units permitted only in
    specialized fields, for what it calls the vergency of optical systems. The SI Brochure leaves it
    out of its table of non-SI units; for quantities of inverse length, such as wavenumber, it gives
    the reciprocal metre as the coherent unit.

    A lens of focal length one metre has a power of one dioptre, and the power in dioptres is the
    reciprocal of the focal length in metres. A focal length of 25 centimetres corresponds to four
    dioptres, and a diverging lens of focal length minus 50 centimetres to minus two dioptres.

    Spectacle prescriptions, eye examinations and the ratings of magnifiers quote powers in
    dioptres; OpenStax describes common reading glasses rated from 1.0 to 3.5 dioptres. Medical data
    standards include the unit as well: the Unified Code for Units of Measure defines its diopter as
    one per metre.

    The French ophthalmologist Ferdinand Monoyer proposed the name in 1872 in the Annales
    d'Oculistique, taking a lens of one metre focal length as the unit of refraction. The symbol D
    appears in textbooks and in QUDT; diopter is the American spelling.
