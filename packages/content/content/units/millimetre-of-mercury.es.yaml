# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Milímetro de mercurio'
description: >-
  El milímetro de mercurio, de símbolo mmHg, es una unidad manométrica de presión: la que produce
  en el fondo un milímetro de altura de mercurio. Queda fuera del Sistema Internacional
  de Unidades y sobrevive sobre todo en medicina, donde la presión arterial se sigue midiendo y
  comunicando en ella, y en trabajos antiguos sobre el vacío y los gases.

  Una columna real de mercurio depende de la temperatura y de la gravedad local, por lo que la
  unidad en uso es convencional. Toma una densidad del mercurio de exactamente
  $13.5951\,\mathrm{g/cm^{3}}$ y la aceleración normal de la gravedad,
  $9.806\,65\,\mathrm{m/s^{2}}$, que juntas dan $1\,\mathrm{mmHg}=133.322\,387\,415\,\mathrm{Pa}$
  según ese convenio. La publicación especial 811 del NIST imprime el factor redondeado a siete cifras y
  advierte que más cifras no tienen sentido físico, ya que el convenio no tiene en cuenta la
  compresibilidad del mercurio ni el cambio de su densidad con la escala de temperatura vigente.

  El milímetro de mercurio tiene casi el mismo tamaño que el torr, que se define en cambio como la
  760.ª parte de la atmósfera estándar. Ambos difieren en una parte en siete millones,
  aproximadamente, muy por debajo de la resolución de cualquier tensiómetro, de modo que en la
  práctica son intercambiables, aunque no idénticos por definición.

  En 1978 el CIPM permitió que el milímetro de mercurio siguiera usándose junto al SI en los campos
  que ya dependían de él, y la guía del NIST lo incluye entre esas unidades, con la recomendación
  de no extender su uso. Los umbrales clínicos, como los valores con los que la Organización
  Mundial de la Salud diagnostica la hipertensión, se expresan en esta unidad. El símbolo se
  escribe mmHg, con o sin espacio antes de Hg, y nunca lleva marca de plural.
