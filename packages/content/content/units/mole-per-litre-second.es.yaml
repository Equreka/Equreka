# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Mol por litro y segundo'
description: >-
  El mol por litro y segundo, de símbolo $\mathrm{mol/(L\,s)}$, es la unidad de trabajo de las
  velocidades de reacción en química: un cambio de un mol por litro en la concentración de un
  reactivo o de un producto en cada segundo. No es una unidad SI coherente, porque el litro es una
  unidad ajena al SI que el folleto del SI acepta para su uso junto con él.

  La unidad es el mol por litro, la unidad habitual de la concentración de cantidad de sustancia,
  dividido entre el segundo. El folleto del SI iguala el litro al decímetro cúbico, la milésima parte
  del metro cúbico, así que la unidad coincide con el mol por decímetro cúbico y segundo y equivale
  exactamente a 1000 moles por metro cúbico y segundo, la unidad SI coherente de la velocidad de
  reacción.

  Las velocidades de las reacciones lentas pueden darse también por minuto o por hora. OpenStax, por ejemplo,
  sigue la descomposición del peróxido de hidrógeno en moles por litro y hora; un mol por litro y
  hora es la 3600.ª parte de esta unidad. Como M es una abreviatura común de mol/L, los libros de
  texto también escriben la unidad M/s.

  La química de introducción, los laboratorios de cinética y las tablas de velocidades iniciales usan
  esta unidad, y la IUPAC da las constantes de velocidad en potencias del decímetro cúbico por mol
  multiplicadas por el segundo inverso, con la misma elección de volumen. En inglés estadounidense el
  nombre se escribe mole per liter second, la l minúscula es un símbolo igual de válido para el
  litro, y el plural es moles por litro y segundo.
