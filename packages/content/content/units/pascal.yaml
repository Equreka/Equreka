name:
  en: 'Pascal'
namePlural:
  en: 'pascals'
symbol:
  tex: 'Pa'
unitOf:
  - 'pressure'
  - 'stress'
system: 'si-derived'
prefixes:
  - 'femto'
  - 'pico'
  - 'nano'
  - 'micro'
  - 'milli'
  - 'hecto'
  - 'kilo'
  - 'mega'
  - 'giga'
  - 'tera'
compose:
  of:
