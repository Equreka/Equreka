description:
  en: >-
    The pascal, symbol $\mathrm{Pa}$, is the coherent SI derived unit of pressure and of
    mechanical stress, equal to one newton per square metre. It measures any force spread over an
    area: the pressure of a gas or liquid, normal and shear stress inside a solid, and elastic
    moduli such as Young's modulus, which have the same dimension. In SI base units it is the
    kilogram per metre per second squared.

    The SI Brochure lists the pascal among the 22 units with special names, expressed in other SI
    units as the newton per square metre. Like the other derived units, it has no standard of its
    own and follows from the kilogram, the metre and the second. Pressure is a scalar, built from
    the force acting perpendicular to a surface; a fluid cannot sustain shear, whereas a solid
    also carries shear stress, and both kinds of stress take the pascal.

    One newton over a whole square metre is a small pressure, so everyday values run into
    thousands or hundreds of thousands of pascals. The standard atmosphere is defined as exactly
    $101\,325\,\mathrm{Pa}$ and the bar as exactly $10^{5}\,\mathrm{Pa}$, which makes the
    hectopascal equal to the millibar. The pound-force per square inch is about 6895 pascals.

    Pressure is also an energy density, since a pascal equals a joule per cubic metre, and in
    fluids it grows with depth by the weight of the overlying column. Prefixed names such as
    micropascal, kilopascal and megapascal are written as single words.

    The 14th CGPM gave the newton per square metre the special name pascal, symbol Pa, in 1971.
    The name honours Blaise Pascal (1623-1662), French mathematician and physicist. The plural is
    pascals.
