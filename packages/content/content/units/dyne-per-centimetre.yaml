description:
  en: >-
    The dyne per centimetre, symbol $\mathrm{dyn/cm}$, is the unit of force per unit length of the
    centimetre-gram-second (CGS) system. It is the unit in which surface tensions of liquids have
    long been tabulated, and it lies outside the SI.

    It is one dyne acting along one centimetre. A dyne is exactly one hundred-thousandth of a newton,
    as NIST Special Publication 811 states, and a centimetre is one hundredth of a metre, so the unit
    equals exactly one thousandth of a newton per metre; QUDT records the same multiplier.

    Because the factor is a thousandth, a surface tension in dynes per centimetre has the same number
    as in millinewtons per metre, and tables convert by renaming the unit. The erg per square
    centimetre, a CGS unit of surface energy, is numerically identical, since an erg is a dyne
    centimetre.

    Data books and laboratory tensiometers still quote the unit. Water has about 72.8 dynes per
    centimetre at 20 degrees Celsius and about 72 at 25 degrees, ethyl alcohol about 22.3 and
    mercury about 465, so most everyday liquids fall between 20 and 80.

    Its parent system rests on three mechanical units, the centimetre, the gram and the second, and dates from 1874, when the British Association for the Advancement of Science introduced it. The plural is dynes per centimetre, and the symbol
    is also written with the centimetre raised to the power minus one.
