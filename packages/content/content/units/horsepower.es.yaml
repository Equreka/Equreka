# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Caballo de fuerza'
description: >-
  El caballo de fuerza, de símbolo hp, es una unidad de potencia de los sistemas imperial y
  tradicional de Estados Unidos. El caballo de fuerza mecánico, la variante que el NIST cita en
  primer lugar, se define como 550 veces el pie libra fuerza por segundo: la potencia que eleva un
  peso de 550 libras fuerza un pie en cada segundo.

  El pie equivale exactamente a 0.3048 metros y la libra fuerza exactamente a 4.448 221 615 260 5
  newtons, de modo que la definición fija
  $1\,\mathrm{hp}=745.699\,871\,582\,270\,22\,\mathrm{W}$ exactamente. La publicación especial 811
  del NIST imprime el factor redondeado a siete cifras, 745.6999 vatios, en su apéndice B.8.

  Como un minuto tiene sesenta segundos, la definición equivale a 33 000 veces el pie libra fuerza
  por minuto. Un caballo de fuerza equivale a unos 1.014 caballos de vapor. Hay otras variantes en uso,
  y el NIST las da por separado: el caballo de fuerza eléctrico de exactamente 746 vatios, el
  hidráulico de unos 746.043 vatios y el de caldera de unos 9809.5 vatios, por lo que una
  indicación cuidadosa nombra la variante.

  El SI expresa la potencia en vatios y kilovatios, y el caballo de fuerza sigue usándose para
  indicar la potencia de motores. Fuera de Estados Unidos, la palabra inglesa horsepower se emplea
  a menudo para el caballo de vapor, según el diccionario de unidades de Rowlett, por lo que una
  potencia en caballos puede requerir una nota sobre la unidad empleada.

  La cifra de 550 veces el pie libra por segundo, tomada como el ritmo de trabajo que un caballo
  puede sostener, se remonta a James Watt según el diccionario de Rowlett, y la unidad SI de
  potencia lleva hoy el nombre de Watt. El símbolo es hp, en minúsculas.
