description:
  en: 'Long ton, also known as the imperial ton or displacement ton, is the name for the unit called
    the "ton" in the avoirdupois system of weights or Imperial system of measurements. It was
    standardised in the thirteenth century. It is used in the United Kingdom and several other
    Commonwealth of Nations countries alongside the mass-based metric tonne defined in 1799, as well
    as in the United States for bulk commodities.'
