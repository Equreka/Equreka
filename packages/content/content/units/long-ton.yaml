description:
  en: >-
    The long ton is a unit of mass equal to 2240 avoirdupois pounds. It is the ton of the British
    imperial system, also called the gross ton or shipper's ton, and the qualifier long separates it
    from the 2000-pound short ton used in the United States and from the metric tonne.

    With the international pound fixed in 1959 at 0.453 592 37 kilogram, the long ton is exactly
    $2240\,\mathrm{lb}=1016.046\,908\,8\,\mathrm{kg}$. NIST Special Publication 811 lists it, rounded,
    as 1016.047 kilograms.

    In the British table of mass the long ton is twenty hundredweight of 112 pounds each, or 160
    stones. It is 1.12 short tons and about 1.6 per cent more than a tonne, so the three tons are
    close enough to be confused but different enough to matter in bulk trade.

    Shipping keeps the unit alive. According to NIST, overseas cargo statistics are normally kept
    in long or metric tons, seldom in short tons, and a ship's deadweight tonnage, the combined mass
    of fuel, passengers and cargo it bears when laden down to its deepest permitted draught, is
    stated in the same two units. NIST also names the long ton as the ton most commonly used in
    Great Britain.

    The name reflects American usage. In the United States an unqualified ton or hundredweight
    means the short units of 2000 and 100 pounds, so the British units of 2240 and 112 pounds are
    called long or gross. NIST gives the long ton no symbol and writes its name in full, while the
    QUDT vocabulary uses t{long}.
