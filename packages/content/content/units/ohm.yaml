description:
  en: >-
    The ohm, symbol $\Omega$, is the coherent SI derived unit of electrical resistance, the
    opposition of a conductor to the passage of a steady current, and also of reactance and
    impedance in alternating-current circuits. One ohm is one volt per ampere; in SI base units it
    is the kilogram square metre per second cubed per square ampere.

    The CIPM definition of 1946 states that a conductor has a resistance of one ohm between two
    points if a steady one-volt potential difference applied between them drives a current of one
    ampere, provided the conductor itself generates no electromotive force. The reciprocal of the
    ohm, the unit of conductance, received the special name siemens from the 14th CGPM in 1971.
    The product of an ohm and a farad is a second.

    Laboratories realize the ohm with the quantum Hall effect, whose von Klitzing constant equals
    the Planck constant divided by the square of the elementary charge. The CIPM set a
    conventional value of exactly 25 812.807 ohms for it from 1990; the 2018 revision of the SI
    fixed both constants, so the von Klitzing constant now has an exact value,
    25 812.807 45... ohms, whose decimal digits never end, and the conventional value was abrogated.

    The capital Greek letter omega serves as the symbol to avoid confusion with the numeral 0.

    The unit is named after the German scientist Georg Simon Ohm (1789-1854),
    whose book of 1827 set out what is now called Ohm's law. The 11th CGPM listed the ohm among the
    derived units of the SI in 1960. The plural is ohms.
