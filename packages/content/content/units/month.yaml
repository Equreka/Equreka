description:
  en: >-
    The month, as a unit of time for conversions, is one twelfth of a common year of 365 days. It
    is a calendar unit outside the SI, used for durations where the unequal lengths of the
    calendar months do not matter, such as loan terms, the ages of infants or monthly rates.

    No standard fixes its value, which rests on a convention: one twelfth of 31 536 000 seconds,
    the 365-day year that NIST Special Publication 811 tabulates, is 2 628 000 seconds, exactly 30
    days and 10 hours. QUDT has no unit with this value; its unit MO is the synodic month, and
    its mean Gregorian month lasts 2 629 746 seconds.

    The months of the Gregorian calendar keep the lengths they had in the Julian calendar: seven
    of 31 days, four of 30, and February with 28 days, or 29 in a leap year. Twelve of them
    average 30.436 875 days over the 400-year Gregorian cycle. The synodic month, the mean interval
    between two conjunctions of the Moon and the Sun, is about 29.530 59 days, and a single cycle
    of phases may depart from that mean by up to seven hours.

    Lunar calendars start each month with a new cycle of the Moon's phases, while the Gregorian
    calendar keeps months only as divisions of the solar year. In physics a time given in months
    is converted to seconds, and the result depends on which month was meant.

    The symbol mo follows QUDT, which writes it for its months. A lone m would clash with the
    metre, so mo or the full word is the safe form.
