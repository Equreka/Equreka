# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Lumen'
description: >-
  El lumen, de símbolo $\mathrm{lm}$, es la unidad SI derivada coherente de flujo luminoso, la
  potencia de la radiación ponderada según la sensibilidad espectral de la visión humana. Un lumen
  es el flujo luminoso que una fuente puntual de una candela emite de manera uniforme en un ángulo
  sólido de un estereorradián, de modo que el lumen equivale a la candela estereorradián.

  La CIE define el flujo luminoso como el ritmo de transferencia de energía luminosa y lo obtiene a
  partir del flujo radiante ponderando cada longitud de onda según su efecto sobre el observador
  fotométrico patrón de la CIE. El SI vincula esta ponderación con la física mediante una constante
  definitoria: la eficacia luminosa fijada para la radiación monocromática de 540 terahercios es
  exactamente $683\,\mathrm{lm/W}$. Un vatio de radiación de esa frecuencia transporta por tanto 683
  lúmenes, mientras que el mismo vatio en longitudes de onda que el ojo apenas percibe produce
  muchos menos.

  El folleto del SI señala que el lumen, el lux y la candela incorporan datos de la visión
  humana. La iluminancia, el flujo luminoso que
  incide sobre una superficie por unidad de área, se mide en lux, y un lux es un lumen por metro
  cuadrado. En fotometría el estereorradián se suele mantener en las expresiones escritas, por lo
  que el lumen aparece como cd sr y no como la candela sola.

  La emisión de las lámparas se indica en lúmenes: una bombilla incandescente típica de 100 vatios
  da unos 1700 lúmenes.

  El CIPM definió en 1946 un nuevo lumen como el flujo emitido en un estereorradián por una fuente
  puntual uniforme de una nueva candela; el calificativo nuevo se abandonó después. La 16.ª CGPM
  redefinió en 1979 la candela mediante el valor de 683 lúmenes por vatio, que la revisión de 2018
  mantuvo como constante definitoria exacta. El plural es lúmenes.
