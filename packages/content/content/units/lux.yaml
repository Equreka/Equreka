description:
  en: >-
    The lux, symbol lx, is the coherent SI derived unit of illuminance, the luminous flux falling
    on a surface per unit area. It is one of the 22 SI units with special names, and like the
    candela and the lumen it carries information about human vision, because the light it counts
    is weighted by the sensitivity of the eye.

    One lux is one lumen spread evenly over one square metre:
    $1\,\mathrm{lx}=1\,\mathrm{lm/m^{2}}=1\,\mathrm{cd\,sr\,m^{-2}}$, the expression the SI
    Brochure gives in its Table 4. A small source of one candela produces one lux on a surface one
    metre away that faces it, and the illuminance falls with the square of the distance.

    NIST Special Publication 811 converts the CGS phot as exactly $10^{4}$ lux and the foot-candle,
    one lumen per square foot, as about 10.763 91 lux, so that a lux is roughly 0.0929 foot-candle.
    The lux differs from the lumen only by the area: a lamp emitting 1000 lumens that fall evenly on
    two square metres gives 500 lux.

    Lighting requirements are written in lux, and most light meters read it directly. The UK
    Health and Safety Executive recommends average illuminances of about 20 lux for corridors and
    vehicle routes, 200 lux for offices and 500 lux for work with fine detail, such as drawing or
    the assembly of electronic components.

    The 9th General Conference on Weights and Measures included the symbol lx in the list of unit
    symbols it adopted in 1948, and the lux was among the derived units listed when the 11th
    Conference founded the International System of Units in 1960. The unit name is lower case,
    and its symbol lx is never written with a capital letter.
