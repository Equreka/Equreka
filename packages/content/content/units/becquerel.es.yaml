# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Becquerel'
namePlural: 'becquerels'
description: >-
  El becquerel, de símbolo $\mathrm{Bq}$, es la unidad SI derivada coherente de actividad, el
  ritmo al que los núcleos de un radionucleido sufren una transformación espontánea. Una actividad
  de un becquerel significa, en promedio, una desintegración nuclear por segundo. Es una de las 22
  unidades del SI con nombre y símbolo especiales.

  En términos del SI, el becquerel es la inversa del segundo, $\mathrm{s^{-1}}$. La 15.ª CGPM
  adoptó el nombre en 1975 mediante la Resolución 8, tras la petición de la ICRU, la comisión
  internacional de unidades de radiación, que alegó el peligro de los errores en radioterapia.
  El folleto del SI lo limita a los procesos aleatorios de desintegración en radionucleidos y deja
  el hercio, también inversa del segundo, para los fenómenos periódicos, de modo que un recuento
  de desintegraciones nunca se lea como una frecuencia.

  El antiguo curie equivale exactamente a $3.7\times10^{10}\,\mathrm{Bq}$, así que el becquerel es
  una unidad muy pequeña y los resultados prácticos llevan a menudo prefijos como el
  kilobecquerel, el megabecquerel y el gigabecquerel.

  El becquerel expresa cuánto material radiactivo contienen el suelo, los alimentos o el agua del
  grifo, normalmente por kilogramo o por litro. El radio-226 natural del agua superficial, por
  ejemplo, suele estar entre unas milésimas y unas dos centésimas de becquerel por litro.

  La unidad lleva el nombre del físico francés Henri Becquerel, que en 1896 observó que las sales
  de uranio emiten una radiación penetrante capaz de velar una placa fotográfica, el
  descubrimiento de la radiactividad. Como toda unidad SI que procede del nombre de una persona, el
  nombre se escribe en minúscula en el texto corrido y el símbolo empieza con mayúscula; el plural
  es becquerels.
