description:
  en: >-
    The pound-force, symbol $\mathrm{lbf}$, is the unit of force that goes with the avoirdupois
    pound in the imperial and US customary systems: the weight of a mass of one pound under the
    standard acceleration of gravity. It is not an SI unit.

    Its value follows from two exact definitions: the avoirdupois pound of exactly
    $0.453\,592\,37\,\mathrm{kg}$, and the standard acceleration of gravity, a conventional value
    adopted by the General Conference on Weights and Measures in 1901. Their product makes one
    pound-force exactly $4.448\,221\,615\,260\,5\,\mathrm{N}$. NIST Special Publication 811 lists
    the rounded factor 4.448 222 in its Appendix B.8 and gives the exact value in the accompanying
    footnote, on the condition that the standard value of gravity is used.

    Many customary units are built on it. NIST converts the pound-force foot, a unit of torque, and
    the pound-force per inch to the newton metre and the newton per metre with factors of about
    1.355 818 and 175.126 8; the pound-force per square inch, a unit of pressure, is the
    pound-force acting on one square inch. Because the kilogram-force is defined from the kilogram
    with the same standard gravity, one pound-force equals as many kilograms-force as the pound has
    kilograms.

    The pound-force is a force and the pound is a mass; writing lbf for the force keeps the two
    apart. On the surface of the Earth a mass of one pound weighs about one pound-force, but the two
    match exactly only where the local acceleration of gravity equals the standard value. The
    plural is pounds-force.
