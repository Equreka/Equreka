# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pinta estadounidense'
description: >-
  La pinta estadounidense, escrita pt, liq pt o US pt, es la pinta para líquidos del sistema
  consuetudinario estadounidense, igual a la octava parte de un galón estadounidense o 28.875
  pulgadas cúbicas. Solo mide líquidos, ya que los áridos estadounidenses tienen su propia pinta, y
  es aproximadamente una sexta parte menor que la pinta imperial británica.

  El galón estadounidense mide 231 pulgadas cúbicas y la pulgada exactamente 25.4 milímetros, de modo
  que la pinta vale exactamente $473.176\,473\,\mathrm{mL}$. La publicación especial 811 del NIST
  recoge la pinta líquida, redondeada, como 0.473 176 5 litros.

  Dos pintas forman un cuarto de galón líquido y ocho forman un galón; una pinta equivale a cuatro
  gills o dieciséis onzas líquidas estadounidenses. La pinta imperial, de unos 568.26 mililitros,
  contiene veinte onzas líquidas imperiales algo más pequeñas, de modo que las dos unidades que
  comparten el nombre difieren en aproximadamente una quinta parte.

  Una pinta seca estadounidense distinta, la mitad de un cuarto de galón seco y unos 550.6
  mililitros, pertenece a las medidas de áridos de la familia del bushel. El manual 44 del NIST pide
  añadir la palabra líquida o seca siempre que las dos pintas puedan confundirse, y la publicación
  especial 811 del NIST las abrevia como liq pt y dry pt.

  La pinta estadounidense es la octava parte de la medida de 231 pulgadas cúbicas que Inglaterra
  usaba antes para el vino, un galón que los colonos conservaron después de que Gran Bretaña pasara
  al galón imperial en 1824. El NIST observa que el
  hon del antiguo Egipto, una unidad de volumen que contenía aproximadamente una mina de agua, tenía
  casi exactamente el tamaño de la actual pinta estadounidense.
