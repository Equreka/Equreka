description:
  en: >-
    The gram per litre, symbol $\mathrm{g/L}$, is a unit of mass concentration: one gram of a
    substance dissolved or dispersed in each litre of a mixture. It is not a coherent SI unit,
    because it combines the gram, a submultiple of the kilogram, with the litre, a unit accepted for
    use with the SI.

    The gram is a thousandth of a kilogram and the litre a thousandth of a cubic metre, so the two
    factors cancel: one gram per litre equals exactly one kilogram per cubic metre, the coherent SI
    unit of both mass concentration and density. A value therefore keeps the same number when it
    passes from one unit to the other.

    Its submultiple the milligram per litre, equal to one gram per cubic metre, serves for dissolved
    traces in water. One gram per litre is also one milligram per millilitre, and the medical
    milligram per decilitre equals one hundredth of a gram per litre.

    Physiological saline, labelled 0.9 % mass per volume, holds 9 grams of sodium chloride in each
    litre, and the fasting level of glucose in blood, quoted as 70 to 100 milligrams per decilitre,
    corresponds to 0.70 to 1.00 grams per litre. QUDT also lists the unit for density, which suits
    gases: air at the freezing point of water and atmospheric pressure has about 1.29 grams per
    litre.

    The SI Brochure allows both l and L for the litre, so g/l and g/L are equally correct. The
    name is spelled gram per liter in American English, and the plural is grams per litre.
