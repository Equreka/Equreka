description:
  en: >-
    The gram per cubic centimetre, symbol $\mathrm{g/cm^{3}}$, is the unit of density of the
    centimetre-gram-second (CGS) system: the density of a material of which one cubic centimetre
    has a mass of one gram. It is not a coherent SI unit, but both of its parts are decimal
    submultiples of SI units, the gram of the kilogram and the centimetre of the metre.

    It equals exactly $1000\,\mathrm{kg/m^{3}}$, a factor that NIST Special Publication 811 marks
    as exact in its Appendix B.8. Because the SI Brochure defines the litre as one cubic decimetre,
    a millilitre is one cubic centimetre, so one gram per cubic centimetre is also one gram per
    millilitre and one kilogram per litre.

    The unit suits liquids and solids because the kilogram was first set as the mass of a cubic
    decimetre of water at its densest, so water comes out close to one gram per cubic centimetre.
    Densities in this unit therefore read almost the same as specific gravity, the density
    relative to water: aluminium has about 2.70 grams per cubic centimetre and gold about
    $19.3\,\mathrm{g/cm^{3}}$.

    The CGS system to which the unit belongs was introduced in 1874 by the British Association, a
    scientific society, and was built on the centimetre, the gram and the second, and much of the
    later growth of experimental physics was based on it.

    The symbol may also be written with a negative exponent; the informal abbreviation g/cc does
    not follow the rules for unit symbols. The plural is grams per cubic centimetre.
