name:
  en: 'Mole per litre second'
symbol:
  tex: 'mol/(L\,s)'
  text: 'mol/(L·s)'
unitOf: []
system: 'other'
compose:
  of:
    - unit: 'mole'
      exp: 1
    - unit: 'litre'
      exp: -1
    - unit: 'second'
      exp: -1
categories:
  - 'chemistry'
branches:
  - 'chemical-kinetics'
aliases:
  - 'mole per liter second'
  - 'mole per litre per second'
  - 'molar per second'
  - 'mol/(L s)'
  - 'mol/L/s'
  - 'mol L-1 s-1'
  - 'mol/(dm3 s)'
  - 'mol dm-3 s-1'
  - 'mol por litro y segundo'
references:
  - title: 'OpenStax, Chemistry 2e, 12.1 Chemical Reaction Rates'
    url: 'https://openstax.org/books/chemistry-2e/pages/12-1-chemical-reaction-rates'
  - title: 'IUPAC, Quantities, Units and Symbols in Physical Chemistry, 3rd ed. (Green Book), section 2.12'
    url: 'https://iupac.org/wp-content/uploads/2019/05/IUPAC-GB3-2012-2ndPrinting-PDFsearchable.pdf'
  - title: 'BIPM, The International System of Units, 9th ed., Table 8 (litre)'
    url: 'https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf'
description:
  en: >-
    The mole per litre second, symbol $\mathrm{mol/(L\,s)}$, is the working unit of reaction rates
    in chemistry: a change of one mole per litre in the concentration of a reactant or product in
    each second. It is not a coherent SI unit, because the litre is a unit outside the SI that the
    SI Brochure accepts for use with it.

    The unit is the mole per litre, the everyday unit of amount concentration, divided by the
    second. The SI Brochure sets the litre equal to the cubic decimetre, a thousandth of a cubic
    metre, so the unit is the same as the mole per cubic decimetre second and equals exactly 1000
    moles per cubic metre second, the coherent SI unit of the rate of reaction.

    Slow reactions may have their rates quoted per minute or per hour instead. OpenStax, for example,
    follows the decomposition of hydrogen peroxide in moles per litre hour; one mole per litre hour
    is one 3600th of this unit. Because M is a common shorthand for mol/L, textbooks also write the
    unit M/s.

    Introductory chemistry, kinetics laboratories and tables of initial rates use the unit, and
    IUPAC quotes rate constants in powers of the cubic decimetre per mole times the reciprocal
    second, the same choice of volume. The name is spelled mole per liter second in American
    English, the lower-case l is an equally valid symbol for the litre, and the plural is moles per
    litre second.
