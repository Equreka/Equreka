# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Dioptría'
description: >-
  La dioptría, de símbolo D, es la unidad en que se expresa la potencia óptica de las lentes, de los
  espejos curvos y del ojo. Es un nombre especial del metro recíproco que se usa en óptica,
  optometría y oftalmología, y queda fuera del Sistema Internacional de Unidades.

  Por definición, una dioptría equivale exactamente a un metro recíproco. La Directiva 80/181/CEE
  del Consejo de la Unión Europea incluye la dioptría, con ese valor, entre las unidades admitidas
  únicamente en sectores especializados, para la potencia de los sistemas ópticos. El folleto del SI
  no la recoge en su tabla de unidades no SI; para las magnitudes de longitud inversa, como el
  número de ondas, da el metro recíproco como unidad coherente.

  Una lente de un metro de distancia focal tiene una potencia de una dioptría, y la potencia en
  dioptrías es el inverso de la distancia focal en metros. Una distancia focal de 25 centímetros
  corresponde a cuatro dioptrías, y una lente divergente de distancia focal menos 50 centímetros, a
  menos dos dioptrías.

  Las graduaciones de las gafas, los exámenes de la vista y las especificaciones de las lupas
  expresan la potencia en dioptrías; OpenStax describe gafas de lectura comunes graduadas entre 1.0
  y 3.5 dioptrías. Los estándares de datos médicos también incluyen la unidad: el Código Unificado
  para Unidades de Medida define su dioptría como uno por metro.

  El oftalmólogo francés Ferdinand Monoyer propuso el nombre en 1872 en los Annales d'Oculistique,
  tomando como unidad de refracción una lente de un metro de distancia focal. El símbolo D aparece en
  los libros de texto y en QUDT; diopter es la grafía estadounidense en inglés.
