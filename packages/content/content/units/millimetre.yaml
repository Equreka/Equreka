name:
  en: 'Millimetre'
symbol:
  tex: 'mm'
unitOf:
  - 'length'
system: 'si-derived'
prefixOf:
  prefix: 'milli'
  base: 'metre'
categories:
  - 'physics'
description:
  en: >-
    The millimetre (International spelling; SI unit symbol $mm$) or millimeter (American spelling)
    is a unit of length in the metric system, equal to one thousandth of a metre, which is the SI
    base unit of length. Therefore, there are one thousand millimetres in a metre. There are ten
    millimetres in a centimetre.
