name:
  en: 'Centimetre'
symbol:
  tex: 'cm'
unitOf:
  - 'length'
system: 'si-derived'
prefixOf:
  prefix: 'centi'
  base: 'metre'
categories:
  - 'physics'
description:
  en: >-
    A centimetre (International spelling) or centimeter (American spelling) (SI symbol $cm$) is a
    unit of $length$ in the metric system, equal to one hundredth of a metre, centi being the SI
    prefix for a factor of $1/100$. The centimetre was the base unit of $length$ in the now
    deprecated centimetre–gram–second (CGS) system of units.
