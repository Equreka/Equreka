description:
  en: >-
    The centimetre, symbol $\mathrm{cm}$, is a unit of length equal to one hundredth of a metre,
    formed with the SI prefix centi. It suits lengths on the scale of the human body and of objects
    held in the hand, and it was the base unit of length of the centimetre-gram-second (CGS) system
    of physics.

    The relation $1\,\mathrm{cm}=10^{-2}\,\mathrm{m}$ is exact, so the centimetre follows the
    definition of the metre through the speed of light. Under the SI rules the prefix and the unit
    form a single symbol, and a power applies to both: a square centimetre is a ten-thousandth of a
    square metre and a cubic centimetre a millionth of a cubic metre. NIST Special Publication 811
    lists the international inch as exactly 2.54 centimetres.

    The BAAS, a British society for the advancement of science, introduced the CGS system in 1874,
    and several of its units are still defined through the centimetre. The gal, which geodesy and
    geophysics use for the acceleration due to gravity, is one centimetre per second squared, and
    the dyne and the erg, the CGS units of force and energy, are built on the centimetre and the
    gram. Spectroscopists quote wavenumbers in reciprocal centimetres, where one reciprocal
    centimetre equals 100 reciprocal metres.

    Rulers, tape measures, clothing sizes and body measurements are commonly graduated in
    centimetres. American English spells the name centimeter. The symbol cm takes no plural s and no
    full stop.
