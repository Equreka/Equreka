# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Estereorradián'
description: >-
  El estereorradián, de símbolo $\mathrm{sr}$, es la unidad SI coherente de ángulo sólido, el
  equivalente tridimensional del ángulo plano que mide la amplitud de un cono de direcciones visto
  desde su vértice. Es una de las 22 unidades SI derivadas con nombre especial y se usa sobre todo
  en geometría, radiometría y fotometría.

  El folleto del SI define un estereorradián como el ángulo sólido con vértice en el centro de una
  esfera que delimita en su superficie un área igual al cuadrado del radio. El vocabulario de
  iluminación de la CIE expresa la misma idea mediante una esfera unidad: un ángulo sólido es el
  área que su cono intercepta en una esfera de radio uno centrada en el vértice. Como el cociente
  que lo define es un área entre una longitud al cuadrado, el SI trata el ángulo sólido como una
  magnitud con la unidad uno, aunque señala que difiere en su naturaleza de
  otros cocientes de áreas.

  Una esfera completa abarca $4\pi\,\mathrm{sr}$ en torno a su centro, lo que el folleto ofrece
  como definición alternativa, y una semiesfera la mitad. El estereorradián es al área sobre una
  esfera lo que el radián es a la longitud de arco sobre una circunferencia.

  La radiometría y la fotometría recurren al estereorradián para distinguir un flujo de una
  intensidad, y el folleto indica que en estos campos se suelen conservar su nombre y su símbolo
  en las expresiones de unidades. La intensidad radiante se mide en vatios por estereorradián, el
  lumen es la candela estereorradián y la propia candela se define mediante una intensidad radiante
  de 1/683 de vatio por estereorradián.

  El estereorradián entró en el SI en 1960 como unidad suplementaria, junto al radián, y pasó a ser
  una unidad derivada cuando la 20.ª CGPM suprimió esa clase en 1995. El plural es
  estereorradianes.
