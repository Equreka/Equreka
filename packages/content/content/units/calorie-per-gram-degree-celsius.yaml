description:
  en: >-
    The calorie per gram degree Celsius, symbol $\mathrm{cal/(g\,^{\circ}C)}$, is a unit of specific
    heat capacity outside the International System of Units: the heat, in calories, that one gram of
    a material takes in for each degree Celsius its temperature rises. Chemistry texts and older
    data tables state specific heat capacities in it, because one gram of liquid water needs very nearly one
    calorie per degree.

    The unit is the calorie divided by the gram and by the degree Celsius. The calorie meant here is
    the thermochemical calorie, defined as exactly 4.184 joules, the form chemistry uses. The SI
    Brochure makes the degree Celsius equal in size to the kelvin, so a temperature difference has
    the same number in both units and the unit is identical to the calorie per gram kelvin. NIST
    Special Publication 811 lists both rows with the same exact factor: one calorie per gram degree
    Celsius equals 4184 joules per kilogram kelvin, the coherent SI unit.

    That factor makes conversion easy: liquid water, at about 4.18 joules per gram degree Celsius,
    has a specific heat capacity of very nearly 1 in this unit. A value in joules per gram degree Celsius,
    the form OpenStax prints, is divided by 4.184 to give calories per gram degree Celsius. An
    International Table calorie, 4.1868 joules, gives a slightly larger unit, which NIST lists
    separately, so a table in calories should name its calorie.

    The unit survives in chemistry teaching, in calorimetry problems and in data tables older
    than the SI. IUPAC notes that several calories exist and gives the
    thermochemical one as 4.184 kilojoules per kilocalorie. The symbol is also written
    cal/(g K) or with negative exponents, and the plural is calories per gram degree Celsius.
