description:
  en: >-
    The volt metre, symbol $\mathrm{V\,m}$, is the coherent SI derived unit of electric flux, the
    surface integral of the electric field strength. It is the product of the volt, the unit of
    electric potential difference, and the metre, and in SI base units it is the kilogram metre
    cubed per second cubed per ampere. It has no special name.

    The unit follows from the definition of the flux: a field strength in volts per metre
    multiplied by an area in square metres leaves volts times metres. A uniform field of one volt
    per metre crossing one square metre at right angles carries a flux of one volt metre.

    Because the volt equals the joule per coulomb and the joule equals the newton metre, the volt
    metre is identical to the newton square metre per coulomb, the form OpenStax prints for electric flux. It is also the unit of charge divided by permittivity, coulombs over
    farads per metre, which is why Gauss's law gives the flux out of a closed surface directly in
    volt metres.

    The volt metre appears almost only in electrostatics, in Gauss's law and the flux calculations
    built on it. A closed surface around a charge of one microcoulomb carries roughly
    $1.13\times10^{5}\,\mathrm{V\,m}$ whatever its shape.

    The symbol is written with a space or a half-high dot between the factors, $\mathrm{V\,m}$ or
    V·m, following the SI rule for products of units. The volt metre is not the voltmeter, the
    instrument that measures potential difference, although the American spelling makes the two
    look alike. The plural is volt metres.
