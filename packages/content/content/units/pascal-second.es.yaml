# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pascal segundo'
description: >-
  El pascal segundo, de símbolo $\mathrm{Pa\,s}$, es la unidad derivada coherente del SI para la
  viscosidad dinámica, el rozamiento interno de un líquido o de un gas. Es el producto del pascal,
  la unidad de presión y de tensión mecánica, por el segundo, de modo que mide qué tensión
  tangencial hace falta para mantener un ritmo de cizalla dado en un fluido en movimiento.

  El folleto del SI la incluye en su tabla de unidades derivadas coherentes cuyo nombre contiene una
  unidad con nombre especial, y la expresa en unidades básicas como el kilogramo por metro y por
  segundo. No tiene nombre especial propio ni patrón aparte: su definición se deduce de las del
  kilogramo, el metro y el segundo.

  Un pascal segundo equivale exactamente a diez poises, la unidad de viscosidad del sistema CGS, y
  el milipascal segundo equivale exactamente a un centipoise, según recoge la publicación especial
  811 del NIST. El NIST convierte también la libra por pie y por segundo, una unidad
  consuetudinaria, en unos 1.488 pascal segundo.

  Las tablas de viscosidad dan la mayoría de los líquidos en milipascal segundo: el agua a 20 grados
  Celsius tiene alrededor de uno, la sangre completa unos pocos y el aceite de oliva más de cien,
  mientras que la glicerina llega a unos $1.5\,\mathrm{Pa\,s}$. Los gases son mucho menos viscosos,
  con valores del orden del micropascal segundo.

  Cuando la 11.ª CGPM enumeró en 1960 las unidades derivadas del nuevo SI, escribió esta unidad como
  newton segundo por metro cuadrado; la 14.ª CGPM dio al newton por metro cuadrado el nombre de
  pascal en 1971. El símbolo se escribe con un espacio o un punto a media altura entre Pa y s, y el
  nombre con un espacio o un guion. En español el nombre es pascal segundo.
