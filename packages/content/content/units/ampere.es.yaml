# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Amperio'
namePlural: 'amperios'
description: >-
  El amperio, de símbolo $\mathrm{A}$, es la unidad básica SI de corriente eléctrica, el ritmo al
  que la carga eléctrica pasa por un punto de un circuito. Es la única unidad eléctrica entre las
  siete unidades básicas del SI, y el culombio, el voltio, el ohmio y las demás unidades eléctricas
  se forman a partir de ella junto con el metro, el kilogramo y el segundo.

  El amperio se define, desde el 20 de mayo de 2019, al fijar la carga elemental en exactamente
  $e=1.602\,176\,634\times10^{-19}\,\mathrm{C}$, donde el culombio equivale al amperio segundo y el
  segundo se define mediante la frecuencia del cesio. Por tanto, una corriente constante de un
  amperio transporta cada segundo unas $6.241\times10^{18}$ cargas elementales a través de un punto
  dado. Como consecuencia, la constante magnética ya no es exacta y debe medirse.

  Un culombio es la carga que desplaza un amperio en un segundo, y el amperio hora, con el que se
  indica la capacidad de las baterías, equivale a 3600 culombios. El producto de una corriente en
  amperios por una diferencia de potencial en voltios da una potencia en vatios.

  El NIST cita valores cotidianos: unos 15 amperios para un secador de pelo de 1800 vatios, de 15 a
  20 amperios para un interruptor automático doméstico, unas milésimas de amperio para un LED
  pequeño y 100 000 amperios o más en un rayo. Los laboratorios realizan las unidades eléctricas con
  patrones cuánticos que aprovechan el efecto Josephson y el efecto Hall cuántico.

  Un congreso de electricidad celebrado en Chicago en 1893 introdujo el amperio y el ohmio
  internacionales. En 1946 el CIPM definió el amperio a partir de la fuerza entre dos hilos
  paralelos largos separados un metro, y la 10.ª CGPM lo convirtió en unidad básica en 1954. La
  unidad honra al científico francés André-Marie Ampère, cuyos experimentos de la década de 1820
  inspiraron aquella definición antigua; en inglés se usa la forma abreviada informal amp.
