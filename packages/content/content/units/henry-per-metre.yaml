description:
  en: >-
    The henry per metre, symbol $\mathrm{H/m}$, is the coherent SI derived unit of permeability,
    the property that describes how a medium responds to a magnetic field. It is the henry, the
    unit of inductance, divided by the metre, and in SI base units it is the kilogram metre per
    second squared per square ampere. It has no special name.

    The SI Brochure lists the henry per metre in its table of coherent derived units whose names
    include units with special names, as the unit of permeability. A coil explains the pairing:
    the inductance of a long solenoid equals the permeability of its core times the square of the
    number of turns times the cross-section divided by the length, and that ratio of an area to a
    length is itself a length.

    One henry per metre is identical to one newton per square ampere. The SI Brochure uses both
    forms side by side when it recalls that the former definition of the ampere, based on the
    force between two parallel wires, fixed the vacuum magnetic permeability at exactly four pi
    times ten to the minus seven of these units. NIST quotes the CODATA 2022 value in newtons per
    square ampere as $1.256\,637\,061\,27(20)\times10^{-6}\,\mathrm{N\,A^{-2}}$.

    The permeability of a material is its relative permeability times the vacuum value. For most
    diamagnetic and paramagnetic substances the relative permeability differs from one by less
    than a thousandth, while ferromagnets such as iron multiply the vacuum value by a factor of
    the order of a thousand or more.

    The symbol may be written with a solidus or
    as a product in which the metre carries the exponent minus one.
