description:
  en: >-
    Unitless denotes the unit one, symbol 1, the SI unit of every quantity of dimension one. Such
    quantities, often called dimensionless, come in two families: ratios of two quantities of the
    same kind, such as a refractive index, a relative permittivity or a mass fraction, and numbers
    of entities, such as a count of molecules or of decays. Their values are stated as pure
    numbers.

    The SI Brochure calls the unit one the neutral element of every system of units, present
    automatically and needing no formal decision to introduce it. When every dimensional exponent
    of a quantity is zero, its coherent SI unit is a quotient of two identical units, such as metre
    per metre, which reduces to the number one. The symbol 1 is seldom written: a refractive index
    is given as 1.51, not as 1.51 times 1.

    For reasons of history and convention, the SI also counts plane angle and solid angle among the
    quantities with the unit one, but gives their units the special names radian and steradian,
    which may be written or left out as convenient. Ratios of quantities of the same kind may be
    written with explicit units, such as mol/mol or m/m, to make the quantity clearer and to allow
    prefixes; counts of entities have no such option.

    SI prefixes cannot be attached to the symbol 1 or to the name one, so very large and very small
    values are written with powers of ten. The per cent sign stands for the number 0.01 and may be
    used with the SI, with a space before it. Parts per million means a relative value of
    $10^{-6}$, whereas the brochure advises against ppb and ppt because their meaning depends on the
    language.
