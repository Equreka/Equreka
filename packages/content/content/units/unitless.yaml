name:
  en: 'Unitless'
symbol:
  tex: '1'
unitOf:
  - 'dimensionless'
system: 'other'
externalIds:
  wikidata: 'Q199'
  qudt: 'http://qudt.org/vocab/unit/UNITLESS'
categories:
  - 'universal'
branches:
  - 'measurement'
aliases:
  - 'dimensionless'
  - 'pure number'
description:
  en: >-
    In science, a unitless quantity or dimension is a quantity without a physical dimension, being a
    number that can describe a physical characteristic without a physical unit of measurement or
    expression, and that as such, always has a dimension of 1.​ Unitless quantities are widely used
    in mathematics, physics, engineering and economics, and in daily life (for example, in
    counting). Many well-known numbers, such as π, e and φ, are also unitless. On the other hand,
    non-unitless quantities are measured in units of length, area, time, etc.
