# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Microgramo'
description: >-
  El microgramo, de símbolo $\mathrm{μg}$, es una unidad de masa igual a la millonésima parte de un
  gramo, formada al anteponer el prefijo SI micro al gramo. Mide masas muy pequeñas, como dosis de
  medicamentos, contenidos de vitaminas y contaminantes en trazas, y en medicina suele escribirse
  mcg.

  La relación $1\,\mathrm{μg}=10^{-9}\,\mathrm{kg}$ es exacta, y mil microgramos forman un
  miligramo. El prefijo se coloca sobre el gramo porque el kilogramo ya lleva uno y el SI prohíbe
  los prefijos compuestos, así que la unidad nunca se llama nanokilogramo.

  La farmacología, la nutrición, la toxicología y la vigilancia ambiental trabajan a esta escala,
  por ejemplo con concentraciones en microgramos por metro cúbico de aire o por litro de agua. El
  NIST señala que la investigación farmacéutica y los ensayos ambientales necesitan cada vez más
  medidas exactas de masa en el orden de los microgramos y por debajo. La escala también importó
  para el antiguo kilogramo: cuando las copias nacionales se compararon con el prototipo
  internacional entre 1989 y 1991, diferían de él en una mediana de unos 25 microgramos.

  El símbolo μg se confunde con facilidad con mg, un error que convierte los microgramos en
  miligramos y multiplica una dosis por mil. Por eso la lista de abreviaturas propensas a error del
  ISMP incluye μg y recomienda mcg en recetas, etiquetas de medicamentos y pantallas de
  prescripción. Fuera de la medicina, el símbolo SI μg sigue siendo la forma correcta, ya que el SI
  no admite abreviaturas en lugar de los símbolos de las unidades.
