# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Julio'
namePlural: 'julios'
description: >-
  El julio, de símbolo $\mathrm{J}$, es la unidad SI derivada coherente de energía, de trabajo y de
  cantidad de calor. Un julio es la energía transferida por una fuerza de un newton cuyo punto de
  aplicación avanza un metro en la dirección de la fuerza; en unidades básicas del SI es el
  kilogramo metro cuadrado por segundo al cuadrado. Las energías cinética, potencial, interna y
  eléctrica se miden en julios.

  El CIPM dio esta definición en 1946, y la 9.ª CGPM adoptó en 1948 el julio como unidad de cantidad
  de calor y pidió que los resultados calorimétricos se expresaran en julios siempre que fuera
  posible. El julio es una de las cinco unidades derivadas que nombra la definición vigente del SI,
  que fija la constante de Planck en julios segundo y la constante de Boltzmann en julios por
  kelvin.

  Una potencia de un vatio entrega un julio cada segundo, por lo que el kilovatio hora equivale
  exactamente a $3.6\times10^{6}\,\mathrm{J}$. La caloría termoquímica vale exactamente 4.184 julios,
  el ergio del sistema CGS es exactamente una diezmillonésima de julio y el electronvoltio vale
  exactamente $1.602\,176\,634\times10^{-19}\,\mathrm{J}$ desde que se fijó la carga elemental. El
  momento de una fuerza comparte dimensión con la energía, pero el folleto del SI establece que el
  julio nunca se usa para expresarlo; su unidad es el newton metro.

  Un julio es poca energía en la escala cotidiana, de modo que la electricidad se vende por
  kilovatios hora, y las cantidades mayores se expresan a menudo con unidades con prefijo, como el
  kilojulio y el megajulio.

  La unidad debe su nombre al físico James Prescott Joule (1818-1889), cuyos experimentos sobre el
  equivalente mecánico del calor contribuyeron a establecer que el calor es una forma de energía.
  El plural es julios.
