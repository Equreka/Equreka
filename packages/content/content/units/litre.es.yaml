# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Litro'
namePlural: 'litros'
description: >-
  El litro, de símbolo $\mathrm{l}$ o $\mathrm{L}$, es una unidad de volumen igual a un decímetro
  cúbico, el volumen de un cubo de diez centímetros de arista. No es una unidad SI coherente, pero
  el folleto del SI la incluye en su tabla de unidades no SI que pueden usarse junto a las
  unidades SI, y es la medida habitual de líquidos, gases y recipientes.

  Su definición actual data de 1964, cuando la 12.ª CGPM declaró que la palabra litro es un nombre
  especial del decímetro cúbico, de modo que $1\,\mathrm{L}=1\,\mathrm{dm^{3}}=10^{-3}\,\mathrm{m^{3}}$
  exactamente. La misma resolución recomendó no usar ese nombre para los resultados de medidas de
  volumen de alta exactitud, que se expresan en metros cúbicos y sus submúltiplos.

  Mil litros forman un metro cúbico, y un mililitro es el mismo volumen que un centímetro cúbico.
  El litro admite los prefijos SI, y el mililitro, el centilitro y el decilitro son las formas que
  más se imprimen en botellas, envases y prospectos de medicamentos.

  El combustible, las bebidas, la cilindrada de los motores y la capacidad de depósitos, pulmones y
  material de laboratorio se dan en litros o mililitros, y la química usa el litro en
  concentraciones en moles por litro y en volúmenes molares de gases.

  El CIPM adoptó el litro y el símbolo l en 1879. En 1901 la 3.ª CGPM lo vinculó al agua: el
  espacio que ocupa un kilogramo de agua pura en su punto de máxima densidad y a la presión
  atmosférica normal; aquel litro era unas 28 partes por millón mayor que el decímetro cúbico, una diferencia que el NIST cifra en
  1.000 028 decímetros cúbicos, hasta que el cambio de 1964 la eliminó. Como la l minúscula se
  confunde con facilidad con el número uno, la 16.ª CGPM admitió en 1979 la L mayúscula como segundo
  símbolo, y el CIPM juzgó en 1990 que aún era pronto para conservar solo uno. La grafía liter es
  la estadounidense.
