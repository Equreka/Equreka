description:
  en: >-
    The erg, symbol erg, is the CGS unit of energy and work, the centimetre-gram-second system's
    counterpart of the joule: the work of a one-dyne force whose point of application moves one centimetre along the line of
    the force. It is not an SI unit.

    One erg equals exactly $10^{-7}\,\mathrm{J}$. NIST Special Publication 811 gives that factor in
    Appendix B.8 and lists the erg in Table 10 among the CGS units with special names that it does
    not accept for use with the SI. The factor follows from the base units: a gram is a
    thousandth of a kilogram and a square centimetre a ten-thousandth of a square metre, so one
    gram square centimetre per second squared is ten million times smaller than a joule.

    Ten million ergs make one joule, and the erg per second, the CGS unit of power, is ten
    millionths of a watt. NIST also lists the erg per square centimetre second, exactly a
    thousandth of a watt per square metre, a unit of energy flux found in older literature.

    The erg appears in physics texts written in CGS units, and an energy in ergs must be converted
    to joules before it is combined with SI quantities.

    Its name comes from the Greek ergon, work, as QUDT notes. The British Association, a
    scientific society, introduced the CGS system in 1874, and in 1948 the 9th CGPM listed the
    erg, with the symbol erg, among the units whose symbols it set out.
