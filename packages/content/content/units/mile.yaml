description:
  en: >-
    The mile, symbol mi, also called the statute mile or international mile, is the unit of length
    for road distances in the British imperial system and the United States customary system. It
    equals 5280 feet or 1760 yards and is a different unit from the nautical mile of sea and air
    navigation.

    Because the yard has been exactly 0.9144 metre since 1959, the mile is fixed at
    $1\,\mathrm{mi}=1609.344\,\mathrm{m}$ exactly, the factor NIST Special Publication 811 prints
    for it. Canada's Weights and Measures Act defines its mile in the same way, as 1760 yards.

    The surveyors' tables in NIST Handbook 44 divide the mile into eight furlongs, 80 chains or 320
    rods. A kilometre is about 0.62 mile. The nautical mile, 1852 metres, is about 1.15 statute
    miles according to NOAA.

    Speed limits in the United Kingdom are posted in miles per hour, and British government guidance
    notes that people there still describe walks in miles and fuel economy in miles per gallon.
    Motorway direction signs usually announce an exit one mile and half a mile ahead.

    NIST traces the unit to the Roman mile of a thousand paces, each pace being five Roman feet,
    which reached England during the Roman occupation. A statute of Queen Elizabeth I set the mile
    at 5280 feet, or eight furlongs, and that statute is the source of the name statute mile. The
    American mile was long based on the U.S. survey foot, which made it about 3 millimetres longer;
    since the end of 2022 that version is kept only for historical and legacy work.
