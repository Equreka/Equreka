description:
  en: >-
    The newton square metre per square coulomb, symbol $\mathrm{N\,m^{2}\,C^{-2}}$, is the
    coherent SI unit in which the Coulomb constant of electrostatics is expressed. It is a
    compound unit built from the newton, the metre and the coulomb, and it has no special name.

    The unit follows from Coulomb's law. The electric force between two point charges is
    proportional to the product of the charges divided by the square of their separation, so the
    constant that turns that ratio, measured in square coulombs per square metre, into a force in
    newtons must carry newtons times square metres per square coulomb. Written in SI base units it
    is the kilogram cubic metre per second to the fourth per square ampere.

    The same dimension belongs to the reciprocal of permittivity. Since the farad per metre
    equals the square coulomb per newton square metre, this unit is identical to the metre per
    farad, and the Coulomb constant, which equals one divided by four pi times the vacuum
    electric permittivity, can be quoted in either form. Introductory texts such as OpenStax
    University Physics quote it in the newton form, which keeps the link to the force in view.

    No quantity kind of its own is measured in this unit, so it is treated as a compound unit
    with no magnitude attached. The Coulomb constant itself is about $8.99\times10^{9}$ of these
    units, which is why two charges of one coulomb each, one metre apart, would push on each other
    with a force of nearly nine thousand million newtons.
