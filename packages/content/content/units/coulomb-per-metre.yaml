description:
  en: >-
    The coulomb per metre, symbol $\mathrm{C/m}$, is the coherent SI derived unit of linear charge
    density, the electric charge carried by each unit length of a wire, rod or other thin body. It
    is the coulomb, the SI unit of electric charge, divided by the metre, and in SI base units it
    is the ampere second per metre. It has no special name.

    A thin body on which every metre of length holds one coulomb has a linear charge density of one
    coulomb per metre. The coulomb itself is the charge carried in one second by a current of one
    ampere, so the unit inherits its definition from the ampere and the metre.

    One coulomb on each metre of a wire is an enormous charge: the field it would produce at one
    metre from a long straight line is about $1.8\times10^{10}\,\mathrm{V/m}$, thousands of times
    the field at which air breaks down, about 3.0 megavolts per metre. Practical values are microcoulombs or nanocoulombs per metre. Dividing a
    linear charge density in coulombs per metre by the vacuum electric permittivity, in farads per
    metre, leaves volts, which is why the field of a line comes out in volts per metre once the
    distance is divided in.

    The unit is used mostly in electrostatics, for the charge on wires and transmission lines and
    in the field and potential of long cylinders, and occasionally for charged particle beams. QUDT
    lists it for linear electric charge density under several names, among them lineic charge.

    The symbol may also be written $\mathrm{C\,m^{-1}}$. The plural is coulombs per metre.
