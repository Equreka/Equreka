# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Kilogramo metro por segundo'
description: >-
  El kilogramo metro por segundo, de símbolo $\mathrm{kg\,m/s}$, es la unidad derivada coherente
  del SI para la cantidad de movimiento, formada con las unidades básicas de masa, longitud y
  tiempo. Un kilogramo metro por segundo es la cantidad de movimiento de un cuerpo de un
  kilogramo que se mueve a un metro por segundo. La misma unidad mide también el impulso, la
  variación de la cantidad de movimiento que produce una fuerza.

  No tiene nombre especial. Es el producto del kilogramo por el metro dividido entre el segundo,
  así que su definición se deduce directamente de las de esas tres unidades básicas en el folleto
  del SI, que desde 2019 se apoyan en valores numéricos fijos de la constante de Planck, la
  velocidad de la luz en el vacío y la frecuencia de la transición hiperfina del cesio.

  Como el newton es un kilogramo metro por segundo al cuadrado, un kilogramo metro por segundo es
  exactamente un newton segundo. Los libros de texto suelen dar la cantidad de movimiento con el
  kilogramo metro por segundo y el impulso con el newton segundo, lo que mantiene separadas ambas
  magnitudes sin que el teorema del impulso deje de cuadrar unidad por unidad. Su equivalente CGS,
  el gramo centímetro por segundo, es la cienmilésima parte de un kilogramo metro por segundo.

  La unidad abarca desde moléculas hasta vehículos: una molécula de nitrógeno del aire a
  temperatura ambiente tiene unos $2.4\times10^{-23}\,\mathrm{kg\,m/s}$ y un automóvil corriente en la ciudad, cerca de
  $2.1\times10^{4}\,\mathrm{kg\,m/s}$.

  Según las reglas del SI para símbolos compuestos, el producto se indica con un espacio o un
  punto a media altura, y el cociente con una barra oblicua o un exponente negativo, de modo que
  el segundo también puede escribirse con exponente menos uno; no se escriben los símbolos juntos
  sin separación.
