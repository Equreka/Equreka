# yaml-language-server: $schema=../../dist/schemas/units.schema.json
name:
  en: 'Watt'
symbol:
  tex: 'W'
unitOf:
  - 'power'
  - 'radiant-flux'
system: 'si-derived'
compose:
  of:
    - unit: 'joule'
      exp: 1
    - unit: 'second'
      exp: -1
categories:
  - 'physics'
description:
  en: >-
    The watt (symbol: $W$) is a unit of power or radiant flux. In the International System of Units
    (SI), it is defined as a derived unit of (in SI base units) $1 kg⋅m^{2}⋅s^{−3}$ or,
    equivalently, 1 joule per second. It is used to quantify the rate of energy transfer. The watt
    is named after James Watt (1736-1819), an 18th-century Scottish inventor.
