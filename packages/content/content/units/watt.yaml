description:
  en: >-
    The watt, symbol $\mathrm{W}$, is the coherent SI derived unit of power, the rate at which
    energy is transferred or converted, and of radiant flux, the power carried by electromagnetic
    radiation. One watt is one joule per second; in SI base units it is the kilogram square metre
    per second cubed.

    The CIPM defined the watt in 1946 as the power that gives rise to one joule of energy in one
    second, and the same resolution used the watt to define the volt. In a circuit the power
    delivered is the product of potential difference and current, so for direct current one watt
    is one volt ampere. The SI Brochure lists the var as a special name of the volt ampere when it
    expresses reactive power, a unit equal in size to the watt but reserved for that quantity.
    The watt is also one of the units named in the present definition of the SI.

    Energy is power multiplied by time, so a kilowatt sustained for an hour delivers one kilowatt
    hour, exactly $3.6\times10^{6}\,\mathrm{J}$, and electricity is sold in that unit. The
    horsepower of 550 foot pounds-force per second is about 745.7 watts.

    In photometry the watt links light to energy: the SI fixes the luminous efficacy of
    monochromatic radiation at 540 terahertz at exactly $683\,\mathrm{lm/W}$, which defines the
    candela and, through it, the lumen.

    The unit is named after James Watt (1736-1819), the Scottish engineer and inventor who found
    ways to obtain more power from steam engines. The 11th CGPM listed the watt among the derived
    units of the SI in 1960. The plural is watts.
