description:
  en: >-
    The pound-force foot, symbol lbf·ft, is a unit of torque, or moment of force, of the British
    imperial and United States customary systems: the turning effect of one pound-force applied with
    a lever arm of one foot, the arm measured perpendicular to the line of the force. Its SI
    counterpart is the newton metre.

    It is the product of two exactly defined units. NIST gives the pound-force as exactly 4.448 221
    615 260 5 newtons, computed with the standard acceleration of gravity, and the foot is exactly
    0.3048 metre, so $1\,\mathrm{lbf\,ft}=1.355\,817\,948\,331\,400\,4\,\mathrm{N\,m}$ exactly. NIST
    Special Publication 811 lists the unit under moment of force or torque, rounded to 1.355 818
    newton metres, and QUDT stores the full multiplier.

    One pound-force foot equals twelve pound-force inches, a smaller torque unit that NIST also
    lists, and a newton metre is about 0.7376 pound-force foot. The metric kilogram-force metre,
    exactly 9.806 65 newton metres, appears beside it in the same NIST table.

    As a traditional customary unit of torque, it measures a force in pounds acting at a distance in
    feet from the centre of rotation, and it is commonly written lbf ft or lb ft.

    Torque and energy share a dimension, and the energy unit with the same factor is the foot-pound,
    in full the foot pound-force. The SI Brochure never expresses torque in joules, and NIST keeps
    the two apart by word order: pound-force foot for torque, foot pound-force for work. Rowlett's
    dictionary describes the same custom while noting that foot-pound is also used for torque in
    practice.
