description:
  en: >-
    The hour, symbol h, is a unit of time equal to 60 minutes or 3600 seconds. It lies outside the
    SI proper, but the SI Brochure lists it in Table 8 among the long-standing non-SI units of
    time, and it is the unit of the clock face, the working day and travel times.

    Its value follows from the SI second: $1\,\mathrm{h}=60\,\mathrm{min}=3600\,\mathrm{s}$
    exactly, and NIST Special Publication 811 gives the same factor. Twenty-four hours make one day,
    and 8760 hours make a calendar year of 365 days.

    The hour appears inside several compound units in daily use. A kilometre per hour is $5/18$ of
    a metre per second, and the kilowatt hour on an electricity bill is one thousand joules per
    second sustained for 3600 seconds, or 3.6 million joules. Coherent SI calculations convert hours
    to seconds before substituting into a formula.

    Timetables, working shifts, flight durations, medication schedules and road speed limits are
    given in hours. The SI Brochure keeps the hour in its table of non-SI units because such
    units are widely used and are expected to remain so for many years.

    Egyptian sundials of about 1500 BC already split daylight into 12 parts, and star tables split
    the night likewise, which produced a day of 24 seasonal hours whose length changed through the
    year. Hipparchus proposed 24 equal hours in the second century BC, but equal hours became
    common only with the mechanical clocks of 14th-century Europe, as the NIST metrologist Michael
    Lombardi recounts. The symbol is h, never hr or hrs, with no plural ending and no full stop.
