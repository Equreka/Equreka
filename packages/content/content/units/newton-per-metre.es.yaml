# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Newton por metro'
description: >-
  El newton por metro, de símbolo $\mathrm{N/m}$, es la unidad derivada coherente del SI para la
  fuerza por unidad de longitud. El folleto del SI la indica como unidad de la tensión
  superficial, y en mecánica mide la constante elástica, o constante de fuerza, de la ley de
  Hooke: la fuerza necesaria para estirar o comprimir un resorte un metro.

  Es el newton dividido entre el metro y no tiene nombre especial. En unidades básicas es el
  kilogramo por segundo al cuadrado y, como un newton es un julio por metro, la misma unidad puede
  leerse también como julio por metro cuadrado, una energía por unidad de superficie.

  La publicación especial 811 del NIST convierte la libra fuerza por pulgada en unos
  $175.126\,8\,\mathrm{N/m}$. La unidad CGS, la dina por centímetro, es exactamente una milésima
  de newton por metro, de modo que una tensión superficial dada en dinas por centímetro se
  convierte en milinewtons por metro con el mismo número.

  Un resorte más rígido tiene una constante mayor en esta unidad y, con una masa dada, oscila más
  deprisa; el periodo de una masa unida a un resorte depende solo de la masa y de la constante
  elástica, no de cuánto se separe la masa del equilibrio. La unidad aparece siempre que una
  fuerza recuperadora crece en proporción a un desplazamiento, desde los resortes de laboratorio
  hasta un trampolín que se flexiona.

  El símbolo puede escribirse también con el metro elevado al exponente menos uno. El plural es
  newtons por metro.
