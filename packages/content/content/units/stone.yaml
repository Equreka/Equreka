description:
  en: >-
    The stone, symbol st, is a unit of mass of the British imperial system equal to 14 avoirdupois
    pounds. In the United Kingdom it remains the customary unit for a person's body weight, while it
    has no place in the United States customary system.

    Because the avoirdupois pound has been exactly 0.453 592 37 kilogram since 1959, the stone is
    fixed at $14\,\mathrm{lb}=6.350\,293\,18\,\mathrm{kg}$ exactly. The British tables reproduced in
    NIST Handbook 44 give the same definition of fourteen pounds.

    Above the pound the British avoirdupois table builds on the stone: two stones make a quarter of
    28 pounds, four quarters make a hundredweight of 112 pounds, and twenty hundredweight make a ton
    of 2240 pounds, so the British long ton holds 160 stones. A kilogram is about 0.157 stone.

    Of the quarter, hundredweight, stone and ton, NIST counts the stone as the only one left in
    everyday personal use, for body weight. Its trace in America was indirect: American flour
    barrels held 196 pounds, exactly 14 stones, a trade practice that lasted until the Second World
    War.

    The 14-pound stone was not the first: NIST records signs of an older 16-pound version. NIST tables write the plural both as stones and as stone, and the QUDT vocabulary
    labels the unit Stone (UK).
