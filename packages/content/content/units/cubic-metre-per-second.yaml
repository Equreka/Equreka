description:
  en: >-
    The cubic metre per second, symbol $\mathrm{m^{3}/s}$, is the coherent SI derived unit of
    volumetric flow rate: a steady flow of one cubic metre per second moves a volume of one cubic
    metre of fluid through a cross-section in each second. It is the unit of the discharge of
    rivers, canals, spillways and large pipelines.

    The unit is the cube of the metre divided by the second and has no special name. Like every
    coherent derived unit it needs no standard of its own, because it rests on the definitions of
    the metre and the second.

    A litre is a thousandth of a cubic metre, so one cubic metre per second is exactly 1000 litres
    per second and 60 000 litres per minute. NIST Special Publication 811 converts one cubic foot
    per second to about $2.832\times10^{-2}\,\mathrm{m^{3}/s}$.

    For pumps, taps and the human body the unit is very large: a resting heart moves about
    $8\times10^{-5}\,\mathrm{m^{3}/s}$, so litres per minute or per second read more naturally. For
    rivers it fits well. A survey by the US Geological Survey estimated the average discharge of the
    Amazon at Óbidos as 157 000 cubic metres per second, with about 350 000 in the flood of June
    1953.

    The symbol may also be written with a negative exponent on the second; hydrologists sometimes
    shorten the name to cumec, which is not an SI symbol. The plural is cubic metres per second,
    spelled cubic meters per second in American English.
