# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Unidad uno'
description: >-
  La unidad uno, de símbolo 1, es la unidad SI de toda magnitud de dimensión uno. Estas
  magnitudes, a menudo llamadas adimensionales, forman dos familias: los cocientes de dos
  magnitudes de la misma naturaleza, como un índice de refracción, una permitividad relativa o una
  fracción másica, y los números de entidades, como un recuento de moléculas o de
  desintegraciones. Sus valores se expresan como números puros.

  El folleto del SI describe la unidad uno como el elemento neutro de todo sistema de
  unidades, presente de forma automática y sin necesidad de una decisión formal que la introduzca.
  Cuando todos los exponentes dimensionales de una magnitud son nulos, su unidad SI coherente es el
  cociente de dos unidades idénticas, como el metro por metro, que se reduce al número uno. El
  símbolo 1 rara vez se escribe: un índice de refracción se da como 1.51, no como 1.51 por 1.

  Por razones históricas y de convención, el SI cuenta también el ángulo plano y el ángulo sólido
  entre las magnitudes con la unidad uno, pero da a sus unidades los nombres especiales de radián y
  estereorradián, que pueden escribirse u omitirse según convenga. Los cocientes de magnitudes de
  la misma naturaleza pueden escribirse con unidades explícitas, como mol/mol o m/m, para aclarar
  la magnitud y permitir prefijos; los recuentos de entidades no tienen esa opción.

  Los prefijos SI no pueden unirse al símbolo 1 ni al nombre uno, de modo que los valores muy
  grandes o muy pequeños se escriben con potencias de diez. El signo de por ciento representa el
  número 0.01 y puede usarse con el SI, precedido de un espacio. Partes por millón significa un
  valor relativo de $10^{-6}$, mientras que el folleto desaconseja ppb y ppt porque su significado
  depende del idioma.
