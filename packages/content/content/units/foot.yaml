description:
  en: >-
    The foot, symbol ft, is a unit of length of the British imperial system and the United States
    customary system. It lies between the inch and the yard and is the usual measure of human height
    and of altitude wherever those systems remain in use.

    Its definition passes through the yard. Since 1959 the yard has been exactly 0.9144 metre, and
    the foot is one third of it, so $1\,\mathrm{ft}=0.304\,8\,\mathrm{m}$ with no rounding. NIST
    Special Publication 811 prints this factor as exact, and NIST calls the unit the international
    foot when it must be told apart from the older survey foot.

    Twelve inches make one foot, three feet make one yard and 5280 feet make one mile. A metre is
    therefore slightly more than three feet three inches, and a square foot is 144 square inches.

    NIST observes that altimeters in aircraft and maps of land elevation report heights in feet even
    when those heights reach several miles. British government guidance lists height in feet and
    inches among the imperial habits that remain common in the United Kingdom.

    According to NIST, the Romans took the foot from the Egyptians and split it into twelve parts.
    From 1893 the United States tied its foot to the metre as 1200/3937 metre. The 1959 refinement
    made the foot two parts per million shorter, but American geodetic surveys kept the 1893 value,
    which became the U.S. survey foot. NIST and NOAA declared that survey foot obsolete from 1
    January 2023, except for historical and legacy work, so a single foot now applies everywhere. The
    plural of the name is feet.
