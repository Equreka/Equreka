description:
  en: >-
    The litre per mole second, symbol $\mathrm{L/(mol\,s)}$, is the unit in which chemistry
    textbooks quote the rate constants of second-order reactions. It is not a coherent SI unit,
    because the litre lies outside the SI, although the SI Brochure lists it in Table 8 among the widely used non-SI units.

    The unit is the litre divided by the mole and by the second. The SI Brochure defines the litre as
    the cubic decimetre, a thousandth of a cubic metre, so one litre per mole second equals exactly
    0.001 cubic metres per mole second, the coherent SI unit of a second-order rate constant. It is
    the same unit as the cubic decimetre per mole second, which IUPAC names as the usual choice for
    rate constants and pre-exponential factors of second-order reactions.

    Since M is a common shorthand for moles per litre, the unit is also written as the reciprocal of
    M per second, the form OpenStax uses in its summary of rate laws. Constants for slow reactions
    may be stated per minute instead, and one litre per mole minute is a sixtieth of this unit.

    Kinetics laboratories and tables of rate constants use the unit. OpenStax finds a rate constant
    of $2.20\times10^{7}$ litres per mole second for the reaction of nitrogen monoxide with ozone at
    $25\,^{\circ}\mathrm{C}$, which equals 22 000 cubic metres per mole second. The name is spelled
    liter per mole second in American English, the lower-case l is an equally valid symbol for the
    litre, and the plural is litres per mole second.
