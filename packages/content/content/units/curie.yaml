description:
  en: >-
    The curie, symbol $\mathrm{Ci}$, is a unit of activity that lies outside the SI. It measures
    the rate of radioactive decay of a source and is still common in the United States, especially
    in regulations on health and safety. One curie is a large activity, tens of billions of nuclear
    decays every second.

    Its value is fixed at exactly $3.7\times10^{10}\,\mathrm{Bq}$. In 1964 the 12th CGPM, through
    Resolution 7, accepted that the curie be kept outside the SI as a unit of activity with that
    value expressed in reciprocal seconds, and NIST Special Publication 811 prints the factor as
    exact.

    Turned around, one becquerel is about 27 trillionths of a curie. Because the curie is so large,
    environmental results are usually given in picocuries, trillionths of a curie: the natural
    radium-226 in surface water generally lies between 0.1 and 0.5 picocurie per litre.

    The NIST guide to the SI strongly discourages the curie, together with the rad, the rem and the
    roentgen, and asks authors who still need it to give the value in becquerels first. The US
    Environmental Protection Agency describes the curie as roughly the number of decays that occur
    each second in one gram of radium.

    The unit is named after the French scientists Marie and Pierre Curie. Its symbol is Ci, with a
    capital C, and its plural is curies.
