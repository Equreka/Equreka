description:
  en: >-
    The foot per second squared, symbol ft/s², is a unit of acceleration of the British imperial and
    United States customary systems: the acceleration of a body whose velocity changes by one foot
    per second during each second. It is not an SI unit; the coherent SI unit of acceleration is the
    metre per second squared.

    The exact foot fixes the unit exactly as well,
    $1\,\mathrm{ft/s^{2}}=0.304\,8\,\mathrm{m/s^{2}}$, the factor that NIST Special Publication 811
    prints in boldface under acceleration. QUDT names the same unit the foot per square second and
    stores the same multiplier.

    The standard acceleration of gravity, exactly 9.806 65 metres per second squared, comes to about
    32.174 feet per second squared, a figure that customary problems on falling bodies and
    projectiles use in place of 9.81. NIST lists the inch per second squared beside it, and one foot
    per second squared equals twelve of those.

    In customary engineering mechanics the unit links force and mass. The slug, which NIST converts
    to about 14.593 9 kilograms, is the mass that a force of one pound-force accelerates at exactly
    one foot per second squared, as the exact factors for the pound-force and the foot confirm.
    Engineers in the United States use the unit for vehicle and aircraft performance and for the
    design of structures and machines.

    The plural is feet per second squared, and the unit is also read as feet per second per second.
    Variant symbols include ft/sec² and the plain-text forms ft/s2 and ft s^-2.
