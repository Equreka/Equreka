name:
  en: 'Nautical mile'
symbol:
  tex: 'nmi'
unitOf:
  - 'length'
system: 'other'
toBase:
  factor: '1852'
  source:
    name: 'NIST SP 811'
    url: 'https://www.nist.gov/pml/special-publication-811'
    ref: 'B.8: mile, nautical'
status: 'reviewed'
categories:
  - 'physics'
aliases:
  - 'NM'
  - 'sea mile'
description:
  en: |-
    A nautical mile is a unit of length used in air, marine, and space navigation, and for the definition of territorial waters. Historically, it was defined as the meridian arc length corresponding to one minute (1/60 of a degree) of latitude. Today the international nautical mile is defined as exactly 1852 metres (6076 ft; 1.151 mi). The derived unit of speed is the knot, one nautical mile per hour.

    **There is no single internationally agreed symbol**, with several symbols in use. - $M$ is used as the abbreviation for the nautical mile by the International Hydrographic Organization. - $NM$ is used by the International Civil Aviation Organization. - $nmi$ is used by the Institute of Electrical and Electronics Engineers and the United States Government Publishing Office. - $nm$ is a non-standard abbreviation used in many maritime applications and texts, including US Government Coast Pilots and Sailing Directions.
