description:
  en: >-
    The nautical mile is the length unit of marine and aerial navigation, fixed at exactly 1852
    metres. It is defined directly in metres rather than through the foot or the yard, and the SI
    Brochure lists it in its table of non-SI units, together with the knot, the navigation unit of speed
    equal to one nautical mile per hour.

    The First International Extraordinary Hydrographic Conference, held at Monaco in 1929, adopted
    the value $1852\,\mathrm{m}$ and called it the international nautical mile; NOAA notes that the
    body behind it is now the International Hydrographic Organization. In 1978 the CIPM accepted the
    unit for continued use alongside the SI in the fields that already relied on it, according to NIST
    Special Publication 811.

    The unit rests on the geometry of the Earth: NOAA explains that one nautical mile corresponds to
    one minute of latitude, so a navigator can read distances straight from the latitude scale of a
    chart. It is about 1.15 statute miles, and NIST gives it as approximately 6076.115 feet. A knot
    is therefore 1852/3600 metre per second, a little over half a metre per second.

    Ships, aircraft and spacecraft measure distance in nautical miles because their charts and
    navigation systems work in latitude and longitude. The United States adopted the international
    value in 1954 and the United Kingdom in 1970, after both had used slightly different figures.

    No unit symbol has been agreed internationally. In 2004 the Consultative Committee for Units
    noted that M and NM were both in common use and agreed to put M in a draft of the BIPM table,
    but the current SI Brochure prints no symbol for the unit. The QUDT vocabulary writes nmi instead. The lowercase nm is best avoided, since in the
    SI it denotes the nanometre.
