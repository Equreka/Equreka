# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Newton'
namePlural: 'newtons'
description: >-
  El newton, de símbolo $\mathrm{N}$, es la unidad SI derivada coherente de fuerza y, por tanto,
  también de peso, la fuerza con que la gravedad atrae a un cuerpo. Un newton es la fuerza que
  imprime a una masa de un kilogramo una aceleración de un metro por segundo al cuadrado, de modo
  que en unidades básicas del SI es el kilogramo metro por segundo al cuadrado.

  La definición del newton es la segunda ley de Newton aplicada a valores unitarios: para un
  cuerpo de masa constante, la fuerza es igual a la masa por la aceleración, caso particular de la
  fuerza como ritmo de cambio de la cantidad de movimiento. El newton, una de las 22
  unidades SI con nombre especial, carece de patrón propio: se deriva del kilogramo, el metro y el
  segundo, que desde 2019 se apoyan en valores fijos de la frecuencia del
  cesio, la velocidad de la luz y la constante de Planck.

  Las unidades de fuerza más antiguas se definen a partir del newton. La dina del sistema CGS
  equivale exactamente a $10^{-5}\,\mathrm{N}$, el kilogramo fuerza, el peso de un kilogramo con la
  gravedad normal, equivale exactamente a $9.806\,65\,\mathrm{N}$, y la libra fuerza vale unos 4.448
  newtons. Por eso una masa de unos 102 gramos pesa aproximadamente un newton en la superficie
  terrestre.

  El newton sirve además para formar otras unidades coherentes. El pascal es un newton por metro
  cuadrado, el julio es el trabajo de un newton a lo largo de un metro y el momento de una fuerza
  se expresa con el newton metro; el folleto precisa que el julio nunca se usa para el
  momento de una fuerza, aunque ambos compartan dimensión.

  El CIPM definió la unidad MKS de fuerza en 1946, y la 9.ª CGPM ratificó esa definición en 1948 y
  dio a la unidad el nombre de newton. La 11.ª CGPM incluyó el newton, de símbolo N, entre las
  unidades derivadas del SI en 1960. El plural es newtons.
