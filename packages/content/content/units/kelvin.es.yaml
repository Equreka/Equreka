# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Kelvin'
description: >-
  El kelvin, de símbolo $\mathrm{K}$, es la unidad básica SI de temperatura termodinámica, la
  temperatura absoluta que la física y la química emplean en las leyes de los gases y en
  termodinámica. Su escala parte del cero absoluto, de modo que una temperatura termodinámica
  expresada en kelvin es positiva para la materia ordinaria, y la misma unidad sirve también para las diferencias de
  temperatura.

  Desde el 20 de mayo de 2019 el kelvin se define al fijar la constante de Boltzmann en exactamente
  $k=1.380\,649\times10^{-23}\,\mathrm{J/K}$, con el julio ligado al kilogramo, al metro y al
  segundo. Un cambio de un kelvin es, por tanto, el cambio de temperatura que altera la energía
  térmica $kT$ en esa cantidad de julios. El punto triple del agua, que antes anclaba la unidad en
  exactamente 273.16 K, ha pasado a ser un valor medido.

  El grado Celsius tiene el mismo tamaño que el kelvin, y una temperatura Celsius es la temperatura
  termodinámica menos 273.15 K, así que las diferencias tienen el mismo número en ambas unidades. El
  cero absoluto se sitúa en -273.15 grados Celsius, o -459.67 grados Fahrenheit.

  Los científicos usan el kelvin en criogenia, en el estudio de los gases y en el de la radiación.
  El NIST ofrece algunas referencias: el mercurio pierde toda su resistencia eléctrica a 4.2 K, la
  temperatura ambiente ronda los 294 K y una bombilla incandescente tiene una temperatura de color
  de unos 3000 K, frente a unos 5800 K de la superficie del Sol. La termometría práctica sigue la
  Escala Internacional de Temperatura de 1990.

  La unidad lleva el nombre del físico británico William Thomson, lord Kelvin, que vivió de 1824 a
  1907. La 10.ª CGPM adoptó en 1954 el grado Kelvin como unidad básica, con el punto triple del agua
  fijado en 273.16 grados, y la 13.ª CGPM le dio en 1967 el nombre de kelvin, con símbolo K. Se
  escribe sin el signo de grado y sin la palabra grado.
