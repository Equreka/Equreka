# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Ohmio metro'
description: >-
  El ohmio metro, de símbolo $\Omega\,\mathrm{m}$, es la unidad SI coherente de resistividad
  eléctrica, la propiedad que describe cuánto dificulta un material el paso de la corriente
  eléctrica. Es el producto del ohmio, la unidad SI de resistencia, por el metro, de modo que es
  una unidad derivada coherente sin nombre especial propio.

  Un material tiene una resistividad de un ohmio metro cuando un cubo de ese material de un metro
  de arista presenta una resistencia de un ohmio entre dos caras opuestas. La unidad se deduce de
  la relación entre resistencia y resistividad: la resistencia de una barra uniforme es su
  resistividad por su longitud dividida entre el área de su sección, de modo que el ohmio por el
  metro cuadrado y dividido entre el metro deja el ohmio metro.

  La publicación especial 811 del NIST convierte el ohmio centímetro de la bibliografía
  basada en el sistema CGS en exactamente la centésima parte del ohmio metro, y el ohmio mil
  circular por pie, una unidad tradicional de Estados Unidos, en unos
  $1.662\,426\times10^{-9}\,\Omega\,\mathrm{m}$. La inversa del ohmio metro, el siemens por metro,
  es la unidad de conductividad eléctrica.

  Los buenos conductores tienen resistividades diminutas en esta unidad: OpenStax da
  $1.68\times10^{-8}\,\Omega\,\mathrm{m}$ para el cobre a 20 °C. Los aislantes como el vidrio
  alcanzan valores entre nueve y catorce potencias de diez por encima del ohmio metro, por lo que
  la unidad casi siempre se escribe con una potencia de diez.

  Según las reglas del SI, el producto de símbolos de unidades se escribe con un espacio o un punto
  a media altura, de modo que el símbolo es Ω m o Ω·m, y el nombre de una unidad compuesta lleva
  un espacio o un guion: ohmio metro.
