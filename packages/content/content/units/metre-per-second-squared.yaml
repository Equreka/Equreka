description:
  en: >-
    The metre per second squared is the SI coherent derived unit of acceleration. It is formed by
    dividing the metre by the square of the second, which is the same as dividing the metre per
    second, the unit of velocity, by the second.

    An acceleration of one metre per second squared changes the velocity of a body by one metre per
    second during each second. The SI Brochure gives the unit in its table of coherent derived units
    expressed in base units, with the dimension of a length divided by a time squared. The same
    unit measures the gravitational field strength, since one newton per kilogram equals one metre
    per second squared.

    The gal of the CGS system, still used in geodesy and geophysics, equals one hundredth of a metre
    per second squared. The standard acceleration of gravity, adopted by the 3rd CGPM in 1901,
    is $9.806\,65\,\mathrm{m/s^{2}}$, and accelerations in engineering and aviation are often quoted
    as multiples of it. Speeds in kilometres per hour gained each second convert by dividing by 3.6.

    The unit is used wherever motion changes: braking distances, vehicle performance, free fall,
    circular motion, seismology and the design of lifts, rides and rockets. Typical values in
    everyday life sit between a fraction of a metre per second squared for a train and a few tens
    for a launch vehicle at full thrust.

    Its symbol is m/s², also written $\mathrm{m\,s^{-2}}$. The reading metre per second per second
    describes the same unit.
