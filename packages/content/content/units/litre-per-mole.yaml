description:
  en: >-
    The litre per mole, symbol $\mathrm{L/mol}$, is a unit of molar volume: the litre, a unit
    accepted for use with the SI, divided by the mole, the SI unit of amount of substance. It is
    the customary unit for the molar volume of gases in chemistry.

    The SI Brochure places the litre in its Table 8 of non-SI units admitted alongside the SI and
    defines it as exactly one cubic decimetre, so one litre per mole is exactly one thousandth of a
    cubic metre per mole, the coherent SI unit, and is identical to the cubic decimetre per mole.

    Gas volumes per mole come out as convenient two-digit numbers in this unit. An ideal gas at
    273.15 kelvin occupies about 22.711 litres per mole at 100 kilopascals, the current standard
    pressure, and about 22.414 litres per mole at one standard atmosphere, the older convention
    behind the 22.4 still found in many textbooks. Because the litre is the usual volume unit of laboratory chemistry, the
    molar gas constant is often quoted as $0.08206\,\mathrm{L\,atm\,mol^{-1}\,K^{-1}}$ so that the
    ideal gas law can take litres directly.

    The litre has two symbols: in 1879 the International Committee for Weights and Measures chose a
    lowercase l, and a century later, in 1979, the 16th General Conference on Weights and Measures
    added a capital L to avoid confusing the letter l with the numeral 1. Both l/mol and L/mol are therefore
    correct. The plural is litres per mole, spelled liters per mole in American English.
