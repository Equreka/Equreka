description:
  en: >-
    Standard gravity, symbol $\mathrm{g_{n}}$ and often written g, is a unit of acceleration equal
    to the standard acceleration of gravity, exactly $9.806\,65\,\mathrm{m/s^{2}}$. Accelerations
    stated as multiples of it are what aviation, spaceflight and vehicle engineering call g-forces:
    a reading of 3 g means three times this acceleration. It is not an SI unit.

    The value goes back to the 3rd CGPM, which in 1901 fixed 980.665 centimetres per second squared
    as the standard acceleration due to gravity, used to define standard weight. NIST Special
    Publication 811 lists the factor 9.806 65 as exact. The number is a convention, not a
    measurement at any one place: according to Rowlett's dictionary of units, the real acceleration
    of free fall at sea level ranges from about 9.780 at the equator to 9.833 metres per second
    squared at the poles.

    In other units, $1\,\mathrm{g_{n}}=980.665\,\mathrm{Gal}$ exactly, about 32.174 feet per second
    squared. The kilogram-force, which NIST gives as 9.806 65 newtons, and the pound-force are the
    weights of one kilogram and one avoirdupois pound under this acceleration.

    Rowlett records that the symbol g first served as a unit in aeronautical and space engineering,
    where the accelerations a crew can tolerate set design limits; many other accelerations are now
    quoted in g as well. The same number is the constant called the standard acceleration of
    gravity, which equations use as a value; the unit uses it as a conversion factor.

    The plain g clashes with the symbol of the gram, so NIST writes $\mathrm{g_{n}}$, QUDT uses G
    and the UCUM code is [g]. Gee and grav are informal names.
