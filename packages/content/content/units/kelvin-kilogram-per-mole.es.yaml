# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Kelvin kilogramo por mol'
description: >-
  El kelvin kilogramo por mol, de símbolo $\mathrm{K\,kg/mol}$, es la unidad SI coherente de las
  constantes ebulloscópica y crioscópica de un disolvente, los factores que convierten la molalidad
  de una disolución en el aumento de su punto de ebullición o el descenso de su punto de
  congelación. Es una unidad compuesta de la química de las disoluciones sin nombre especial.

  La unidad es el producto del kelvin y el kilogramo dividido entre el mol, tres unidades básicas
  del SI, de modo que es una unidad derivada coherente en el sentido del folleto del SI y no
  necesita definición propia. Leída como un kelvin dividido entre un mol por kilogramo, indica
  cuántos kelvin de variación de temperatura produce un mol de partículas disueltas por cada
  kilogramo de disolvente.

  Como una diferencia de temperatura tiene el mismo valor numérico en kelvin y en grados Celsius, un
  kelvin kilogramo por mol equivale exactamente a un grado Celsius kilogramo por mol. Mil gramos
  forman un kilogramo, así que la unidad equivale también exactamente a 1000 kelvin gramo por mol.

  Los libros de química dan esas mismas constantes en grados Celsius por molal, con m para un mol
  por kilogramo, una abreviatura que la IUPAC admite solo aislada y nunca dentro del símbolo de una
  unidad compuesta. Los números no cambian: para el agua la constante ebulloscópica vale 0.512 y la
  crioscópica 1.86 en cualquiera de las dos unidades, mientras que el benceno, con 5.12 para su
  punto de congelación, da desplazamientos mayores con la misma molalidad.

  El símbolo puede escribirse también K kg mol⁻¹, con un espacio entre los factores y un exponente
  negativo en lugar de la barra oblicua, como permite la sección 5.2 del folleto del SI; un símbolo
  de unidad nunca lleva marca de plural.
