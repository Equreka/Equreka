description:
  en: >-
    The light-year, symbol ly, is a unit of length: the length of the path that light covers
    through empty space during one Julian year. Despite its name it measures distance, not time. It sits outside
    the International System of Units and appears mostly in popular astronomy, where it gives a
    feeling for the distances to stars and galaxies.

    The International Astronomical Union takes a year, unless stated otherwise, to be the Julian
    year of $365.25\,\mathrm{d}$, each day lasting $86\,400\,\mathrm{s}$. Multiplying that interval by the exact speed of
    light in vacuum, $c$, gives $1\,\mathrm{ly}=9\,460\,730\,472\,580\,800\,\mathrm{m}$ exactly,
    since both factors are fixed by definition. NIST Special Publication 811 prints the factor
    rounded to six digits and notes that it rests on the day of $86\,400\,\mathrm{s}$ and on the
    Julian reckoning of the year.

    A light-year is about 63 241 times the astronomical unit, and the parsec, the unit astronomers
    prefer for distances across the Milky Way and beyond, is about 3.26 times longer than the
    light-year. A distance in light-years also tells how long ago the light now arriving set out:
    light from a star ten light-years away left it ten years earlier.

    The IAU notes that the light-year is sometimes used in research papers but is chiefly a unit
    of popular publications and the media, and the parsec is the usual choice in professional work.
    The name is written light-year or light year; the plural is light-years. NIST writes the symbol
    l.y., while ly is the more common form, and neither takes a plural ending.
