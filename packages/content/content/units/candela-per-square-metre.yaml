description:
  en: >-
    The candela per square metre, symbol $\mathrm{cd/m^{2}}$, is the coherent SI derived unit of
    luminance, the luminous intensity that a surface sends in a given direction per unit of its
    projected area. It has no special name in the SI, whose brochure lists it among coherent
    derived units written in base units; in display engineering it is widely called the nit.

    A surface has a luminance of one candela per square metre when each square metre of it, as
    projected onto a plane perpendicular to the line of sight, emits a luminous intensity of one
    candela towards the observer. Both factors are SI units, so the unit is coherent and needs no
    numerical factor.

    NIST Special Publication 811 converts the CGS stilb, one candela per square centimetre, as
    exactly $10^{4}\,\mathrm{cd/m^{2}}$; the candela per square inch as about 1550.003 candelas per
    square metre; the footlambert as about 3.426 259; and the lambert as about 3183.099 candelas
    per square metre.

    Display brightness is specified in this unit. QUDT gives 200 to 300 candelas per square metre
    for typical desktop liquid-crystal monitors, 80 as the target of the sRGB standard, about 120
    for calibrated monitors and from 450 to roughly 1000 for high-definition televisions.

    The 11th General Conference on Weights and Measures included the candela per square metre
    among the derived units of the SI in 1960. The name nit, symbol nt, is not an SI name and QUDT
    marks it as deprecated; Rowlett traces it to the Latin verb for shining. The symbol may also
    be written cd m⁻²; the plural is candelas
    per square metre.
