# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Metro por segundo al cuadrado'
description: >-
  El metro por segundo al cuadrado es la unidad derivada coherente del SI de la aceleración. Se
  forma dividiendo el metro entre el cuadrado del segundo, lo que equivale a dividir el metro por
  segundo, la unidad de velocidad, entre el segundo.

  Una aceleración de un metro por segundo al cuadrado cambia la velocidad de un cuerpo en un metro
  por segundo durante cada segundo. El folleto del SI recoge la unidad en su tabla de unidades
  derivadas coherentes expresadas en unidades básicas, con la dimensión de una longitud dividida
  entre un tiempo al cuadrado. La misma unidad mide la intensidad del campo gravitatorio, ya que un
  newton por kilogramo equivale a un metro por segundo al cuadrado.

  El gal del sistema CGS, aún usado en geodesia y geofísica, equivale a la centésima parte de un
  metro por segundo al cuadrado. La aceleración normal de la gravedad, adoptada por la 3.ª CGPM en
  1901, vale $9.806\,65\,\mathrm{m/s^{2}}$, y en ingeniería y aviación las aceleraciones se expresan
  a menudo como múltiplos de ella. Los kilómetros por hora ganados en cada segundo se convierten
  dividiendo entre 3.6.

  La unidad se usa siempre que el movimiento cambia: distancias de frenado, prestaciones de
  vehículos, caída libre, movimiento circular, sismología y diseño de ascensores, atracciones y
  cohetes. Los valores cotidianos van desde una fracción de metro por segundo al cuadrado en un tren
  hasta unas decenas en un vehículo de lanzamiento a pleno empuje.

  Su símbolo es m/s², que también se escribe $\mathrm{m\,s^{-2}}$. La lectura metro por segundo
  cada segundo designa la misma unidad.
