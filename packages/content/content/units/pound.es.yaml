# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Libra'
description: >-
  La libra, de símbolo lb, es la unidad de masa del sistema imperial británico y del sistema
  consuetudinario estadounidense. La unidad a la que se refiere hoy el nombre es la libra avoirdupois
  internacional, la libra del comercio cotidiano en Estados Unidos; los ingenieros la llaman libra
  masa, lbm, para distinguirla de la libra fuerza.

  La libra se define como exactamente 0.453 592 37 kilogramos,
  $1\,\mathrm{lb}=0.453\,592\,37\,\mathrm{kg}$. El valor entró en vigor en las calibraciones
  estadounidenses el 1 de julio de 1959, y los institutos de metrología del Reino Unido, Canadá,
  Australia, Nueva Zelanda y Sudáfrica lo tomaron a la vez como libra internacional.
  La ley de pesas y medidas de Canadá lo escribe como 45 359 237/100 000 000 kilogramos.

  Una libra contiene 16 onzas o 7000 granos. La cifra de 1959 es divisible exactamente entre siete,
  de modo que el grano pasó a valer exactamente 64.798 91 miligramos. Catorce libras forman un
  stone, 2000 una tonelada corta y 2240 una tonelada larga, y un kilogramo equivale a unas 2.2
  libras. La libra troy de 5760 granos, usada históricamente para la moneda, es una unidad distinta
  y más ligera.

  Según el NIST, la libra desciende de la mina de las civilizaciones antiguas, y la libra romana
  (libra, en latín) es la unidad cuyo nombre el inglés traduce como pound. Desde 1893 Estados Unidos
  definió la libra a partir del kilogramo como 1/2.20462 kilogramos, valor ajustado en 1894 para
  coincidir con la libra imperial británica; el valor de 1959 es menor que la libra de 1894 en
  aproximadamente una parte en diez millones, muy por debajo de lo que el comercio corriente puede
  detectar.

  El manual 44 del NIST añade avdp tras el nombre o el símbolo cuando la libra avoirdupois debe
  distinguirse de la libra troy, lb t, o de la libra de boticario, lb ap. El Reino Unido abolió la
  libra troy en 1879 y conservó solo la onza troy, mientras que la libra troy sigue siendo legal en
  Estados Unidos.
