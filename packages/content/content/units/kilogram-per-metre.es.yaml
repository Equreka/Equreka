# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Kilogramo por metro'
description: >-
  El kilogramo por metro, de símbolo $\mathrm{kg/m}$, es la unidad SI coherente de la densidad
  lineal de masa, la masa que lleva cada metro de un objeto largo y delgado como una cuerda, un
  hilo, un cable, una cadena o una fibra. Describe lo pesado que es un objeto a lo largo de su
  longitud, con independencia de su longitud total o de su sección.

  La unidad no tiene nombre especial: es la unidad básica kilogramo dividida entre la unidad básica
  metro, y es coherente en el sentido del folleto del SI porque la combinación no lleva ningún
  factor numérico salvo el uno. Una cuerda uniforme de 2 metros con una masa de 0.06 kilogramos, un ejemplo de OpenStax,
  tiene una densidad lineal de 0.03 kilogramos por metro.

  Un kilogramo por metro equivale a 1000 gramos por metro, o a un gramo por milímetro. La industria
  textil mide hilos y fibras en tex, un gramo por kilómetro, así que un kilogramo por metro es un
  millón de tex. QUDT clasifica la unidad bajo las magnitudes masa por unidad de longitud y masa
  lineica, y la incluye entre las unidades aplicables a la densidad lineal.

  En física, la unidad interviene en la rapidez de una onda transversal en una cuerda tensa, la raíz
  cuadrada de la tensión dividida entre la densidad lineal. OpenStax da para la cuerda mi aguda
  de una guitarra 0.000 309 kilogramos por metro y para la mi grave 0.005 78, una razón cercana a 20:
  con igual tensión, una onda avanzaría más de cuatro veces más despacio en la cuerda más pesada.

  El símbolo también puede escribirse $\mathrm{kg\,m^{-1}}$. En inglés estadounidense el nombre se
  escribe kilogram per meter, y el plural es kilogramos por metro.
