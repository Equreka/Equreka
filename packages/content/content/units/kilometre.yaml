name:
  en: 'Kilometre'
symbol:
  tex: 'km'
unitOf:
  - 'length'
system: 'si-derived'
prefixOf:
  prefix: 'kilo'
  base: 'metre'
categories:
  - 'physics'
description:
  en: 'The $metre$ (International spelling) or $meter$ (American spelling; see spelling differences)
    (from the French unit mètre, from the Greek noun μέτρον, "measure") is the base unit of length
    in the International System of Units (SI). The SI unit symbol is $m$.'
