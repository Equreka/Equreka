# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Libra fuerza'
description: >-
  La libra fuerza, de símbolo $\mathrm{lbf}$, es la unidad de fuerza asociada a la libra
  avoirdupois en los sistemas imperial y usual de Estados Unidos: el peso de una masa de una
  libra sometida a la aceleración normal de la gravedad. No es una unidad del SI.

  Su valor se deduce de dos definiciones exactas: la libra avoirdupois, de exactamente
  $0.453\,592\,37\,\mathrm{kg}$, y la aceleración normal de la gravedad, un valor convencional
  adoptado por la Conferencia General de Pesas y Medidas en 1901. Su producto hace que una libra
  fuerza valga exactamente $4.448\,221\,615\,260\,5\,\mathrm{N}$. La publicación especial 811 del
  NIST indica el factor redondeado 4.448 222 en su apéndice B.8 y da el valor exacto en la nota
  correspondiente, a condición de usar el valor normal de la gravedad.

  Muchas unidades usuales se construyen sobre ella. El NIST convierte la libra fuerza pie, una
  unidad de momento de una fuerza, y la libra fuerza por pulgada al newton metro y al newton por
  metro con factores de unos 1.355 818 y 175.126 8; la libra fuerza por pulgada cuadrada, una unidad de
  presión, es la libra fuerza que actúa sobre una pulgada cuadrada. Como el kilogramo fuerza se
  define a partir del kilogramo con la misma gravedad normal, una libra fuerza equivale a tantos
  kilogramos fuerza como kilogramos tiene la libra.

  La libra fuerza es una fuerza y la libra es una masa; escribir lbf para la fuerza mantiene
  separadas ambas. En la superficie de la Tierra, una masa de una libra pesa aproximadamente una
  libra fuerza, pero ambas coinciden exactamente solo donde la aceleración local de la gravedad
  es igual al valor normal. El plural es libras fuerza.
