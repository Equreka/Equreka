# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Julio por kilogramo'
description: >-
  El julio por kilogramo, de símbolo $\mathrm{J/kg}$, es la unidad SI derivada coherente de la
  energía por unidad de masa. En termodinámica mide el calor latente específico, la energía que un
  kilogramo de una sustancia absorbe o desprende al fundirse, solidificarse, hervir o condensarse;
  el folleto del SI la indica como unidad de la energía específica en general.

  Es el julio dividido entre el kilogramo y no tiene nombre especial propio. Una sustancia tiene un
  calor latente específico de un julio por kilogramo cuando cambiar de fase un kilogramo de ella
  requiere un julio. Escrita en unidades básicas del SI, la unidad se reduce al metro cuadrado por
  segundo al cuadrado, lo mismo que el cuadrado de una rapidez.

  Los calores latentes son grandes, por lo que las tablas los dan en kilojulios por kilogramo:
  fundir hielo a la presión normal requiere unos 334 de ellos, y hervir agua unos 2256. La publicación especial 811 del
  NIST convierte con exactitud las unidades antiguas: una caloría termoquímica por gramo equivale a
  4184 julios por kilogramo, y una unidad térmica británica de la tabla internacional por libra
  equivale a $2326\,\mathrm{J/kg}$.

  La dosis absorbida y la dosis equivalente de la radiación ionizante tienen la misma dimensión,
  pero se expresan con el gray y el sievert. El folleto del SI explica que esos nombres especiales
  existen para evitar que una dosis se confunda con otra magnitud expresada en julios por kilogramo,
  lo que podría poner en peligro la salud; por esa razón el julio por kilogramo no se usa para las
  dosis de radiación, y un valor en esta unidad debe indicar siempre la magnitud que mide.

  El símbolo puede escribirse también con un exponente negativo en el kilogramo. El plural es julios
  por kilogramo.
