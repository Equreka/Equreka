# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Julio segundo'
description: >-
  El julio segundo, de símbolo $\mathrm{J\,s}$, es la unidad SI derivada coherente de acción y de
  momento angular: el producto del julio, la unidad SI de energía, por el segundo. Reducida a
  unidades básicas es el kilogramo metro cuadrado por segundo, de modo que mide tanto la acción de
  la mecánica clásica y cuántica como el giro de cuerpos y partículas en rotación.

  Desde la revisión del SI que entró en vigor en 2019, el kilogramo se define fijando la constante
  de Planck en exactamente $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$, y el folleto del SI indica
  que el julio segundo equivale al kilogramo metro cuadrado por segundo. Por tanto, la unidad forma
  parte de la definición de la unidad SI de masa.

  El momento angular de un sólido rígido es su momento de inercia, expresado en kilogramo metro
  cuadrado, por su velocidad angular, en radianes por segundo, lo que da la unidad julio segundo.
  La acción es una energía multiplicada por un tiempo. Al multiplicar la constante de Planck por una frecuencia en
  hercios se obtiene la energía de un fotón en julios, y así se analiza el efecto fotoeléctrico;
  OpenStax pide estimar la constante a partir de datos de potencial de frenado, expresada en julio
  segundo y en electronvoltio segundo.

  Los valores expresados en julio segundo son diminutos a escala atómica, por lo que la física
  cuántica usa también el electronvoltio segundo y expresa el momento angular como múltiplo de la
  constante de Planck reducida, la constante de Planck dividida entre $2\pi$, que tiene la misma
  unidad. En la mecánica cotidiana la unidad aparece como kilogramo metro cuadrado por segundo en
  problemas sobre ruedas, patinadores y planetas que giran.

  El folleto del SI exige un espacio o un punto a media altura entre los dos símbolos, así que la
  unidad se escribe J s o J·s y no Js. En el texto el nombre se escribe en dos palabras, julio segundo.
