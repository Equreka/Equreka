# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Gramo'
namePlural: 'gramos'
description: >-
  El gramo, de símbolo $\mathrm{g}$, es una unidad de masa igual a la milésima parte de un
  kilogramo. Es la raíz a la que se unen los prefijos SI en todas las unidades de masa, de modo que
  el miligramo, el microgramo y el propio kilogramo toman su nombre de él, y fue la unidad de masa
  del sistema centímetro-gramo-segundo de la física.

  El gramo no tiene definición propia: equivale exactamente a $1\,\mathrm{g}=10^{-3}\,\mathrm{kg}$,
  así que sigue al kilogramo, fijado desde 2019 mediante la constante de Planck. Una recomendación
  del CIPM de 1967 estableció la regla de formación de nombres: las unidades de masa mayores y
  menores llevan el prefijo sobre la palabra gramo, nunca sobre kilogramo.

  Un miligramo es la milésima parte de un gramo y un microgramo la millonésima, mientras que la
  tonelada, unidad aceptada para su uso con el SI, equivale a un millón de gramos, el megagramo. La
  publicación especial 811 del NIST da para la onza avoirdupois unos 28.35 gramos.

  El gramo es la unidad cotidiana de las etiquetas de alimentos y de las recetas, y la unidad de
  trabajo de las balanzas de laboratorio. La química expresa las masas molares en gramos por mol, y
  las densidades de líquidos y sólidos suelen darse en $\mathrm{g/cm^{3}}$.

  Gauss empleó en 1832 el milímetro, el gramo y el segundo para medir en términos absolutos el campo
  magnético terrestre, y en 1874 la Asociación Británica para el Avance de la Ciencia (BAAS) basó
  en el gramo su sistema centímetro-gramo-segundo. La 9.ª CGPM recogió el símbolo g en 1948. El símbolo es
  una g minúscula escrita sin punto, y el plural del nombre es gramos.
