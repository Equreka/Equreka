# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Julio por mol'
namePlural: 'julios por mol'
description: >-
  El julio por mol, de símbolo $\mathrm{J/mol}$, es la unidad SI derivada coherente de energía
  molar, una energía dividida entre una cantidad de sustancia. Combina el julio, la unidad SI de
  energía, con el mol, la unidad básica de cantidad de sustancia, y no tiene nombre especial.

  El folleto del SI incluye el julio por mol en su tabla de unidades derivadas coherentes cuyos
  nombres contienen una unidad con nombre especial, con la energía molar como magnitud. En unidades
  básicas es el kilogramo metro cuadrado por segundo al cuadrado y por mol. Una energía de un julio
  por cada mol de entidades especificadas, ya sean moléculas que reaccionan, iones que se forman o
  átomos que se vaporizan, es un julio por mol.

  Las energías químicas por mol son grandes en julios, por lo que las tablas de termoquímica usan
  el kilojulio por mol, mil julios por mol. Las entalpías estándar de formación, las entalpías de
  combustión y de reacción y las energías de Gibbs de reacción se dan todas en esa unidad: la
  formación de dióxido de carbono a partir de grafito y oxígeno tiene una entalpía estándar de
  $-393.5\,\mathrm{kJ/mol}$, y la combustión completa del etanol desprende 1366.8 kilojulios por
  mol. Cuando una energía de Gibbs se calcula a partir de un potencial de celda, el producto de los
  moles de electrones, la constante de Faraday y el potencial resulta en julios por mol de reacción.

  El julio por mol no debe leerse como la energía de una molécula: al dividir una energía molar
  entre la constante de Avogadro se obtiene la energía por entidad, de modo que los 393.5 kilojulios
  por mol desprendidos al formarse dióxido de carbono equivalen a unos 6.5 × 10⁻¹⁹ julios por
  molécula formada. El símbolo puede escribirse también J mol⁻¹, y el plural es julios por mol.
