# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Tonelada'
description: >-
  La tonelada, de símbolo t, es una unidad de masa igual a 1000 kilogramos, llamada tonelada
  métrica en Estados Unidos y en otros países de habla inglesa. No es una unidad SI coherente, pero
  el folleto del SI la incluye entre los nombres históricos de múltiplos decimales de unidades
  SI, y es la medida habitual de las grandes masas en el comercio, la industria y el
  transporte.

  El folleto del SI la define en la tabla 8 como
  $1\,\mathrm{t}=1\,\mathrm{Mg}=10^{3}\,\mathrm{kg}$, un megagramo, y la publicación especial 811
  del NIST da el mismo factor exacto para la tonelada métrica. La tonelada tiene así la precisión
  del propio kilogramo, que desde 2019 se define mediante el valor fijo de la constante de Planck.

  La tonelada no debe confundirse con las dos toneladas de los sistemas anglosajones. El NIST da la
  tonelada corta de 2000 libras como unos 907.18 kilogramos y la tonelada larga de 2240 libras como
  unos 1016.05 kilogramos. Como la libra avoirdupois vale exactamente 0.453 592 37 kilogramos, una
  tonelada son unas 2204.6 libras, algo menos que una tonelada larga y alrededor de una décima más
  que una tonelada corta.

  Las cosechas, los fletes, la carga de los buques, la producción de acero y cemento, la minería y
  los inventarios de gases de efecto invernadero se expresan en toneladas, o en miles y millones de
  toneladas. En los problemas de física, una masa en toneladas se convierte a kilogramos antes de
  aplicar una fórmula SI coherente.

  El CIPM adoptó la tonelada y su símbolo t en 1879, junto con el litro. El símbolo es una t
  minúscula y recta, sin marca de plural y sin punto. Escribir la misma masa como megagramo, Mg,
  sigue las reglas de los prefijos SI y evita cualquier duda sobre qué tonelada se quiere decir.
