description:
  en: >-
    The decibel, symbol $\mathrm{dB}$, is a unit for logarithmic ratio quantities: it expresses how
    many tenths of a power of ten separate a power-like quantity from a stated reference value. In
    acoustics it is the unit in which sound intensity level and other sound levels are given. It is
    not an SI unit; the SI Brochure lists it, with the bel and the neper, among the units used in
    specialized technical fields.

    The SI Brochure defines its use through a rule rather than a factor. A level of m decibels means
    that m is ten times the decimal logarithm of the ratio of the quantity to its reference, and the
    Brochure and NIST both require the quantity and the reference value to be named with the result.
    ISO 1683 fixes the references used in acoustics, among them one picowatt per square metre for
    sound intensity and 20 micropascals for sound pressure in air.

    One decibel is a tenth of a bel. Because a level is a logarithm, decibels do not convert by a
    constant factor into any linear unit: 10 decibels above a reference is ten times the reference
    intensity, 20 decibels a hundred times and 30 a thousand times. Levels in decibels add only in
    the sense that the underlying ratios multiply.

    QUDT attaches the decibel to sound power level, sound pressure level, sound exposure level and
    sound reduction index, as well as to base-ten logarithmic ratios in general, each with its own
    reference.

    The bel takes its name from Alexander Graham Bell, who invented the telephone, and the decibel
    is the tenth part used in practice. The symbol is dB, with a lowercase d for the prefix deci and
    a capital B for the bel; the plural is decibels.
