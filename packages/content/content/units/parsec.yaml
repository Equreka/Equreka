description:
  en: >-
    Professional astronomy measures the distances to stars and galaxies in parsecs, a unit of
    length with the symbol pc. One parsec is the distance at which one astronomical unit, roughly the
    distance from the Earth to the Sun, spans an angle of one arcsecond, so a star one parsec away shows an annual
    parallax of exactly one arcsecond.

    Footnote 4 of Resolution B2 of the International Astronomical Union, adopted in 2015, states the
    definition as exactly $(648\,000/\pi)\,\mathrm{au}$. Because the astronomical unit itself has
    been an exact number of metres since 2012, the parsec in metres is fixed too, but the factor
    contains $\pi$ and therefore has no finite decimal form:
    $1\,\mathrm{pc}\approx3.085\,677\,581\times10^{16}\,\mathrm{m}$. NIST Special Publication 811
    lists the factor rounded to seven significant digits.

    A parsec is about 206 265 times the astronomical unit and about 3.26 times the light-year. Its decimal
    multiples carry the scale of the Universe: the kiloparsec for distances within the Milky Way
    and the megaparsec for distances between galaxies. The same IAU resolution places the zero
    point of the absolute bolometric magnitude scale at a standard distance of ten parsecs, so the parsec
    enters the very definition of how bright a star is intrinsically.

    The IAU describes the parsec as the usual choice for studies of the structure of the Milky Way,
    whereas the light-year appears mostly in popular writing. The definition follows directly from
    measuring parallax: the nearer a star, the larger the yearly shift in its position against
    distant background objects, and the distance in parsecs is very nearly the reciprocal of the
    parallax in arcseconds.
