description:
  en: >-
    The British thermal unit, symbol Btu, is a unit of energy and heat from the customary tradition
    built on the pound and the degree Fahrenheit. It began as the heat that raises the temperature of a
    pound of water through a Fahrenheit degree. Several versions exist; the one described here is the
    International Table British thermal unit, to which NIST assigns an exact value in joules.

    Its definition follows from the International Table calorie, which the Fifth International
    Conference on the Properties of Steam fixed at exactly 4.1868 joules in London in 1956. On that
    basis NIST Special Publication 811 states the exact factor
    $1\,\mathrm{Btu}=1055.055\,852\,62\,\mathrm{J}$, the product of 4.1868 joules per gram kelvin,
    one pound of 453.592 37 grams and five ninths of a kelvin, the size of one degree Fahrenheit.
    The thermochemical Btu, built on the thermochemical calorie, is about 1054.350 joules.

    Because of that construction, one Btu per pound equals exactly 2326 joules per kilogram, and one
    Btu per pound degree Fahrenheit equals exactly 4186.8 joules per kilogram kelvin, so water has a
    specific heat close to one in either the calorie or the Btu system. Large energy budgets use the
    quad, $10^{15}\,\mathrm{Btu}$.

    The unit survives in heating, cooling and fuel trades. NIST lists conversions for the Btu per
    hour and for the ton of refrigeration, 12 000 Btu per hour or about 3517 watts. The therm of the
    European Communities is based on the International Table Btu, while the United States therm is
    the legal unit of the American natural gas industry. In the United States, the R factor of
    building insulation is still expressed in square foot degree Fahrenheit hours per Btu.

    The symbol is also printed BTU; the subscripts IT and th distinguish the two exact versions. The
    plural is British thermal units.
