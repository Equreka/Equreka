# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Hercio'
namePlural: 'hercios'
description: >-
  El hercio, de símbolo $\mathrm{Hz}$, es la unidad SI derivada coherente de frecuencia, el número
  de ciclos que completa un fenómeno periódico por unidad de tiempo. Un hercio es un ciclo por
  segundo, y en unidades básicas del SI es el segundo a la menos uno, $\mathrm{s^{-1}}$.

  El folleto del SI reserva el hercio para los fenómenos periódicos. El segundo a la menos uno mide
  también la actividad de un radionucleido, pero esa magnitud se expresa en becquerels, y la
  frecuencia angular y la velocidad angular se expresan en radianes por segundo. Como la frecuencia
  angular supera a la frecuencia en el número de radianes de una vuelta, el folleto recomienda dar
  las frecuencias en hercios y las magnitudes angulares en rad/s, no como simples potencias
  negativas del segundo. Señala además que el ciclo y la revolución, aunque aparezcan en expresiones como
  ciclos por segundo, no son unidades del SI.

  El periodo de una oscilación es el inverso de su frecuencia, de modo que una vibración de 50
  hercios se repite cada 20 milisegundos. El hercio sostiene además la definición del segundo, ya
  que el SI fija la frecuencia de la transición hiperfina del cesio-133 en exactamente
  $9\,192\,631\,770\,\mathrm{Hz}$, y es una de las unidades que nombra la definición vigente del SI.

  Las formas con prefijo abarcan un intervalo muy amplio: la candela se define con radiación de 540
  terahercios, y el terahercio figura entre los ejemplos de unidades con prefijo del folleto. Los
  nombres con prefijo, como kilohercio y megahercio, se escriben en una sola palabra.

  La unidad rinde homenaje al físico alemán Heinrich Hertz (1857-1894), que en 1887 comenzó los
  experimentos en los que generó y detectó por primera vez ondas electromagnéticas en el
  laboratorio. La 11.ª CGPM incluyó el hercio entre las unidades derivadas del SI en 1960. El plural
  es hercios.
