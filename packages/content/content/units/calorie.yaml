description:
  en: >-
    The calorie, symbol cal, is a unit of energy outside the International System of Units that grew
    out of the heating of water: it is close to the heat needed to raise the temperature of a gram of
    water through a Celsius degree. Several calories have been defined over time; the variant
    described here is the thermochemical calorie, defined as a round number of joules.

    The thermochemical calorie is defined as exactly $1\,\mathrm{cal}=4.184\,\mathrm{J}$, the factor
    that NIST Special Publication 811 lists, in bold as an exact value, in its conversion appendix.
    The International Table calorie, set in London in 1956 by the fifth of the International
    Conferences on the Properties of Steam, is slightly larger at exactly $4.1868\,\mathrm{J}$, and
    NIST also lists rounded factors for calories tied to water at 15 or 20 degrees Celsius and for a
    mean calorie. A value in calories is therefore ambiguous unless the variant is named, which is
    why the subscripts th and IT are attached to the symbol.

    The kilocalorie, a thousand calories, equals 4184 joules in the thermochemical form. Food energy
    is quoted in kilocalories, although labels usually drop the prefix and write Calorie with a
    capital letter, the large calorie.

    In 1948 the 9th CGPM declared the joule the unit of quantity of heat and asked that calorimetric
    results be expressed in joules, giving conversion information whenever the calorie could not be
    avoided. NIST Special Publication 811 lists the calorie among the units not to be used in its own
    publications, yet the unit persists in nutrition and in older chemistry tables. The plural is
    calories.
