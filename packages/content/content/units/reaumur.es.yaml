# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Grado Réaumur'
description: >-
  El grado Réaumur, de símbolo °Ré, es la unidad de una escala histórica de temperatura que sitúa
  el 0 en el punto de congelación del agua y el 80 en su punto de ebullición a presión atmosférica
  normal. Fue una de las escalas termométricas de mayor éxito del siglo XVIII y queda fuera del
  SI.

  Ninguna norma vigente la define, así que las conversiones siguen sus dos puntos fijos: 0 grados
  Réaumur equivalen a 0 grados Celsius y 80 grados Réaumur a 100 grados Celsius. Un grado
  Réaumur es, por tanto, exactamente cinco cuartos de grado Celsius, o 1.25 kelvin, y una
  temperatura en kelvin es 1.25 veces la lectura Réaumur más 273.15.

  Como las escalas Réaumur y Celsius comparten el cero, un solo factor convierte una en otra,
  mientras que el kelvin necesita además el desplazamiento. El cero absoluto queda en -218.52
  grados Réaumur.

  El Museo Galileo de Florencia conserva un termómetro de alcohol con escala Réaumur fabricado en
  París y usado por químicos para seguir el calor de las reacciones, y su relato de la
  termometría antigua cita la escala de 80 grados junto a las de Celsius y Fahrenheit. El propio
  Anders Celsius estaba habituado a los termómetros Réaumur antes de idear su escala.

  René-Antoine Ferchault de Réaumur (1683-1757), el científico francés cuyo nombre lleva la
  escala, expuso reglas para construir termómetros comparables en una memoria a la Academia de
  Ciencias de París correspondiente a 1730 y en una segunda memoria de 1731; sus instrumentos se
  llenaban de espíritu de vino. Algunos textos escriben el símbolo °R, que choca con el del grado
  Rankine.
