description:
  en: >-
    The degree Delisle, symbol °De, is the unit of a historical temperature scale named after the
    French astronomer Joseph-Nicolas Delisle. The scale runs backwards: it puts 0 at the boiling
    point of water and, in the conventional form used for conversions, 150 at the freezing point,
    so its numbers grow as the temperature falls. It
    lies outside the SI.

    No standard defines it today, and conversions follow those two fixed points: 0 degrees
    Delisle equals 100 degrees Celsius and 150 degrees Delisle equals 0 degrees Celsius. One
    degree Delisle therefore spans two thirds of a kelvin, with the sign reversed: a Celsius
    temperature is 100 minus two thirds of the Delisle reading, and a kelvin temperature is 373.15
    minus the same amount.

    The reversal is the scale's defining feature. Heating lowers the reading, a fall of three
    degrees Delisle is a warming of two kelvins, and absolute zero lies at 559.725 degrees Delisle,
    the highest reading the scale can take.

    Placing zero at the boiling point kept every reading positive in ordinary weather. Anders
    Celsius used a thermometer made by Delisle, and his own hundred-degree scale also counted
    upward from boiling water; the direct order, with zero at the freezing point, came into use only
    after Celsius died in 1744.
