description:
  en: >-
    The ounce, symbol oz, is a unit of mass of the United States customary system and the British
    imperial system, equal to one sixteenth of a pound. The name alone means the avoirdupois ounce
    of ordinary goods, as distinct from the troy ounce of precious metals and from the fluid ounce,
    which measures volume.

    Since the international pound was fixed in 1959 at exactly 0.453 592 37 kilogram, the
    avoirdupois ounce is exactly $28.349\,523\,125\,\mathrm{g}$. NIST Special Publication 811 rounds
    it to 28.349 52 grams, and Canada's Weights and Measures Act defines it as one sixteenth of a
    pound or 437½ grains.

    The ounce is 437.5 grains and is divided into 16 drams. The troy ounce, used for precious
    metals, is 480 grains, about 31.103 grams, and is equal to the apothecaries' ounce. The fluid
    ounce is a unit of volume: the U.S. fluid ounce is about 29.573 millilitres and the imperial
    fluid ounce about 28.413 millilitres. The imperial fluid ounce is sized to hold one avoirdupois
    ounce of water measured at 62 °F, a match that NIST notes the U.S. fluid ounce lacks.

    In the United Kingdom the troy ounce is the only ounce that may still be used on its own in
    trade, for precious metals; other goods must carry a metric quantity, with an imperial figure
    allowed only as a less prominent addition. NIST Handbook 44 adds avdp, or the word avoirdupois,
    whenever the avoirdupois ounce has to be told apart from the troy or apothecaries' ounce.

    NIST pairs the ounce with the Roman uncia, the twelfth part of the Roman pound, although the
    uncia was smaller than the later troy ounce. The English troy pound kept that division into 12
    ounces, while the avoirdupois pound has 16. The plural of the name is ounces.
