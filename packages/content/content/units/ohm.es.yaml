# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Ohmio'
namePlural: 'ohmios'
description: >-
  El ohmio, de símbolo $\Omega$, es la unidad SI derivada coherente de resistencia eléctrica, la
  oposición de un conductor al paso de una corriente constante, y también de reactancia e
  impedancia en los circuitos de corriente alterna. Un ohmio es un voltio por amperio; en unidades
  básicas del SI es el kilogramo metro cuadrado por segundo al cubo y por amperio al cuadrado.

  La definición del CIPM de 1946 establece que un conductor tiene una resistencia de un ohmio entre
  dos puntos cuando una diferencia de potencial constante de un voltio entre ellos produce una
  corriente de un amperio, siempre que el propio conductor no genere ninguna fuerza electromotriz.
  El inverso del ohmio, la unidad de conductancia, recibió de la 14.ª CGPM en 1971 el nombre
  especial de siemens. El producto de un ohmio por un faradio es un segundo.

  Los laboratorios realizan el ohmio mediante el efecto Hall cuántico, cuya constante de von
  Klitzing es igual a la constante de Planck dividida entre el cuadrado de la carga elemental. El
  CIPM fijó para ella un valor convencional de exactamente 25 812.807 ohmios a partir de 1990; la
  revisión del SI de 2018 fijó ambas constantes, de modo que la constante de von Klitzing tiene
  ahora un valor exacto, 25 812.807 45... ohmios, cuyas cifras decimales no terminan nunca, y el
  valor convencional quedó derogado.

  Se usa como símbolo la letra griega omega mayúscula para evitar la
  confusión con la cifra 0.

  La unidad debe su nombre al científico alemán Georg Simon Ohm (1789-1854), cuyo libro de
  1827 expuso lo que hoy se conoce como ley de Ohm. La 11.ª CGPM incluyó el ohmio entre las
  unidades derivadas del SI en 1960. El plural es ohmios.
