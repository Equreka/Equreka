# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Gray'
namePlural: 'grais'
description: >-
  El gray, de símbolo $\mathrm{Gy}$, es la unidad SI derivada coherente de dosis absorbida, la
  energía que la radiación ionizante deposita por unidad de masa en la materia que atraviesa. Un
  gray corresponde a un julio absorbido por cada kilogramo, y es una de las 22 unidades SI con
  nombre y símbolo especiales.

  La 15.ª CGPM adoptó el nombre en 1975 mediante la Resolución 9, y fijó el gray igual al julio por
  kilogramo, $\mathrm{J/kg}$. Al año siguiente el CIPM, por consejo de la ICRU, extendió su uso al
  kerma y a la energía específica impartida. El folleto del SI insiste en el nombre especial en
  lugar del julio por kilogramo para que la dosis absorbida nunca se confunda con la dosis
  equivalente, cuya unidad, el sievert, tiene la misma dimensión.

  El antiguo rad equivale exactamente a 0.01 gray, de modo que un gray son 100 rad. Las dosis que
  reciben los pacientes suelen darse en miligrais: una
  tomografía computarizada de tórax da unos 10 miligrais al tiroides, y una de cráneo unos 60
  miligrais al cristalino.

  La unidad honra a Louis Harold Gray, el físico británico que contribuyó a fundar la
  radiobiología. Junto con John Read definió una primera unidad de energía absorbida válida para
  todos los tipos de radiación ionizante, precursora del rad al que la ICRU dio nombre en 1953. El
  nombre se escribe en minúscula en el texto corrido, la Fundéu propone grais como plural en
  español, aunque su uso es escaso, y el símbolo Gy empieza con mayúscula.
