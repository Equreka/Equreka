# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pulgada'
description: >-
  La pulgada, de símbolo in, es una unidad de longitud del sistema imperial británico y del sistema
  consuetudinario estadounidense, igual a la doceava parte de un pie. Es la menor de las longitudes
  cotidianas con nombre propio en esos sistemas y la unidad de trabajo de los mecánicos de precisión
  y de las reglas corrientes en Estados Unidos.

  La pulgada mide exactamente 25.4 milímetros, $1\,\mathrm{in}=25.4\,\mathrm{mm}$. El valor se
  deduce de la yarda internacional de 0.9144 metros, de la que la pulgada es la trigésima sexta
  parte, y la publicación especial 811 del NIST da 2.54 centímetros como factor exacto. La ley de
  pesas y medidas de Canadá también define su pulgada como la trigésima sexta parte de la yarda.

  Doce pulgadas forman un pie, treinta y seis una yarda y 63 360 una milla. La pulgada cúbica es la
  pieza básica de las medidas de líquidos estadounidenses, ya que el galón de Estados Unidos se
  define como 231 pulgadas cúbicas.

  El NIST describe dos tradiciones para subdividir la pulgada. Los mecánicos, los fabricantes de
  herramientas y calibres y los científicos la dividen decimalmente en décimas, centésimas y
  milésimas, hasta millonésimas en el trabajo de precisión, mientras que las reglas para medidas
  menos finas llevan fracciones binarias, como medios, cuartos y octavos, rara vez por debajo de un
  sesentaicuatroavo.

  El pie romano se dividía en doce unciae, que el NIST identifica con pulgadas. Cuando Estados
  Unidos fijó la yarda en 0.9144 metros en 1959, el aviso del Federal Register señaló que la
  pulgada de 25.4 milímetros no era nueva: el comité federal de aeronáutica, el NACA, trabajaba con
  ella desde 1952, y la American Standards Association la había respaldado para la conversión
  industrial ya en 1933. El plural del nombre es pulgadas.
