# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Tonelada larga'
description: >-
  La tonelada larga es una unidad de masa igual a 2240 libras avoirdupois. Es la tonelada del
  sistema imperial británico, llamada también tonelada bruta o tonelada del expedidor, y el
  calificativo larga la distingue de la tonelada corta de 2000 libras que se usa en Estados Unidos y
  de la tonelada métrica.

  Con la libra internacional fijada en 1959 en 0.453 592 37 kilogramos, la tonelada larga vale
  exactamente $2240\,\mathrm{lb}=1016.046\,908\,8\,\mathrm{kg}$. La publicación especial 811 del
  NIST la recoge, redondeada, como 1016.047 kilogramos.

  En la tabla británica de masas, la tonelada larga equivale a veinte hundredweight (cwt) largos de 112 libras
  cada uno, o 160 stones. Son 1.12 toneladas cortas y alrededor de un 1.6 por ciento más que una
  tonelada métrica, de modo que las tres toneladas se parecen lo bastante como para confundirse,
  pero difieren lo suficiente como para importar en el comercio a granel.

  El transporte marítimo mantiene viva la unidad. Según el NIST, las estadísticas de carga del
  comercio de ultramar se llevan normalmente en toneladas largas o métricas, rara vez en toneladas
  cortas, y el peso muerto de un buque, la masa conjunta de combustible, pasajeros y carga que
  soporta cuando se hunde hasta el calado más profundo permitido, se da en esas mismas dos unidades. El NIST
  señala además que la tonelada larga es la más usada en Gran Bretaña.

  El nombre refleja el uso estadounidense. En Estados Unidos, tonelada o hundredweight sin calificativo
  significan las unidades cortas de 2000 y 100 libras, por lo que las unidades británicas de 2240 y
  112 libras se llaman largas o brutas. El NIST no da símbolo para la tonelada larga y escribe el
  nombre completo, mientras que el vocabulario QUDT usa t{long}.
