# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Curie'
namePlural: 'curies'
description: >-
  El curie, de símbolo $\mathrm{Ci}$, es una unidad de actividad que no pertenece al SI. Mide el
  ritmo de desintegración radiactiva de una fuente y sigue siendo habitual en Estados Unidos, sobre
  todo en la normativa de salud y seguridad. Un curie es una actividad grande, decenas de miles de
  millones de desintegraciones nucleares por segundo.

  Su valor está fijado en exactamente $3.7\times10^{10}\,\mathrm{Bq}$. En 1964 la 12.ª CGPM, en su
  Resolución 7, admitió que el curie se mantuviera fuera del SI como unidad de actividad con ese
  valor expresado en inversas del segundo, y la publicación especial 811 del NIST da el factor
  como exacto.

  A la inversa, un becquerel equivale a unas 27 billonésimas de curie. Como el curie es tan grande,
  los resultados ambientales suelen darse en picocuries, billonésimas de curie: el radio-226
  natural del agua superficial oscila por lo general entre 0.1 y 0.5 picocuries por litro.

  La guía del SI del NIST desaconseja firmemente el curie, junto con el rad, el rem y el roentgen,
  y pide a quienes aún lo necesiten que den primero el valor en becquerels. La Agencia de
  Protección Ambiental de Estados Unidos describe el curie como, aproximadamente, el número de
  desintegraciones que se producen cada segundo en un gramo de radio.

  La unidad lleva el nombre de los científicos franceses Marie y Pierre Curie. El diccionario de la
  Real Academia Española recoge también la forma curio. Su símbolo es Ci, con C mayúscula.
