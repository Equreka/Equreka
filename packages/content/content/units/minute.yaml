# yaml-language-server: $schema=../../dist/schemas/units.schema.json
name:
  en: 'Minute'
symbol:
  tex: 'min'
unitOf:
  - 'time'
system: 'other'
toBase:
  factor: '60'
  source:
    name: 'SI Brochure (9th ed.)'
    url: 'https://www.bipm.org/en/publications/si-brochure'
    ref: 'Table 8: minute, 1 min = 60 s'
status: 'reviewed'
externalIds:
  wikidata: 'Q7727'
  qudt: 'http://qudt.org/vocab/unit/MIN'
categories:
  - 'universal'
  - 'physics'
branches:
  - 'mechanics'
  - 'measurement'
description:
  en: >-
    The minute is a unit of time usually equal to $1/60$. Historically, the word "minute" comes from
    the Latin <em>pars minuta prima</em>, meaning "first small part". This division of the hour can
    be further refined with a "second small part" (Latin: <em>pars minuta secunda</em>), and this is
    where the word "second" comes from.
references:
  - title: 'Minute'
    url: 'https://en.wikipedia.org/wiki/Minute'
