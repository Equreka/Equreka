description:
  en: >-
    The minute, symbol min, measures time and equals 60 seconds. It is not an SI unit, but the
    SI Brochure lists it in Table 8, with the hour and the day, among the long-standing non-SI units
    of time whose use it expects to continue, and it is the unit of clocks, timetables and everyday
    durations.

    The definition rests entirely on the SI second: $1\,\mathrm{min}=60\,\mathrm{s}$ exactly, as
    given in Table 8 of the SI Brochure and in NIST Special Publication 811. Because the second is
    fixed by the caesium hyperfine frequency, the minute inherits that atomic definition and needs
    no standard of its own.

    Sixty minutes make one hour, and 1440 minutes make one day. A speed in metres per minute or a
    flow in litres per minute converts to SI units by dividing by 60, and a rate per minute such as
    a heart rate of 72 beats per minute equals 1.2 events per second.

    Medicine, sport, cooking, transport and broadcasting count time in minutes, and so do many
    laboratory protocols and the half-lives of short-lived isotopes. On the civil time scale, a
    minute that receives a leap second lasts 61 seconds; NIST notes that such corrections have been
    applied to Coordinated Universal Time since 1972.

    The name comes from the sexagesimal fractions of Greek astronomy: in the Almagest, about AD
    150, Ptolemy split each degree into 60 parts and each part again into 60, and the Latin names
    of the first and second divisions became minute and second. According to the NIST metrologist
    Michael Lombardi, clocks only began to show minutes near the end of the 16th century. The
    symbol min takes no plural ending and no full stop, and the arcminute, a unit of angle, is a
    different unit with the symbol ′.
