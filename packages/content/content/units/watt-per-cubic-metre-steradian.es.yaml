# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Vatio por metro cúbico y estereorradián'
description: >-
  El vatio por metro cúbico y estereorradián, de símbolo $\mathrm{W/(m^{3}\,sr)}$, es la unidad SI
  coherente de la radiancia espectral por unidad de longitud de onda: la potencia que emite una
  superficie por metro cuadrado de su área, por estereorradián de ángulo sólido y por metro de
  intervalo de longitud de onda. Pertenece a la radiometría y a la física de la radiación térmica, y
  no tiene nombre especial.

  La unidad es el vatio dividido entre el cubo del metro y entre el estereorradián, y se deduce de
  las definiciones de esas tres unidades. Dos de los tres metros proceden
  del área emisora y el tercero de la anchura de la banda de longitudes de onda, y por eso QUDT
  registra la misma unidad como vatio por metro cuadrado, metro y estereorradián, con un factor de
  conversión igual a uno.

  La ley de radiación de Planck da la radiancia espectral de un cuerpo negro en esta unidad: el NIST
  recoge la primera constante de radiación para la radiancia espectral, el doble de la constante de
  Planck por el cuadrado de la velocidad de la luz, en vatio metro cuadrado por estereorradián, y al
  dividirla entre la quinta potencia de la longitud de onda quedan vatios por metro cúbico y
  estereorradián. Multiplicar por pi estereorradianes convierte una radiancia en la potencia emitida
  por unidad de área y de longitud de onda que representa OpenStax, en vatios por metro cúbico.

  Los valores son grandes porque un metro es un intervalo de longitud de onda enorme: un cuerpo negro a
  6000 kelvin alcanza unos $3.03\times10^{13}$ de esta unidad a 560 nanómetros. Por eso los espectros
  suelen representarse por metro cuadrado, estereorradián y nanómetro o micrómetro, unidades mil
  millones y un millón de veces mayores que mantienen pequeños los números; QUDT las incluye en su
  magnitud de radiancia espectral. En inglés estadounidense el nombre cambia metre por meter, y el
  plural en español es vatios por metro cúbico y estereorradián.
