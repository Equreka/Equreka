# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Lux'
namePlural: 'lux'
description: >-
  El lux, de símbolo lx, es la unidad SI derivada coherente de iluminancia, el flujo luminoso que
  incide sobre una superficie por unidad de área. Es una de las 22 unidades SI con nombre especial
  y, como la candela y el lumen, contiene información sobre la visión humana, porque la luz que
  cuenta está ponderada por la sensibilidad del ojo.

  Un lux es un lumen repartido uniformemente sobre un metro cuadrado:
  $1\,\mathrm{lx}=1\,\mathrm{lm/m^{2}}=1\,\mathrm{cd\,sr\,m^{-2}}$, la expresión que da el folleto
  del SI en su tabla 4. Una fuente pequeña de una candela produce un lux sobre una superficie
  situada a un metro y orientada hacia ella, y la iluminancia disminuye con el cuadrado de la
  distancia.

  La publicación especial 811 del NIST convierte el phot del sistema CGS en exactamente $10^{4}$
  lux y la bujía-pie, un lumen por pie cuadrado, en unos 10.763 91 lux, de modo que un lux es
  aproximadamente 0.0929 bujías-pie. El lux se diferencia del lumen solo por el área: una lámpara
  que emite 1000 lúmenes repartidos por igual sobre dos metros cuadrados produce 500 lux.

  Las exigencias de alumbrado se expresan en lux, y la mayoría de los fotómetros lo miden
  directamente. La Health and Safety Executive del Reino Unido recomienda iluminancias medias de
  unos 20 lux para pasillos y vías de vehículos, 200 lux para oficinas y 500 lux para trabajos con
  detalle fino, como el dibujo o el montaje de componentes electrónicos.

  La 9.ª Conferencia General de Pesas y Medidas incluyó el símbolo lx en la lista de símbolos de
  unidades que adoptó en 1948, y el lux figuraba entre las unidades derivadas enumeradas cuando la
  11.ª Conferencia fundó el Sistema Internacional de Unidades en 1960. El nombre es invariable en
  plural, y el símbolo lx nunca se escribe con mayúscula.
