description:
  en: >-
    The lumen, symbol $\mathrm{lm}$, is the coherent SI derived unit of luminous flux, the power of
    radiation weighted by the spectral sensitivity of human vision. One lumen is the luminous flux
    that a point source of one candela sends uniformly into a solid angle of one steradian, so the
    lumen equals the candela steradian.

    The CIE defines luminous flux as the rate of transfer of luminous energy and obtains it from
    radiant flux by weighting each wavelength according to its effect on the CIE standard
    photometric observer. The SI ties this weighting to physics through a defining constant: the
    luminous efficacy fixed for monochromatic radiation at 540 terahertz is exactly
    $683\,\mathrm{lm/W}$. One watt of radiation at that frequency therefore carries 683 lumens,
    whereas the same watt at wavelengths the eye barely sees yields far fewer.

    The SI Brochure notes that the lumen, the lux and the candela carry information about human
    vision. Illuminance, the luminous flux falling on a surface per
    unit area, is measured in lux, the lux being the lumen per square metre. In photometry the
    steradian is usually kept in written expressions, so the lumen appears as cd sr rather than as
    the candela alone.

    Lamp output is stated in lumens: a typical 100-watt incandescent bulb gives about 1700 lumens.

    The CIPM defined a new lumen in 1946 as the flux emitted into one steradian by a uniform point
    source of one new candle; the qualifier new was later dropped. The 16th CGPM in 1979 redefined
    the candela through the value of 683 lumens per watt, which the 2018 revision kept as an exact
    defining constant. The plural is lumens.
