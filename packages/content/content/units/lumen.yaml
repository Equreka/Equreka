# yaml-language-server: $schema=../../dist/schemas/units.schema.json
name:
  en: 'Lumen'
symbol:
  tex: 'lm'
unitOf:
  - 'luminous-flux'
system: 'si-derived'
compose:
  of:
    - unit: 'candela'
      exp: 1
    - unit: 'steradian'
      exp: 1
externalIds:
  wikidata: 'Q484092'
  qudt: 'http://qudt.org/vocab/unit/LM'
categories:
  - 'physics'
branches:
  - 'optics-and-photometry'
description:
  en: >-
    The lumen (symbol: $lm$) is the SI derived unit of luminous flux, a measure of the total
    quantity of visible light emitted by a source per unit of time. Luminous flux differs from power
    (radiant flux) in that radiant flux includes all electromagnetic waves emitted, while luminous
    flux is weighted according to a model (a "luminosity function") of the human eye's sensitivity
    to various wavelengths. Lumens are related to lux in that one lux is one lumen per square metre.
textSources:
  - title: 'Wikipedia: Lumen (unit)'
    url: 'https://en.wikipedia.org/wiki/Lumen_(unit)'
    license: 'CC-BY-SA-4.0'
