# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Centímetro'
description: >-
  El centímetro, de símbolo $\mathrm{cm}$, es una unidad de longitud igual a la centésima parte de
  un metro, formada con el prefijo SI centi. Conviene a las longitudes a la escala del cuerpo humano
  y de los objetos que se sostienen en la mano, y fue la unidad básica de longitud del sistema
  centímetro-gramo-segundo (CGS) de la física.

  La relación $1\,\mathrm{cm}=10^{-2}\,\mathrm{m}$ es exacta, así que el centímetro sigue la
  definición del metro basada en la velocidad de la luz. Según las reglas del SI, el prefijo y la
  unidad forman un solo símbolo, y una potencia afecta a ambos: un centímetro cuadrado es la
  diezmilésima parte de un metro cuadrado y un centímetro cúbico la millonésima parte de un metro
  cúbico. La publicación especial 811 del NIST fija la pulgada internacional en exactamente 2.54
  centímetros.

  La Asociación Británica para el Avance de la Ciencia (BAAS) introdujo el sistema CGS en 1874, y
  varias de sus unidades siguen definiéndose a partir del centímetro. El gal, que la geodesia y la
  geofísica emplean para la aceleración de la gravedad, es un centímetro por segundo al cuadrado, y
  la dina y el ergio, las unidades CGS de fuerza y de energía, se basan en el centímetro y el gramo.
  En espectroscopia los números de ondas se dan en centímetros a la menos uno, y cada uno equivale a
  100 metros a la menos uno.

  Las reglas, las cintas métricas, las tallas de ropa y las medidas corporales suelen graduarse en
  centímetros. En inglés estadounidense el nombre se escribe centimeter. El símbolo cm no lleva s de
  plural ni punto.
