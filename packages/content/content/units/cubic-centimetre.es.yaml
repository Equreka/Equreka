# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Centímetro cúbico'
description: >-
  El centímetro cúbico, de símbolo $\mathrm{cm^{3}}$, es una unidad de volumen igual al volumen de un
  cubo cuyas aristas miden un centímetro. Es un submúltiplo decimal del metro cúbico, la unidad SI
  coherente de volumen, y fue la unidad de volumen del sistema centímetro-gramo-segundo.

  Según las reglas del SI, un prefijo forma con su unidad un símbolo inseparable, de modo que el
  exponente afecta a toda la unidad con prefijo: un centímetro cúbico es el cubo de una centésima de
  metro, $1\,\mathrm{cm^{3}}=10^{-6}\,\mathrm{m^{3}}$ exactamente. La publicación especial 811 del
  NIST desarrolla este caso como ejemplo de la regla.

  Un litro contiene 1000 centímetros cúbicos, y un mililitro equivale exactamente a un centímetro
  cúbico. Esa igualdad data de 1964, cuando la 12.ª CGPM convirtió el litro en un nombre especial
  del decímetro cúbico. La definición de 1901 había ligado el litro al volumen de un kilogramo de
  agua, que difería del decímetro cúbico en unas 28 partes por millón.

  La unidad conviene a los volúmenes pequeños de laboratorio y a los volúmenes de muestras sólidas, y
  forma parte del gramo por centímetro cúbico, la unidad habitual de la densidad de líquidos y
  sólidos. Es numéricamente intercambiable con el mililitro, aunque las dos siguen siendo unidades
  distintas por su nombre: una se forma a partir del metro y la otra a partir del litro.

  La abreviatura cc sigue siendo frecuente en el habla cotidiana, pero el folleto del SI y el NIST la
  prohíben como símbolo del centímetro cúbico y exigen cm³. En inglés estadounidense el nombre se
  escribe cubic centimeter, y el plural es centímetros cúbicos.
