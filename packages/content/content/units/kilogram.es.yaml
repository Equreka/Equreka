# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Kilogramo'
description: >-
  El kilogramo, de símbolo $\mathrm{kg}$, es la unidad básica SI de masa, una de las siete del
  Sistema Internacional de Unidades. La masa expresa cuánto se opone un cuerpo a los cambios de su
  movimiento y con qué intensidad interviene en la gravitación, y el kilogramo la mide en el
  comercio, la ingeniería, la medicina y la ciencia. En el habla cotidiana se abrevia como kilo.

  La definición actual, adoptada en 2018 por la CGPM (Conferencia General de Pesas y Medidas) en su
  26.ª reunión, está vigente desde el 20 de mayo de 2019 y fija la constante de Planck en
  exactamente $h=6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$. Como el julio segundo equivale al
  kilogramo metro cuadrado por segundo, y el metro y el segundo ya dependen de la velocidad de la
  luz y de la frecuencia del cesio, ese valor fijo determina el kilogramo. Las realizaciones
  primarias ya no están ligadas a un kilogramo y pueden, en principio, partir de cualquier masa.

  Un legado de su historia distingue al kilogramo: entre las unidades SI coherentes, solo él lleva
  un prefijo tanto en el nombre como en el símbolo. Por eso los múltiplos y submúltiplos decimales
  se forman a partir del gramo, que es la milésima parte de un kilogramo: la millonésima parte de un
  kilogramo es un miligramo, nunca un microkilogramo. La tonelada, unidad aceptada para su uso con
  el SI, equivale a $1000\,\mathrm{kg}$.

  Entre 1889 y 2019 el kilogramo fue la masa de un único artefacto, el prototipo internacional, un
  cilindro de platino iridiado fundido en 1879 y guardado en una cámara acorazada de Sèvres, cerca
  de París, por el BIPM, la Oficina Internacional de Pesas y Medidas. La 3.ª CGPM confirmó en 1901 que
  era la unidad de masa y declaró que el peso es una fuerza. Las verificaciones periódicas mostraron
  que las copias nacionales se alejaban del prototipo, con una diferencia mediana de unos 25
  microgramos hacia 1989-1991, lo que condujo a definirlo mediante una constante de la naturaleza.
  El plural es kilogramos.
