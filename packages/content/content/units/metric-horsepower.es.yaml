# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Caballo de vapor'
description: >-
  El caballo de vapor es una unidad de potencia del antiguo sistema métrico gravitatorio, conocida
  en alemán como Pferdestärke, de símbolo PS, en francés como cheval-vapeur y en español como
  caballo de vapor, de símbolo CV. Es la potencia que eleva una masa de 75 kilogramos un metro en
  cada segundo bajo la aceleración normal de la gravedad, es decir, 75 veces el kilogramo fuerza metro por segundo.

  Como el kilogramo fuerza equivale exactamente a 9.806 65 newtons, la definición da
  $1\,\mathrm{PS}=735.498\,75\,\mathrm{W}$ exactamente. La publicación especial 811 del NIST
  imprime el factor redondeado a 735.4988 vatios en su apéndice B.8, y QUDT recoge el valor
  completo.

  El caballo de vapor es algo menor que el caballo de fuerza mecánico de 550 veces el pie libra
  fuerza por segundo: un caballo de vapor equivale a unos 0.986 32 caballos de fuerza mecánicos,
  de modo que ambos difieren en un 1.4 por ciento aproximadamente. Un kilovatio equivale a unos
  1.36 caballos de vapor.

  La unidad no forma parte del SI, que expresa la potencia en vatios y kilovatios. Fuera de
  Estados Unidos, la palabra inglesa horsepower se usa a menudo para esta unidad y no para la
  mecánica, según el diccionario de unidades de Rowlett, por lo que una potencia en caballos debe
  indicar a cuál de las dos se refiere.

  Su valor exacto se apoya en la gravedad normal, 9.806 65 metros por segundo al
  cuadrado, que la 3.ª Conferencia General de Pesas y Medidas adoptó en 1901 al declarar que el
  peso es una fuerza. Los símbolos nacionales PS y CV designan esta misma unidad, y ninguno de los
  dos es un símbolo del SI.
