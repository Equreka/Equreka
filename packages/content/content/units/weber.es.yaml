# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Weber'
description: >-
  El weber, de símbolo $\mathrm{Wb}$, es la unidad SI derivada coherente de flujo magnético, la
  cantidad de campo magnético que atraviesa una superficie. Forma parte de las 22 unidades del
  Sistema Internacional que tienen nombre especial, y en unidades básicas del SI es el kilogramo
  metro cuadrado por segundo al cuadrado y por amperio.

  El folleto del SI incluye el weber en su tabla de unidades con nombre especial y lo expresa en
  otras unidades SI como el voltio segundo. La definición que adoptó el CIPM en 1946 enuncia la
  misma relación con palabras: en un circuito de una sola espira se induce una fuerza
  electromotriz de un voltio cuando el flujo que lo atraviesa, partiendo de un weber, disminuye de
  forma constante y se anula al cabo de un segundo.

  Un weber es también un tesla metro cuadrado, de modo que un campo uniforme de un tesla que
  atraviesa perpendicularmente un metro cuadrado da un flujo de un weber; el propio tesla es el
  weber por metro cuadrado y el henrio, el weber por amperio. El maxwell, la unidad CGS
  correspondiente, equivale exactamente a $10^{-8}\,\mathrm{Wb}$.

  El weber aparece siempre que se calcula una inducción, como en el diseño de transformadores y
  generadores, y es la unidad que leen los fluxómetros, los instrumentos que miden el flujo
  magnético. En una bobina de varias espiras, el flujo total a través del circuito, el flujo por
  una espira multiplicado por el número de espiras, también tiene por unidad el weber.

  La unidad lleva el nombre del físico alemán Wilhelm Weber, nacido en 1804, que trabajó con Carl
  Friedrich Gauss en medidas absolutas del magnetismo y la electricidad. La 11.ª CGPM incluyó el
  weber, con el símbolo $\mathrm{Wb}$, entre las unidades derivadas del SI en 1960. Como nombre de
  unidad se escribe en minúscula, mientras que su símbolo empieza por mayúscula.
