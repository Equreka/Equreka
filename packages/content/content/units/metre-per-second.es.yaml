# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Metro por segundo'
description: >-
  El metro por segundo, de símbolo $\mathrm{m/s}$, es la unidad SI derivada coherente de rapidez y
  de velocidad en mecánica: un cuerpo que se mueve a un metro por segundo recorre un metro de
  distancia en cada segundo. Une dos unidades básicas del SI, el metro y el segundo, y mide toda
  tasa de cambio de la posición.

  La 11.ª CGPM incluyó el metro por segundo entre las unidades derivadas del nuevo Sistema
  Internacional en 1960, y el folleto del SI lo recoge en su tabla de unidades derivadas expresadas
  en unidades básicas. El vínculo funciona en ambos sentidos, pues el propio metro se define hoy
  fijando la velocidad de la luz en el vacío en exactamente $299\,792\,458\,\mathrm{m/s}$.

  Otras unidades de rapidez se convierten con factores exactos. Un kilómetro por hora son mil
  metros en 3600 segundos, de modo que equivale a $5/18$ de metro por segundo, y el folleto del SI
  da el nudo como $1852/3600$ de metro por segundo. El propio folleto escribe una misma rapidez de
  las dos formas, como 25 metros por segundo o 90 kilómetros por hora.

  La física y la ingeniería dan en esta unidad la rapidez del sonido, del viento, de los vehículos
  y de las partículas: OpenStax da para el sonido en el aire 331 metros por segundo a 0 grados
  Celsius y 343 metros por segundo a 20 grados Celsius. La rapidez es un escalar y la velocidad un
  vector, pero ambas usan la misma unidad; una velocidad indica además una dirección.

  El símbolo puede escribirse también con exponente negativo en el segundo, y el plural es metros
  por segundo; en inglés estadounidense la unidad se escribe meter per second. El folleto del SI
  rechaza abreviaturas como mps en lugar del símbolo.
