description:
  en: >-
    The litre squared bar per mole squared, symbol $\mathrm{L^{2}\,bar/mol^{2}}$, is the unit in
    which reference tables give the van der Waals constant a, the measure of how strongly the
    molecules of a real gas attract one another. It lies outside the SI because both the litre and
    the bar are non-SI units, although each is defined exactly in SI terms.

    The unit is the square of the litre multiplied by the bar and divided by the square of the
    mole. The SI Brochure sets the litre equal to the cubic decimetre, a thousandth of a cubic
    metre, and NIST gives the bar as exactly one hundred thousand pascals. The square of the litre
    contributes a millionth of the sixth power of the metre, so one litre squared bar per mole
    squared equals exactly 0.1 pascal cubic metre squared per mole squared, the coherent SI unit of
    the constant.

    LibreTexts tabulates a in this unit with b in litres per mole, and notes that multiplying by
    0.986 converts a value to the litre squared atmosphere per mole squared that OpenStax and other
    general chemistry texts print. Because the bar and the standard atmosphere differ by little
    more than one percent, values in the two units look alike, and the unit must be checked before
    a constant is used.

    Carbon dioxide has a = 3.658 in this unit, nitrogen 1.370, water 5.537 and helium 0.0346. The
    sixth power of the decimetre is the same thing as the square of the litre, so the unit is also
    written as the bar cubic decimetre squared per mole squared. Wikidata files it as the square
    litre bar per square mole, and the name is spelled liter squared bar per mole squared in
    American English.
