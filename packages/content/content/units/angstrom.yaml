description:
  en: >-
    The ångström, symbol Å, is a unit of length equal to one ten-billionth of a metre, a tenth of a
    nanometre. It lies outside the International System of Units but is listed in the SI Brochure
    among the non-SI units in wide use, because it matches the scale of atoms: chemists and
    physicists use it for the lengths of chemical bonds and for the sizes of atoms and molecules.

    The definition is a power of ten of the metre, $1\,\mathrm{\mathring{A}}=10^{-10}\,\mathrm{m}$,
    exact by construction, and NIST Special Publication 811 lists the factor as exact. The NIST
    guide counts the ångström among the units that the CIPM in 1978 allowed to continue in the
    fields that already relied on them, while discouraging any wider use.

    Ten ångströms make one nanometre, so converting between the two only moves the decimal point.
    The SI Brochure also names wavelengths among its uses, and NIST advises that a value in
    ångströms, for instance a visible laser wavelength, is best converted to nanometres rather than
    to metres, which keeps the numbers of a convenient size.

    The unit honours the Swedish physicist Anders Jonas Ångström of Uppsala University, one of the
    founders of spectroscopy, who introduced a unit for the wavelengths of light that was later
    adopted internationally under his name; his study of the solar spectrum, published in 1868,
    long served as a standard text in the field. The SI Brochure spells
    the name angstrom without diacritics, while NIST and most physics texts keep the Swedish
    letters; the symbol is always the capital Å, with its ring, and it takes no plural ending.
