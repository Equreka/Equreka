description:
  en: >-
    The imperial pint, written pt or imp pt, is a unit of volume of the British imperial system;
    eight of them make an imperial gallon. It is the pint of British draught beer and cider and
    of milk in returnable containers, among the few goods that United Kingdom law still allows to be
    sold by an imperial measure alone.

    With the imperial gallon fixed at exactly 4.546 09 litres, the pint is exactly
    $568.261\,25\,\mathrm{mL}$, a little more than half a litre. Canada's Weights and Measures Act
    defines its pint in the same way, as one eighth of the gallon.

    Two pints make a quart, and a pint divides into four gills or twenty imperial fluid ounces. The
    U.S. liquid pint holds 16 U.S. fluid ounces, each slightly larger than the imperial one, for a
    total of about 473.18 millilitres, so the imperial pint is about one fifth larger.

    British government guidance explains that traders may show imperial figures alongside metric
    ones on any product, provided the metric figure is the more prominent. Draught beer, draught
    cider and milk in returnable containers are the exceptions that may be sold by the pint with no
    metric figure at all, together with precious metals sold by the troy ounce.

    The pint shares the history of the imperial gallon, which Britain adopted in 1824 in place of
    the older wine and ale gallons, so the British and American pints have differed ever since. The
    symbol pt serves both, which is why imp pt is written when the two could be confused; QUDT
    labels this unit Pint (UK).
