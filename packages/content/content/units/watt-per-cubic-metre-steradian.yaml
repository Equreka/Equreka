description:
  en: >-
    The watt per cubic metre steradian, symbol $\mathrm{W/(m^{3}\,sr)}$, is the coherent SI unit of
    spectral radiance per unit wavelength: the power a surface emits per square metre of its area,
    per steradian of solid angle and per metre of wavelength interval. It belongs to radiometry and
    the physics of thermal radiation, and has no special name.

    The unit is the watt divided by the cube of the metre and by the steradian, so it follows from
    the definitions of the watt, the metre and the steradian. Two of the three metres come from the
    emitting area and the third from the width of the wavelength band, which is why QUDT records
    the same unit as the watt per square metre metre steradian, with a conversion factor of one.

    Planck's radiation law gives the spectral radiance of a black body in this unit: NIST lists the
    first radiation constant for spectral radiance, twice the Planck constant times the square of
    the speed of light, in watt square metres per steradian, and dividing it by the fifth power of
    the wavelength leaves watts per cubic metre and steradian. Multiplying by pi steradians turns a
    radiance into the emitted power per area and wavelength that OpenStax plots, in watts per
    cubic metre.

    Values are large because a metre is an enormous wavelength interval: a black body at
    6000 kelvin reaches about $3.03\times10^{13}$ of this unit at 560 nanometres. Spectra are
    therefore often drawn per square metre, steradian and nanometre or micrometre, units one
    billion and one million times larger that keep the numbers small; QUDT lists them under its
    spectral radiance kind. The name is spelled watt per cubic
    meter steradian in American English, and the plural is watts per cubic metre steradian.
