description:
  en: >-
    The candela, symbol $\mathrm{cd}$, is the SI base unit of luminous intensity: the power that a
    light source sends in one direction per unit solid angle, weighted by how sensitive the human
    eye is to each wavelength. It is the only SI base unit that rests on human vision.

    The definition sets at exactly $K_{\mathrm{cd}}=683\,\mathrm{lm/W}$ the luminous efficacy of
    single-frequency light at $540\times10^{12}\,\mathrm{Hz}$, a green near the peak of daylight
    vision, with the watt tied to the kilogram, the metre and the second. In practice, a green source whose radiant intensity in some direction is one 683rd of a
    watt per steradian has there a luminous intensity of one candela. For other colours and for white light, a
    standard visual response curve weights each wavelength.

    The lumen, unit of luminous flux, equals one candela steradian, so a one-candela source shining equally in every direction emits
    one lumen per steradian over the full $4\pi\,\mathrm{sr}$. Luminance is expressed in candelas per square
    metre, and illuminance in lux, or lumens per square metre.

    Lamp packaging usually states lumens, the total light output, whereas the candela describes how
    bright a source looks from a given direction. NIST notes that the 1979 definition allowed the
    unit to be realized with calibrated photodetectors instead of lamps, and that its measurement
    uncertainty is still no better than about one part in a thousand.

    The name is the Latin word for candle. Flame and filament standards gave way to the new candle,
    based on a black body at the freezing temperature of platinum, which the CIPM promulgated in
    1946 and the 9th CGPM named the candela in 1948. The 10th CGPM made it a base unit in 1954, and
    the 16th CGPM replaced the black body with monochromatic radiation in 1979. The plural is
    candelas.
