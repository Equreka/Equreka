# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Voltio por metro'
description: >-
  El voltio por metro, de símbolo $\mathrm{V/m}$, es la unidad SI derivada coherente de intensidad
  de campo eléctrico. Se forma dividiendo el voltio, la unidad de diferencia de potencial eléctrico,
  entre el metro, y en unidades básicas del SI es el kilogramo metro por segundo al cubo y por
  amperio. No tiene nombre especial propio.

  El folleto del SI recoge el voltio por metro en su tabla de unidades derivadas coherentes cuyos
  nombres incluyen unidades con nombre especial, como unidad de intensidad de campo eléctrico, y la
  11.ª CGPM ya lo nombró entre las unidades derivadas del SI en 1960. Un campo uniforme de un
  voltio por metro es aquel en el que el potencial eléctrico cambia un voltio por cada metro
  recorrido a lo largo del campo.

  El voltio por metro es idéntico al newton por culombio, la forma que se deduce de definir el
  campo como fuerza por unidad de carga: un voltio es un julio por culombio, y un julio dividido
  entre un metro es un newton. Los campos intensos suelen escribirse con prefijos, y un megavoltio
  por metro equivale a un kilovoltio por milímetro.

  Los valores típicos abarcan un intervalo amplio. Con buen tiempo, la atmósfera cerca del suelo
  presenta de 100 a 300 voltios por metro, y el campo bajo una tormenta llega a miles. Las
  rigideces dieléctricas de los aislantes se tabulan en megavoltios por metro: el aire seco se
  perfora hacia 3.0, el papel a 16 y la mica a 118.

  El símbolo puede escribirse como cociente, $\mathrm{V/m}$, o como producto con exponente
  negativo, $\mathrm{V\,m^{-1}}$; ambas formas se admiten según las reglas del SI para combinar
  símbolos de unidades. El plural es voltios por metro.
