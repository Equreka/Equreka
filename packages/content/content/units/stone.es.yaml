# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Stone'
description: >-
  El stone, de símbolo st, es una unidad de masa del sistema imperial británico igual a 14 libras
  avoirdupois. En el Reino Unido sigue siendo la unidad habitual para el peso corporal de las
  personas, mientras que no forma parte del sistema consuetudinario estadounidense.

  Como la libra avoirdupois vale exactamente 0.453 592 37 kilogramos desde 1959, el stone queda
  fijado en $14\,\mathrm{lb}=6.350\,293\,18\,\mathrm{kg}$ exactos. Las tablas británicas que
  reproduce el manual 44 del NIST dan la misma definición de catorce libras.

  Por encima de la libra, la tabla avoirdupois británica se construye sobre el stone: dos stones
  forman un quarter de 28 libras, cuatro quarters forman un hundredweight (cwt) de 112 libras y
  veinte hundredweight forman una tonelada de 2240 libras, de modo que la tonelada larga británica contiene 160
  stones. Un kilogramo equivale a unos 0.157 stones.

  De entre el quarter, el hundredweight, el stone y la tonelada, el NIST considera el stone la única
  que sigue en el uso personal cotidiano, para el peso corporal. Su huella en Estados Unidos fue
  indirecta: los barriles de harina estadounidenses contenían 196 libras, exactamente 14 stones, una
  práctica comercial que duró hasta la Segunda Guerra Mundial.

  El stone de 14 libras no fue el primero: el NIST recoge indicios de una versión anterior de 16
  libras. Las tablas del NIST escriben el plural inglés como stones y también
  como stone, y el vocabulario QUDT denomina la unidad Stone (UK).
