# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Milla por hora'
description: >-
  La milla por hora, abreviada mph, es una unidad de rapidez y de velocidad igual a una distancia de
  una milla internacional recorrida en una hora. Pertenece a los sistemas imperial y usual
  estadounidense y no al SI, y es la unidad cotidiana de la rapidez en carretera en los países que
  miden las distancias viales en millas.

  Su valor se deduce de sus partes. La milla internacional mide exactamente 1609.344 metros y la
  hora dura exactamente 3600 segundos, así que una milla por hora equivale exactamente a 0.447 04
  metros por segundo, un factor que NIST SP 811 marca como exacto. También equivale exactamente a
  1.609 344 kilómetros por hora.

  En sentido inverso, un metro por segundo son unas 2.237 millas por hora, y un kilómetro por hora,
  unas 0.6214 millas por hora. Un nudo, una milla náutica por hora, equivale a unas 1.151 millas por
  hora, porque la milla náutica es más larga que la milla internacional. Una caminata enérgica va a
  unas 3.8 millas por hora y el sonido en el aire al nivel del mar, a unas 767 millas por hora.

  La unidad aparece en las señales de límite de velocidad, los velocímetros y las fichas técnicas de
  los vehículos allí donde la milla sigue siendo la unidad vial, y en las crónicas deportivas para la
  rapidez de una pelota lanzada o servida. La ciencia y la ingeniería suelen convertirla a metros
  por segundo.

  La abreviatura habitual mph no es un símbolo de unidad formal; NIST SP 811 escribe mi/h, y también
  aparece mi/hr. Los valores distintos de uno se leen en plural, millas por hora, y la unidad nunca
  se escribe m/h, que significaría metros por hora.
