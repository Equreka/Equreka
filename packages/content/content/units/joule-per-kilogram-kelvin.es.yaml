# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Julio por kilogramo y kelvin'
description: >-
  El julio por kilogramo y kelvin, de símbolo $\mathrm{J/(kg\,K)}$, es la unidad SI derivada
  coherente de la capacidad calorífica específica, el calor necesario por unidad de masa de un
  material por cada kelvin de aumento de temperatura. El folleto del SI indica la misma unidad para
  la entropía específica. Se forma dividiendo el julio entre el kilogramo y entre el kelvin, y no
  tiene nombre especial.

  Un material tiene una capacidad calorífica específica de un julio por kilogramo y kelvin cuando un
  julio de calor eleva un kelvin la temperatura de un kilogramo de ese material. Expresada en
  unidades básicas del SI, la unidad es el metro cuadrado por segundo al cuadrado y kelvin, porque
  el kilogramo contenido en el julio cancela el kilogramo del denominador.

  Un kelvin y un grado Celsius son iguales como intervalos de temperatura, así que un valor en
  julios por kilogramo y grado Celsius es el mismo número. La publicación especial 811 del NIST convierte con exactitud
  las unidades antiguas basadas en la caloría: una caloría termoquímica por gramo y kelvin equivale
  a 4184 de estas unidades, mientras que una caloría de la tabla internacional por gramo y kelvin, y
  también una unidad térmica británica de la tabla internacional por libra y grado Fahrenheit,
  equivale a $4186.8\,\mathrm{J/(kg\,K)}$.

  Las tablas de propiedades de materiales emplean esta unidad en toda la ciencia y la ingeniería, a
  menudo en su múltiplo, el kilojulio por kilogramo y kelvin. El agua líquida fresca tiene una
  capacidad calorífica específica de unos 4186 julios por kilogramo y kelvin, una de las más altas
  de las sustancias comunes.

  Las reglas del SI permiten escribir el símbolo con paréntesis, como $\mathrm{J/(kg\,K)}$, o con
  exponentes negativos; una segunda barra oblicua sin paréntesis, como en J/kg/K, es ambigua y no
  está permitida. El plural es julios por kilogramo y kelvin.
