description:
  en: >-
    The decade is a unit of time of ten years, outside the SI. For conversions it is taken as ten
    common years of 365 days, the same convention applied to the year and the century. It
    measures trends and long periods in climate, demography and history.

    No standard defines the decade as a unit. Ten times the 365-day year, which NIST Special
    Publication 811 tabulates as 31 536 000 seconds, gives 315 360 000 seconds, or 3650 days.

    A real span of ten consecutive calendar years is a little longer. Under the Gregorian rule a
    year divisible by four is a leap year unless it is a century year not divisible by 400, so
    ten years contain one to three leap days and last from 3651 to 3653 days. Ten decades make a
    century.

    The word also labels groups of calendar years by their tens digit, as in the 1990s, the years
    1990 to 1999. In the frequency response of amplifiers and filters the same word, with the same
    abbreviation dec, names something else: a frequency ratio of ten, which QUDT lists as a
    logarithmic unit.
    Context decides which is meant, and a time in decades is converted to seconds before it
    enters a formula.
