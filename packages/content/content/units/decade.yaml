# yaml-language-server: $schema=../../dist/schemas/units.schema.json
name:
  en: 'Decade'
symbol:
  tex: 'dec'
unitOf:
  - 'time'
system: 'other'
toBase:
  factor: '315360000'
  exact: false
  source:
    name: 'convention'
    ref: '1 decade = 10 common years of 365 d'
status: 'reviewed'
categories:
  - 'universal'
  - 'physics'
description:
  en: >-
    A decade is a period of 10 years. The word is derived (via French and Latin) from the Ancient
    Greek: δεκάς, romanized: dekas, which means a group of ten. Decades may describe any ten-year
    period, such as those of a person's life, or refer to specific groupings of calendar years.
