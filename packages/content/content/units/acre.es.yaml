# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Acre'
description: >-
  El acre, de símbolo ac, es una unidad de superficie de los sistemas consuetudinario
  estadounidense e imperial británico que se usa sobre todo para terrenos: las fincas, los solares
  y los parques de Estados Unidos se miden en acres. No pertenece al Sistema Internacional de
  Unidades ni a las unidades aceptadas para su uso con él.

  El NIST define el acre a partir del pie, como exactamente cuarenta y tres mil quinientos sesenta
  pies cuadrados, lo que con el pie internacional da
  $1\,\mathrm{ac}=43\,560\,\mathrm{ft^{2}}=4046.856\,422\,4\,\mathrm{m^{2}}$ exactos. La misma tabla
  del NIST lo relaciona con las antiguas unidades de agrimensura: diez cadenas cuadradas forman un
  acre, y seiscientos cuarenta acres forman una milla cuadrada.

  Un acre es algo más de cuatro décimas de hectárea, y una hectárea se acerca a dos acres y medio.
  Como el acre se define por su área y no por su forma, un acre de terreno puede ser una franja
  larga o un cuadrado; un acre de forma cuadrada mide algo menos de sesenta y cuatro metros de lado.

  Hasta finales de 2022, los terrenos de Estados Unidos se medían con el pie topográfico
  estadounidense, algo más largo que el pie internacional, y el acre basado en él valía
  $4046.872\,609\,874\,\mathrm{m^{2}}$. El NIST declaró obsoleto ese pie desde el 1 de enero de
  2023, salvo para trabajos históricos y heredados, de modo que ahora rige un único acre. La
  publicación especial 811 del NIST todavía recoge el acre del pie topográfico en su apéndice de
  conversiones. El NIST escribe el símbolo ac, que no lleva marca de plural, aunque muchos textos
  escriben el nombre completo.
