description:
  en: >-
    The metre, symbol $\mathrm{m}$, is the SI base unit of length, the unit from which the
    International System of Units builds every measure of distance. It measures distances of every
    scale and derived lengths such as the wavelength of light. Every other SI unit of length, from
    the nanometre to the kilometre, is a decimal multiple or submultiple of it.

    The definition in force since 2019, written in the SI Brochure, sets the speed of light in
    vacuum to exactly $299\,792\,458\,\mathrm{m/s}$. One metre is therefore the distance light
    crosses in empty space in one 299 792 458th of a second, a little over three nanoseconds, so its
    realization rests on the caesium definition of the second.

    Customary length units are now fixed through the metre. NIST Special Publication 811 lists the
    international inch as exactly $0.0254\,\mathrm{m}$ and the foot as exactly 0.3048 metre, so
    every inch, foot, yard and mile in commerce traces back to the SI unit.

    The metre and its prefixed forms serve for road distances, building plans, machining tolerances
    and nearly all scientific work. Metrology laboratories realize it with frequency-stabilized
    lasers and interferometers.

    The unit was born in revolutionary France. A commission of the French Academy of Sciences
    proposed in 1791 that it equal a ten-millionth part of the meridian arc between the North Pole
    and the equator, and the astronomers Méchain and Delambre surveyed the meridian arc from Dunkirk
    to Barcelona from 1792. The 1st CGPM sanctioned a platinum-iridium prototype bar in 1889, the
    11th CGPM replaced it in 1960 with a count of wavelengths of a krypton-86 line, and the 17th
    CGPM adopted the definition based on light in 1983. The name comes from the Greek metron,
    measure; American English spells it meter, and the plural is metres.
