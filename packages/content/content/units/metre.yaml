description:
  en: >-
    The $metre$ (International spelling) or $meter$ (American spelling; see spelling differences)
    (from the French unit mètre, from the Greek noun μέτρον, "measure") is the base unit of length
    in the International System of Units (SI). The SI unit symbol is $m$. It's the distance
    travelled by light in vacuum in $\frac{1}{299792458}$ second.
