# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Metro recíproco'
description: >-
  El metro recíproco, de símbolo $\mathrm{m^{-1}}$, llamado también inverso del metro o por metro,
  es la unidad SI coherente de las magnitudes que cuentan o cambian por unidad de longitud. La más
  conocida es el número de ondas, la cantidad de longitudes de onda de una onda que caben en un
  metro; también se expresan en ella la constante de Rydberg de la física atómica, los
  coeficientes de atenuación y la curvatura de una línea.

  Es el metro elevado a menos uno y no tiene nombre especial. El folleto del SI lo da como unidad
  coherente del número de ondas en su tabla de unidades derivadas escritas en unidades básicas, y
  la 13.ª CGPM, reunida en 1967 y 1968, añadió el número de ondas con la unidad uno por metro a la
  lista de unidades derivadas del SI mediante su Resolución 6.

  La espectroscopia emplea a menudo el centímetro recíproco. Un prefijo pertenece a la unidad antes
  de aplicar la potencia, por lo que un centímetro recíproco equivale a 100 metros recíprocos, y no
  a una centésima de uno. La publicación especial 811 del NIST recoge también el kayser, nombre
  antiguo del centímetro recíproco, como exactamente 100 metros recíprocos.

  Los valores que aparecen en la práctica suelen ser grandes. La constante de Rydberg, la escala de
  números de ondas del espectro del hidrógeno, se acerca a once millones de metros recíprocos. Una
  curva de un metro de radio tiene una curvatura de un metro recíproco.

  El símbolo puede escribirse como potencia negativa, $\mathrm{m^{-1}}$, o con barra, 1/m. Como
  todo símbolo de unidad, no lleva marca de plural ni punto final.
