description:
  en: >-
    The cubic metre per mole, symbol $\mathrm{m^{3}/mol}$, is the coherent SI derived unit of
    molar volume, the volume that a substance occupies divided by its amount of substance. It is
    built from the cube of the metre, the SI base unit of length, and the reciprocal of the mole,
    the base unit of amount of substance, and has no special name.

    A substance has a molar volume of one cubic metre per mole when one mole of it, exactly
    $6.022\,140\,76\times10^{23}$ specified entities, fills one cubic metre. Since both factors are
    SI base units or powers of them, the unit carries no numerical coefficient.

    The cubic metre is a large volume next to one mole of most substances, so practical values are
    small in this unit. CODATA gives the molar volume of an ideal gas as
    $22.710\,954\,64\ldots\times10^{-3}\,\mathrm{m^{3}/mol}$ at 273.15 kelvin and 100 kilopascals,
    and as about 22.414 thousandths of a cubic metre per mole at the same temperature and 101.325
    kilopascals. One cubic metre per mole equals 1000 litres per mole, or a million cubic
    centimetres per mole, which is why gas data are usually tabulated in litres or cubic
    decimetres per mole and data for liquids and solids in cubic centimetres per mole.

    The unit appears when the ideal gas law is applied with every quantity in coherent SI units,
    with pressure in pascals and temperature in kelvins. Its symbol may also be written m³ mol⁻¹,
    and the plural is cubic metres per mole.
