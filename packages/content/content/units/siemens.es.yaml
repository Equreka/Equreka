# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Siemens'
description: >-
  El siemens, de símbolo S, es la unidad SI derivada coherente de conductancia eléctrica, una de
  las 22 unidades SI con nombre y símbolo especiales. Sirve también para la admitancia y la
  susceptancia, las magnitudes que desempeñan el papel de la conductancia en los circuitos de
  corriente alterna.

  Un siemens es la conductancia de un elemento por el que circula una corriente de un amperio
  cuando se le aplica una diferencia de potencial de un voltio, de modo que
  $1\,\mathrm{S}=1\,\mathrm{A/V}$, la inversa del ohmio. El folleto del SI recoge la unidad en su
  tabla 4 como $\mathrm{kg^{-1}\,m^{-2}\,s^{3}\,A^{2}}$ en unidades básicas; como las demás
  unidades eléctricas, queda ligada, a través del amperio, el voltio y el ohmio, a los valores
  fijos de las constantes definitorias.

  Como conductancia y resistencia son inversas entre sí, un resistor de 100 ohmios tiene una
  conductancia de 10 milisiemens, y las conductancias de elementos conectados en paralelo se
  suman. La publicación especial 811 del NIST convierte el antiguo mho en exactamente un siemens,
  el abmho electromagnético del sistema CGS en $10^{9}$ siemens y el statmho electrostático en
  unos $1.112\,650\times10^{-12}$ siemens.

  Además de en el análisis de circuitos, el siemens aparece en la unidad de conductividad
  eléctrica, el siemens por metro, que es la inversa del ohmio metro usado para la resistividad.

  La 14.ª Conferencia General de Pesas y Medidas adoptó el nombre siemens en 1971 para la unidad
  que entonces se llamaba ohmio recíproco. Honra al ingeniero eléctrico alemán Werner von Siemens
  (1816–1892). El nombre anterior, mho, que invierte las letras del nombre inglés del ohmio, aún
  se encuentra en libros antiguos. El nombre conserva la s final en singular, un siemens, y su símbolo es una S
  mayúscula, que no debe confundirse con la s minúscula del segundo.
