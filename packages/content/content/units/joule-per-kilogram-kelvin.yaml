references:
  - title: 'BIPM, The International System of Units, 9th ed., Table 6 and section 5.2'
    url: 'https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf'
  - title: 'NIST, Guide to the SI (SP 811), Appendix B.8: calorie per gram kelvin; British thermal unit per pound degree Fahrenheit'
    url: 'https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b8'
