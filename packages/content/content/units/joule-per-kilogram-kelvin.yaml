name:
  en: 'Joule per kilogram kelvin'
symbol:
  tex: 'J/(kg\,K)'
  text: 'J/(kg·K)'
unitOf:
  - 'specific-heat-capacity'
system: 'si-derived'
compose:
  of:
    - unit: 'joule'
      exp: 1
    - unit: 'kilogram'
      exp: -1
    - unit: 'kelvin'
      exp: -1
externalIds:
  wikidata: 'Q3085309'
  qudt: 'http://qudt.org/vocab/unit/J-PER-KiloGM-K'
categories:
  - 'physics'
branches:
