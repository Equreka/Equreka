description:
  en: >-
    The joule per kilogram kelvin, symbol $\mathrm{J/(kg\,K)}$, is the coherent SI derived unit of
    specific heat capacity, the heat needed per unit mass of a material for each kelvin of
    temperature rise. The SI Brochure lists the same unit for specific entropy. It is formed by
    dividing the joule by the kilogram and by the kelvin, and has no special name.

    A material has a specific heat capacity of one joule per kilogram kelvin when one joule of heat
    raises the temperature of one kilogram of it by one kelvin. Expressed in SI base units, the unit
    is the square metre per second squared kelvin, because the kilogram inside the joule cancels the
    kilogram in the denominator.

    A kelvin and a degree Celsius are equal as temperature intervals, so a value in joules per
    kilogram degree Celsius is the same number. NIST Special Publication 811 converts the older calorie-based
    units exactly: one thermochemical calorie per gram kelvin is 4184 of these units, while one
    International Table calorie per gram kelvin, and equally one International Table British thermal
    unit per pound degree Fahrenheit, is $4186.8\,\mathrm{J/(kg\,K)}$.

    Tables of material properties use the unit throughout science and engineering, often in its
    multiple the kilojoule per kilogram kelvin. Cool liquid water has a specific heat capacity of
    about 4186 joules per kilogram kelvin, one of the highest of any common substance.

    The SI rules allow the symbol to be written with parentheses, as $\mathrm{J/(kg\,K)}$, or with
    negative exponents; a second solidus without parentheses, as in J/kg/K, is ambiguous and not
    permitted. The plural is joules per kilogram kelvin.
