# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Metro cúbico por segundo'
description: >-
  El metro cúbico por segundo, de símbolo $\mathrm{m^{3}/s}$, es la unidad derivada coherente del SI
  para el caudal: un flujo constante de un metro cúbico por segundo hace pasar un volumen de un
  metro cúbico de fluido por una sección en cada segundo. Es la unidad del caudal de ríos, canales,
  aliviaderos y grandes conducciones.

  La unidad es el cubo del metro dividido entre el segundo y no tiene nombre especial. Como toda
  unidad derivada coherente, no necesita patrón propio, porque descansa en las definiciones del
  metro y del segundo.

  Un litro es una milésima de metro cúbico, así que un metro cúbico por segundo equivale exactamente
  a 1000 litros por segundo y a 60 000 litros por minuto. La publicación especial 811 del NIST
  convierte un pie cúbico por segundo en unos $2.832\times10^{-2}\,\mathrm{m^{3}/s}$.

  Para bombas, grifos y el cuerpo humano la unidad es muy grande: un corazón en reposo impulsa unos
  $8\times10^{-5}\,\mathrm{m^{3}/s}$, por lo que los litros por minuto o por segundo resultan más
  naturales. Para los ríos resulta adecuada. Un estudio del Servicio Geológico de Estados Unidos
  estimó el caudal medio del Amazonas en Óbidos en 157 000 metros cúbicos por segundo, con unos 350
  000 en la crecida de junio de 1953.

  El símbolo puede escribirse también con el segundo elevado a un exponente negativo; en hidrología
  el nombre se abrevia a veces como cumec, que no es un símbolo del SI. El plural es metros cúbicos
  por segundo.
