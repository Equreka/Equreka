description:
  en: >-
    The metric horsepower is a unit of power of the old gravitational metric system, known as the
    Pferdestärke, symbol PS, in German, the cheval-vapeur in French and the caballo de vapor,
    symbol CV, in Spanish. It is the power that raises a mass of 75 kilograms by one metre every
    second under standard gravity, that is, 75 kilogram-force metres per second.

    Because the kilogram-force is exactly 9.806 65 newtons, the definition gives
    $1\,\mathrm{PS}=735.498\,75\,\mathrm{W}$ exactly. NIST Special Publication 811 prints the
    factor rounded to 735.4988 watts in its Appendix B.8, and QUDT records the full value.

    The metric horsepower is a little smaller than the mechanical horsepower of 550 foot
    pound-force per second: one metric horsepower is about 0.986 32 mechanical horsepower, so the
    two differ by about 1.4 percent. One kilowatt is about 1.36 metric horsepower.

    The unit is not part of the SI, which expresses power in watts and kilowatts. Outside the
    United States the English word horsepower is often used for this unit rather than for the
    mechanical one, according to Rowlett's dictionary of units, so a power quoted in horsepower
    should state which of the two is meant.

    Its exact value rests on the standard acceleration of gravity, 9.806 65 metres per second
    squared, which the 3rd General Conference on Weights and Measures adopted in 1901 when it
    declared that weight is a force. The national symbols PS and CV name this same unit, and neither
    of them is an SI symbol.
