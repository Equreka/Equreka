# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Metro'
namePlural: 'metros'
description: >-
  El metro, de símbolo $\mathrm{m}$, es la unidad básica de longitud del Sistema Internacional de
  Unidades (SI). Mide distancias de cualquier escala y longitudes derivadas como la longitud de onda
  de la luz. Las demás unidades SI de longitud, del nanómetro al kilómetro, son múltiplos o
  submúltiplos decimales suyos.

  La definición vigente desde 2019, recogida en el folleto del SI, fija en exactamente
  $299\,792\,458\,\mathrm{m/s}$ la velocidad de la luz cuando se propaga en el vacío. Por tanto, un
  metro es la distancia que la luz cruza en el espacio vacío en la 299 792 458.ª parte de un
  segundo, algo más de tres nanosegundos, de modo que su realización depende de la definición del
  segundo basada en el cesio.

  Las unidades de longitud tradicionales se fijan hoy a partir del metro. La publicación especial
  811 del NIST establece la pulgada internacional en exactamente $0.0254\,\mathrm{m}$ y el pie en
  exactamente 0.3048 metros, así que toda pulgada, pie, yarda o milla del comercio remite a la
  unidad SI.

  El metro y sus formas con prefijo sirven para las distancias por carretera, los planos de
  construcción, las tolerancias de mecanizado y casi todo el trabajo científico. Los laboratorios de
  metrología lo realizan con láseres de frecuencia estabilizada e interferómetros.

  La unidad nació en la Francia revolucionaria. Una comisión de la Academia de Ciencias francesa
  propuso en 1791 que fuera la diezmillonésima parte de la distancia del polo norte al ecuador, y
  los astrónomos Méchain y Delambre midieron desde 1792 el arco de meridiano entre Dunkerque y
  Barcelona. La 1.ª CGPM sancionó en 1889 una barra prototipo de platino iridiado, la 11.ª CGPM la
  sustituyó en 1960 por un número de longitudes de onda de una línea del criptón-86, y la 17.ª CGPM
  adoptó en 1983 la definición basada en la luz. El nombre procede del griego metron, medida; en
  inglés estadounidense se escribe meter, y el plural es metros.
