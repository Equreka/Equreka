# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pie por segundo al cuadrado'
description: >-
  El pie por segundo al cuadrado, de símbolo ft/s², es una unidad de aceleración del sistema
  imperial británico y del sistema consuetudinario estadounidense: la aceleración de un cuerpo cuya
  velocidad cambia en un pie por segundo durante cada segundo. No es una unidad del SI; la unidad SI
  coherente de aceleración es el metro por segundo al cuadrado.

  El pie exacto fija también de forma exacta esta unidad,
  $1\,\mathrm{ft/s^{2}}=0.304\,8\,\mathrm{m/s^{2}}$, el factor que la publicación especial 811 del
  NIST imprime en negrita bajo la aceleración. QUDT llama a la misma unidad pie por segundo cuadrado
  y guarda el mismo multiplicador.

  La aceleración normal de la gravedad, exactamente 9.806 65 metros por segundo al cuadrado,
  equivale a unos 32.174 pies por segundo al cuadrado, cifra que los problemas consuetudinarios de
  caída de cuerpos y de proyectiles usan en lugar de 9.81. El NIST recoge a su lado la pulgada por
  segundo al cuadrado, y un pie por segundo al cuadrado equivale a doce de ellas.

  En la mecánica técnica consuetudinaria la unidad enlaza fuerza y masa. El slug, que el NIST
  convierte en unos 14.593 9 kilogramos, es la masa a la que una fuerza de una libra fuerza imprime
  exactamente un pie por segundo al cuadrado, como confirman los factores exactos de la libra fuerza
  y del pie. Los ingenieros de Estados Unidos emplean la unidad para las prestaciones de vehículos y
  aviones y para el diseño de estructuras y máquinas.

  El plural es pies por segundo al cuadrado, y la unidad también se lee como pies por segundo por
  segundo. Entre las variantes del símbolo figuran ft/sec² y las formas de texto plano ft/s2 y ft
  s^-2.
