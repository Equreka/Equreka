# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Kilómetro cuadrado'
description: >-
  El kilómetro cuadrado, de símbolo $\mathrm{km^{2}}$, es una unidad de área igual al área de un
  cuadrado cuyos lados miden un kilómetro. Es un múltiplo decimal del metro cuadrado, la unidad SI
  coherente de área, y es la unidad métrica en la que suelen indicarse las superficies de países,
  provincias, ciudades, lagos, bosques y espacios protegidos.

  La regla del SI según la cual un prefijo y su unidad forman un símbolo inseparable implica que el
  cuadrado actúa sobre todo el kilómetro: $1\,\mathrm{km^{2}}=10^{6}\,\mathrm{m^{2}}$ exactamente.
  Un kilómetro cuadrado es, por tanto, un millón de metros cuadrados y no mil, un error que el
  símbolo km² ayuda a evitar.

  La hectárea, que el folleto del SI incluye entre sus unidades no SI como un hectómetro cuadrado,
  cabe cien veces en un kilómetro cuadrado; el manual 44 del NIST muestra el mismo paso de cien
  entre el hectómetro cuadrado y el kilómetro cuadrado. La publicación especial 811 del NIST
  convierte la milla cuadrada en unos 2.589 988 kilómetros cuadrados, de modo que un kilómetro
  cuadrado equivale a unos 0.386 millas cuadradas, o aproximadamente 247 acres.

  Los geógrafos y las oficinas de estadística emplean la unidad para superficies de tierra y de agua
  y para la densidad de población, expresada en habitantes por kilómetro cuadrado. Las áreas
  mayores, como las de océanos o continentes, se dan a menudo en millones de kilómetros cuadrados en
  lugar de usar un prefijo mayor.

  El área y la hectárea recibieron nombres especiales del CIPM en 1879 para medir terrenos; el
  kilómetro cuadrado no necesita un nombre especial porque se forma con un prefijo. En inglés
  estadounidense se escribe square kilometer, y el plural es kilómetros cuadrados.
