# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Cuarto de galón imperial'
description: >-
  El cuarto de galón imperial, escrito qt o imp qt, es una unidad de volumen del sistema imperial
  británico igual a la cuarta parte de un galón imperial, o dos pintas imperiales. A diferencia de
  sus equivalentes estadounidenses, mide por igual líquidos y áridos, porque el sistema británico usa
  un solo conjunto de unidades de capacidad para ambos.

  El galón imperial vale exactamente 4.546 09 litros, de modo que el cuarto de galón vale
  exactamente $1.136\,522\,5\,\mathrm{L}$, algo más de un litro. La ley de pesas y medidas de Canadá
  da la misma definición, la cuarta parte del galón.

  Un cuarto de galón imperial contiene dos pintas, ocho gills o 40 onzas líquidas imperiales. Estados
  Unidos tiene dos cuartos de galón más pequeños: el cuarto líquido estadounidense, de unos 0.946
  litros, se divide en 32 onzas líquidas estadounidenses, y el cuarto seco estadounidense mide unos
  1.101 litros. Salvo la onza líquida, las unidades de capacidad británicas son mayores que las
  estadounidenses del mismo nombre.

  El cuarto de galón no figura en la breve lista de unidades imperiales que la ley británica todavía
  permite usar solas en el comercio, así que solo puede aparecer en una etiqueta británica como cifra
  complementaria junto a una cantidad métrica más destacada.

  El cuarto de galón hereda la historia del galón imperial, que Gran Bretaña adoptó en 1824 y definió
  por el volumen de diez libras de agua, en sustitución de los antiguos galones de vino y de cerveza.
  El vocabulario QUDT denomina la unidad Quart (UK), y la forma imp qt la identifica siempre que
  pudieran entenderse los cuartos de galón estadounidenses.
