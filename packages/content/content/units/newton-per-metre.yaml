description:
  en: >-
    The newton per metre, symbol $\mathrm{N/m}$, is the coherent SI derived unit of force per unit
    length. The SI Brochure lists it as the unit of surface tension, and in mechanics it measures
    the spring constant, or force constant, of Hooke's law: the force needed to stretch or
    compress a spring by one metre.

    It is the newton divided by the metre and has no special name. In base units it is the
    kilogram per second squared, and because a newton is a joule per metre, the same unit can also
    be read as the joule per square metre, an energy per unit area.

    NIST Special Publication 811 converts the pound-force per inch to about
    $175.126\,8\,\mathrm{N/m}$. The CGS unit, the dyne per centimetre, is exactly one thousandth of
    a newton per metre, so surface tensions quoted in dynes per centimetre become millinewtons per
    metre with the same number.

    A stiffer spring has a larger constant in this unit and, carrying a given mass, oscillates
    faster; the period of a mass on a spring depends only on the mass and the spring constant, not
    on how far the mass is pulled from equilibrium. The unit appears wherever a restoring force
    grows in proportion to a displacement, from laboratory springs to a flexing diving board.

    The symbol may also be written with the metre raised to the exponent minus one. The plural is
    newtons per metre.
