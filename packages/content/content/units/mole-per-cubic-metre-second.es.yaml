# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Mol por metro cúbico y segundo'
description: >-
  El mol por metro cúbico y segundo, de símbolo $\mathrm{mol/(m^{3}\,s)}$, es la unidad SI coherente
  de la rapidez con que cambia una concentración de cantidad de sustancia y, por tanto, de la
  velocidad de una reacción química: un mol por metro cúbico de cambio de concentración en cada
  segundo. Pertenece a la cinética química y no tiene nombre especial.

  La unidad es el mol dividido entre el cubo del metro y entre el segundo, tres unidades básicas del
  SI, de las que deriva su definición. La IUPAC la da como unidad SI de la velocidad
  de cambio de la concentración y de la velocidad de reacción basada en la concentración de cantidad
  de sustancia, la variación de una concentración con el tiempo dividida entre el coeficiente
  estequiométrico con signo de la especie. El folleto del SI da la misma expresión en unidades
  básicas para el katal por metro cúbico, la unidad coherente de la concentración de actividad
  catalítica, y QUDT clasifica la unidad solo bajo esa magnitud.

  El litro es la milésima parte del metro cúbico, de modo que un mol por litro y segundo equivale
  exactamente a 1000 de estas unidades, y un milimol por litro y segundo equivale exactamente a una.
  Las velocidades medidas en minutos u horas se convierten con sus segundos.

  Los libros de texto rara vez dan las velocidades de reacción en esta unidad; prefieren los moles
  por litro y segundo o por hora, pero es la unidad con la que las ecuaciones de velocidad cuadran
  sin factores numéricos cuando todo se expresa en unidades SI coherentes. En inglés
  estadounidense el nombre se escribe mole per cubic meter second, el símbolo puede escribirse
  mol m⁻³ s⁻¹, y el plural es moles por metro cúbico y segundo.
