description:
  en: >-
    The poise, symbol $\mathrm{P}$, is the unit of dynamic viscosity of the centimetre-gram-second
    (CGS) system. It is the viscosity of a fluid in which a shear stress of one dyne per square
    centimetre keeps up a velocity gradient of one centimetre per second per centimetre. It is not
    an SI unit, but it survives in the form of the centipoise.

    One poise equals exactly $0.1\,\mathrm{Pa\,s}$; NIST Special Publication 811 prints the factor
    in boldface in its Appendix B.8, its mark for an exact conversion. The factor follows from the
    CGS base units, since the poise is one gram per centimetre per second and the gram and the
    centimetre are a thousandth of a kilogram and a hundredth of a metre.

    Ten poises make one pascal second, and the centipoise, a hundredth of a poise, equals exactly
    one millipascal second. Water at 20 degrees Celsius has a viscosity very close to one
    centipoise, which makes the centipoise a handy scale for liquids.

    Viscosity tables and data sheets still often quote liquids in centipoise and older tables use
    the poise itself: glycerine has about 15 poises at 20 degrees Celsius, while air has only about
    $1.8\times10^{-4}\,\mathrm{P}$.

    The unit honours the French scientist Jean Léonard Marie Poiseuille, who, interested in how
    blood circulates, measured the flow of liquids through glass capillaries of very fine bore and
    published his results in 1840 and 1846. In 1948 the 9th General Conference on Weights and
    Measures included the poise, with the symbol P, in its list of unit symbols. The plural is
    poises.
