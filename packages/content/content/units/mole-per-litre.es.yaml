# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Mol por litro'
namePlural: 'moles por litro'
description: >-
  El mol por litro, de símbolo $\mathrm{mol/L}$, es la unidad de trabajo de la concentración de
  cantidad de sustancia en química: un mol de una sustancia disuelto en disolvente suficiente para
  formar un litro de disolución. No es una unidad coherente del SI, ya que el litro es una unidad
  ajena al SI que el folleto del SI acepta para su uso junto con él.

  Es el mol dividido entre el litro, y la 12.ª CGPM declaró en 1964 que el litro es un nombre
  especial del decímetro cúbico. El mol por litro es, por tanto, el mol por decímetro cúbico, y
  equivale exactamente a 1000 moles por metro cúbico, la unidad coherente.

  Sus submúltiplos abarcan las concentraciones bajas de la bioquímica y la medicina: el milimol por
  litro equivale exactamente a un mol por metro cúbico, y el micromol y el nanomol por litro llegan
  hasta los solutos en trazas. La IUPAC señala que estas unidades se escriben a menudo M, mM y μM y
  se leen molar, milimolar y micromolar.

  Los libros de texto, las etiquetas de los reactivos y los procedimientos de laboratorio expresan
  las concentraciones en esta unidad; una disolución uno molar se prepara disolviendo el soluto y
  añadiendo disolvente hasta la marca de un matraz aforado, de modo que el volumen final, y no el del
  disolvente añadido, sea un litro.

  El NIST considera obsoletos el símbolo M y el nombre molaridad y pide en su lugar mol/L, mol/dm³ o
  kmol/m³, de modo que un valor como 0.1 M se escribe 0.1 mol/L. Tanto la l minúscula
  como la L mayúscula son símbolos admitidos del litro. En inglés estadounidense el nombre se escribe
  mole per liter, y el plural es moles por litro.
