description:
  en: >-
    The cubic metre per kilogram second squared, symbol $\mathrm{m^{3}\,kg^{-1}\,s^{-2}}$, is the
    coherent SI unit in which the Newtonian constant of gravitation is expressed. It is a compound
    unit built from three SI base units, the metre, the kilogram and the second, and it has no
    special name of its own. Because it is a product of base units with a numerical factor of one,
    the SI Brochure counts it among the coherent derived units.

    The unit follows from Newton's law of universal gravitation. The force between two masses is
    proportional to the product of the masses divided by the square of their separation, so the
    constant that turns that ratio into newtons must carry newtons times square metres per square
    kilogram. Writing the newton in base units, as a kilogram metre per second squared, reduces
    this to the cubic metre per kilogram second squared, and the two forms
    $\mathrm{N\,m^{2}\,kg^{-2}}$ and $\mathrm{m^{3}\,kg^{-1}\,s^{-2}}$ are identical.

    No quantity kind of its own is measured in this unit: its dimension belongs to the
    gravitational coupling rather than to any everyday property of matter, which is why it is
    treated as a compound unit with no magnitude attached. NIST lists the CODATA value of the
    gravitational constant in this form, and the constant itself, about $6.674\times10^{-11}$ of
    these units, shows how weak gravity is between laboratory masses.
