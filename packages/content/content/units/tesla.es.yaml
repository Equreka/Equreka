# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Tesla'
namePlural: 'teslas'
description: >-
  El tesla, de símbolo $\mathrm{T}$, es la unidad SI derivada coherente de densidad de flujo
  magnético, la magnitud llamada habitualmente campo magnético. Es una de las 22 unidades SI con
  nombre especial, equivale a un weber por metro cuadrado y en unidades básicas del SI es el
  kilogramo por segundo al cuadrado y por amperio.

  El folleto del SI recoge el tesla en su tabla de unidades con nombre especial, expresado en
  otras unidades SI como el weber por metro cuadrado. La ley de la fuerza magnética ofrece una
  lectura equivalente: un campo de un tesla empuja con una fuerza de un newton a una carga de un
  culombio que lo atraviesa a un metro por segundo, de modo que el tesla es también el newton
  segundo por culombio y metro.

  El tesla es una unidad grande para los campos cotidianos. El campo de la Tierra en su superficie
  es de unos $5\times10^{-5}\,\mathrm{T}$, unos cincuenta microteslas. En el sistema CGS, el gauss
  equivale exactamente a una diezmilésima de tesla, y el antiguo gamma equivale exactamente a un
  nanotesla; la publicación especial 811 del NIST da ambos factores como exactos.

  Los campos del orden de un tesla corresponden a imanes potentes y a equipos médicos. Los imanes
  permanentes más potentes se acercan a 2 teslas, los escáneres hospitalarios de resonancia
  magnética suelen funcionar entre 1.5 y 3 teslas, con escáneres de investigación de 10.5, y los
  electroimanes superconductores alcanzan 10 teslas o más.

  La unidad lleva el nombre del inventor Nikola Tesla. La 11.ª CGPM la incluyó, con
  el símbolo $\mathrm{T}$, entre las unidades derivadas del SI en 1960. Según las reglas del SI, el
  nombre se escribe en minúscula en el texto corrido, su plural es teslas y el símbolo es una T
  mayúscula porque procede de un nombre propio.
