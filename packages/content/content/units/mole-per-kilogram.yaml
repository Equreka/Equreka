description:
  en: >-
    The mole per kilogram, symbol $\mathrm{mol/kg}$, is the coherent SI derived unit of molality,
    the amount of a solute divided by the mass of the solvent that dissolves it. A solution has a
    molality of one mole per kilogram when each kilogram of solvent holds one mole of solute.

    It is the mole divided by the kilogram, two SI base units, and carries no special name. NIST
    Special Publication 811 gives it as the SI unit of the molality of a solute B and lists it with
    the other quotients of amount, volume and mass used to describe mixtures.

    The millimole per kilogram, one thousandth of the unit, suits dilute solutions. IUPAC fixes the
    standard molality at exactly one mole per kilogram; the activity of a solute, and through it the
    pH, is measured relative to that reference. Freezing point and boiling point constants are
    tabulated per unit of molality: for water, each mole of dissolved particles per kilogram moves
    the freezing point by about 1.86 degrees Celsius.

    QUDT lists the unit for molality, for ionic strength and for amount of substance per unit mass
    in general. Since neither the mole nor the kilogram depends on temperature, a value in this unit
    stays the same when a solution is warmed, which is the reason colligative property calculations
    use it.

    The older practice of calling a one mole per kilogram solution one molal, written 1 m, is
    obsolete according to NIST, and IUPAC warns that the letter m must not stand for the unit
    alongside other unit symbols. The plural is moles per kilogram.
