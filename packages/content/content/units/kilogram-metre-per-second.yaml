description:
  en: >-
    The kilogram metre per second, symbol $\mathrm{kg\,m/s}$, is the coherent SI derived unit of momentum,
    built from the SI base units of mass, length and time. One kilogram metre per second is the
    momentum of a body of one kilogram moving at one metre per second. The same unit also measures
    impulse, the change of momentum that a force produces.

    The unit has no special name. It is the product of the kilogram and the metre divided by the
    second, so its definition follows directly from those of the three base units in the SI
    Brochure, which since 2019 rest on fixed numerical values of the Planck constant, the speed of
    light in vacuum and the caesium hyperfine transition frequency.

    Because the newton is one kilogram metre per second squared, one kilogram metre per second is
    exactly one newton second. Textbooks usually quote momentum in kilogram metres per second and
    impulse in newton seconds, which keeps the two quantities apart while the impulse-momentum
    theorem still balances unit by unit. The CGS counterpart, the gram centimetre per second, is
    one hundred-thousandth of a kilogram metre per second.

    The unit covers momenta from molecules to vehicles: a nitrogen molecule of air at room
    temperature carries about $2.4\times10^{-23}\,\mathrm{kg\,m/s}$ and an ordinary car in town
    about $2.1\times10^{4}\,\mathrm{kg\,m/s}$.

    Following the SI rules for compound symbols, the multiplication is shown by a space or a
    half-high dot and the division by a solidus or a negative exponent, so the second may also be
    written with the exponent minus one; writing the symbols together without a separator is
    avoided. The plural is kilogram metres per second.
