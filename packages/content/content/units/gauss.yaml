description:
  en: >-
    The gauss, symbol $\mathrm{G}$, sometimes written Gs, measures magnetic flux density,
    that is, the magnetic field, in the centimetre-gram-second (CGS) system of units. It does not
    belong to the SI, whose unit of magnetic flux density is the tesla.

    NIST Special Publication 811 converts the gauss to SI with the factor
    $1\,\mathrm{G}=10^{-4}\,\mathrm{T}$, which its Appendix B.8 marks as exact. The factor links
    two different systems: the SI Brochure describes the CGS as a three-dimensional coherent
    system built on the centimetre, the gram and the second, whereas the SI also takes the ampere
    as a base unit.

    Ten thousand gauss make one tesla, so one millitesla is ten gauss and one microtesla a
    hundredth of a gauss. Its companion unit of magnetic flux, the maxwell, is exactly
    $10^{-8}\,\mathrm{Wb}$, and one gauss is one maxwell per square centimetre.

    Being smaller than the tesla, the gauss is still sometimes used for weak fields. The field of
    the Earth at its surface is about half a gauss, while a medical MRI scanner working at 1.5
    teslas holds a field of fifteen thousand gauss.

    The unit honours Carl Friedrich Gauss, who worked in both mathematics and physics. In 1832
    he promoted the metric system as a coherent system for the sciences, and he was the first to
    measure the magnetic field of the Earth in absolute terms, using the millimetre, the gram and
    the second. The CGS system itself was introduced in 1874 by the
    British Association, a scientific society. The name of the unit is written in
    lowercase.
