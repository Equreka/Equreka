description:
  en: 'Rømer is a disused temperature scale that was proposed by the Danish astronomer Ole Christensen
    Rømer in 1701. On this scale, zero is initially the freezing temperature of the brine. The
    boiling point of water is 60°. Rømer saw that the freezing point of water was almost an eighth
    of this value (7.5 degrees), and used this value as another benchmark. The unit of measurement
    on this scale, the degree Rømer, is equal to 40/21 of a Kelvin (or one degree Celsius). The
    symbol for degree Rømer can sometimes be $R$ but to avoid confusion with Rankine ($R$) and
    degrees Réaumur ($°Ré$), the symbol $°Rø$ is used.'
