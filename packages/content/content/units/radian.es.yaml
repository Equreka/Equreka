# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Radián'
description: >-
  El radián, de símbolo $\mathrm{rad}$, es la unidad SI coherente de ángulo plano, la medida del
  giro entre dos semirrectas que parten de un mismo punto, y también de ángulo de fase. Es una de
  las 22 unidades SI derivadas con nombre especial y la unidad angular del cálculo y de la
  mecánica de rotación.

  El folleto del SI define un radián como el ángulo con vértice en el centro de una circunferencia
  que abarca un arco tan largo como el radio; de forma equivalente, un ángulo recto es la cuarta
  parte de una vuelta completa de $2\pi\,\mathrm{rad}$. Como un arco dividido entre un radio es
  un cociente de dos longitudes, el SI trata el ángulo plano como una magnitud con la unidad uno,
  aunque señala que los ángulos difieren en su naturaleza de otros cocientes de
  longitudes. El símbolo rad se escribe cuando indica que se trata de un ángulo; la matemática a
  menudo lo omite.

  Una vuelta completa de 360 grados contiene $2\pi\,\mathrm{rad}$, de modo que un radián equivale
  a unos 57.3 grados; el grado es una unidad ajena al SI aceptada para su uso con él y definida a
  partir del radián. La velocidad angular y la frecuencia angular se expresan en radianes por
  segundo. El folleto pide dar las frecuencias angulares en rad/s y las frecuencias en hercios, ya
  que confundirlas produce resultados erróneos en un factor igual al número de radianes de una
  vuelta.

  Los textos de física expresan la posición angular como longitud de arco entre radio e indican
  poner la calculadora en modo radianes antes de calcular el movimiento de un oscilador.

  La 11.ª CGPM situó el radián y el estereorradián en una clase de unidades suplementarias al
  establecer el SI en 1960. El CIPM interpretó esa clase en 1980 como unidades derivadas
  adimensionales, y la 20.ª CGPM la suprimió en 1995. El plural es radianes.
