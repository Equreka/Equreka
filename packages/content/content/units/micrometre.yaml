description:
  en: >-
    The micrometre, symbol $\mathrm{μm}$, is a unit of length equal to one millionth of a metre,
    formed with the SI prefix micro. It is still widely called the micron, a name that is no longer
    part of the SI, and it measures objects too small to see with the naked eye but far larger than
    atoms.

    The relation $1\,\mathrm{μm}=10^{-6}\,\mathrm{m}$ is exact, and a thousand micrometres make one
    millimetre. Because the prefix and the unit form one inseparable symbol, a square micrometre is
    $10^{-12}$ of a square metre, not a millionth.

    The micrometre is the working unit for the sizes of cells and bacteria, the diameters of fibres
    and airborne particles, the thickness of coatings and films, and the tolerances of precision
    machining. Infrared wavelengths are also commonly stated in micrometres.

    The 9th CGPM listed the micron with the symbol μ among the units in its 1948 resolution on unit
    symbols. Once μ had become the symbol of the prefix micro, the 13th CGPM removed the name and
    its symbol in 1967, leaving micrometre as the only SI form. The old name has not vanished from
    technical writing, and NIST Special Publication 811 still lists one micron as exactly one
    micrometre among its conversion factors.

    The symbol combines the Greek letter mu, for micro, with m for metre. American English spells
    the name micrometer, a word that also names a screw gauge for measuring small thicknesses.
