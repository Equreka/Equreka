# yaml-language-server: $schema=../../dist/schemas/units.schema.json
name:
  en: 'Micrometre'
symbol:
  tex: 'μm'
unitOf:
  - 'length'
prefixOf:
  prefix: 'micro'
  base: 'metre'
externalIds:
  wikidata: 'Q175821'
  qudt: 'http://qudt.org/vocab/unit/MicroM'
aliases:
  - 'micron'
description:
  en: >-
    The micrometre is one millionth of a metre ($1\ \mathrm{μm} = 10^{-6}\ \mathrm{m}$), formed with
    the SI prefix micro. It is still widely called the micron (symbol μ), a name the 13th CGPM
    abrogated in 1967 that survives in engineering, biology and optics.
