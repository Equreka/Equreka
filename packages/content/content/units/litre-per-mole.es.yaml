# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Litro por mol'
description: >-
  El litro por mol, de símbolo $\mathrm{L/mol}$, es una unidad de volumen molar: el litro, una
  unidad aceptada para su uso con el SI, dividido entre el mol, la unidad SI de cantidad de
  sustancia. Es la unidad habitual del volumen molar de los gases en química.

  El folleto del SI sitúa el litro en su tabla 8 de unidades ajenas al SI admitidas junto a él y lo
  define como exactamente un decímetro cúbico, de modo que un litro por mol es exactamente la
  milésima parte de un metro cúbico por mol, la unidad SI coherente, e idéntico al decímetro
  cúbico por mol.

  Los volúmenes de gas por mol resultan en esta unidad números cómodos de dos cifras. Un gas ideal
  a 273.15 kelvin ocupa unos 22.711 litros por mol a 100 kilopascales, la presión estándar actual,
  y unos 22.414 litros por mol a una atmósfera estándar, el convenio antiguo del que procede el
  22.4 que aún figura en muchos libros de texto. Como el litro es la unidad de volumen habitual en el laboratorio de química, la
  constante molar de los gases se da a menudo como
  $0.08206\,\mathrm{L\,atm\,mol^{-1}\,K^{-1}}$ para que la ley de los gases ideales admita
  directamente litros.

  El litro tiene dos símbolos: la l minúscula, adoptada por el Comité Internacional de Pesas y
  Medidas en 1879, y la L mayúscula, adoptada por la 16.ª Conferencia General de Pesas y Medidas en
  1979 para evitar confundir la letra l con el número 1. Por eso son correctos tanto l/mol como
  L/mol. El plural es litros por mol.
