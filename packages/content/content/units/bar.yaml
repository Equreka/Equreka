description:
  en: >-
    The bar is a metric unit of pressure equal to exactly one hundred thousand pascals. It is a
    non-SI unit, yet the SI Brochure lists it in its table of non-SI
    units, and it remains in everyday use in meteorology and in engineering, where it gives
    pressures in figures of convenient size.

    Its definition is a decimal multiple of the SI unit,
    $1\,\mathrm{bar}=0.1\,\mathrm{MPa}=10^{5}\,\mathrm{Pa}$, and NIST Special Publication 811
    gives the factor as exact. The NIST guide to units outside the SI places the bar among the
    units that the CIPM allowed in 1978 to continue in the fields that already relied on them,
    while advising that they not spread to new ones.

    Because one bar lies close to the pressure of the air at sea level, the unit yields convenient
    numbers: the standard atmosphere equals $1.013\,25\,\mathrm{bar}$, slightly more than one bar.
    The thousandth part of the bar, the millibar, is the same size as the hectopascal, so a
    pressure reading keeps every digit when it passes from one name to the other.

    The bar and its symbol were included in Resolution 7 of the 9th CGPM in 1948. The symbol is
    written bar in upright lowercase letters and never takes a plural ending, while the name forms
    the regular plural bars. Engineers sometimes append a letter to the symbol to mark a gauge or
    an absolute reading; the SI Brochure rejects that habit, because a unit symbol must not carry
    information about the quantity, which belongs in the quantity's name instead.
