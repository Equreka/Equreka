# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Dina'
description: >-
  La dina, de símbolo $\mathrm{dyn}$, es la unidad de fuerza del sistema centímetro-gramo-segundo
  (CGS): la fuerza que comunica a una masa de un gramo una aceleración de un centímetro por
  segundo al cuadrado. No es una unidad del SI.

  Una dina equivale exactamente a $10^{-5}\,\mathrm{N}$, un factor que la publicación especial 811
  del NIST marca como exacto en su apéndice B.8, de modo que un newton son cien mil dinas. El
  factor se deduce de las unidades implicadas: el gramo es una milésima de kilogramo y el
  centímetro una centésima de metro.

  Otras unidades CGS se construyen sobre ella. El ergio, la unidad CGS de energía y trabajo, es
  el trabajo de una dina a lo largo de un centímetro, exactamente $10^{-7}\,\mathrm{J}$; la dina
  por centímetro cuadrado, una unidad de presión, es exactamente una décima de pascal; y la dina
  por centímetro, empleada para la tensión superficial, es una milésima de newton por metro.

  La Asociación Británica, una sociedad científica, introdujo el sistema CGS en 1874 como un
  conjunto coherente de unidades mecánicas basado en el centímetro, el gramo y el segundo. En
  1948, la 9.ª Conferencia General de Pesas y Medidas incluyó la dina, con el símbolo
  $\mathrm{dyn}$, en su lista de símbolos de unidades, junto al ergio y el newton. El plural del
  nombre es dinas.
