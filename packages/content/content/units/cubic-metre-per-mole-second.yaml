name:
  en: 'Cubic metre per mole second'
symbol:
  tex: 'm^{3}/(mol\,s)'
  text: 'm³/(mol·s)'
unitOf: []
system: 'si-derived'
compose:
  of:
    - unit: 'metre'
      exp: 3
    - unit: 'mole'
      exp: -1
    - unit: 'second'
      exp: -1
externalIds:
  qudt: 'http://qudt.org/vocab/unit/M3-PER-MOL-SEC'
categories:
  - 'chemistry'
branches:
  - 'chemical-kinetics'
aliases:
  - 'cubic meter per mole second'
  - 'cubic metre per mole per second'
  - 'm3/(mol s)'
  - 'm^3/(mol s)'
  - 'm3 mol-1 s-1'
  - 'm3/mol/s'
  - 'metro cúbico por mol y segundo'
references:
  - title: 'IUPAC, Quantities, Units and Symbols in Physical Chemistry, 3rd ed. (Green Book), section 2.12, pp. 63-64, notes 5 and 6'
    url: 'https://iupac.org/wp-content/uploads/2019/05/IUPAC-GB3-2012-2ndPrinting-PDFsearchable.pdf'
  - title: 'BIPM, The International System of Units, 9th ed., Table 8 (litre)'
    url: 'https://www.bipm.org/documents/20126/41483022/SI-Brochure-9-EN.pdf'
  - title: 'OpenStax, Chemistry 2e, 12.4 Integrated Rate Laws, Example 12.8 and Table 12.2'
    url: 'https://openstax.org/books/chemistry-2e/pages/12-4-integrated-rate-laws'
  - title: 'QUDT, unit M3-PER-MOL-SEC'
    url: 'https://qudt.org/vocab/unit/M3-PER-MOL-SEC'
description:
  en: >-
    The cubic metre per mole second, symbol $\mathrm{m^{3}/(mol\,s)}$, is the coherent SI unit of
    the rate constant for a reaction of second order, the constant that turns the square of a
    concentration into a rate of reaction. It belongs to chemical kinetics and has no special
    name.

    The unit is the cube of the metre divided by the mole and by the second, three SI base units,
    so its definition follows from theirs. IUPAC gives the SI unit of a rate constant of overall
    order m as the cubic metre per mole raised to the power m minus one, times the reciprocal
    second; for m equal to two that is this unit, which also serves the pre-exponential factor of
    such a reaction. QUDT files it under the quantity kind of a second-order reaction rate constant.

    The SI Brochure sets the litre equal to a thousandth of a cubic metre, so one litre per mole
    second is exactly 0.001 of this unit, and one cubic metre per mole second is 1000 litres per
    mole second. A constant stated per minute is divided by 60: the 0.0576 litres per mole minute
    that OpenStax quotes for the dimerization of butadiene is about $9.6\times10^{-7}$ of this unit.

    Textbooks seldom use it, preferring litres per mole second, often written as the reciprocal of
    molar concentration per second, and the IUPAC example of a second-order constant is stated in
    cubic centimetres per mole second. It is the unit in which the second-order integrated rate law balances when
    concentrations are taken in moles per cubic metre and times in seconds. The name is spelled
    cubic meter per mole second in American English, the symbol may be written m³ mol⁻¹ s⁻¹, and
    the plural is cubic metres per mole second.
