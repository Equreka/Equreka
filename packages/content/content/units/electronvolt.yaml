description:
  en: >-
    The electronvolt, symbol $\mathrm{eV}$, is a unit of energy sized for single electrons, atoms,
    nuclei and elementary particles. It does not belong to the SI, but the SI Brochure lists it
    among the non-SI units accepted for use with the SI, and it is routinely combined with SI
    prefixes as the kiloelectronvolt, megaelectronvolt, gigaelectronvolt and teraelectronvolt.

    One electronvolt is the energy picked up by a single electron accelerated in vacuum across a
    one-volt potential difference, which equals the elementary charge multiplied by one volt. Since
    the 26th CGPM gave the elementary charge an exact value in 2018, the conversion to SI
    units is exact: $1\,\mathrm{eV}=1.602\,176\,634\times10^{-19}\,\mathrm{J}$.

    Energies of the microscopic world fall neatly on this scale. The Rydberg energy, which sets the scale of the
    binding energies in the hydrogen atom, is about 13.6 electronvolts; the rest energy of the
    electron is about 0.511 megaelectronvolt, and that of the proton about 938 megaelectronvolts.

    Before the 2019 revision of the SI the electronvolt belonged to the units whose value in joules
    had to be measured: NIST Special Publication 811 still lists it that way, quoting the 2006
    CODATA value, with a relative uncertainty of about 2.5 parts in one hundred million. The SI
    Brochure writes the name as one word, electronvolt, while NIST tables also use electron volt.
    The plural is electronvolts and the symbol eV is never split; a prefix attaches directly, as in
    keV, MeV and GeV.
