# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Micrómetro'
description: >-
  El micrómetro, de símbolo $\mathrm{μm}$, es una unidad de longitud igual a la millonésima parte de
  un metro, formada con el prefijo SI micro. Se sigue llamando a menudo micra o micrón, nombres que
  ya no forman parte del SI, y mide objetos demasiado pequeños para verse a simple vista pero mucho
  mayores que los átomos.

  La relación $1\,\mathrm{μm}=10^{-6}\,\mathrm{m}$ es exacta, y mil micrómetros forman un milímetro.
  Como el prefijo y la unidad constituyen un único símbolo inseparable, un micrómetro cuadrado es
  $10^{-12}$ de metro cuadrado, no una millonésima.

  El micrómetro es la unidad de trabajo para el tamaño de células y bacterias, el diámetro de fibras
  y partículas en suspensión en el aire, el espesor de recubrimientos y películas y las tolerancias
  del mecanizado de precisión. Las longitudes de onda del infrarrojo también suelen darse en
  micrómetros.

  La 9.ª CGPM incluyó el micrón, con el símbolo μ, entre las unidades de su resolución de 1948 sobre
  los símbolos. Cuando μ pasó a ser el símbolo del prefijo micro, la 13.ª CGPM suprimió en 1967 el
  nombre y su símbolo, y micrómetro quedó como la única forma del SI. El nombre antiguo no ha
  desaparecido de los textos técnicos, y la publicación especial 811 del NIST aún recoge entre sus
  factores de conversión que un micrón equivale exactamente a un micrómetro.

  El símbolo une la letra griega mu, del prefijo micro, con la m de metro. En inglés estadounidense
  el nombre se escribe micrometer, palabra que, como micrómetro en español, designa también un
  tornillo de medida para espesores pequeños.
