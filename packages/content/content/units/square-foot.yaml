description:
  en: >-
    The square foot, symbol $\mathrm{ft^{2}}$, is a unit of area of the British imperial and United
    States customary systems, equal to the area of a square with sides one foot long. It belongs
    neither to the SI nor to the units accepted for use with it, but it remains the everyday area
    unit for floor space in the United States.

    The foot has been exactly 0.3048 metre since 1959, so the square foot is exactly
    $0.092\,903\,04\,\mathrm{m^{2}}$. NIST Special Publication 811 prints this factor in boldface,
    its mark for an exact conversion, and QUDT stores the same multiplier.

    The customary area ladder in NIST Handbook 44 runs from the square inch upward: 144 square
    inches make a square foot, nine square feet make a square yard, 43 560 square feet make an acre
    and 27 878 400 square feet make a square mile. In metric terms a square foot is a little under
    one tenth of a square metre, and a square metre is about 10.76 square feet.

    Homes, offices, shops and warehouses in the United States are described and priced by their
    floor area in square feet, and building codes state loads and pressures in customary units built
    on it, such as the pound-force per square foot, which NIST also lists.

    Handbook 44 notes that sq ft is an abbreviation, used in customary practice for squares of
    customary units, while the symbol is ft². The plural is square feet. Until 2023 land surveys in
    the United States could also use the slightly longer U.S. survey foot, which NIST has since
    declared obsolete.
