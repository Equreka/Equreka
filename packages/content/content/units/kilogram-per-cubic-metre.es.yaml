# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Kilogramo por metro cúbico'
description: >-
  El kilogramo por metro cúbico, de símbolo $\mathrm{kg/m^{3}}$, es la unidad derivada coherente
  del SI para la densidad, también llamada densidad másica: la densidad de un material del que un
  metro cúbico tiene una masa de un kilogramo. El folleto del SI la incluye en su tabla de
  unidades derivadas coherentes expresadas en unidades básicas.

  Es el kilogramo dividido entre el cubo del metro y no tiene nombre especial, de modo que su
  definición descansa directamente en las de esas dos unidades básicas del SI. La misma unidad
  mide la concentración másica, la masa de una sustancia disuelta o en suspensión por volumen de
  mezcla.

  Un gramo por centímetro cúbico equivale exactamente a $1000\,\mathrm{kg/m^{3}}$, y un gramo por
  litro equivale exactamente a un kilogramo por metro cúbico, ya que un litro es una milésima de
  metro cúbico. La publicación especial 811 del NIST convierte la libra por pie cúbico en unos
  16.018 46 kilogramos por metro cúbico.

  La unidad se adapta a las densidades de la práctica cotidiana. El aire en el punto de
  congelación del agua y a presión atmosférica tiene algo más de un kilogramo por metro cúbico, el
  agua líquida unos $1000\,\mathrm{kg/m^{3}}$ y el oro $1.93\times10^{4}\,\mathrm{kg/m^{3}}$, así
  que una sola unidad cubre gases, líquidos y los metales más densos sin necesidad de prefijos.

  El símbolo puede escribirse también con el metro elevado al exponente menos tres, con un
  espacio o un punto a media altura entre los dos símbolos. El plural es kilogramos por metro
  cúbico.
