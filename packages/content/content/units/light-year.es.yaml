# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Año luz'
description: >-
  El año luz, de símbolo ly, es una unidad de longitud igual a la distancia que recorre la luz en
  el vacío durante un año juliano. Pese a su nombre, mide distancias y no tiempo. Queda fuera del
  Sistema Internacional de Unidades y aparece sobre todo en la astronomía divulgativa, donde da idea
  de las distancias a las estrellas y las galaxias.

  La Unión Astronómica Internacional entiende por año, salvo indicación contraria, el año juliano
  de $365.25\,\mathrm{d}$, con días de $86\,400\,\mathrm{s}$. Al multiplicar ese intervalo por la
  velocidad de la luz en el vacío, $c$, resulta
  $1\,\mathrm{ly}=9\,460\,730\,472\,580\,800\,\mathrm{m}$ exactos, ya que ambos factores están
  fijados por definición. La publicación especial 811 del NIST imprime el factor redondeado a seis
  cifras y señala que se basa en el día de $86\,400\,\mathrm{s}$ y en el cómputo juliano del año.

  Un año luz equivale a unas 63 241 veces la unidad astronómica, y el pársec, la unidad que los
  astrónomos prefieren para las distancias en la Vía Láctea y más allá, es unas 3.26 veces más
  largo que el año luz. Una distancia en años luz indica también hace cuánto partió la luz que
  llega ahora: la luz de una estrella situada a diez años luz salió de ella diez años antes.

  La UAI señala que el año luz aparece a veces en artículos científicos, pero es sobre todo una
  unidad de la divulgación y los medios; en el trabajo profesional se prefiere el pársec. El nombre se escribe año luz, sin guion, y su plural es años
  luz. El NIST escribe el símbolo l.y., aunque ly es la forma más común, y ninguno de los dos lleva
  marca de plural.
