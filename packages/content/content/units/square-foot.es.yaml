# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pie cuadrado'
description: >-
  El pie cuadrado, de símbolo $\mathrm{ft^{2}}$, es una unidad de área del sistema imperial
  británico y del sistema consuetudinario estadounidense, igual al área de un cuadrado de un pie de
  lado. No pertenece al SI ni a las unidades aceptadas para su uso con él, pero sigue siendo la
  unidad cotidiana de superficie construida en Estados Unidos.

  El pie mide exactamente 0.3048 metros desde 1959, de modo que el pie cuadrado equivale exactamente
  a $0.092\,903\,04\,\mathrm{m^{2}}$. La publicación especial 811 del NIST imprime este factor en
  negrita, su marca de conversión exacta, y QUDT guarda el mismo multiplicador.

  La escala consuetudinaria de áreas del manual 44 del NIST asciende desde la pulgada cuadrada: 144
  pulgadas cuadradas forman un pie cuadrado, nueve pies cuadrados forman una yarda cuadrada, 43 560
  pies cuadrados forman un acre y 27 878 400 pies cuadrados forman una milla cuadrada. En términos
  métricos, un pie cuadrado es algo menos de una décima de metro cuadrado, y un metro cuadrado
  equivale a unos 10.76 pies cuadrados.

  En Estados Unidos, viviendas, oficinas, comercios y almacenes se describen y tasan según su
  superficie en pies cuadrados, y los códigos de edificación expresan cargas y presiones con
  unidades consuetudinarias basadas en él, como la libra fuerza por pie cuadrado, que el NIST
  también recoge.

  El manual 44 señala que sq ft es una abreviatura, empleada en la práctica consuetudinaria para los
  cuadrados de unidades consuetudinarias, mientras que el símbolo es ft². El plural es pies
  cuadrados. Hasta 2023 la topografía estadounidense podía usar además el pie topográfico, algo más
  largo, que el NIST ha declarado obsoleto desde entonces.
