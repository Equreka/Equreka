description:
  en: >-
    The siemens, symbol S, is the coherent SI derived unit of electrical conductance, one of the 22
    SI units with special names and symbols. It also serves for admittance and susceptance, the
    quantities that play the role of conductance in alternating-current circuits.

    One siemens is the conductance of an element that carries a current of one ampere when a
    potential difference of one volt is applied across it, so $1\,\mathrm{S}=1\,\mathrm{A/V}$, the
    reciprocal of the ohm. The SI Brochure lists the unit in its Table 4 as
    $\mathrm{kg^{-1}\,m^{-2}\,s^{3}\,A^{2}}$ in base units; like the other electrical units, it is
    tied through the ampere, the volt and the ohm to the fixed values of the defining constants.

    Because conductance is the reciprocal of resistance, a resistor of 100 ohms has a conductance
    of 10 millisiemens, and conductances of elements connected in parallel add. NIST Special
    Publication 811 converts the old mho as exactly one siemens, the CGS electromagnetic abmho as
    $10^{9}$ siemens and the electrostatic statmho as about $1.112\,650\times10^{-12}$ siemens.

    Besides circuit analysis, the siemens appears in the unit of electrical conductivity, the
    siemens per metre, which is the reciprocal of the ohm metre used for resistivity.

    In 1971 the 14th CGPM, the General Conference on Weights and Measures, gave the name siemens
    to the unit then called the reciprocal ohm. Its namesake is Werner von Siemens (1816–1892), a
    German electrical engineer. The earlier name mho, ohm reversed, is still found in older books. The
    name keeps its final s in the singular, one siemens, and its symbol is a capital S,
    which must not be confused with the lower-case s of the second.
