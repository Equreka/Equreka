# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Galón estadounidense'
description: >-
  El galón estadounidense, escrito gal o US gal, es la unidad de volumen para líquidos del sistema
  consuetudinario estadounidense, definida como 231 pulgadas cúbicas. Es el galón con el que se
  expresa en Estados Unidos el consumo de combustible en millas por galón, y es aproximadamente una
  sexta parte menor que el galón imperial británico.

  Como la pulgada mide exactamente 25.4 milímetros desde 1959, la definición fija el galón en
  $231\,\mathrm{in^{3}}=3.785\,411\,784\,\mathrm{L}$ sin redondeo alguno. La publicación especial
  811 del NIST lo redondea a 3.785 412 litros. El NIST señala que todas las unidades de capacidad
  estadounidenses se definen de este modo a partir de las unidades de longitud.

  El manual 44 del NIST divide el galón en cuatro cuartos de galón líquidos, ocho pintas, 32 gills
  o 128 onzas líquidas estadounidenses. Un galón estadounidense equivale a unos 0.833 galones
  imperiales. Lleno de agua a 62 °F, contiene algo más de ocho libras, según el NIST, de modo que la
  cómoda correspondencia británica entre la onza de agua y la onza líquida no se mantiene.

  Estados Unidos usa medidas distintas para líquidos y para áridos. El galón y sus divisiones miden
  líquidos, mientras que ciertos productos secos se miden con el bushel y el cuarto de galón seco,
  cuyos tamaños difieren de los de las unidades para líquidos.

  En 1824 Gran Bretaña sustituyó sus galones antiguos por el galón imperial. Las colonias
  americanas ya habían tomado la medida de 231 pulgadas cúbicas que los ingleses usaban para el
  vino, y Estados Unidos la conservó, de modo que ambos países usan galones distintos desde
  entonces, según relata el NIST. En los textos estadounidenses gal a secas designa esta unidad; se escribe US gal cuando
  podría entenderse el galón imperial.
