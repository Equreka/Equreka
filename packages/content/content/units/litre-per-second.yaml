description:
  en: >-
    The litre per second, symbol $\mathrm{L/s}$, is a unit of volumetric flow rate equal to one
    litre of fluid passing a cross-section in each second. It joins the litre, a non-SI unit of
    volume accepted for use with the SI, with the SI second, so it is not a coherent SI unit, but it
    suits the flows of hoses, fire mains, wells and small streams.

    Its value follows from its parts. The SI Brochure defines the litre as one cubic decimetre,
    exactly $10^{-3}\,\mathrm{m^{3}}$, so one litre per second is exactly one thousandth of a cubic
    metre per second; QUDT gives the same multiplier.

    Sixty litres per minute make one litre per second, and 1000 litres per second make one cubic
    metre per second. NIST Special Publication 811 converts one US gallon per minute to about 0.0631
    litre per second and one cubic foot per minute to about 0.472 litre per second.

    Engineers size water supply, drainage, irrigation and firefighting equipment in litres per
    second. In textbook examples, a garden hose carrying half a litre per second sends water out at
    about 2 metres per second, and a fire hose may carry 40 litres per second.

    The litre has two symbols, a lowercase l and a capital L, so the unit may be written l/s or L/s;
    the capital avoids confusion with the numeral one. Forms such as lps are informal abbreviations,
    not symbols. The plural is litres per second, spelled liters per second in American English.
