description:
  en: >-
    The mole per litre, symbol $\mathrm{mol/L}$, is the working unit of amount concentration in
    chemistry: one mole of a substance dissolved in enough solvent to make one litre of solution.
    It is not a coherent SI unit, since the litre is a non-SI unit that the SI Brochure accepts for
    use with the SI.

    It is the mole divided by the litre, and the 12th CGPM in 1964 declared the litre a special name
    for the cubic decimetre. The mole per litre is therefore the mole per cubic decimetre, and it
    equals exactly 1000 moles per cubic metre, the coherent unit.

    Its submultiples cover the low concentrations of biochemistry and medicine: the millimole per
    litre equals exactly one mole per cubic metre, and the micromole and nanomole per litre reach
    down to trace solutes. IUPAC notes that these units are often written M, mM and μM and read
    molar, millimolar and micromolar.

    Textbooks, reagent labels and laboratory recipes state concentrations in this unit; a molar
    solution is prepared by dissolving the solute and adding solvent up to the mark of a volumetric
    flask, so that the final volume, not the volume of solvent added, is one litre.

    NIST considers the symbol M and the name molarity obsolete and asks for mol/L, mol/dm³ or
    kmol/m³ instead, so that a value such as 0.1 M is written 0.1 mol/L. Both the lower-case l and the capital L are permitted symbols for the litre. The name is spelled mole per
    liter in American English, and the plural is moles per litre.
