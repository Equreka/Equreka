# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Newton metro cuadrado por culombio al cuadrado'
description: >-
  El newton metro cuadrado por culombio al cuadrado, de símbolo $\mathrm{N\,m^{2}\,C^{-2}}$, es la
  unidad SI coherente en la que se expresa la constante de Coulomb de la electrostática. Es una
  unidad compuesta formada por el newton, el metro y el culombio, y no tiene nombre especial.

  La unidad se deduce de la ley de Coulomb. La fuerza eléctrica entre dos cargas puntuales es
  proporcional al producto de las cargas dividido entre el cuadrado de su separación, de modo que
  la constante que convierte esa razón, medida en culombios al cuadrado por metro cuadrado, en una
  fuerza en newtons debe llevar newtons por metro cuadrado y por culombio al cuadrado. Escrita en
  unidades básicas del SI, es el kilogramo metro cúbico por segundo a la cuarta y por amperio al
  cuadrado.

  La misma dimensión corresponde al inverso de la permitividad. Como el faradio por metro equivale
  al culombio al cuadrado por newton y metro cuadrado, esta unidad es idéntica al metro por
  faradio, y la constante de Coulomb, igual a uno dividido entre cuatro pi por la permitividad
  eléctrica del vacío, puede darse en cualquiera de las dos formas. Los textos introductorios como
  University Physics de OpenStax la dan en la forma con newtons, que mantiene a la vista la
  relación con la fuerza.

  Ninguna clase de magnitud propia se mide con esta unidad, por lo que se trata como una unidad
  compuesta sin magnitud asociada. La propia constante de Coulomb vale unas
  $8.99\times10^{9}$ de estas unidades, y por eso dos cargas de un culombio cada una, separadas un
  metro, se empujarían con una fuerza de casi nueve mil millones de newtons.
