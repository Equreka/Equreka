# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Kilogramo por mol'
description: >-
  El kilogramo por mol, de símbolo $\mathrm{kg/mol}$, es la unidad SI derivada coherente de masa
  molar, la masa de una sustancia dividida entre su cantidad de sustancia. Es el cociente de dos
  unidades básicas del SI, el kilogramo y el mol, y no tiene nombre especial.

  Una sustancia tiene una masa molar de un kilogramo por mol cuando un mol de sus entidades,
  exactamente $6.022\,140\,76\times10^{23}$ desde la redefinición del mol de 2019, tiene una masa
  de un kilogramo. Como ambos factores son unidades básicas, la unidad no necesita coeficiente
  numérico y forma ecuaciones coherentes con las demás unidades del SI.

  La unidad es grande para la química: un kilogramo por mol equivale a 1000 gramos por mol, y las
  masas molares de las moléculas pequeñas van de unos pocos gramos a unos cientos de gramos por
  mol, por lo que las tablas y los libros de texto las dan en gramos por mol. El kilogramo por mol
  aparece en cambio en los cálculos que deben mantenerse en unidades SI coherentes, como la
  relación entre la densidad, la presión y la temperatura de un gas, y en los valores de CODATA. La
  constante de masa molar tiene el valor CODATA 2022
  $1.000\,000\,001\,05(31)\times10^{-3}\,\mathrm{kg/mol}$, alrededor de una parte en mil millones
  por encima de 0.001 kilogramos por mol.

  Desde su adopción por la 14.ª Conferencia General de Pesas y Medidas en 1971 hasta 2019, la
  definición del mol fijaba la masa molar del carbono-12 en exactamente 0.012 kilogramos por mol;
  ese valor es ahora medido. El símbolo puede escribirse también kg mol⁻¹, y el plural es
  kilogramos por mol.
