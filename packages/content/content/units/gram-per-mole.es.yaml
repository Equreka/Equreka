# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Gramo por mol'
description: >-
  El gramo por mol, de símbolo $\mathrm{g/mol}$, es una unidad de masa molar formada a partir del
  gramo y el mol. No es la unidad SI coherente, que es el kilogramo por mol, pero es la unidad en la
  que las tablas de química, las tablas periódicas y los libros de texto dan las masas molares casi
  sin excepción.

  Un gramo por mol es exactamente la milésima parte de un kilogramo por mol, porque el gramo se
  define como la milésima parte del kilogramo. Una sustancia tiene una masa molar de un gramo por
  mol cuando un mol de sus entidades tiene una masa de un gramo.

  La unidad debe su difusión a una coincidencia numérica incorporada en las definiciones. Una masa
  molar expresada en gramos por mol tiene el mismo número que la masa atómica o molecular relativa
  de la sustancia, que es la masa de una entidad expresada en la unidad dalton: un átomo de
  carbono-12 tiene una masa de 12 Da y un mol de carbono-12 una masa de casi exactamente 12 gramos.
  El folleto del SI lo expresa con la relación de que la masa molar es igual a la masa atómica
  relativa por un gramo por mol, que se cumplía exactamente con la definición del mol vigente de
  1971 a 2019 y hoy se cumple con una diferencia de alrededor de una parte en mil millones.

  En la práctica, las masas molares se leen en la tabla periódica y se suman a lo largo de una
  fórmula: el nitrógeno molecular tiene 28.01 gramos por mol, el cloruro de sodio 58.44 y el
  cloroformo 119.37. Sirven para convertir masas pesadas en cantidades de sustancia y, mediante la
  ley de los gases ideales, relacionan la densidad de un gas con su presión y su temperatura. El
  plural es gramos por mol, y el símbolo puede escribirse también g mol⁻¹.
