# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Siglo'
description: >-
  El siglo es una unidad de tiempo de 100 años, ajena al SI. Para las conversiones se toma como
  100 años comunes de 365 días, la convención aplicada también al año y a la década. La
  historia, la arqueología y la astronomía lo usan para medir y nombrar tramos largos de tiempo.

  Ninguna norma define el siglo como unidad. Cien veces el año de 365 días, que la publicación
  especial 811 del NIST tabula como 31 536 000 segundos, dan 3 153 600 000 segundos, o 36 500
  días.

  Un intervalo de 100 años del calendario es más largo. El calendario gregoriano hace bisiesto
  uno de cada cuatro años, pero omite el día bisiesto en los años seculares no divisibles entre
  400, así que 100 años consecutivos contienen 24 o 25 días bisiestos, 36 524 o 36 525 días en
  total. Los astrónomos cuentan el tiempo en siglos julianos de exactamente 36 525 días, una
  unidad que también recogen las notas al apéndice B de la publicación especial 811 del NIST; las
  fórmulas de la duración del año trópico y del mes sinódico del suplemento explicativo del
  almanaque astronómico la usan como variable temporal.

  La era cristiana empieza en el año 1 y no tiene año 0, de modo que el primer siglo va del año 1
  al año 100 y el siglo XX, de 1901 a 2000.

  El símbolo c designa también la velocidad de la luz y, como prefijo, centi, por lo que escribir
  la palabra completa evita ambigüedades. Diez décadas forman un siglo, y diez siglos, un milenio.
