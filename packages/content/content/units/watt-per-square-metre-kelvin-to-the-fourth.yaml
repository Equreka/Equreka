description:
  en: >-
    The watt per square metre kelvin to the fourth, symbol $\mathrm{W\,m^{-2}\,K^{-4}}$, is the
    coherent SI unit in which the Stefan-Boltzmann constant is expressed. It is a compound unit made
    from the watt, the metre and the kelvin, it has no special name, and no everyday quantity is
    measured in it, so it stands without a magnitude of its own; QUDT files it under a dedicated
    kind, power per area per quartic temperature.

    The unit follows from the Stefan-Boltzmann law. A black body radiates a power per unit area of
    its surface that grows with the fourth power of its absolute temperature, so the constant that
    turns kelvins to the fourth into watts per square metre must carry this unit. Written in SI base
    units it is the kilogram per second cubed kelvin to the fourth, because the square metres in the
    watt cancel those of the area.

    NIST lists the constant as $5.670\,374\,419\ldots\times10^{-8}$ of these units, an exact value
    since the 2019 revision of the SI. With it, a black surface at 300 kelvins, close to room
    temperature, emits about 459 watts per square metre. The steep fourth power is why temperatures
    entering this unit must always be absolute: a value in degrees Celsius would give nonsense.

    The unit appears in the physics of thermal radiation, from estimating heat lost by a warm body
    to computing the power radiated by a star from its surface temperature and area. The symbol may
    also be written with a solidus and parentheses, as W/(m² K⁴) in plain text. The plural is watts
    per square metre kelvin to the fourth.
