# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Electronvoltio'
namePlural: 'electronvoltios'
description: >-
  El electronvoltio, de símbolo $\mathrm{eV}$, es una unidad de energía a la medida de los
  electrones, los átomos, los núcleos y las partículas elementales. No pertenece al SI, pero el
  folleto del SI la incluye entre las unidades no SI aceptadas para su uso con el SI, y se combina
  habitualmente con los prefijos SI como kiloelectronvoltio, megaelectronvoltio,
  gigaelectronvoltio y teraelectronvoltio.

  Un electronvoltio es la energía que gana un solo electrón acelerado en el vacío entre dos puntos
  separados por un voltio de diferencia de potencial, igual a la carga elemental multiplicada por
  un voltio.
  Desde que la 26.ª CGPM fijó en 2018 el valor numérico de la carga elemental, la conversión a
  unidades SI es exacta: $1\,\mathrm{eV}=1.602\,176\,634\times10^{-19}\,\mathrm{J}$.

  Las energías del mundo microscópico encajan bien en esta escala. La energía de Rydberg, que fija la escala de
  las energías de enlace del átomo de hidrógeno, es de unos 13.6 electronvoltios; la energía en
  reposo del electrón es de unos 0.511 megaelectronvoltios, y la del protón de unos 938
  megaelectronvoltios.

  Antes de la revisión del SI de 2019, el electronvoltio pertenecía a las unidades cuyo valor en
  julios debía medirse: la publicación especial 811 del NIST aún lo recoge así, con el valor CODATA
  de 2006 y una incertidumbre relativa de unas 2.5 partes por cien millones. El folleto del SI
  escribe el nombre en inglés como una sola palabra, mientras que las tablas del NIST usan también
  la forma separada. En español el nombre es electronvoltio y su plural electronvoltios; el símbolo
  eV nunca se separa y el prefijo se une directamente, como en keV, MeV y GeV.
