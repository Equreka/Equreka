description:
  en: >-
    The steradian, symbol $\mathrm{sr}$, is the coherent SI unit of solid angle, the
    three-dimensional counterpart of a plane angle that measures how wide a cone of directions is
    as seen from its apex. It is one of the 22 SI derived units with a special name and is used
    mainly in geometry, radiometry and photometry.

    The SI Brochure defines one steradian as the solid angle at the centre of a sphere that cuts
    out of the surface an area equal to the square of the radius. The CIE lighting vocabulary puts
    the same idea in terms of a unit sphere: a solid angle is the area that its cone intercepts on a
    sphere of radius one centred at the apex. Since the defining ratio is an area over a squared
    length, the SI treats solid angle as a quantity with the unit one, while noting that solid angles
    differ in kind from other ratios of areas.

    A complete sphere subtends $4\pi\,\mathrm{sr}$ about its centre, which the brochure offers as an
    alternative definition, and a hemisphere half of that. The steradian stands to area on a sphere
    as the radian stands to arc length on a circle.

    Radiometry and photometry rely on the steradian to tell a flux from an intensity, and the
    brochure notes that these fields usually keep its name and symbol in unit expressions. Radiant
    intensity is measured in watts per steradian, the lumen is the candela steradian, and the
    candela itself is defined through a radiant intensity of 1/683 watt per steradian.

    The steradian entered the SI in 1960 as a supplementary unit, alongside the radian, and became a
    derived unit when the 20th CGPM abolished that class in 1995. The plural is steradians.
