name:
  en: 'Joule-second'
symbol:
  tex: 'J⋅s'
unitOf:
  - 'angular-momentum'
system: 'si-derived'
compose:
  - unit: 'joule'
    exp: 1
  - unit: 'second'
    exp: 1
categories:
  - 'physics'
description:
  en: 'The joule-second (symbol $J⋅s$ or $J s$) is the product of an SI derived unit, the joule ($J$),
    and an SI base unit, the second ($s$). The joule-second is a unit of action or of angular
    momentum. The joule-second also appears in quantum mechanics within the definition of Planck''s
    constant.'
