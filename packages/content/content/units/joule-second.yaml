description:
  en: >-
    The joule second, symbol $\mathrm{J\,s}$, is the coherent SI derived unit of action and of
    angular momentum: the product of the joule, the SI unit of energy, and the second. Reduced to
    base units it is the kilogram square metre per second, so it measures both the action of
    classical and quantum mechanics and the spin of rotating bodies and particles.

    Since the revision of the SI that took effect in 2019, the kilogram is defined by fixing the
    Planck constant at exactly $6.626\,070\,15\times10^{-34}\,\mathrm{J\,s}$, and the SI Brochure
    states that the joule second equals the kilogram square metre per second. The unit therefore
    sits inside the definition of the SI unit of mass.

    Angular momentum of a rigid body is its moment of inertia, in kilogram square metres, times its
    angular velocity, in radians per second, which yields joule seconds. Action is an energy
    multiplied by a time. Multiplying the Planck constant by a frequency in hertz gives the energy
    of one photon in joules, which is how the photoelectric effect is analysed; OpenStax asks
    readers to estimate the constant from stopping-potential data in joule seconds and in
    electronvolt seconds.

    Quantities measured in joule seconds are tiny on the atomic scale, so quantum physics also uses
    the electronvolt second and states angular momentum as multiples of the reduced Planck
    constant, the Planck constant divided by $2\pi$, which has the same unit. In everyday mechanics
    the unit appears as the kilogram square metre per second in problems on spinning wheels, skaters
    and planets.

    The SI Brochure requires a space or a half-high dot between the two symbols, so the unit is
    written J s or J·s and not Js. In prose the name is two words, joule second.
