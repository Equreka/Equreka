description:
  en: >-
    The square centimetre, symbol $\mathrm{cm^{2}}$, is a unit of area equal to the area of a square
    whose sides each measure one centimetre. It is a decimal submultiple of the square metre, the
    coherent SI unit of area, and it was the unit of area of the centimetre-gram-second system.

    The SI treats a prefix and the unit it is attached to as a single symbol, so an exponent acts on
    both together: a square centimetre is the square of one hundredth of a metre, which gives
    $1\,\mathrm{cm^{2}}=10^{-4}\,\mathrm{m^{2}}$ exactly. The SI Brochure illustrates the rule with
    the cubic centimetre, and the square follows by the same reasoning.

    Metric area units climb in steps of one hundred in the tables of NIST Handbook 44: one hundred
    square millimetres make a square centimetre, and one hundred square centimetres make a square
    decimetre, so a square metre contains ten thousand square centimetres. NIST Special Publication
    811 gives the square inch as exactly 6.4516 square centimetres, so a square centimetre is a
    little more than fifteen hundredths of a square inch.

    The unit suits areas that fit in a hand or on a desk: a coin, a postage stamp, a page, the
    cross-section of a rod in a school problem or the patch over which a force is spread when a
    pressure is worked out. It also forms CGS units of other quantities, such as the dyne per square
    centimetre for pressure, which NIST still lists among its conversion factors.

    Only the symbol cm² is correct; the SI Brochure allows no abbreviations of unit symbols or
    names, citing sq. mm as an example. American English spells the name square centimeter, and the
    plural is square centimetres.
