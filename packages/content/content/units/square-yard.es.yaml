# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Yarda cuadrada'
description: >-
  La yarda cuadrada, de símbolo $\mathrm{yd^{2}}$, es una unidad de área del sistema imperial
  británico y del sistema consuetudinario estadounidense, igual al área de un cuadrado cuyos lados
  miden una yarda. No es una unidad del SI ni está aceptada para su uso con él; mide áreas
  intermedias entre las de una habitación y las de un terreno.

  La yarda mide exactamente 0.9144 metros, de modo que la yarda cuadrada equivale exactamente a
  $0.836\,127\,36\,\mathrm{m^{2}}$, el multiplicador que guarda QUDT. La publicación especial 811
  del NIST imprime el factor redondeado a siete cifras significativas, 0.836 127 4, sin la negrita
  que reserva a los valores exactos.

  El manual 44 del NIST hace la yarda cuadrada igual a nueve pies cuadrados o 1296 pulgadas
  cuadradas. Como un acre son 43 560 pies cuadrados, contiene 4840 yardas cuadradas, y una milla
  cuadrada contiene 3 097 600. Un metro cuadrado equivale a unas 1.196 yardas cuadradas, algo menos
  de una y un quinto.

  Alfombras, revestimientos de suelo, césped, pavimentos y telas se miden y se cotizan a menudo por
  yarda cuadrada en Estados Unidos y el Reino Unido, y los constructores estiman con ella trabajos
  de enlucido y de pintura. El peso de un tejido en el comercio consuetudinario se indica en onzas
  por yarda cuadrada, una unidad que el NIST incluye entre sus factores de conversión.

  El plural es yardas cuadradas. Además del símbolo yd², los textos escriben las abreviaturas sq yd
  y sq. yd. y la forma de texto plano yd2. A diferencia del acre y de la milla cuadrada, la yarda
  cuadrada no tiene variante basada en el pie topográfico en la tabla de áreas de la publicación
  especial 811 del NIST.
