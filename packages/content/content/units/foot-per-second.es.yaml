# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pie por segundo'
description: >-
  El pie por segundo, de símbolo ft/s, es una unidad de rapidez y de velocidad del sistema imperial
  británico y del sistema consuetudinario estadounidense: la rapidez de un cuerpo que recorre un pie
  en cada segundo. Queda fuera del SI, cuya unidad coherente para esas mismas magnitudes es el metro
  por segundo.

  Como el pie mide exactamente 0.3048 metros, el pie por segundo es exactamente
  $1\,\mathrm{ft/s}=0.304\,8\,\mathrm{m/s}$. La publicación especial 811 del NIST imprime este
  factor en negrita, como exacto, en su tabla de velocidades y rapideces, y QUDT guarda el mismo
  multiplicador.

  De las definiciones del pie, de la milla y de la hora se siguen otras relaciones exactas: un pie
  por segundo son 1.097 28 kilómetros por hora y quince veintidosavos de milla por hora, así que
  sesenta millas por hora son exactamente ochenta y ocho pies por segundo. Un metro por segundo
  equivale a unos 3.281 pies por segundo.

  Los textos estadounidenses de ingeniería y de ciencias emplean la unidad para la rapidez del agua
  en tuberías y canales, del aire en conductos, de los proyectiles y de los aviones. Las páginas
  educativas de la NASA sobre aerodinámica, por ejemplo, sitúan la rapidez del sonido al nivel del
  mar en un día estándar en unos 1100 pies por segundo, junto a la misma rapidez en millas por hora.

  El plural es pies por segundo, y ft/sec es una variante frecuente del símbolo. También aparece la
  abreviatura fps, pero conviene evitarla porque significa igualmente fotogramas por segundo; el
  folleto del SI rechaza la abreviatura paralela mps para el metro por segundo.
