# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Tonelada corta'
description: >-
  La tonelada corta, unidad de masa de 2000 libras avoirdupois, es la tonelada del sistema
  consuetudinario estadounidense, llamada también tonelada neta, y el NIST la señala como la
  tonelada más usada en Estados Unidos y Canadá; el calificativo corta la distingue de la tonelada
  larga británica de 2240 libras y de la tonelada métrica.

  Como la libra internacional pasó a valer exactamente 0.453 592 37 kilogramos en 1959, la tonelada
  corta vale exactamente $2000\,\mathrm{lb}=907.184\,74\,\mathrm{kg}$, que la publicación especial
  811 del NIST redondea a 907.1847 kilogramos. La ley de pesas y medidas de Canadá define su
  tonelada de la misma manera, como 2000 libras.

  La tonelada corta equivale a veinte hundredweight (cwt) cortos de 100 libras cada uno. Es aproximadamente
  nueve décimas de tonelada métrica, y la tonelada larga pesa exactamente un 12 por ciento más que
  ella.

  Según el NIST, en Estados Unidos tonelada o hundredweight sin calificativo se entienden como la tonelada
  de 2000 libras y el hundredweight de 100 libras, y las palabras neta o corta se añaden solo cuando
  también podrían entenderse las unidades brutas o largas. En el transporte marítimo la situación se
  invierte: el NIST señala que allí la carga se pesa sobre todo en toneladas largas o métricas, y la
  tonelada corta es una rareza.

  El manual 44 del NIST establece tn como abreviatura obligatoria de la tonelada corta en los
  instrumentos de pesar y medir desde el 1 de enero de 2014, y admite otra forma en los fabricados
  entre 2008 y 2013. La tonelada métrica tiene su propio símbolo, t, y el vocabulario QUDT escribe la
  tonelada corta como ton{short}, por lo que el nombre completo es la forma más segura de no mezclar
  las tres toneladas.
