name:
  en: 'Joule per second'
symbol:
  tex: '\frac{J}{s}'
  text: 'J/s'
unitOf:
  - 'power'
system: 'si-derived'
compose:
  of:
    - unit: 'joule'
      exp: 1
    - unit: 'second'
      exp: -1
