description:
  en: >-
    The joule per second, symbol $\mathrm{J/s}$, is the SI derived unit of power written out from
    its definition: one joule of energy transferred, converted or delivered in each second. It is
    the same unit as the watt, the special name the SI gives to it, and it serves mechanics, heat
    transfer and electromagnetism alike.

    The watt, and with it the joule per second, goes back to a 1946 resolution of the CIPM, which
    defined the unit of power as the power that produces one joule of energy in one second. The SI
    Brochure lists the watt among the derived units with special names and expresses it in base
    units as the kilogram square metre per second cubed.

    Because the two names denote one unit, the conversion between them is exact and equal to one:
    a lamp drawing 60 joules per second draws 60 watts. OpenStax uses the identity to introduce power as the rate at which work is done. Running a
    device of one kilowatt for one hour delivers 3.6 million joules, the kilowatt hour on an
    electricity bill.

    Writing joules per second instead of watts keeps the meaning of power in view, which is why
    textbooks use it when a calculation divides an energy by a time, and why heat flow rates in
    thermodynamics are often quoted in it. In circuits, the product of a voltage in joules per
    coulomb and a current in coulombs per second comes out in joules per second, the electrical
    power dissipated or supplied.

    The symbol can also be written with a negative exponent, $\mathrm{J\,s^{-1}}$, and the plural is
    joules per second. In technical writing the watt is preferred; the longer name signals that a
    value was obtained as energy over time.
