# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Julio por mol y kelvin'
description: >-
  El julio por mol y kelvin, de símbolo $\mathrm{J/(mol\,K)}$, es la unidad SI derivada coherente
  de entropía molar y de capacidad calorífica molar, dos magnitudes distintas que comparten una
  misma dimensión. Es el julio dividido entre el mol y entre el kelvin, y no tiene nombre especial.

  El folleto del SI la incluye en su tabla de unidades derivadas coherentes cuyos nombres contienen
  una unidad con nombre especial, con la entropía molar y la capacidad calorífica molar como
  magnitudes; en unidades básicas es el kilogramo metro cuadrado por segundo al cuadrado, por mol y
  por kelvin. Una sustancia cuya entropía aumenta un julio por kelvin por cada mol presente tiene
  una entropía molar de un julio por mol y kelvin, y la misma lectura se aplica al calor necesario
  para calentar un mol un kelvin.

  Es también la unidad de la constante molar de los gases, que desde 2019 tiene el valor exacto
  $8.314\,462\,618\,153\,24\,\mathrm{J\,mol^{-1}\,K^{-1}}$. Como un intervalo de un kelvin equivale a
  uno de un grado Celsius, un valor en julios por mol y grado Celsius es numéricamente el mismo.

  Las tablas de entropías molares estándar se imprimen en esta unidad: en condiciones estándar, el
  grafito sólido tiene 5.740 julios por mol y kelvin, el agua líquida 70.0 y el vapor de agua 188.8.
  La variación de entropía de una reacción se obtiene de esos valores y, multiplicado por una
  temperatura en kelvin, un valor en esta unidad se convierte en una energía por mol, lo que la
  enlaza con el kilojulio por mol de la termoquímica.

  El símbolo puede escribirse J mol⁻¹ K⁻¹ o J K⁻¹ mol⁻¹. Con barra oblicua lleva paréntesis,
  J/(mol K), porque el SI no admite usar la barra más de una vez en una expresión sin paréntesis,
  como en J/mol/K. El plural es julios por mol y kelvin.
