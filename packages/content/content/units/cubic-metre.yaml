description:
  en: >-
    The cubic metre, symbol $\mathrm{m^{3}}$, is the coherent SI derived unit of volume: the volume
    of a cube whose edges each measure one metre. It suits large volumes such as tanks, reservoirs,
    rooms, excavated earth, concrete and freight, and it underlies density and flow units such as
    the kilogram per cubic metre and the cubic metre per second.

    The unit has no special name and follows directly from the metre. With a prefix the exponent
    covers the prefixed unit as a whole, so a cubic decimetre is a thousandth of a cubic metre and a
    cubic centimetre a millionth.

    The litre is a special name for the cubic decimetre, a status the 12th CGPM gave it in 1964,
    hence $1\,\mathrm{m^{3}}=1000\,\mathrm{L}$ exactly. The 1901 definition had made the litre the
    volume of one kilogram of pure water instead, and in 1960 the 11th CGPM noted that this volume
    and the cubic decimetre differed by about 28 parts per million. NIST Special Publication 811
    gives the US gallon as about $3.785\,412\times10^{-3}\,\mathrm{m^{3}}$ and the cubic foot as
    about 0.028 316 85 cubic metre.

    Engineering, construction, shipping and the metering of water and gas all work in cubic metres,
    while smaller volumes of liquids are usually quoted in litres.

    The 9th CGPM listed the symbol m³ in 1948, together with st for the stere, a volume unit then
    used for firewood. The symbol is written with a raised 3 and no full stop; abbreviations such as
    cc for the cubic centimetre are not allowed as symbols. American English spells the name cubic meter, and the plural is
    cubic metres.
