# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Mol'
namePlural: 'moles'
description: >-
  El mol, de símbolo $\mathrm{mol}$, es la unidad básica SI de cantidad de sustancia, la magnitud
  con la que la química cuenta en bloque átomos, moléculas, iones, electrones y otras entidades
  elementales. Una cantidad en moles exige siempre nombrar la entidad: un mol de átomos de oxígeno y
  un mol de moléculas de oxígeno son cantidades distintas del mismo elemento.

  Desde el 20 de mayo de 2019 un mol contiene exactamente $6.022\,140\,76\times10^{23}$ entidades
  especificadas. Ese número, el número de Avogadro, coincide con el valor de la constante de
  Avogadro expresada en moles a la menos uno. Con esta definición el mol ya no depende del
  kilogramo, lo que mantiene la cantidad de sustancia y la masa como magnitudes
  diferenciadas.

  La masa y la cantidad se relacionan mediante la masa molar: la masa molar de una sustancia es su
  masa atómica o molecular relativa multiplicada por la constante de masa molar, muy próxima a un
  gramo por mol. Unos 18 gramos de agua forman así un mol, del orden de seiscientos mil trillones de
  moléculas. La concentración de cantidad de sustancia se expresa en moles por metro cúbico o por
  litro, y el katal, un mol por segundo, mide la actividad catalítica.

  La unidad procede del átomo gramo y la molécula gramo de la química clásica, ligados a pesos
  atómicos referidos al principio al oxígeno. En 1959 y 1960 físicos y químicos acordaron asignar al
  carbono-12 una masa atómica relativa de exactamente 12, y en 1971 la 14.ª CGPM hizo del mol la
  séptima unidad básica del SI, definida al contar los átomos contenidos en doce gramos de
  carbono-12. La constante en la que se basa la definición actual honra a Amedeo Avogadro, que vivió
  de 1776 a 1856. El nombre y el símbolo coinciden, mol, pero el símbolo no admite plural.
