# yaml-language-server: $schema=../../dist/schemas/units.schema.json
name:
  en: 'Volt'
symbol:
  tex: 'V'
unitOf:
  - 'electric-potential'
  - 'electric-potential-difference'
  - 'electromotive-force'
system: 'si-derived'
compose:
  of:
    - unit: 'watt'
      exp: 1
    - unit: 'ampere'
      exp: -1
categories:
  - 'physics'
description:
  en: >-
    The volt (symbol: $V$) is the derived unit for electric potential, electric potential difference
    (voltage), and electromotive force. It is named after the Italian physicist Alessandro Volta
    (1745–1827).
