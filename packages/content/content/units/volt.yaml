name:
  en: 'Volt'
namePlural:
  en: 'volts'
symbol:
  tex: 'V'
unitOf:
  - 'electric-potential'
  - 'electric-potential-difference'
  - 'electromotive-force'
system: 'si-derived'
prefixes:
  - 'femto'
  - 'pico'
  - 'nano'
  - 'micro'
  - 'milli'
  - 'kilo'
  - 'mega'
  - 'giga'
  - 'tera'
compose:
  of:
    - unit: 'watt'
      exp: 1
    - unit: 'ampere'
      exp: -1
externalIds:
  wikidata: 'Q25250'
  qudt: 'http://qudt.org/vocab/unit/V'
categories:
  - 'physics'
