description:
  en: >-
    The newton second, symbol $\mathrm{N\,s}$, is the coherent SI derived unit of impulse: the
    impulse delivered by a constant force of one newton acting for one second. It serves equally
    as a unit of momentum, since an impulse changes the momentum of a body by the same amount.

    The unit is the product of the newton, the SI derived unit of force with a special name, and
    the second, the SI base unit of time; it has no special name of its own. Expressed in base
    units it is the kilogram metre per second, so one newton second equals exactly one kilogram
    metre per second.

    Physics texts generally write impulse in newton seconds and momentum in kilogram metres per
    second, which keeps the two quantities apart while letting the impulse-momentum theorem be
    checked unit by unit. The sign carries the direction along an axis: an impulse of a given size
    in the negative direction changes the motion in exactly the opposite way to an equal one in the
    positive direction. The pound-force second, the counterpart built on the pound-force, is
    exactly $4.448\,221\,615\,260\,5\,\mathrm{N\,s}$, the same number as the pound-force has
    newtons.

    The unit is used wherever a force acts for a measured time: a racket striking a ball, a
    seatbelt and airbag stopping a passenger, or an impact estimated from the change of momentum.

    The SI rules for compound symbols require a space or a half-high dot between the two symbols,
    so the forms $\mathrm{N\,s}$ and $\mathrm{N\cdot s}$ are correct. In the name, a space or a
    hyphen separates the two units, newton second or newton-second, and the plural is newton
    seconds.
