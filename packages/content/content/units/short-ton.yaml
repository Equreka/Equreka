description:
  en: >-
    The short ton is a unit of mass equal to 2000 avoirdupois pounds. It is the ton of the United
    States customary system, also called the net ton, and NIST names it as the ton most commonly
    used in the United States and Canada; the qualifier short separates it from the British long ton
    of 2240 pounds and from the metric tonne.

    Since the international pound became exactly 0.453 592 37 kilogram in 1959, the short ton is
    exactly $2000\,\mathrm{lb}=907.184\,74\,\mathrm{kg}$, which NIST Special Publication 811 rounds
    to 907.1847 kilograms. Canada's Weights and Measures Act defines its ton in the same way, as
    2000 pounds.

    The short ton is twenty short hundredweights of 100 pounds each. It is about nine tenths of a
    tonne, and the long ton is exactly 12 per cent heavier than it.

    According to NIST, an unqualified ton or hundredweight in the United States is understood as the
    2000-pound ton and the 100-pound hundredweight, and the words net or short are added only when
    the gross or long units might also be meant. In ocean shipping the position reverses: NIST
    notes that cargo there is mostly weighed in long or metric tons, with the short ton a rarity.

    NIST Handbook 44 makes tn the required abbreviation for the short ton on weighing and measuring
    devices from 1 January 2014, with devices built between 2008 and 2013 allowed another form. The
    tonne has its own symbol, t, and QUDT writes the short ton as ton{short}, so the full name is the
    safest way to avoid mixing the three tons.
