name:
  en: 'Unit'
symbol:
  tex: 'u'
unitOf:
  - 'dimensionless'
system: 'other'
toBase:
  factor: '1'
categories:
  - 'universal'
description:
  en: >-
    A unit of measure is a standardized quantity of a certain physical quantity, defined and adopted
    by convention or by law. Any value of a physical quantity can be expressed as a multiple of the
    unit of measure.
