description:
  en: >-
    The coulomb per mole, symbol $\mathrm{C/mol}$, is the coherent SI derived unit of electric
    charge per amount of substance. It is the coulomb, the SI unit of electric charge, divided by
    the mole, the base unit of amount of substance, and in base units it is the ampere second per
    mole. It has no special name, and its main use in chemistry is as the unit of the Faraday
    constant.

    A charge of one coulomb carried by every mole of specified entities, such as ions or electrons,
    is one coulomb per mole. Because both factors are SI units, the unit needs no numerical
    coefficient and fits the coherent equations of electrochemistry.

    The Faraday constant, the charge of one mole of elementary charges, is exactly the product of
    the Avogadro constant and the elementary charge, both fixed by the 2019 redefinition of the SI,
    which gives $96\,485.332\,123\,310\,018\,4\,\mathrm{C/mol}$. Electrolysis calculations use
    it to turn a measured charge, the current multiplied by the time, into moles of electrons
    transferred: a charge of 96 485 coulombs corresponds to about one mole of electrons, enough to
    deposit one mole of silver from a solution of silver ions.

    In the same unit, the charge carried by one mole of a singly charged ion such as sodium is one
    Faraday constant, and that of a triply charged ion such as chromium(III) three times as much, which is
    why the number of electrons in a half-reaction multiplies the constant in every electrolysis
    calculation. The symbol may also be written C mol⁻¹, and the plural is coulombs per mole.
