# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Henrio'
description: >-
  El henrio, de símbolo $\mathrm{H}$, es la unidad SI derivada coherente de inductancia, la
  propiedad por la que un circuito relaciona el flujo magnético con la corriente que lo recorre. Es
  una de las 22 unidades SI con nombre especial, equivale a un weber por amperio y en unidades
  básicas del SI es el kilogramo metro cuadrado por segundo al cuadrado y por amperio al cuadrado.

  El folleto del SI incluye el henrio en su tabla de unidades con nombre especial, expresado en
  otras unidades SI como el weber por amperio. La definición que adoptó el CIPM en 1946 describe la
  misma unidad mediante la inducción: un circuito cerrado tiene una inductancia de un henrio cuando
  una corriente que varía en él uniformemente un amperio por segundo produce una fuerza
  electromotriz de un voltio. Como el weber es un voltio segundo, el henrio es también el voltio
  segundo por amperio.

  El henrio mide tanto la autoinductancia como la inductancia mutua, el acoplamiento entre dos
  bobinas. Interviene además en la unidad de permeabilidad, el henrio por metro, en la que el
  folleto del SI da el valor que la permeabilidad magnética del vacío tuvo como exacto hasta 2019.

  Una bobina en la que una corriente que aumenta 50 amperios por segundo induce 20 milivoltios
  tiene una inductancia de $0.40\,\mathrm{mH}$, menos de una milésima de henrio. Los
  transformadores se construyen para lograr una inductancia mutua grande entre sus bobinas,
  mientras que las espiras de los sensores de los semáforos bajo la calzada y los detectores de
  metales de los aeropuertos funcionan detectando un cambio de inductancia.

  La unidad rinde homenaje al científico estadounidense Joseph Henry (1799-1878), que descubrió la
  fuerza electromotriz inducida con independencia de Michael Faraday. La 11.ª CGPM incluyó el
  henrio, con el símbolo $\mathrm{H}$, entre las unidades derivadas del SI en 1960. El nombre se
  escribe en minúscula y el símbolo es una H mayúscula.
