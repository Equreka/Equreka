description:
  en: >-
    The century is a unit of time of 100 years, outside the SI. For conversions it is taken as 100
    common years of 365 days, the convention also applied to the year and the decade. History,
    archaeology and astronomy use it to measure and name long stretches of time.

    No standard defines the century as a unit. A hundred times the 365-day year, which NIST Special
    Publication 811 tabulates as 31 536 000 seconds, gives 3 153 600 000 seconds, or 36 500 days.

    A span of 100 calendar years is longer. The Gregorian calendar makes every fourth year a leap
    year but skips the leap day in century years not divisible by 400, so 100 consecutive years
    hold 24 or 25 leap days, 36 524 or 36 525 days in all. Astronomers count time in Julian
    centuries of exactly 36 525 days, a unit that the footnotes to NIST Special Publication 811
    also state; the formulas for the lengths of the tropical year and the synodic month in the
    Explanatory Supplement to the Astronomical Almanac use it as their time variable.

    The Christian era begins with year 1 and has no year 0, so the first century runs from year 1
    to year 100 and the twentieth from 1901 to 2000.

    The symbol c also stands for the speed of light and, as a prefix, for centi, so writing the
    word in full avoids ambiguity. Ten decades make a century, and ten centuries a millennium.
