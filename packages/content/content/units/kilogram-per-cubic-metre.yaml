name:
  en: 'Kilogram per cubic metre'
symbol:
  tex: 'kg/m^{3}'
  text: 'kg/m³'
unitOf:
  - 'density'
system: 'si-derived'
compose:
  of:
    - unit: 'kilogram'
      exp: 1
    - unit: 'metre'
      exp: -3
externalIds:
  wikidata: 'Q844211'
  qudt: 'http://qudt.org/vocab/unit/KiloGM-PER-M3'
