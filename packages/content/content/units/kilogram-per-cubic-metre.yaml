description:
  en: >-
    The kilogram per cubic metre, symbol $\mathrm{kg/m^{3}}$, is the coherent SI derived unit of
    density, also called mass density: the density of a material of which one cubic metre has a
    mass of one kilogram. The SI Brochure gives it in its table of coherent derived units expressed
    in base units.

    It is the kilogram divided by the cube of the metre and carries no special name, so its
    definition rests directly on those of the two SI base units. The same unit measures mass
    concentration, the mass of a dissolved or suspended substance per volume of a mixture.

    One gram per cubic centimetre equals exactly $1000\,\mathrm{kg/m^{3}}$, and one gram per litre
    equals exactly one kilogram per cubic metre, since a litre is a thousandth of a cubic metre.
    NIST Special Publication 811 converts the pound per cubic foot to about 16.018 46 kilograms
    per cubic metre.

    The unit suits the densities met in everyday practice. Air at the freezing point of water and
    atmospheric pressure has a little over one kilogram per cubic metre, liquid water about
    $1000\,\mathrm{kg/m^{3}}$, and gold $1.93\times10^{4}\,\mathrm{kg/m^{3}}$, so a single unit
    covers gases, liquids and the densest metals without prefixes.

    The symbol may also be written with the metre raised to the exponent minus three, with a space
    or a half-high dot between the two symbols. The plural is kilograms per cubic metre.
