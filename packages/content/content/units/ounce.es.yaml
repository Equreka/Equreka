# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Onza'
description: >-
  La onza, de símbolo oz, es una unidad de masa del sistema consuetudinario estadounidense y del
  sistema imperial británico, igual a la dieciseisava parte de una libra. El nombre a secas designa
  la onza avoirdupois de las mercancías corrientes, distinta de la onza troy de los metales preciosos
  y de la onza líquida, que mide volumen.

  Como la libra internacional quedó fijada en 1959 en exactamente 0.453 592 37 kilogramos, la onza
  avoirdupois vale exactamente $28.349\,523\,125\,\mathrm{g}$. La publicación especial 811 del NIST
  la redondea a 28.349 52 gramos, y la ley de pesas y medidas de Canadá la define como la
  dieciseisava parte de una libra o 437½ granos.

  La onza equivale a 437.5 granos y se divide en 16 dracmas. La onza troy, usada para los metales
  preciosos, vale 480 granos, unos 31.103 gramos, y es igual a la onza de boticario. La onza líquida
  es una unidad de volumen: la estadounidense mide unos 29.573 mililitros y la imperial unos 28.413
  mililitros. La onza líquida imperial tiene el tamaño justo para contener una onza avoirdupois de
  agua medida a 62 °F, una coincidencia que, según el NIST, la onza líquida estadounidense no tiene.

  En el Reino Unido la onza troy es la única onza que todavía puede usarse sola en el comercio, para
  los metales preciosos; las demás mercancías deben llevar una cantidad métrica, y una cifra
  imperial solo se admite como indicación añadida y menos destacada. El manual 44 del NIST añade
  avdp, o la palabra avoirdupois, siempre que la onza avoirdupois deba distinguirse de la onza troy
  o de la de boticario.

  El NIST asocia la onza con la uncia romana, la doceava parte de la libra romana, aunque la uncia
  era menor que la posterior onza troy. La libra troy inglesa conservó esa división en 12 onzas,
  mientras que la libra avoirdupois tiene 16. El plural del nombre es onzas.
