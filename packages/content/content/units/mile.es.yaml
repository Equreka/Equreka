# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Milla'
description: >-
  La milla, de símbolo mi, llamada también milla terrestre o milla internacional, es la unidad de
  longitud de las distancias por carretera en el sistema imperial británico y en el sistema
  consuetudinario estadounidense. Equivale a 5280 pies o 1760 yardas y es una unidad distinta de la
  milla náutica de la navegación marítima y aérea.

  Como la yarda mide exactamente 0.9144 metros desde 1959, la milla queda fijada en
  $1\,\mathrm{mi}=1609.344\,\mathrm{m}$ exactos, el factor que da la publicación especial 811 del
  NIST. La ley de pesas y medidas de Canadá define su milla de la misma manera, como 1760 yardas.

  Las tablas de agrimensura del manual 44 del NIST dividen la milla en ocho furlongs, 80 chains o
  320 rods, nombres que se conservan en inglés. Un kilómetro son unas 0.62 millas. La milla náutica, de 1852 metros, equivale a unas 1.15
  millas terrestres según la NOAA.

  En el Reino Unido los límites de velocidad se indican en millas por hora, y una guía del Gobierno
  británico señala que la población sigue describiendo los paseos en millas y el consumo de
  combustible en millas por galón. Las señales de autopista suelen anunciar cada salida a una milla y a
  media milla.

  El NIST remonta la unidad a la milla romana de mil pasos, cada uno de cinco pies romanos, que llegó
  a Inglaterra durante la ocupación romana. Una ley de la reina Isabel I fijó la milla en 5280 pies,
  u ocho furlongs, y de esa ley procede el nombre inglés de statute mile. La milla estadounidense se
  basó durante mucho tiempo en el pie topográfico, lo que la hacía unos 3 milímetros más larga;
  desde finales de 2022 esa versión solo se conserva para trabajos históricos y heredados.
