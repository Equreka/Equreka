# yaml-language-server: $schema=../../dist/schemas/units.schema.json
name:
  en: 'Rankine'
symbol:
  tex: '°R'
unitOf:
  - 'thermodynamic-temperature'
system: 'other'
toBase:
  factor:
    num: '5'
    den: '9'
categories:
  - 'physics'
aliases:
  - 'degR'
description:
  en: >-
    Rankine is a very rarely used thermodynamic temperature scale and a unit for temperature
    measurement in the Imperial system, with the symbol $R$. The scale was proposed in the middle of
    the 19th century by a British physician and scientist W. J. Rankine. It is based on Fahrenheit
    scale and uses the common water freezing point as 459.67 $°R$ and water boiling point as 671.69
    $°R$.
