# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Galón imperial'
description: >-
  El galón imperial, escrito gal en las tablas del NIST o imp gal cuando hay que distinguirlo del
  galón estadounidense, es la unidad de volumen del sistema imperial británico y equivale
  exactamente a 4.546 09 litros. Es aproximadamente una quinta parte mayor que el galón de Estados
  Unidos, y en el sistema británico el mismo galón sirve para líquidos y para áridos.

  La publicación especial 811 del NIST da $4.546\,09\,\mathrm{L}$ como factor exacto para el galón
  de Canadá y del Reino Unido. La ley de pesas y medidas de Canadá lo expresa en metros cúbicos,
  como 454 609/100 000 000 metros cúbicos, y construye sobre él el resto de su tabla de volúmenes.

  Un galón imperial contiene cuatro cuartos de galón, ocho pintas o 160 onzas líquidas imperiales, y ocho
  galones forman un bushel. Según el NIST equivale a unos 1.201 galones estadounidenses, mientras que
  un galón estadounidense es unos 0.833 galones imperiales.

  La unidad sobrevive en el habla cotidiana británica sobre todo a través del consumo de
  combustible, que según una guía del Gobierno se sigue expresando con frecuencia en millas por
  galón, aunque el combustible, como la mayoría de las mercancías, debe venderse en unidades
  métricas.

  En su forma original de 1824, según relata el NIST, el galón imperial era el volumen de diez libras
  de agua a 62 °F, calculado en unas 277.42 pulgadas cúbicas. Ocupó el lugar de dos galones ingleses
  anteriores: una medida de 282 pulgadas cúbicas para la cerveza y otra menor, de 231 pulgadas
  cúbicas, para el vino, que las colonias americanas ya habían adoptado. Los textos legales actuales, como la ley canadiense, dan el galón
  directamente como un volumen fijo.
