# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Gauss'
description: >-
  El gauss, de símbolo $\mathrm{G}$, que a veces se escribe Gs, mide la densidad de flujo magnético,
  es decir, el campo magnético, en el sistema de unidades centímetro-gramo-segundo (CGS). No
  pertenece al SI, cuya unidad de densidad de flujo magnético es el tesla.

  La publicación especial 811 del NIST convierte el gauss al SI con el factor
  $1\,\mathrm{G}=10^{-4}\,\mathrm{T}$, que su apéndice B.8 marca como exacto. El factor enlaza dos
  sistemas distintos: el folleto del SI describe el CGS como un sistema coherente tridimensional
  basado en el centímetro, el gramo y el segundo, mientras que el SI toma además el amperio como
  unidad básica.

  Diez mil gauss forman un tesla, de modo que un militesla son diez gauss y un microtesla, una
  centésima de gauss. Su unidad compañera de flujo magnético, el maxwell, equivale exactamente a
  $10^{-8}\,\mathrm{Wb}$, y un gauss es un maxwell por centímetro cuadrado.

  Al ser menor que el tesla, el gauss todavía se usa a veces para campos débiles. El campo de la
  Tierra en su superficie es de alrededor de medio gauss, mientras que un escáner médico de
  resonancia magnética que trabaja a 1.5 teslas mantiene un campo de quince mil gauss.

  La unidad rinde homenaje a Carl Friedrich Gauss, que trabajó en matemáticas y en física. En
  1832 promovió el sistema métrico como sistema coherente para las ciencias, y fue el primero en medir el campo
  magnético de la Tierra en términos absolutos, con el milímetro, el gramo y el segundo. El propio
  sistema CGS lo introdujo en 1874 la Asociación Británica, una sociedad científica. El nombre
  de la unidad se escribe en minúscula.
