name:
  en: 'Inch'
symbol:
  tex: 'in'
unitOf:
  - 'length'
system: 'imperial'
toBase:
  factor: '0.0254'
categories:
  - 'physics'
description:
  en: >-
    The inch (symbol: in or ″) is a unit of length in the British imperial and the United States
    customary systems of measurement. It is equal to 1/36 yard or 1/12 of a foot. Derived from the
    Roman uncia ("twelfth"), the word inch is also sometimes used to translate similar units in
    other measurement systems, usually understood as deriving from the width of the human thumb.
