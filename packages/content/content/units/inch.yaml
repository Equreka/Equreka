description:
  en: >-
    The inch, symbol in, is a unit of length of the British imperial system and the United States
    customary system, equal to one twelfth of a foot. It is the smallest of the named everyday
    lengths in those systems and the working unit of machinists and of everyday rulers in the
    United States.

    The inch is exactly 25.4 millimetres, $1\,\mathrm{in}=25.4\,\mathrm{mm}$. The value follows
    from the international yard of 0.9144 metre, of which the inch is one thirty-sixth, and NIST
    Special Publication 811 lists 2.54 centimetres as an exact factor. Canada's Weights and Measures
    Act likewise defines its inch as one thirty-sixth of the yard.

    Twelve inches make a foot, thirty-six make a yard and 63 360 make a mile. A cubic inch is the
    building block of American liquid measure, since the U.S. gallon is defined as 231 cubic inches.

    NIST describes two traditions of subdividing the inch. Machinists, toolmakers, gauge makers and
    scientists split it decimally into tenths, hundredths and thousandths, down to millionths for
    precise work, while rulers for rougher measurement carry binary fractions such as halves,
    quarters and eighths, rarely finer than a sixty-fourth.

    The Roman foot was divided into twelve unciae, which NIST equates with inches. When the United
    States fixed the yard at 0.9144 metre in 1959, the Federal Register notice pointed out that the
    25.4-millimetre inch was not new: the federal aeronautics committee, NACA, had worked with it
    since 1952, and the American Standards Association had endorsed it for industrial conversion as
    early as 1933. The plural of the name is inches.
