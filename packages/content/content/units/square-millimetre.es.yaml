# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Milímetro cuadrado'
description: >-
  El milímetro cuadrado, de símbolo $\mathrm{mm^{2}}$, es una unidad de área igual al área de un
  cuadrado de un milímetro de lado. Es un submúltiplo decimal del metro cuadrado, la unidad SI
  coherente de área, y es la unidad habitual de las secciones pequeñas: los conductores de los
  cables eléctricos, los hilos, los tubos finos y las secciones de las probetas en los ensayos de
  materiales.

  En el SI un prefijo y su unidad forman un símbolo inseparable, de modo que el exponente eleva al
  cuadrado todo el milímetro: un milímetro cuadrado es el cuadrado de una milésima de metro,
  $1\,\mathrm{mm^{2}}=10^{-6}\,\mathrm{m^{2}}$ exactamente, una millonésima de metro cuadrado.

  Las unidades métricas de área del manual 44 del NIST avanzan por factores de cien, así que cien
  milímetros cuadrados forman un centímetro cuadrado y un metro cuadrado contiene un millón de
  milímetros cuadrados. La pulgada mide exactamente 25.4 milímetros según la publicación especial
  811 del NIST, lo que hace que una pulgada cuadrada sea exactamente 645.16 milímetros cuadrados.
  Una tensión de un newton por milímetro cuadrado equivale exactamente a un megapascal, y por eso
  los ingenieros expresan la resistencia del acero y del hormigón de cualquiera de las dos formas.

  Las normas de cables especifican los conductores con esta unidad. La norma internacional IEC
  60228, adoptada en Europa como EN IEC 60228:2024, fija secciones nominales de 0.5 a 3500
  milímetros cuadrados para los conductores de cables y cordones de energía. El circular mil, el
  área de un círculo de una milésima de pulgada de diámetro, es una unidad consuetudinaria que el
  NIST convierte en unos 0.000 506 7 milímetros cuadrados.

  El folleto del SI cita sq. mm, y su versión española mm cuad., como ejemplo de abreviatura que no
  puede sustituir al símbolo mm² ni al nombre de la unidad. En inglés estadounidense se escribe
  square millimeter, y el plural es milímetros cuadrados.
