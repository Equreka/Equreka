description:
  en: >-
    The farad, symbol $\mathrm{F}$, is the coherent SI derived unit of capacitance, the amount of
    charge a conductor or capacitor holds for each unit of potential difference across it. One
    farad is one coulomb per volt; in SI base units it is the second to the fourth power square
    ampere per kilogram per square metre.

    The CIPM definition of 1946 describes the farad as the capacitance of a capacitor whose plates
    show a potential difference of one volt when it is charged with one coulomb. Since a coulomb is
    an ampere second and a volt is a watt per ampere, the farad can also be written as a second per
    ohm, and the product of a resistance in ohms and a capacitance in farads is a time in seconds.
    The unit of permittivity, which describes how a medium affects the capacitance of conductors
    placed in it, is the farad per metre.

    One farad is a very large capacitance: a capacitor of that size would hold a whole coulomb at
    only one volt. Practical capacitors are therefore rated with prefixes: the largest
    common ones in millifarads and microfarads, the smallest in picofarads, $10^{-12}\,\mathrm{F}$. An empty
    parallel-plate capacitor of one farad with plates one millimetre apart would need square plates more than 10 kilometres across.

    The unit honours Michael Faraday (1791-1867), an English physicist known for his
    discoveries in electricity. The 11th CGPM listed the farad, symbol F, among the derived units
    of the SI in 1960. The plural is farads.
