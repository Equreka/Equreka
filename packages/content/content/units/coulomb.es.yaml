# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Culombio'
namePlural: 'culombios'
description: >-
  El culombio, de símbolo $\mathrm{C}$, es la unidad SI derivada coherente de carga eléctrica, la
  propiedad por la que los cuerpos se atraen o se repelen eléctricamente. Un culombio es la carga
  que transporta en un segundo una corriente constante de un amperio, por lo que en unidades
  básicas del SI es el amperio segundo.

  El CIPM adoptó esta definición en 1946 y llamó al culombio unidad de cantidad de electricidad.
  Desde la revisión del SI que entró en vigor en 2019, la carga elemental tiene el valor exacto
  $1.602\,176\,634\times10^{-19}\,\mathrm{C}$, y el amperio se define a partir de ella como la
  corriente que corresponde a un flujo del inverso de ese número de cargas elementales por segundo.
  Un culombio equivale por tanto a unas $6.241\,509\times10^{18}$ cargas elementales,
  un número exacto pero sin desarrollo decimal finito.

  La carga almacenada en un condensador es igual a la capacidad por la diferencia de potencial, de
  modo que un culombio es un faradio voltio, y un culombio que atraviesa una diferencia de
  potencial de un voltio gana o pierde un julio. Una batería de 12 voltios que mueve 5000 culombios
  por un circuito entrega así 60 kilojulios. El amperio hora equivale exactamente a 3600 culombios.

  Para la electrostática un culombio es una carga muy grande: un condensador que almacena un
  culombio con una diferencia de potencial de solo un voltio tiene una capacidad de un faradio
  entero, muy por encima de la de los condensadores habituales.

  La unidad rinde homenaje a Charles-Augustin de Coulomb (1736-1806), físico francés que mediante
  una balanza de torsión demostró, en memorias presentadas entre 1785 y 1791, que la fuerza entre
  cargas sigue una ley del inverso del cuadrado. La 11.ª CGPM incluyó el culombio, de símbolo C,
  entre las unidades derivadas del SI en 1960. El plural es culombios.
