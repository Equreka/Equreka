# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Gramo por centímetro cúbico'
description: >-
  El gramo por centímetro cúbico, de símbolo $\mathrm{g/cm^{3}}$, es la unidad de densidad del
  sistema centímetro-gramo-segundo (CGS): la densidad de un material del que un centímetro cúbico
  tiene una masa de un gramo. No es una unidad coherente del SI, pero sus dos partes son
  submúltiplos decimales de unidades del SI, el gramo del kilogramo y el centímetro del metro.

  Equivale exactamente a $1000\,\mathrm{kg/m^{3}}$, un factor que la publicación especial 811 del
  NIST marca como exacto en su apéndice B.8. Como el folleto del SI define el litro como un
  decímetro cúbico, un mililitro es un centímetro cúbico, y por tanto un gramo por centímetro
  cúbico es también un gramo por mililitro y un kilogramo por litro.

  La unidad resulta cómoda para líquidos y sólidos porque el kilogramo se fijó al principio como
  la masa de un decímetro cúbico de agua en su densidad máxima, de modo que el agua queda cerca
  de un gramo por centímetro cúbico. De ahí que las densidades en esta unidad casi coincidan con
  la densidad relativa respecto del agua: el aluminio tiene unos 2.70 gramos por centímetro
  cúbico y el oro unos $19.3\,\mathrm{g/cm^{3}}$.

  El sistema CGS al que pertenece la unidad fue introducido en 1874 por la Asociación Británica,
  una sociedad científica, sobre la base del centímetro, el gramo y el segundo, y buena parte
  del desarrollo posterior de la física experimental se apoyó en él.

  El símbolo puede escribirse también con exponente negativo; la abreviatura informal g/cc no
  sigue las reglas de los símbolos de unidades. El plural es gramos por centímetro cúbico.
