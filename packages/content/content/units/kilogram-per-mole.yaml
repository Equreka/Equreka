description:
  en: >-
    The kilogram per mole, symbol $\mathrm{kg/mol}$, is the coherent SI derived unit of molar mass,
    the mass of a substance divided by its amount of substance. The unit divides one SI base unit,
    the kilogram, by another, the mole, and has no special name.

    A substance has a molar mass of one kilogram per mole when one mole of its entities, exactly
    $6.022\,140\,76\times10^{23}$ of them since the 2019 redefinition of the mole, has a mass of one
    kilogram. Because both factors are base units, the unit needs no numerical coefficient and
    forms coherent equations with the other SI units.

    The unit is large for chemistry: one kilogram per mole equals 1000 grams per mole, and the
    molar masses of small molecules are a few grams to a few hundred grams per mole, so tables and
    textbooks quote them in grams per mole. The kilogram per mole appears instead in calculations
    that must stay in coherent SI units, such as the relation between the density, pressure and
    temperature of a gas, and in CODATA values. The molar mass constant has the CODATA 2022 value
    $1.000\,000\,001\,05(31)\times10^{-3}\,\mathrm{kg/mol}$, about one part in a thousand million
    above 0.001 kilograms per mole.

    From its adoption by the 14th General Conference on Weights and Measures in 1971 until 2019,
    the definition of the mole fixed the molar mass of carbon-12 at exactly 0.012 kilograms per
    mole; that value is now measured. The symbol may also be written kg mol⁻¹, and the plural is
    kilograms per mole.
