name:
  en: 'Kilogram per mole'
symbol:
  tex: 'kg/mol'
unitOf:
  - 'molar-mass'
system: 'si-derived'
compose:
  of:
    - unit: 'kilogram'
      exp: 1
    - unit: 'mole'
      exp: -1
externalIds:
  wikidata: 'Q28924753'
