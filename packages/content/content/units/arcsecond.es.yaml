# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Segundo de arco'
description: >-
  El segundo de arco es una unidad de ángulo plano igual a la sexagésima parte de un minuto de arco
  y, por tanto, a una de las 3600 partes en que se divide el grado. Es el paso más pequeño de la
  división sexagesimal del grado y una unidad no SI que el folleto del SI incluye para su uso junto
  al SI, donde recibe el nombre de segundo de ángulo plano.

  El folleto del SI define un segundo de arco como la sexagésima parte de un minuto de arco, lo que
  equivale a $\pi/648\,000$ radián. El factor es irracional y se lleva a las mismas 36 cifras
  significativas que el del grado, unos $4.848\times10^{-6}$ radián, algo menos de cinco
  microrradianes.

  Un grado contiene 3600 segundos de arco y una vuelta completa, 1 296 000. Un segundo de arco es
  aproximadamente el ángulo que subtiende una moneda de un par de centímetros vista a cuatro
  kilómetros, de ahí que la unidad sirva para ángulos muy pequeños.

  La astronomía usa segundos de arco para expresar posiciones, tamaños aparentes y paralajes de los
  objetos celestes, junto con el milisegundo, el microsegundo y el picosegundo de arco para ángulos
  aún menores, como recoge el folleto del SI. La geodesia y la topografía dan coordenadas con
  fracciones de segundo de arco, y la calidad de la imagen de un telescopio se expresa a menudo como
  su resolución en segundos de arco.

  El símbolo es la doble prima, ″, escrita justo después del número sin espacio, como en 30°22′8″;
  el folleto del SI también admite as, el símbolo que lleva prefijos en mas y μas. En texto plano,
  unas comillas rectas sustituyen a menudo a la doble prima. La palabra segundo sola también designa
  la unidad SI de tiempo, por lo que se usa segundo de arco cuando puede haber confusión.
