description:
  en: >-
    The reciprocal metre, symbol $\mathrm{m^{-1}}$, also called the inverse metre or per metre, is
    the coherent SI unit of quantities that count or change per unit length. The best known is the
    wavenumber, the number of wavelengths of a wave that fit in one metre; the Rydberg constant of
    atomic physics, attenuation coefficients and the curvature of a line are also expressed in it.

    It is the metre raised to the power minus one and has no special name. The SI Brochure lists it
    as the coherent unit of wavenumber in its table of derived units written in base units, and the
    13th CGPM, meeting in 1967 and 1968, added the wave number with the unit one per metre to the
    list of SI derived units through its Resolution 6.

    Spectroscopy often uses the reciprocal centimetre instead. A prefix belongs to the unit before
    the power is applied, so one reciprocal centimetre equals 100 reciprocal metres, not one
    hundredth of one. NIST Special Publication 811 also records the kayser, an older name for the
    reciprocal centimetre, as exactly 100 reciprocal metres.

    The values met in practice are often large. The Rydberg constant, the wavenumber scale of the
    hydrogen spectrum, is close to eleven million reciprocal metres. A curve with a radius of one metre has a
    curvature of one reciprocal metre.

    The symbol can be written as a negative power, $\mathrm{m^{-1}}$, or with a solidus, 1/m. Like
    every unit symbol it takes no plural ending and no full stop.
