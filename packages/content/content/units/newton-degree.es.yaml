# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Grado Newton'
description: >-
  El grado Newton, de símbolo °N, es la unidad de una escala histórica de temperatura que se
  remonta a la tabla de los grados de calor de Isaac Newton de 1701. Sitúa el 0 en el punto de
  congelación del agua y, en su lectura moderna, el 33 en el punto de ebullición. Queda fuera del
  SI.

  Las conversiones siguen esos dos puntos fijos: una lectura de 0 equivale a 0 grados Celsius y
  una lectura de 33 a 100 grados Celsius. Un grado Newton es, por tanto, exactamente 100/33 de
  kelvin, unos 3.03 kelvin; una temperatura en kelvin es 100/33 veces la lectura Newton más
  273.15, y el cero absoluto queda en unos -90.14 en la escala Newton.

  La tabla apareció en latín, sin nombre de autor, en las Philosophical Transactions de 1701. Para
  las temperaturas bajas se basaba en un termómetro lleno de aceite de linaza, marcado con 0 para
  el agua que empieza a congelarse y con 12 para el calor del cuerpo humano, con pasos iguales
  prolongados hacia arriba desde allí; el agua hirviendo quedaba en 33 a 34 y el plomo fundido en
  96, el límite superior de ese instrumento. Los grados más altos se dedujeron de los tiempos que
  tardaban en solidificarse y enfriarse trozos de metal sobre una barra de hierro al rojo, el
  razonamiento en que se basa la ley de enfriamiento de Newton.

  Los registros de la Royal Society solo anotan que el artículo se leyó el 28 de mayo de 1701. La
  atribución a Newton descansa en testimonios posteriores, entre ellos unos apuntes de David
  Gregory y una biografía de David Brewster, como expone un estudio de 1962 sobre el artículo.
