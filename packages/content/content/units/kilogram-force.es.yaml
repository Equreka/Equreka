# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Kilogramo fuerza'
description: >-
  El kilogramo fuerza, de símbolo $\mathrm{kgf}$, también llamado kilopondio, es una unidad de
  fuerza del sistema gravitatorio métrico: el peso de una masa de un kilogramo sometida a
  la aceleración normal de la gravedad. No es una unidad del SI, y el folleto del SI la califica de
  obsoleta.

  Un kilogramo fuerza equivale exactamente a $9.806\,65\,\mathrm{N}$, un factor que la publicación
  especial 811 del NIST marca como exacto en su apéndice B.8. La exactitud procede de la
  definición: la aceleración normal de la gravedad es un valor convencional y no medido, así que
  el kilogramo fuerza no varía con el lugar donde se pesa un cuerpo, aunque el peso real de una
  masa de un kilogramo sí lo haga.

  Las unidades derivadas de él se convierten con el mismo factor: el NIST da el kilogramo fuerza
  metro como exactamente $9.806\,65\,\mathrm{N\,m}$, y las mismas cifras, desplazadas una potencia
  de diez, convierten el kilogramo fuerza por centímetro cuadrado en pascales. La libra fuerza se
  define del mismo modo a partir de la libra avoirdupois, de manera que la razón entre ambas
  unidades de fuerza es igual a la razón entre la libra y el kilogramo.

  Su valor se apoya en una declaración de la 3.ª Conferencia General de Pesas y Medidas de 1901,
  que estableció que el peso es una fuerza, una masa por la aceleración de la gravedad, y adoptó
  $980.665\,\mathrm{cm/s^{2}}$ como valor normal de esa aceleración. Según el folleto del SI, el
  kilogramo fuerza se calculaba a partir de este valor acordado. El símbolo kp procede del nombre kilopondio, y el plural es kilogramos fuerza.
