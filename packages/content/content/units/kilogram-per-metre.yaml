description:
  en: >-
    The kilogram per metre, symbol $\mathrm{kg/m}$, is the coherent SI unit of linear mass density,
    the mass carried by each metre of a long, thin object such as a string, wire, cable, chain or
    fibre. It describes how heavy an object is along its length without regard to its total length
    or cross-section.

    The unit has no special name: it is the base unit kilogram over the base unit metre, and it is
    coherent in the sense of the SI Brochure because the combination carries no numerical factor
    other than one. A uniform string
    of 2 metres with a mass of 0.06 kilograms, an OpenStax example, has a linear density of 0.03
    kilograms per metre.

    One kilogram per metre equals 1000 grams per metre, or one gram per millimetre. The textile
    trade measures yarns and fibres in the tex, one gram per kilometre, so one kilogram per metre is
    a million tex. QUDT files the unit under the quantity kinds mass per length and lineic mass, and
    lists it among the units applicable to linear density.

    In physics the unit enters the speed of a transverse wave on a stretched string, which grows
    with the square root of the ratio of tension to linear density. OpenStax gives the high E string of a guitar
    as 0.000 309 kilograms per metre and the low E string as 0.005 78, a ratio close to 20: at equal tension a
    wave would run more than four times slower on the heavier string.

    The symbol may also be written $\mathrm{kg\,m^{-1}}$. In American English the name is spelled
    kilogram per meter, and the plural is kilograms per metre.
