# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Yarda'
description: >-
  La yarda, de símbolo yd, es una unidad de longitud del sistema imperial británico y del sistema
  consuetudinario estadounidense, igual a tres pies o treinta y seis pulgadas. Desde 1959 es la
  unidad a través de la cual el pie, la pulgada y la milla de ambos sistemas se ligan al metro.

  La yarda mide exactamente 0.9144 metros, $1\,\mathrm{yd}=0.914\,4\,\mathrm{m}$. Estados Unidos
  anunció este valor en un aviso del Federal Register vigente desde el 1 de julio de 1959; los
  institutos de metrología del Reino Unido, Canadá, Australia, Nueva Zelanda y Sudáfrica tomaron la
  misma cifra, que pasó a llamarse yarda internacional. La ley de pesas y medidas
  de Canadá la escribe como 9144/10 000 metros, y la publicación especial 811 del NIST la da como
  exacta.

  Una milla son 1760 yardas, una yarda cuadrada contiene nueve pies cuadrados y una yarda cúbica
  contiene veintisiete pies cúbicos. Un metro es algo más de una yarda y tres pulgadas.

  Las señales de tráfico británicas todavía cuentan en yardas las distancias cortas. El Departamento
  de Transporte describe placas que indican en yardas o en millas la distancia hasta un puente bajo,
  y balizas de cuenta atrás antes de una salida de autopista en las que cada barra representa unas
  100 yardas.

  El NIST considera incierto el origen de la yarda: puede proceder de un codo doble o de antiguas
  medidas de volumen. La yarda primitiva se dividía por mitades sucesivas en media yarda, palmo, dedo
  y uña, y las historias que la relacionan con la cintura o con el alcance del rey Enrique I
  reflejan probablemente actos de normalización. De 1893 a 1959 la yarda estadounidense midió
  3600/3937 metros, dos partes por millón más que la yarda actual.
