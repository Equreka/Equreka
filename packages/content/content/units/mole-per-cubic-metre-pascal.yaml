description:
  en: >-
    The mole per cubic metre pascal, symbol $\mathrm{mol/(m^{3}\,Pa)}$, is the coherent SI unit of
    the Henry's law solubility constant, the ratio of the concentration of a gas dissolved in a
    liquid to the partial pressure of that gas above it. It is a compound unit of solution
    chemistry with no special name.

    The unit is the mole divided by the cubic metre and by the pascal, so it follows from the
    definitions of these three SI units. QUDT lists it with the code MOL-PER-M3-PA and assigns it no
    named quantity kind, and dimensional analysis reduces it to the mole second squared per
    kilogram square metre.

    Rolf Sander's compilation of Henry's law constants for water, which gathers more than forty
    thousand values, states every constant in this unit as the solubility constant with the
    symbol $H^{cp}_{s}$, the aqueous concentration over the gas-phase partial pressure in the limit
    of infinite dilution. The same constant is often quoted in moles per litre and atmosphere: since
    a litre is a thousandth of a cubic metre and the standard atmosphere is 101 325 pascals, one
    mole per cubic metre pascal equals 101.325 moles per litre and atmosphere.

    The IUPAC recommendations on Henry's law constants describe eight variants of the Henry's law constant, some
    defined as a solubility and others as a volatility, the inverse ratio, which is measured in
    pascal cubic metres per mole; the unit tells which variant a table uses. Oxygen at
    298.15 kelvin has $1.3\times10^{-5}$ of this unit in Sander's compilation. The name is spelled
    mole per cubic meter pascal in American English, and the plural is moles per cubic metre pascal.
