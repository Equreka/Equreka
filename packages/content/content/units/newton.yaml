description:
  en: >-
    The newton, symbol $\mathrm{N}$, is the coherent SI derived unit of force, and therefore also
    of weight, the force with which gravity pulls on a body. One newton is the force that gives a
    mass of one kilogram an acceleration of one metre per second squared, so in SI base units it is
    the kilogram metre per second squared.

    The definition of the newton is Newton's second law applied to unit values: for a body of
    constant mass, force equals mass times acceleration, a special case of force as the rate of
    change of momentum. The newton, one of the 22 SI units with special names, has no standard of its
    own: it follows from the kilogram, the metre and the second, which
    since 2019 rest on fixed values of the caesium frequency, the speed of light and the Planck
    constant.

    Older force units are defined from the newton. The dyne of the CGS system equals exactly
    $10^{-5}\,\mathrm{N}$, the kilogram-force, the weight of one kilogram under standard gravity,
    equals exactly $9.806\,65\,\mathrm{N}$, and the pound-force is about 4.448 newtons. A mass of
    about 102 grams therefore weighs roughly one newton at the Earth's surface.

    The newton also builds other coherent units. The pascal is one newton per square metre, the
    joule is the work of one newton acting through one metre, and torque is expressed in newton
    metres; the brochure states that the joule is never used for torque, even though the two
    share a dimension.

    The CIPM defined the MKS unit of force in 1946, and the 9th CGPM ratified that definition in
    1948 and gave the unit the name newton. The 11th CGPM listed the newton, symbol N, among the
    derived units of the SI in 1960. The plural is newtons.
