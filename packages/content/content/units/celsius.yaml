description:
  en: >-
    The degree Celsius, symbol $^{\circ}\mathrm{C}$, is the unit of Celsius temperature, the
    everyday temperature scale of most countries, formerly called the centigrade scale. It is one
    of the SI derived units with a special name, and an interval of one degree Celsius is exactly
    as large as one kelvin, the base unit of thermodynamic temperature in the SI.

    The SI Brochure defines Celsius temperature as thermodynamic temperature minus a reference of
    273.15 kelvin, close to the freezing point of water:
    $t/^{\circ}\mathrm{C}=T/\mathrm{K}-273.15$, so absolute zero falls at -273.15 degrees Celsius
    and 293.15 kelvin reads as 20 degrees Celsius. When the 26th CGPM redefined the kelvin in 2018
    by fixing the Boltzmann constant, the degree Celsius took on that definition, since both its
    size and its zero are tied to the kelvin.

    Since the two units have equal size, a temperature difference carries the same number in both:
    warming by 15 degrees Celsius is warming by 15 kelvin. The offset matters only for a
    temperature itself, and the SI Brochure notes that the degree Celsius is coherent only when it
    expresses differences, so the ideal gas law and similar relations need kelvins.

    Calibrated thermometers follow the International Temperature Scale of 1990, adopted by the
    CIPM in 1989, which reports in both units.

    The Swedish astronomer Anders Celsius proposed a hundred-step scale between the boiling and
    freezing points of water in 1742, numbered with 0 at boiling and 100 at freezing; the numbering
    was reversed after his death in 1744. In 1948 the CIPM and the 9th CGPM preferred the name
    degree Celsius to degree centigrade and centesimal degree. A space separates the number from
    the symbol, as in $30.2\,^{\circ}\mathrm{C}$.
