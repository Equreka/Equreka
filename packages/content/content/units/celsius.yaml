description:
  en: >-
    The degree Celsius is a unit of temperature on the Celsius scale, a temperature scale originally
    known as the centigrade scale. The degree Celsius ($°C$) can refer to a specific temperature on
    the Celsius scale or a unit to indicate a difference or range between two temperatures.
