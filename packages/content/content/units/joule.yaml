description:
  en: >-
    The joule, symbol $\mathrm{J}$, is the coherent SI derived unit of energy, of work and of amount
    of heat. One joule is the energy transferred by a one-newton force whose point of application
    advances one metre along the line of that force; in SI base units it is the kilogram square
    metre per second squared. Kinetic, potential, internal and electrical energy are all measured
    in joules.

    The CIPM gave this definition in 1946, and the 9th CGPM in 1948 adopted the joule as the unit of
    quantity of heat, asking that calorimetric results be expressed in joules wherever possible.
    The joule is one of the five derived units named in the present definition of the SI, which
    fixes the Planck constant in joule seconds and the Boltzmann constant in joules per kelvin.

    A power of one watt delivers one joule each second, so the kilowatt hour equals exactly
    $3.6\times10^{6}\,\mathrm{J}$. The thermochemical calorie is exactly 4.184 joules, the erg of
    the CGS system is exactly one ten-millionth of a joule, and the electronvolt has been exactly
    $1.602\,176\,634\times10^{-19}\,\mathrm{J}$ since the elementary charge was fixed. Torque shares
    the dimension of energy, yet the SI Brochure states that the joule is never used for it; torque
    takes the newton metre.

    One joule is a small amount of energy on everyday scales, so electricity is sold in kilowatt
    hours, and larger quantities are often stated with prefixed units such as the kilojoule and
    the megajoule.

    The unit is named after the physicist James Prescott Joule (1818-1889), whose
    experiments on the mechanical equivalent of heat helped establish that heat is a form of
    energy. The plural is joules.
