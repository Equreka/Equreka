# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Pie libra'
description: >-
  El pie libra, o pie libra fuerza, es una unidad de energía y de trabajo del sistema
  consuetudinario estadounidense y del sistema imperial: el trabajo de una fuerza de una libra
  fuerza que desplaza su punto de aplicación un pie en su misma dirección. No es una unidad del SI,
  y su equivalente en el SI es el julio.

  Es el producto de dos unidades definidas de forma exacta. El pie mide 0.3048 metros, y la libra
  fuerza es el peso de una libra avoirdupois, 0.453 592 37 kilogramos, bajo la aceleración normal
  de la gravedad de 9.806 65 metros por segundo al cuadrado, exactamente 4.448 221 615 260 5
  newtons según las notas de la publicación especial 811 del NIST. Su producto da
  $1\,\mathrm{ft\,lbf}=1.355\,817\,948\,331\,400\,4\,\mathrm{J}$ exactamente, que el apéndice B.8
  redondea a 1.355 818 julios; QUDT guarda el mismo multiplicador.

  La aceleración normal de la gravedad en que se basa la libra fuerza procede de la 3.ª CGPM, que
  en 1901 adoptó 980.665 centímetros por segundo al cuadrado como su valor convencional.

  La energía y el momento de una fuerza comparten dimensión, y el NIST recoge la libra
  fuerza pie, lbf·ft, con el mismo factor respecto del newton metro. El folleto del SI mantiene
  separadas ambas magnitudes al no expresar nunca el momento en julios, y las tablas del NIST
  reflejan esa separación en sus nombres: pie libra fuerza para la energía, libra fuerza pie
  para el momento.

  El NIST escribe el símbolo ft·lbf. La forma abreviada ft·lb omite la f que indica fuerza, por
  lo que puede leerse como un producto de longitud y masa.
