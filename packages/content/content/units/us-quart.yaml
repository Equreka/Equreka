description:
  en: >-
    The U.S. quart, written qt or liq qt, is the liquid quart of the United States customary
    system, equal to a quarter of a U.S. gallon or 57.75 cubic inches, slightly less than a litre.
    It is one of three quarts in current use, beside the U.S. dry quart and the imperial quart.

    With the gallon defined as 231 cubic inches and the inch as exactly 25.4 millimetres, the quart
    is exactly $946.352\,946\,\mathrm{mL}$. NIST Special Publication 811 lists it, rounded, as
    0.946 352 9 litre.

    A liquid quart holds two pints, eight gills or 32 U.S. fluid ounces, and four quarts make a gallon.
    The imperial quart of the British system, about 1.136 litres, is divided into 40 smaller
    imperial fluid ounces and is roughly one fifth larger.

    The United States also has a dry quart for commodities sold by the bushel. It is 67.2006 cubic
    inches, about 1.101 litres, and 32 dry quarts make a bushel; NIST Handbook 44 asks for the words
    liquid or dry wherever the two quarts could be mistaken for each other. NIST lists this American
    split between liquid and dry measures among the differences from the British system, which uses
    a single set of capacity units.

    Like the U.S. gallon, the quart goes back to the English wine gallon that the American
    colonists adopted, so its size has stayed apart from the British quart since Britain moved to
    the imperial gallon in 1824. The forms US qt and liq qt mark it whenever another quart could be
    meant.
