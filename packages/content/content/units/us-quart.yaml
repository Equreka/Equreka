description:
  en: >-
    The quart (symbol: $qt$) is an English unit of volume equal to a quarter gallon. Three kinds of
    quarts are currently used: the liquid quart and dry quart of the US customary system and the
    imperial quart of the British imperial system. All are roughly equal to one liter. It is divided
    into two pints or (in the US) four cups. Historically, the exact size of the quart has varied
    with the different values of gallons over time and in reference to different commodities.
