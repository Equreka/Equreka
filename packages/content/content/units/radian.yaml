description:
  en: >-
    The radian, symbol $\mathrm{rad}$, is the coherent SI unit of plane angle, the amount of
    turning between two rays that meet at a point, and also of phase angle. It is one of the 22
    SI derived units with a special name and the angle unit of calculus and rotational mechanics.

    The SI Brochure defines one radian as the angle at the centre of a circle that intercepts an
    arc as long as the radius; equivalently, a right angle is a quarter of a full turn of
    $2\pi\,\mathrm{rad}$. Because an arc divided by a radius is a ratio of two lengths, the SI
    treats plane angle as a quantity with the unit one, while noting that angles differ in kind from
    other ratios of lengths. The symbol rad is written where it shows that an
    angle is meant; mathematics often leaves it out.

    A full turn of 360 degrees contains $2\pi\,\mathrm{rad}$, so one radian is about 57.3
    degrees; the degree is a non-SI unit accepted for use with the SI and defined from the radian.
    Angular velocity and angular frequency are expressed in radians per second. The brochure asks
    for angular frequencies in rad/s and frequencies in hertz, since mixing them up gives results
    wrong by the number of radians in a turn.

    Physics textbooks state angular positions as arc length over radius and tell readers to set
    calculators to radian mode before evaluating the motion of an oscillator.

    The 11th CGPM placed the radian and the steradian in a class of supplementary units when it
    established the SI in 1960. The CIPM read that class in 1980 as dimensionless derived units,
    and the 20th CGPM abolished it in 1995. The plural is radians.
