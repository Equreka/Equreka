description:
  en: >-
    The arcsecond, or second of arc, is a unit of plane angle equal to one sixtieth of an arcminute,
    and so one 3600th of a degree. It is the smallest step of the sexagesimal division of the degree
    and a non-SI unit that the SI Brochure lists for use alongside the SI, where it is named the
    second of plane angle.

    The SI Brochure defines one arcsecond as one sixtieth of an arcminute, which equals
    $\pi/648\,000$ radian. The factor is irrational and is carried to the same 36 significant digits
    as the degree, about $4.848\times10^{-6}$ radian, or a little under five microradians.

    A degree holds 3600 arcseconds and a full turn 1 296 000. An arcsecond is roughly the angle
    that a coin a couple of centimetres across subtends from a distance of four kilometres, which
    is why the unit suits very small angles.

    Astronomy uses arcseconds to express the positions, apparent sizes and parallaxes of celestial
    objects, together with the milliarcsecond, microarcsecond and picoarcsecond for still smaller
    angles, as the SI Brochure notes. Geodesy and surveying give coordinates to fractions of an
    arcsecond, and the quality of a telescope image is often quoted as its resolution in arcseconds.

    The symbol is the double prime, ″, written directly after the number with no space, as in
    30°22′8″; the SI Brochure also gives as, the symbol that takes prefixes in mas and μas. A
    straight double quotation mark often replaces the double prime in plain text. The word second
    alone also names the SI unit of time, so arcsecond or second of arc is used where confusion
    could arise.
