description:
  en: >-
    The mole per cubic metre second, symbol $\mathrm{mol/(m^{3}\,s)}$, is the coherent SI unit of a
    rate of change of amount concentration, and so of the rate of a chemical reaction: one mole per
    cubic metre of change in concentration in each second. It belongs to chemical kinetics and has
    no special name.

    The unit is the mole divided by the cube of the metre and by the second, all three SI base
    units, so its definition follows from theirs. IUPAC lists it as the SI unit of the rate of
    concentration change and of the rate of reaction based on amount concentration, the change of a
    concentration with time divided by the stoichiometric number of the species. The SI Brochure
    gives the same base-unit expression for the katal per cubic metre, the coherent unit of
    catalytic activity concentration, and QUDT files the unit under that quantity alone.

    The litre is a thousandth of a cubic metre, so one mole per litre second equals exactly 1000 of
    these units, and one millimole per litre second equals exactly one. Rates measured over minutes
    or hours convert by the number of seconds in each.

    Textbooks seldom quote reaction rates in this unit, preferring moles per litre second or per
    hour, but it is the unit in which rate equations balance without numerical factors when every
    quantity is taken in coherent SI units. The name is spelled mole per cubic meter second in
    American English, the symbol may be written mol m⁻³ s⁻¹, and the plural is moles per cubic
    metre second.
