# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Dalton'
description: >-
  El dalton, de símbolo $\mathrm{Da}$, llamado también unidad de masa atómica unificada, de símbolo
  u, es una unidad de masa que se usa para átomos, moléculas y partículas subatómicas. No es una
  unidad SI, pero el folleto del SI la admite junto al SI en su tabla 8 de unidades ajenas al
  sistema, y la química, la bioquímica y la física atómica expresan en ella las masas de partículas
  individuales.

  Doce daltons equivalen a la masa de un único átomo de carbono-12 libre de enlaces químicos, en
  reposo y sin excitar. Su valor en kilogramos es por tanto medido, no definido: el folleto del SI
  adopta el valor CODATA 2022 $1.660\,539\,068\,92(52)\times10^{-27}\,\mathrm{kg}$, que es la
  constante de masa atómica, con una incertidumbre típica relativa de $3.1\times10^{-10}$.

  Con una diferencia de alrededor de una parte en mil millones, la masa de un átomo o de una
  molécula en la unidad dalton tiene el mismo número que su masa molar en gramos por mol. Un protón tiene una masa de unos 1.00727 Da, un neutrón de
  unos 1.00866 y un electrón de unos 0.00055; una molécula de cloroformo tiene en promedio 119.37 Da,
  y una unidad fórmula de cloruro de sodio 58.44. Un mol de entidades de un dalton cada una tendría
  una masa muy próxima a un gramo, y así la unidad enlaza la masa de una sola partícula con las
  cantidades del laboratorio.

  La escala procede de un acuerdo alcanzado en 1959 y 1960 entre las uniones internacionales de
  física y de química, que hasta entonces usaban dos escalas ligeramente distintas basadas en el
  oxígeno, para asignar exactamente 12 a la masa atómica relativa del carbono-12. Los nombres
  dalton y unidad de masa atómica unificada son alternativos para la misma unidad, y muchos libros
  de texto escriben todavía uma, por unidad de masa atómica, para referirse a ella.
