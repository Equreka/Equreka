description:
  en: >-
    The imperial gallon, written gal in NIST's tables or imp gal when it must be told apart from
    the U.S. gallon, is the unit of volume of the British imperial system, exactly 4.546 09 litres.
    It is about one fifth larger than the U.S. gallon, and in the British system the same gallon
    serves for liquids and for dry goods.

    NIST Special Publication 811 gives $4.546\,09\,\mathrm{L}$ as an exact factor for the gallon of
    Canada and the United Kingdom. Canada's Weights and Measures Act states it in cubic metres, as
    454 609/100 000 000 cubic metre, and builds the rest of its volume table on it.

    One imperial gallon holds four quarts, eight pints or 160 imperial fluid ounces, and eight gallons
    make a bushel. According to NIST it equals about 1.201 U.S. gallons, while a U.S. gallon is about
    0.833 imperial gallon.

    The unit survives in British everyday speech mainly through fuel economy, which government
    guidance notes is still commonly discussed in miles per gallon, although fuel, like most goods,
    must be sold in metric units.

    In its original 1824 form, NIST relates, the imperial gallon was the volume of ten pounds of
    water at 62 °F, worked out as roughly 277.42 cubic inches. It took the place of two older English
    gallons: a 282-cubic-inch measure for ale and a smaller 231-cubic-inch one for wine, which the
    American colonies had already taken over. Present legal texts, such as the Canadian act, state the gallon directly as a fixed
    volume.
