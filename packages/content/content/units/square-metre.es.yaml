# yaml-language-server: $schema=../../dist/schemas/units.locale.schema.json
name: 'Metro cuadrado'
description: >-
  El metro cuadrado, de símbolo $\mathrm{m^{2}}$, es la unidad SI derivada coherente de área: el
  área de un cuadrado cuyos lados miden un metro cada uno. Cuantifica la superficie de viviendas y
  terrenos, la superficie de los objetos y las secciones transversales que intervienen en muchas
  magnitudes físicas.

  La unidad no tiene nombre especial. Es el metro multiplicado por sí mismo, de modo que su
  definición se deriva por completo de la del metro y del valor fijo de la velocidad de la luz.
  Cuando se usa un prefijo, el exponente afecta a toda la unidad con prefijo: un kilómetro cuadrado
  es un millón de metros cuadrados, $1\,\mathrm{km^{2}}=10^{6}\,\mathrm{m^{2}}$, y un centímetro
  cuadrado es la diezmilésima parte de un metro cuadrado.

  Para los terrenos, el folleto del SI recoge dos unidades decimales ajenas al SI, ambas adoptadas por el CIPM en 1879: la unidad llamada área, igual a 100 metros cuadrados, y
  la hectárea, $1\,\mathrm{ha}=10^{4}\,\mathrm{m^{2}}$. La publicación especial 811 del NIST da para
  el pie cuadrado exactamente 0.092 903 04 metros cuadrados y para el acre topográfico
  estadounidense unos 4046.873 metros cuadrados.

  El metro cuadrado expresa la superficie útil de viviendas y oficinas y el tamaño de los solares, y
  aparece en el denominador de muchas unidades coherentes: el pascal es un newton por metro
  cuadrado, la irradiancia se expresa en vatios por metro cuadrado y la luminancia en candelas por
  metro cuadrado.

  El símbolo se escribe con un 2 en superíndice y sin punto; abreviaturas como mm cuad.
  por el milímetro cuadrado no se admiten como símbolos. La 9.ª CGPM incluyó el símbolo entre los que confirmó en 1948. En inglés
  estadounidense el nombre se escribe square meter, y el plural es metros cuadrados.
