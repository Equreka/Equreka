description:
  en: >-
    The coulomb, symbol $\mathrm{C}$, is the coherent SI derived unit of electric charge, the
    property that makes bodies attract or repel one another electrically. One coulomb is the charge
    carried in one second by a steady current of one ampere, so in SI base units it is the ampere
    second.

    The CIPM adopted this definition in 1946, calling the coulomb the unit of quantity of
    electricity. Since the revision of the SI that took effect in 2019, the elementary charge has
    the exact value $1.602\,176\,634\times10^{-19}\,\mathrm{C}$, and the ampere is defined from it
    as the current corresponding to a flow of the reciprocal of that number of elementary charges
    per second. One coulomb therefore equals about $6.241\,509\times10^{18}$ elementary charges, a number that is exact but has no finite decimal expansion.

    Charge stored on a capacitor equals capacitance times potential difference, so one coulomb is
    one farad volt, and a coulomb moved through a potential difference of one volt gains or loses
    one joule. A 12-volt battery that moves 5000 coulombs through a circuit therefore delivers 60
    kilojoules. The ampere hour equals exactly 3600 coulombs.

    By the standards of electrostatics a coulomb is a very large charge: a capacitor that holds one
    coulomb at a potential difference of only one volt has a capacitance of a full farad, far
    beyond that of common capacitors.

    The unit honours Charles-Augustin de Coulomb (1736-1806), a French physicist who
    used a torsion balance to show, in papers presented between 1785 and 1791, that the force
    between charges follows an inverse square law. The 11th CGPM listed the coulomb, symbol C, among
    the derived units of the SI in 1960. The plural is coulombs.
