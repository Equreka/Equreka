description:
  en: >-
    The volt per metre, symbol $\mathrm{V/m}$, is the coherent SI derived unit of electric field
    strength. It is formed by dividing the volt, the unit of electric potential difference, by the
    metre, and in SI base units it is the kilogram metre per second cubed per ampere. It has no
    special name of its own.

    The SI Brochure lists the volt per metre in its table of coherent derived units whose names
    include units with special names, as the unit of electric field strength, and the 11th CGPM
    already named it among the derived units of the SI in 1960. A uniform field of one volt per
    metre is one in which the electric potential changes by one volt for every metre travelled
    along the field.

    The volt per metre is identical to the newton per coulomb, the form that follows from defining
    the field as force per unit charge: a volt is a joule per coulomb, and a joule divided by a
    metre is a newton. Large fields are often written with prefixes, and one megavolt per metre
    equals one kilovolt per millimetre.

    Typical values range widely. In fair weather the atmosphere near the ground carries 100 to 300
    volts per metre, and the field under a thunderstorm rises to thousands. Dielectric strengths
    of insulators are tabulated in megavolts per metre: dry air breaks down at about 3.0, paper at
    16 and mica at 118.

    The symbol may be written as a quotient, $\mathrm{V/m}$, or as a product with a negative
    exponent, $\mathrm{V\,m^{-1}}$; both forms are accepted under the SI rules for combining unit
    symbols. The plural is volts per metre.
