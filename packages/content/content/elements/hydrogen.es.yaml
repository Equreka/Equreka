# yaml-language-server: $schema=../../dist/schemas/elements.locale.schema.json
name: 'Hidrógeno'
description: >-
  El hidrógeno, de símbolo H y número atómico 1, es el más sencillo de los elementos químicos: su
  átomo consta de un protón y un electrón. Abre el periodo 1 de la tabla periódica y encabeza el
  grupo 1 en el bloque s, pero es un no metal cuya química se parece también a la de los halógenos
  del grupo 17, por lo que las tablas periódicas lo sitúan sobre el grupo 1, sobre ambos grupos o
  aparte.

  Su configuración electrónica del estado fundamental es $1s^{1}$. El único electrón ocupa la
  subcapa más baja, que un segundo electrón completaría, como ocurre en el helio. Arrancar ese
  electrón cuesta unos $13.6\,\mathrm{eV}$; es la única energía de ionización que tiene el
  hidrógeno, y lo que queda es el núcleo desnudo, un solo protón.

  El hidrógeno no tiene un peso atómico único. Como su composición isotópica varía de un material
  terrestre normal a otro, la CIAAW da su peso atómico estándar como el intervalo de 1.00784 a
  1.00811 en lugar de un valor con su incertidumbre, y ofrece 1.0080 como valor abreviado para el
  cálculo corriente.

  A temperatura ambiente y presión atmosférica el elemento es un gas de moléculas de H₂, la forma
  que las tablas NIST-JANAF toman como su estado de referencia termoquímico. El gas solo se licúa
  cuando se enfría muy por debajo de la temperatura ambiente: la ecuación de estado de referencia
  que el NIST adopta para el hidrógeno normal sitúa su punto de ebullición normal, a la presión
  atmosférica estándar, en $20.369\,\mathrm{K}$.
