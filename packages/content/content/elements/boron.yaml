description:
  en: >-
    Boron, symbol B, is the chemical element with atomic number 5, the first element of group 13
    and the first of the p-block in period 2. Its ground-state electron configuration is
    $[\mathrm{He}]\,2s^{2}\,2p^{1}$: three valence electrons occupy the second shell, two paired in
    the 2s subshell and one alone in a 2p orbital.

    That lone 2p electron sets boron apart from beryllium. Within a shell, a p electron lies higher
    in energy than an s electron and is easier to pull away, so the first ionization energy of
    boron, about $8.30\,\mathrm{eV}$, is lower than beryllium's although the boron nucleus carries
    one more proton. The three valence electrons come off at moderate cost, but the fourth
    ionization energy, which reaches the helium-like core, is almost seven times the third, a jump
    that marks where the valence electrons run out.

    CIAAW gives the standard atomic weight of boron as the interval from 10.806 to 10.821, with
    10.81 as the abridged value, since the proportions of its isotopes vary among normal materials.
    It also warns that boron on the market may have been isotopically altered, which can shift its
    atomic weight well outside the tabulated range.

    Boron is a solid at room temperature. At the bar, the standard pressure of the NIST-JANAF
    tables, it melts at $2350.000\,\mathrm{K}$, and the liquid boils at a temperature about 1.76
    times higher.
