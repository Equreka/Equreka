# yaml-language-server: $schema=../../dist/schemas/elements.locale.schema.json
name: 'Helio'
description: >-
  El helio, de símbolo He y número atómico 2, es el segundo y último elemento del periodo 1 y el
  primero de los gases nobles. Sus dos electrones llenan la subcapa 1s, lo que da
  la configuración electrónica del estado fundamental $1s^{2}$, de modo que por sus electrones
  pertenece al bloque s; aun así, las tablas periódicas lo colocan en el grupo 18, a la cabeza de
  los gases nobles, cuyas capas externas también están completas.

  Una capa llena retiene sus electrones. La primera energía de ionización del helio es de unos
  $24.6\,\mathrm{eV}$, casi el doble que la del hidrógeno, y arrancar el segundo electrón, que deja
  el núcleo desnudo, cuesta más del doble que el primero. El NIST da ese segundo valor a partir de
  la teoría y no de la medida, como hace con cada ion de un solo electrón del helio al neón.

  La CIAAW da el peso atómico estándar del helio como un único valor, 4.002602, con una
  incertidumbre de 0.000002, y 4.0026 como valor abreviado. Añade dos advertencias: algunos
  materiales geológicos y biológicos contienen helio cuya composición isotópica queda fuera del
  intervalo normal, y la dispersión que presenta el material terrestre normal limita la precisión
  con que puede darse el valor.

  A temperatura ambiente y presión atmosférica el helio es un gas de átomos sueltos, su estado de
  referencia en las tablas NIST-JANAF. Solo el enfriamiento muy cerca del cero absoluto lo vuelve
  líquido: la ecuación de estado de referencia que adopta el NIST sitúa su punto de ebullición
  normal en $4.2238\,\mathrm{K}$, más bajo incluso que el del hidrógeno.
