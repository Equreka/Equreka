description:
  en: >-
    Neon, symbol Ne, is the chemical element with atomic number 10, the noble gas that closes
    period 2 and the second member of group 18, after helium. Its ground-state electron
    configuration is $[\mathrm{He}]\,2s^{2}\,2p^{6}$: every one of its electrons is paired and the
    first and second shells are completely filled. That closed arrangement is the [Ne] core with
    which the configurations of the next period are abbreviated.

    Of all the elements of period 2, neon has the highest first ionization energy, about
    $21.56\,\mathrm{eV}$, the end point of the rise from lithium. NIST lists all ten of its
    ionization energies; they increase step by step through the eight electrons of the second
    shell, and the ninth, which reaches the helium-like core, is about five times the eighth. Two
    of the second-shell values come from a semi-empirical procedure and the two core values from
    calculation.

    CIAAW gives the standard atomic weight of neon as a single value, 20.1797 with an uncertainty
    of 0.0006, and 20.180 as the abridged value. Its notes add that some geological and biological
    materials hold neon of unusual isotopic composition and that commercially supplied neon may have been
    isotopically altered.

    At room temperature and atmospheric pressure neon is a gas of single atoms, the reference state
    the NIST-JANAF tables give it. The reference equation of state that NIST adopts for neon sets
    its normal boiling point at $27.1000\,\mathrm{K}$, above those of helium and hydrogen but far
    below those of the other gases of period 2.
