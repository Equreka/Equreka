description:
  en: >-
    Oxygen, symbol O, is the chemical element with atomic number 8, the head of group 16, the
    chalcogens, also called the oxygen family, and an element of the p-block in period 2. Its
    ground-state electron configuration is $[\mathrm{He}]\,2s^{2}\,2p^{4}$: one 2p orbital holds a
    pair of electrons with opposite spins and the other two hold one electron each, so the atom has
    two unpaired electrons.

    That paired electron lowers the first ionization energy of oxygen, about
    $13.62\,\mathrm{eV}$, slightly below nitrogen's, against the general rise across the period:
    taking it away removes the repulsion between the pair and leaves a half-filled 2p subshell.
    Oxygen holds eight electrons in all, and NIST lists an ionization energy for each. They climb
    steadily while the second shell empties, then jump once the helium-like core is reached: the
    seventh value is more than five times the sixth.

    CIAAW gives the standard atomic weight of oxygen as the interval from 15.99903 to 15.99977,
    reflecting variation in its isotopic composition among normal materials, and 15.999 as the
    abridged value. It also warns that oxygen sold commercially may carry an altered isotopic
    composition.

    At room temperature and atmospheric pressure oxygen is a gas of O₂ molecules, the form that the
    NIST-JANAF tables use as its reference state. The reference equation of state that NIST adopts
    for oxygen puts its normal boiling point at $90.1878\,\mathrm{K}$, a little above those of
    nitrogen and fluorine, its neighbours in the period.
