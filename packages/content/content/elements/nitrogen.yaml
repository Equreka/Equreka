description:
  en: >-
    Nitrogen, symbol N, is the chemical element with atomic number 7, the head of group 15, whose
    members are called the pnictogens, and an element of the p-block in period 2. Its ground-state
    electron configuration is $[\mathrm{He}]\,2s^{2}\,2p^{3}$: by Hund's rule each of the three 2p
    electrons takes an orbital of its own, all with the same spin, so the 2p subshell is exactly
    half full.

    A half-filled subshell is a comparatively stable arrangement, and the ionization energies show
    it. The first ionization energy of nitrogen, about $14.53\,\mathrm{eV}$, is higher than that of
    oxygen, the next element, even though oxygen has one more proton. In oxygen the fourth 2p
    electron has to share an orbital, and losing it relieves the repulsion between the paired
    electrons. NIST derives the second and third ionization energies of nitrogen by a
    semi-empirical procedure and the last two from calculation; the sixth, which reaches the
    helium-like core, is more than five times the fifth.

    The isotopic composition of nitrogen varies among normal materials, so CIAAW states its
    standard atomic weight as the interval from 14.00643 to 14.00728, with 14.007 as the abridged
    value, and notes that commercial nitrogen may have been isotopically modified.

    At room temperature and atmospheric pressure nitrogen is a gas of N₂ molecules, the reference
    state that the NIST-JANAF tables assign to the element. According to the reference equation of
    state that NIST adopts, the gas condenses to a liquid at standard atmospheric pressure at
    $77.355\,\mathrm{K}$.
