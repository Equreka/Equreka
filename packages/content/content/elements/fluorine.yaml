description:
  en: >-
    Fluorine, symbol F, is the chemical element with atomic number 9, the first of the halogens of
    group 17 and an element of the p-block in period 2. Its ground-state electron configuration is
    $[\mathrm{He}]\,2s^{2}\,2p^{5}$: seven valence electrons, a single electron short of the filled
    second shell of neon, leave exactly one 2p orbital with an unpaired electron. The halogens share
    these seven valence electrons, which is why they behave alike.

    Its first ionization energy, about $17.42\,\mathrm{eV}$, is higher than oxygen's and resumes the
    rise across the period. NIST lists all nine ionization energies of fluorine: the third, fourth
    and fifth come from a semi-empirical procedure and the last two from calculation. The values
    grow while electrons leave the second shell, and the eighth, the first to reach the helium-like
    core, is more than five times the seventh.

    Fluorine is one of the elements whose standard atomic weight is fixed by a single stable
    isotope. CIAAW therefore gives it as one value known to great precision, 18.998403162 with an
    uncertainty of 0.000000005, alongside the abridged value 18.998.

    At room temperature and atmospheric pressure fluorine is a gas of F₂ molecules, its reference
    state in the NIST-JANAF tables. The reference equation of state that NIST adopts for fluorine
    places its normal boiling point at $85.0368\,\mathrm{K}$, between those of nitrogen and oxygen.
