# yaml-language-server: $schema=../../dist/schemas/elements.locale.schema.json
name: 'Nitrógeno'
description: >-
  El nitrógeno, de símbolo N y número atómico 7, es el primero del grupo 15,
  cuyos miembros se llaman pnictógenos, y un elemento del bloque p en el periodo 2. Su configuración
  electrónica del estado fundamental es $[\mathrm{He}]\,2s^{2}\,2p^{3}$: según la regla de Hund,
  cada uno de los tres electrones 2p ocupa su propio orbital, todos con el mismo espín, de modo que
  la subcapa 2p queda exactamente a medio llenar.

  Una subcapa a medio llenar es una disposición relativamente estable, y las energías de ionización
  lo reflejan. La primera energía de ionización del nitrógeno, de unos $14.53\,\mathrm{eV}$, es
  mayor que la del oxígeno, el elemento siguiente, aunque el oxígeno tiene un protón más. En el
  oxígeno el cuarto electrón 2p tiene que compartir orbital, y perderlo alivia la repulsión entre
  los electrones apareados. El NIST obtiene la segunda y la tercera energías de ionización del
  nitrógeno por un procedimiento semiempírico y las dos últimas por cálculo; la sexta, que alcanza
  el núcleo de tipo helio, es más de cinco veces la quinta.

  La composición isotópica del nitrógeno varía entre los materiales normales, por lo que la CIAAW
  da su peso atómico estándar como el intervalo de 14.00643 a 14.00728, con 14.007 como valor
  abreviado, y advierte de que el nitrógeno comercial puede tener la composición isotópica
  modificada.

  A temperatura ambiente y presión atmosférica el nitrógeno es un gas de moléculas de N₂, el estado
  de referencia que las tablas NIST-JANAF asignan al elemento. Según la ecuación de estado de
  referencia que adopta el NIST, el gas se condensa en líquido a la presión atmosférica estándar a
  $77.355\,\mathrm{K}$.
