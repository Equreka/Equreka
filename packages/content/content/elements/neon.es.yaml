# yaml-language-server: $schema=../../dist/schemas/elements.locale.schema.json
name: 'Neón'
description: >-
  El neón, de símbolo Ne y número atómico 10, es el gas noble que cierra el periodo 2 y el segundo miembro del grupo 18, después del helio. Su configuración electrónica del
  estado fundamental es $[\mathrm{He}]\,2s^{2}\,2p^{6}$: todos sus electrones están apareados y la
  primera y la segunda capas están completamente llenas. Esa disposición cerrada es el núcleo [Ne]
  con el que se abrevian las configuraciones del periodo siguiente.

  De todos los elementos del periodo 2, el neón tiene la primera energía de ionización más alta, de
  unos $21.56\,\mathrm{eV}$, el punto final del ascenso que empieza en el litio. El NIST da sus diez
  energías de ionización; aumentan paso a paso a lo largo de los ocho electrones de la segunda capa,
  y la novena, que alcanza el núcleo de tipo helio, es unas cinco veces la octava. Dos de los
  valores de la segunda capa proceden de un procedimiento semiempírico y los dos del núcleo, del
  cálculo.

  La CIAAW da el peso atómico estándar del neón como un único valor, 20.1797 con una incertidumbre
  de 0.0006, y 20.180 como valor abreviado. Sus notas añaden que algunos materiales geológicos y
  biológicos contienen neón de composición isotópica inusual y que el neón comercial puede tener la
  composición isotópica alterada.

  A temperatura ambiente y presión atmosférica el neón es un gas de átomos sueltos, el estado de
  referencia que le dan las tablas NIST-JANAF. La ecuación de estado de referencia que el NIST
  adopta para el neón fija su punto de ebullición normal en $27.1000\,\mathrm{K}$, por encima de los
  del helio y el hidrógeno pero muy por debajo de los de los demás gases del periodo 2.
