name: 'Litio'
meltingPoint:
  note: 'A 100 kPa (1 bar)'
boilingPoint:
  note: 'A 100 kPa (1 bar)'
description: >-
  El litio, de símbolo Li y número atómico 3, es el primer elemento del periodo 2 y el más ligero de los metales alcalinos, los elementos del grupo 1 salvo el hidrógeno.
  Su configuración electrónica del estado fundamental es $[\mathrm{He}]\,2s^{1}$: dos electrones
  internos repiten la configuración del helio y un electrón de valencia inicia la segunda capa en
  la subcapa 2s, lo que sitúa al litio en el bloque s.

  Ese único electrón de valencia está débilmente retenido. La primera energía de ionización del
  litio es de unos $5.39\,\mathrm{eV}$, menos de la cuarta parte del valor del helio, mientras que
  la segunda, que debe penetrar en el núcleo de tipo helio, es unas catorce veces la primera. Todos
  los metales alcalinos tienen este único electrón de valencia, y compartir el número de electrones
  de valencia es lo que hace que los miembros de un grupo reaccionen de forma parecida: cada metal
  alcalino forma con el hidrógeno un compuesto que contiene un átomo del metal por cada átomo de
  hidrógeno.

  La CIAAW da el peso atómico estándar del litio como el intervalo de 6.938 a 6.997, con 6.94 como
  valor abreviado, y advierte de que el litio comercial puede tener la composición isotópica
  alterada, de modo que su peso atómico se aparte bastante del tabulado.

  El litio es un metal sólido a temperatura ambiente. Las tablas NIST-JANAF, cuya presión estándar
  es el bar, algo inferior a la atmosférica, sitúan la fusión del cristal en $453.690\,\mathrm{K}$
  y la ebullición del líquido a una temperatura más de tres veces y media mayor.
