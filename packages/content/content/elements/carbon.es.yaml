# yaml-language-server: $schema=../../dist/schemas/elements.locale.schema.json
name: 'Carbono'
description: >-
  El carbono, de símbolo C y número atómico 6, es el primero del grupo 14 y el segundo elemento del
  bloque p en el periodo 2. Su configuración electrónica del estado
  fundamental es $[\mathrm{He}]\,2s^{2}\,2p^{2}$, con cuatro electrones de valencia en la segunda
  capa, a medio camino de la capa completa del neón.

  Los dos electrones 2p siguen la regla de Hund: entre orbitales de igual energía, la disposición
  más estable deja sin aparear tantos electrones como sea posible, así que ocupan dos orbitales 2p
  distintos con el mismo espín, y el átomo en su estado fundamental tiene dos electrones
  desapareados. La primera energía de ionización del carbono, de unos $11.26\,\mathrm{eV}$,
  continúa el ascenso del periodo desde el boro. Sus cuatro electrones de valencia salen uno tras
  otro con un coste creciente, pero la quinta energía de ionización, que penetra en el núcleo de
  tipo helio, es unas seis veces la cuarta; el NIST da los dos últimos valores por cálculo.

  La composición isotópica del carbono varía entre los materiales naturales, por lo que la CIAAW da
  su peso atómico estándar como el intervalo de 12.0096 a 12.0116 y ofrece 12.011 como valor
  abreviado. A diferencia de varios de sus vecinos del periodo 2, el carbono no lleva la advertencia
  de la CIAAW sobre material comercial con la composición isotópica modificada.

  El carbono es un sólido a temperatura ambiente y presión normal: el NIST Chemistry WebBook tabula
  su entropía estándar para el sólido a la presión estándar, el bar, y menciona el grafito y el diamante
  entre las formas del elemento.
