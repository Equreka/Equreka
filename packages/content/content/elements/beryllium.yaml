description:
  en: >-
    Beryllium, symbol Be, is the chemical element with atomic number 4, the second element of
    period 2 and the lightest of the alkaline earth metals of group 2. Its ground-state electron
    configuration is $[\mathrm{He}]\,2s^{2}$: two valence electrons fill the 2s subshell above a
    helium-like core and complete the s-block of the period. The alkaline earth metals share this
    pair of s electrons, and each forms a compound with hydrogen that holds two hydrogen atoms per
    atom of the metal.

    The first ionization energy, about $9.32\,\mathrm{eV}$, exceeds that of lithium, as expected
    across a period, since the nucleus gains a proton while the new electron joins the same shell.
    The third value, which has to reach into the helium-like core, is more than eight times the
    second. Boron, the next element, breaks the rising trend with a lower first ionization energy,
    because its outermost electron is the first in its period to enter a 2p subshell.

    Beryllium is one of the elements whose standard atomic weight rests on a single stable isotope,
    and CIAAW accordingly states it as one precise value, 9.0121831 with an uncertainty of
    0.0000005, and 9.0122 as the abridged value.

    It is a solid metal at room temperature. At the standard pressure of the NIST-JANAF tables, the
    bar, its crystal changes from the alpha to the beta structure shortly before it melts at
    $1560.000\,\mathrm{K}$, and the liquid boils at a temperature about 1.76 times the melting
    point.
