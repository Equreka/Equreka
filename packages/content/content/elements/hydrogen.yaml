description:
  en: >-
    Hydrogen, symbol H, is the chemical element with atomic number 1 and the simplest of all: its
    atom consists of one proton and one electron. It opens period 1 of the periodic table and heads
    group 1 in the s-block, yet it is a nonmetal whose chemistry also resembles that of the halogens
    in group 17, so periodic tables print it above group 1, above both groups, or set apart.

    Its ground-state electron configuration is $1s^{1}$. The lone electron occupies the lowest
    subshell, which a second electron would complete, as happens in helium. Stripping that electron
    away takes about $13.6\,\mathrm{eV}$; it is the only ionization energy hydrogen has, and what
    remains is the bare nucleus, a single proton.

    Hydrogen has no single atomic weight. Because its isotopic composition varies from one normal
    terrestrial material to another, CIAAW states its standard atomic weight as the interval from
    1.00784 to 1.00811 instead of as one value with an uncertainty, and lists 1.0080 as the shorter
    abridged value for everyday calculation.

    At room temperature and atmospheric pressure the element is a gas of H₂ molecules, the form
    that the NIST-JANAF tables take as its thermochemical reference state. The gas liquefies only
    when cooled far below room temperature: the reference equation of state that NIST adopts for
    normal hydrogen places its normal boiling point, at standard atmospheric pressure, at
    $20.369\,\mathrm{K}$.
