# yaml-language-server: $schema=../../dist/schemas/elements.locale.schema.json
name: 'Oxígeno'
description: >-
  El oxígeno, de símbolo O y número atómico 8, es el primero del grupo 16, el
  de los calcógenos, también llamado familia del oxígeno, y un elemento del bloque p en el periodo
  2. Su configuración electrónica del estado fundamental es $[\mathrm{He}]\,2s^{2}\,2p^{4}$: un
  orbital 2p contiene un par de electrones con espines opuestos y los otros dos contienen un
  electrón cada uno, de modo que el átomo tiene dos electrones desapareados.

  Ese electrón apareado rebaja la primera energía de ionización del oxígeno, de unos
  $13.62\,\mathrm{eV}$, un poco por debajo de la del nitrógeno, contra la tendencia del periodo:
  arrancarlo elimina la repulsión dentro del par y deja una subcapa 2p a medio llenar. El NIST da
  una energía de ionización para cada uno de los ocho electrones. Suben con regularidad mientras se
  vacía la segunda capa y luego saltan al llegar al núcleo de tipo helio: el séptimo valor es más
  de cinco veces el sexto.

  La CIAAW da el peso atómico estándar del oxígeno como el intervalo de 15.99903 a 15.99977, por la
  variación de su composición isotópica entre los materiales normales, y 15.999 como valor
  abreviado. Advierte además de que el oxígeno comercial puede tener la composición isotópica
  alterada.

  A temperatura ambiente y presión atmosférica el oxígeno es un gas de moléculas de O₂, la forma que
  las tablas NIST-JANAF usan como su estado de referencia. La ecuación de estado de referencia que
  el NIST adopta para el oxígeno sitúa su punto de ebullición normal en $90.1878\,\mathrm{K}$, algo
  por encima de los del nitrógeno y el flúor, sus vecinos en el periodo.
