description:
  en: >-
    Lithium, symbol Li, is the chemical element with atomic number 3, the first element of period
    2 and the lightest of the alkali metals, the group 1 elements other than hydrogen. Its
    ground-state electron configuration is $[\mathrm{He}]\,2s^{1}$: two core electrons repeat the
    configuration of helium, and one valence electron starts the second shell in the 2s subshell,
    which places lithium in the s-block.

    That single valence electron is loosely held. The first ionization energy of lithium is about
    $5.39\,\mathrm{eV}$, less than a quarter of the value for helium, while the second, which has
    to break into the helium-like core, is about fourteen times the first. Every alkali metal has
    this one valence electron, and a shared count of valence electrons is what makes the members of
    a group react alike: each alkali metal forms a compound with hydrogen that holds one atom of the
    metal per hydrogen atom.

    CIAAW gives the standard atomic weight of lithium as the interval from 6.938 to 6.997, with
    6.94 as the abridged value, and warns that lithium sold commercially may have had its isotopic
    composition altered, so that its atomic weight departs considerably from the tabulated one.

    Lithium is a solid metal at room temperature. The NIST-JANAF tables, whose standard pressure is
    the bar, a little below atmospheric pressure, put the melting of the crystal at
    $453.690\,\mathrm{K}$ and the boiling of the liquid at a temperature more than three and a half
    times higher.
