name: 'Berilio'
meltingPoint:
  note: 'A 100 kPa (1 bar)'
boilingPoint:
  note: 'A 100 kPa (1 bar)'
description: >-
  El berilio, de símbolo Be y número atómico 4, es el segundo elemento del periodo 2 y el más
  ligero de los metales alcalinotérreos del grupo 2. Su configuración electrónica
  del estado fundamental es $[\mathrm{He}]\,2s^{2}$: dos electrones de valencia llenan la subcapa 2s
  sobre un núcleo de tipo helio y completan el bloque s del periodo. Los metales alcalinotérreos
  comparten este par de electrones s, y cada uno forma con el hidrógeno un compuesto que contiene
  dos átomos de hidrógeno por cada átomo del metal.

  La primera energía de ionización, de unos $9.32\,\mathrm{eV}$, supera la del litio, como cabe
  esperar a lo largo de un periodo, porque el núcleo gana un protón mientras el nuevo electrón entra
  en la misma capa. El tercer valor, que tiene que alcanzar el núcleo de tipo helio, es más de ocho
  veces el segundo. El boro, el elemento siguiente, rompe la tendencia creciente con una primera
  energía de ionización menor, porque su electrón más externo es el primero de su periodo en entrar
  en una subcapa 2p.

  El berilio es uno de los elementos cuyo peso atómico estándar descansa en un único isótopo
  estable, y por eso la CIAAW lo da como un solo valor preciso, 9.0121831 con una incertidumbre de
  0.0000005, y 9.0122 como valor abreviado.

  Es un metal sólido a temperatura ambiente. A la presión estándar de las tablas NIST-JANAF, el bar,
  su cristal pasa de la estructura alfa a la beta poco antes de fundirse a $1560.000\,\mathrm{K}$, y
  el líquido hierve a una temperatura de unas 1.76 veces el punto de fusión.
