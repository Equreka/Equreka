name: 'Boro'
meltingPoint:
  note: 'A 100 kPa (1 bar)'
boilingPoint:
  note: 'A 100 kPa (1 bar)'
description: >-
  El boro, de símbolo B y número atómico 5, es el primer elemento del grupo 13 y el primero del
  bloque p en el periodo 2. Su configuración electrónica del estado fundamental
  es $[\mathrm{He}]\,2s^{2}\,2p^{1}$: tres electrones de valencia ocupan la segunda capa, dos
  apareados en la subcapa 2s y uno solo en un orbital 2p.

  Ese electrón 2p aislado distingue al boro del berilio. Dentro de una capa, un electrón p tiene más
  energía que un electrón s y es más fácil de arrancar, de modo que la primera energía de ionización
  del boro, de unos $8.30\,\mathrm{eV}$, es menor que la del berilio aunque el núcleo del boro tiene
  un protón más. Los tres electrones de valencia salen con un coste moderado, pero la cuarta energía
  de ionización, que alcanza el núcleo de tipo helio, es casi siete veces la tercera, un salto que
  marca dónde se agotan los electrones de valencia.

  La CIAAW da el peso atómico estándar del boro como el intervalo de 10.806 a 10.821, con 10.81
  como valor abreviado, porque las proporciones de sus isótopos varían entre los materiales
  normales. Advierte también de que el boro comercial puede tener la composición isotópica alterada,
  lo que puede desplazar su peso atómico muy fuera del intervalo tabulado.

  El boro es un sólido a temperatura ambiente. Al bar, la presión estándar de las tablas NIST-JANAF,
  se funde a $2350.000\,\mathrm{K}$, y el líquido hierve a una temperatura unas 1.76 veces mayor.
