description:
  en: >-
    Helium, symbol He, is the chemical element with atomic number 2, the second and last element of
    period 1 and the first of the noble gases. Its two electrons fill the 1s subshell, giving the
    ground-state electron configuration $1s^{2}$, so by its electrons it belongs to the s-block;
    periodic tables nonetheless place it in group 18, at the head of the noble gases, whose outer
    shells are likewise complete.

    A full shell holds on to its electrons. The first ionization energy of helium is about
    $24.6\,\mathrm{eV}$, close to twice that of hydrogen, and removing the second electron, which
    leaves the bare nucleus, costs more than twice the first. NIST gives that second value from
    theory rather than from measurement, as it does for each one-electron ion from helium to neon.

    CIAAW lists the standard atomic weight of helium as one value, 4.002602, with an uncertainty
    of 0.000002, and 4.0026 as its abridged value. It adds two cautions: some geological and
    biological materials hold helium whose isotopic make-up lies outside the normal range, and the
    spread found in normal terrestrial material limits how precisely the value can be stated.

    At room temperature and atmospheric pressure helium is a gas of single atoms, its reference
    state in the NIST-JANAF tables. Cooling alone turns it liquid only close to absolute zero: the
    reference equation of state that NIST adopts puts its normal boiling point at
    $4.2238\,\mathrm{K}$, lower even than that of hydrogen.
