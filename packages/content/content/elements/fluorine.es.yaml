# yaml-language-server: $schema=../../dist/schemas/elements.locale.schema.json
name: 'Flúor'
description: >-
  El flúor, de símbolo F y número atómico 9, es el primero de los halógenos del grupo 17 y un
  elemento del bloque p en el periodo 2. Su configuración electrónica del estado
  fundamental es $[\mathrm{He}]\,2s^{2}\,2p^{5}$: siete electrones de valencia, a un solo electrón
  de la segunda capa llena del neón, dejan exactamente un orbital 2p con un electrón desapareado.
  Los halógenos comparten estos siete electrones de valencia, y por eso se comportan de forma
  parecida.

  Su primera energía de ionización, de unos $17.42\,\mathrm{eV}$, es mayor que la del oxígeno y
  retoma el ascenso a lo largo del periodo. El NIST da las nueve energías de ionización del flúor:
  la tercera, la cuarta y la quinta proceden de un procedimiento semiempírico y las dos últimas del
  cálculo. Los valores crecen mientras los electrones abandonan la segunda capa, y la octava, la
  primera que alcanza el núcleo de tipo helio, es más de cinco veces la séptima.

  El flúor es uno de los elementos cuyo peso atómico estándar fija un único isótopo estable. Por
  eso la CIAAW lo da como un solo valor muy preciso, 18.998403162 con una incertidumbre de
  0.000000005, junto al valor abreviado 18.998.

  A temperatura ambiente y presión atmosférica el flúor es un gas de moléculas de F₂, su estado de
  referencia en las tablas NIST-JANAF. La ecuación de estado de referencia que el NIST adopta para
  el flúor sitúa su punto de ebullición normal en $85.0368\,\mathrm{K}$, entre los del nitrógeno y
  el oxígeno.
