description:
  en: >-
    Carbon, symbol C, is the chemical element with atomic number 6, the head of group 14 and the
    second element of the p-block in period 2. Its ground-state electron configuration is
    $[\mathrm{He}]\,2s^{2}\,2p^{2}$, with four valence electrons in the second shell, halfway to the
    full shell of neon.

    The two 2p electrons follow Hund's rule: among orbitals of equal energy, the lowest-energy
    arrangement keeps as many electrons unpaired as possible, so they occupy two different 2p
    orbitals with the same spin, and the ground-state carbon atom has two unpaired electrons.
    Carbon's first ionization energy, about $11.26\,\mathrm{eV}$, continues the rise across the
    period from boron. Its four valence electrons can be removed one after another at a steadily
    increasing cost, but the fifth ionization energy, which breaks into the helium-like core, is
    about six times the fourth; NIST gives the last two values from calculation.

    The isotopic composition of carbon varies among natural materials, so CIAAW states its standard
    atomic weight as the interval from 12.0096 to 12.0116 and gives 12.011 as the abridged value
    for ordinary use. Unlike several of its neighbours in period 2, carbon carries no CIAAW warning
    that commercial material may be isotopically modified.

    Carbon is a solid at room temperature and normal pressure: the NIST Chemistry WebBook tabulates
    its standard entropy for the solid at the standard pressure, the bar, and lists graphite and diamond
    among the forms of the element.
