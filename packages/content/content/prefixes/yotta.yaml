description:
  en: >-
    Yotta is the SI prefix for a factor of $10^{24}$, a septillion in English short-scale naming.
    Its symbol is the capital letter $\mathrm{Y}$, as in the yottagram and the yottabyte.

    The 19th General Conference on Weights and Measures (CGPM) added yotta in 1991 through its
    Resolution 4, together with zetta, zepto and yocto. A y stands in front so that the symbol is not
    an o, which could be mistaken for the digit zero, and the name echoes octo, eight: the factor is
    the eighth power of a thousand.

    Yotta was the largest SI prefix for three decades. In 2022 the 27th CGPM added ronna and quetta
    above it, noting that data science would soon need to state amounts of digital information above
    $10^{24}$. The capital Y must not be confused with the lowercase y of yocto.
