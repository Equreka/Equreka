name:
  en: 'Centi'
symbol:
  tex: 'c'
value: '1e-2'
categories:
  - 'universal'
description:
  en: >-
    Centi (symbol $c$) is a unit prefix in the metric system denoting a factor of one hundredth.
    Proposed in 1793, and adopted in 1795, the prefix comes from the Latin centum, meaning "hundred"
    (cf. century, cent, percent, centennial). Since 1960, the prefix is part of the International
    System of Units (SI).
