description:
  en: >-
    Centi is the SI prefix for a factor of $10^{-2}$, one hundredth. Its symbol is the lowercase
    letter $\mathrm{c}$, as in the centimetre and the centilitre.

    Centi was among the prefixes adopted with the decimal metric system in 1795. The name is Latin
    in origin, like those of deci and milli. The centimetre later became one of the three base units
    of the CGS system, introduced in 1874, and the gal, used in geodesy and geophysics for the
    acceleration due to gravity, equals one centimetre per second squared.

    An exponent applies to the whole prefixed unit, so $1\,\mathrm{cm^{3}}$ is $10^{-6}$ cubic
    metre, not a hundredth of one. Outside units of measurement the same element can mean a hundred
    rather than a hundredth, as in centipede.
