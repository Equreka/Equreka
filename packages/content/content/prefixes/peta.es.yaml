# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Peta'
description: >-
  Peta es el prefijo SI que indica un factor de $10^{15}$, mil billones en español y quadrillion en
  inglés. Su símbolo es la letra mayúscula $\mathrm{P}$, como en el petajulio, el petavatio y el
  petabyte.

  La 15.ª Conferencia General de Pesas y Medidas (CGPM) añadió el peta, junto con el exa, en 1975
  mediante su Resolución 10. El nombre se formó a partir de penta, el prefijo griego de cinco,
  porque el factor es la quinta potencia de mil; se suprimió una letra por analogía con tera y
  tetra.

  La P mayúscula no debe confundirse con la p minúscula de pico, un factor $10^{27}$ menor. En
  informática el múltiplo binario $2^{50}$ tiene su propio prefijo, pebi (Pi), de modo que un
  petabyte y un pebibyte son cantidades distintas.
