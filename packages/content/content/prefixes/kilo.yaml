description:
  en: >-
    Kilo is the SI prefix for a factor of $10^{3}$, one thousand. Its symbol is the lowercase letter
    $\mathrm{k}$, one of only three multiple prefixes written in lower case, and it forms everyday
    units such as the kilometre, the kilowatt and the kilojoule.

    Kilo was among the prefixes adopted with the decimal metric system in 1795. The name reached
    other languages through French, from the Greek word for a thousand.

    Among coherent SI units, only the kilogram carries a prefix in its own name, so multiples of
    mass attach prefixes to the gram instead. A capital K is the kelvin, never the prefix. A kilobit
    is 1000 bits; the binary multiple of 1024, still called kilo in informal computing usage, has
    its own prefix, kibi (Ki).
