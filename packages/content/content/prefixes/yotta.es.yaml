name: 'Yotta'
description: >-
  Yotta es el prefijo SI que indica un factor de $10^{24}$, un cuatrillón en la escala larga del
  español y septillion en inglés. Su símbolo es la letra mayúscula $\mathrm{Y}$, como en el
  yottagramo y el yottabyte.

  La 19.ª Conferencia General de Pesas y Medidas (CGPM) añadió el yotta en 1991 mediante su
  Resolución 4, junto con zetta, zepto y yocto. Delante va una y para que el símbolo no sea una o,
  que podría confundirse con la cifra cero, y el nombre evoca octo, ocho: el factor es la octava
  potencia de mil.

  El yotta fue el mayor prefijo SI durante tres décadas. En 2022 la 27.ª CGPM añadió por encima ronna
  y quetta, al prever que la ciencia de datos pronto necesitaría indicar cantidades de información
  digital por encima de $10^{24}$. La Y mayúscula no debe confundirse con la y minúscula de yocto.
