# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Zetta'
description: >-
  Zetta es el prefijo SI que indica un factor de $10^{21}$, mil trillones en la escala larga del
  español y sextillion en inglés. Su símbolo es la letra mayúscula $\mathrm{Z}$, como en el
  zettajulio y el zettabyte.

  La 19.ª Conferencia General de Pesas y Medidas (CGPM) añadió el zetta en 1991 mediante su
  Resolución 4, junto con zepto, yotta y yocto. Su letra de símbolo es z y no s, para no usar dos
  veces la s como símbolo, y el nombre se basa en septo, que alude al siete: el factor es la séptima
  potencia de mil.

  La Z mayúscula no debe confundirse con la z minúscula de zepto, un factor $10^{42}$ menor. El
  múltiplo binario $2^{70}$ tiene su propio prefijo, zebi (Zi).
