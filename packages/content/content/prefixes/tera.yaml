description:
  en: >-
    Tera is the SI prefix for a factor of $10^{12}$, called a trillion in English and un billón in
    Spanish. Its symbol is the capital letter $\mathrm{T}$, as in the terawatt, the terahertz and
    the terabyte.

    Tera was the largest prefix in the list that the 11th General Conference on Weights and Measures
    (CGPM) adopted in 1960, and it remained the top of the scale until peta and exa arrived in 1975.
    The name comes from the Greek word for a monster or marvel; its likeness to tetra, the Greek
    prefix for four, later served as the model for the names of peta and exa.

    The binary multiple $2^{40}$ has the separate prefix tebi, symbol Ti. A lone T is never the
    prefix, because prefix symbols cannot stand alone: it is the symbol of the tesla.
