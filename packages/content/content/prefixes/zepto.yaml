name:
  en: 'Zepto'
symbol:
  tex: 'z'
value: '1e-21'
categories:
  - 'universal'
description:
  en: >-
    Zepto (symbol $z$) is a unit prefix in the metric system denoting a factor of $10^{−21}$ or
    $0.000000000000000000001$. Adopted into the International System of Units (SI) in 1991, it is
    derived from the Latin septem, seven, since it is equal to $1000^{−7}$.
