description:
  en: >-
    Zepto is the SI prefix for a factor of $10^{-21}$, a sextillionth in English short-scale naming.
    Its symbol is the lowercase letter $\mathrm{z}$, as in the zeptosecond and the zeptomole.

    The 19th General Conference on Weights and Measures (CGPM) added zepto in 1991 through its
    Resolution 4, together with zetta, yotta and yocto. Its symbol letter is z rather than s, so that
    s is not used twice as a symbol, and its name is built on septo, a hint at seven: the factor is
    the seventh negative power of a thousand.

    The lowercase z must not be confused with the capital Z of zetta, a factor of $10^{42}$ larger.
    Like every SI prefix it is used alone: a factor of $10^{-21}$ is never written by joining two
    prefixes such as nano and pico.
