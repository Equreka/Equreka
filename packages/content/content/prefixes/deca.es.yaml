name: 'Deca'
description: >-
  Deca es el prefijo SI que indica un factor de $10^{1}$, es decir, diez. Su símbolo, $\mathrm{da}$,
  es el único símbolo de prefijo SI de dos letras, y es uno de los tres prefijos de múltiplos que se
  escriben en minúscula. El uso estadounidense, incluido el del NIST, escribe el nombre deka.

  El deca figuró entre los prefijos adoptados con el sistema métrico decimal en 1795. El nombre
  procede de la palabra griega que significa diez.

  El prefijo se usa poco en ciencia. Sobrevive sobre todo en el decalitro y el decámetro, y en el
  área, unidad de superficie agraria igual a un decámetro cuadrado. El símbolo de dos letras evita
  la confusión con deci: da significa diez, y d, una décima.
