# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Yocto'
description: >-
  Yocto es el prefijo SI que indica un factor de $10^{-24}$, una cuatrillonésima parte en la escala
  larga del español y septillionth en inglés. Su símbolo es la letra minúscula $\mathrm{y}$, como en el yoctogramo y el yoctosegundo.

  La 19.ª Conferencia General de Pesas y Medidas (CGPM) añadió el yocto en 1991 mediante su
  Resolución 4, junto con zetta, zepto y yotta. Delante va una y para que el símbolo no sea una o,
  fácil de leer como la cifra cero, y el nombre evoca octo, ocho: el factor es la octava potencia
  negativa de mil.

  El yocto se ajusta a las masas de los átomos: el dalton equivale a unos 1.66 yoctogramos. Fue el
  menor prefijo SI hasta que la 27.ª CGPM añadió por debajo ronto y quecto en 2022. La y minúscula
  no debe confundirse con la Y mayúscula de yotta.
