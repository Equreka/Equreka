# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Tera'
description: >-
  Tera es el prefijo SI que indica un factor de $10^{12}$, un billón en español y trillion en
  inglés. Su símbolo es la letra mayúscula $\mathrm{T}$, como en el teravatio, el terahercio y el
  terabyte.

  El tera fue el mayor prefijo de la lista que la 11.ª Conferencia General de Pesas y Medidas (CGPM)
  adoptó en 1960, y siguió en lo alto de la escala hasta la llegada de peta y exa en 1975. El nombre
  procede de la palabra griega que significa prodigio o monstruo; su parecido con tetra, el prefijo
  griego de cuatro, sirvió después de modelo para los nombres de peta y exa.

  El múltiplo binario $2^{40}$ tiene un prefijo propio, tebi, de símbolo Ti. Una T aislada nunca es
  el prefijo, porque los símbolos de prefijo no pueden ir solos: es el símbolo del tesla.
