name: 'Hecto'
description: >-
  Hecto es el prefijo SI que indica un factor de $10^{2}$, es decir, cien. Su símbolo es la letra
  minúscula $\mathrm{h}$, uno de los tres únicos prefijos de múltiplos que se escriben en minúscula,
  como en el hectolitro y el hectómetro.

  El hecto figuró entre los prefijos adoptados con el sistema métrico decimal en 1795. El nombre
  entró a través del francés, como alteración de la palabra griega que significa cien.

  Su uso más frecuente se esconde en la hectárea, la unidad de superficie agraria igual a un
  hectómetro cuadrado, o diez mil metros cuadrados. Una h aislada nunca es el prefijo, porque los
  símbolos de prefijo no pueden ir solos: es el símbolo de la hora.
