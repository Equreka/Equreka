description:
  en: >-
    Micro is the SI prefix for a factor of $10^{-6}$, one millionth. Its symbol is μ, the Greek
    letter mu, the only SI prefix symbol taken from outside the Latin alphabet. It forms the
    micrometre and the microsecond.

    The prefix was already part of the CGS system introduced by the British Association for the
    Advancement of Science in 1874, whose prefixes ran from micro to mega, and the 11th General
    Conference on Weights and Measures (CGPM) adopted it for the SI in 1960. The name comes from the
    Greek word for small.

    Where μ is unavailable, the Unified Code for Units of Measure writes u, as in ug and um,
    although u alone is the symbol of the unified atomic mass unit. Medicine prefers mcg for the
    microgram, because μg can be misread as mg. Prefixes never stack: a millionth of a kilogram is a
    milligram, not a microkilogram.
