description:
  en: >-
    Giga is the SI prefix for a factor of $10^{9}$. English calls this factor a billion, but in
    Spanish un billón is $10^{12}$, so giga corresponds to mil millones, a thousand million. Its
    symbol is the capital letter $\mathrm{G}$, as in the gigawatt, the gigahertz and the gigaohm.

    The 11th General Conference on Weights and Measures (CGPM) adopted giga in 1960, among the six
    prefixes it added when it created the SI. The name comes from the Greek word for a giant.

    SI prefixes always denote powers of ten, so a gigabit is exactly a thousand million bits. The
    binary multiple $2^{30}$ has the separate prefix gibi, symbol Gi, and a gibibyte is about 7 per
    cent larger than a gigabyte. Informal computing usage, recorded by the RAE, still gives giga the
    binary value.
