name:
  en: 'Giga'
symbol:
  tex: 'G'
value: '1e9'
categories:
  - 'universal'
description:
  en: |-
    Giga (symbol $G$) is a unit prefix in the metric system denoting a factor of a short-scale billion or long-scale milliard ($10^{9}$ or $1000000000$).

    Giga is derived from the Greek word γίγας (gígas), meaning "giant."
