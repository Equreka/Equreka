name:
  en: 'Femto'
symbol:
  tex: 'f'
value: '1e-15'
categories:
  - 'universal'
description:
  en: >-
    Femto (symbol $f$) is a unit prefix in the metric system denoting a factor of $10^{−15}$. It was
    added to the International System of Units (SI) in 1964. It is derived from the Danish word
    femten, meaning "fifteen", which has a vaguely similar spelling to fermi, which was introduced
    earlier to mean a femtometer.
