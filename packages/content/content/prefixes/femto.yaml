description:
  en: >-
    Femto is the SI prefix for a factor of $10^{-15}$, a quadrillionth in English short-scale
    naming. Its symbol is the lowercase letter $\mathrm{f}$, written directly before a unit symbol,
    as in the femtosecond and the femtometre.

    The 12th General Conference on Weights and Measures (CGPM) adopted femto in 1964 through its
    Resolution 8, at the same time as atto, extending the submultiples below pico. The name derives
    from femten, the Danish and Norwegian word for fifteen, matching the exponent of the factor.

    Femtometres suit the size of atomic nuclei, and the barn, a unit for nuclear cross sections,
    equals 100 square femtometres. Femtosecond laser pulses follow fast chemical and optical
    processes. Because the symbols are case-sensitive, f must not be confused with F, the farad: a
    femtofarad is written fF.
