description:
  en: >-
    Deca is the SI prefix for a factor of $10^{1}$, ten. Its symbol, $\mathrm{da}$, is the only SI
    prefix symbol with two letters, and it is one of three multiple prefixes written in lower case.
    American usage, including NIST, spells the name deka.

    Deca was among the prefixes adopted with the decimal metric system in 1795. The name comes from
    the Greek word for ten.

    The prefix is seldom used in science. It survives mainly in the decalitre and the decametre, and
    in the are, a unit of land area equal to one square decametre. The two-letter symbol avoids a
    clash with deci: da means ten, while d means a tenth.
