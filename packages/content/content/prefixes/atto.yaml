description:
  en: >-
    Atto is the SI prefix for a factor of $10^{-18}$, a quintillionth in English short-scale naming.
    Its symbol is the lowercase letter $\mathrm{a}$, as in the attosecond, the attometre and the
    attomole.

    The 12th General Conference on Weights and Measures (CGPM) added atto, together with femto, in
    1964 through its Resolution 8. That decision left the SI with more prefixes for small quantities
    than for large ones until peta and exa followed in 1975. The name comes from the Danish and
    Norwegian word for eighteen.

    Two clashes need care. Astronomers write the arcsecond as $\mathrm{as}$, the same letters as the
    attosecond, so context decides. A lone a is never the prefix, because a prefix
    symbol cannot stand by itself: it denotes the are, a unit of land area equal to one hundredth of
    a hectare, and the IAU also uses it for the year.
