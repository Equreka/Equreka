# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Centi'
description: >-
  Centi es el prefijo SI que indica un factor de $10^{-2}$, una centésima parte. Su símbolo es la
  letra minúscula $\mathrm{c}$, como en el centímetro y el centilitro.

  El centi figuró entre los prefijos adoptados con el sistema métrico decimal en 1795. El nombre es
  de origen latino, como los de deci y mili. El centímetro pasó después a ser una de las tres
  unidades básicas del sistema CGS, introducido en 1874, y el gal, usado en geodesia y geofísica
  para la aceleración de la gravedad, equivale a un centímetro por segundo al cuadrado.

  Un exponente afecta a toda la unidad con prefijo, de modo que $1\,\mathrm{cm^{3}}$ son $10^{-6}$
  metros cúbicos, no una centésima de metro cúbico. Fuera de las unidades de medida, el mismo
  elemento puede significar cien y no centésima, como en centímano.
