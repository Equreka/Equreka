# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Nano'
description: >-
  Nano es el prefijo SI que indica un factor de $10^{-9}$, una milmillonésima parte. Su símbolo es
  la letra minúscula $\mathrm{n}$, como en el nanómetro, el nanosegundo y el nanogramo.

  La 11.ª Conferencia General de Pesas y Medidas (CGPM) adoptó el nano en 1960, entre los seis
  prefijos que añadió al establecer el SI. El nombre procede de las palabras griega y latina que
  designan a un enano.

  El nanómetro se usa a menudo para las longitudes de onda de la luz, que también se expresan en
  ángstroms, cada uno igual a 0.1 nanómetros. El prefijo forma además palabras como nanotecnología,
  donde indica trabajo a la escala de los nanómetros. La n minúscula debe distinguirse de la N
  mayúscula del newton: un nanonewton se escribe nN.
