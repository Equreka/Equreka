# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Zepto'
description: >-
  Zepto es el prefijo SI que indica un factor de $10^{-21}$, una milésima de trillonésima en la
  escala larga del español y sextillionth en inglés. Su símbolo es la letra minúscula $\mathrm{z}$, como en el zeptosegundo y el zeptomol.

  La 19.ª Conferencia General de Pesas y Medidas (CGPM) añadió el zepto en 1991 mediante su
  Resolución 4, junto con zetta, yotta y yocto. Su letra de símbolo es z y no s, para no usar dos
  veces la s como símbolo, y el nombre se basa en septo, que alude al siete: el factor es la séptima
  potencia negativa de mil.

  La z minúscula no debe confundirse con la Z mayúscula de zetta, un factor $10^{42}$ mayor. Como
  todo prefijo SI, se usa solo: un factor de $10^{-21}$ nunca se escribe uniendo dos prefijos como
  nano y pico.
