description:
  en: >-
    Peta is the SI prefix for a factor of $10^{15}$, a quadrillion in English short-scale naming and
    mil billones in Spanish. Its symbol is the capital letter $\mathrm{P}$, as in the petajoule, the
    petawatt and the petabyte.

    The 15th General Conference on Weights and Measures (CGPM) added peta, together with exa, in
    1975 through its Resolution 10. The name was formed from penta, the Greek prefix for five,
    because the factor is the fifth power of a thousand; a letter was dropped by analogy with tera
    and tetra.

    The capital P must not be confused with the lowercase p of pico, a factor of $10^{27}$ smaller.
    In computing the binary multiple $2^{50}$ has its own prefix, pebi (Pi), so a petabyte and a
    pebibyte are different amounts.
