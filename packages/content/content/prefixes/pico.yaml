description:
  en: |-
    Pico (symbol $p$) is a unit prefix in the metric system denoting a factor of one trillionth in the short scale and one billionth in the long scale ($0.000000000001$); that is, $10^{−12}$.

    Derived from the Spanish word pico, (peak, beak, little bit), pico is one of the original twelve prefixes defined in 1960 when the International System of Units (SI) was established.
