description:
  en: >-
    Pico is the SI prefix for a factor of $10^{-12}$, a trillionth in English short-scale naming.
    Its symbol is the lowercase letter $\mathrm{p}$, as in the picometre, the picosecond and the
    picofarad.

    Pico was one of the six prefixes that the 11th General Conference on Weights and Measures (CGPM)
    added in 1960 when it created the SI, and it was the smallest of them. Unusually, its name comes
    from Spanish, where pico means a small amount left over beyond a round figure.

    Picometres suit the sizes of atoms and the lengths of chemical bonds, which are also quoted in
    ångströms of 100 picometres each, and picofarads suit small capacitors. The lowercase p must not
    be confused with the capital P of peta: a picosecond and a petasecond differ by a factor of
    $10^{27}$.
