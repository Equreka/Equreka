description:
  en: >-
    Exa is the SI prefix for a factor of $10^{18}$, a quintillion in English short-scale naming and
    un trillón in Spanish. Its symbol is the capital letter $\mathrm{E}$, as in the exajoule, the
    exametre and the exabyte.

    The 15th General Conference on Weights and Measures (CGPM) added exa, together with peta, in
    1975 through its Resolution 10. The name is an altered form of hexa, the Greek prefix for six,
    since the factor is the sixth power of a thousand; the initial h was dropped following the
    pattern of tera and tetra.

    In computing the binary multiple $2^{60}$ has its own prefix, exbi (Ei), and in SI usage an
    exabyte is always a decimal amount. The symbol is always the capital E; the lowercase e names no
    SI prefix.
