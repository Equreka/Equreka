# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Mili'
description: >-
  Mili es el prefijo SI que indica un factor de $10^{-3}$, una milésima parte. Su símbolo es la
  letra minúscula $\mathrm{m}$, que se escribe justo antes del símbolo de la unidad, como en el
  milímetro, el mililitro, el miligramo y el milisegundo. La forma internacional del nombre es
  milli.

  El mili figuró entre los prefijos adoptados con el sistema métrico decimal en 1795. El nombre
  procede de mille, la palabra latina que significa mil.

  La misma letra m es el símbolo del metro, por lo que un producto de unidades necesita un espacio o
  un punto centrado: mN es el milinewton, mientras que m N es el metro por el newton. Tampoco debe
  confundirse mili con mega, cuyo símbolo es la M mayúscula.
