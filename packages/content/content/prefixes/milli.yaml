description:
  en: >-
    Milli is the SI prefix for a factor of $10^{-3}$, one thousandth. Its symbol is the lowercase
    letter $\mathrm{m}$, written directly before a unit symbol, as in the millimetre, the
    millilitre, the milligram and the millisecond. Spanish spells the prefix mili.

    Milli was among the prefixes adopted with the decimal metric system in 1795. The name comes from
    mille, the Latin word for a thousand.

    The same letter m is the symbol of the metre, so a product of units needs a space or a centred
    dot: mN is the millinewton, while m N is the metre times the newton. Milli must also be kept
    apart from mega, whose symbol is the capital M.
