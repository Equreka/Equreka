# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Exa'
description: >-
  Exa es el prefijo SI que indica un factor de $10^{18}$, un trillón en español y quintillion en
  inglés. Su símbolo es la letra mayúscula $\mathrm{E}$, como en el exajulio, el exámetro y el
  exabyte.

  La 15.ª Conferencia General de Pesas y Medidas (CGPM) añadió el exa, junto con el peta, en 1975
  mediante su Resolución 10. El nombre es una alteración de hexa, el prefijo griego de seis, ya que
  el factor es la sexta potencia de mil; la h inicial se suprimió según el modelo de tera y tetra.

  En informática el múltiplo binario $2^{60}$ tiene su propio prefijo, exbi (Ei), y en el uso del SI
  un exabyte es siempre una cantidad decimal. El símbolo es siempre la E mayúscula; la e minúscula
  no designa ningún prefijo SI.
