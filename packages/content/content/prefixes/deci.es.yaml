# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Deci'
description: >-
  Deci es el prefijo SI que indica un factor de $10^{-1}$, una décima parte. Su símbolo es la letra
  minúscula $\mathrm{d}$, como en el decímetro, el decilitro y el decibelio.

  El deci figuró entre los prefijos adoptados con el sistema métrico decimal en 1795. En español el
  elemento es un acortamiento de décimo, de origen latino.

  Su uso más conocido es el decibelio, la décima parte del belio, unidad de razones logarítmicas
  como los niveles sonoros. El litro equivale exactamente a un decímetro cúbico, un vínculo que une
  los volúmenes cotidianos con el metro. Una d aislada nunca es el prefijo, porque los símbolos de
  prefijo no pueden ir solos: es el símbolo del día. Tampoco debe confundirse deci con deca, cuyo
  símbolo es da.
