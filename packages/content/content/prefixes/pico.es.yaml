# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Pico'
description: >-
  Pico es el prefijo SI que indica un factor de $10^{-12}$, una billonésima parte. Su símbolo es la
  letra minúscula $\mathrm{p}$, como en el picómetro, el picosegundo y el picofaradio.

  El pico fue uno de los seis prefijos que la 11.ª Conferencia General de Pesas y Medidas (CGPM)
  añadió en 1960 al crear el SI, y el menor de ellos. Curiosamente, su nombre procede del español,
  donde pico designa una pequeña cantidad que excede de una cifra redonda.

  El picómetro se ajusta al tamaño de los átomos y a la longitud de los enlaces químicos, que
  también se expresan en ángstroms de 100 picómetros cada uno, y el picofaradio a los condensadores
  pequeños. La p minúscula no debe confundirse con la P mayúscula de peta: un picosegundo y un
  petasegundo difieren en un factor de $10^{27}$.
