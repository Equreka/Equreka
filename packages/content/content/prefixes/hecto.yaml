description:
  en: >-
    Hecto is the SI prefix for a factor of $10^{2}$, one hundred. Its symbol is the lowercase letter
    $\mathrm{h}$, one of only three multiple prefixes written in lower case, as in the hectolitre
    and the hectometre.

    Hecto was among the prefixes adopted with the decimal metric system in 1795. The name came into
    use through French, as an altered form of the Greek word for a hundred.

    Its most common use is hidden in the hectare, the unit of land area equal to one square
    hectometre, or ten thousand square metres. A lone h is never the prefix, because prefix symbols
    cannot stand by themselves: it is the symbol of the hour.
