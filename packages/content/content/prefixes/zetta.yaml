description:
  en: |-
    Zetta (symbol $Z$) is a decimal unit prefix in the metric system denoting a factor of $10^{21}$ or $1000000000000000000000$. The prefix was added as an SI prefix to the International System of Units (SI) in 1991.

    Zetta is derived from the Latin numeral septem "seven", and represents $1000^{7}$.
