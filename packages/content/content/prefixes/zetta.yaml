description:
  en: >-
    Zetta is the SI prefix for a factor of $10^{21}$, a sextillion in English short-scale naming.
    Its symbol is the capital letter $\mathrm{Z}$, as in the zettajoule and the zettabyte.

    The 19th General Conference on Weights and Measures (CGPM) added zetta in 1991 through its
    Resolution 4, together with zepto, yotta and yocto. Its symbol letter is z rather than s, so that
    s is not used twice as a symbol, and its name is built on septo, a hint at seven: the factor is
    the seventh power of a thousand.

    The capital Z must not be confused with the lowercase z of zepto, a factor of $10^{42}$ smaller.
    The binary multiple $2^{70}$ has its own prefix, zebi (Zi).
