description:
  en: >-
    Deci is the SI prefix for a factor of $10^{-1}$, one tenth. Its symbol is the lowercase letter
    $\mathrm{d}$, as in the decimetre, the decilitre and the decibel.

    Deci was among the prefixes adopted with the decimal metric system in 1795. The name comes from
    the Latin word for a tenth.

    Its best-known use is the decibel, one tenth of the bel, a unit for logarithmic ratios such as
    sound levels. The litre equals exactly one cubic decimetre, a link that ties everyday volumes to
    the metre. A lone d is never the prefix, because prefix symbols cannot stand alone: it is the
    symbol of the day. Deci must also be kept apart from deca, whose symbol is da.
