description:
  en: >-
    Deci (symbol $d$) is a unit prefix in the metric system denoting a factor of one tenth. Proposed
    in 1793, and adopted in 1795, the prefix comes from the Latin decimus, meaning "tenth". Since
    1960, the prefix is part of the International System of Units (SI).
