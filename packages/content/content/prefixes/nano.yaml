description:
  en: >-
    Nano is the SI prefix for a factor of $10^{-9}$, a billionth in English short-scale naming. Its
    symbol is the lowercase letter $\mathrm{n}$, as in the nanometre, the nanosecond and the
    nanogram.

    The 11th General Conference on Weights and Measures (CGPM) adopted nano in 1960, among the six
    prefixes it added when it established the SI. The name comes from the Greek and Latin words for
    a dwarf.

    The nanometre is commonly used for wavelengths of light, which are also quoted in ångströms,
    each equal to 0.1 nanometre. The prefix also forms words such as nanotechnology, where it marks
    work at the scale of nanometres. The lowercase n must stay distinct from the capital N of the
    newton: a nanonewton is written nN.
