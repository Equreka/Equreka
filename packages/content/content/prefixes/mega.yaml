description:
  en: >-
    Mega is the SI prefix for a factor of $10^{6}$, one million. Its symbol is the capital letter
    $\mathrm{M}$, as in the megawatt, the megahertz and the megapascal, and the tonne equals exactly
    one megagram.

    Mega was in scientific use before the SI: the CGS system introduced by the British Association
    for the Advancement of Science in 1874 used prefixes from micro to mega. The 11th General
    Conference on Weights and Measures (CGPM) adopted it for the SI in 1960. The name comes from the
    Greek word for large.

    Case decides the meaning: a megawatt is a million watts, whereas a milliwatt, with a lowercase
    m, is a thousandth of a watt. In computing the binary multiple $2^{20}$ has its own prefix, mebi
    (Mi), and an SI megabyte is exactly a million bytes, although informal usage still applies mega
    to the binary value.
