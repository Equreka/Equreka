name:
  en: 'Mega'
symbol:
  tex: 'M'
value: '1e6'
categories:
  - 'universal'
description:
  en: >-
    Mega is a unit prefix in metric systems of units denoting a factor of one million ($10^{6}$ or
    1000000). It has the unit symbol M. It was confirmed for use in the International System of
    Units (SI) in 1960. Mega comes from Ancient Greek: μέγας, romanized: mégas, lit. "great".
