name: 'Atto'
description: >-
  Atto es el prefijo SI que indica un factor de $10^{-18}$, una trillonésima parte. Su símbolo es la
  letra minúscula $\mathrm{a}$, como en el attosegundo, el attómetro y el attomol.

  La 12.ª Conferencia General de Pesas y Medidas (CGPM) añadió el atto, junto con el femto, en 1964
  mediante su Resolución 8. Esa decisión dejó al SI con más prefijos para cantidades pequeñas que
  para grandes hasta que llegaron peta y exa en 1975. El nombre procede de la palabra danesa y
  noruega que significa dieciocho.

  Dos coincidencias exigen cuidado. En astronomía el segundo de arco se escribe $\mathrm{as}$, con
  las mismas letras que el attosegundo, de modo que decide el contexto. Una a aislada
  nunca es el prefijo, porque un símbolo de prefijo no puede ir solo: designa el área, unidad de
  superficie agraria igual a la centésima parte de una hectárea, y la UAI la usa también para el año.
