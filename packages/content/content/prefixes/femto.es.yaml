# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Femto'
description: >-
  Femto es el prefijo SI que indica un factor de $10^{-15}$, una milbillonésima parte. Su símbolo es
  la letra minúscula $\mathrm{f}$, que se escribe justo antes del símbolo de la unidad, como en el
  femtosegundo y el femtómetro.

  La 12.ª Conferencia General de Pesas y Medidas (CGPM) adoptó el femto en 1964 mediante su
  Resolución 8, a la vez que el atto, y así amplió los submúltiplos por debajo del pico. El nombre
  deriva de femten, palabra danesa y noruega que significa quince, igual que el exponente del
  factor.

  El femtómetro se ajusta al tamaño de los núcleos atómicos, y el barn, unidad de sección eficaz
  nuclear, equivale a 100 femtómetros cuadrados. Los pulsos láser de femtosegundos siguen procesos
  químicos y ópticos rápidos. Como los símbolos distinguen mayúsculas, f no debe confundirse con F,
  el faradio: un femtofaradio se escribe fF.
