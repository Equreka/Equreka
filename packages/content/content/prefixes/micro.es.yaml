# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Micro'
description: >-
  Micro es el prefijo SI que indica un factor de $10^{-6}$, una millonésima parte. Su símbolo es μ,
  la letra griega mu, el único símbolo de prefijo SI que no procede del alfabeto latino. Forma el
  micrómetro y el microsegundo.

  El prefijo ya formaba parte del sistema CGS que la Asociación Británica para el Avance de la
  Ciencia introdujo en 1874, cuyos prefijos iban de micro a mega, y la 11.ª Conferencia General de
  Pesas y Medidas (CGPM) lo adoptó para el SI en 1960. El nombre procede de la palabra griega que
  significa pequeño.

  Cuando no se dispone de μ, el Unified Code for Units of Measure (UCUM) escribe u, como en ug y um,
  aunque u sola es el símbolo de la unidad de masa atómica unificada. La medicina prefiere mcg para
  el microgramo, porque μg puede leerse como mg. Los prefijos nunca se combinan: una millonésima de
  kilogramo es un miligramo, no un microkilogramo.
