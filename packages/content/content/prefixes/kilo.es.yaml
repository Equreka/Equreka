# yaml-language-server: $schema=../../dist/schemas/prefixes.locale.schema.json
name: 'Kilo'
description: >-
  Kilo es el prefijo SI que indica un factor de $10^{3}$, es decir, mil. Su símbolo es la letra
  minúscula $\mathrm{k}$, uno de los tres únicos prefijos de múltiplos que se escriben en minúscula,
  y forma unidades cotidianas como el kilómetro, el kilovatio y el kilojulio.

  El kilo figuró entre los prefijos adoptados con el sistema métrico decimal en 1795. El nombre
  llegó a otras lenguas a través del francés, desde la palabra griega que significa mil.

  Entre las unidades SI coherentes, solo el kilogramo lleva un prefijo en su propio nombre, de modo
  que los múltiplos de masa añaden los prefijos al gramo. Una K mayúscula es el kelvin, nunca el
  prefijo. Un kilobit son 1000 bits; el múltiplo binario de 1024, que el uso informal en informática
  aún llama kilo, tiene su propio prefijo, kibi (Ki).
