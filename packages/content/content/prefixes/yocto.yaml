description:
  en: >-
    Yocto is the SI prefix for a factor of $10^{-24}$, a septillionth in English short-scale naming.
    Its symbol is the lowercase letter $\mathrm{y}$, as in the yoctogram and the yoctosecond.

    The 19th General Conference on Weights and Measures (CGPM) added yocto in 1991 through its
    Resolution 4, together with zetta, zepto and yotta. A y stands in front so that the symbol is not
    an o, easily read as the digit zero, and the name echoes octo, eight: the factor is the eighth
    negative power of a thousand.

    Yocto suits the masses of atoms: the dalton is about 1.66 yoctograms. It was the smallest SI
    prefix until the 27th CGPM added ronto and quecto below it in 2022. The lowercase y must not be
    confused with the capital Y of yotta.
