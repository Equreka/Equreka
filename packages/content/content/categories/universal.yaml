name:
  en: 'Universal'
order: 0
description:
  en: >-
    Universal is the category for the units, prefixes and constants that every science shares rather
    than any one discipline. It holds the International System of Units with its base and derived
    units, the decimal prefixes that scale them and the defining constants that fix their values,
    together with the units of time and the dimensionless quantities that measurement uses in every
    field.

    Two branches organize it. The International System of Units covers the SI itself: seven defining
    constants, among them the speed of light in vacuum, the Planck constant and the Avogadro
    constant, whose exact values define every unit; seven base units, the second, the metre, the
    kilogram, the ampere, the kelvin, the mole and the candela; the coherent derived units built
    from them; and the SI prefixes such as kilo, milli and micro. Measurement and metrology covers
    how a value is stated as a number times a unit, the minute, hour and day accepted for use with
    the SI, calendar units such as the week, month and year, and quantities expressed with the unit
    one.

    The other categories rely on it. Physics and chemistry express every magnitude in SI units and
    use its defining constants in their laws, and mathematics supplies the arithmetic of prefixes
    and conversion factors. A unit that serves several disciplines, such as the second, keeps its
    definition here, while each discipline files the units and constants that it teaches.
