name: 'Química'
description: >-
  La química es la ciencia natural de las sustancias: de qué están hechas, cómo se disponen y
  enlazan sus átomos, qué propiedades se derivan de esa disposición y cómo se transforman unas en
  otras al reaccionar. Trabaja en dos niveles, la muestra que se mide en el
  laboratorio y los átomos, moléculas e iones que la forman, y los conecta mediante fórmulas
  químicas y ecuaciones ajustadas.

  Sus ramas siguen las preguntas de la química. La cantidad de sustancia cuenta entidades en moles
  y convierte masa en número de partículas mediante la masa molar y la constante de Avogadro. La
  estructura atómica describe protones, neutrones y electrones y los niveles de energía de los
  electrones. Los gases relacionan presión, volumen, temperatura y cantidad mediante la ley de los
  gases ideales. Disoluciones y concentración expresa cuánto soluto contiene una disolución, por
  concentración molar, molalidad o porcentaje en masa. La termoquímica sigue el calor de las
  reacciones mediante la entalpía y la energía de Gibbs. Ácidos y bases trata la transferencia de
  iones hidrógeno y la escala de pH, y la electroquímica relaciona las reacciones redox con el
  potencial de la celda mediante la constante de Faraday.

  La química toma de la física la estructura atómica, la energía y la termodinámica, y aporta
  métodos a la biología, la geología, la medicina y la ciencia de materiales. Las matemáticas
  aportan proporciones, logaritmos y el álgebra de todo cálculo estequiométrico y de equilibrio, y
  la categoría universal, las unidades y constantes del SI, entre ellas el mol, que expresan los
  resultados químicos.
