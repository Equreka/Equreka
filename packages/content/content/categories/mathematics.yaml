name:
  en: 'Mathematics'
order: 1
externalIds:
  wikidata: 'Q395'
description:
  en: >-
    Mathematics (from Greek: μάθημα, máthēma, 'knowledge, study, learning') includes the study of
    such topics as quantity (number theory), structure (algebra), space (geometry), and change
    (analysis). It has no generally accepted definition.
