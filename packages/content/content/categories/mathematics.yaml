description:
  en: >-
    Mathematics is the study of number, quantity, shape and pattern through exact definitions and
    logical proof. It works with idealized objects such as numbers, functions, equations, figures
    and sets, and draws conclusions that hold for every case meeting the stated premises, not only
    for the cases that were measured. At school it spans arithmetic, algebra, geometry,
    trigonometry, statistics and probability.

    Arithmetic computes with numbers, percentages, ratios and interest. Algebra replaces numbers
    with symbols to state and solve equations, and studies exponential growth, logarithms and
    sequences. Geometry measures lengths, angles, areas and volumes and, through coordinates,
    describes figures with equations; trigonometry relates the angles of a triangle to the lengths
    of its sides. Constants such as pi, Euler's number and the golden ratio recur across these
    branches.

    Mathematics supplies the language of the other categories. Most laws of physics are written as
    equations between quantities, chemical calculations of amounts and concentrations rest on
    proportion, and the units and prefixes of measurement are related by exact numerical
    factors. Unlike those sciences, mathematics does not test its results against experiment: a
    theorem is established by proof, and it remains true whether or not any physical system obeys
    it.
