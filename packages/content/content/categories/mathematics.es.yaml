name: 'Matemáticas'
description: >-
  Las matemáticas estudian el número, la cantidad, la forma y los patrones mediante definiciones
  exactas y demostraciones lógicas. Trabajan con objetos idealizados como números, funciones,
  ecuaciones, figuras y conjuntos, y obtienen conclusiones válidas para todo caso que cumpla las
  premisas enunciadas, no solo para los casos medidos. En la escuela abarcan la aritmética, el
  álgebra, la geometría, la trigonometría, la estadística y la probabilidad.

  La aritmética calcula con números, porcentajes, razones e intereses. El álgebra sustituye los
  números por símbolos para plantear y resolver ecuaciones, y estudia el crecimiento exponencial,
  los logaritmos y las sucesiones. La geometría mide longitudes, ángulos, áreas y volúmenes y,
  mediante coordenadas, describe las figuras con ecuaciones; la trigonometría relaciona los ángulos
  de un triángulo con las longitudes de sus lados. Constantes como pi, el número de Euler y la razón
  áurea reaparecen en todas estas ramas.

  Las matemáticas aportan el lenguaje de las demás categorías. La mayoría de las leyes de la física
  se escriben como ecuaciones entre magnitudes, los cálculos químicos de cantidades y
  concentraciones se apoyan en la proporcionalidad, y las unidades y los prefijos de medida se
  relacionan mediante factores numéricos exactos. A diferencia de esas ciencias, las matemáticas no
  contrastan sus resultados con el experimento: un teorema se establece por demostración y sigue
  siendo cierto tanto si algún sistema físico lo cumple como si no.
