description:
  en: >-
    Chemistry is the natural science of substances: what they are made of, how their atoms are
    arranged and bonded, which properties follow from that arrangement, and how one substance turns
    into another in a chemical reaction. It works on two levels at once, the bulk sample weighed and
    measured in a laboratory and the atoms, molecules and ions that compose it, and it connects them
    through chemical formulas and balanced equations.

    Its branches follow the questions chemists ask. Amount of substance counts entities in moles
    and converts mass to particle number through molar mass and the Avogadro constant. Atomic
    structure describes protons, neutrons and electrons and the energy levels electrons occupy.
    Gases relates pressure, volume, temperature and amount through the ideal gas law. Solutions and
    concentration states how much solute a solution holds, by molarity, molality or mass percent.
    Thermochemistry follows the heat of reactions through enthalpy and Gibbs energy. Acids and bases
    treat hydrogen-ion transfer and the pH scale, and electrochemistry relates redox reactions to
    cell potential through the Faraday constant.

    Chemistry draws on physics for atomic structure, energy and thermodynamics, and it supplies
    methods to biology, geology, medicine and materials science. Mathematics provides the
    proportions, logarithms and algebra behind every stoichiometric and equilibrium calculation,
    and the universal category provides the SI units and constants, the mole among them, in which
    chemical results are expressed.
