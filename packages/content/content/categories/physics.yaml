description:
  en: >-
    Physics is the natural science of matter, energy, motion and the forces between bodies, at every
    scale from subatomic particles to galaxies. It seeks a small set of general laws, written as
    equations between measurable quantities, that predict how a system behaves, and it supplies the
    units and constants that the other sciences measure with.

    Its branches follow the kind of phenomenon studied. Mechanics, gravitation and fluid mechanics
    treat motion, force, energy, momentum and pressure; waves and oscillations cover periodic motion,
    frequency and sound; thermodynamics relates heat, work, temperature and entropy; electromagnetism
    deals with electric charge, current, potential difference and resistance; optics and photometry
    treat light and its measurement. Modern physics adds relativity and quantum physics, with the
    Planck constant and the speed of light in vacuum as its signature constants, and nuclear physics
    studies the atomic nucleus and radioactivity.

    Physics shares its quantities with the other categories. Chemistry builds on atomic and molecular
    physics and on the amount of substance; mathematics provides the algebra, geometry and
    trigonometry in which physical laws are written and solved; the universal category gathers the
    SI units, prefixes and defining constants that physics, chemistry and engineering all use.
