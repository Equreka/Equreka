name: 'Universal'
description: >-
  Universal es la categoría de las unidades, los prefijos y las constantes que comparten todas las
  ciencias y que no pertenecen a una sola disciplina. Reúne el Sistema Internacional de Unidades,
  con sus unidades base y derivadas, los prefijos decimales que las escalan y las constantes
  definitorias que fijan sus valores, junto con las unidades de tiempo y las magnitudes
  adimensionales que la medición emplea en todos los campos.

  Dos ramas la organizan. El Sistema Internacional de Unidades abarca el propio SI: siete constantes
  definitorias, entre ellas la constante c, velocidad de la luz en el vacío, la constante de Planck
  y la constante de Avogadro, cuyos valores exactos definen todas las unidades; siete unidades base:
  segundo, metro, kilogramo, amperio, kelvin, mol y candela; las unidades derivadas coherentes que
  se forman con ellas, y los prefijos del SI como kilo, mili y micro. Medición y metrología abarca
  cómo se expresa un valor como un número por una unidad, el minuto, la hora y el día aceptados para
  su uso con el SI, unidades de calendario como la semana, el mes y el año, y las magnitudes que se
  expresan con la unidad uno.

  Las demás categorías dependen de ella. La física y la química expresan sus magnitudes en unidades
  del SI y emplean sus constantes definitorias en sus leyes, y las matemáticas aportan la aritmética
  de los prefijos y de los factores de conversión. Una unidad que sirve a varias disciplinas, como
  el segundo, conserva aquí su definición, mientras que cada disciplina clasifica las unidades y
  constantes que enseña.
