# yaml-language-server: $schema=../../dist/schemas/categories.locale.schema.json
name: 'Física'
description: >-
  La física es la ciencia natural que estudia la materia, la energía, el movimiento y las fuerzas
  entre cuerpos, desde las partículas subatómicas hasta las galaxias. Busca pocas leyes generales,
  escritas como ecuaciones entre magnitudes medibles, que predicen cómo se comporta un sistema, y
  aporta las unidades y constantes con que miden las demás ciencias.

  Sus ramas siguen el tipo de fenómeno. Mecánica, gravitación y mecánica de fluidos tratan
  movimiento, fuerza, energía, cantidad de movimiento y presión; ondas y oscilaciones abarcan el
  movimiento periódico, la frecuencia y el sonido; la termodinámica relaciona calor, trabajo,
  temperatura y entropía; el electromagnetismo trata carga eléctrica, corriente, diferencia de
  potencial y resistencia; óptica y fotometría estudian la luz y su medida. La física moderna añade
  relatividad y física cuántica, cuyas constantes características son la velocidad de la luz y la
  constante de Planck, y la física nuclear estudia el núcleo atómico y la radiactividad.

  La física comparte magnitudes con las demás categorías. La química se apoya en la física atómica
  y molecular y en la cantidad de sustancia; las matemáticas aportan el álgebra, la geometría y la
  trigonometría con que se escriben y resuelven las leyes físicas; la categoría universal reúne las
  unidades del SI, los prefijos y las constantes definitorias comunes a física, química e
  ingeniería.
